# Terms lesson 4.1 introduces. Hebrew spellings follow ThermoLab's canonical glossary (glossary/terms.yml).
- id: pressure
  term: { en: pressure, he: לחץ }
  definition:
    en: The force a fluid exerts per unit area of a surface, normal to it. In a gas, the momentum the molecules hand the surface per unit time and area.
    he: הכוח שזורם מפעיל על יחידת שטח של משטח, בניצב לו. בגז, התנע שהמולקולות מעבירות למשטח ליחידת זמן וליחידת שטח.
  lesson: '4.1'
- id: kinetic-theory
  term: { en: kinetic theory, he: תורה קינטית }
  definition:
    en: The explanation of a gas's macroscopic properties (pressure, temperature, transport) from the motion of its molecules.
    he: ההסבר של התכונות המאקרוסקופיות של גז (לחץ, טמפרטורה, הובלה) מתוך תנועת המולקולות שלו.
  lesson: '4.1'
- id: impulse
  term: { en: impulse, he: מתקף }
  definition:
    en: The change in momentum a force produces over a time interval; a bounce off a wall hands the wall an impulse 2m|v_x|.
    he: שינוי התנע שכוח יוצר במשך פרק זמן; החזרה מדופן מעבירה לדופן מתקף של 2m|v_x|.
  lesson: '4.1'
- id: elastic-collision
  term: { en: elastic collision, he: התנגשות אלסטית }
  definition:
    en: A collision that conserves kinetic energy. Off a rigid wall, only the velocity component normal to the wall reverses.
    he: התנגשות שבה האנרגיה הקינטית נשמרת. בהחזרה מדופן קשיחה רק רכיב המהירות הניצב לדופן מתהפך.
  lesson: '4.1'
- id: equipartition
  term: { en: equipartition theorem, he: משפט חלוקת האנרגיה השווה }
  definition:
    en: In classical thermal equilibrium every quadratic term in the energy carries a mean of k_B T / 2.
    he: בשיווי משקל תרמי קלאסי כל איבר ריבועי באנרגיה נושא בממוצע k_B T / 2.
  lesson: '4.1'
- id: ideal-gas-law
  term: { en: ideal gas law, he: חוק הגזים האידיאליים }
  definition:
    en: PV = N k_B T, the equation of state of a dilute gas of particles that do not interact.
    he: PV = N k_B T, משוואת המצב של גז דליל של חלקיקים שאינם מקיימים אינטראקציה.
  lesson: '4.1'
- id: maxwell-boltzmann
  term: { en: Maxwell-Boltzmann distribution, he: התפלגות מקסוול-בולצמן }
  reject: ['התפלגות מקסוול בולצמן']
  definition:
    en: The distribution of molecular velocities in a classical gas in equilibrium; each velocity component is Gaussian with variance k_B T / m.
    he: התפלגות מהירויות המולקולות בגז קלאסי בשיווי משקל; כל רכיב מהירות גאוסי, עם שונות k_B T / m.
  lesson: '4.1'
- id: microstate
  term: { en: microstate, he: מיקרו-מצב }
  reject: ['מיקרומצב']
  definition:
    en: A complete specification of every particle's position and velocity.
    he: תיאור מלא של המקום והמהירות של כל חלקיק.
  lesson: '4.1'
- id: fluctuation
  term: { en: fluctuation, he: פלוקטואציה }
  reject: ['תנודה סטטיסטית']
  definition:
    en: The deviation of a quantity from its mean; its relative size usually falls as N^(-1/2).
    he: הסטייה של גודל מהממוצע שלו; הגודל היחסי שלה קטן בדרך כלל כמו N^(-1/2).
  lesson: '4.1'
- id: internal-energy
  term: { en: internal energy, he: אנרגיה פנימית }
  definition:
    en: The total energy of a system's particles in its own rest frame; for a monatomic ideal gas, all of it kinetic.
    he: האנרגיה הכוללת של חלקיקי מערכת במערכת המנוחה שלה; בגז אידיאלי חד-אטומי, כולה קינטית.
  lesson: '4.1'
