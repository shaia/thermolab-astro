# Misconceptions lesson 4.1 is built to catch. Ids follow ThermoLab's register (assessment/misconceptions.yml)
# where it has one; MC-heavier-pushes-harder is new: the lesson's prediction targets it, and the register had no entry.
- id: MC-equilibrium-motion-stops
  title:
    en: Equilibrium means the motion has stopped
    he: שיווי משקל פירושו שהתנועה נעצרה
  belief:
    en: A gas in equilibrium, with a steady gauge, has molecules that have come to rest.
    he: בגז בשיווי משקל, כשהמד יציב, המולקולות נעצרו.
  truth:
    en: Equilibrium is steady averages, not stillness. The molecules keep moving and colliding; the pressure is steady because there are so many collisions.
    he: שיווי משקל הוא ממוצעים יציבים, לא דממה. המולקולות ממשיכות לנוע ולהתנגש; הלחץ יציב כי ההתנגשויות רבות כל כך.
  remedy:
    lesson: '4.1'
    anchor: many
    label:
      en: Watch two thousand atoms keep the gauge steady
      he: צפו באלפיים אטומים שמחזיקים את המד יציב

- id: MC-temperature-total-energy
  title:
    en: Temperature measures the total energy
    he: טמפרטורה מודדת את האנרגיה הכוללת
  belief:
    en: More particles, or more internal energy, means a higher temperature.
    he: יותר חלקיקים, או יותר אנרגיה פנימית, פירושם טמפרטורה גבוהה יותר.
  truth:
    en: Temperature fixes the mean energy per particle. The internal energy is the total, N times that; two gases at one temperature can hold very different energies.
    he: הטמפרטורה קובעת את האנרגיה הממוצעת לחלקיק. האנרגיה הפנימית היא הסך הכול, פי N מזה; לשני גזים באותה טמפרטורה יכולות להיות אנרגיות שונות מאוד.
  remedy:
    lesson: '4.1'
    anchor: derive
    label:
      en: Temperature is not energy, in the derivation
      he: טמפרטורה אינה אנרגיה, בגזירה

- id: MC-heavier-pushes-harder
  title:
    en: Heavier particles push harder
    he: חלקיקים כבדים דוחפים חזק יותר
  belief:
    en: At the same temperature, a gas of heavier particles exerts a higher pressure, because each bounce delivers more momentum.
    he: באותה טמפרטורה, גז של חלקיקים כבדים מפעיל לחץ גבוה יותר, כי כל פגיעה מעבירה יותר תנע.
  truth:
    en: Heavier particles are slower at the same temperature. Each bounce delivers more momentum, but the bounces come less often, and the two effects cancel exactly.
    he: באותה טמפרטורה חלקיקים כבדים איטיים יותר. כל פגיעה מעבירה יותר תנע, אבל הפגיעות תכופות פחות, ושני האפקטים מתקזזים בדיוק.
  remedy:
    lesson: '4.1'
    anchor: heavy
    label:
      en: Run the gas four times heavier
      he: הריצו את הגז כבד פי ארבעה

- id: MC-doubling-doubles-everything
  title:
    en: Doubling a system doubles every property
    he: הכפלת מערכת מכפילה כל תכונה
  belief:
    en: Twice the gas in twice the volume has twice the pressure, or twice the temperature.
    he: פי שניים גז בנפח כפול נותן לחץ כפול, או טמפרטורה כפולה.
  truth:
    en: Extensive quantities (N, V, U) double; intensive ones (P, T) do not. The pressure depends on N/V, which is unchanged.
    he: גדלים אקסטנסיביים (N, V, U) מוכפלים; גדלים אינטנסיביים (P, T) לא. הלחץ תלוי ב-N/V, שלא משתנה.
  remedy:
    lesson: '4.1'
    anchor: ex-4-1-1
    label:
      en: Work through two containers at one temperature
      he: פתרו את שני המיכלים באותה טמפרטורה

- id: MC-violence-sets-fluctuation
  title:
    en: Fluctuations come from violent collisions
    he: הפלוקטואציות נובעות מהתנגשויות אלימות
  belief:
    en: A hotter gas, or heavier molecules, make the pressure jitter more in relative terms.
    he: גז חם יותר, או מולקולות כבדות יותר, גורמים ללחץ לרעוד יותר באופן יחסי.
  truth:
    en: The relative fluctuation of the pressure is N^(-1/2), whatever the temperature or the mass. Only the number of particles sets it.
    he: הפלוקטואציה היחסית של הלחץ היא N^(-1/2), בכל טמפרטורה ובכל מסה. רק מספר החלקיקים קובע אותה.
  remedy:
    lesson: '4.1'
    anchor: steady
    label:
      en: See the spread shrink with N, and nothing else
      he: ראו את הפיזור קטן עם N, ועם שום דבר אחר
