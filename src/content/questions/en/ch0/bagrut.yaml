          - text: >-
              $\omega_2$ only: a form with a single term has nothing to compare, so it is exact.
            feedback: >-
              A missing term is a term equal to zero. $\omega_2$ has $M = 0$, so $\partial M/\partial y = 0$, against $\partial N/\partial x = 2x$.
          - text: >-
              Neither: $\partial(2xy)/\partial x = 2y$ differs from $\partial(x^2)/\partial y = 0$.
            feedback: >-
              Those are the wrong derivatives. The test crosses them: $M$ with respect to $y$, $N$ with respect to $x$.
