      - label: d
        type: open
        points: 13
        objectives: [OBJ-0.1-6, OBJ-0.1-7]
        prompt: >-
          Compute $\oint \omega_2$ counter-clockwise around the unit square with corners $(0, 0)$, $(1, 0)$, $(1, 1)$, $(0, 1)$, and explain why it had to be non-zero. Show that around a square of side $s$ centred at $(x_0, y_0)$ the integral is $2x_0s^2$, and relate this to the mixed partials. On the $P$–$V$ plane the work done on a gas, $\dbar W = -P\,\mathrm{d}V$, is a form of the same kind: show that it is inexact, and say what physical consequence follows for a gas taken around a closed cycle. Check your results in limits.
        solution:
          - kind: law
            text: >-
              An exact form integrates to zero around every closed loop. For $\omega = M\,\mathrm{d}x + N\,\mathrm{d}y$, the integral around a small loop traversed counter-clockwise is $(\partial N/\partial x - \partial M/\partial y)$ times the enclosed area, to leading order; for a rectangle and a form with $M = 0$, the integral comes from the two vertical edges alone.
          - kind: manipulation
            text: >-
              Unit square: on the bottom and top edges $\mathrm{d}y = 0$; on the left edge $x = 0$; the right edge, $x = 1$ with $y$ rising from $0$ to $1$, gives $1$. So $\oint\omega_2 = 1$. It had to be non-zero: if $\omega_2$ were exact, every loop would give zero, and the test showed it is not. Inexactness only says that some loop gives a non-zero value; this loop does because $\partial N/\partial x - \partial M/\partial y = 2x > 0$ everywhere inside the square, so every piece of area contributes with the same sign (Green's theorem). Square of side $s$ centred at $(x_0, y_0)$: the right edge, at $x_0 + s/2$, rises and gives $(x_0 + s/2)^2 s$; the left edge, at $x_0 - s/2$, falls and gives $-(x_0 - s/2)^2 s$; the sum is $2x_0s^2$ exactly. That is $(\partial N/\partial x - \partial M/\partial y) = 2x_0$ times the area $s^2$: the mixed partials' disagreement is the loop integral per unit area.
          - kind: manipulation
            text: >-
              On the $P$–$V$ plane, $\dbar W = 0\,\mathrm{d}P + (-P)\,\mathrm{d}V$, so $\partial(0)/\partial V = 0$ but $\partial(-P)/\partial P = -1$: inexact, and around a loop $-\oint P\,\mathrm{d}V$ is plus or minus the enclosed area, the sign set by the direction. Around a cycle traversed clockwise on a diagram with $V$ across and $P$ up, the gas expands at high pressure and is compressed at low pressure: $W = -\oint P\,\mathrm{d}V < 0$, minus the enclosed area: net work done by the gas. The gas returns to its starting state, so $\Delta U = 0$ and $Q = -W > 0$: around a cycle, heat taken in is turned into work. That is an engine, and it is possible only because work is not a state function.
          - kind: formula
            text: >-
              $\oint_{\square}\omega_2 = 1, \qquad \oint_{s \times s}\omega_2 = 2x_0s^2 = \left(\dfrac{\partial N}{\partial x} - \dfrac{\partial M}{\partial y}\right)s^2, \qquad \oint \dbar W = -\oint P\,\mathrm{d}V$
          - kind: limit
            text: >-
              $s \to 0$: the loop integral vanishes as $s^2$, the area, so a small enough loop gives nothing however inexact the form. $x_0 = 0$: the partials agree on the $y$ axis and a square centred there gives exactly $0$. For $\omega_1$ the factor $\partial N/\partial x - \partial M/\partial y$ is $0$ everywhere, and every loop gives $0$. A cycle that encloses no area, out and back along the same path in the $P$–$V$ plane, gives $W = 0$.
          - kind: units
            text: >-
              $x$ and $y$ are pure numbers here, and so are the integrals. On the $P$–$V$ plane the enclosed area is $\text{Pa}\cdot\text{m}^3 = \text{J}$: an area there is an energy.
          - kind: substitution
            text: >-
              Unit square: $1$. A square of side $0.5$ centred at $(1.25, 1.25)$: $2 \times 1.25 \times 0.25 = 0.625$, which the integral along its four edges reproduces; side $0.1$ centred at $(1.05, 1.05)$: $0.021$.
          - kind: result
            text: >-
              $\oint\omega_2 = 1$ around the unit square, and $2x_0s^2$ around a small square: the loop integral per unit area is the disagreement of the mixed partials, which is why that test decides exactness. Work, $\dbar W = -P\,\mathrm{d}V$, fails the test, so a gas taken around a cycle can exchange net work equal to the enclosed area, with $\Delta U = 0$ and an equal and opposite net heat: the principle of every heat engine.
        rubric:
          - text: >-
              $\oint\omega_2 = 1$, with the reason it had to be non-zero (an exact form gives zero around every loop).
          - text: >-
              Derives $2x_0s^2$ and relates it to $\partial N/\partial x - \partial M/\partial y$ times the area.
            weight: 2
          - text: >-
              Shows that $-P\,\mathrm{d}V$ is inexact and that the net work around a cycle is the enclosed area.
            weight: 2
          - text: >-
              States the consequence: $\Delta U = 0$ around a cycle, so net heat in equals net work out, an engine.
          - text: >-
              A limit check: $s \to 0$, $x_0 = 0$, or a cycle enclosing no area.
