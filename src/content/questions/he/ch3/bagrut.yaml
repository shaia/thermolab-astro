# שאלות החזרה של מודול 03, מתוך דף הבעיות של ThermoLab (content/he/statistical-mechanics/03-random-walks-problems.md,
# בעיות 4, 6, 7 ו-8; בעיות 1, 2, 3 ו-5 הן הדוגמאות הפתורות 2, 3, 4 ו-5 של השיעור, ושל חוברת התרגול). בעיה 4 (המעריך
# עבור צעד אחר) משתמשת בצעד עצל ולא סימטרי, +1, 0 או -1, שלא השיעור ולא ThermoLab מודדים, ומוסיפה את המלכודת של
# התאמת המרחק מהראשית במקום הפיזור. בעיה 6 (שני ממדים) משתמשת בצעדים אחידים ב-x וב-y. בעיה 7 (המחיר של המתאם) היא
# דוגמה 6 של השיעור, מורחבת: q אחר, שגיאת התקן ומספר הקריאות הבלתי תלויות שקול לקריאות המתואמות, סדרה אנטי-מתמידה,
# והשונות המדויקת ב-t סופי, שהגבולות שלה כוללים את הסדרה המתחלפת. בעיה 8 (הילוך קושי) שומרת על כל השאלות של
# ThermoLab. כל מספר חושב מחדש בספרייה של ThermoLab (thermolab.sampling: random_walk עם StepDist מותאם ועם dim=2,
# walker_spread, correlated_walk; thermolab.validation.scaling_exponent) וב-standard_cauchy של numpy; מספרים מסימולציה
# הם ממוצעים על פני זרעים רבים, עם הפיזור שלהם מזרע לזרע. ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו מפרסמת
# פתרונות מלאים ומחוונים. המזהים משותפים עם הקובץ באנגלית.
lang: he
chapter: 3
questions:
  - id: Q-3-bagrut-1
    type: bagrut
    title: >-
      המעריך של צעד עצל ולא סימטרי
    prompt: >-
      הצעד של הולך הוא $+1$ בהסתברות $0.5$, $0$ בהסתברות $0.3$ (הוא נשאר במקומו) ו-$-1$ בהסתברות $0.2$, באופן בלתי תלוי בכל פעימה. סימולציה מריצה $5000$ הולכים כאלה במשך $1024$ צעדים ומודדת את הפיזור של הענן, סטיית התקן של המיקומים סביב הממוצע שלהם, ב-$t = 4$, $16$, $64$, $256$ ו-$1024$. זרע אחד נותן $1.54$, $3.14$, $6.32$, $12.56$ ו-$25.23$.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-3.1-1]
        prompt: >-
          מצאו את התוחלת של צעד אחד, $\mu_1$.
        answer: 0.3
        unit: steps
        tolerance: 0.01
        correctFeedback: >-
          $\mu_1 = (+1)(0.5) + 0 \times 0.3 + (-1)(0.2) = 0.3$. אחרי $1024$ צעדים מרכז הענן נמצא ב-$307.2$; במדידה על פני $64$ זרעים, $307.22 \pm 0.04$.
        wrongFeedback: >-
          $\mu_1 = \sum_s s\,P(s)$ על פני שלושת הערכים $+1$, $0$ ו-$-1$.
        commonWrong:
          - value: 0.5
            feedback: >-
              זה סופר רק את הצעדים ימינה. הצעדים שמאלה, בהסתברות $0.2$, מורידים את התוחלת: $0.5 - 0.2 = 0.3$.
          - value: 0.375
            feedback: >-
              זה ממצע רק על הפעימות שבהן הוא זז, $(0.5 - 0.2)/0.8$. פעימה שבה הוא נשאר במקומו היא צעד בגודל $0$, והיא נספרת בתוחלת כמו כל פעימה אחרת.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-3.1-1]
        prompt: >-
          מצאו את סטיית התקן של צעד אחד, $\sigma_1$.
        answer: 0.7810
        unit: steps
        tolerance: 0.01
        correctFeedback: >-
          $\langle s^2 \rangle = 0.5 + 0.2 = 0.7$, ולכן $\sigma_1^2 = 0.7 - 0.3^2 = 0.61$ ו-$\sigma_1 = 0.781$. הפיזור החזוי ב-$t = 1024$ הוא $0.781 \times 32 = 24.99$.
        wrongFeedback: >-
          $\sigma_1^2 = \langle s^2 \rangle - \mu_1^2$, עם $\langle s^2 \rangle = \sum_s s^2 P(s)$; אחר כך הוציאו שורש.
        commonWrong:
          - value: 0.8367
            feedback: >-
              זה $\sqrt{\langle s^2 \rangle} = \sqrt{0.7}$, השורש של ממוצע ריבוע הצעד, סביב $0$. הפיזור נמדד סביב התוחלת: חסרו קודם את $\mu_1^2 = 0.09$.
          - value: 0.61
            feedback: >-
              זו השונות, $\sigma_1^2$. סטיית התקן היא השורש שלה.
      - label: ג
        type: mc
        points: 4
        objectives: [OBJ-3.1-1, OBJ-3.1-5]
        prompt: >-
          על פני $64$ זרעים, המעריך המותאם לחמשת הפיזורים הוא $0.5002 \pm 0.0004$ (פיזור של $0.003$ מזרע לזרע). סטודנט מתאים במקום זאת את המרחק הריבועי הממוצע מנקודת המוצא, $\sqrt{\langle x_t^2 \rangle}$, באותם זמנים, ומקבל $0.917$. איזו טענה נכונה?
        choices:
          - text: >-
              הפיזור סביב התוחלת גדל כמו $\sigma_1\sqrt t$, עם מעריך $\tfrac12$, כמו לכל צעד בעל שונות סופית. $\langle x_t^2 \rangle = \sigma_1^2 t + \mu_1^2 t^2$ מערבב את הסחיפה ברוחב, ולכן המעריך המותאם שלו נמצא בין $\tfrac12$ ל-$1$ ותלוי בטווח של $t$.
            correct: true
            feedback: >-
              נכון. ב-$t = 4$ הסחיפה, $1.2$, קטנה מהפיזור, $1.56$; ב-$t = 1024$ היא גדולה ממנו פי שתים עשרה, ו-$\sqrt{\langle x_t^2 \rangle}$ עבר מהחוק של הפיזור לחוק של הסחיפה. המעריך של הפיזור אוניברסלי; המקדם, $\sigma_1$, שייך לצעד עצמו.
          - text: >-
              הילוך שנסחף מתרחב מהר יותר מהילוך הוגן: המעריך האמיתי שלו הוא $0.917$, וה-$0.5002$ של הפיזור מחמיץ את הסחיפה.
            feedback: >-
              הסחיפה מזיזה את הענן; היא אינה מרחיבה אותו. המיקום של כל הולך הוא $\mu_1 t$ ועוד סכום של פלוקטואציות בלתי תלויות בעלות שונות $\sigma_1^2 t$; הרוחב הוא החלק השני בלבד.
            misconception: MC-spread-means-drift
          - text: >-
              $0.5002$ שונה מ-$\tfrac12$ ביותר מהשגיאה שלו, ולכן חוק ה-$\sqrt t$ נכשל מעט עבור צעדים שיכולים להיות אפס.
            feedback: >-
              $0.5002 - 0.5 = 0.0002$ קטן משגיאת תקן אחת, $0.0004$: לא נמדד שום הפרש. צעדים שיכולים להיות אפס הם צעדים בעלי שונות $0.61$, והמשפט חל על כל שונות סופית.
          - text: >-
              המעריך של הפיזור תלוי בצעד: הולך שלפעמים נשאר במקומו מתפזר לאט יותר מ-$\sqrt t$.
            feedback: >-
              ההישארות במקום מקטינה את המקדם, $\sigma_1 = 0.781$ לעומת $1$ של המטבע ההוגן, לא את המעריך. שונויות מתחברות לכל צעדים בלתי תלויים, ולכן השונות גדלה כמו $t$ והפיזור כמו $\sqrt t$.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-3.1-1, OBJ-3.1-5]
        prompt: >-
          עבור צעד שהוא $+1$, $0$ או $-1$ בהסתברויות $p_+$, $p_0$ ו-$p_-$, גזרו את $\sigma_1^2$. הראו מדוע המעריך של הפיזור הוא $\tfrac12$ יהיה הצעד אשר יהיה, בעוד המקדם שייך לצעד עצמו. נבאו את הפיזור של ההילוך הזה ב-$t = 1024$ ואת הפיזור מזרע לזרע של פיזור שנמדד עם $5000$ הולכים; על פני $64$ זרעים הפיזור הנמדד הוא $24.94 \pm 0.03$, עם פיזור של $0.25$ מזרע לזרע. בדקו את הנוסחה שלכם בגבולות.
        solution:
          - kind: law
            text: >-
              עבור צעדים בלתי תלויים, תוחלות מתחברות תמיד ושונויות מתחברות: $\langle x_t \rangle = \mu_1 t$, $\operatorname{Var}(x_t) = \sigma_1^2 t$, ולכן הפיזור סביב התוחלת הוא $\sigma_1\sqrt t$. אז $\ln \sigma_{x_t} = \ln \sigma_1 + \tfrac12 \ln t$: על צירים לוגריתמיים, קו בשיפוע $\tfrac12$ לכל $\sigma_1$, שהגובה שלו נקבע על ידי $\sigma_1$.
          - kind: manipulation
            text: >-
              $\mu_1 = p_+ - p_-$ ו-$\langle s^2 \rangle = p_+ + p_-$, כי $s^2 = 1$ בכל אחד משני המהלכים ו-$0$ כשנשארים במקום. לכן $\sigma_1^2 = p_+ + p_- - (p_+ - p_-)^2$.
          - kind: formula
            text: >-
              $\sigma_1^2 = p_+ + p_- - (p_+ - p_-)^2 \qquad \sigma_{x_t} = \sigma_1\sqrt t$
          - kind: substitution
            text: >-
              $\sigma_1^2 = 0.7 - 0.09 = 0.61$, $\sigma_1 = 0.781$, וב-$t = 1024$ הפיזור הוא $0.781 \times 32 = 24.99$. סטיית תקן שנמדדת מתוך $N$ הגרלות של גודל כמעט גאוסי מתפזרת בערך ב-$\sigma/\sqrt{2N} = 24.99/100 = 0.25$, הפיזור שנמדד. הממוצע של $64$ הזרעים, $24.94 \pm 0.03$, נמצא $1.8$ שגיאות תקן מ-$24.99$: הסכמה, בטווח של $0.2\%$.
          - kind: limit
            text: >-
              $p_0 = 0$, $p_+ = p_- = \tfrac12$: $\sigma_1^2 = 1$, המטבע ההוגן. $p_0 = 0$, $p_+ = p$: $\sigma_1^2 = 1 - (2p - 1)^2 = 4p(1 - p)$, המטבע המוטה של השיעור. $p_+ = 1$: $\sigma_1 = 0$, הולך שצועד קדימה בלי שום פיזור. $p_0 \to 1$: $\sigma_1 \to 0$, איש אינו זז. $t = 1$ מחזיר את הפיזור של צעד אחד עצמו.
          - kind: units
            text: >-
              המיקומים ו-$\sigma_1$ נמדדים בצעדים; ההסתברויות והמעריך הם מספרים טהורים, ו-$\sigma_1^2$ הוא סכום של הסתברויות כפול ריבועי גודלי צעדים, ולכן הוא נמדד בצעדים בריבוע.
          - kind: result
            text: >-
              $\sigma_1^2 = p_+ + p_- - (p_+ - p_-)^2 = 0.61$ כאן. המעריך הוא $\tfrac12$ כי השונויות של צעדים בלתי תלויים מתחברות, יהיה הצעד אשר יהיה; המקדם הוא $\sigma_1 = 0.781$, והפיזור החזוי ב-$t = 1024$, $25.0 \pm 0.25$ לזרע אחד, הוא מה שנמדד.
        rubric:
          - text: >-
              גזירת $\mu_1 = p_+ - p_-$, $\langle s^2 \rangle = p_+ + p_-$ ו-$\sigma_1^2 = p_+ + p_- - (p_+ - p_-)^2$.
            weight: 3
          - text: >-
              הסבר המעריך מתוך החיבוריות של שונויות של צעדים בלתי תלויים, וכן שעל צירים לוגריתמיים $\sigma_1$ קובע רק את הגובה של הקו.
            weight: 3
          - text: >-
              ניבוי הפיזור $\sigma_1\sqrt{1024} = 25.0$ והשוואתו למדידה.
            weight: 2
          - text: >-
              הערכת הפיזור מזרע לזרע בכ-$\sigma/\sqrt{2N} = 0.25$.
            weight: 2
          - text: >-
              בדיקת גבולות: המטבע ההוגן או המוטה, $p_+ = 1$, $p_0 \to 1$ או $t = 1$, עם המשמעות של כל אחד.
            weight: 2

  - id: Q-3-bagrut-2
    type: bagrut
    title: >-
      הולך במישור
    prompt: >-
      הולך במישור עושה צעדים בלתי תלויים ב-$x$ וב-$y$: בכל פעימה כל קואורדינטה משתנה בהגרלה חדשה מההתפלגות האחידה על $[-1, 1]$, בעלת תוחלת $0$ ושונות $\sigma_1^2 = \tfrac13$. אחרי $t = 300$ פעימות המרחק שלו מנקודת המוצא הוא $r = \sqrt{x^2 + y^2}$. סימולציה עוקבת אחרי $20\,000$ הולכים בכל אחד מ-$64$ זרעים.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-3.1-1]
        prompt: >-
          מצאו את המרחק הריבועי הממוצע מנקודת המוצא, $\sqrt{\langle r^2 \rangle}$, אחרי $300$ פעימות.
        answer: 14.14
        unit: steps
        tolerance: 0.01
        correctFeedback: >-
          $\langle r^2 \rangle = \langle x^2 \rangle + \langle y^2 \rangle = 2\sigma_1^2 t = 200$, ולכן $\sqrt{\langle r^2 \rangle} = 14.14$. במדידה: $\langle r^2 \rangle = 200.1 \pm 0.2$.
        wrongFeedback: >-
          $r^2 = x^2 + y^2$, וכל קואורדינטה היא הילוך חד-ממדי עם $\langle x^2 \rangle = \sigma_1^2 t$.
        commonWrong:
          - value: 10
            feedback: >-
              זה הפיזור של קואורדינטה אחת, $\sigma_1\sqrt t$. למרחק יש תרומות משתיהן: $\langle r^2 \rangle = \langle x^2 \rangle + \langle y^2 \rangle$.
          - value: 20
            feedback: >-
              זה מחבר את הפיזורים של שתי הקואורדינטות, $10 + 10$. הריבועים הם שמתחברים, לפי פיתגורס: $\sqrt{100 + 100} = 14.1$.
          - value: 200
            feedback: >-
              זה $\langle r^2 \rangle$. המרחק הריבועי הממוצע הוא השורש שלו.
      - label: ב
        type: mc
        points: 4
        objectives: [OBJ-3.1-1, OBJ-3.1-3]
        prompt: >-
          צפיפות ההולכים ליחידת שטח גבוהה ביותר בנקודת המוצא. היכן ההיסטוגרמה של המרחק $r$ גבוהה ביותר?
        choices:
          - text: >-
              ב-$r = \sigma_1\sqrt t = 10$: ההולכים במרחק $r$ ממלאים טבעת בשטח $2\pi r\,\mathrm{d}r$, שגדל עם $r$ בזמן שהצפיפות ליחידת שטח יורדת, והמכפלה שלהם מגיעה לשיא שם.
            correct: true
            feedback: >-
              נכון. בקרבת נקודת המוצא הצפיפות גבוהה ביותר, אבל הטבעת זעירה; רחוק משם הטבעת גדולה, אבל כמעט ריקה. במדידה: העמודה הגבוהה ביותר בהיסטוגרמה נמצאת ב-$r = 9.98 \pm 0.10$.
          - text: >-
              ב-$r = 0$, ששם הצפיפות ליחידת שטח גבוהה ביותר.
            feedback: >-
              צפיפות ליחידת שטח והסתברות ליחידת מרחק הן דברים שונים. לטבעת ברדיוס $r$ וברוחב $\mathrm{d}r$ יש שטח $2\pi r\,\mathrm{d}r$, שמתאפס ב-$r = 0$: כמעט שום הולך אינו עומד במרחק קטן מנקודת המוצא.
          - text: >-
              ב-$r = \sqrt{\langle r^2 \rangle} = 14.1$, המרחק הריבועי הממוצע.
            feedback: >-
              המרחק הריבועי הממוצע הוא ממוצע שנותן להולכים הרחוקים משקל $r^2$, ולהתפלגות של $r$ יש זנב ארוך ימינה. הממוצע שלה, $12.5$, והערך הריבועי הממוצע שלה, $14.1$, נמצאים שניהם מעבר לשיא שלה.
          - text: >-
              ב-$r = 0$: המרחק בנוי מ-$300$ צעדים בלתי תלויים, ולכן לפי משפט הגבול המרכזי הוא גאוסי, ממורכז סביב הצעד הממוצע, אפס.
            feedback: >-
              הקואורדינטות הן סכומים של צעדים בלתי תלויים, וכל אחת מהן קרובה לגאוסית. המרחק אינו סכום: $\sqrt{x^2 + y^2}$ לעולם אינו שלילי, והמשפט אינו אומר עליו דבר באופן ישיר.
            misconception: MC-clt-always-applies
      - label: ג
        type: numeric
        points: 4
        objectives: [OBJ-3.1-1, OBJ-3.1-3]
        prompt: >-
          איזה חלק מההולכים עומד במרחק $r < 10$ מנקודת המוצא? התייחסו לכל קואורדינטה כגאוסית בעלת שונות $\sigma_1^2 t$, כפי שמשפט הגבול המרכזי מתיר, ובצעו אינטגרציה על פני העיגול.
        answer: 0.3935
        unit: ''
        tolerance: 0.01
        correctFeedback: >-
          $P(r < R) = 1 - e^{-R^2/(2\sigma_1^2 t)}$, ועם $R = \sigma_1\sqrt t$ זה $1 - e^{-1/2} = 0.393$. במדידה: $0.3932 \pm 0.0005$. בממד אחד, $68.3\%$ מההולכים נמצאים בטווח של פיזור אחד מנקודת המוצא; בשני ממדים, $39\%$ נמצאים בטווח של פיזור אחד ממנה במרחק.
        wrongFeedback: >-
          הצפיפות המשותפת היא $e^{-(x^2 + y^2)/(2s^2)}/(2\pi s^2)$ עם $s^2 = \sigma_1^2 t = 100$. בקואורדינטות קוטביות אלמנט השטח הוא $2\pi r\,\mathrm{d}r$; בצעו אינטגרציה מ-$0$ עד $10$.
        commonWrong:
          - value: 0.6827
            feedback: >-
              זו התשובה החד-ממדית, החלק שבו $|x| < 10$. העיגול דורש ששתי הקואורדינטות יהיו קטנות יחד, ובצירוף הנכון.
          - value: 0.4661
            feedback: >-
              זה $0.6827^2$, החלק שבתוך הריבוע $|x| < 10$, $|y| < 10$. העיגול $r < 10$ קטן מהריבוע: הוא משאיר בחוץ את הפינות שלו.
          - value: 0.6321
            feedback: >-
              זה $1 - e^{-1}$, מתוך $e^{-r^2/s^2}$ בלי ה-$2$. הגאוסית בעלת שונות $s^2$ היא $e^{-r^2/(2s^2)}$, ולכן התשובה היא $1 - e^{-1/2}$.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-3.1-1, OBJ-3.1-3]
        prompt: >-
          הראו ש-$\langle r_t^2 \rangle = 2\sigma_1^2 t$. אחר כך, כשמתייחסים ל-$x$ ול-$y$ כגאוסיות בלתי תלויות בעלות שונות $s^2 = \sigma_1^2 t$, גזרו את צפיפות ההסתברות של $r$, מצאו את הערך הסביר ביותר שלו ואת הממוצע שלו, והסבירו מדוע $r$ אינו גאוסי אף ש-$x$ ו-$y$ גאוסיים. בדקו את התוצאה שלכם בגבולות.
        solution:
          - kind: law
            text: >-
              כל קואורדינטה היא הילוך חד-ממדי של צעדים בלתי תלויים: $\langle x_t \rangle = 0$, $\langle x_t^2 \rangle = \sigma_1^2 t$, וכך גם עבור $y$. לכן $\langle r_t^2 \rangle = \langle x_t^2 \rangle + \langle y_t^2 \rangle = 2\sigma_1^2 t$, בלי שום הנחה על הצורה של הצעדים.
          - kind: manipulation
            text: >-
              $x$ ו-$y$ בלתי תלויים, ולכן הצפיפות המשותפת שלהם היא המכפלה, $e^{-(x^2 + y^2)/(2s^2)}/(2\pi s^2)$, שתלויה רק ב-$r$. ההולכים שהמרחק שלהם בין $r$ ל-$r + \mathrm{d}r$ ממלאים טבעת בשטח $2\pi r\,\mathrm{d}r$, ולכן $p(r) = (r/s^2)\,e^{-r^2/(2s^2)}$. הנגזרת שלה מתאפסת היכן ש-$1 - r^2/s^2 = 0$, ב-$r = s$; $\int_0^R p\,\mathrm{d}r = 1 - e^{-R^2/(2s^2)}$, ו-$\langle r \rangle = \int_0^\infty r\,p\,\mathrm{d}r = s\sqrt{\pi/2}$.
          - kind: formula
            text: >-
              $p(r) = \dfrac{r}{s^2}\,e^{-r^2/(2s^2)} \qquad r^* = s \qquad \langle r \rangle = s\sqrt{\pi/2} \qquad \langle r^2 \rangle = 2s^2$
          - kind: limit
            text: >-
              $r \to 0$: $p \to 0$ ביחס ישר ל-$r$, כי כך גם שטח הטבעת; הנקודה הסבירה ביותר היא נקודת המוצא, אבל המרחק הסביר ביותר אינו אפס. $r \gg s$: $p$ דועכת כמו זנב גאוסי. $\int_0^\infty r^2 p\,\mathrm{d}r = 2s^2$, כפי שהשורה הראשונה דורשת. בממד אחד אותו טיעון נותן ל-$|x|$ חצי גאוסית, שגבוהה ביותר ב-$0$, כי שם ה"טבעת" היא שתי נקודות ואינה גדלה; ב-$d$ ממדים $\langle r^2 \rangle = d\sigma_1^2 t$. $t \to 0$: $s \to 0$, וכל הולך נמצא בנקודת המוצא.
          - kind: units
            text: >-
              $r$ ו-$s$ נמדדים בצעדים; $p(r)$ היא הסתברות ליחידת מרחק, $r/s^2$ ביחידות של אחד חלקי צעד, כפי שצפיפות ב-$r$ חייבת להיות.
          - kind: substitution
            text: >-
              $s = 10$: השיא ב-$10$, נמדד $9.98 \pm 0.10$; $\langle r \rangle = 12.53$, נמדד $12.538 \pm 0.006$; $\langle r^2 \rangle = 200$, נמדד $200.1 \pm 0.2$.
          - kind: result
            text: >-
              $\langle r_t^2 \rangle = 2\sigma_1^2 t$, ול-$r$ יש הצפיפות $(r/s^2)e^{-r^2/(2s^2)}$, עם שיא ב-$s = \sigma_1\sqrt t$ וממוצע $s\sqrt{\pi/2}$. היא אינה גאוסית כי $r$ אינו סכום של איברים בלתי תלויים אלא פונקציה לא ליניארית של שניים מהם, שלעולם אינה שלילית, והערכים הקטנים שלה מדוכאים על ידי השטח המתאפס בקרבת נקודת המוצא. משפט הגבול המרכזי הופך את $x$ ואת $y$ לגאוסיים; מה ש-$r$ עושה נובע מזה בגאומטריה.
        rubric:
          - text: >-
              גזירת $\langle r_t^2 \rangle = 2\sigma_1^2 t$ מתוך הקואורדינטות הבלתי תלויות.
            weight: 2
          - text: >-
              כתיבת הצפיפות המשותפת כמכפלה ומעבר ל-$r$ בעזרת שטח הטבעת $2\pi r\,\mathrm{d}r$, וקבלת $p(r) = (r/s^2)e^{-r^2/(2s^2)}$.
            weight: 4
          - text: >-
              מציאת השיא ב-$r = s$ ושל הממוצע $s\sqrt{\pi/2}$, והשוואתם למדידות.
            weight: 2
          - text: >-
              הסבר מדוע $r$ אינו גאוסי: אינו סכום, לעולם אינו שלילי, וערכיו הקטנים מדוכאים על ידי השטח.
            weight: 2
          - text: >-
              בדיקת גבולות: $r \to 0$, $r \gg s$, ממד אחד, $d$ ממדים או $t \to 0$, עם המשמעות של כל אחד.
            weight: 2

  - id: Q-3-bagrut-3
    type: bagrut
    title: >-
      המחיר של מתאם, נספר בקריאות
    prompt: >-
      גלאי מפיק קריאות $s_i = \pm 1$. כל קריאה חוזרת על הקודמת בהסתברות $q$, ואחרת היא $\pm 1$ חדש בסיכויים שווים, ולכן לכל קריאה $\langle s_i \rangle = 0$ ו-$\langle s_i^2 \rangle = 1$, ולקריאות במרחק $j$ זו מזו יש מתאם $q^j$ (ההילוך המתמיד של השיעור, דוגמה 6). הממוצע של $t$ קריאות, $m = x_t/t$ עם $x_t = s_1 + \cdots + s_t$, מעריך את התוחלת האמיתית, $0$.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-3.1-5, OBJ-3.1-3]
        prompt: >-
          ב-$q = 0.8$, עם $t = 10\,000$ קריאות, מצאו את שגיאת התקן של $m$.
        answer: 0.0300
        unit: ''
        tolerance: 0.02
        correctFeedback: >-
          בזמנים ארוכים $\operatorname{Var}(x_t) = t(1 + q)/(1 - q) = 9t$, ולכן שגיאת התקן היא $\sqrt{9t}/t = 3/\sqrt{10\,000} = 0.030$, פי שלושה מ-$0.010$ של קריאות בלתי תלויות. במדידה עם correlated_walk של ThermoLab, $4000$ סדרות לכל אחד מ-$8$ זרעים: $0.0299 \pm 0.0001$.
        wrongFeedback: >-
          $\operatorname{Var}(m) = \operatorname{Var}(x_t)/t^2$, ועבור הסדרה הזו $\operatorname{Var}(x_t) \to t(1 + q)/(1 - q)$ בזמנים ארוכים.
        commonWrong:
          - value: 0.01
            feedback: >-
              זה $1/\sqrt t$, שגיאת התקן של קריאות בלתי תלויות. הקריאות האלה מתואמות: השונויות המשותפות מנפחות את השונות של הסכום פי תשעה.
          - value: 0.02236
            feedback: >-
              זה משתמש ב-$\operatorname{Var}(x_t) = t/(1 - q) = 5t$, שסופר כל שונות משותפת פעם אחת. הסכום הכפול $\sum_i\sum_j \langle s_is_j \rangle$ מכיל כל זוג פעמיים, $i < j$ ו-$i > j$: $t[1 + 2q/(1 - q)] = t(1 + q)/(1 - q)$.
          - value: 0.09
            feedback: >-
              זה מכפיל את שגיאת התקן של קריאות בלתי תלויות בגורם הניפוח של השונות, $9$. שגיאת התקן היא שורש: היא גדלה פי $\sqrt 9 = 3$.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-3.1-5]
        prompt: >-
          כמה קריאות בלתי תלויות היו נותנות את אותה שגיאת תקן כמו $10\,000$ הקריאות האלה?
        answer: 1111
        unit: ''
        tolerance: 0.02
        correctFeedback: >-
          $1/\sqrt{t'} = 0.030$ נותן $t' = t(1 - q)/(1 + q) = 10\,000/9 = 1111$ קריאות בלתי תלויות. תשע קריאות ברצף נושאות את המידע של אחת: פס שגיאה שחושב כאילו הן בלתי תלויות קטן פי שלושה מדי.
        wrongFeedback: >-
          השוו את $1/\sqrt{t'}$, שגיאת התקן של $t'$ קריאות בלתי תלויות, לשגיאת התקן של סעיף (א).
        commonWrong:
          - value: 3333
            feedback: >-
              זה מחלק בגורם של שגיאת התקן, $3$. מספר הקריאות הולך עם השונות, ולכן מחלקים אותו בגורם הניפוח של השונות, $9$.
          - value: 2000
            feedback: >-
              זה $t(1 - q)$, מתוך השונות $t/(1 - q)$ שסופרת כל שונות משותפת פעם אחת. כששני הסדרים של כל זוג נספרים, הגורם הוא $(1 + q)/(1 - q) = 9$.
          - value: 10000
            feedback: >-
              זה מספר הקריאות, לא מספר הקריאות הבלתי תלויות. קריאות מתואמות חוזרות זו על זו, וחזרה אינה מוסיפה מידע חדש.
      - label: ג
        type: mc
        points: 4
        objectives: [OBJ-3.1-3, OBJ-3.1-5]
        prompt: >-
          הקריאות של גלאי שני עושות את ההפך: כל קריאה הופכת את הקריאה הקודמת בהסתברות $a = 0.5$, ואחרת היא חדשה. בהשוואה לקריאות בלתי תלויות, כמה גדולה שגיאת התקן של הממוצע של קריאות רבות שלו?
        choices:
          - text: >-
              קטנה יותר, פי $\sqrt 3$: לקריאות עוקבות יש מתאם $-a$, לקריאות במרחק $j$ זו מזו $(-a)^j$, והשונות לכל קריאה בזמנים ארוכים היא $(1 - a)/(1 + a) = \tfrac13$.
            correct: true
            feedback: >-
              נכון. קריאות שכנות נוטות לבטל זו את זו, ולכן הסכום שלהן נודד פחות מסכום של קריאות בלתי תלויות. במדידה ב-$t = 2000$, $5000$ סדרות לכל אחד מ-$8$ זרעים: $\operatorname{Var}(x_t)/t = 0.332 \pm 0.003$, עם מתאמים של $-0.507 \pm 0.005$ ו-$0.260 \pm 0.002$ במרחקים $1$ ו-$2$. הפרה של אי-התלות יכולה לשנות את הרוחב לכל אחד משני הכיוונים.
          - text: >-
              גדולה יותר, פי $\sqrt 3$: מתאם בין קריאות תמיד פוגע בדיוק.
            feedback: >-
              מתאם חיובי אכן פוגע: קריאות חוזרות מוסיפות מעט. מתאם שלילי מועיל: קריאה שנוטה לבטל את קודמתה גורמת לסכום לנדוד פחות, ו-$\sum_j (-a)^j$ הופך את הגורם ל-$(1 - a)/(1 + a)$, מתחת ל-$1$.
          - text: >-
              אותה שגיאה: כל קריאה עדיין $\pm 1$ בסיכויים שווים, ולכן שגיאת התקן היא $1/\sqrt t$.
            feedback: >-
              ההתפלגות של קריאה אחת אינה משתנה, אבל השונות של סכום תלויה גם בשונויות המשותפות, וכאן הן אינן מתאפסות: לקריאות עוקבות יש מתאם $-0.5$.
          - text: >-
              אפס: סדרה שהופכת את עצמה חוזרת שוב ושוב למקום שבו התחילה.
            feedback: >-
              זה הגבול $a \to 1$, הסדרה המתחלפת בקפדנות $+1, -1, +1, \dots$, שהסכום שלה הוא $0$ או $\pm 1$ לעד. ב-$a = 0.5$ מחצית מהקריאות חדשות, והסכום עדיין נודד כמו $\sqrt t$, רק לאט יותר.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-3.1-3, OBJ-3.1-1]
        prompt: >-
          החל מ-$\operatorname{Var}(x_t) = t + 2\sum_{j=1}^{t-1}(t - j)\,q^j$, גזרו את השונות המדויקת לכל $t$ בצורה סגורה. השתמשו בה כדי לומר כמה ארוכה צריכה להיות סדרה לפני שאפשר להשתמש בצורה של הזמנים הארוכים, $t(1 + q)/(1 - q)$: חשבו את שתיהן ב-$q = 0.8$ עבור $t = 10$, $100$ ו-$10\,000$ (עבור $t = 10$, $8$ זרעים של $20\,000$ סדרות נותנים $54.19 \pm 0.09$). בדקו את התוצאה שלכם בגבולות, כולל $q = -1$.
        solution:
          - kind: law
            text: >-
              לקריאות בעלות תוחלת אפס, $\operatorname{Var}(x_t) = \sum_i\sum_j \langle s_is_j \rangle$: השונות של סכום משיעור 0.1, כשהשונויות המשותפות נשמרות. עם $\langle s_is_{i+j} \rangle = q^j$, $t$ האיברים האלכסוניים נותנים $t$, ו-$t - j$ הזוגות בכל מרחק $j$, כשהם נספרים בשני הסדרים, נותנים $2\sum_j (t - j)q^j$.
          - kind: manipulation
            text: >-
              $\sum_{j=1}^{t-1}(t - j)q^j = t\sum_{j=1}^{t-1} q^j - \sum_{j=1}^{t-1} jq^j$, עם $\sum_{j=1}^{t-1} q^j = q(1 - q^{t-1})/(1 - q)$ ו-$\sum_{j=1}^{t-1} jq^j = q[1 - tq^{t-1} + (t - 1)q^t]/(1 - q)^2$. על המכנה המשותף $(1 - q)^2$ המונה מסתכם ב-$tq(1 - q) - q(1 - q^t)$, ולכן הסכום הוא $tq/(1 - q) - q(1 - q^t)/(1 - q)^2$.
          - kind: formula
            text: >-
              $\operatorname{Var}(x_t) = t\,\dfrac{1 + q}{1 - q} - \dfrac{2q(1 - q^t)}{(1 - q)^2}$
          - kind: substitution
            text: >-
              $q = 0.8$: ב-$t = 10$, $90 - 40(1 - 0.8^{10}) = 54.29$ לעומת $90$ של הזמנים הארוכים, ו-$54.19 \pm 0.09$ שנמדד; ב-$t = 100$, $860$ לעומת $900$; ב-$t = 10\,000$, $89\,960$ לעומת $90\,000$. התיקון הוא $40\%$ מהאיבר של הזמנים הארוכים ב-$t = 10$, $4.4\%$ ב-$100$ ו-$0.04\%$ ב-$10\,000$; כש-$q^t$ זניח הוא $2q/[(1 - q^2)t]$, ודועך כמו $1/t$. הצורה של הזמנים הארוכים דורשת $t$ ארוך פי כמה וכמה מהזיכרון, $1/(1 - q) = 5$ קריאות; סעיף (א), ב-$t = 10\,000$, נמצא שם בבטחה.
          - kind: limit
            text: >-
              $t = 1$: $(1 + q)/(1 - q) - 2q/(1 - q) = 1$, קריאה אחת. $q = 0$: $t$, קריאות בלתי תלויות. $q \to 1$: הסכום עצמו נותן $t + 2\sum_j (t - j) = t^2$, סדרה שלעולם אינה משתנה, $x_t = \pm t$. $q = -1$, קריאה שתמיד מתהפכת: $(1 - (-1)^t)/2$, שהוא $0$ עבור $t$ זוגי ו-$1$ עבור $t$ אי-זוגי, בדיוק הסדרה המתחלפת $+1, -1, +1, \dots$, שהסכום שלה הוא $0$ או $\pm 1$. אותה נוסחה עם $q = -a$ נותנת את הגלאי ההופך של סעיף (ג).
          - kind: units
            text: >-
              קריאות וסכומים הם מניינים טהורים; $q$ ושני האיברים של הנוסחה הם מספרים טהורים, הראשון גדל כמו $t$ והשני חסום.
          - kind: result
            text: >-
              $\operatorname{Var}(x_t) = t(1 + q)/(1 - q) - 2q(1 - q^t)/(1 - q)^2$. האיבר השני הוא תיקון חסום, ולכן הצורה של הזמנים הארוכים מדויקת עד כדי בערך $2q/[(1 - q^2)t]$ מעצמה: ב-$q = 0.8$ היא גבוהה מדי ב-$66\%$ ב-$t = 10$ ($90$ לעומת $54.3$), ב-$5\%$ ב-$100$, ונכונה עד כדי $0.04\%$ ב-$10\,000$. מתאם עולה ברוחב, והמחיר הוא הגורם המלא $(1 + q)/(1 - q)$ רק כשהסדרה ארוכה בהרבה מהזיכרון שלה.
        rubric:
          - text: >-
              כתיבת השונות כסכום כפול של שונויות משותפות, כשכל זוג נספר בשני הסדרים.
            weight: 2
          - text: >-
              חישוב הסכומים הגאומטריים והגעה לצורה הסגורה.
            weight: 4
          - text: >-
              חישוב הצורה המדויקת והצורה של הזמנים הארוכים ב-$t = 10$, $100$, $10\,000$, והשוואת $t = 10$ למדידה.
            weight: 2
          - text: >-
              ניסוח מתי הצורה של הזמנים הארוכים תקפה: $t$ ארוך בהרבה מהזיכרון $1/(1 - q)$.
            weight: 1
          - text: >-
              בדיקת גבולות: $t = 1$, $q = 0$, $q \to 1$ ו-$q = -1$, עם המשמעות של כל אחד.
            weight: 3

  - id: Q-3-bagrut-4
    type: bagrut
    title: >-
      כישלון מסוג אחר: הילוך קושי
    prompt: >-
      הילוך עושה צעדים בלתי תלויים מהתפלגות קושי, שצפיפותה $1/[\pi(1 + s^2)]$. החציון שלה הוא $0$ והרבעונים שלה $\pm 1$, ולכן לצעד אחד יש טווח בין-רבעוני $2$; אין לה שונות סופית. סימולציה בונה $5000$ הילוכים כאלה של $256$ צעדים, מודדת את הענן ב-$t = 4$, $16$, $64$ ו-$256$, ומתאימה את המעריך של $t$ למדד של הרוחב שלו על צירים לוגריתמיים.
    parts:
      - label: א
        type: mc
        points: 4
        objectives: [OBJ-3.1-3]
        prompt: >-
          תחילה, שונות המדגם של הגרלות קושי בודדות, שישה זרעים בכל גודל מדגם $n$: ב-$n = 10^3$, $1.7 \times 10^7$, $8.8 \times 10^3$, $2.2 \times 10^3$, $820$, $1.2 \times 10^3$, $2.8 \times 10^4$; ב-$n = 10^5$, $1.8 \times 10^5$, $3.7 \times 10^4$, $4.8 \times 10^7$, $6.8 \times 10^5$, $1.5 \times 10^5$, $2.5 \times 10^6$. מה מראים הערכים האלה?
