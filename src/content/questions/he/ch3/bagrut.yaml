      - label: ד
        type: open
        points: 13
        objectives: [OBJ-3.1-3]
        prompt: >-
          לצעד קושי אחד יש הפונקציה האופיינית $\langle e^{iks} \rangle = e^{-|k|}$. הראו שהסכום של $t$ צעדים בלתי תלויים הוא התפלגות קושי רחבה פי $t$, ולכן המעריך של סעיף (ג) הוא בדיוק $1$. אמרו מה עושים הסכומים מחולקים ב-$\sqrt t$ כש-$t$ גדל, ומה עושים הסכומים מחולקים ב-$t$. השוו את הכישלון הזה לכישלון של ההילוך המתמיד: איזו הנחה כל אחד מהם מפר וכיצד כל אחד נכשל, ובאיזה מהם סביר יותר שתיתקלו בנתונים ממשיים בלי לשים לב. בדקו את התוצאה שלכם בגבולות.
        solution:
          - kind: law
            text: >-
              הפונקציה האופיינית של סכום איברים בלתי תלויים היא מכפלת הפונקציות האופייניות שלהם: $\langle e^{ikx_t} \rangle = \prod_i \langle e^{iks_i} \rangle$. התפלגות נקבעת על ידי הפונקציה האופיינית שלה.
          - kind: manipulation
            text: >-
              $\langle e^{ikx_t} \rangle = (e^{-|k|})^t = e^{-t|k|} = e^{-|tk|}$, הפונקציה האופיינית של צעד אחד מחושבת ב-$tk$: לכן ל-$x_t$ יש ההתפלגות של $t$ כפול צעד אחד, בצפיפות $t/[\pi(t^2 + x^2)]$, עם רבעונים $\pm t$ וטווח בין-רבעוני $2t$. כל קוונטיל משתנה כמו $t^1$, בדיוק.
          - kind: formula
            text: >-
              $p(x_t) = \dfrac{t}{\pi(t^2 + x_t^2)} \qquad \dfrac{x_t}{t} \sim \dfrac{1}{\pi(1 + u^2)} \qquad P\!\left(\left|\dfrac{x_t}{\sqrt t}\right| < 1\right) = \dfrac{2}{\pi}\arctan\dfrac{1}{\sqrt t}$
          - kind: substitution
            text: >-
              כשמחלקים אותם ב-$\sqrt t$, הסכומים הם התפלגות קושי ברוחב $\sqrt t$: החלק שנמצא בטווח $1$ מהראשית הוא $0.295$, $0.079$ ו-$0.020$ ב-$t = 4$, $64$ ו-$1024$, ודועך כמו $t^{-1/2}$; ההיסטוגרמה משתטחת ולעולם אינה מתלכדת. כשמחלקים אותם ב-$t$, יש להם אותה התפלגות קושי בכל $t$: גבול, אבל לא גאוסי. אפילו הצעד הממוצע $x_t/t$ אינו מתייצב: אחרי מיליון צעדים הוא אינו ודאי בדיוק כמו אחרי צעד אחד.
          - kind: limit
            text: >-
              $t = 1$ מחזיר צעד אחד. החליפו את $e^{-|k|}$ ב-$e^{-\sigma_1^2k^2/2}$ של צעד גאוסי: המכפלה היא $e^{-t\sigma_1^2k^2/2}$, גאוסית ברוחב $\sigma_1\sqrt t$; מה שהופך את $\sqrt t$ ל-$t$ הוא $|k|$ לעומת $k^2$ ב-$k$ קטן, צעד בלי שונות לעומת צעד בעל שונות. התפלגות קושי היא התפלגות סטודנט עם דרגת חופש אחת; עם $\nu$ דרגות חופש השונות היא $\nu/(\nu - 2)$, סופית עבור $\nu > 2$: לצעד בעל הזנב הכבד של השיעור, $\nu = 5$, יש שונות $5/3$ והוא מתלכד עם הגאוסית, והשונות מתבדרת כאשר $\nu \to 2$.
          - kind: units
            text: >-
              $s$, $x_t$ והרוחבים נמדדים בצעדים; $k$ נמדד ביחידות של אחד חלקי צעד, ולכן $|k|$ ו-$t|k|$ הם מספרים טהורים, כפי שמעריך חייב להיות.
          - kind: result
            text: >-
              הסכום של $t$ צעדי קושי הוא התפלגות קושי, רחבה פי $t$; כשמחלקים אותו ב-$\sqrt t$ הוא מתפזר בלי גבול, וכשמחלקים אותו ב-$t$ הוא התפלגות קושי עצמה. ההילוך המתמיד מפר את אי-התלות ושומר על שונות סופית: הוא עדיין גאוסי, רק רחב יותר מ-$\sigma_1\sqrt t$ פי $\sqrt{(1 + q)/(1 - q)}$. הילוך קושי מפר את סופיות השונות: אין $\sigma_1$, הרוחב גדל כמו $t$, והצורה לעולם אינה גאוסית. הסוג המתמיד הוא זה שנתקלים בו בלי לשים לב: ההיסטוגרמות שלו נראות גאוסיות לגמרי ורק פסי השגיאה שלו שגויים, בעוד שנתוני קושי מכריזים על עצמם בחריגים פראיים ובשונויות שאינן חוזרות על עצמן.
        rubric:
          - text: >-
              שימוש במכפלת הפונקציות האופייניות כדי להראות שהסכום הוא התפלגות קושי ברוחב $t$, ולכן המעריך הוא בדיוק $1$.
            weight: 4
          - text: >-
              ציון שהסכומים מחולקים ב-$\sqrt t$ מתפזרים בלי גבול, ושמחולקים ב-$t$ יש להם התפלגות הקושי של צעד אחד בכל $t$.
            weight: 2
          - text: >-
              השוואה בין שני הכישלונות: אי-תלות מופרת, גאוסית ברוחב הלא נכון; סופיות שונות מופרת, רוחב שגדל כמו $t$, לעולם לא גאוסית.
            weight: 3
          - text: >-
              ציון איזה כישלון נתקלים בו בלי לשים לב, עם נימוק.
            weight: 1
          - text: >-
              בדיקת גבולות: $t = 1$, הפונקציה האופיינית של צעד גאוסי, או התפלגות סטודנט כש-$\nu$ חוצה את $2$, עם המשמעות של כל אחד.
            weight: 2
