# שאלות הבדיקה של שיעור 3.1. הומרו מ-assessment/quizzes/03-random-walks.he.yml של ThermoLab (Q-03-1 … Q-03-10, כל
# העשר) והורחבו כך שיכסו את שש המטרות ואת התפיסות השגויות של src/content/misconceptions/3-1.yaml, ועוד
# MC-lln-compensation ו-MC-scatter-one-over-n (0-1.yaml). ההמרות: Q-03-1 → rms-400; Q-03-2 → strayed-walker (מספרים
# חדשים, הולך מוטה 20 צעדים מאחורי מרכז הענן: גרסת המטבע ההוגן היא הניבוי של השיעור, pred-3-1); Q-03-3 → binomial-sd;
# Q-03-4 → not-a-hypothesis; Q-03-5 → persistent (ההילוך רחב מדי "כש-n גדל", לא "בכל n": ב-n = 1 הוא המטבע, והגורם 19
# הוא ערך של זמנים ארוכים, 9.8 ב-n = 16); Q-03-6 → peak-50; Q-03-7 → widening-cloud והמשוב של Q-03-2, בלי "הולכים
# שסטו ימינה מאוזנים בהולכים שסטו שמאלה", שמסביר את התוחלת האפס בקיזוז; Q-03-8 → quadruple; Q-03-9 → emergence
# (התשובה הנכונה מציינת עכשיו את שתי עובדות הספירה: המסלולים, לצורה, והמיצוע על פני N הולכים, לשחזוריות שלה);
# Q-03-10 → biased-drift. כל מספר חושב מחדש בספרייה של ThermoLab (thermolab.sampling: random_walk, walker_spread,
# binomial_to_gaussian, correlated_walk) ובסכומים בינומיים מדויקים; מספרים מסימולציה הם ממוצעים על פני זרעים רבים, עם
# הפיזור שלהם מזרע לזרע. המזהים משותפים עם הבנק באנגלית, שחייב להכיל את אותן שאלות עם אותן תשובות.
lang: he
chapter: 3
questions:
  # ---------------------------------------------------------------- הולך אחד, ואחר כך ענן
  - id: Q-3.1-same-walker
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-6]
    prompt: >-
      איור 3.1א משרטט תחילה הולך הוגן אחד לבדו, ואחר כך את אותו הולך בין $3999$ אחרים, כולם על אותו שעון. מה משנה הגעתם של האחרים במסלול שלו?
    choices:
      - text: >-
          שום דבר. הצעדים שלו מוגרלים באופן בלתי תלוי בצעדים של כל האחרים, ולכן המסלול שלו הוא בדיוק מה שהיה כשהיה לבדו. מה שהאחרים מוסיפים הוא היסטוגרמה, שהצורה שלה חוזרת זהה מהרצה להרצה, אף שהמיקום שלו אינו חוזר.
        correct: true
        feedback: >-
          נכון. אי-תלות פירושה שהצעדים של שום הולך אינם תלויים באף הולך אחר. הסדר שבאיור הוא תכונה של ההיסטוגרמה של הצבר, לא של מסלול כלשהו.
      - text: >-
          המסלול שלו נמשך אל אמצע ההמון, וזה מה ששומר על ההמון ממורכז סביב פנס הרחוב.
        feedback: >-
          שום דבר במודל אינו מתייחס להמון או לראשית: כל צעד הוא הטלת מטבע חדשה, בכל מקום שבו הוא עומד. ההמון נשאר ממורכז כי ההעתק הצפוי של כל הולך הוא אפס, לא כי מישהו נמשך פנימה.
        misconception: MC-walker-restoring-force
      - text: >-
          הצעדים המאוחרים שלו מפצים עכשיו על ההתרחקויות של הולכים בצד השני, וזה שומר על ההיסטוגרמה סימטרית.
        feedback: >-
          אין לו דרך לדעת מה עשו ההולכים האחרים; המטבע שלו בלתי תלוי במטבעות שלהם. ההיסטוגרמה סימטרית כי ההתפלגות של כל הולך בעצמו סימטרית, לא כי הולך אחד מפצה על אחר.
        misconception: MC-lln-compensation
      - text: >-
          המסלול שלו נעשה צפוי: עם $4000$ הולכים, חוק המספרים הגדולים קובע היכן כל אחד מהם מסתיים.
        feedback: >-
          חוק המספרים הגדולים קובע ממוצעים וחלקים מתוך ההולכים, כמו החלק שמסתיים בטווח של פיזור אחד מנקודת המוצא. הוא אינו אומר דבר על אף אחד מהם, שהמיקום שלו אחרי $1000$ צעדים עדיין מתפזר ב-$\sqrt{1000} = 31.6$.

  # ---------------------------------------------------------------- OBJ-3.1-1: מיקום הוא סכום
  - id: Q-3.1-rms-400
    type: numeric
    level: basic
    objectives: [OBJ-3.1-1]
    prompt: >-
      הולך עושה $400$ צעדים של $+1$ או $-1$, ושני הכיוונים שווי הסתברות. באיזה מרחק מנקודת המוצא הייתם מוצאים אותו בדרך כלל? תנו את הפיזור הריבועי הממוצע $\sigma_1\sqrt t$, בצעדים.
    answer: 20
    unit: steps
    tolerance: 0.02
    correctFeedback: >-
      $\operatorname{Var}(x_t) = \sigma_1^2 t$ עם $\sigma_1 = 1$, ולכן המרחק האופייני הוא $\sqrt{400} = 20$ צעדים. לא $0$: ההילוך אכן מתפזר. ולא $400$: זה המרחק שהיה עובר אילו כל הצעדים היו באותו כיוון, והצעדים מתבטלים זה בזה הרבה יותר פעמים משהם חוברים יחד.
    wrongFeedback: >-
      לצעד הוגן אחד $\mu_1 = 0$ ו-$\sigma_1^2 = \langle s^2 \rangle = 1$. השונויות של צעדים בלתי תלויים מתחברות, ולכן $\operatorname{Var}(x_{400}) = 400$; הפיזור הוא השורש שלה.
    commonWrong:
      - value: 0
        feedback: >-
          זה המיקום הצפוי שלו, $\mu_1 t = 0$. השאלה היא באיזה מרחק ממנו הוא נמצא בדרך כלל: ההילוך מתפזר גם כשאינו נסחף.
      - value: 400
        feedback: >-
          זה המרחק אילו כל $400$ הצעדים היו באותו כיוון, וזה קורה בהסתברות $2 \times 2^{-400}$. השונות היא שגדלה כמו $t$; הפיזור גדל כמו $\sqrt t$.

  - id: Q-3.1-uniform-spread
    type: numeric
    level: mid
    objectives: [OBJ-3.1-1]
    prompt: >-
      כל צעד של הילוך מוגרל באופן אחיד מתוך $[-1, 1]$. מצאו את הפיזור של מיקום ההולך אחרי $t = 300$ צעדים.
    answer: 10
    unit: steps
    tolerance: 0.02
    correctFeedback: >-
      $\mu_1 = 0$ ו-$\sigma_1^2 = \langle s^2 \rangle = \int_{-1}^{1} \tfrac12 s^2\,\mathrm{d}s = \tfrac13$, ולכן הפיזור הוא $\sqrt{300/3} = 10$. במדידה בספרייה של ThermoLab, $16$ זרעים של $5000$ הולכים: $10.01 \pm 0.03$.
    wrongFeedback: >-
      חשבו את השונות של צעד אחד מתוך הצפיפות שלו, $\tfrac12$ על $[-1, 1]$: $\sigma_1^2 = \langle s^2 \rangle - \mu_1^2$. אז הפיזור הוא $\sigma_1\sqrt t$.
    commonWrong:
      - value: 17.32
        feedback: >-
          זה $\sqrt{300}$, כאילו לכל צעד גודל $1$, כמו לצעד של מטבע. צעד אחיד קצר בדרך כלל מ-$1$: השונות שלו היא $\tfrac13$, לא $1$.
      - value: 5.774
        feedback: >-
          זה משתמש ב-$\sigma_1 = \tfrac13$, השונות, במקום בסטיית התקן, $\sigma_1 = 1/\sqrt 3 = 0.577$.
      - value: 8.660
        feedback: >-
          זה משתמש ב-$\sigma_1 = \tfrac12$, הגודל הממוצע של צעד, $\langle |s| \rangle$. הפיזור מחבר שונויות, ואלה נותנות משקל רב יותר לצעדים הארוכים: $\sqrt{\langle s^2 \rangle} = 0.577$.

  - id: Q-3.1-biased-drift
    type: numeric
    level: basic
    objectives: [OBJ-3.1-1]
    prompt: >-
      הולך עושה $400$ צעדים של $\pm 1$, אבל המטבע מוטה: $+1$ בהסתברות $0.6$. מצאו את ההעתק הצפוי שלו, $\mu_1 t$, בצעדים.
    answer: 80
    unit: steps
    tolerance: 0.02
    correctFeedback: >-
      $\mu_1 = (+1)(0.6) + (-1)(0.4) = 0.2$, ולכן $\langle x_{400} \rangle = 80$. השוו לפיזור, $\sigma_1\sqrt{400} = \sqrt{0.96} \times 20 = 19.6$: הסחיפה כבר נמצאת ארבעה פיזורים מנקודת המוצא, והפער ממשיך לגדול, כי האחד גדל כמו $t$ והאחר רק כמו $\sqrt t$. במדידה, $16$ זרעים של $5000$ הולכים: ממוצע של $80.03 \pm 0.07$ ופיזור של $19.62 \pm 0.05$.
    wrongFeedback: >-
      התוחלת של צעד אחד היא $\mu_1 = \sum_s s\,P(s)$, ותוחלות מתחברות: $\langle x_t \rangle = \mu_1 t$.
    commonWrong:
      - value: 240
        feedback: >-
          זה סופר את הצעדים ימינה, $0.6 \times 400$, ושוכח ש-$40\%$ האחרים הולכים שמאלה. $\mu_1 = 0.6 - 0.4 = 0.2$.
      - value: 19.6
        feedback: >-
          זה הפיזור, $\sigma_1\sqrt t$, הרוחב של הענן. השאלה היא לאן הולך המרכז שלו: $\mu_1 t$. אלה שני גדלים נפרדים, עם שני חוקים נפרדים.

  - id: Q-3.1-widening-cloud
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-1, OBJ-3.1-5]
    prompt: >-
      ענן של $N$ הולכים בלי הטיה מתרחב בהתמדה לנגד עיניכם. מה עושה המיקום הממוצע שלו?
    choices:
      - text: >-
          נשאר באפס, בתחום שגיאת תקן $\sigma_1\sqrt{t/N}$ שגדלה בעצמה כמו $\sqrt t$.
        correct: true
        feedback: >-
          נכון, והסייג חשוב. המיקום הצפוי של כל הולך הוא $\mu_1 t = 0$ בכל $t$; הממוצע הנמדד של $N$ מהם מתפזר סביב האפס בשגיאת התקן $\sigma_1\sqrt t/\sqrt N$, ולכן איור 3.1א משרטט סביב האפס רצועה שמתרחבת, ולא קו חשוף.
      - text: >-
          גדל: לענן רחב יותר חייב להיות מיקום ממוצע גדול יותר.
        feedback: >-
          הרוחב והממוצע הם גדלים נפרדים. הענן מתרחב באופן סימטרי סביב האפס, כי המיקום הצפוי של כל הולך נשאר $\mu_1 t = 0$ בזמן שהפיזור גדל כמו $\sigma_1\sqrt t$. הילוך מוטה מראה את הניגוד: שם הממוצע צועד באופן ליניארי, בזמן שהרוחב עדיין גדל רק כמו $\sqrt t$.
        misconception: MC-spread-means-drift
      - text: >-
          גדל כמו $\sqrt t$, כמו הרוחב.
        feedback: >-
          בהילוך בלי הטיה הממוצע אינו גדל כלל: $\langle x_t \rangle = \mu_1 t$ ו-$\mu_1 = 0$. ה-$\sqrt t$ שייך לפיזור בלבד.
        misconception: MC-spread-means-drift
      - text: >-
          אי אפשר לדעת בלי לדעת את הצורה של התפלגות הצעד.
        feedback: >-
          התשובה קבועה: $\langle x_t \rangle = \mu_1 t$ לכל התפלגות צעדים בעלת תוחלת סופית, ולכן "בלי הטיה", $\mu_1 = 0$, כבר נותן אפס, תהיה צורת הצעדים אשר תהיה.

  # ---------------------------------------------------------------- OBJ-3.1-1, -6: שום דבר אינו מושך הולך בחזרה
  - id: Q-3.1-strayed-walker
    type: mc
    level: mid
    objectives: [OBJ-3.1-1, OBJ-3.1-6]
    prompt: >-
      הולכים צועדים $+1$ בהסתברות $0.6$ ו-$-1$ אחרת. אחרי $100$ צעדים מרכז הענן נמצא ב-$+20$, והולך אחד עומד ב-$0$, שני פיזורים מאחוריו. מהו ההעתק הצפוי שלו ב-$50$ הצעדים הבאים, מהמקום שבו הוא עומד עכשיו?
    choices:
      - text: >-
          $+10$
        correct: true
        feedback: >-
          נכון: $\mu_1 \times 50 = 0.2 \times 50$, כמו לכל הולך אחר, בכל מקום שבו הוא עומד. במדידה בספרייה של ThermoLab: מתוך $40\,000$ הולכים כאלה, כ-$1.0\%$ עומדים ב-$0$ אחרי $100$ צעדים (בדיוק $1.03\%$), וב-$50$ הצעדים הבאים שלהם הם זזים בממוצע ב-$9.98 \pm 0.04$ ($64$ מנות). בממוצע הוא אינו מפגר יותר, ואינו סוגר דבר מתוך ה-$20$.
      - text: >-
          $+30$
        feedback: >-
          זה מביא אותו למקום שבו יהיה מרכז הענן ב-$t = 150$, כאילו המפגרים נמשכים בחזרה אל החבורה. המטבע שלו אינו יודע היכן החבורה: כל אחד מהצעדים הבאים שלו הוא $0.2$ בממוצע, בכל מקום שבו הוא עומד.
        misconception: MC-walker-restoring-force
      - text: >-
          $+20$
        feedback: >-
          זה מחזיר אותו למקום שבו נמצא מרכז הענן עכשיו, כאילו הולך שפיגר נמשך אליו. שום דבר במודל אינו מתייחס למרכז; ההעתק הצפוי שלו ב-$m$ צעדים הוא $\mu_1 m$, כאן $10$.
        misconception: MC-walker-restoring-force
      - text: >-
          פחות מ-$+10$: העובדה שפיגר מראה שהוא מגריל יותר צעדים שמאלה מה-$40\%$ של המטבע.
        feedback: >-
          כל ההולכים מטילים אותו מטבע, באופן בלתי תלוי בכל צעד. הצעדים הקודמים שלו היו הגרלה חסרת מזל, והם אינם נושאים שום מידע על הצעדים הבאים שלו.

  # ---------------------------------------------------------------- OBJ-3.1-5: סטייה ושגיאה
  - id: Q-3.1-quadruple
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-5]
    prompt: >-
      אתם מגדילים פי ארבעה את מספר המדידות במדגם, מ-$N$ ל-$4N$. מה קורה לסטיית התקן של הנתונים, ומה לשגיאת התקן של הממוצע שלהם?
    choices:
      - text: >-
          סטיית התקן אינה משתנה; שגיאת התקן קטנה פי שניים.
        correct: true
        feedback: >-
          נכון. סטיית התקן מתארת את הפיזור של ערכים בודדים, ואינה תלויה בכמה מהם הסתכלתם. שגיאת התקן, $\sigma/\sqrt N$, מתארת את אי-הוודאות שלכם לגבי הממוצע, ו-$\sqrt 4 = 2$.
      - text: >-
          שתיהן קטנות פי שניים.
        feedback: >-
          מדידה של יותר ערכים של גודל אינה הופכת אותו לפחות משתנה. אילו כך היה, הפיזור של הערכים הבודדים היה מצטמצם לעין בזמן שאספתם אותם, וזה אינו קורה: $4000$ הולכים וארבעה מיליון מתפזרים לאותו רוחב.
        misconception: MC-deviation-shrinks-with-n
      - text: >-
          שתיהן אינן משתנות.
        feedback: >-
          סטיית התקן אינה משתנה, אבל הממוצע נקבע טוב יותר: שגיאת התקן שלו היא $\sigma/\sqrt N$. אילו היא לא הייתה קטנה, לא הייתה שום סיבה לחזור על מדידה.
      - text: >-
          סטיית התקן קטנה פי שניים; שגיאת התקן אינה משתנה.
        feedback: >-
          זה מחליף בדיוק בין השתיים. כתבו את שתי ההגדרות זו לצד זו: האחת היא תכונה של הנתונים, $\sigma$, והשנייה תכונה של ההערכה שלכם לממוצע שלהם, $\sigma/\sqrt N$.
        misconception: MC-deviation-shrinks-with-n

  - id: Q-3.1-band-width
    type: numeric
    level: mid
    objectives: [OBJ-3.1-5]
    prompt: >-
      ענן של $N = 2500$ הולכים הוגנים של $\pm 1$ עשה $t = 900$ צעדים. מצאו את שגיאת התקן של המיקום הממוצע של הענן.
    answer: 0.6
    unit: steps
    tolerance: 0.02
    correctFeedback: >-
      כל מיקום מתפזר ב-$\sigma = \sigma_1\sqrt t = 30$, והממוצע של $2500$ מהם ב-$30/\sqrt{2500} = 0.6$. במדידה על פני $64$ זרעים: פיזור של $30.04 \pm 0.05$, ו-$64$ הממוצעים מתפזרים ב-$0.57$, מספר שבעצמו אינו ודאי בכ-$9\%$.
    wrongFeedback: >-
      שני שלבים: הפיזור של המיקום של הולך אחד, $\sigma_1\sqrt t$, ואחר כך שגיאת התקן של הממוצע של $N$ מיקומים בלתי תלויים, $\sigma/\sqrt N$.
    commonWrong:
      - value: 30
        feedback: >-
          זה הפיזור של מיקומי ההולכים, שנשאר $30$ יהיה מספר ההולכים אשר יהיה. הממוצע של $2500$ מהם נקבע טוב הרבה יותר: חלקו ב-$\sqrt N$.
      - value: 0.012
        feedback: >-
          זה מחלק ב-$N$. השונות של הממוצע דועכת כמו $1/N$; שגיאת התקן, השורש שלה, דועכת כמו $N^{-1/2}$.
        misconception: MC-scatter-one-over-n
      - value: 0.02
        feedback: >-
          זה $1/\sqrt N$, שגיאת התקן של גודל שסטיית התקן שלו $1$. כאן כל מיקום מתפזר ב-$\sigma_1\sqrt t = 30$, לא בצעד אחד.

  - id: Q-3.1-relative-one-percent
    type: numeric
    level: bagrut
    objectives: [OBJ-3.1-5, OBJ-3.1-1]
    prompt: >-
      עבור המטבע המוטה, $+1$ בהסתברות $0.6$ ו-$-1$ אחרת, אחרי כמה צעדים ירד הפיזור של מיקום ההולך ל-$1\%$ מהתוחלת שלו?
    answer: 240000
    unit: steps
    tolerance: 0.02
    correctFeedback: >-
      $\mu_1 = 0.2$, $\sigma_1^2 = 0.96$, והיחס $\sigma_1\sqrt t/(\mu_1 t) = (\sigma_1/\mu_1)\,t^{-1/2}$ יורד ל-$0.01$ כאשר $t = (\sigma_1/\mu_1)^2 \times 10^4 = 24 \times 10^4$. הפיזור המוחלט הוא אז $\sqrt{0.96 \times 240\,000} = 480$ צעדים, גדול מאי פעם; רק ביחס לתוחלת, $48\,000$, הוא נעשה קטן.
    wrongFeedback: >-
      הפיזור היחסי הוא $\sigma_1\sqrt t/(\mu_1 t) = (\sigma_1/\mu_1)\,t^{-1/2}$. השוו אותו ל-$0.01$ וחלצו את $t$, עם $\sigma_1^2 = 1 - \mu_1^2$.
    commonWrong:
      - value: 250000
        feedback: >-
          זה לוקח $\sigma_1 = 1$, כמו במטבע ההוגן. צעד מוטה משתנה פחות: $\sigma_1^2 = \langle s^2 \rangle - \mu_1^2 = 1 - 0.04 = 0.96$.
      - value: 490
        feedback: >-
          זה פותר את $\sqrt t = (\sigma_1/\mu_1)/0.01$ ונעצר: $490$ הוא $\sqrt t$. העלו בריבוע.
      - value: 2400
        feedback: >-
          זה מחלק את $(\sigma_1/\mu_1)^2$ ב-$0.01$ במקום ב-$0.01^2$. העלאת התנאי $(\sigma_1/\mu_1)\,t^{-1/2} = 0.01$ בריבוע מעלה בריבוע גם את ה-$0.01$.

  # ---------------------------------------------------------------- OBJ-3.1-2: הילוך המטבע הוא בינומי
  - id: Q-3.1-binomial-sd
    type: numeric
    level: basic
    objectives: [OBJ-3.1-2]
    prompt: >-
      עבור ההתפלגות הבינומית עם $n = 100$ ניסויים ו-$p = \tfrac12$, מצאו את סטיית התקן של מספר ההצלחות, $\sqrt{np(1 - p)}$.
    answer: 5
    unit: ''
    tolerance: 0.02
    correctFeedback: >-
      $\sqrt{100 \times 0.5 \times 0.5} = 5$: מספר הפעמים עץ ב-$100$ הטלות הוא $50 \pm 5$. לכן המיקום של ההולך, $x = 2k - n$, מתפזר ב-$2 \times 5 = 10 = \sqrt{100}$, ה-$\sigma_1\sqrt t$ של ההילוך.
    wrongFeedback: >-
      $\operatorname{Var}(k) = np(1 - p)$; סטיית התקן היא השורש שלה.
    commonWrong:
      - value: 25
        feedback: >-
          זו השונות, $np(1 - p)$. סטיית התקן היא השורש שלה.
      - value: 10
        feedback: >-
          זה הפיזור של המיקום של ההולך, $x = 2k - n$, כפול מזה של $k$. השאלה היא על $k$, מספר ההצלחות.
      - value: 50
        feedback: >-
          זו התוחלת, $np$. סטיית התקן מודדת את הפיזור סביבה.

  - id: Q-3.1-position-sd
    type: numeric
    level: mid
    objectives: [OBJ-3.1-2]
    prompt: >-
      הולך עושה $n = 50$ צעדים של $\pm 1$, $+1$ בהסתברות $p = 0.7$. המיקום שלו הוא $x = 2k - n$, כאשר $k$ הוא מספר הצעדים ימינה. מצאו את סטיית התקן של $x$.
    answer: 6.481
    unit: steps
    tolerance: 0.01
    correctFeedback: >-
      $\operatorname{Var}(k) = np(1 - p) = 10.5$, ו-$\operatorname{Var}(2k - n) = 4\operatorname{Var}(k) = 42$, ולכן $\sigma_x = 6.48$. אותו דבר מתוך הצעד: $\sigma_1^2 = 1 - (2p - 1)^2 = 0.84$ ו-$\sigma_1\sqrt{50} = 6.48$.
    wrongFeedback: >-
      מצאו את $\operatorname{Var}(k)$ של הבינומית, ואז השתמשו ב-$\operatorname{Var}(aX + c) = a^2\operatorname{Var}(X)$ עם $a = 2$, $c = -n$.
    commonWrong:
      - value: 3.240
        feedback: >-
          זה $\sigma_k = \sqrt{10.5}$, הפיזור של מספר הצעדים ימינה. כל צעד ימינה נוסף הוא צעד שמאלה אחד פחות, ולכן הוא מזיז את $x$ ב-$2$: $\sigma_x = 2\sigma_k$.
      - value: 7.071
        feedback: >-
          זה $\sqrt{50}$, הפיזור של המטבע ההוגן. הצעדים של מטבע מוטה משתנים פחות: $\sigma_1^2 = 4p(1 - p) = 0.84$, לא $1$.
      - value: 4.583
        feedback: >-
          זה לוקח $\operatorname{Var}(2k) = 2\operatorname{Var}(k)$. גורם בתוך השונות יוצא ממנה בריבוע: $\operatorname{Var}(2k) = 4\operatorname{Var}(k)$.

  - id: Q-3.1-four-right
    type: numeric
    level: mid
    objectives: [OBJ-3.1-2]
    prompt: >-
      הולך הוגן של $\pm 1$ עושה $10$ צעדים. מהי ההסתברות שהוא מסיים ב-$x = +4$?
    answer: 0.1172
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      $x = 2k - n = 4$ דורש $k = 7$ צעדים ימינה מתוך $10$, ולכן $P = \binom{10}{7}/2^{10} = 120/1024 = 0.117$. לכל סדרה של עשר הטלות אותה הסתברות, $2^{-10}$; ב-$120$ מהן יש שבעה צעדים ימינה.
    wrongFeedback: >-
      תרגמו את המיקום למספר של צעדים ימינה בעזרת $x = 2k - n$, ואז השתמשו ב-$P(k) = \binom{n}{k}p^k(1 - p)^{n - k}$.
    commonWrong:
      - value: 0.2051
        feedback: >-
          זה $\binom{10}{4}/2^{10}$, ההסתברות לארבעה צעדים ימינה. ארבעה צעדים ימינה ושישה שמאלה מסתיימים ב-$x = -2$; $x = +4$ דורש $k = (x + n)/2 = 7$.
      - value: 0.0009766
        feedback: >-
          זה $2^{-10}$, ההסתברות של סדרה מסוימת אחת. סדרות רבות מסתיימות ב-$+4$: $\binom{10}{7} = 120$ מהן.

  - id: Q-3.1-routes
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-3.1-2, OBJ-3.1-6]
    prompt: >-
      אחרי $100$ צעדים הוגנים, הסיכוי שהולך יעמוד ב-$x = 0$ גדול בערך פי $10^{29}$ מהסיכוי שיעמוד ב-$x = 100$. מדוע?
    choices:
      - text: >-
          לכל אחת מ-$2^{100}$ סדרות הצעדים אותה הסתברות, ו-$\binom{100}{50} \approx 1.0 \times 10^{29}$ מהן מסתיימות ב-$0$, בעוד שאחת מסתיימת ב-$100$.
        correct: true
        feedback: >-
          נכון. האמצע גבוה כי מגיעים אליו מסלולים רבים לאין שיעור, לא כי מסלול כלשהו מועדף. מודול 8 קורא את אותה ספירה כמספר המיקרו-מצבים של מאקרו-מצב.
      - text: >-
          הולך רחוק מהראשית נמשך בחזרה, ולכן המסלולים שבורחים מדוכאים.
        feedback: >-
          שום צעד אינו תלוי במקום שבו ההולך עומד. למסלול של מאה צעדים ימינה יש הסתברות $2^{-100}$, בדיוק כמו לכל מסלול אחר; פשוט יש רק אחד כזה.
        misconception: MC-walker-restoring-force
      - text: >-
          סדרה שמערבבת צעדים שמאלה וימינה סבירה יותר, כשלעצמה, ממאה צעדים ימינה ברצף.
        feedback: >-
          לכל סדרה מסוימת, מעורבת או לא, הסתברות $2^{-100}$; מאה צעדים ימינה ברצף סבירים בדיוק כמו כל סדרה מעורבת נתונה אחת. מה ששונה הוא כמה סדרות מסתיימות בכל מקום.
      - text: >-
          רצף של צעדים ימינה מתבטל אחר כך ברצף של צעדים שמאלה, שמחזיר את ההולך לכיוון $0$.
        feedback: >-
          למטבע אין זיכרון: אחרי רצף של צעדים ימינה הצעד הבא הוא עדיין $\pm 1$ בסיכויים שווים, והעודף לעולם אינו מוחזר. סיום בקרבת $0$ נפוץ כי מסלולים רבים מסתיימים שם, לא כי ההילוך מתקן את עצמו.
        misconception: MC-lln-compensation

  # ---------------------------------------------------------------- OBJ-3.1-4: הגשר של דה-מואבר-לפלס
  - id: Q-3.1-peak-50
    type: numeric
    level: basic
    objectives: [OBJ-3.1-4]
    prompt: >-
      השתמשו בקירוב דה-מואבר-לפלס כדי להעריך את ההסתברות לבדיוק $50$ פעמים עץ ב-$100$ הטלות של מטבע הוגן: חשבו את $1/\sqrt{2\pi npq}$ ב-$n = 100$, $p = q = \tfrac12$, בארבע ספרות משמעותיות.
    answer: 0.07979
    unit: ''
    tolerance: 0.002
    correctFeedback: >-
      $1/\sqrt{2\pi \times 25} = 1/\sqrt{50\pi} = 0.07979$. הערך המדויק הוא $\binom{100}{50}/2^{100} = 0.07959$, ולכן הקירוב גבוה ברבע אחוז בשיא. ב-$90$ פעמים עץ הוא גדול מדי פי $74$: זו טענה על האזור המרכזי, לא על הזנבות.
    wrongFeedback: >-
      בשיא האקספוננט שווה $1$, וההערכה היא הגורם שלפניו, $1/\sqrt{2\pi\sigma_k^2}$ עם $\sigma_k^2 = npq = 25$.
    commonWrong:
      - value: 0.05642
        feedback: >-
          זה משתמש בשונות $np = 50$, בלי הגורם $q$. השונות של הבינומית היא $npq = 25$.
      - value: 0.03989
        feedback: >-
          זה משתמש בשונות של מיקום ההולך, $n = 100$, כאילו הגאוסית הייתה צפיפות ב-$x$. למספר הפעמים עץ, $k$, יש שונות $npq = 25$; צפיפות ב-$x$ הייתה צריכה את מרווח הסריג $2$ כדי לתת הסתברות.
      - value: 0.07959
        feedback: >-
          זה הערך הבינומי המדויק, $\binom{100}{50}/2^{100}$. השאלה מבקשת את הקירוב, שגבוה ממנו ב-$0.25\%$.

  - id: Q-3.1-k210
    type: numeric
    level: mid
    objectives: [OBJ-3.1-4]
    prompt: >-
      העריכו בעזרת הגאוסית של דה-מואבר-לפלס את ההסתברות לבדיוק $210$ פעמים עץ ב-$400$ הטלות של מטבע הוגן.
    answer: 0.02420
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      $np = 200$, $npq = 100$, $\sigma_k = 10$, ולכן $k = 210$ נמצא סטיית תקן אחת מהמרכז: $e^{-1/2}/(10\sqrt{2\pi}) = 0.6065 \times 0.03989 = 0.02420$. הערך הבינומי המדויק הוא $0.024207$, במרחק $0.04\%$: סטיית תקן אחת מהמרכז, הגשר מצוין.
    wrongFeedback: >-
      $P(k) \approx e^{-(k - np)^2/(2npq)}/\sqrt{2\pi npq}$, עם $np = 200$ ו-$npq = 100$.
    commonWrong:
      - value: 0.02197
        feedback: >-
          זה משתמש בשונות $np = 200$ במקום $npq = 100$.
      - value: 0.01468
        feedback: >-
          זה משמיט את ה-$2$ מהמעריך: $e^{-1}$ במקום $e^{-(k - np)^2/(2npq)} = e^{-1/2}$.
      - value: 0.03989
        feedback: >-
          זה הגובה בשיא, $k = 200$. ב-$k = 210$ הגאוסית כבר הוכפלה בגורם $e^{-1/2}$.

  - id: Q-3.1-peak-error
    type: numeric
    level: bagrut
    objectives: [OBJ-3.1-4]
    prompt: >-
      עבור $100$ הטלות של מטבע הוגן, ההערכה של דה-מואבר-לפלס ל-$P(50)$ גבוהה ב-$0.25\%$. במטבע הוגן השגיאה היחסית בשיא היא מסדר $1/n$. העריכו אותה, באחוזים, עבור $1600$ הטלות.
    answer: 0.01563
    unit: '%'
    tolerance: 0.03
    correctFeedback: >-
      פי שישה עשר הטלות, שגיאה קטנה פי שישה עשר: $0.25\%/16 = 0.0156\%$, כלומר $1/(4n)$. גם ההשוואה המדויקת מתוך הבינומית נותנת $0.0156\%$. במטבע הוגן, האיבר בפיתוח שהיה נותן שגיאה מסדר $n^{-1/2}$ הוא מסדר שלישי ב-$k - np$, עם מקדם יחסי ל-$q - p$, והוא מתאפס.
    wrongFeedback: >-
      שגיאה מסדר $1/n$ קטנה באותו גורם שבו $n$ גדל.
    commonWrong:
      - value: 0.0625
        feedback: >-
          זה משנה את השגיאה כמו $n^{-1/2}$, פי $4$ פחות עבור פי שישה עשר הטלות. זה הקצב כאשר $p \ne \tfrac12$; במטבע הוגן האיבר מסדר $n^{-1/2}$ מתבטל מטעמי סימטריה, והשגיאה דועכת כמו $1/n$.
      - value: 0.25
        feedback: >-
          השגיאה אינה נשארת במקומה: הקירוב נעשה מדויק בקרבת השיא כש-$n$ גדל, עם שגיאה מסדר $1/n$ במטבע הוגן.

  - id: Q-3.1-tails
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-3.1-4]
    prompt: >-
      עבור $100$ הטלות של מטבע הוגן, היכן אפשר לסמוך על הגאוסית של דה-מואבר-לפלס?
    choices:
      - text: >-
          באזור המרכזי, כמה סטיות תקן לכל צד של $50$. רחוק משם, בחלק קבוע של הטלות עץ, כמו $90$, היא שגויה בגורם גדול, והגורם גדל עם מספר ההטלות.
        correct: true
        feedback: >-
          נכון. ב-$n = 100$ הגאוסית נמוכה ב-$0.4\%$ במרחק שתי סטיות תקן, גבוהה ב-$16\%$ במרחק ארבע וגבוהה ב-$55\%$ במרחק חמש; ב-$90$ פעמים עץ, שמונה סטיות תקן מהמרכז, היא נותנת $1.0 \times 10^{-15}$ לעומת הערך המדויק $1.37 \times 10^{-17}$, פי $74$ יותר מדי. אירועים נדירים דורשים את הספירה המדויקת.
      - text: >-
          בכל מקום: עם $100$ הטלות היא בטווח של רבע אחוז מההסתברות המדויקת לכל $k$.
        feedback: >-
          רבע האחוז הוא השגיאה בשיא. השגיאה היחסית גדלה ככל שמתרחקים ממנו: $16\%$ במרחק ארבע סטיות תקן, ופי $74$ ב-$90$ פעמים עץ.
      - text: >-
          הכי טוב בזנבות, ששם שתי ההסתברויות זעירות וההפרש ביניהן זניח.
        feedback: >-
          ההפרש המוחלט אכן זעיר שם, אבל כך גם ההסתברות; ביחס אליה, השגיאה גדולה ביותר בזנבות. הסתברות של $10^{-17}$ שמוערכת כ-$10^{-15}$ שגויה פי $74$.
      - text: >-
          בכל מקום, בתנאי שמספר ההטלות גדול מספיק: בחלק קבוע של הטלות עץ, כמו $90\%$, השגיאה קטנה כש-$n$ גדל.
        feedback: >-
          במספר קבוע של סטיות תקן השגיאה אכן קטנה עם $n$. בחלק קבוע של ההטלות היא גדלה: שתי ההסתברויות דועכות באופן מעריכי ב-$n$, עם מעריכים שההפרש ביניהם יחסי ל-$n$, ולכן היחס ביניהן בורח.

  # ---------------------------------------------------------------- OBJ-3.1-3: משפט הגבול המרכזי והנחותיו
  - id: Q-3.1-not-a-hypothesis
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-3]
    prompt: >-
      איזו מהטענות הבאות **אינה** הנחה של משפט הגבול המרכזי, כפי שהשיעור מנסח אותו?
    choices:
      - text: >-
          הצעדים הבודדים הם עצמם גאוסיים.
        correct: true
        feedback: >-
          נכון, וזה כל הטעם של המשפט. אילו הצעדים היו צריכים להיות גאוסיים מראש, הוא כמעט לא היה אומר דבר. מטבעות, הגרלות אחידות, הגרלות בעלות זנב כבד: כל דבר בעל שונות סופית נותן סכום גאוסי.
      - text: >-
          הצעדים בלתי תלויים זה בזה.
        feedback: >-
          זו הנחה, וזו ההנחה שההילוך המתמיד מפר: בלעדיה השונויות המשותפות כבר אינן מתאפסות, השונויות כבר אינן פשוט מתחברות, והסכום רחב יותר מ-$\sigma_1\sqrt n$.
      - text: >-
          כל הצעדים מוגרלים מאותה התפלגות.
        feedback: >-
          זו הנחה של הניסוח שבשיעור. משפטים בעלי תנאים חלשים יותר מרפים אותה, בתנאי שאף צעד אינו שולט, אבל אלה משפטים אחרים, עם תנאים משלהם שיש לבדוק.
      - text: >-
          להתפלגות הצעד יש שונות סופית.
        feedback: >-
          זו הנחה, וצעדי קושי מפרים אותה: הסכום שלהם מתפזר כמו $t$, לא כמו $\sqrt t$, וכשמחלקים אותו ב-$\sqrt t$ הוא לעולם אינו מתייצב.

  - id: Q-3.1-which-sums
    type: multi
    level: bagrut
    objectives: [OBJ-3.1-3]
    prompt: >-
      סמנו כל סכום $S_n = s_1 + \cdots + s_n$ שהאיברים שלו מקיימים את כל ההנחות של משפט הגבול המרכזי, כפי שהשיעור מנסח אותו.
    choices:
      - text: >-
          המספרים שמתקבלים ב-$n$ הטלות בלתי תלויות של קובייה הוגנת.
        correct: true
        feedback: >-
          בלתי תלויים, בעלי אותה התפלגות, עם שונות $35/12$: כל ההנחות מתקיימות.
      - text: >-
          צעדי $\pm 1$ של מטבע מוטה, $+1$ בהסתברות $0.6$, באופן בלתי תלוי.
        correct: true
        feedback: >-
          הטיה אינה הנחה מופרת: המשפט מתיר כל תוחלת סופית $\mu_1$, כאן $0.2$, ומחסר $n\mu_1$ לפני שהוא מתקנן.
      - text: >-
          הגרלות בלתי תלויות מהתפלגות סטודנט עם חמש דרגות חופש.
        correct: true
        feedback: >-
          זנבות כבדים, אבל שונות סופית, $5/3$: ההנחות מתקיימות, והסכומים המתוקננים אכן מגיעים לגאוסית, לאט יותר מצעדים אחידים.
      - text: >-
          צעדי $\pm 1$ של הילוך מתמיד שחוזר על הצעד הקודם שלו בהסתברות $0.5$.
        feedback: >-
          כל צעד עדיין $\pm 1$ בסיכויים שווים, ולכן לצעדים אותה התפלגות ושונות סופית, אבל הם אינם בלתי תלויים. כשמתקננים ב-$\sqrt n$, הסכומים נשארים במרחק קבוע מהגאוסית.
        misconception: MC-clt-always-applies
      - text: >-
          צעדי קושי בלתי תלויים, בצפיפות $1/[\pi(1 + s^2)]$.
        feedback: >-
          בלתי תלויים ובעלי אותה התפלגות, אבל בלי שונות סופית. הסכום שלהם הוא שוב התפלגות קושי, רחבה פי $n$, ולעולם אינו גאוסי.
        misconception: MC-clt-always-applies
      - text: >-
          צעדים בלתי תלויים $s_i = \pm 2^i$, כל סימן בהסתברות $\tfrac12$.
        feedback: >-
          אין להם אותה התפלגות, וגרוע מכך, הצעד האחרון שולט: הוא לבדו נושא שלושה רבעים מהשונות של הסכום. הסכום מפוזר באופן שווה על הסריג שלו, התפלגות שטוחה בכל $n$, לא גאוסית. משפטים לצעדים שאינם זהים דורשים שאף אחד מהם לא ישלוט, וכאן אחד שולט.
        misconception: MC-clt-always-applies

  - id: Q-3.1-persistent
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-3.1-3]
    prompt: >-
      הילוך של $\pm 1$ חוזר על הצעד הקודם שלו בהסתברות $0.9$, ואחרת מגריל צעד חדש. הסכומים שלו, מתוקננים ב-$\sigma_1\sqrt n$ עם $\sigma_1 = 1$, מושווים לגאוסית הסטנדרטית כש-$n$ גדל. מה קורה, ומדוע?
    choices:
      - text: >-
          ההיסטוגרמה רחבה מדי, ונשארת רחבה מדי כש-$n$ גדל: אי-התלות מופרת, ולכן השונויות כבר אינן פשוט מתחברות.
        correct: true
        feedback: >-
          נכון. לצעדים עדיין אותה התפלגות ושונות סופית; רק אי-התלות נעלמה. בזמנים ארוכים $\operatorname{Var}(x_t) = t(1 + q)/(1 - q) = 19t$, ולכן $\sqrt n$ מעריך את הרוחב בחסר פי $\sqrt{19} = 4.4$, והמרחק מהגאוסית נתקע בסביבות $0.31$ במקום לרדת אל רצפת הדגימה. (ב-$n = 16$, כשההילוך עדיין קצר ביחס לזיכרון שלו, הגורם המדויק הוא רק $9.8$.)
      - text: >-
          ההיסטוגרמה מתלכדת עם הגאוסית בכל זאת; היא רק צריכה עוד צעדים.
        feedback: >-
          היא אינה מתלכדת. "כל סכום של איברים מקריים רבים הוא גאוסי" הוא הרפלקס שההילוך המתמיד קיים כדי להפריך: המרחק שלו מהגאוסית הסטנדרטית מפסיק לרדת, $0.35$ ב-$n = 16$ ו-$0.31$ ב-$n = 256$, יהיה $n$ גדול ככל שיהיה.
        misconception: MC-clt-always-applies
      - text: >-
          ההיסטוגרמה מאבדת את צורת הפעמון: מופיעים בה שני שיאים.
        feedback: >-
          הצורה אינה מה שנשבר. בזמנים ארוכים ההילוך המתמיד עדיין גאוסי; הרוחב הוא מה שהנוסחה של צעדים בלתי תלויים טועה בו. כשמתקננים אותו בשונות האמיתית שלו, הוא מתלכד עם הגאוסית.
      - text: >-
          שום דבר אינו משתנה, שהרי כל צעד עדיין $\pm 1$ בהסתברויות שוות.
        feedback: >-
          ההתפלגות של צעד אחד אכן אינה משתנה, וזה מה שהופך את דוגמת הנגד הזו לחדה. מה שהשתנה הוא האופן שבו הצעדים תלויים זה בזה, והשונות של סכום תלויה בכך דרך השונויות המשותפות.
        misconception: MC-clt-always-applies

  - id: Q-3.1-cauchy
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-3.1-3]
    prompt: >-
      הילוך עושה צעדים בלתי תלויים מהתפלגות קושי, שצפיפותה $1/[\pi(1 + s^2)]$. מה עושים הסכומים שלו, מחולקים ב-$\sqrt n$, כש-$n$ גדל?
    choices:
      - text: >-
          הם לעולם אינם מתייצבים: הם מתפזרים יותר ויותר, כמו $\sqrt n$, כי הסכום של $n$ צעדי קושי הוא התפלגות קושי רחבה פי $n$. ההנחה המופרת היא סופיות השונות.
        correct: true
        feedback: >-
          נכון. הצעדים בלתי תלויים ובעלי אותה התפלגות, אבל $\langle s^2 \rangle$ מתבדר. כשמחלקים ב-$n$ במקום זאת, לסכומים יש אותה התפלגות קושי בכל $n$: גבול, אבל לא גאוסי.
      - text: >-
          הם מתלכדים עם הגאוסית, לאט יותר מצעדי סטודנט בעלי הזנב הכבד, כי הזנבות שלהם כבדים יותר.
        feedback: >-
          זנבות כבדים יותר מאטים את ההתלכדות רק כל עוד השונות סופית. הזנבות של קושי כבדים מספיק כדי שהשונות תהיה אינסופית, ואז אין שום התלכדות: הסכום נשאר התפלגות קושי בכל $n$.
        misconception: MC-clt-always-applies
      - text: >-
          הם נשארים רחבים מדי בגורם קבוע, כמו הסכומים של ההילוך המתמיד.
        feedback: >-
          כך נכשל הילוך שאי-התלות שלו נשברה: גאוסית ברוחב הלא נכון. צעדי קושי נכשלים אחרת: אין $\sigma_1$ לתקנן בו, הענן מתרחב כמו $n$ ולא כמו $\sqrt n$, והצורה אינה גאוסית.
      - text: >-
          הם מתייצבים על הגאוסית, כי הצעדים בלתי תלויים ובעלי אותה התפלגות, ואלה ההנחות שחשובות.
        feedback: >-
          גם סופיות השונות היא הנחה, לא עניין טכני. בלעדיה $\sigma_1\sqrt n$ אינו מוגדר, והסכום של $n$ צעדי קושי הוא התפלגות קושי רחבה פי $n$ בכל $n$.
        misconception: MC-clt-always-applies

  # ---------------------------------------------------------------- OBJ-3.1-6: מהיכן בא הסדר
  - id: Q-3.1-emergence
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-3.1-6]
    prompt: >-
      עשרת אלפים הולכים הוגנים ובלתי תלויים מייצרים היסטוגרמה חלקה בצורת פעמון, שחוזרת זהה בכל הרצה. איזה הסבר למקור הסדר הזה נכון?
    choices:
      - text: >-
          שתי עובדות של ספירה. הרבה יותר סדרות צעדים מסתיימות בקרבת האמצע מאשר רחוק ממנו, ולכל סדרה אותה הסתברות, וזה קובע את הצורה של ההתפלגות של הולך אחד; והגובה של כל עמודה הוא ממוצע על פני $N$ הולכים בלתי תלויים, שמתייצב בקצב של $N^{-1/2}$.
        correct: true
        feedback: >-
          נכון. הצורה היא ספירה של מסלולים, והשחזוריות היא החוק של שיעור 0.1, מוחל על החלק של ההולכים בכל עמודה. שום דבר אינו מכוון הולך, ואף הולך אינו יודע דבר על אחר.
      - text: >-
          הולכים שהתרחקו יותר מדי נמשכים בחזרה, וזה שומר על ההתפלגות ממורכזת.
        feedback: >-
          אין מנגנון כזה, והבדיקה ישירה: מתוך $40\,000$ הולכים הוגנים, אלה שעומדים ב-$+30$ או הלאה ממנו אחרי $500$ צעדים זזים ב-$500$ הצעדים הבאים שלהם ב-$-0.04 \pm 0.04$ ($64$ מנות), כלומר אפס. הצבר מתייצב בדילול, לעולם לא בתיקון.
        misconception: MC-walker-restoring-force
      - text: >-
          הצעדים של ההולכים מתבטלים בממוצע, ולכן כל הולך מסיים בקרבת הראשית.
        feedback: >-
          כל הולך אינו מסיים בקרבת הראשית: המרחק האופייני הוא $\sigma_1\sqrt t$, והוא גדל בלי גבול. מה שמתייצב הוא ההיסטוגרמה של הצבר, לא המיקום של הולך כלשהו.
      - text: >-
          כשיש מספיק הולכים, עודף בצד אחד מתקזז על ידי הולכים מאוחרים יותר שנוחתים בצד השני.
        feedback: >-
          ההולכים בלתי תלויים, ולכן אף הולך אינו יכול לפצות על אחר; להולך מאוחר אין שום דרך לדעת מה עשו הקודמים. זה כשל הפיצוי של שיעור 0.1, מועבר מהזמן אל הצבר.
        misconception: MC-lln-compensation

  - id: Q-3.1-bar-scatter
    type: numeric
    level: bagrut
    objectives: [OBJ-3.1-6, OBJ-3.1-5]
    prompt: >-
      עמודה אחת בהיסטוגרמה של ההולכים מכילה, בממוצע, חלק $f = 0.2$ מההולכים. עם $N = 10\,000$ הולכים, מהו הפיזור של העמודה הזו מהרצה להרצה, כחלק מהגובה שלה עצמה?
    answer: 0.02
    unit: ''
    tolerance: 0.05
    correctFeedback: >-
      הגובה של העמודה הוא הממוצע של $N$ תוצאות בלתי תלויות של כן או לא, שלכל אחת מהן שונות $f(1 - f)$, ולכן הוא מתפזר ב-$\sqrt{f(1 - f)/N} = 0.004$, חלק $\sqrt{(1 - f)/(fN)} = 0.02$ מ-$f$. במדידה: החלק של ההולכים ההוגנים שנמצאים ב-$x \ge 18$ אחרי $400$ צעדים (בדיוק $0.1977$), ב-$64$ הרצות של $10\,000$ הולכים, מתפזר ב-$1.85\%$ מעצמו, לעומת $2.0\%$ החזויים; הפיזור של $64$ מספרים אינו ודאי בעצמו בכ-$9\%$.
    wrongFeedback: >-
      כל הולך נמצא בעמודה או לא: הגרלה של כן או לא בעלת תוחלת $f$ ושונות $f(1 - f)$. הגובה של העמודה הוא הממוצע של $N$ הגרלות כאלה; מצאו את שגיאת התקן שלו וחלקו ב-$f$.
    commonWrong:
      - value: 0.004
        feedback: >-
          זה הפיזור המוחלט של החלק, $\sqrt{f(1 - f)/N}$. ביחס לגובה של העמודה עצמה, $0.2$, הוא גדול פי חמישה.
      - value: 0.01
        feedback: >-
          זה $1/\sqrt N$. בעמודה יש רק כ-$fN = 2000$ מההולכים, והמספר שלהם הוא שמתפזר: ביחס לעמודה, $\sqrt{(1 - f)/(fN)} = 0.02$.
      - value: 0.02236
        feedback: >-
          זה $1/\sqrt{fN}$, הפיזור של מניין שאין לו גבול עליון. הולך שנמצא בעמודה הוא הולך שחסר באחרות, ולכן בשונות יש גורם $1 - f$: $\sqrt{0.8/2000} = 0.020$.
