# שאלות הבדיקה של שיעור 2.1. הומרו מ-assessment/quizzes/02-equations-of-state.he.yml של ThermoLab (Q-02-1 … Q-02-8, כל
# השמונה) והורחבו כך שיכסו את שש המטרות ואת התפיסות השגויות של src/content/misconceptions/2-1.yaml, ועוד
# MC-doubling-doubles-everything (4-1.yaml). ההמרות: Q-02-1 → state-postulate (זוג הדוגמה הוא T ו-v, לא P ו-T, שאינם
# בלתי תלויים על הקטע השטוח של ההתעבות); Q-02-2 → join-bottles; Q-02-3 → classroom (מספרים חדשים: דוגמה 1 של השיעור היא
# החדר של ThermoLab); Q-02-4 → co2-gauge; Q-02-5 → co2-vdw-deviation; Q-02-6 → critical-volume ו-circular-check (ההסכמה
# שלה ב-T_c מעגלית: הקבועים שבטבלאות מחושבים מהנקודה הקריטית, ולכן המבחן הוא v_c); Q-02-7 → same-z (מנוסחת מעל T_c,
# שם ל-(T_r, P_r) יש v_r אחד); Q-02-8, שאלה פתוחה קצרה, → why-fold, רב-ברירה, בלי "בעיה 5(ד)" שאינה קיימת ובלי הטענה
# ש-b = 0 מבטל את הקפל. כל מספר חושב מחדש בספרייה של ThermoLab (thermolab.gases) וב-numpy. נתוני חומרים ממשיים: NIST
# Chemistry WebBook, SRD 69 (CO₂ ב-280 K: האיזותרמה של ספאן–וגנר; הנקודות הקריטיות של CO₂ ושל O₂ מדפי הזורם). קבועי CO₂
# שבטבלה, a_m = 0.3640, b_m = 4.267e-5, הם של CRC Handbook of Chemistry and Physics (3.640 bar L²/mol², 0.04267 L/mol),
# אלה ש-Q-02-6 של ThermoLab המיר. המזהים משותפים עם הבנק באנגלית, שחייב להכיל את אותן שאלות עם אותן תשובות.
lang: he
chapter: 2
questions:
  # ---------------------------------------------------------------- המשטח (חקירה, סיבוב)
  - id: Q-2.1-three-volumes
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      כשמסובבים את משטח ואן דר ואלס של איור 2.1א ומביטים לאורך ציר $v$, הוא מתקפל על עצמו מתחת ל-$T_c$, ובתוך הטריז המשטח עובר שלוש פעמים מעל זוג $(P, T)$ אחד. איזו טענה נכונה?
    choices:
      - text: >-
          מעל כל $(v, T)$ יש עדיין לחץ אחד, כפי שמשוואה $P(v, T)$ חייבת לתת. הנפח, ב-$P$ וב-$T$ נתונים, הוא שיש לו שלושה ערכים.
        correct: true
        feedback: >-
          נכון. המשטח חד-ערכי כגובה מעל רצפת $(v, T)$, ורב-ערכי רק במבט מדופן $P$–$T$. שתי צפיפויות באותו לחץ ובאותה טמפרטורה הן בדיוק נוזל והאדים שלו; השלישית, האמצעית, נמצאת על הקטע שבו $(\partial P/\partial v)_T > 0$, והיא אינה מצב יציב.
      - text: >-
          בנקודות האלה המשטח נותן שלושה לחצים ל-$(v, T)$ אחד.
        feedback: >-
          $P = k_BT/(v - b) - a/v^2$ מחזירה מספר אחד לכל $v$ ו-$T$; שום משוואה מהצורה הזו אינה יכולה לתת שלושה. ספרו שוב מהצד השני: זוג $(P, T)$ אחד הוא שמתקבל בשלושה נפחים.
      - text: >-
          שלושת הנפחים הם המוצק, הנוזל והגז.
        feedback: >-
          במודל ואן דר ואלס אין מוצק. מבין שלושת הנפחים, שני החיצוניים הם זורם צפוף וזורם דליל, המועמדים להיות נוזל ואדים; האמצעי נמצא על הקטע שבו $(\partial P/\partial v)_T > 0$, שבו אף מצב אינו יציב.
      - text: >-
          גז שנדחס בטמפרטורה הזו עובר דרך שלושת הנפחים בזה אחר זה, והלחץ שלו עולה, יורד ועולה שוב לאורך הקפל.
        feedback: >-
          זו האיזותרמה של המשוואה החשופה, לא מה שחומר עושה. CO₂ ממשי שנדחס מתחת ל-$T_c$ שומר על לחץ קבוע בזמן שהוא מתעבה; על הקטע שבו לחץ ואן דר ואלס עולה עם הנפח אין מצב יציב. מה בא במקום ההתפתלות הוא הנושא של מודול 14.
        misconception: MC-vdw-loop-is-real

  # ---------------------------------------------------------------- OBJ-2.1-1: הנחת המצב
  - id: Q-2.1-state-postulate
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      הנחת המצב אומרת שמצבי שיווי המשקל של חומר דחיס פשוט מרכיבים משטח דו-ממדי יחיד במרחב $(P, v, T)$. אתם מקבעים שני משתנים אינטנסיביים בלתי תלויים, למשל $T$ ו-$v$. מה אומרת ההנחה על השאר?
    choices:
      - text: >-
          $P$, וכל תכונת שיווי משקל אחרת, כבר נקבעו: שני הערכים מסמנים נקודה אחת על המשטח, ולנקודה לא נותר שום חופש.
        correct: true
        feedback: >-
          נכון. זו המשמעות של משטח דו-ממדי: שתי קואורדינטות ממקמות נקודה עליו, והשלישית נקראת ממנו ולא נבחרת. משוואת המצב היא המשוואה של המשטח הזה.
      - text: >-
          $P$, $v$ ו-$T$ הם שלושה כפתורים בלתי תלויים, ולכן עדיין צריך למדוד את $P$ בנפרד.
        feedback: >-
          זה בדיוק מה שההנחה שוללת. אילו $P$, $v$ ו-$T$ היו בלתי תלויים, מצבי שיווי המשקל היו ממלאים אזור תלת-ממדי במקום להימצא על משטח, ולא הייתה משוואת מצב לכתוב.
      - text: >-
          רק משתנים אקסטנסיביים כמו $V$ ו-$N$ קובעים את המצב; משתנים אינטנסיביים אינם מספיקים.
        feedback: >-
          להפך. $N$ אומר כמה חומר יש, לא היכן על המשטח לחלקיק הוא נמצא; שני משתנים אינטנסיביים כמו $T$ ו-$v = V/N$ הם בדיוק מה שקובע את הנקודה.
      - text: >-
          זה נכון רק לגז האידיאלי; גז ממשי צריך משתנה בלתי תלוי שלישי.
        feedback: >-
          ההנחה היא טענה על כל חומר דחיס פשוט, כולל CO₂ ממשי. משוואת ואן דר ואלס, כמו כל משוואת מצב שנמדדה, היא משטח מעל שני משתנים; מה ששונה מהגז האידיאלי הוא הצורה שלו, לא הממד שלו.

  # ---------------------------------------------------------------- OBJ-2.1-2: מבחן ההכפלה
  - id: Q-2.1-join-bottles
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-2]
    prompt: >-
      בקבוק גז נמצא במצב $(N, V, T)$. אתם פותחים שסתום לבקבוק שני זהה באותו מצב, ויוצרים מערכת אחת עם פי שניים גז בפי שניים נפח, באותה $T$. איזו רשימה של מה שמשתנה נכונה?
    choices:
      - text: >-
          $N$, $V$ והאנרגיה הפנימית $U$ מוכפלים; $P$, $T$ ו-$v = V/N$ נשארים כשהיו.
        correct: true
        feedback: >-
          נכון: מבחן ההכפלה. גדלים אקסטנסיביים מוכפלים; גדלים אינטנסיביים אינם זזים. הלחץ תלוי רק ב-$v$ וב-$T$, ו-$v = 2V/(2N)$ לא השתנה.
      - text: >-
          $P$, $V$, $T$ ו-$N$ מוכפלים כולם.
        feedback: >-
          אז הלחץ של גז היה תלוי בכמה ממנו במקרה נמצא בחדר, ושני ליטרים סמוכים של אותו גז באותה טמפרטורה היו מראים קריאות שונות על אותו מד. פי שניים מולקולות פוגעות בפי שניים שטח דופן: הכוח ליחידת שטח אינו משתנה.
        misconception: MC-doubling-doubles-everything
      - text: >-
          שום דבר אינו משתנה: חיבור שתי מערכות זהות רק יוצר עותק גדול יותר של אותו מצב.
        feedback: >-
          המצב האינטנסיבי זהה, אבל $N$, $V$ ו-$U$ באמת מוכפלים: יש פי שניים חומר. "אותו מצב" פירושו אותם $P$, $T$ ו-$v$, לא אותם סכומים כוללים.
      - text: >-
          רק $T$ משתנה, בזמן שחום זורם בין שני החצאים עד שהם מגיעים לשיווי משקל.
        feedback: >-
          שני החצאים מתחילים באותה טמפרטורה, ולכן שום דבר אינו זורם ביניהם: $T$ לעולם אינה זזה, וגם $P$ לא.

  - id: Q-2.1-classify
    type: multi
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-2]
    prompt: >-
      שתי דגימות זהות של גז, באותו מצב שיווי משקל, מחוברות לדגימה אחת. סמנו כל גודל שהוא אינטנסיבי, כלומר אינו משתנה בחיבור.
    choices:
      - text: >-
          הטמפרטורה $T$
        correct: true
        feedback: >-
          אינטנסיבית: שני החצאים היו ב-$T$, וכך גם השלם.
      - text: >-
          צפיפות המסה $\rho = Nm/V$
        correct: true
        feedback: >-
          אינטנסיבית: יחס בין שני גדלים אקסטנסיביים, המסה והנפח, ששניהם מוכפלים.
      - text: >-
          האנרגיה הפנימית לחלקיק $U/N$
        correct: true
        feedback: >-
          אינטנסיבית, מאותה סיבה: $U$ ו-$N$ מוכפלים שניהם, והיחס ביניהם אינו משתנה.
      - text: >-
          המכפלה $PV$
        feedback: >-
          $P$ אינו משתנה ו-$V$ מוכפל, ולכן $PV$ מוכפל: הוא אקסטנסיבי, כפי ש-$PV = Nk_BT$ אומר, שכן $N$ מוכפל.
      - text: >-
          קיבול החום $C$ של הדגימה
        feedback: >-
          פי שניים חומר צריך פי שניים אנרגיה לכל קלווין: $C$ אקסטנסיבי. קיבול החום לחלקיק, או לקילוגרם, הוא האינטנסיבי.
      - text: >-
          ריבוע הנפח, $V^2$
        feedback: >-
          $V^2$ גדל פי ארבעה: הוא לא אקסטנסיבי ולא אינטנסיבי. מבחן ההכפלה ממיין משתנים רבים, לא את כולם.

  - id: Q-2.1-unequal-bottles
    type: numeric
    level: mid
    objectives: [OBJ-2.1-2, OBJ-2.1-3]
    prompt: >-
      בקבוק של $5.0\,\text{L}$ מכיל חנקן ב-$300\,\text{kPa}$, ובקבוק של $15.0\,\text{L}$ מכיל חנקן ב-$100\,\text{kPa}$, שניהם ב-$293\,\text{K}$. פותחים שסתום ביניהם, והגז חוזר ל-$293\,\text{K}$. אם מתייחסים לגז כאידיאלי, מהו הלחץ הסופי?
    answer: 150
    unit: kPa
    tolerance: 0.01
    correctFeedback: >-
      $N_1k_BT = P_1V_1 = 1500\,\text{kPa L}$ ו-$N_2k_BT = P_2V_2 = 1500\,\text{kPa L}$: בשני הבקבוקים אותו מספר מולקולות. אחרי החיבור, $P_\mathrm{f} = (P_1V_1 + P_2V_2)/(V_1 + V_2) = 3000/20 = 150\,\text{kPa}$. הבקבוקים היו במצבים שונים, עם $v$ שונה, ולכן התוצאה היא ממוצע משוקלל לפי נפח, ולא אחד מלחצי ההתחלה.
    wrongFeedback: >-
      ספרו את המולקולות: $Nk_BT = PV$ לכל בקבוק. חברו אותן, וחלקו בנפח הכולל באותה $T$.
    commonWrong:
      - value: 200
        feedback: >-
          זה הממוצע הפשוט של שני הלחצים. משקלו של הבקבוק הגדול פי שלושה: $P_\mathrm{f}$ הוא ממוצע משוקלל לפי נפח, $(P_1V_1 + P_2V_2)/(V_1 + V_2)$.
      - value: 400
        feedback: >-
          זה מחבר את הלחצים כאילו הלחץ אקסטנסיבי. החיבור מוסיף מולקולות ונפחים; הלחץ נובע מהיחס ביניהם, $P = Nk_BT/V$, ונמצא בין שני ערכי ההתחלה.
        misconception: MC-doubling-doubles-everything
      - value: 250
        feedback: >-
          זה משקלל כל לחץ לפי הנפח של הבקבוק האחר. הגז של כל בקבוק מתפשט אל הנפח הכולל ביחס ל-$P_iV_i$ שלו עצמו.

  # ---------------------------------------------------------------- OBJ-2.1-3: חוק הגזים האידיאליים ומעמדו
  - id: Q-2.1-ideal-status
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-3]
    prompt: >-
      איזו מין טענה היא חוק הגזים האידיאליים, $PV = Nk_BT$?
    choices:
      - text: >-
          משפט של המודל הקינטי של חלקיקים נקודתיים שאינם מקיימים אינטראקציה, ועבור גזים ממשיים חוק אמפירי של הגבול הדליל: כל גז מתקרב אליו כשהצפיפות שלו שואפת לאפס, וסוטה ממנו כשהוא נדחס או מתקרר.
        correct: true
        feedback: >-
          נכון. זה הגבול שכל גז מתקרב אליו, לא חוק שכל גז מציית לו. ל-CO₂ ממשי ב-$280\,\text{K}$ יש $Z = Pv/(k_BT) = 0.975$ ב-$0.4\,\text{MPa}$ ו-$0.864$ ב-$2\,\text{MPa}$, ואחר כך הוא מתעבה בלחץ קבוע, דבר שהחוק אינו יכול לתאר.
      - text: >-
          חוק טבע שכל גז מציית לו, בכל צפיפות ובכל טמפרטורה.
        feedback: >-
          CO₂ דחוס ב-$280\,\text{K}$ מפריך אותו: הלחץ שלו נמוך ב-$14\%$ מהלחץ האידיאלי ב-$2\,\text{MPa}$, וב-$4.16\,\text{MPa}$ הוא מפסיק לעלות לגמרי בזמן שהגז מתעבה. חוק שאין בו שום קבוע של החומר אינו יכול לדעת היכן גז כלשהו מתעבה.
        misconception: MC-ideal-gas-universal
      - text: >-
          הגדרה של טמפרטורה, ולכן הוא אינו יכול להיכשל.
        feedback: >-
          הטמפרטורה מוגדרת דרך שיווי משקל תרמי, בחוק האפס של שיעור 1.1, ונמדדת בכל מדחום. חוק הגזים האידיאליים קושר את הטמפרטורה הזו ל-$P$ ול-$v$, והקשר נכשל באופן מדיד בגזים צפופים.
      - text: >-
          קירוב שעובד לגזים קלים כמו הליום ומימן, ולשום גז אחר.
        feedback: >-
          כל גז מתקרב אליו כשהצפיפות שואפת לאפס, גם גזים כבדים: CO₂, ב-$0.4\,\text{MPa}$ וב-$280\,\text{K}$, נמצא בתוך $2.5\%$ ממנו. מה שמכריע הוא הצפיפות ביחס לנקודה הקריטית של הגז עצמו, לא המסה של המולקולה.

  - id: Q-2.1-classroom
    type: numeric
    level: basic
    objectives: [OBJ-2.1-3]
    prompt: >-
      כיתה של $50\,\text{m}^3$ מכילה אוויר ב-$99.0\,\text{kPa}$ וב-$295\,\text{K}$. כמה מולקולות יש בה? ($k_B = 1.380649 \times 10^{-23}\,\text{J/K}$.)
    answer: 1.2153e27
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      $N = PV/(k_BT) = 99\,000 \times 50/(1.380649 \times 10^{-23} \times 295) = 1.22 \times 10^{27}$, כ-$2018$ מול. בצפיפות הזו האוויר נמצא בתוך עשירית האחוז מאידיאלי, ולכן החוק אינו צריך תיקון.
    wrongFeedback: >-
      חלצו את $N$ מתוך $PV = Nk_BT$, עם $P$ בפסקלים, $V$ במטרים מעוקבים ו-$T$ בקלווין.
    commonWrong:
      - value: 2018
        feedback: >-
          זה $PV/(RT)$, מספר המולים. השאלה שואלת על מולקולות: הכפילו ב-$N_A$, או השתמשו ב-$k_B$ במקום ב-$R$.
      - value: 1.2153e24
        feedback: >-
          זה מציב את הלחץ בקילופסקלים. $k_B$ נתון בג'אול לקלווין, ולכן $P$ חייב להיות בפסקלים: $99.0\,\text{kPa} = 99\,000\,\text{Pa}$.
      - value: 1.6297e28
        feedback: >-
          זה משתמש בטמפרטורה במעלות צלזיוס, $22$. חוק הגזים צריך את הטמפרטורה המוחלטת, $295\,\text{K}$.

  # ---------------------------------------------------------------- OBJ-2.1-4: שני התיקונים
  - id: Q-2.1-b-raises-pressure
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-4]
    prompt: >-
      תנו למולקולות גודל אבל בלי משיכה: $a = 0$, $b > 0$. באותם $v$ ו-$T$, איך הלחץ משתווה ללחץ של הגז האידיאלי?
    choices:
      - text: >-
          הוא גבוה יותר: $k_BT/(v - b) > k_BT/v$. אותן מולקולות, דחוקות במקום הקטן יותר $v - b$ שהמרכזים שלהן יכולים להגיע אליו, פוגעות בדפנות לעתים קרובות יותר.
        correct: true
        feedback: >-
          נכון. נפח מודר תמיד מעלה את הלחץ; המשיכה, האיבר $a/v^2$, היא שמנמיכה אותו. מי מהשניים גובר בצפיפות נתונה קובע אם $Z$ מעל $1$ או מתחתיו.
      - text: >-
          הוא נמוך יותר: המולקולות תופסות מקום שאחרת היה מעביר תנע לדופן.
        feedback: >-
          המקום שהמולקולות תופסות הוא מקום שהמרכזים שלהן אינם יכולים להשתמש בו, ולכן הנפח השמיש מצטמק ל-$v - b$ והלחץ $k_BT/(v - b)$ עולה. הנמכת הלחץ היא עבודתה של המשיכה, לא של הגודל.
      - text: >-
          הוא זהה: הלחץ תלוי רק בתנע שהמולקולות נושאות, והגודל אינו משנה אותו.
        feedback: >-
          הגודל אינו משנה כל פגיעה לחוד, אבל הוא משנה את תדירות הפגיעות: אותן מולקולות בפחות מקום שמיש פוגעות בדופן לעתים קרובות יותר. ב-$a = 0$ הלחץ הוא $k_BT/(v - b)$, גבוה מ-$k_BT/v$ בכל $v$.
      - text: >-
          הוא גבוה יותר בדיוק בחלק $b/v$, בכל צפיפות.
        feedback: >-
          רק בסדר ראשון. $v/(v - b) = 1 + b/v + b^2/v^2 + \cdots$, ולכן העודף גדל מהר יותר מ-$b/v$ כשהגז נדחס, ומתבדר כאשר $v \to b$.

  - id: Q-2.1-attraction-squared
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-4]
    prompt: >-
      מדוע המשיכה של ואן דר ואלס מנמיכה את הלחץ ב-$a/v^2$, בריבוע הצפיפות, ולא בשיעור יחסי ל-$1/v$?
    choices:
      - text: >-
          שני גורמים של צפיפות: מספר המולקולות שפוגעות ביחידת שטח של הדופן ביחידת זמן יחסי ל-$1/v$, והמשיכה לאחור על כל אחת מהן, מצד השכנות שמאחוריה, יחסית למספר השכנות, גם הוא $1/v$.
        correct: true
        feedback: >-
          נכון. זו הערכה של שדה ממוצע: היא סופרת את השכנות כאילו הן מפוזרות באופן אחיד, ומתעלמת מכך שהמשיכה עצמה גורמת להן להתקבץ.
      - text: >-
          ניתוח ממדים מחייב זאת: רק $a/v^2$ יכול להיות לחץ.
        feedback: >-
          הממדים קובעים את היחידות של $a$ אחרי שבוחרים את החזקה של $v$, לא את החזקה עצמה: גם $c/v$ הוא לחץ, אם $c$ הוא אנרגיה. החזקה באה מספירה של מה שהמשיכה פועלת עליו וממה שהיא באה.
      - text: >-
          כי כוח המשיכה בין שתי מולקולות יחסי הפוך לריבוע המרחק ביניהן.
        feedback: >-
          הטיעון אינו משתמש בשום חוק כוח. הריבוע סופר שתי צפיפויות, של המולקולות שפוגעות בדופן ושל השכנות שמושכות אותן לאחור; כוח ואן דר ואלס בין מולקולות ממשיות דועך מהר בהרבה מ-$1/r^2$.
      - text: >-
          כי מולקולה שעומדת לפגוע בדופן נמשכת אל המולקולות של הדופן עצמה.
        feedback: >-
          המודל מתעלם מהמשיכה של הדופן. החוסר בא מהגז שמאחורי המולקולה: שכנות מצד אחד בלבד, ולכן משיכה שקולה לאחור, אל תוך הגז.

  - id: Q-2.1-co2-vdw-deviation
    type: numeric
    level: mid
    objectives: [OBJ-2.1-4]
    prompt: >-
      עם קבועי ואן דר ואלס שהותאמו לנקודה הקריטית של CO₂ ($T_c = 304.13\,\text{K}$, $P_c = 7.3773\,\text{MPa}$, דרך $b = k_BT_c/(8P_c)$ ו-$a = 27(k_BT_c)^2/(64P_c)$), חשבו את לחץ ואן דר ואלס בנפח מולרי של $1.2 \times 10^{-3}\,\text{m}^3/\text{mol}$ וב-$280\,\text{K}$. תנו את הסטייה היחסית שלו, עם סימן, מהלחץ האידיאלי $k_BT/v$ באותו מצב (שלילית אם לחץ ואן דר ואלס נמוך יותר).
    answer: -0.0939
    unit: ''
    tolerance: 0.03
    correctFeedback: >-
      $b = 7.115 \times 10^{-29}\,\text{m}^3$, $a = 1.008 \times 10^{-48}\,\text{Pa}\,\text{m}^6$, $v = 1.993 \times 10^{-27}\,\text{m}^3$. אידיאלי: $1.940\,\text{MPa}$. הנפח המודר, $b/v = 0.036$, מעלה אותו ל-$2.012\,\text{MPa}$; המשיכה מורידה $a/v^2 = 0.254\,\text{MPa}$, ונשארים $1.758\,\text{MPa}$, $9.4\%$ מתחת לאידיאלי. בצפיפות הזו המשיכה גוברת על הגודל פי שלושה וחצי.
    wrongFeedback: >-
      התאימו את $a$ ואת $b$, המירו את הנפח המולרי ל-$v = V_\mathrm{m}/N_A$, חשבו את $k_BT/(v - b) - a/v^2$, חלקו ב-$k_BT/v$ והחסירו אחד.
    commonWrong:
      - value: 0.1036
        feedback: >-
          זה הלחץ האידיאלי חלקי לחץ ואן דר ואלס, פחות אחד. השאלה מודדת את לחץ ואן דר ואלס ביחס לאידיאלי: $1.758/1.940 - 1$.
      - value: 0.0939
        feedback: >-
          הגודל נכון, הסימן לא: לחץ ואן דר ואלס הוא הנמוך מהשניים, כי כאן המשיכה גוברת על הנפח המודר.
      - value: -0.1309
        feedback: >-
          זה שומר את המשיכה ומשמיט את הנפח המודר, $k_BT/v - a/v^2$. הגודל של המולקולות מחזיר $3.7\%$ מהלחץ האידיאלי.
      - value: 0.0370
        feedback: >-
          זה שומר רק את הנפח המודר, $k_BT/(v - b)$. המשיכה מנמיכה את הלחץ ב-$a/v^2 = 0.254\,\text{MPa}$, יותר ממה שהגודל מעלה אותו.

  - id: Q-2.1-why-fold
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.1-1, OBJ-2.1-4]
    prompt: >-
      מדוע משטח ואן דר ואלס יכול להתקפל מתחת ל-$T_c$, בעוד משטח הגז האידיאלי אינו מתקפל לעולם, בשום טמפרטורה? בחרו את ההסבר שנותן ל-$a$ ול-$b$ את התפקידים הנכונים שלהם.
    choices:
      - text: >-
          השיפוע של האיזותרמה האידיאלית, $-k_BT/v^2$, שלילי בכל מקום. בשיפוע של ואן דר ואלס, $-k_BT/(v - b)^2 + 2a/v^3$, יש איבר משיכה חיובי שיכול לגבור על הראשון בנפחים בינוניים כאשר $k_BT$ קטן; הליבה הקשה שומרת על שיפוע שלילי ב-$v$ קטן, והגז הדליל ב-$v$ גדול. רק מתחת ל-$k_BT_c = 8a/(27b)$ המשיכה גוברת במקום כלשהו.
        correct: true
        feedback: >-
          נכון. קפל דורש משהו שגורם ללחץ לעלות עם הנפח, ורק איבר המשיכה עושה זאת. $b$ תוחם את הקטע העולה: בלעדיו ($b = 0$, $a > 0$) כל איזותרמה עולה עבור $v < 2a/(k_BT)$ בכל טמפרטורה, כך שהקפל לעולם לא היה נסגר ולא הייתה נקודה קריטית; בלי $a$ אין קפל בכלל.
      - text: >-
          $b$ יוצר את הקפל: ליד $v = b$ האיבר $k_BT/(v - b)$ מתבדר, וזה גורם ללחץ לעלות עם הנפח; $a$ רק מזיז את המקום שבו זה קורה.
        feedback: >-
          ליד $v = b$ הלחץ יורד בתלילות כש-$v$ גדל: ההתבדרות היא קיר, לא עלייה. עם $a = 0$, $P = k_BT/(v - b)$ יורד בכל מקום ואין קפל.
      - text: >-
          גם המשטח האידיאלי היה מתקפל בטמפרטורה נמוכה מספיק; חסרה לו רק נקודה קריטית.
        feedback: >-
          $(\partial P/\partial v)_T = -k_BT/v^2 < 0$ בכל $T > 0$: האיזותרמה האידיאלית יורדת לכל אורכה בכל טמפרטורה. בחוק האידיאלי אין שום קבוע של חומר כלשהו, ולכן אין בו דבר שיכול לגרום לו להתקפל.
      - text: >-
          הקפל הוא התיעוד של ההתעבות במשוואה: מתחת ל-$T_c$ הלחץ של הגז הממשי עולה, יורד ועולה שוב בזמן שהוא מתעבה, ו-$a$ ו-$b$ משחזרים זאת.
        feedback: >-
          חומר ממשי אינו עושה דבר כזה: כשהוא נדחס מתחת ל-$T_c$ הוא שומר על לחץ קבוע בזמן שהוא מתעבה. הקטע של הקפל שבו הלחץ עולה עם הנפח הוא תכונה של המשוואה החשופה, ואין עליו מצב יציב; מה בא במקומו הוא הנושא של מודול 14.
        misconception: MC-vdw-loop-is-real

