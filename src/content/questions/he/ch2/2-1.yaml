        feedback: >-
          נוזל ואדים מתקיימים יחד רק מתחת לטמפרטורה הקריטית, בלחץ הרוויה של אותה טמפרטורה. ב-$T_r = 1.90$ יש פאזה זורמת אחת בכל לחץ.
      - text: >-
