  # ---------------------------------------------------------------- OBJ-2.1-6: משתנים מצומצמים, Z
  - id: Q-2.1-reduced-pressure
    type: numeric
    level: basic
    objectives: [OBJ-2.1-6]
    prompt: >-
      גז ואן דר ואלס נמצא ב-$T_r = 1.1$ וב-$v_r = 2.5$. מצאו את הלחץ המצומצם שלו, $P_r$.
    answer: 0.8738
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      $P_r = 8T_r/(3v_r - 1) - 3/v_r^2 = 8.8/6.5 - 3/6.25 = 1.354 - 0.480 = 0.874$, יהיה הגז אשר יהיה. מקדם הדחיסות שלו הוא $Z = 3P_rv_r/(8T_r) = 0.745$: רבע מתחת לאידיאלי.
    wrongFeedback: >-
      הציבו את $T_r$ ואת $v_r$ בחוק המצבים המתאימים, $P_r = 8T_r/(3v_r - 1) - 3/v_r^2$.
    commonWrong:
      - value: 1.1733
        feedback: >-
          זה הגז האידיאלי באותן יחידות, $8T_r/(3v_r)$. לגז ואן דר ואלס יש שני התיקונים: $3v_r - 1$ בשל הגודל ו-$-3/v_r^2$ בשל המשיכה.
      - value: 1.3538
        feedback: >-
          זה שומר את הנפח המודר ומשמיט את איבר המשיכה, $-3/v_r^2 = -0.48$.

  - id: Q-2.1-same-z
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-6]
    prompt: >-
      פחמן דו-חמצני וחנקן, כל אחד כגז ואן דר ואלס שהותאם לנקודה הקריטית שלו, מוחזקים שניהם ב-$T_r = 1.5$ וב-$P_r = 2.0$. הנקודות הקריטיות שלהם, וה-$a$ וה-$b$ שלהם, הם מספרים שונים מאוד. האם יש להם אותו מקדם דחיסות $Z$?
    choices:
      - text: >-
          כן. במשוואה המצומצמת אין $a$, $b$ או $k_B$, ומעל הטמפרטורה הקריטית כל $P_r$ מתקבל בנפח מצומצם אחד, כאן $v_r = 1.59$, זהה לשניהם. לכן גם $Z = 3P_rv_r/(8T_r) = 0.79$ זהה.
        correct: true
        feedback: >-
          נכון. הטמפרטורה חשובה לטיעון: מתחת ל-$T_c$ זוג $(T_r, P_r)$ שבתוך תחום הלחצים של ההתפתלות מתקבל בשלושה ערכי $v_r$ (ב-$T_r = 0.9$, $P_r = 0.60$ נותן $v_r = 0.61$, $1.00$ ו-$2.72$), והמשוואה המצומצמת לבדה אינה אומרת איזה מהם. מה שהיא קובעת בכל מקרה הוא את $P_r$ מתוך $(T_r, v_r)$.
      - text: >-
          לא: $Z$ תלוי בכימיה של הגז, ולכן שני גזים שונים לעולם אינם חולקים אותו.
        feedback: >-
          באותו $(v, T)$ לשני גזים יש לחצים שונים, כי ה-$a$ וה-$b$ שלהם שונים. כשמודדים ביחידות של הנקודה הקריטית של כל גז, הקבועים האלה מצטמצמים ממשוואת ואן דר ואלס, ואיתם כל הבדל בין הגזים.
      - text: >-
          כן, אבל רק משום של-CO₂ ול-N₂ יש מסות מולקולריות דומות.
        feedback: >-
          מולקולת CO₂ כבדה פי אחד וחצי ממולקולת N₂, והמסה אינה מופיעה בשום מקום במשוואת המצב. המצבים המתאימים נובעים מכך ש-$a$ ו-$b$ מצטמצמים מהמשוואה המצומצמת, לכל זוג של גזי ואן דר ואלס.
      - text: >-
          רק בנקודות הקריטיות שלהם, $T_r = P_r = 1$, שבהן לשניהם $Z_c = 3/8$.
        feedback: >-
          $Z_c = 3/8$ הוא מקרה אחד של הטענה הכללית, לא היחיד. המשוואה המצומצמת מתקיימת בכל מצב, ובכל מצב היא נותנת לשני הגזים אותו $Z$.

  - id: Q-2.1-z-dilute
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-6]
    prompt: >-
      בתצוגת $Z$ של איור 2.1ב, לגז ואן דר ואלס ב-$T_r = 1.2$ וב-$v_r = 5$ יש $Z = 0.88$. מה זה אומר?
    choices:
      - text: >-
          הלחץ שלו נמוך ב-$12\%$ מהלחץ של הגז האידיאלי באותם $v$ ו-$T$: בצפיפות הזו המשיכה גוברת על הנפח המודר. אם הגז יתפשט עוד, $Z$ יטפס לעבר $1$.
        correct: true
        feedback: >-
          נכון. $Z = Pv/(k_BT)$ משווה את הלחץ ללחץ האידיאלי באותו מצב. כאשר $v \to \infty$ שני התיקונים נעלמים ו-$Z \to 1$; כשהגז נדחס ל-$v_r = 0.83$, $Z$ יורד ל-$0.54$, ובקצה הצפוף הנפח המודר גובר ו-$Z$ מזנק אל מעל $1$.
      - text: >-
          הוא צפוף ב-$12\%$ יותר מגז אידיאלי באותם $v$ ו-$T$.
        feedback: >-
          באותו $v$ הצפיפות זהה מעצם ההגדרה, $1/v$. מה ששונה הוא הלחץ: $Z = Pv/(k_BT)$ הוא הלחץ בפועל חלקי הלחץ האידיאלי.
      - text: >-
          בצפיפות הזו הנפח המודר שולט.
        feedback: >-
          הנפח המודר מעלה את הלחץ והיה נותן $Z > 1$. $Z < 1$ פירושו שהמשיכה, האיבר $-a/v^2$, גוברת.
      - text: >-
          $Z = 0.88$ הוא תכונה קבועה של הגז הזה, זהה בכל נפח.
        feedback: >-
          $Z$ משתנה לאורך האיזותרמה: $0.54$ ליד $v_r = 0.83$, $0.88$ ב-$v_r = 5$, ו-$1$ בגבול של נפח אינסופי. הגז האידיאלי הוא הגבול שכל גז ואן דר ואלס מתקרב אליו, לא סוג נפרד של גז.

  - id: Q-2.1-boyle
    type: numeric
    level: bagrut
    objectives: [OBJ-2.1-6]
    prompt: >-
      הנקודה הקריטית של חמצן היא $T_c = 154.581\,\text{K}$, $P_c = 5.043\,\text{MPa}$ (NIST). אם מתייחסים אליו כגז ואן דר ואלס שהותאם לה, באיזו טמפרטורה מקדם הוויריאל השני שלו מתאפס, כך ש-$Z$ סוטה מ-$1$ רק בסדר שני בצפיפות?
    answer: 521.7
    unit: K
    tolerance: 0.01
    correctFeedback: >-
      $B(T) = b - a/(k_BT)$ מתאפס ב-$k_BT_B = a/b$, ומהנקודה הקריטית $a/b = \tfrac{27}{8}k_BT_c$: $T_B = 3.375 \times 154.581 = 521.7\,\text{K}$. הלחץ הקריטי נופל מהחישוב; ביחידות מצומצמות לכל גז ואן דר ואלס $T_{B,r} = 27/8$. מתחת ל-$T_B$, $B < 0$ והמשיכה מושכת את $Z$ אל מתחת ל-$1$ בגז הדליל; מעליה, הגודל דוחף את $Z$ אל מעל $1$.
    wrongFeedback: >-
      דרשו $B(T) = b - a/(k_BT) = 0$, והשתמשו ב-$k_BT_c = 8a/(27b)$ כדי לכתוב את $a/b$ באמצעות $T_c$.
    commonWrong:
      - value: 154.58
        feedback: >-
          זו הטמפרטורה הקריטית. $B$ מתאפס היכן ש-$k_BT = a/b$, גבוה פי $27/8$ מ-$k_BT_c = 8a/(27b)$.
      - value: 45.80
        feedback: >-
          זה $\tfrac{8}{27}T_c$, היחס הפוך. מתוך $k_BT_c = 8a/(27b)$, $a/b = \tfrac{27}{8}k_BT_c$.
      - value: 4338
        feedback: >-
          זה $a_\mathrm{m}/b_\mathrm{m}$, אנרגיה למול ב-$\text{J/mol}$. חלקו ב-$R$ כדי לקבל טמפרטורה.

  # ---------------------------------------------------------------- פחמן דו-חמצני ממשי
  - id: Q-2.1-co2-gauge
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-3]
    prompt: >-
      פחמן דו-חמצני ב-$280\,\text{K}$, מתחת לטמפרטורה הקריטית שלו, נדחס לאט בטמפרטורה קבועה מגז דליל ועד חלק קטן מהנפח ההתחלתי שלו. איך הקריאה של מד הלחץ משתווה לניבוי האידיאלי $P = k_BT/v$ באותו נפח?
    choices:
      - text: >-
          היא יורדת יותר ויותר אל מתחת לניבוי האידיאלי ככל שהגז נדחס, אחר כך נשארת בלחץ הרוויה, $4.16\,\text{MPa}$, בזמן שהגז מתעבה, והניבוי האידיאלי ממשיך לטפס; כשהכול נוזל, היא מזנקת.
        correct: true
        feedback: >-
          נכון, כפי שהאיזותרמה של NIST מראה: החוק האידיאלי גבוה מדי ב-$7\%$ ב-$1\,\text{MPa}$, ב-$16\%$ ב-$2\,\text{MPa}$ וב-$55\%$ ברוויה, ואחר כך מד הלחץ אינו זז מ-$361.5$ ועד $49.8\,\text{cm}^3/\text{mol}$. לחוק שאין בו שום קבוע של החומר אין דרך לייצר את הקטע השטוח.
      - text: >-
          היא עוקבת אחרי $k_BT/v$ בכל נפח, כי כל גז מציית לחוק הגזים האידיאליים.
        feedback: >-
          את זה בדיוק נתוני ה-CO₂ מפריכים. הלחץ הנמדד יורד אל מתחת ללחץ האידיאלי הרבה לפני ההתעבות, ב-$16\%$ ב-$2\,\text{MPa}$, ואחר כך מפסיק לעלות לגמרי בזמן שהניבוי האידיאלי ממשיך לטפס.
        misconception: MC-ideal-gas-universal
      - text: >-
          היא מטפסת לאט יותר מ-$k_BT/v$, ואחר כך עולה, יורדת ועולה שוב, כפי שעושה איזותרמת ואן דר ואלס מתחת ל-$T_c$.
        feedback: >-
          זו משוואת ואן דר ואלס החשופה, לא החומר. CO₂ ממשי שומר על לחץ קבוע של $4.16\,\text{MPa}$ בזמן שהוא מתעבה; על הקטע שבו לחץ ואן דר ואלס עולה עם הנפח אין מצב יציב.
        misconception: MC-vdw-loop-is-real
      - text: >-
          היא עולה מהר יותר מהניבוי האידיאלי בכל נפח, כי המולקולות נדחקות זו בזו.
        feedback: >-
          הצטופפות המולקולות מעלה את הלחץ רק בקצה הצפוף. לאורך כל ענף האדים המשיכה גוברת והלחץ הנמדד נמוך מהאידיאלי; רק בנוזל הלחץ עולה בתלילות.
      - text: >-
          היא יורדת לאפס ברגע שהגז מתחיל להתעבות.
        feedback: >-
          ההתעבות מחזיקה את הלחץ בערך קבוע שאינו אפס, לחץ הרוויה, כל עוד אדים ונוזל מתקיימים יחד. לחץ אפס פירושו שאין אדים כלל.

  - id: Q-2.1-co2-ideal-error
    type: numeric
    level: mid
    objectives: [OBJ-2.1-3, OBJ-2.1-6]
    prompt: >-
      באיזותרמה של NIST, לאדי פחמן דו-חמצני ב-$280\,\text{K}$ וב-$3.50\,\text{MPa}$ יש צפיפות של $90.807\,\text{kg/m}^3$ (מסה מולרית $44.0095\,\text{g/mol}$, $R = 8.3145\,\text{J/(mol K)}$). מצאו את מקדם הדחיסות $Z$ שלהם.
    answer: 0.7286
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      $V_\mathrm{m} = M/\rho = 0.0440095/90.807 = 4.846 \times 10^{-4}\,\text{m}^3/\text{mol}$, ו-$Z = PV_\mathrm{m}/(RT) = 3.5 \times 10^6 \times 4.846 \times 10^{-4}/(8.3145 \times 280) = 0.729$. הלחץ הממשי נמוך ב-$27\%$ מהאידיאלי בנפח הזה: החוק האידיאלי היה נותן $4.80\,\text{MPa}$, גבוה מדי ב-$37\%$. משוואת ואן דר ואלס נותנת $Z = 0.773$.
    wrongFeedback: >-
      מצאו את הנפח המולרי מהצפיפות, $V_\mathrm{m} = M/\rho$ עם $M$ בקילוגרמים למול, ואחר כך $Z = PV_\mathrm{m}/(RT)$.
    commonWrong:
      - value: 1.3725
        feedback: >-
          זה $1/Z$, הלחץ האידיאלי חלקי הלחץ הממשי. $Z$ הוא הלחץ הממשי חלקי האידיאלי, $PV_\mathrm{m}/(RT)$.
      - value: 728.6
        feedback: >-
          זה מציב את המסה המולרית בגרמים למול כאילו הייתה בקילוגרמים. $M = 0.0440095\,\text{kg/mol}$.
      - value: 0.3725
        feedback: >-
          זה השיעור שבו החוק האידיאלי מגזים, $1/Z - 1$. השאלה מבקשת את $Z$ עצמו.

  - id: Q-2.1-plateau-state
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.1-1, OBJ-2.1-3]
    prompt: >-
