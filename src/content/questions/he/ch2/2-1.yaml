    choices:
      - text: >-
          לא. על הקטע השטוח הלחץ נקבע לפי הטמפרטורה, ולכן $P$ ו-$T$ אינם בלתי תלויים: הנפח המולרי יכול להיות כל ערך בין $49.8$ ל-$361.5\,\text{cm}^3/\text{mol}$, לפי כמה מהחומר התעבה. משתנה אחר, למשל $v$ עצמו, קובע את המצב.
        correct: true
        feedback: >-
          נכון. ההנחה דורשת שני משתנים בלתי תלויים, ובזמן ההתעבות $P$ ו-$T$ קשורים זה בזה דרך עקומת הרוויה. $T$ ו-$v$ נשארים בלתי תלויים וקובעים הכול, כולל החלק שהוא נוזל.
      - text: >-
          כן: לפי הנחת המצב, $P$ ו-$T$ תמיד קובעים את $v$.
        feedback: >-
          רק כשהם בלתי תלויים. ב-$280\,\text{K}$ האדים והנוזל מתקיימים יחד בלחץ אחד, $4.1607\,\text{MPa}$, לאורך תחום של פי שבעה בנפח המולרי; הידיעה של $P$ ו-$T$ שם אומרת רק שהחומר נמצא איפשהו על הקטע השטוח.
      - text: >-
          לא: הנחת המצב נכשלת בזמן ההתעבות, ובגלל זה נחוץ מודול 14.
        feedback: >-
          ההנחה מתקיימת; $P$ ו-$T$ הם שמפסיקים להיות בלתי תלויים. מודול 14 נחוץ כדי לומר היכן נמצא הקטע השטוח, לא משום שהמצב מפסיק להיקבע על ידי שני משתנים.
      - text: >-
          כן: $V_\mathrm{m} = RT/P = 559.5\,\text{cm}^3/\text{mol}$.
        feedback: >-
          זה חוק הגזים האידיאליים, שאף נקודה על הקטע השטוח אינה מצייתת לו: לאדים הרוויים יש $361.5\,\text{cm}^3/\text{mol}$, $Z = 0.65$, ולנוזל $49.8$. החומר הממשי יכול להיות בכל נפח שבין השניים.
        misconception: MC-ideal-gas-universal
