        feedback: >-
          שום לחץ לא יעשה זאת ב-$293\,\text{K}$. אם דוחסים מספיק, חמצן יקפא בסופו של דבר למוצק, שאינו קיים במודל ואן דר ואלס, אבל הוא לעולם אינו עובר דרך נוזל נפרד.
