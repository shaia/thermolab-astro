  - id: Q-2.1-critical-volume
    type: numeric
    level: mid
    objectives: [OBJ-2.1-5]
    prompt: >-
      ה-CRC Handbook מביא את קבועי ואן דר ואלס של CO₂ כ-$a_\mathrm{m} = 0.3640\,\text{Pa}\,\text{m}^6/\text{mol}^2$ ו-$b_\mathrm{m} = 4.267 \times 10^{-5}\,\text{m}^3/\text{mol}$. איזה נפח מולרי קריטי המודל חוזה, ב-$\text{cm}^3/\text{mol}$?
    answer: 128.0
    unit: cm³/mol
    tolerance: 0.01
    correctFeedback: >-
      $V_c = 3b_\mathrm{m} = 1.280 \times 10^{-4}\,\text{m}^3/\text{mol} = 128.0\,\text{cm}^3/\text{mol}$. הצפיפות הקריטית של NIST, $467.6\,\text{kg/m}^3$, נותנת ערך נמדד של $94.1\,\text{cm}^3/\text{mol}$: הערך של המודל גדול מדי ב-$36\%$. אותם קבועים מחזירים $T_c = 304.0\,\text{K}$ ו-$P_c = 7.40\,\text{MPa}$, קרובים לערכים של NIST, אבל רק משום שהטבלה חישבה אותם מ-$T_c$ ומ-$P_c$ שנמדדו. הנפח הוא הניבוי שאיש לא התאים.
    wrongFeedback: >-
      בנקודה הקריטית של גז ואן דר ואלס $v_c = 3b$; למול, $V_c = 3b_\mathrm{m}$. המירו מטרים מעוקבים לסנטימטרים מעוקבים.
    commonWrong:
      - value: 42.67
        feedback: >-
          זה $b_\mathrm{m}$ עצמו. הנפח הקריטי הוא פי שלושה מהנפח המודר: $v_c = 3b$, מתוך $(v - b)/2 = v/3$.
      - value: 14.22
        feedback: >-
          זה מחלק את $b_\mathrm{m}$ בשלוש. הנפח הקריטי גדול מהנפח המודר, $v_c = 3b$: לגז בנקודה הקריטית שלו עדיין יש מקום שהמולקולות שלו יכולות לנוע בו.

  - id: Q-2.1-circular-check
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.1-5, OBJ-2.1-6]
    prompt: >-
      סטודנט לוקח את קבועי ואן דר ואלס של CO₂ מהטבלה, מחשב $T_c = 8a/(27k_Bb) = 304.0\,\text{K}$ ו-$P_c = a/(27b^2) = 7.40\,\text{MPa}$, מוצא שהם בתוך $0.1\%$ ו-$0.4\%$ מהערכים של NIST, $304.13\,\text{K}$ ו-$7.3773\,\text{MPa}$, ומסיק שמודל ואן דר ואלס חוזה את הנקודה הקריטית של CO₂ בטעות של פחות מחצי אחוז. מה שגוי במסקנה?
    choices:
      - text: >-
          ההסכמה מעגלית. מחברי הטבלה חישבו את $a$ ואת $b$ מ-$T_c$ ומ-$P_c$ שנמדדו, ולכן הנוסחאות מחזירות את מה שהוכנס. הגודל הקריטי שאיש לא התאים, $V_c = 3b_\mathrm{m} = 128.0\,\text{cm}^3/\text{mol}$, הוא המבחן, והוא מחטיא את הערך הנמדד, $94.1$, ב-$36\%$; ובאופן שקול, $Z_c = 3/8$ לעומת $0.275$.
        correct: true
        feedback: >-
          נכון. תמיד אפשר לכוון שני קבועים כך שיפגעו בשני מספרים. מודל נבדק במה שהוא חוזה מעבר להתאמה שלו: כאן, הקבוע הקריטי השלישי, ומשוואת ואן דר ואלס טועה בו לכל גז, כי $Z_c = 3/8$ בנוי בתוכה.
      - text: >-
          שום דבר אינו שגוי: הסכמה של חצי אחוז עם המדידה הבלתי תלויה של NIST מאששת את המודל.
        feedback: >-
          המדידה אינה בלתי תלויה בקבועים: הם נבנו ממנה. כל נוסחה עם שני קבועים, נכונה או שגויה, הייתה מסכימה באותה מידה אחרי שהותאמה לאותם שני מספרים.
      - text: >-
          צריך לערוך את ההשוואה במשתנים מצומצמים, שבהם כל גז מסכים עם המודל.
        feedback: >-
          במשתנים מצומצמים הנקודה הקריטית נמצאת ב-$T_r = P_r = v_r = 1$ מעצם ההגדרה, ולכן ההשוואה הזו הייתה מעגלית בכל שלושתם. התוכן של המודל הוא מה שהוא אומר על המספרים שלא הותאם אליהם, כמו $Z_c$.
      - text: >-
          ההבדלים הקטנים מראים שהנקודה הקריטית של NIST שגויה מעט, ושל המודל נכונה.
        feedback: >-
          ההבדלים נובעים מהמדידות הישנות יותר שהטבלה נבנתה מהן: הקבועים האלה מתאימים ל-$T_c = 304.0\,\text{K}$ ול-$P_c = 7.40\,\text{MPa}$. הם אינם אומרים דבר על המודל.

  - id: Q-2.1-oxygen-cylinder
