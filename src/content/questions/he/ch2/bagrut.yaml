# שאלות החזרה של מודול 02, מתוך דף הבעיות של ThermoLab (content/en/thermodynamics/02-equations-of-state-problems.md,
# בעיות 1–4; בעיה 5, גודלה של מולקולה וניתוח ממדים, עברה לחוברת התרגול). הדוגמאות הפתורות של השיעור כבר פותרות חלקים
# מהן: דוגמה 3 היא בעיה 1(ד) עם ארגון, דוגמה 4 היא בעיה 4(א) עם הנתון של 2 MPa, ודוגמה 6 היא מצבים מתאימים לחנקן
# ול-CO₂. לכן בעיה 1 משתמשת במתאן ומוכיחה את הנקודה הקריטית דרך הערך הגדול ביותר של 2a(v - b)²/v³, בעיה 2 במים,
# בעיה 3 בקסנון במצב מצומצם אחר, ובעיה 4 בשורות אחרות של האיזותרמה של CO₂ ובמקדם הוויריאל בקצה הדליל שלה. בעיה 1(ד)
# של ThermoLab השוותה את T_c ואת P_c המחושבים של ארגון לערכים נמדדים כאילו זה מבחן; הקבועים הותאמו אליהם, ולכן כאן
# המבחן הוא הנפח הקריטי (סעיף ב), כפי שדוגמה 3 של השיעור אומרת. כל מספר חושב מחדש בספרייה של ThermoLab
# (thermolab.gases) וב-numpy. נתוני חומרים ממשיים: NIST Chemistry WebBook, SRD 69, דפי הזורם (הנקודות הקריטיות של מתאן,
# מים, קסנון ו-CO₂; האיזותרמה של CO₂ ב-280 K ממשוואת ספאן–וגנר). ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו
# מפרסמת פתרונות מלאים ומחוונים. המזהים משותפים עם הקובץ באנגלית.
lang: he
chapter: 2
questions:
  - id: Q-2-bagrut-1
    type: bagrut
    title: >-
      הנקודה הקריטית של מתאן, ובלון של גז טבעי
    prompt: >-
      הנקודה הקריטית של מתאן (NIST) היא $T_c = 190.564\,\text{K}$ ו-$P_c = 4.5992\,\text{MPa}$, עם צפיפות קריטית של $162.66\,\text{kg/m}^3$; המסה המולרית שלו היא $16.0428\,\text{g/mol}$, ולכן הנפח המולרי הקריטי הנמדד שלו הוא $V_c = 98.63\,\text{cm}^3/\text{mol}$. התייחסו למתאן כגז ואן דר ואלס שהקבועים שלו הותאמו, כפי שטבלאות עושות, ל-$T_c$ ול-$P_c$. קחו $R = 8.3145\,\text{J/(mol K)}$.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-2.1-4, OBJ-2.1-5]
        prompt: >-
          מצאו את הנפח המודר המותאם למול, $b_\mathrm{m} = RT_c/(8P_c)$, ב-$\text{cm}^3/\text{mol}$.
        answer: 43.06
        unit: cm³/mol
        tolerance: 0.01
        correctFeedback: >-
          $b_\mathrm{m} = 8.3145 \times 190.564/(8 \times 4.5992 \times 10^6) = 4.306 \times 10^{-5}\,\text{m}^3/\text{mol} = 43.06\,\text{cm}^3/\text{mol}$, ו-$a_\mathrm{m} = 27(RT_c)^2/(64P_c) = 0.2303\,\text{Pa}\,\text{m}^6/\text{mol}^2$, וכך נבנות טבלאות של קבועי ואן דר ואלס.
        wrongFeedback: >-
          חלצו את הקבועים מתוך $k_BT_c = 8a/(27b)$ ו-$P_c = a/(27b^2)$: חלוקה של הראשונה בשנייה נותנת $b = k_BT_c/(8P_c)$, ולמול $b_\mathrm{m} = RT_c/(8P_c)$.
        commonWrong:
          - value: 344.5
            feedback: >-
              זה $RT_c/P_c$, בלי ה-$8$. מתוך $k_BT_c = 8a/(27b)$ ו-$P_c = a/(27b^2)$, $k_BT_c/P_c = 8b$.
          - value: 129.2
            feedback: >-
              זה $3b_\mathrm{m}$, הנפח הקריטי של המודל, שסעיף (ב) שואל עליו. $b_\mathrm{m}$ עצמו הוא שליש ממנו.
          - value: 4.306e-5
            feedback: >-
              המספר נכון במטרים מעוקבים למול. התשובה נדרשת ב-$\text{cm}^3/\text{mol}$: הכפילו ב-$10^6$.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-2.1-5, OBJ-2.1-6]
        prompt: >-
          הקבועים המותאמים מחזירים את $T_c$ ואת $P_c$ מעצם בנייתם. הקבוע הקריטי השלישי הוא ניבוי. פי כמה הנפח המולרי הקריטי של המודל גדול מזה שנמדד למתאן?
        answer: 1.310
        unit: ''
        tolerance: 0.01
        correctFeedback: >-
          $V_c' = 3b_\mathrm{m} = 129.2\,\text{cm}^3/\text{mol}$, לעומת $98.63$ שנמדד: פי $1.31$, גדול מדי ב-$31\%$. הגורם הוא $3/(8Z_c)$, עם $Z_c = P_cV_c/(RT_c) = 0.286$ שנמדד למתאן לעומת $3/8$ של המודל.
        wrongFeedback: >-
          הנפח הקריטי של ואן דר ואלס הוא $v_c = 3b$; למול, $3b_\mathrm{m}$. חלקו בערך הנמדד, $98.63\,\text{cm}^3/\text{mol}$.
        commonWrong:
          - value: 0.4366
            feedback: >-
              זה משווה את $b_\mathrm{m}$, ולא את הנפח הקריטי, ל-$V_c$ שנמדד. הנפח הקריטי של המודל הוא $3b_\mathrm{m}$.
          - value: 0.7634
            feedback: >-
              זה הנפח הנמדד חלקי זה של המודל. השאלה היא פי כמה הנפח של המודל גדול מהנמדד: $129.2/98.63$.
      - label: ג
        type: mc
        points: 4
        objectives: [OBJ-2.1-5]
        prompt: >-
          מכונית גז טבעי מאחסנת מתאן ב-$20\,\text{MPa}$ וב-$293\,\text{K}$, יותר מפי ארבעה מהלחץ הקריטי של מתאן. האם יש מתאן נוזלי בבלון?
        choices:
          - text: >-
              לא. ב-$T_r = 293/190.564 = 1.54$ מתאן נמצא מעל הטמפרטורה הקריטית שלו: האיזותרמה שלו יורדת בכל נפח, ודחיסה מעלה את הצפיפות ברציפות בלי שנוזל ייפרד אי פעם. בבלון יש זורם על-קריטי.
            correct: true
            feedback: >-
              נכון. לכן הדלק נקרא גז טבעי דחוס: כדי לשאת מתאן כנוזל צריך קודם לקרר אותו אל מתחת ל-$190.6\,\text{K}$, וזה הגז הטבעי הנוזלי.
          - text: >-
              כן: $20\,\text{MPa}$ הם פי $4.3$ מהלחץ הקריטי, הרבה מעבר ללחץ הדרוש כדי לנזל אותו.
            feedback: >-
              מעל הטמפרטורה הקריטית שלו שום לחץ אינו מנזל גז. הלחץ הקריטי הוא הלחץ בנקודה הקריטית, לא סף שמנזל את הגז ברגע שעוברים אותו.
            misconception: MC-any-gas-liquefies
          - text: >-
              חלקית: מעל הלחץ הקריטי, נוזל ואדים מתקיימים יחד.
            feedback: >-
              נוזל ואדים מתקיימים יחד רק מתחת לטמפרטורה הקריטית, בלחץ הרוויה של אותה טמפרטורה. ב-$T_r = 1.54$ יש זורם אחד בכל לחץ.
            misconception: MC-any-gas-liquefies
          - text: >-
              כן: ב-$293\,\text{K}$ לאיזותרמת ואן דר ואלס של מתאן יש קטע שבו הלחץ עולה עם הנפח, והמצב בבלון נמצא עליו.
            feedback: >-
              הקטע העולה קיים רק מתחת ל-$T_c$. ב-$T_r = 1.54$ השיפוע $(\partial P/\partial v)_T$ שלילי בכל מקום, כפי שסעיף (ד) מראה.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-2.1-5, OBJ-2.1-4]
        prompt: >-
          הראו מתוך $(\partial P/\partial v)_T$ שלאיזותרמת ואן דר ואלס יש קטע שעליו הלחץ עולה עם הנפח אם ורק אם $k_BT < 8a/(27b)$, על ידי מציאת הערך הגדול ביותר של $f(v) = 2a(v - b)^2/v^3$ עבור $v > b$. הסיקו את $v_c$, $T_c$ ו-$P_c$, הסבירו מהתוצאה שלכם מדוע שום לחץ אינו מנזל מתאן ב-$293\,\text{K}$, ובדקו את התוצאה בגבולות.
        solution:
          - kind: law
            text: >-
              למשוואת ואן דר ואלס $P = k_BT/(v - b) - a/v^2$ ב-$T$ קבוע יש שיפוע $(\partial P/\partial v)_T = -k_BT/(v - b)^2 + 2a/v^3$. הוא חיובי בדיוק היכן ש-$k_BT < 2a(v - b)^2/v^3 = f(v)$.
          - kind: manipulation
            text: >-
              $f(b) = 0$ ו-$f \to 0$ כאשר $v \to \infty$. בגזירה, $f'(v) = 2a(v - b)(3b - v)/v^4$, שמתאפסת עבור $v > b$ רק ב-$v = 3b$, המקסימום: $f(3b) = 2a(2b)^2/(3b)^3 = 8a/(27b)$. לכן השיפוע חיובי במקום כלשהו אם ורק אם $k_BT < 8a/(27b)$. ב-$k_BT = 8a/(27b)$ הוא נוגע באפס בנפח יחיד, $v = 3b$, ושלילי משני צדדיו, ולכן האיזותרמה שטוחה שם בלי לשנות כיוון: נקודת פיתול בשיפוע אפס, הנקודה הקריטית. הלחץ בה הוא $P = k_BT/(2b) - a/(9b^2) = 4a/(27b^2) - 3a/(27b^2)$.
          - kind: formula
            text: >-
              $v_c = 3b \qquad k_BT_c = \dfrac{8a}{27b} \qquad P_c = \dfrac{a}{27b^2}$
          - kind: limit
            text: >-
              $a \to 0$: $f \equiv 0$, אין קטע עולה בשום טמפרטורה ו-$T_c \to 0$: כדורים קשיחים לבדם לעולם אינם מתעבים. $b \to 0$ ב-$a$ קבוע: $f(v) = 2a/v$ גדל בלי גבול כאשר $v \to 0$, ולכן כל איזותרמה עולה ב-$v$ קטן מספיק, תהיה הטמפרטורה אשר תהיה, ו-$T_c \to \infty$: משיכה בלי ליבה קשה שתעצור את הקריסה נותנת קפל שלעולם אינו נסגר. $v \to \infty$: $f \to 0$, ולכן הגז הדליל יציב בכל טמפרטורה.
          - kind: units
            text: >-
              $a/v^3$ הוא $\text{Pa}\,\text{m}^6/\text{m}^3 = \text{J}$, אנרגיה, כמו $k_BT$; לכן $8a/(27b)$ הוא אנרגיה ו-$a/(27b^2)$ הוא $\text{Pa}$.
          - kind: substitution
            text: >-
              למול, $8a_\mathrm{m}/(27b_\mathrm{m}) = 8 \times 0.2303/(27 \times 4.306 \times 10^{-5}) = 1584\,\text{J/mol} = RT_c$, כפי שההתאמה מחייבת; ב-$293\,\text{K}$, $RT = 2436\,\text{J/mol}$, גדול מהערך הגדול ביותר של $f$, ולכן $(\partial P/\partial v)_T < 0$ בכל נפח. $V_c' = 3b_\mathrm{m} = 129.2\,\text{cm}^3/\text{mol}$.
          - kind: result
            text: >-
              קטע עולה קיים אם ורק אם $T < T_c = 8a/(27k_Bb)$, והנקודה הקריטית היא $(3b, 8a/(27k_Bb), a/(27b^2))$. מתאן ב-$293\,\text{K}$ נמצא ב-$T_r = 1.54$: האיזותרמה שלו יורדת בכל נפח, כל לחץ, כולל $20\,\text{MPa}$, מתקבל בצפיפות אחת בלבד, ולעולם אין פאזה שנייה ונפרדת להתעבות אליה.
        rubric:
          - text: >-
              כתיבת $(\partial P/\partial v)_T$ ושל התנאי $k_BT < 2a(v - b)^2/v^3$ לקטע עולה.
            weight: 2
          - text: >-
              מציאת המקסימום של $f$ ב-$v = 3b$, עם $f(3b) = 8a/(27b)$, והסקת $k_BT_c = 8a/(27b)$, $v_c = 3b$.
            weight: 3
          - text: >-
              מציאת $P_c = a/(27b^2)$.
          - text: >-
              הסבר עבור מתאן ב-$293\,\text{K}$: $T > T_c$, ולכן השיפוע שלילי בכל מקום ונוזל נפרד אינו יכול להיווצר.
            weight: 2
          - text: >-
              בדיקת גבולות: $a \to 0$, $b \to 0$ או $v \to \infty$, עם המשמעות של כל אחד.
            weight: 2

  - id: Q-2-bagrut-2
    type: bagrut
    title: >-
      מים אינם גז ואן דר ואלס
    prompt: >-
      הנקודה הקריטית של מים (NIST, IAPWS-95) היא $T_c = 647.096\,\text{K}$ ו-$P_c = 22.064\,\text{MPa}$, עם צפיפות קריטית של $322.0\,\text{kg/m}^3$; המסה המולרית שלהם היא $18.0153\,\text{g/mol}$. לכל גז ואן דר ואלס יש מקדם דחיסות קריטי $Z_c = P_cv_c/(k_BT_c) = 3/8$. קחו $R = 8.3145\,\text{J/(mol K)}$.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-2.1-6]
        prompt: >-
          מצאו את מקדם הדחיסות הקריטי הנמדד של מים, $Z_c = P_cV_c/(RT_c)$.
        answer: 0.2294
        unit: ''
        tolerance: 0.01
        correctFeedback: >-
          $V_c = M/\rho_c = 0.0180153/322.0 = 5.595 \times 10^{-5}\,\text{m}^3/\text{mol}$, ו-$Z_c = 22.064 \times 10^6 \times 5.595 \times 10^{-5}/(8.3145 \times 647.096) = 0.229$, הרבה מתחת ל-$3/8$. לארגון, לקסנון ולחנקן יש $0.29$, לפחמן דו-חמצני $0.275$: המים, מולקולה קוטבית עם קשרי מימן, הם החריגים.
        wrongFeedback: >-
          הנפח המולרי הקריטי הוא $V_c = M/\rho_c$, עם $M$ בקילוגרמים למול; אחר כך $Z_c = P_cV_c/(RT_c)$.
        commonWrong:
          - value: 0.375
            feedback: >-
              זה הערך של ואן דר ואלס, זהה לכל גז ואן דר ואלס. השאלה מבקשת את הערך הנמדד של מים, מתוך הנתונים הקריטיים שלהם.
          - value: 229.4
            feedback: >-
              זה מציב את המסה המולרית בגרמים למול כאילו הייתה בקילוגרמים. $M = 0.0180153\,\text{kg/mol}$.
          - value: 4.359
            feedback: >-
              זה $1/Z_c$, $RT_c/(P_cV_c)$. ב-$Z_c$ הלחץ והנפח נמצאים במונה.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-2.1-5, OBJ-2.1-6]
        prompt: >-
          התאימו את $a$ ואת $b$ ל-$T_c$ ול-$P_c$ של מים. פי כמה הנפח המולרי הקריטי של המודל, $3b_\mathrm{m}$, גדול מהנמדד?
        answer: 1.634
        unit: ''
        tolerance: 0.01
        correctFeedback: >-
          $b_\mathrm{m} = RT_c/(8P_c) = 30.48\,\text{cm}^3/\text{mol}$, ולכן $V_c' = 91.44\,\text{cm}^3/\text{mol}$ לעומת $55.95$ שנמדד: גדול מדי ב-$63\%$. הגורם הוא $3/(8Z_c) = 0.375/0.2294$, כפי שסעיף (ד) מראה שהוא חייב להיות.
        wrongFeedback: >-
          $b_\mathrm{m} = RT_c/(8P_c)$, הנפח הקריטי של המודל הוא $3b_\mathrm{m}$, והנמדד הוא $M/\rho_c$.
        commonWrong:
          - value: 0.6118
            feedback: >-
              זה הנפח הנמדד חלקי זה של המודל. השאלה היא פי כמה הנפח של המודל גדול מהנמדד.
          - value: 0.5448
            feedback: >-
              זה משווה את $b_\mathrm{m}$, ולא את $3b_\mathrm{m}$, לנפח הקריטי הנמדד.
      - label: ג
        type: mc
        points: 4
        objectives: [OBJ-2.1-1, OBJ-2.1-6]
        prompt: >-
          מקדמי הדחיסות הקריטיים שנמדדו נעים מכ-$0.23$ (מים) עד $0.29$ (ארגון, קסנון, חנקן), ולעולם אינם $3/8$. נגד מה זה מעיד?
        choices:
          - text: >-
              נגד מודל ואן דר ואלס, שבונה את $Z_c = 3/8$ לתוך כל גז, ונגד המצבים המתאימים כחוק מדויק של חומרים ממשיים, כי משוואה מצומצמת אוניברסלית אחת הייתה נותנת לכל חומר אותו $Z_c$. לא נגד הנחת המצב, שאומרת רק שמצבי שיווי המשקל מרכיבים משטח, לא איזו צורה יש לו.
            correct: true
            feedback: >-
              נכון. גזים ממשיים מצייתים למצבים המתאימים בקירוב, הכי טוב בין מולקולות קטנות וכמעט כדוריות (ארגון, קסנון וחנקן, כולם ב-$0.29$), וה-$0.23$ של המים מראה כמה רחוק מולקולה קוטבית נופלת מחוץ למשפחה.
          - text: >-
              נגד הנחת המצב: חומר שה-$Z_c$ שלו אינו $3/8$ צריך משתנה שלישי כדי לקבוע את המצב שלו.
            feedback: >-
              ההנחה אומרת ששני משתנים אינטנסיביים בלתי תלויים קובעים את המצב; היא אינה גוררת שום משוואת מצב מסוימת ושום ערך של $Z_c$. המשטח של המים הוא עדיין משטח, רק לא משטח ואן דר ואלס.
          - text: >-
              נגד שום דבר: $0.29$ לעומת $0.375$ נמצא בתוך השגיאה של מדידת נקודה קריטית.
            feedback: >-
              קבועים קריטיים נמדדים בדיוק טוב בהרבה מאחוז אחד; NIST נותן את $T_c$ של מים עד אלפית הקלווין. פער של $23\%$ לארגון ושל $39\%$ למים הוא הבדל מהותי, לא שגיאת מדידה.
          - text: >-
              נגד חוק הגזים האידיאליים, שהיה נותן $Z_c = 1$.
            feedback: >-
