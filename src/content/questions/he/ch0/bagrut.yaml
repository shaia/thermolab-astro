          - value: 0
            feedback: >-
              זו הדרך למעלה ואחר כך לרוחב: העלייה ב-$x = 0$ אינה מוסיפה דבר, ובתנועה לרוחב $\mathrm{d}y = 0$. השאלה מבקשת את הקו הישר.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-0.1-6, OBJ-0.1-7]
        prompt: >-
          חשבו את $\oint \omega_2$ נגד כיוון השעון סביב ריבוע היחידה שקודקודיו $(0, 0)$, $(1, 0)$, $(1, 1)$, $(0, 1)$, והסבירו מדוע הוא היה חייב להיות שונה מאפס. הראו שסביב ריבוע בעל צלע $s$ שמרכזו ב-$(x_0, y_0)$ האינטגרל הוא $2x_0s^2$, וקשרו זאת לנגזרות המעורבות. במישור $P$–$V$ העבודה שנעשית על גז, $\dbar W = -P\,\mathrm{d}V$, היא תבנית מאותו סוג: הראו שהיא אינה מדויקת, ואמרו איזו תוצאה פיזיקלית נובעת מכך עבור גז שמועבר סביב מחזור סגור. בדקו את התוצאות שלכם בגבולות.
        solution:
          - kind: law
            text: >-
              תבנית מדויקת נותנת אפס סביב כל לולאה סגורה. עבור $\omega = M\,\mathrm{d}x + N\,\mathrm{d}y$, האינטגרל סביב לולאה קטנה הוא $(\partial N/\partial x - \partial M/\partial y)$ כפול השטח הכלוא, בסדר המוביל; עבור מלבן ותבנית עם $M = 0$, האינטגרל בא משתי הצלעות האנכיות בלבד.
          - kind: manipulation
            text: >-
              ריבוע היחידה: על הצלע התחתונה והעליונה $\mathrm{d}y = 0$; על הצלע השמאלית $x = 0$; הצלע הימנית, $x = 1$ כש-$y$ עולה מ-$0$ ל-$1$, נותנת $1$. לכן $\oint\omega_2 = 1$. הוא היה חייב להיות שונה מאפס: אילו $\omega_2$ הייתה מדויקת, כל לולאה הייתה נותנת אפס, והמבחן הראה שהיא אינה מדויקת. ריבוע בעל צלע $s$ שמרכזו ב-$(x_0, y_0)$: הצלע הימנית, ב-$x_0 + s/2$, עולה ונותנת $(x_0 + s/2)^2 s$; הצלע השמאלית, ב-$x_0 - s/2$, יורדת ונותנת $-(x_0 - s/2)^2 s$; הסכום הוא $2x_0s^2$ בדיוק. זה $(\partial N/\partial x - \partial M/\partial y) = 2x_0$ כפול השטח $s^2$: אי-ההסכמה של הנגזרות המעורבות היא האינטגרל סביב הלולאה ליחידת שטח.
          - kind: manipulation
            text: >-
              במישור $P$–$V$, $\dbar W = 0\,\mathrm{d}P + (-P)\,\mathrm{d}V$, ולכן $\partial(0)/\partial V = 0$ אבל $\partial(-P)/\partial P = -1$: לא מדויקת, וסביב לולאה $-\oint P\,\mathrm{d}V$ הוא פלוס או מינוס השטח הכלוא, והסימן נקבע לפי הכיוון. סביב מחזור שעוברים בו בכיוון השעון, בדיאגרמה שבה $V$ על הציר האופקי ו-$P$ על האנכי, הגז מתפשט בלחץ גבוה ונדחס בלחץ נמוך: $W = -\oint P\,\mathrm{d}V = -(\text{area}) < 0$, עבודה נטו שהגז עושה. הגז חוזר למצב ההתחלתי שלו, ולכן $\Delta U = 0$ ו-$Q = -W > 0$: סביב מחזור, חום שנקלט הופך לעבודה. זה מנוע חום, והוא אפשרי רק כי עבודה אינה פונקציית מצב.
          - kind: formula
            text: >-
              $\oint_{\square}\omega_2 = 1, \qquad \oint_{s \times s}\omega_2 = 2x_0s^2 = \left(\dfrac{\partial N}{\partial x} - \dfrac{\partial M}{\partial y}\right)s^2, \qquad \oint \dbar W = -\oint P\,\mathrm{d}V$
          - kind: limit
            text: >-
              $s \to 0$: האינטגרל סביב הלולאה מתאפס כמו $s^2$, השטח, ולכן לולאה קטנה מספיק אינה נותנת כלום, לא משנה עד כמה התבנית אינה מדויקת. $x_0 = 0$: הנגזרות המעורבות מסכימות על ציר ה-$y$, וריבוע שמרכזו שם נותן $0$ בדיוק. עבור $\omega_1$ הגורם $\partial N/\partial x - \partial M/\partial y$ הוא $0$ בכל מקום, וכל לולאה נותנת $0$. מחזור שאינו סוגר שטח, הלוך וחזור לאורך אותו מסלול במישור $P$–$V$, נותן $W = 0$.
          - kind: units
            text: >-
              $x$ ו-$y$ הם כאן מספרים טהורים, וכך גם האינטגרלים. במישור $P$–$V$ השטח הכלוא הוא $\text{Pa}\cdot\text{m}^3 = \text{J}$: שטח במישור הזה הוא אנרגיה.
          - kind: substitution
            text: >-
              ריבוע היחידה: $1$. ריבוע בעל צלע $0.5$ שמרכזו ב-$(1.25, 1.25)$: $2 \times 1.25 \times 0.25 = 0.625$, ואת זה משחזר האינטגרל לאורך ארבע הצלעות שלו; צלע $0.1$ שמרכזה ב-$(1.05, 1.05)$: $0.021$.
          - kind: result
            text: >-
              $\oint\omega_2 = 1$ סביב ריבוע היחידה, ו-$2x_0s^2$ סביב ריבוע קטן: האינטגרל סביב הלולאה ליחידת שטח הוא אי-ההסכמה של הנגזרות המעורבות, וזו הסיבה שהמבחן הזה מכריע מדויקות. העבודה, $\dbar W = -P\,\mathrm{d}V$, נכשלת במבחן, ולכן גז שמועבר סביב מחזור יכול להחליף עבודה נטו השווה לשטח הכלוא, עם $\Delta U = 0$ וחום נטו שווה והפוך: העיקרון של כל מנוע חום.
        rubric:
          - text: >-
              $\oint\omega_2 = 1$, עם הסיבה שהיה חייב להיות שונה מאפס (תבנית מדויקת נותנת אפס סביב כל לולאה).
          - text: >-
              גזירת $2x_0s^2$ וקישורו ל-$\partial N/\partial x - \partial M/\partial y$ כפול השטח.
            weight: 2
          - text: >-
              הראיה ש-$-P\,\mathrm{d}V$ אינה מדויקת ושהעבודה נטו סביב מחזור היא השטח הכלוא.
            weight: 2
          - text: >-
              ניסוח התוצאה: $\Delta U = 0$ סביב מחזור, ולכן החום נטו שנכנס שווה לעבודה נטו שיוצאת; זה מנוע.
          - text: >-
              בדיקת גבולות: $s \to 0$, $x_0 = 0$, או מחזור שאינו סוגר שטח.
