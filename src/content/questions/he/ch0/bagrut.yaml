# שאלות החזרה של מודול 00, מתוך דף הבעיות של ThermoLab (content/en/foundations/00-orientation-problems.md, בעיות
# 2–5; בעיות 1 ו-6 עברו לחוברת התרגול). הדוגמאות הפתורות 2–5 של השיעור כבר פותרות את הבעיות האלה עם המספרים של
# ThermoLab, ולכן כאן נשמרו הנושא והשאלה הפתוחה של כל בעיה, אבל המספרים, התבניות והתרחיש שונו. כל מספר חושב מחדש
# בספרייה של ThermoLab (sampling, forms, validation); מספרים מסימולציה הם ממוצעים על פני כמה זרעים. ב-ThermoLab
# הפתרונות נשארו אצל המרצה; הפלטפורמה הזו מפרסמת פתרונות מלאים ומחוונים. המזהים משותפים עם הקובץ באנגלית.
lang: he
chapter: 0
questions:
  - id: Q-0-bagrut-1
    type: bagrut
    title: >-
      הנהלת חשבונות של פיזורים, ומתי המיצוע מפסיק להשתלם
    prompt: >-
      לקובייה הוגנת $\mu_1 = 3.5$ ו-$\sigma_1 = \sqrt{35/12} = 1.708$. ניסוי ממצע $N$ קוביות הוגנות בלתי תלויות, והניסוי חוזר פעמים רבות.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-0.1-3]
        prompt: >-
          מצאו את סטיית התקן של הממוצע של $N = 2500$ קוביות.
        answer: 0.0342
        unit: ''
        tolerance: 0.02
        correctFeedback: >-
          $\sigma_1/\sqrt{2500} = 1.708/50 = 0.0342$. נמדד, $1000$ ניסויים לכל אחד משמונה זרעים: $0.0341 \pm 0.0002$.
        wrongFeedback: >-
          סטיית התקן של הממוצע היא $\sigma_1/\sqrt N$.
        commonWrong:
          - value: 0.000683
            feedback: >-
              זה $\sigma_1/N$. השונות קטנה כמו $1/N$; סטיית התקן, השורש שלה, קטנה כמו $N^{-1/2}$.
            misconception: MC-scatter-one-over-n
          - value: 85.4
            feedback: >-
              זה $\sigma_1\sqrt N$, הפיזור של ה**סכום** של הקוביות. חלקו את הסכום ב-$N$ כדי לקבל את הממוצע, וגם את הפיזור שלו ב-$N$.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-0.1-3]
        prompt: >-
          כמה קוביות צריך למצע כדי שסטיית התקן של הממוצע תרד ל-$0.005$?
        answer: 1.167e5
        unit: ''
        tolerance: 0.02
        correctFeedback: >-
          $N = (\sigma_1/0.005)^2 = (35/12)/(2.5 \times 10^{-5}) = 1.17 \times 10^{5}$: מאה ושבעה עשר אלף קוביות בכל ניסוי, דיוק טוב פי שבעה מזה של סעיף (א) תמורת פי ארבעים ושבעה קוביות.
        wrongFeedback: >-
          פתרו את $\sigma_1/\sqrt N = 0.005$ עבור $N$.
        commonWrong:
          - value: 342
            feedback: >-
              זה $\sigma_1/0.005$: הוא מניח שהפיזור קטן כמו $1/N$. הוא קטן כמו $N^{-1/2}$, ולכן צריך להעלות את היחס בריבוע.
            misconception: MC-scatter-one-over-n
      - label: ג
        type: mc
        points: 4
        objectives: [OBJ-0.1-3, OBJ-0.1-1]
        prompt: >-
          עבור ה-$N$ של סעיף (ב), סטיית התקן של ה**סכום** של הקוביות היא $583$, לעומת $17.1$ עבור $100$ קוביות. כיצד הסכום יכול להיעשות פחות צפוי בזמן שהממוצע נעשה צפוי יותר?
        choices:
          - text: >-
              הם עונים על שאלות שונות. הפיזור של הסכום גדל כמו $\sqrt N$, אבל הסכום עצמו גדל כמו $N$, ולכן ביחס לגודלו הפיזור קטן, בדיוק באותה מידה כמו זה של הממוצע: $583/(1.17 \times 10^{5} \times 3.5) = 0.005/3.5 = 0.14\%$.
            correct: true
            feedback: >-
              נכון. שני הפיזורים באים מאותו $\operatorname{Var}(S_N) = N\sigma_1^2$; החלוקה ב-$N$ הופכת את הפיזור המוחלט הגדל של הסכום לפיזור הקטן של הממוצע.
          - text: >-
              הוא אינו יכול: הוספת קוביות מדכאת את האקראיות גם בסכום, ולכן ה-$583$ חייב להיות טעות.
            feedback: >-
              $\operatorname{Var}(S_N) = N\sigma_1^2$, ולכן הסכום סוטה ב-$\sigma_1\sqrt N = 1.708 \times 342 = 583$. הפיזור המוחלט של הסכום גדל בלי חסם; רק זה של הממוצע קטן.
            misconception: MC-sum-scatter-shrinks
          - text: >-
              הקוביות המאוחרות מפצות על המוקדמות בממוצע, אבל לא בסכום.
            feedback: >-
              שום דבר אינו מפצה על שום דבר, לא בסכום ולא בממוצע: לקוביות אין זיכרון. העודף של הסכום נשאר, והממוצע מחלק אותו ב-$N$.
            misconception: MC-lln-compensation
          - text: >-
              מיצוע מחלק את הפיזור ב-$N$ וסכימה מכפילה אותו ב-$N$, ולכן השניים נעים בכיוונים הפוכים באותו גורם.
            feedback: >-
              הכיוונים נכונים, הגורמים לא. השונויות משתנות כמו $N$ בסכום וכמו $1/N$ בממוצע, ולכן הפיזורים משתנים כמו $\sqrt N$ וכמו $1/\sqrt N$: כאן גורם של $34$, לא $1170$, ביחס ל-$N = 100$.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-0.1-1, OBJ-0.1-3]
        prompt: >-
          מעבדה קוראת מדחום $M$ פעמים וממצעת את הקריאות, בציפייה שהדיוק ישתפר כמו $\sqrt M$. כל קריאה היא $T_\text{true} + b + e_i$: הרעש $e_i$ בלתי תלוי מקריאה לקריאה, עם סטיית תקן $\sigma = 0.20\,\text{K}$, ואילו היסט הכיול $b$ זהה בכל הקריאות של המדחום הזה ונקבע פעם אחת, באקראי, עם סטיית תקן $s_b = 0.05\,\text{K}$. נסחו מה חייב להתקיים במדידות חוזרות כדי שחוק $\sqrt M$ יתקיים. גזרו את סטיית התקן של הממוצע של $M$ קריאות, חשבו אותה עבור $M = 100$, והשוו אותה למה שחוק $\sqrt M$ מבטיח. אמרו כיצד אפשר לקנות דיוק רב יותר. בדקו את התוצאה שלכם בגבולות.
        solution:
          - kind: law
            text: >-
              חוק $\sqrt M$ דורש שהשגיאות של $M$ המדידות יהיו בלתי תלויות (ליתר דיוק, בלתי מתואמות), כל אחת עם שונות סופית. אז השונויות מתחברות: $\operatorname{Var}\left(\sum_i e_i\right) = M\sigma^2$, והחלוקה ב-$M$ נותנת $\sigma^2/M$. שונות משותפת בין קריאות מוסיפה איברים שאינם קטנים.
          - kind: manipulation
            text: >-
              הממוצע של הקריאות הוא $T_\text{true} + b + \frac1M\sum_i e_i$. ההיסט $b$ מופיע בכל קריאה, ולכן המיצוע אינו מקטין אותו; הוא בלתי תלוי ברעש, ולכן שתי השונויות מתחברות: $\operatorname{Var}(\bar T) = s_b^2 + \sigma^2/M$. באופן שקול, לכל זוג קריאות יש שונות משותפת $s_b^2$, מתאם $\rho = s_b^2/(s_b^2 + \sigma^2) = 0.059$, ו-$\operatorname{Var}(\bar T) = (s_b^2 + \sigma^2)\left[(1 - \rho)/M + \rho\right]$, שהוא אותו דבר.
          - kind: formula
            text: >-
              $\sigma_{\bar T} = \sqrt{s_b^2 + \dfrac{\sigma^2}{M}}$
          - kind: limit
            text: >-
              $s_b \to 0$: $\sigma_{\bar T} = \sigma/\sqrt M$, חוק $\sqrt M$. $M = 1$: $\sqrt{s_b^2 + \sigma^2}$, הפיזור של קריאה אחת. $M \to \infty$: $\sigma_{\bar T} \to s_b = 0.05\,\text{K}$, רצפה ששום כמות של מיצוע אינה מורידה. החוק תקף כל עוד $\sigma^2/M \gg s_b^2$, כלומר עבור $M \ll (\sigma/s_b)^2 = 16$, ונכשל מעבר לכך.
          - kind: units
            text: >-
              $s_b$, $\sigma$ ו-$\sigma_{\bar T}$ הן טמפרטורות בקלווין; $M$ ו-$\rho$ הם מספרים טהורים.
          - kind: substitution
            text: >-
              $M = 100$: $\sqrt{0.0025 + 0.0004} = \sqrt{0.0029} = 0.054\,\text{K}$ (בסימולציה, $20\,000$ מדחומים לכל אחד משמונה זרעים: $0.0539 \pm 0.0001\,\text{K}$). חוק $\sqrt M$, כשמפעילים אותו על הפיזור של קריאה אחת, $0.206\,\text{K}$, מבטיח $0.021\,\text{K}$: השגיאה הכנה גדולה פי $2.6$, והיא כבר בטווח של $8\%$ מהרצפה.
          - kind: result
            text: >-
              $\sigma_{\bar T} = \sqrt{s_b^2 + \sigma^2/M}$: $0.054\,\text{K}$ ב-$M = 100$, לעומת ה-$0.021\,\text{K}$ שחוק $\sqrt M$ מבטיח, ולעולם לא מתחת ל-$0.05\,\text{K}$. מיצוע מקטין רק את החלק של השגיאה שבלתי תלוי מקריאה לקריאה. כדי להשתפר, צריך לגרום להיסט להשתנות: למצע על פני כמה מדחומים שכוילו כל אחד בנפרד, שההיסטים שלהם בלתי תלויים זה בזה, או לכייל את המדחום מול מדחום ייחוס, וזה מקטין את $s_b$ עצמו.
        rubric:
          - text: >-
              ניסוח התנאי: השגיאות בלתי תלויות (בלתי מתואמות) ממדידה למדידה, עם שונות סופית.
          - text: >-
              גזירת $\operatorname{Var}(\bar T) = s_b^2 + \sigma^2/M$, עם הסבר מדוע ההיסט המשותף אינו נעלם במיצוע.
            weight: 2
          - text: >-
              חישוב $0.054\,\text{K}$ ב-$M = 100$ והשוואתו ל-$0.021\,\text{K}$ של חוק $\sqrt M$.
          - text: >-
              תרופה שהופכת את ההיסטים לבלתי תלויים (כמה מדחומים) או מסלקת אותם (כיול).
          - text: >-
              בדיקת גבולות: $s_b \to 0$ מחזיר את $\sigma/\sqrt M$, או ש-$M \to \infty$ משאיר את הרצפה $s_b$.
            weight: 2

  - id: Q-0-bagrut-2
    type: bagrut
    title: >-
      בלש ממדים
    prompt: >-
      יחידות SI לאורך כל הדרך, עם $k_B = 1.381 \times 10^{-23}\,\text{J/K}$. גז אידיאלי מקיים $PV = Nk_BT$, כאשר $N$ הוא מניין טהור של מולקולות.
    parts:
      - label: א
        type: mc
        points: 4
        objectives: [OBJ-0.1-4]
        prompt: >-
          מתוך $PV = Nk_BT$, מהן יחידות ה-SI של $k_B$?
        choices:
          - text: >-
              $\text{J/K}$
            correct: true
            feedback: >-
              נכון. $[PV] = \text{Pa}\cdot\text{m}^3 = (\text{N/m}^2)\cdot\text{m}^3 = \text{N}\cdot\text{m} = \text{J}$, ו-$N$ הוא מספר טהור, ולכן $[k_B] = \text{J}/\text{K}$: אנרגיה לקלווין.
          - text: >-
              $\text{J}\cdot\text{K}$
            feedback: >-
              $k_B$ מכפיל את $T$ כדי לתת אנרגיה, ולכן הוא חייב לשאת $1/\text{K}$, לא $\text{K}$.
          - text: >-
              $\text{J}/(\text{mol}\cdot\text{K})$
            feedback: >-
              אלה היחידות של קבוע הגזים $R = N_Ak_B$, ב-$PV = nRT$ של הכימיה, עם $n$ במולים. ב-$PV = Nk_BT$, $N$ סופר מולקולות ואין לו יחידה.
          - text: >-
              $\text{Pa}\cdot\text{m}^3$
            feedback: >-
              זה ג'אול, היחידה של $PV$ עצמו. חלוקה ב-$NT$ משאירה $\text{J/K}$.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-0.1-4]
        prompt: >-
          לגז אידיאלי חד-אטומי $P = \tfrac23 u$, כאשר $u$ היא האנרגיה הקינטית שלו ליחידת נפח. מצאו את $u$ עבור ארגון ב-$P = 1.00 \times 10^{5}\,\text{Pa}$, ב-$\text{J/m}^3$.
        answer: 1.50e5
        unit: J/m^3
        tolerance: 0.02
        correctFeedback: >-
          $u = \tfrac32 P = 1.50 \times 10^{5}\,\text{J/m}^3$. ללחץ ולצפיפות האנרגיה יש יחידה משותפת, ובכל זאת הם נבדלים בגורם $1.5$.
        wrongFeedback: >-
          פתרו את $P = \tfrac23 u$ עבור $u$.
        commonWrong:
          - value: 1.00e5
            feedback: >-
              זה מתייחס ללחץ כאל צפיפות האנרגיה, כי היחידות מסכימות. יחידות שוות מתירות גורם חסר ממד, וכאן הוא $\tfrac23$.
          - value: 6.67e4
            feedback: >-
              זה $\tfrac23 P$. הקשר הוא $P = \tfrac23 u$, ולכן $u = \tfrac32 P$.
      - label: ג
        type: mc
        points: 4
        objectives: [OBJ-0.1-4]
        prompt: >-
          מולקולה עוברת מרחק מסוים בין התנגשויות. כאשר $n$ הוא מספר המולקולות ליחידת נפח ($\text{m}^{-3}$) ו-$\sigma$ חתך הפעולה להתנגשות של מולקולה ($\text{m}^2$), איזה מאלה יכול להיות המרחק הזה?
        choices:
          - text: >-
              $\dfrac{1}{n\sigma}$
            correct: true
            feedback: >-
              נכון. $[n\sigma] = \text{m}^{-3}\cdot\text{m}^2 = \text{m}^{-1}$, ולכן $1/(n\sigma)$ הוא אורך. לתוצאה המלאה, $1/(\sqrt2\,n\sigma)$, יש גורם שממדים אינם יכולים לספק; לאוויר בתנאי החדר, עם $\sigma$ של כ-$4 \times 10^{-19}\,\text{m}^2$, היא כ-$70\,\text{nm}$.
          - text: >-
              $n\sigma$
            feedback: >-
              זה אורך הפוך, $\text{m}^{-1}$: הסיכוי להתנגשות לכל מטר של דרך. ההופכי שלו הוא אורך.
          - text: >-
              $\dfrac{1}{n\sigma^2}$
            feedback: >-
              $[n\sigma^2] = \text{m}^{-3}\cdot\text{m}^4 = \text{m}$, ולכן ההופכי שלו הוא $\text{m}^{-1}$.
          - text: >-
              $\dfrac{\sigma}{n}$
            feedback: >-
              $\text{m}^2/\text{m}^{-3} = \text{m}^5$: לא אורך.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-0.1-4]
        prompt: >-
          הראו שהפסקל והג'אול למטר מעוקב הם אותה יחידה. לאור סעיף (ב), האם מותר להסיק מהיחידות שהלחץ של גז הוא צפיפות האנרגיה שלו? אמרו מה ניתוח ממדי מתיר כאן ומה אינו מתיר. אחר כך: סימולציה של גז חד-אטומי ב-$300\,\text{K}$ מדווחת על אנרגיה קינטית ממוצעת למולקולה של $6.19 \times 10^{-21}\,\text{J}$, כשהתיאוריה נותנת $\tfrac32 k_BT$. סטודנט בודק ששתיהן נבדלות בפחות מ-$10^{-12}\,\text{J}$ ומדווח על התאמה מושלמת. אמרו מה שגוי בבדיקה, הציעו בדיקה טובה יותר, והפעילו אותה. בדקו את הבדיקה שלכם בגבול.
        solution:
          - kind: law
            text: >-
              רק גדלים בעלי אותם ממדים אפשר להשוות, ומשוואה ביניהם עדיין יכולה לשאת כל גורם חסר ממד. שני מספרים מסכימים כשההפרש היחסי ביניהם, $|a - b|/|b|$, קטן לעומת הדיוק שנטען.
          - kind: manipulation
            text: >-
              $\text{Pa} = \text{N/m}^2 = \text{N}\cdot\text{m}/\text{m}^3 = \text{J/m}^3$. לכן ללחץ ולצפיפות אנרגיה יש אותם ממדים, וניתוח ממדי מתיר רק את ההשערה ש-$P$ הוא מספר טהור כלשהו כפול $u$, אם שום גודל אחר אינו נכנס. את המספר הוא אינו יכול לספק: לגז אידיאלי חד-אטומי $P = \tfrac23 u$, לקרינה איזוטרופית $P = \tfrac13 u$, ושניהם עוברים את הבדיקה. הוא יכול לפסול נוסחאות, לעולם לא לגזור את המקדמים שלהן.
          - kind: manipulation
            text: >-
              הבדיקה $|a - b| < 10^{-12}\,\text{J}$ חסרת משמעות בסקאלה הזו: אנרגיות מולקולריות הן בסביבות $10^{-21}\,\text{J}$, ולכן כל שתיים מהן עוברות אותה, יהיה מה שהסימולציה עשתה. הבדיקה הכנה משווה את ההפרש לגודלו של הגודל עצמו: $|a - b|/|b| < \epsilon$, כאשר $\epsilon$ הוא הדיוק שהסימולציה טוענת לו.
          - kind: formula
            text: >-
              $\text{Pa} = \text{J/m}^3, \qquad \dfrac{|a - b|}{|b|} < \epsilon$
          - kind: limit
            text: >-
              החליפו את יחידת האנרגיה לאלקטרון-וולט, $1.602 \times 10^{-19}\,\text{J}$: שתי האנרגיות נעשות $0.03879$ ו-$0.03864\,\text{eV}$, הן נבדלות ב-$1.5 \times 10^{-4}\,\text{eV}$, ואותה בדיקה עם $10^{-12}$ נכשלת עכשיו. הכרעה שמתהפכת עם בחירת היחידה אינה אומרת דבר על הפיזיקה; ההפרש היחסי הוא $0.39\%$ בשתי היחידות. כש-$T \to 0$ שתי האנרגיות שואפות לאפס והבדיקה המוחלטת עוברת עבור כל תוצאה שהיא, בעוד הבדיקה היחסית עדיין מודדת התאמה.
          - kind: units
            text: >-
