      - label: ד
        type: open
        points: 13
        objectives: [OBJ-0.1-5]
        prompt: >-
          פתחו את $P(V + \mathrm{d}V, T + \mathrm{d}T)$ עד סדר שני בשינויים, חשבו את האיברים מסדר שני, והשוו אותם להפרש בין סעיפים (ג) ו-(ב). הסבירו בלי חישוב מדוע עלייה של $2\%$ ב-$T$ יחד עם **עלייה** של $2\%$ ב-$V$ משאירה את $P$ ללא שינוי בדיוק, ומה הדיפרנציאל השלם נותן עבורה. אחר כך, לאורך האיזוברה שעוברת דרך המצב ההתחלתי, שעליה $V \propto T$, מצאו את $\mathrm{d}P/\mathrm{d}T$; השוו אותו ל-$(\partial P/\partial T)_V$ וציינו איזה איבר של הדיפרנציאל השלם אחראי להפרש. בדקו את התוצאות שלכם בגבולות.
        solution:
          - kind: law
            text: >-
              הדיפרנציאל השלם הוא השינוי מסדר ראשון, $\mathrm{d}P = (\partial P/\partial T)_V\,\mathrm{d}T + (\partial P/\partial V)_T\,\mathrm{d}V$; האיברים הבאים בפיתוח טיילור הם $\tfrac12 P_{TT}\,\mathrm{d}T^2 + P_{TV}\,\mathrm{d}T\,\mathrm{d}V + \tfrac12 P_{VV}\,\mathrm{d}V^2$.
          - kind: manipulation
            text: >-
              עם $P = Nk_BT/V$: $P_{TT} = 0$, $P_{TV} = -Nk_B/V^2$, $P_{VV} = 2Nk_BT/V^3$. האיברים מסדר שני הם $P\left[(\mathrm{d}V/V)^2 - (\mathrm{d}T/T)(\mathrm{d}V/V)\right]$. עלייה של $T$ ושל $V$ באותו יחס משאירה את $T/V$, ולכן את $P$, ללא שינוי בדיוק; גם הדיפרנציאל השלם נותן $P(\mathrm{d}T/T - \mathrm{d}V/V) = 0$: שתי התגובות מסדר ראשון מבטלות זו את זו.
          - kind: manipulation
            text: >-
              לאורך האיזוברה, $V = V_1T/T_1$ ו-$\mathrm{d}V/\mathrm{d}T = V/T$. חלוקת הדיפרנציאל השלם ב-$\mathrm{d}T$ נותנת $\mathrm{d}P/\mathrm{d}T = Nk_B/V + (-Nk_BT/V^2)(V/T) = 0$, כפי שחייב להיות על קו של לחץ קבוע, בעוד $(\partial P/\partial T)_V = Nk_B/V = 138.1\,\text{Pa/K}$. ההפרש הוא האיבר $(\partial P/\partial V)_T\,\mathrm{d}V/\mathrm{d}T$: הנגזרת החלקית מתעלמת מכך ש-$V$ משתנה לאורך המסלול.
          - kind: formula
            text: >-
              $\Delta P - \mathrm{d}P \approx P\left[\left(\dfrac{\mathrm{d}V}{V}\right)^2 - \dfrac{\mathrm{d}T}{T}\,\dfrac{\mathrm{d}V}{V}\right], \qquad \left.\dfrac{\mathrm{d}P}{\mathrm{d}T}\right|_{P} = \left(\dfrac{\partial P}{\partial T}\right)_V + \left(\dfrac{\partial P}{\partial V}\right)_T\dfrac{\mathrm{d}V}{\mathrm{d}T} = 0$
          - kind: limit
            text: >-
              $\mathrm{d}V = 0$: האיברים מסדר שני מתאפסים, ומכיוון ש-$P$ לינארי ב-$T$ ההערכה מדויקת. הקטנת שני השינויים פי $k$ מקטינה את ההערכה פי $k$ ואת השגיאה שלה פי $k^2$: ההפרשים המדויקים הם $45.1$, $11.2$ ו-$2.78\,\text{Pa}$ עבור $k = 1$, $2$ ו-$4$, גורם של כ-$4$ בכל פעם. ההערכה נעשית מדויקת בגבול, וזה מה שהופך את הדיפרנציאל השלם לנגזרת.
          - kind: units
            text: >-
              $P\,(\mathrm{d}V/V)^2$ הוא לחץ כפול מספר טהור: פסקלים. $(\partial P/\partial V)_T\,\mathrm{d}V/\mathrm{d}T$ הוא $(\text{Pa/m}^3)(\text{m}^3/\text{K}) = \text{Pa/K}$, כמו $(\partial P/\partial T)_V$.
          - kind: substitution
            text: >-
              $\mathrm{d}T/T = 0.02$, $\mathrm{d}V/V = -0.02$: האיברים מסדר שני הם $5.524 \times 10^{4} \times (0.0004 + 0.0004) = 44.2\,\text{Pa}$, לעומת ההפרש בפועל, $2255 - 2210 = 45.1\,\text{Pa}$; ה-$0.9\,\text{Pa}$ הנותרים הם מסדר שלישי.
          - kind: result
            text: >-
              ההערכה מחטיאה ב-$45.1\,\text{Pa}$, ומתוכם האיברים מסדר שני אחראים ל-$44.2\,\text{Pa}$; השגיאה קטנה כמו ריבוע השינויים. עליות שוות באחוזים של $T$ ושל $V$ משאירות את $P$ ללא שינוי, גם במדויק וגם בסדר ראשון. לאורך האיזוברה $\mathrm{d}P/\mathrm{d}T = 0$, לא $138.1\,\text{Pa/K}$: האיבר $(\partial P/\partial V)_T\,\mathrm{d}V$ מבטל את איבר הטמפרטורה.
        rubric:
          - text: >-
              גזירת האיברים מסדר שני, $P[(\mathrm{d}V/V)^2 - (\mathrm{d}T/T)(\mathrm{d}V/V)]$, וחישוב $44.2\,\text{Pa}$ לעומת $45.1\,\text{Pa}$.
            weight: 2
          - text: >-
              הסבר מדוע עליות שוות באחוזים של $T$ ושל $V$ משאירות את $P$ ללא שינוי, ושהדיפרנציאל השלם נותן אפס.
          - text: >-
              מציאת $\mathrm{d}P/\mathrm{d}T = 0$ לאורך האיזוברה, וזיהוי האיבר $(\partial P/\partial V)_T\,\mathrm{d}V$ כמקור ההפרש מ-$(\partial P/\partial T)_V$.
            weight: 2
          - text: >-
              בדיקת גבולות: $\mathrm{d}V = 0$ הופך את ההערכה למדויקת, או שהשגיאה קטנה פי $k^2$ כשהשינויים קטנים פי $k$.

