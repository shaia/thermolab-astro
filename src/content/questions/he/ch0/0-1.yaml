# שאלות הבדיקה של שיעור 0.1. הומרו מ-assessment/quizzes/00-orientation.he.yml של ThermoLab (Q-00-1 … Q-00-10, כל
# העשר; Q-00-9, שאלת ניבוי, ו-Q-00-10, שאלה פתוחה קצרה, הפכו לרב-ברירה; המשוב של Q-00-2 על 17.5 תוקן, ראו
# docs/thermolab-errata.md) והורחבו כך שיכסו את שבע המטרות ואת ארבע התפיסות השגויות של
# src/content/misconceptions/0-1.yaml. כל מספר חושב מחדש בספרייה של ThermoLab (sampling, forms, validation); מספרים
# מסימולציה הם ממוצעים על פני כמה זרעים. המזהים משותפים עם הבנק באנגלית, שחייב להכיל את אותן שאלות עם אותן תשובות.
lang: he
chapter: 0
questions:
  # ---------------------------------------------------------------- OBJ-0.1-1: חוק מתוך אירועים חסרי חוק
  - id: Q-0.1-one-or-many
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-1]
    prompt: >-
      מה צפוי יותר: הפן של קובייה הוגנת אחת, או הממוצע של $10\,000$ קוביות הוגנות? בערך בכמה, ומדוע?
    choices:
      - text: >-
          הממוצע, בערך פי מאה: הטלה אחת סוטה מ-$3.5$ בכ-$1.7$, הממוצע של $10\,000$ בכ-$0.017$. כל הטלה מוסיפה יחידה שלמה למניין, אבל לסכום רק סטייה אקראית, ולכן העודף האופייני של הסכום מעל $3.5N$ גדל כמו $\sqrt N$, בעוד המחלק גדל כמו $N$.
        correct: true
        feedback: >-
          נכון. $\sigma_1 = \sqrt{35/12} = 1.708$ ו-$\sigma_1/\sqrt{10\,000} = 0.0171$. שום דבר לא השתנה באף קובייה: העודף של הסכום הוא בדרך כלל $\sigma_1\sqrt{N} = 171$, והחלוקה שלו ב-$N = 10\,000$ היא שהופכת אותו לקטן.
      - text: >-
          הממוצע, בערך פי מאה, כי ההטלות המאוחרות מבטלות את הסטיות של המוקדמות.
        feedback: >-
          המספר נכון והמנגנון שגוי. לקוביות אין זיכרון: אחרי רצף של שישיות ההטלות הבאות עדיין מתמצעות ל-$3.5$. העודף המוקדם של הסכום לעולם אינו מבוטל; הוא מחולק ב-$N$ שהולך וגדל. דילול, לא פיצוי.
        misconception: MC-lln-compensation
      - text: >-
          הממוצע, פי $10\,000$: השגיאה האופיינית קטנה כמו $1/N$.
        feedback: >-
          השונות של הממוצע קטנה כמו $1/N$; השגיאה האופיינית היא השורש שלה, וקטנה כמו $N^{-1/2}$. עשרת אלפים קוביות טובות מקובייה אחת פי מאה, לא פי עשרת אלפים.
        misconception: MC-scatter-one-over-n
      - text: >-
          אף אחד מהם: כל קובייה בלתי צפויה כמו תמיד, ולכן גם הממוצע שלהן בלתי צפוי באותה מידה.
        feedback: >-
          כל קובייה אכן כזו, והממוצע בכל זאת לא. באיור 0.1א כל הרצה משוננת בהתחלה כמו האחרות, וכל הרצה מסתיימת ליד $3.5$. אילו התשובה הזו הייתה נכונה, שום גודל מאקרוסקופי לא היה ניתן לשחזור.

  - id: Q-0.1-hot-start
    type: numeric
    level: mid
    objectives: [OBJ-0.1-1]
    prompt: >-
      עשר ההטלות הראשונות של קובייה הוגנת מסתכמות ב-$50$, ממוצע של $5.0$. אחר כך הקובייה מוטלת עוד $990$ פעמים. מה הממוצע הצפוי של כל $1000$ ההטלות?
    answer: 3.515
    unit: ''
    tolerance: 0.001
    correctFeedback: >-
      $990$ ההטלות הבאות מתמצעות ל-$3.5$ יהיה מה שהיה לפניהן, ולכן הסכום הצפוי הוא $50 + 990 \times 3.5 = 3515$ והממוצע הצפוי $3.515$. עודף הפתיחה, $50 - 35 = 15$, עדיין נמצא בסכום; הוא רק חולק ב-$1000$. בסימולציה, כשמשאירים רק את ההרצות שעשר ההטלות הראשונות שלהן מסתכמות ב-$50$: $3.5145 \pm 0.0005$ על פני $64$ זרעים.
    wrongFeedback: >-
      חברו את עשר ההטלות הידועות לסכום הצפוי של $990$ ההטלות שאינן ידועות, $990 \times 3.5$, וחלקו ב-$1000$.
    commonWrong:
      - value: 3.5
        feedback: >-
          כך ההטלות המאוחרות מחזירות את ההתחלה החמה. הן אינן עושות זאת: לקוביות אין זיכרון, ולכן העודף של $15$ נשאר בסכום לתמיד. הממוצע מתקרב ל-$3.5$ כי $15/1000$ קטן, לא כי ה-$15$ נעלם.
        misconception: MC-lln-compensation
      - value: 5.0
        feedback: >-
          ההתחלה החמה אינה נמשכת. כל הטלה מאוחרת מתמצעת ל-$3.5$; רק על עשר הראשונות ידוע שהן גבוהות.

  - id: Q-0.1-what-makes-a-law
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-0.1-1, OBJ-0.1-3]
    prompt: >-
      הטיעון שהממוצע של $N$ קוביות מתייצב על $3.5$ נשען על כמה הנחות. איזו מהן, אם מוותרים עליה, עלולה למנוע מהממוצע להתייצב בכלל?
    choices:
      - text: >-
          שהקוביות בלתי תלויות. אילו כל $N$ הקוביות היו מודבקות זו לזו כך שתמיד היו מראות אותו פן, הממוצע שלהן היה הפן של קובייה אחת, עם פיזור $\sigma_1$ לכל $N$.
        correct: true
        feedback: >-
          נכון. לקוביות מודבקות כל השונויות המשותפות שוות ל-$\sigma_1^2$, ולכן $\operatorname{Var}(S_N) = N^2\sigma_1^2$ ו-$\operatorname{Var}(A_N) = \sigma_1^2$: ה-$1/N$ נעלם. מתאם חלש יותר $\rho$ בין כל זוג משאיר רצפה, $\operatorname{Var}(A_N) \to \rho\,\sigma_1^2$ כש-$N \to \infty$. אי-תלות היא ההנחה שקושרת את הטיעון לעולם.
      - text: >-
          שהקוביות הוגנות. לקובייה מוטה אין סיבה להתייצב.
        feedback: >-
          גם קובייה מוטה מתייצבת, על התוחלת שלה, עם ה-$\sigma$ שלה: הגזירה השתמשה רק בשונות סופית ובאי-תלות. ההטיה משנה את המקדם $\sigma/\mu$, לא את ה-$N^{-1/2}$.
      - text: >-
          שלקובייה שישה פנים במרווחים שווים.
        feedback: >-
          שום דבר בהוכחה לא השתמש במספר הפנים או בצורת ההתפלגות; רק בכך שלכל איבר יש שונות סופית ושהשונויות המשותפות מתאפסות. זו הסיבה שאותו טיעון עובד עבור מהירויות מולקולריות.
      - text: >-
          שהקוביות מפצות: הטלה גבוהה מגדילה את הסיכוי להטלה נמוכה אחריה.
        feedback: >-
          הטיעון לא השתמש בזה, וזה שגוי: לקוביות אין זיכרון. אילו זה היה נכון, הטלות עוקבות היו מתואמות שלילית, והממוצע היה מתייצב **מהר** יותר מ-$N^{-1/2}$. הוא מתייצב בדיוק במהירות שאי-תלות חוזה.
        misconception: MC-lln-compensation

  # ---------------------------------------------------------------- OBJ-0.1-2: תוחלת ושונות
  - id: Q-0.1-die-variance
    type: numeric
    level: basic
    objectives: [OBJ-0.1-2]
    prompt: >-
      חשבו את השונות של הטלה אחת של קובייה הוגנת בעלת שישה פנים.
    answer: 2.917
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      $\langle X\rangle = 7/2$ ו-$\langle X^2\rangle = 91/6$, ולכן $\sigma_1^2 = 91/6 - 49/4 = 35/12 = 2.917$. השורש שלה, $\sigma_1 = 1.708$, הוא סטיית התקן, ו-$\sigma_1/\mu_1 = 0.488$ הוא המקדם שלפני $N^{-1/2}$.
    wrongFeedback: >-
      השתמשו ב-$\sigma^2 = \langle X^2\rangle - \langle X\rangle^2$, כשכל פן משוקלל ב-$1/6$.
    commonWrong:
      - value: 1.708
        feedback: >-
          זו סטיית התקן, השורש הריבועי של השונות.
      - value: 15.17
        feedback: >-
          זה $\langle X^2\rangle = 91/6$. החסירו את ריבוע התוחלת, $49/4$.
      - value: 17.5
        feedback: >-
          זה הסכום של ששת ריבועי הסטיות, $\sum_k (k - 3.5)^2$. לכל פן הסתברות $1/6$: חלקו ב-$6$.

  - id: Q-0.1-split-die
    type: numeric
    level: mid
    objectives: [OBJ-0.1-2]
    prompt: >-
      על פני קובייה כתובים $1$, $1$, $1$, $6$, $6$, $6$, וכל פן סביר באותה מידה. חשבו את השונות שלה.
    answer: 6.25
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      $\mu = (3 \cdot 1 + 3 \cdot 6)/6 = 3.5$, כמו בקובייה הוגנת; $\langle X^2\rangle = (3 \cdot 1 + 3 \cdot 36)/6 = 18.5$; $\sigma^2 = 18.5 - 12.25 = 6.25$, ולכן $\sigma = 2.5$: כל פן נמצא במרחק $2.5$ מהתוחלת. גם ממוצעים של קוביות כאלה מתייצבים על $3.5$, אבל לאותו דיוק הם צריכים פי $6.25/2.917 = 2.14$ קוביות.
    wrongFeedback: >-
      חשבו את $\mu$ ואת $\langle X^2\rangle$ כשכל אחד מששת הפנים משוקלל ב-$1/6$, ואז $\sigma^2 = \langle X^2\rangle - \mu^2$.
    commonWrong:
      - value: 2.917
        feedback: >-
          זו הקובייה ההוגנת. לזו אותה תוחלת, $3.5$, אבל כל ההסתברות שלה יושבת בקצוות.
      - value: 2.5
        feedback: >-
          זו סטיית התקן. השונות היא הריבוע שלה.
      - value: 18.5
        feedback: >-
          זה $\langle X^2\rangle$. החסירו $\mu^2 = 12.25$.

  - id: Q-0.1-three-dice
    type: numeric
    level: mid
    objectives: [OBJ-0.1-2, OBJ-0.1-3]
    prompt: >-
      שלוש קוביות הוגנות מוטלות באופן בלתי תלוי. מהי סטיית התקן של הסכום שלהן?
    answer: 2.958
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      שונויות של קוביות בלתי תלויות מתחברות: $3 \cdot 35/12 = 8.75$, ו-$\sqrt{8.75} = 2.958 = \sigma_1\sqrt3$. סטיות תקן אינן מתחברות; הריבועים שלהן כן.
    wrongFeedback: >-
      חברו את שלוש השונויות, $35/12$ כל אחת, ואז הוציאו שורש.
    commonWrong:
      - value: 5.12
        feedback: >-
          זה $3\sigma_1$: חיברתם סטיות תקן. בקוביות בלתי תלויות ה**שונויות** מתחברות, ולכן הפיזור גדל פי $\sqrt3$, לא פי $3$.
      - value: 8.75
        feedback: >-
          זו השונות של הסכום. סטיית התקן היא השורש שלה.
      - value: 0.986
        feedback: >-
          זה $\sigma_1/\sqrt3$, סטיית התקן של ה**ממוצע** של שלוש קוביות. הפיזור של הסכום גדל עם $N$.
        misconception: MC-sum-scatter-shrinks

  - id: Q-0.1-opposite-faces
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-0.1-2]
    prompt: >-
      קובייה הוגנת אחת מוטלת. $X$ הוא הפן העליון ו-$Y$ הפן התחתון; סכום הפנים הנגדיים של קובייה הוא $7$. מהו $\operatorname{Var}(X + Y)$?
    choices:
      - text: >-
          $0$
        correct: true
        feedback: >-
          נכון. $X + Y = 7$ בכל הטלה, ולכן הוא אינו משתנה. בנוסחה הכללית, $\operatorname{Cov}(X, 7 - X) = -\sigma_1^2$, ו-$\sigma_1^2 + \sigma_1^2 - 2\sigma_1^2 = 0$. שונות משותפת שלילית הופכת סכום ליציב יותר משהיו עושים איברים בלתי תלויים.
      - text: >-
          $2\sigma_1^2 = 35/6$
        feedback: >-
          זו התשובה לשתי קוביות בלתי תלויות. $Y$ נקבע על ידי $X$, ולכן השונות המשותפת אינה מתאפסת, ושונויות מתחברות רק כשהיא מתאפסת.
      - text: >-
          $4\sigma_1^2 = 35/3$
        feedback: >-
          זה $X + X$, קובייה אחת שנקראת פעמיים, ושם השונות המשותפת היא $+\sigma_1^2$. כאן פן עליון גבוה פירושו פן תחתון נמוך: השונות המשותפת היא $-\sigma_1^2$.
      - text: >-
          $\sigma_1^2 = 35/12$
        feedback: >-
          ל-$Y = 7 - X$ אותה שונות כמו ל-$X$, אבל השונות של הסכום סופרת גם את השונות המשותפת, $2\operatorname{Cov}(X, Y) = -2\sigma_1^2$.

  # ---------------------------------------------------------------- OBJ-0.1-3: חוק N^(-1/2)
  - id: Q-0.1-ten-thousand
    type: mc
    level: basic
    objectives: [OBJ-0.1-3]
    prompt: >-
      מיצוע של $100$ קוביות הוגנות נותן תשובה שנופלת בדרך כלל בטווח של כ-$0.17$ מ-$3.5$. עכשיו אתם ממצעים $10\,000$ קוביות במקום זאת. איזו טענה נכונה?
    choices:
      - text: >-
          כ-$0.017$: המרחק האופייני קטן כמו $N^{-1/2}$, ולכן $N$ גדול פי מאה מקטין אותו פי עשרה.
        correct: true
        feedback: >-
          נכון, גם במספר וגם בנימוק. $\sigma_{A_N} = \sigma_1/\sqrt N$, ולכן הכפלת $N$ ב-$100$ מחלקת את הפיזור ב-$10$: $1.708/100 = 0.0171$. נמדד על פני שמונה זרעים: $0.0173 \pm 0.0002$.
      - text: >-
          כ-$0.017$: ההטלות המאוחרות מפצות על הסטיות המוקדמות ומבטלות אותן.
        feedback: >-
          המספר נכון והמנגנון שגוי. לקוביות אין זיכרון: אחרי רצף של שישיות ההטלה הבאה עדיין מתמצעת ל-$3.5$. העודף המוקדם לעולם אינו מבוטל; הוא מחולק ב-$N$ שהולך וגדל, עד שהוא מפסיק להיות משמעותי. דילול, לא פיצוי.
        misconception: MC-lln-compensation
      - text: >-
          כ-$0.0017$: המרחק האופייני קטן כמו $1/N$.
        feedback: >-
          טעות הסקאלה הנפוצה ביותר. שונויות מתחברות, ולכן השונות של הממוצע קטנה כמו $1/N$; הפיזור הוא השורש שלה, וקטן כמו $N^{-1/2}$.
        misconception: MC-scatter-one-over-n
      - text: >-
          כ-$0.17$: מיצוע של יותר קוביות אינו משנה כמה ניסוי בודד סוטה.
        feedback: >-
          אילו זה היה כך, שום גודל מאקרוסקופי לא היה ניתן לשחזור. באיור 0.1ב ההיסטוגרמה של הממוצעים מצטמצמת לעין ככל ש-$N$ גדל.

  - id: Q-0.1-sum-and-average
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-3]
    prompt: >-
      ככל ש-$N$ גדל, מה קורה לפיזור המוחלט של ה**סכום** של $N$ קוביות הוגנות, ולפיזור היחסי של ה**ממוצע** שלהן?
    choices:
      - text: >-
          הפיזור המוחלט של הסכום גדל כמו $\sqrt N$; הפיזור היחסי של הממוצע קטן כמו $N^{-1/2}$.
        correct: true
        feedback: >-
          נכון, ושניהם נובעים מהטענה האחת ששונויות של גדלים בלתי תלויים מתחברות, $\operatorname{Var}(S_N) = N\sigma_1^2$. הסכום נעשה פחות צפוי במונחים מוחלטים בזמן שהממוצע נעשה צפוי יותר; אלה שאלות שונות על אותם נתונים.
      - text: >-
          שניהם קטנים, כי מיצוע מדכא אקראיות.
        feedback: >-
          של הממוצע כן, של הסכום לא. $\operatorname{Var}(S_N) = N\sigma_1^2$, ולכן הסכום סוטה ב-$\sigma_1\sqrt N$, שגדל בלי חסם. רק אחרי החלוקה ב-$N$ הפיזור קטן.
        misconception: MC-sum-scatter-shrinks
      - text: >-
          שניהם גדלים, כי יותר קוביות פירושן יותר הזדמנויות לתוצאה קיצונית.
        feedback: >-
          נכון לגבי הסכום, שגוי לגבי הממוצע. הפיזור של הסכום גדל כמו $\sqrt N$, אבל הסכום עצמו גדל כמו $N$, מהר יותר, ולכן הפיזור היחסי של הממוצע קטן.
      - text: >-
          הפיזור של הסכום נשאר קבוע; זה של הממוצע קטן כמו $1/N$.
        feedback: >-
          שני החצאים שגויים. שניהם נובעים מ-$\operatorname{Var}(S_N) = N\sigma_1^2$: הוציאו שורש עבור הסכום, $\sigma_1\sqrt N$, ואז חלקו ב-$N$ עבור הממוצע, $\sigma_1/\sqrt N$.

  - id: Q-0.1-dice-needed
    type: numeric
    level: mid
    objectives: [OBJ-0.1-3]
    prompt: >-
      כמה קוביות הוגנות צריך למצע כדי שהפיזור היחסי של הממוצע, $\sigma_{A_N}/\mu_1$, ירד ל-$1\%$?
    answer: 2381
    unit: ''
    tolerance: 0.03
    correctFeedback: >-
      $\sigma_{A_N}/\mu_1 = 0.488\,N^{-1/2} = 0.01$ נותן $N = (0.488/0.01)^2 = (35/12)/(49/4)/10^{-4} = 2381$. כל שיפור נוסף פי עשרה בדיוק עולה פי מאה בקוביות.
    wrongFeedback: >-
      הציבו $(\sigma_1/\mu_1)\,N^{-1/2} = 0.01$, עם $\sigma_1/\mu_1 = 0.488$, ופתרו עבור $N$.
    commonWrong:
      - value: 48.8
        feedback: >-
          זה $0.488/0.01$: הוא מניח שהפיזור קטן כמו $1/N$. הוא קטן כמו $N^{-1/2}$, ולכן צריך להעלות את היחס בריבוע.
        misconception: MC-scatter-one-over-n
      - value: 29167
        feedback: >-
          זה מוריד את הפיזור ה**מוחלט** ל-$0.01$, $\sigma_1^2/10^{-4}$. השאלה מבקשת $1\%$ מהתוחלת, $0.035$.

  - id: Q-0.1-chebyshev
    type: numeric
    level: bagrut
    objectives: [OBJ-0.1-3]
    prompt: >-
      אי-שוויון צ'בישב חוסם את הסיכוי שהממוצע של $N$ קוביות בלתי תלויות יחטיא את $\mu_1$ ב-$\varepsilon$ או יותר: $P\big(|A_N - \mu_1| \ge \varepsilon\big) \le \sigma_1^2/(N\varepsilon^2)$. חשבו את החסם עבור $N = 1000$ קוביות הוגנות ו-$\varepsilon = 0.1$.
    answer: 0.292
    unit: ''
    tolerance: 0.02
    correctFeedback: >-
      $2.917/(1000 \times 0.01) = 0.292$. הסיכוי האמיתי, מההתפלגות המדויקת של הסכום של $1000$ קוביות, הוא $0.065$: ההחטאה האופיינית היא $\sigma_1/\sqrt{1000} = 0.054$, ולכן $0.1$ הם $1.85$ סטיות תקן. החסם רופף פי $4.5$, אבל הוא אינו צריך דבר מלבד שונות סופית, והוא שואף לאפס כש-$N \to \infty$: חוק המספרים הגדולים החלש.
    wrongFeedback: >-
      הציבו $\sigma_1^2 = 35/12$, $N = 1000$ ו-$\varepsilon^2 = 0.01$.
    commonWrong:
      - value: 0.0292
        feedback: >-
          זה מחלק ב-$\varepsilon$, לא ב-$\varepsilon^2$.
      - value: 0.54
        feedback: >-
          זה $\sigma_{A_N}/\varepsilon = 0.054/0.1$. החסם של צ'בישב הוא הריבוע שלו.

  # ---------------------------------------------------------------- OBJ-0.1-4: ממדים ויחידות
  - id: Q-0.1-speed-dimensions
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-4]
    prompt: >-
      איזה מהביטויים האלה יכול להיות מהירות מולקולרית? ($k_B$ הוא קבוע בולצמן, $T$ טמפרטורה, $m$ המסה של מולקולה.)
    choices:
      - text: >-
          $\sqrt{3k_BT/m}$
        correct: true
        feedback: >-
          נכון. $k_BT$ היא אנרגיה, ולכן $k_BT/m$ היא אנרגיה ליחידת מסה, $\mathsf{L}^2\mathsf{T}^{-2}$, והשורש שלה הוא מהירות. מה שהבדיקה אינה יכולה לומר לכם הוא אם המקדם הוא $1$, $2$ או $3$: ממדים פוסלים נוסחאות שגויות; הם לעולם אינם מספקים את המקדמים של הנכונות.
      - text: >-
          $3k_BT/m$
        feedback: >-
          זו אנרגיה ליחידת מסה, מהירות בריבוע. חסר רק שורש ריבועי אחד.
      - text: >-
          $\sqrt{3k_BTm}$
        feedback: >-
          אנרגיה כפול מסה היא $\mathsf{M}^2\mathsf{L}^2\mathsf{T}^{-2}$, והשורש שלה הוא תנע, לא מהירות.
      - text: >-
          $\sqrt{3k_BT/m^2}$
        feedback: >-
          זו מהירות חלקי שורש של מסה. צמצמו כל מועמד לחזקות של kg, m, s ו-K לפני שאתם מכריעים.

  - id: Q-0.1-exp-argument
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-4]
    prompt: >-
      באטמוספרה איזותרמית בטמפרטורה $T$ צפיפות הגז יורדת עם הגובה $h$. כאשר $m$ היא המסה של מולקולה ו-$g$ תאוצת הכובד, איזה מאלה יכול להיות הגורם שבו היא יורדת?
    choices:
      - text: >-
          $e^{-mgh/(k_BT)}$
        correct: true
        feedback: >-
          נכון. $mgh$ היא אנרגיה וכך גם $k_BT$: המעריך הוא מספר טהור, כפי שחייב להיות הארגומנט של כל אקספוננט. זהו גורם בולצמן של מולקולה בגובה $h$.
      - text: >-
          $e^{-mgh/T}$
        feedback: >-
          למעריך יש יחידות של $\text{J/K}$, ול-$e^{1\,\text{J/K}}$ אין משמעות. $k_B$ נמצא שם כדי להפוך טמפרטורה לאנרגיה.
      - text: >-
          $e^{-h/(k_BT)}$
        feedback: >-
          למעריך יש יחידות של $\text{m/J}$. גובה אינו אנרגיה עד שמכפילים אותו במשקל, $mg$.
      - text: >-
          $e^{-mg/(k_BT)}$
        feedback: >-
          למעריך יש יחידות של $1/\text{m}$, והוא כבר אינו תלוי בגובה. הכפילו ב-$h$ כדי להפוך אותו למספר טהור.

  - id: Q-0.1-helium-speed
    type: numeric
    level: mid
    objectives: [OBJ-0.1-4]
    prompt: >-
      חשבו את $\sqrt{3k_BT/m}$ עבור הליום, $m = 4.003\,u$ עם $u = 1.661 \times 10^{-27}\,\text{kg}$, ב-$T = 300\,\text{K}$, עם $k_B = 1.381 \times 10^{-23}\,\text{J/K}$. תנו את התשובה ב-m/s.
    answer: 1367
    unit: m/s
    tolerance: 0.02
    correctFeedback: >-
      $m = 6.649 \times 10^{-27}\,\text{kg}$, $3k_BT = 1.243 \times 10^{-20}\,\text{J}$, היחס הוא $1.869 \times 10^{6}\,\text{m}^2/\text{s}^2$, והשורש שלו $1367\,\text{m/s}$. חנקן באותה טמפרטורה נותן $517\,\text{m/s}$: היחס הוא $\sqrt{28.0/4.003} = 2.64$, הגורם שהנוסחה חוזה למולקולה קלה פי שבעה.
    wrongFeedback: >-
      המירו קודם את המסה לקילוגרמים, $4.003 \times 1.661 \times 10^{-27}\,\text{kg}$; אחר כך $\text{J/kg} = \text{m}^2/\text{s}^2$.
    commonWrong:
      - value: 789
        feedback: >-
          זה $\sqrt{k_BT/m}$: המקדם $3$ נשמט. ממדים אינם יכולים לתפוס את זה; רק תשומת לב יכולה.
      - value: 1.87e6
        feedback: >-
          זה $3k_BT/m$, מהירות בריבוע, ב-$\text{m}^2/\text{s}^2$. הוציאו שורש.
      - value: 1.76e-9
        feedback: >-
          השתמשתם ב-$4.003\,\text{g} = 4.003 \times 10^{-3}\,\text{kg}$, המסה של מול, כמסה של אטום אחד. מהירות מולקולרית צריכה את המסה של מולקולה אחת.

  # ---------------------------------------------------------------- OBJ-0.1-5: נגזרות חלקיות, דיפרנציאל שלם, אינטגרלים קוויים
  - id: Q-0.1-partial-x
    type: numeric
    level: basic
    objectives: [OBJ-0.1-5]
    prompt: >-
      עבור $f(x, y) = x^2y$, חשבו את $(\partial f/\partial x)_y$ בנקודה $(x, y) = (2, 3)$.
    answer: 12
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      כש-$y$ מוחזק קבוע, $(\partial f/\partial x)_y = 2xy = 2 \cdot 2 \cdot 3 = 12$.
    wrongFeedback: >-
      גזרו את $x^2y$ לפי $x$, כש-$y$ נחשב קבוע, ואז הציבו.
    commonWrong:
      - value: 4
        feedback: >-
          או שגזרתם את $x^2$ והשמטתם את הגורם $y$ ($2x = 4$), או שחישבתם את $(\partial f/\partial y)_x = x^2 = 4$. כש-$y$ מוחזק, הוא גורם קבוע, והוא נשאר.

  - id: Q-0.1-total-differential
    type: mc
    level: basic
    objectives: [OBJ-0.1-5]
    prompt: >-
      מהו הדיפרנציאל השלם של $f(x, y) = x^2y$?
    choices:
      - text: >-
          $\mathrm{d}f = 2xy\,\mathrm{d}x + x^2\,\mathrm{d}y$
        correct: true
        feedback: >-
          נכון: כל נגזרת חלקית מוכפלת בדיפרנציאל של המשתנה שלה. כל יחס מקסוול של מודול 10 הוא טענה על דיפרנציאלים מסוג זה בדיוק.
      - text: >-
          $\mathrm{d}f = x^2\,\mathrm{d}x + 2xy\,\mathrm{d}y$
        feedback: >-
          המקדמים הוחלפו. המקדם של $\mathrm{d}x$ הוא הנגזרת לפי $x$ ב-$y$ קבוע, $2xy$.
      - text: >-
          $\mathrm{d}f = 2xy\,\mathrm{d}x$
        feedback: >-
          זו התגובה לשינוי ב-$x$ בלבד. הדיפרנציאל השלם סופר את שני המשתנים; השמטת האיבר של $\mathrm{d}y$ היא בדיוק הטעות שגורמת לנגזרת חלקית ולנגזרת שלמה לא להסכים.
      - text: >-
          $\mathrm{d}f = 2xy + x^2$
        feedback: >-
          דיפרנציאל חייב לשאת את הדיפרנציאלים $\mathrm{d}x$ ו-$\mathrm{d}y$. בלעדיהם זה סכום של שתי נגזרות, ואי אפשר לבצע עליו אינטגרציה לאורך מסלול.

  - id: Q-0.1-held-variable
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-5]
    prompt: >-
      לגז אידיאלי חד-אטומי $U = \tfrac32 Nk_BT$ ו-$PV = Nk_BT$, עם $N$ קבוע. סטודנט אחד כותב $\partial U/\partial V = 0$; סטודנט אחר כותב $\partial U/\partial V = \tfrac32 P$. מי צודק?
    choices:
      - text: >-
          שניהם, לגבי נגזרות שונות: $(\partial U/\partial V)_T = 0$ ו-$(\partial U/\partial V)_P = \tfrac32 P$. בלי המציין התחתי אין לשאלה תשובה אחת.
        correct: true
        feedback: >-
          נכון. ב-$T$ קבוע האנרגיה אינה משתנה עם הנפח. ב-$P$ קבוע, התפשטות הגז מחממת אותו, $T = PV/(Nk_B)$, ולכן $U = \tfrac32 PV$ גדל עם $V$. אותה פונקציה, אותו משתנה, שתי נגזרות: כתבו את המציין בכל פעם.
      - text: >-
          הראשון: $U$ תלוי רק ב-$T$, ולכן הנגזרת שלו לפי $V$ היא אפס.
        feedback: >-
          רק כל עוד $T$ מוחזק קבוע. בלחץ קבוע שינוי של הנפח משנה את הטמפרטורה, ואיתה את $U$: $(\partial U/\partial V)_P = \tfrac32 P$.
      - text: >-
          השני: הצבת $Nk_BT = PV$ נותנת $U = \tfrac32 PV$, והנגזרת נובעת מכך.
        feedback: >-
          ההצבה הזו הופכת את $U$ לפונקציה של $P$ ו-$V$, ולכן הנגזרת שהיא נותנת היא זו שב-$P$ קבוע. כשכותבים את $U$ כפונקציה של $T$ ו-$V$, הנגזרת שלו ב-$T$ קבוע היא אפס. שתיהן נכונות.
      - text: >-
          אף אחד: $U$ אינו פונקציה של $V$, ולכן $\partial U/\partial V$ אינו קיים.
        feedback: >-
          $P$, $V$ ו-$T$ קשורים זה לזה במשוואת המצב, ולכן אפשר לכתוב את $U$ כפונקציה של כל שניים מהם, ולכל בחירה יש נגזרות חלקיות משלה.

  - id: Q-0.1-line-integral
    type: numeric
    level: mid
    objectives: [OBJ-0.1-5]
    prompt: >-
      בצעו אינטגרציה של התבנית $\omega = x\,\mathrm{d}y$ מ-$(0, 0)$ אל $(1, 1)$ לאורך הפרבולה $y = x^2$.
    answer: 0.667
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      כתבו את המסלול כ-$x = t$, $y = t^2$, כך ש-$\mathrm{d}y = 2t\,\mathrm{d}t$: $\int_0^1 t \cdot 2t\,\mathrm{d}t = 2/3$. אותה תבנית נותנת $1/2$ לאורך הקו הישר, $1$ לרוחב ואחר כך למעלה, ו-$0$ למעלה ואחר כך לרוחב: $x\,\mathrm{d}y$ אינה מדויקת.
    wrongFeedback: >-
      כתבו את המסלול בפרמטר, $x = t$, $y = t^2$, הציבו את $x$ ואת $\mathrm{d}y = 2t\,\mathrm{d}t$, ובצעו אינטגרציה על $t$ מ-$0$ עד $1$.
    commonWrong:
      - value: 0.5
        feedback: >-
          זה האינטגרל לאורך הקו הישר $y = x$. בתבנית לא מדויקת המסלול משנה: לאורך הפרבולה $\mathrm{d}y = 2x\,\mathrm{d}x$.
      - value: 0.333
        feedback: >-
          זה $\int_0^1 x^2\,\mathrm{d}x$: ביצעתם אינטגרציה של $y\,\mathrm{d}x$, או ששכחתם את הגורם $\mathrm{d}y/\mathrm{d}x = 2x$.

  # ---------------------------------------------------------------- OBJ-0.1-6: מדויקות
  - id: Q-0.1-y-dx-exact
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-6]
    prompt: >-
      האם התבנית $\omega = y\,\mathrm{d}x$, עם $M = y$ ו-$N = 0$, מדויקת?
    choices:
      - text: >-
          לא: $\partial M/\partial y = 1$ אבל $\partial N/\partial x = 0$, ולכן אין פונקציה פוטנציאלית והאינטגרל שלה תלוי במסלול.
        correct: true
        feedback: >-
          נכון. המבחן מכריע בלי לבצע שום אינטגרציה, והאינטגרלים מאשרים: מ-$(0, 0)$ אל $(1, 1)$ התבנית נותנת $0$ לרוחב ואחר כך למעלה, $1/2$ לאורך הקו הישר, ו-$1$ למעלה ואחר כך לרוחב. בפיזיקה תרמית זו הסיבה שחום ועבודה הם פונקציות מסלול.
      - text: >-
          כן: היא הדיפרנציאל של $xy$.
        feedback: >-
          $\mathrm{d}(xy) = y\,\mathrm{d}x + x\,\mathrm{d}y$, ובזה יש איבר נוסף. גזרו פונקציה פוטנציאלית מועמדת והשוו לתבנית; לאיבר $x\,\mathrm{d}y$ אין מהיכן להגיע.
      - text: >-
          כן: כל תבנית שבנויה מפונקציות חלקות היא מדויקת.
        feedback: >-
          החלקות אינה העניין. מדויקות היא תנאי על הקשר בין $M$ ל-$N$, ורוב התבניות החלקות אינן מקיימות אותו.
      - text: >-
          אי אפשר להכריע בלי לבחור קודם מסלול.
        feedback: >-
          הפוך: המבחן הוא מה שמכריע **לפני** שבוחרים מסלול כלשהו, ומה שהוא מכריע הוא אם לבחירת המסלול תהיה חשיבות.

  - id: Q-0.1-which-exact
    type: mc
    level: mid
    objectives: [OBJ-0.1-6]
    prompt: >-
      איזו מהתבניות האלה מדויקת?
    choices:
      - text: >-
          $2xy\,\mathrm{d}x + x^2\,\mathrm{d}y$
        correct: true
        feedback: >-
          נכון. $\partial(2xy)/\partial y = 2x = \partial(x^2)/\partial x$, והפונקציה הפוטנציאלית היא $f = x^2y$.
      - text: >-
          $y\,\mathrm{d}x - x\,\mathrm{d}y$
        feedback: >-
          $\partial M/\partial y = 1$ אבל $\partial N/\partial x = -1$. הפכו את הסימן של האיבר השני והיא תהיה $\mathrm{d}(xy)$; כפי שהיא כתובה, היא אינה מדויקת.
      - text: >-
          $y^2\,\mathrm{d}x + xy\,\mathrm{d}y$
        feedback: >-
          $\partial M/\partial y = 2y$ אבל $\partial N/\partial x = y$. קרוב אינו שווה: התבנית אינה מדויקת.
      - text: >-
          $x\,\mathrm{d}x + x\,\mathrm{d}y$
        feedback: >-
          $\partial M/\partial y = 0$ אבל $\partial N/\partial x = 1$. האיבר הראשון הוא $\mathrm{d}(x^2/2)$; השני, $x\,\mathrm{d}y$, אינו מדויק.

  - id: Q-0.1-loop-area
    type: numeric
    level: mid
    objectives: [OBJ-0.1-6]
    prompt: >-
      בצעו אינטגרציה של $x\,\mathrm{d}y$ נגד כיוון השעון סביב המלבן שקודקודיו $(0, 0)$, $(2, 0)$, $(2, 3)$, $(0, 3)$.
    answer: 6
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      לאורך הצלע התחתונה והעליונה $\mathrm{d}y = 0$; לאורך הצלע השמאלית $x = 0$. רק הצלע הימנית נחשבת: $x = 2$ בזמן ש-$y$ רץ מ-$0$ עד $3$, וזה נותן $6$, השטח הכלוא. אינטגרל סביב לולאה אינו חייב להתאפס, כי $\partial N/\partial x = 1 \ne 0 = \partial M/\partial y$.
    wrongFeedback: >-
      עברו על ארבע הצלעות בזו אחר זו; בכל אחת מהן $x$ או $\mathrm{d}y$ שווה ל-$0$.
    commonWrong:
      - value: -6
        feedback: >-
          זו הלולאה בכיוון השעון. נגד כיוון השעון, הצלע הימנית עולה, $\mathrm{d}y > 0$.
      - value: 0
        feedback: >-
          רק תבנית מדויקת נותנת אפס סביב כל לולאה. $x\,\mathrm{d}y$ נכשלת במבחן: $\partial N/\partial x = 1$, $\partial M/\partial y = 0$.

  - id: Q-0.1-heat-paths
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-0.1-6, OBJ-0.1-7]
    prompt: >-
      ביחידות שבהן $Nk_B = 1$, גז אידיאלי חד-אטומי שמועבר מ-$(V, T) = (1, 1)$ אל $(2, 2)$ קולט את החום $\int \left(\tfrac32\,\mathrm{d}T + (T/V)\,\mathrm{d}V\right)$: $2.193$ אם הוא קודם מתפשט ואחר כך מחומם, $2.886$ אם הוא קודם מחומם ואחר כך מתפשט. מה נובע מכך?
    choices:
      - text: >-
          אין פונקציה $Q(V, T)$ שזה השינוי שלה: התבנית נכשלת במבחן, $\partial(T/V)/\partial T = 1/V \ne 0$, ולכן חום הוא פונקציית מסלול, וכמות קטנה שלו נכתבת $\dbar Q$. $\Delta U = 1.5$ בשני המסלולים; העבודה משלימה את ההפרש.
        correct: true
        feedback: >-
          נכון. לאורך המסלול הראשון $W = -\ln 2 = -0.693$, לאורך השני $W = -2\ln 2 = -1.386$, ו-$Q + W = 1.5$ בשתי הפעמים. $U$ היא פונקציית מצב; $Q$ ו-$W$ אינם.
      - text: >-
          אחד משני האינטגרלים חייב להיות שגוי: אנרגיה נשמרת, ולכן החום בין שני מצבים קבוע.
        feedback: >-
          השימור קובע את $\Delta U = Q + W$, לא את $Q$. שני האינטגרלים חושבו בלי קירוב, $1.5 + \ln 2$ ו-$1.5 + 2\ln 2$; העבודות נבדלות באותו $\ln 2$.
      - text: >-
          החום תלוי במסלול, ולכן החוק הראשון נכשל עבור הגז הזה.
        feedback: >-
          החוק הראשון מתקיים בשני המסלולים: $Q + W = 2.193 - 0.693 = 2.886 - 1.386 = 1.5 = \Delta U$. הוא מגביל את הסכום, לא כל איבר בנפרד.
      - text: >-
          שני המסלולים רק מבצעים את הצעדים בסדר שונה; בחישוב עם צעדים עדינים מספיק, האינטגרלים היו מסכימים.
        feedback: >-
          הם חושבו בלי קירוב. ההפרש, $\ln 2$, הוא האינטגרל סביב הלולאה ששני המסלולים יוצרים, והוא אינו אפס כי התבנית אינה מדויקת.

  - id: Q-0.1-entropy-change
    type: numeric
    level: bagrut
    objectives: [OBJ-0.1-6]
    prompt: >-
      חלקו את תבנית החום של גז אידיאלי חד-אטומי ב-$T$: $\tfrac32\,\mathrm{d}T/T + \mathrm{d}V/V$, ביחידות שבהן $Nk_B = 1$. בצעו אינטגרציה שלה מ-$(V, T) = (1, 1)$ אל $(3, 2)$.
    answer: 2.138
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      התבנית מדויקת, $\mathrm{d}\left(\tfrac32\ln T + \ln V\right)$, ולכן כל מסלול נותן $\tfrac32\ln 2 + \ln 3 = 1.040 + 1.099 = 2.138$. החום עצמו, בלי חלוקה ב-$T$, הוא $2.599$ אם הגז קודם מתפשט ו-$3.697$ אם הוא קודם מחומם: $1/T$ הוא גורם אינטגרציה.
    wrongFeedback: >-
      מצאו את הפונקציה הפוטנציאלית, $\tfrac32\ln T + \ln V$, וקחו את ההפרש שלה בין נקודות הקצה; אין צורך במסלול.
    commonWrong:
      - value: 2.341
        feedback: >-
          זה $\tfrac32\ln 3 + \ln 2$: המקדם $\tfrac32$ הולך עם $T$, שגדל פי שניים, וה-$1$ עם $V$, שגדל פי שלושה.
      - value: 2.599
        feedback: >-
          זה החום לאורך המסלול שמתפשט קודם, $1.5 + \ln 3$, בלי חלוקה ב-$T$.

  # ---------------------------------------------------------------- OBJ-0.1-7: המוסכמות
  - id: Q-0.1-compression-sign
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-7]
    prompt: >-
      גז נדחס: הסביבה דוחפת בוכנה פנימה והנפח קטן. במוסכמה של הקורס, $\mathrm{d}U = \dbar Q + \dbar W$, מה הסימן של איבר העבודה?
    choices:
      - text: >-
          חיובי, כי אנרגיה הועברה אל תוך הגז.
        correct: true
        feedback: >-
          נכון. הקורס סופר את העבודה שנעשית **על** המערכת, ולכן כל מה שנכנס מוסיף ל-$U$, בלי סימן מינוס שצריך לזכור. $\dbar W = -P\,\mathrm{d}V$, ו-$\mathrm{d}V < 0$ הופך אותו לחיובי.
      - text: >-
          שלילי, כי נפח הגז קטן.
        feedback: >-
          הסימן עוקב אחרי האנרגיה, לא אחרי הנפח. דחיפת הבוכנה פנימה עושה עבודה על הגז, ולכן אנרגיה נכנסה: $-P\,\mathrm{d}V > 0$ כש-$\mathrm{d}V < 0$.
        misconception: MC-work-sign-by-volume
      - text: >-
          שלילי, כי עבודה נכנסת לחוק הראשון תמיד עם סימן מינוס.
        feedback: >-
          זו המוסכמה הנפוצה האחרת, $\mathrm{d}U = \dbar Q - \dbar W'$, כאשר $W'$ היא העבודה שהמערכת **עושה**. שתיהן פיזיקה נכונה; הקורס הזה סופר את העבודה שנעשית עליה.
      - text: >-
          אפס, כי דחיסה מעבירה חום ולא עבודה.
        feedback: >-
          דחיפת בוכנה היא העברה מכנית של אנרגיה, וזו עבודה מעצם ההגדרה. ייתכן שגם חום זורם, אבל זה איבר נפרד.

  - id: Q-0.1-delta-and-labels
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-7]
    prompt: >-
      מה מסמן ה-$\delta$ ב-$\dbar Q$, ומדוע הקורס הזה מתייג טענה אחת כ"משפט" ואחרת כ"תצפית נומרית"?
    choices:
      - text: >-
          $\dbar Q$ הוא דיפרנציאל לא מדויק: אין פונקציה $Q$ של המצב, וכמה חום חוצה תלוי בדרך. התוויות מבחינות בין מה שנובע מתמטית מהנחות מפורשות לבין מה שחישוב של מודל אחד הראה. שני הדברים שומרים על סמל או על טענה מלהבטיח יותר ממה שהם נושאים.
        correct: true
        feedback: >-
          נכון. כתיבת $\mathrm{d}Q$ הייתה טוענת שקיימת פונקציה $Q$ שאפשר לגזור; אין כזו. וקורא שאינו מבחין בין משפט לתצפית נומרית יגיע להאמין שסימולציה הוכיחה זהות.
      - text: >-
          $\delta$ מסמן גודל קטן יותר מגודל שנכתב עם $\mathrm{d}$; התוויות מדרגות טענות לפי מידת החשיבות שלהן.
        feedback: >-
          גם $\mathrm{d}$ וגם $\delta$ מסמנים כמויות קטנות; ההבדל הוא אם עומדת מאחורי הכמות פונקציה של המצב. והתוויות אומרות מאיזה סוג היא טענה, לא כמה היא חשובה.
      - text: >-
          $\dbar Q$ הוא השינוי בחום שהמערכת מכילה; תצפית נומרית היא משפט שעדיין לא נבדק בסימולציה.
        feedback: >-
          מערכת מכילה אנרגיה פנימית, לא חום; חום הוא אנרגיה במעבר. וסימולציה לעולם אינה הופכת תצפית למשפט: רק גזירה עושה זאת.
      - text: >-
          $\dbar Q$ ו-$\mathrm{d}Q$ פירושם אותו דבר, והבחירה ביניהם טיפוגרפית; תצפית נומרית היא פשוט משפט שמנוסח במספרים.
        feedback: >-
          הבחירה בסמל נושאת את הפיזיקה: $\mathrm{d}$ שמור לדיפרנציאלים של פונקציות מצב. תצפית נומרית היא ראיה מחישוב, לא הוכחה.

  - id: Q-0.1-expansion-work
    type: numeric
    level: mid
    objectives: [OBJ-0.1-7]
    prompt: >-
      גז מתפשט לאט בלחץ קבוע של $1.00 \times 10^{5}\,\text{Pa}$, מ-$1.0 \times 10^{-3}\,\text{m}^3$ ל-$3.0 \times 10^{-3}\,\text{m}^3$. מהו $W$ בחוק הראשון של הקורס, $\mathrm{d}U = \dbar Q + \dbar W$, בג'אולים?
    answer: -200
    unit: J
    tolerance: 0.02
    correctFeedback: >-
      $W = -\int P\,\mathrm{d}V = -P\,\Delta V = -1.00 \times 10^{5} \times 2.0 \times 10^{-3} = -200\,\text{J}$. הגז דחף את סביבתו והוציא על כך אנרגיה, ולכן העבודה שנעשית עליו שלילית.
    wrongFeedback: >-
      $\dbar W = -P\,\mathrm{d}V$ היא העבודה שנעשית **על** הגז; בצעו אינטגרציה ב-$P$ קבוע.
    commonWrong:
      - value: 200
        feedback: >-
          זו העבודה שהגז **עושה**, $W' = -W$, המוסכמה האחרת. הקורס הזה סופר את העבודה שנעשית על המערכת.

  - id: Q-0.1-simulation-proves
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-0.1-7]
    prompt: >-
      מיליון הטלות מדומות של שתי קוביות נותנות שונות של הסכום השווה ל-$2\sigma_1^2 = 35/6 = 5.833$ עד ארבע ספרות. מה זה ביסס?
    choices:
      - text: >-
          שהקוד והאלגברה מסכימים: תצפית נומרית שעולה בקנה אחד עם המשפט. המשפט מבוסס על ידי הגזירה שלו, והשאלה אם קוביות ממשיות בלתי תלויות היא שאלה על קוביות ממשיות, שהסימולציה אינה יכולה לענות עליה: המחולל שלה מייצר הגרלות בלתי תלויות מעצם בנייתו.
        correct: true
        feedback: >-
          נכון. גזירות מבססות, סימולציות ממחישות ובודקות, ניסויים מכריעים אם מודל מתאר את העולם. אי-התאמה הייתה שווה הרבה, כי הייתה חושפת באג או גזירה שגויה; התאמה היא ראיה, לא הוכחה.
      - text: >-
          ששונויות של משתנים מקריים בלתי תלויים מתחברות: מיליון מקרים הם הוכחה.
        feedback: >-
          שום מספר סופי של הרצות אינו מוכיח זהות, וכאן הזהות לא הייתה מוטלת בספק כלל: היא נובעת בשלוש שורות מהגדרת השונות. ההרצות בודקות שהקוד מממש את מה שהגזירה הניחה.
      - text: >-
          שקוביות ממשיות בלתי תלויות, כי הקוביות המדומות מתנהגות כמו ממשיות.
        feedback: >-
          הקוביות המדומות בלתי תלויות כי המחולל עושה אותן כאלה; הן אינן נושאות שום מידע על קוביות ממשיות. קוביות ממשיות מוטות מעט, ורק ניסוי בקוביות ממשיות יכול לבדוק אותן.
      - text: >-
          שום דבר: סימולציה אינה יכולה לומר דבר על משפט.
        feedback: >-
          חזק מדי. התאמה עד ארבע ספרות היא ראיה טובה לכך שהמימוש נכון, וכך נתפסים קוד שגוי או גזירה שגויה. זו ראיה, לא הוכחה.
