      - text: >-
          עשרים וארבע דקות: הפער קטן פי ארבעה, ולכן הוא נסגר לאט פי ארבעה.
        feedback: >-
          הוא אכן נסגר לאט יותר, אבל ביחס למה שנותר, ולכן כל גורם של $4$ לוקח אותו זמן, לא זמן ארוך פי ארבעה.
      - text: >-
          הוא לעולם לא יגיע לשם: מעריכית לעולם אינה מגיעה לסופה.
        feedback: >-
          מעריכית לעולם אינה מגיעה ל**אפס**, אבל היא עוברת כל ערך שמעל אפס, כולל $2.5\,\text{K}$, בזמן מוגדר.

  - id: Q-1.1-rank-tau
    type: rank
    level: mid
    objectives: [OBJ-1.1-4]
    prompt: >-
      דרגו את זוגות הגופים האלה לפי זמן הרלקסציה שלהם, מהארוך ביותר. זוגות שזמני הרלקסציה שלהם שווים מדורגים באותו מקום.
    items:
      - id: p
        label: >-
          $C_A = C_B = 100\,\text{J/K}$, $\kappa = 1.0\,\text{W/K}$
      - id: q
        label: >-
          $C_A = 100\,\text{J/K}$ מול מאגר ($C_B \to \infty$), $\kappa = 1.0\,\text{W/K}$
      - id: r
        label: >-
          $C_A = C_B = 200\,\text{J/K}$, $\kappa = 2.0\,\text{W/K}$
      - id: s
        label: >-
          $C_A = 100\,\text{J/K}$, $C_B = 300\,\text{J/K}$, $\kappa = 0.50\,\text{W/K}$
      - id: t
        label: >-
          $C_A = 10\,\text{J/K}$, $C_B = 1000\,\text{J/K}$, $\kappa = 1.0\,\text{W/K}$
    order: [s, q, [p, r], t]
    correctFeedback: >-
      נכון. $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$ נותן $150\,\text{s}$, $100\,\text{s}$, פעמיים $50\,\text{s}$ ו-$9.9\,\text{s}$. מול מאגר $\tau \to C_A/\kappa$: רק A צריך לזוז. הכפלה של שני הקיבולים ושל המוליכות התרמית משאירה את $\tau$ כפי שהוא. והצירוף נשלט על ידי הקיבול ה**קטן** יותר, ולכן גוף קטן מול גוף עצום מגיע לשיווי משקל מהר מכולם.
    wrongFeedback: >-
      חשבו $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$ לכל זוג; מול מאגר הוא שואף ל-$C_A/\kappa$. הערכים הם $150$, $100$, $50$, $50$ ו-$9.9\,\text{s}$.

  - id: Q-1.1-thermal-inertia
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.1-4]
    prompt: >-
      תלמיד טוען: "לגוף בעל קיבול חום גדול יש אינרציה תרמית. ברגע שהוא מתקרר מהר לעבר $T_\mathrm{eq}$ הוא אינו יכול לעצור מיד, ולכן הוא חייב לחרוג מעט אל מעבר לה, כמו מטוטלת כבדה." מה שגוי בטיעון?
    choices:
      - text: >-
          קיבול חום אינו אינרציה. קצב הקירור, $\mathrm{d}T_A/\mathrm{d}t = (\kappa/C_A)(T_B - T_A)$, נקבע על ידי ההפרש הנוכחי בלבד, בלי שום זיכרון של מהירות הקירור רגע קודם; הוא מתאפס כאשר $T_A = T_B$, ולכן הפער יכול להתקרב לאפס אבל לא לחצות אותו. $C_A$ גדול מאט את ההתקרבות, ואינו מוסיף לה שום קפיציות.
        correct: true
        feedback: >-
          נכון. המשוואה היא מסדר ראשון בזמן. מטוטלת חורגת אל מעבר לנקודה הנמוכה ביותר כי המשוואה שלה מסדר שני: המהירות היא משתנה בפני עצמו, והיא שנושאת אותה דרך הנקודה הנמוכה. לטמפרטורה אין מהירות משלה שתישא אותה לשום מקום.
      - text: >-
          שום דבר: גופים גדולים אכן חורגים מעט, אבל החריגה דועכת מהר מכדי שאפשר יהיה לראות אותה.
        feedback: >-
          $\Delta T(0)\,e^{-t/\tau}$ שומר על הסימן שלו לכל $t$, בכל קיבול חום. אין חריגה שתדעך: הפער קטן לעבר אפס, והקצב שלו קטן יחד איתו.
        misconception: MC-temperatures-overshoot
      - text: >-
          שימור האנרגיה אוסר זאת: A אינו יכול לרדת מתחת ל-$T_\mathrm{eq}$ בלי שאנרגיה תושמד.
        feedback: >-
          שימור האנרגיה מתיר זאת. A מתחת ל-$T_\mathrm{eq}$ ו-B מעליה, באותו רגע, משמרים אנרגיה בדיוק. חוק הקצב, כלומר חום שזורם רק במורד ההפרש הנוכחי, הוא ששולל את החצייה.
      - text: >-
          הטיעון נכון לגבי הגוף החם יותר, אבל לא לגבי הקר יותר, שמתחמם ולא מתקרר.
        feedback: >-
          שני הגופים מצייתים למשוואות שהן תמונת ראי זו של זו, $C_B\,\mathrm{d}T_B/\mathrm{d}t = \kappa(T_A - T_B)$ עבור B, ולאף אחת מהן אין איבר של מהירות. אף אחד מהגופים אינו חורג.
        misconception: MC-temperatures-overshoot

  # ---------------------------------------------------------------- OBJ-1.1-5: המודל ההסתברותי, ומה הוא מבסס
  - id: Q-1.1-model-tau
    type: numeric
    level: basic
    objectives: [OBJ-1.1-5, OBJ-1.1-4]
    prompt: >-
      במודל הדילוגים לגוף A יש $50$ מתנדים ב-$T_A = 6$ ולגוף B יש $150$ ב-$T_B = 2$, ביחידות של $\varepsilon/k_B$. מהו זמן הרלקסציה, בצעדים?
    answer: 599.5
    unit: steps
    tolerance: 0.01
    correctFeedback: >-
      $q_A = 50 \times 6 = 300$ ו-$q_B = 150 \times 2 = 300$, ולכן $Q = 600$ ו-$\tau = -1/\ln(1 - 1/600) = 599.5$ צעדים, בערך $Q - \tfrac12$. בשתי מנות של $512$ הרצות הפער הממוצע אחרי $600$ צעדים הוא $1.468 \pm 0.012$ ו-$1.458 \pm 0.013$, לעומת $4e^{-600/599.5} = 1.470$ החזוי; הרצות בודדות מתפזרות סביבו ב-$0.28$.
    wrongFeedback: >-
      ספרו את הקוונטים: $q = nT$ לכל גוף. אז $\tau = -1/\ln(1 - 1/Q)$, קרוב ל-$Q$.
    commonWrong:
      - value: 200
        feedback: >-
          זה מספר המתנדים. זמן הרלקסציה נקבע על ידי מספר ה**קוונטים**: כל דילוג מזיז אחד מהם, חלק קטן יותר מחוסר האיזון ככל שיש יותר מהם.
      - value: 37.5
        feedback: >-
          זה $n_An_B/(n_A + n_B)$, צירוף הקיבולים מה-$\tau$ של ניוטון, בלי המוליכות התרמית. במודל המוליכות היא $(k_B/Q)\,n_An_B/(n_A + n_B)$ לצעד, והחלוקה בה משאירה $\tau \approx Q$.
      - value: 300
        feedback: >-
          אלה הקוונטים של גוף אחד. הכלל בוחר מתוך כל $Q = 600$ הקוונטים של הזוג.

  - id: Q-1.1-model-fails
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-5]
    prompt: >-
      באיזה מצב מודל הדילוגים של איור 1.1א הוא הכי פחות אמין כתיאור של שני מוצקים ממשיים שמתקרבים לשיווי משקל?
    choices:
      - text: >-
          שני גופים ששניהם קרובים לאפס המוחלט.
        correct: true
        feedback: >-
          נכון. בטמפרטורה נמוכה מתנד מחזיק בממוצע פחות מקוונט אחד, חלוקת האנרגיה השווה נכשלת וסטטיסטיקה קוונטית תופסת את מקומה, ולכן $T = q\varepsilon/(nk_B)$ כבר אינו נותן את הטמפרטורה של מוצק ממשי. זה אופן הכשל הראשון שהמודל מצהיר עליו.
      - text: >-
          שני גופים בטמפרטורות התחלה שונות מאוד, ששתיהן גבוהות בהרבה מהסקאלה הקוונטית.
        feedback: >-
          פער התחלתי גדול אינו בעיה: הסחיפה הממוצעת ליניארית בדיוק ב-$q_A$ בכל מצב, ולכן המעריכית מתקיימת לכל $T_A(0) - T_B(0)$, כל עוד שני הגופים נשארים במשטר הקלאסי.
      - text: >-
          שני גופים בגדלים שונים מאוד, A גדול ו-B קטן.
        feedback: >-
          גדלים שונים הם מה שהופך את $T_\mathrm{eq}$ המשוקללת למעניינת, והמודל מטפל בהם בלי שום טיפול מיוחד, בתנאי שכל גוף גדול מספיק כדי שהטמפרטורה שלו תהיה גודל מאקרוסקופי.
      - text: >-
          שני גופים העשויים מאותו חומר.
        feedback: >-
          זה המקרה שהמודל מתאים לו יותר מכל: אותו חומר מחליף קוונטים באותו גודל, וזו בדיוק ההנחה של המודל.

  - id: Q-1.1-scatter-size
    type: numeric
    level: mid
    objectives: [OBJ-1.1-5]
    prompt: >-
      באיור 1.1ב הזוג הקטן ביותר, $20 + 60$ מתנדים ($N = 80$), סוטה מהעקומה $e^{-t/\tau}$ ב-RMS של כ-$0.11$ מהפער ההתחלתי לאורך שישה זמני רלקסציה. חזו את ה-RMS עבור זוג של $80 + 240$ מתנדים שמתחיל באותן טמפרטורות.
    answer: 0.055
    unit: ''
    tolerance: 0.1
    correctFeedback: >-
      הפיזור קטן כמו $N^{-1/2}$: פי ארבעה מתנדים, חצי פיזור, $0.11/2 = 0.055$. שתי מנות של $64$ זרעים נותנות $0.106 \pm 0.003$ ו-$0.107 \pm 0.003$ ב-$N = 80$, ו-$0.0519 \pm 0.0016$ ו-$0.0511 \pm 0.0016$ ב-$N = 320$: יחסים של $2.04$ ו-$2.10$, לעומת $2$ החזוי.
    wrongFeedback: >-
      הפיזור של הרצה בודדת סביב עקומת הממוצע קטן כמו $N^{-1/2}$, הפיזור של מניין בינומי.
    commonWrong:
      - value: 0.0275
        feedback: >-
          זה מניח שהפיזור קטן כמו $1/N$. השונות היא שקטנה כמו $1/N$; ה-RMS, השורש שלה, קטן כמו $N^{-1/2}$.
        misconception: MC-scatter-one-over-n
      - value: 0.11
        feedback: >-
          על צירים ביחידות של ה-$\tau$ של כל זוג עקומת הממוצע זהה, אבל הפיזור סביבה לא: יש פי ארבעה קוונטים למצע עליהם.

  - id: Q-1.1-late-crossing
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-5, OBJ-1.1-4]
    prompt: >-
      בשלב מאוחר של הרצה באיור 1.1א ($100 + 300$ מתנדים), העקומה של $T_A$ יורדת לזמן מה מתחת לזו של $T_B$, ואחר כך חוזרת. האם זה מפריך את הטענה שהטמפרטורות לעולם אינן חורגות?
    choices:
      - text: >-
          לא. הטענה היא על הממוצע על פני הרצות, שעוקב אחרי $3e^{-t/\tau}$ ושומר על הסימן שלו. הרצה בודדת של $400$ מתנדים רועדת סביבו בכ-$0.15$ בשיווי משקל, כלפי מעלה באותה תדירות כמו כלפי מטה; אחרי שהפער הממוצע קטן מתחת לזה, החציות הן פלוקטואציות, לא תנודה של מטוטלת.
        correct: true
        feedback: >-
          נכון. ההתפלגות הבינומית של הקוונטים נותנת את הרעד של הפער, $\big(1/n_A + 1/n_B\big)\sqrt{Q\,p\,(1 - p)} = 0.153$. הוא קטן כמו $N^{-1/2}$: בגופים שאפשר להחזיק ביד הוא קטן מכדי שאפשר יהיה לראות אותו.
      - text: >-
          כן: הטמפרטורות כן חורגות, וחוק ה-$e^{-t/\tau}$ הוא קירוב שמחמיץ זאת.
        feedback: >-
          עבור הממוצע החוק מדויק במודל הזה, והוא משפט: $\langle\Delta q_A\rangle$ ליניארי ב-$q_A$ בכל צעד. חריגה שיטתית הייתה נראית בממוצע על פני הרצות, והיא אינה נראית; הירידות מופיעות בשני צדי הקו באותה מידה.
        misconception: MC-temperatures-overshoot
      - text: >-
          לא: הירידה היא תקלה בסימולציה, כי אנרגיה אינה יכולה להישמר כש-$T_A < T_B$.
        feedback: >-
          האנרגיה נשמרת בדיוק בכל צעד: דילוג רק משנה איזה גוף מחזיק קוונט אחד. $T_A < T_B$ הוא מצב אפשרי לחלוטין, שכאן הגיעו אליו במקרה.
      - text: >-
          כן: ברגע ש-A למטה, הוא שואב חום מ-B, וזה נושא אותו שוב למעלה אל מעבר ל-$T_B$, כלומר תנודה.
        feedback: >-
          כל עוד $T_A < T_B$ הזרימה הממוצעת היא לעבר A, וזה סוגר את הפער; היא אינה נושאת את A אל מעבר ל-B. כל חצייה היא פלוקטואציה אקראית חדשה, לא תנע שנשאר מהקודמת.
        misconception: MC-temperatures-overshoot

  - id: Q-1.1-what-sim-shows
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.1-5]
    prompt: >-
      הפער הממוצע במודל הדילוגים עוקב אחרי $e^{-t/\tau}$ בדיוק, והפיזור של הרצות בודדות סביבו קטן כמו $N^{-1/2}$. איזו מסקנה זה מצדיק?
    choices:
      - text: >-
          שמנגנון מיקרוסקופי אחד, החלפה אקראית המשוקללת לפי האכלוס, מייצר בממוצע את חוק הקירור של ניוטון: ראיה לכך שהחוק המאקרוסקופי אינו תלוי בפרטים המיקרוסקופיים, לא הוכחה שכל מגע ממשי מציית לו.
        correct: true
        feedback: >-
          נכון. אם ספל ממשי עוקב אחרי המעריכית, ועם איזה $\kappa$, זה עניין שניסוי צריך להכריע בו: מדחום מטבח ו-$\tau$ שמותאם בדקות.
      - text: >-
          שחוק הקירור של ניוטון מתקיים בכל מגע תרמי ממשי.
        feedback: >-
          המודל מראה מנגנון אחד. מגעים ממשיים מעבירים חום באמצעות פונונים, אלקטרונים, הסעה וקרינה, וקרינה, למשל, אינה ליניארית בהפרש הטמפרטורות כשההפרש גדול. הגזירה מתוך חוק ניוטון טובה רק כמו חוק ניוטון עצמו.
      - text: >-
          שגוף ממשי מגיע לשיווי משקל בתוך כ-$Q$ שניות, כאשר $Q$ הוא מספר הקוונטים שהוא חולק.
        feedback: >-
          צעד הוא דילוג, לא שנייה, ושום קבוע פיזיקלי אינו ממיר את האחד לשני. $\tau \approx Q$ צעדים אומר איך השעון של המודל מתקדם; סקאלת הזמן אינה עוברת לגופים ממשיים.
      - text: >-
          שהמוליכות התרמית של מגע ממשי היא $\kappa = (k_B/Q)\,n_An_B/(n_A + n_B)$.
        feedback: >-
          זו המוליכות של המודל עצמו, לצעד. היא אינה אומרת דבר על המוליכות של חומר ממשי כלשהו, שתלויה באופן שבו חום חוצה בפועל את המגע הזה.

  - id: Q-1.1-equilibrium-jitter
    type: numeric
    level: bagrut
    objectives: [OBJ-1.1-5]
    prompt: >-
      במודל הדילוגים, בשיווי משקל, כל אחד מ-$Q$ הקוונטים נמצא ב-A בהסתברות $p = n_A/(n_A + n_B)$, ללא תלות באחרים. עבור $n_A = 50$, $n_B = 150$ ו-$Q = 600$, מצאו את סטיית התקן של $T_A$, ביחידות של $\varepsilon/k_B$.
    answer: 0.2121
    unit: ''
    tolerance: 0.02
    correctFeedback: >-
      $q_A$ בינומי: $\sigma_{q_A} = \sqrt{600 \times 0.25 \times 0.75} = 10.6$ קוונטים, ו-$\sigma_{T_A} = 10.6/50 = 0.212$, שהם $7.1\%$ מ-$\langle T_A\rangle = 3$. נמדד על פני שמונה הרצות של $600\,000$ צעדים: $0.214 \pm 0.002$.
    wrongFeedback: >-
      $q_A$ הוא מניין בינומי עם שונות $Q\,p\,(1 - p)$, ו-$T_A = q_A\varepsilon/(n_Ak_B)$.
    commonWrong:
      - value: 10.61
