# שאלות הבדיקה של שיעור 1.1. הומרו מ-assessment/quizzes/01-equilibrium.he.yml של ThermoLab (Q-01-1 … Q-01-8, כל
# השמונה; Q-01-6, שאלת ניבוי, ו-Q-01-7, שאלה פתוחה קצרה, הפכו לרב-ברירה) והורחבו כך שיכסו את חמש המטרות ואת
# התפיסות השגויות של src/content/misconceptions/1-1.yaml, ועוד MC-equilibrium-motion-stops (4.1). כל מספר חושב מחדש
# בספרייה של ThermoLab (thermolab.equilibrium); מספרים מסימולציה הם ממוצעים על פני כמה זרעים. הטמפרטורות במודל
# נמדדות ביחידות של הקוונט, ε/k_B, והזמן במודל בצעדים. המזהים משותפים עם הבנק באנגלית, שחייב להכיל את אותן שאלות
# עם אותן תשובות.
lang: he
chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.1-1: החוק האפס, טמפרטורה
  - id: Q-1.1-zeroth-law
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-1]
    prompt: >-
      גוף A נמצא בשיווי משקל תרמי עם גוף C, וגוף B, בנפרד, נמצא בשיווי משקל תרמי עם C. מה אפשר להסיק על A ו-B?
    choices:
      - text: >-
          A ו-B נמצאים בשיווי משקל תרמי זה עם זה: אם יובאו למגע, לא יזרום ביניהם חום נטו. זו הטענה של החוק האפס.
        correct: true
        feedback: >-
          נכון. זו הסיבה שאפשר לסמוך על מדחום מכויל אחד, בתפקיד C, כשהוא נוגע בשני גופים בזה אחר זה: קריאות שוות פירושן ששני הגופים היו בשיווי משקל זה עם זה, בלי שיהיה צורך להפגיש אותם אי פעם.
      - text: >-
          שום דבר אינו נובע מכך: שיווי משקל תרמי אינו חייב להיות טרנזיטיבי.
        feedback: >-
          הלוגיקה לבדה אכן אינה מחייבת זאת, ולכן החוק האפס הוא חוק: חוק אמפירי, שאומר ששיווי משקל תרמי הוא טרנזיטיבי. אף ניסוי לא מצא אחרת. בלעדיו, הקריאה של מדחום לא הייתה אומרת דבר על שני הגופים שהוא נגע בהם.
      - text: >-
          ל-A ול-B חייב להיות אותו קיבול חום.
        feedback: >-
          לקיבול החום אין כאן תפקיד. גופים בעלי קיבולי חום שונים מאוד חולקים טמפרטורה כל הזמן, למשל כפית וסיר המרק שהיא עומדת בו. קיבולי החום קובעים היכן שני גופים נפגשים, לא אם הם בשיווי משקל.
      - text: >-
          A ו-B נמצאים כל אחד בשיווי משקל עם C, אבל ייתכן שמדחום עדיין יראה על A קריאה שונה מזו שהוא מראה על B.
        feedback: >-
          מדחום הוא פשוט עוד גוף שלישי. מדחום שנמצא בשיווי משקל עם A נמצא, לפי החוק האפס, בשיווי משקל עם C, ולכן גם עם B: הוא מראה אותה קריאה על שלושתם. העקביות הזו היא מה שהחוק מבטיח.

  - id: Q-1.1-metal-leg
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-1]
    prompt: >-
      חדר נשמר על $20\,{}^\circ\text{C}$ כל הלילה. בבוקר אתם נוגעים במעקה פלדה ובמאחז יד מעץ שמותקן לצדו, והפלדה מרגישה קרה בהרבה. איזו טענה נכונה?
    choices:
      - text: >-
          שניהם ב-$20\,{}^\circ\text{C}$, כפי שהיה מראה מדחום שמודבק לכל אחד מהם. פלדה מוליכה חום הרחק מהיד מהר יותר מעץ, והיד מדווחת כמה מהר היא מאבדת חום, לא מה הטמפרטורה של מה שהיא נוגעת בו.
        correct: true
        feedback: >-
          נכון. שניהם היו בשיווי משקל עם אוויר החדר כל הלילה, ולכן לפי החוק האפס הם בשיווי משקל זה עם זה. היד שלכם נשארת קרוב לטמפרטורת הגוף ולעולם אינה מגיעה לשיווי משקל עם המעקה; היא חשה את קצב איבוד החום שלה עצמה, ופלדה מוליכה חום טוב בהרבה מעץ.
      - text: >-
          הפלדה קרה יותר מהעץ; בדיוק בגלל זה היא מרגישה קרה יותר.
        feedback: >-
          שום דבר בחדר שנשמר על $20\,{}^\circ\text{C}$ כל הלילה אינו יכול להישאר מתחת לטמפרטורה הזו: גוף קר יותר היה קולט חום מהאוויר עד שגם הוא היה ב-$20\,{}^\circ\text{C}$. מדחום מראה על שניהם אותה קריאה. מה ששונה הוא כמה מהר כל אחד מהם שואב חום מהיד שלכם.
        misconception: MC-touch-tells-temperature
      - text: >-
          הם באותה טמפרטורה, ולכן הם באמת מרגישים אותו דבר; ההבדל מדומה.
        feedback: >-
          ההבדל אמיתי ומדיד: חום עוזב את היד שלכם מהר בהרבה דרך הפלדה. זה הבדל בזרימת החום, לא בטמפרטורה.
      - text: >-
          הפלדה קרה יותר, כי קיבול החום הגדול שלה גורם לה לפגר אחרי הטמפרטורה של החדר.
        feedback: >-
          קיבול חום גדול מאט את התגובה של גוף לשינוי, אבל אחרי לילה שלם ב-$20\,{}^\circ\text{C}$ יציבים לא נותר שום שינוי לפגר אחריו. שניהם הגיעו מזמן לטמפרטורה של החדר.

  - id: Q-1.1-no-zeroth-law
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.1-1]
    prompt: >-
      דמיינו עולם שבו החוק האפס אינו מתקיים. מדחום C מגיע לשיווי משקל עם גוף A ומראה $25$; הוא מגיע לשיווי משקל עם גוף B ומראה שוב $25$. ובכל זאת, כש-A ו-B מובאים למגע, חום זורם מ-A ל-B. מה היה הולך לאיבוד?
    choices:
      - text: >-
          הטמפרטורה כמספר יחיד. קריאות שוות כבר לא היו אומרות "אין זרימת חום נטו במגע", ולכן אי אפשר היה להצמיד לכל גוף מספר כך שמספרים שווים יסמנו שיווי משקל, ומדחומים מחומרים שונים היו יכולים לחלוק זה על זה בשאלה אילו גופים חולקים טמפרטורה.
        correct: true
        feedback: >-
          נכון. החוק האפס הוא שגורם ליחס "נמצא בשיווי משקל תרמי עם" למיין את כל הגופים למחלקות של שיווי משקל הדדי, ורק מחלקות כאלה אפשר לסמן במספר אחד לכל מחלקה. בלעדיו, קריאה הייתה מתארת את המדחום ואת הגוף יחד, לא את הגוף.
      - text: >-
          שימור האנרגיה: חום שזורם מ-A ל-B בלי שום הבדל בקריאה היה יוצר אנרגיה.
        feedback: >-
          החום שעוזב את A מגיע ל-B; הסך הכולל עדיין נשמר. מה שנכשל הוא הקשר בין קריאות שוות לבין זרימה נטו אפסית, וזה הקשר של החוק האפס, לא של החוק הראשון.
      - text: >-
          שום דבר חשוב: המדחום עדיין היה נותן נכון את הטמפרטורה של כל גוף.
        feedback: >-
          אז שני גופים בטמפרטורות שוות לא היו בשיווי משקל, ו"טמפרטורה שווה" כבר לא הייתה אומרת את מה שבשבילו משתמשים בה: ששום דבר אינו זורם כשהם נוגעים זה בזה.
      - text: >-
          רק הכיול של המדחום: מדחום מכויל טוב יותר היה מראה ש-A חם יותר מ-B.
        feedback: >-
          כיול קובע את הסקאלה של הקריאות, לא אילו גופים מקבלים קריאות שוות. C באמת היה בשיווי משקל עם A ועם B, ולכן כל סימון מחדש של הסקאלה שלו נותן להם שוב אותו מספר.

  - id: Q-1.1-thermometer-error
    type: numeric
    level: mid
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      מדחום בעל קיבול חום של $8.0\,\text{J/K}$, ב-$20\,{}^\circ\text{C}$, טובל ב-$50\,\text{g}$ מים ב-$60\,{}^\circ\text{C}$ ($c = 4200\,\text{J/(kg K)}$). שום דבר אחר אינו מחליף חום. אחרי שהמדחום הגיע לשיווי משקל, בכמה קלווין הקריאה שלו נמוכה מהטמפרטורה שהייתה למים לפני שהוכנס?
    answer: 1.468
    unit: K
    tolerance: 0.02
    correctFeedback: >-
      למים $C_2 = 0.050 \times 4200 = 210\,\text{J/K}$. $T_\mathrm{eq} = (8.0 \times 20 + 210 \times 60)/218 = 58.53\,{}^\circ\text{C}$, ולכן הקריאה נמוכה ב-$(8.0/218) \times 40 = 1.47\,\text{K}$. לפי החוק האפס המדחום אכן מראה את הטמפרטורה של המים שהוא נמצא בהם; את המים האלה הוא עצמו קירר.
    wrongFeedback: >-
      מצאו את הטמפרטורה המשותפת משימור האנרגיה, $T_\mathrm{eq} = (C_1T_1 + C_2T_2)/(C_1 + C_2)$, והחסירו אותה מ-$60\,{}^\circ\text{C}$.
    commonWrong:
      - value: 1.524
        feedback: >-
          זה $(8.0/210) \times 40$: קיבול החום של המדחום חלקי זה של המים בלבד. בחישוב הטמפרטורה המשותפת מחלקים בקיבול של שניהם, $218\,\text{J/K}$.
      - value: 20
        feedback: >-
          זה $60$ פחות הממוצע הפשוט, $40\,{}^\circ\text{C}$, כאילו משקלו של המדחום שווה לזה של המים. קיבול החום של המים גדול פי $26$, ולכן הם זזים פחות פי $26$.
        misconception: MC-equal-weight-equilibrium
      - value: 58.53
        feedback: >-
          זו הקריאה עצמה. השאלה היא בכמה היא נמוכה מ-$60\,{}^\circ\text{C}$.

  # ---------------------------------------------------------------- OBJ-1.1-2: מה נפסק בשיווי משקל, ומה לא
  - id: Q-1.1-instant
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-2, OBJ-1.1-4]
    prompt: >-
      שני גושי מתכת זהים, אחד חם ואחד קר, נלחצים זה אל זה ואחר כך מבודדים מכל דבר אחר. האם הם מגיעים לאותה טמפרטורה ברגע שהם נוגעים זה בזה?
    choices:
      - text: >-
          לא. חום צריך לחצות את המגע בקצב סופי, ולכן הפער נסגר כמו $e^{-t/\tau}$, לאורך זמן רלקסציה שנקבע על ידי קיבולי החום והמוליכות התרמית של המגע.
        correct: true
        feedback: >-
          נכון. $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$ מתאפס רק כאשר $\kappa \to \infty$, מגע בעל מוליכות תרמית אינסופית, שאין לשום דבר. $\tau$ יכול להיות קצר; הוא לעולם אינו אפס.
      - text: >-
          כן: המגע לבדו משווה את הטמפרטורות מיד.
        feedback: >-
          זה משמיט את החום שצריך לחצות את המגע, בקצב $\kappa\,(T_A - T_B)$. עם מוליכות תרמית סופית $\kappa$ הפער נסגר בזמן סופי: לוקח לו $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$ לקטון פי $e$.
        misconception: MC-instant-equilibrium
      - text: >-
          כן, אבל רק כי הגושים זהים; גושים מחומרים שונים היו צריכים זמן.
        feedback: >-
          גם בגושים זהים חום צריך לחצות את המגע. התאמת החומרים משנה את $\tau$, לא את העובדה שהוא סופי.
        misconception: MC-instant-equilibrium
      - text: >-
          לא, אבל רק כי הם מוצקים; נוזלים או גזים היו משתווים מיד.
        feedback: >-
          כל מצב צבירה מעביר חום בקצב סופי. ערבוב או הסעה יכולים להאיץ מאוד את ההשתוות בנוזל או בגז, אבל לעולם לא עד כדי רגע אחד.

  - id: Q-1.1-still-hopping
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-2, OBJ-1.1-5]
    prompt: >-
      באיור 1.1א שני הגופים הגיעו לטמפרטורה המשותפת שלהם, והעקומות של $T_A$ ו-$T_B$ נעשו שטוחות, מלבד רעד קטן. מה הקוונטים עושים?
    choices:
      - text: >-
          ממשיכים לדלג, בין הגופים וגם בתוך כל אחד מהם. קוונט עובר מ-A ל-B, בממוצע, באותה תדירות שבה קוונט עובר מ-B ל-A, כי שני הקצבים שווים כאשר $q_A/n_A = q_B/n_B$.
        correct: true
        feedback: >-
          נכון. מה שנפסק הוא הזרימה **נטו**. בזוג של האיור, בשיווי משקל, כל כיוון מתרחש בהסתברות $0.1875$ לצעד, ולכן ביותר משליש מכל הצעדים קוונט עדיין עובר מצד לצד.
      - text: >-
          הם הפסיקו לעבור בין הגופים, ובגלל זה העקומות נעשו שטוחות.
        feedback: >-
          האיור מראה אחרת: ההצללה ממשיכה לנוע בין הגושים. כלל הדילוג אינו יודע מהן הטמפרטורות; בכל צעד הוא בוחר קוונט ומתנד נחיתה מבין שני הגופים, בשיווי משקל בדיוק כמו לפניו. העקומות שטוחות כי המעברים בשני הכיוונים מתאזנים.
        misconception: MC-equilibrium-motion-stops
      - text: >-
          הם עדיין מדלגים בתוך כל גוף, אבל קוונט שעוזב את A נוחת עכשיו תמיד בחזרה ב-A.
        feedback: >-
          מתנד הנחיתה נבחר מבין שני הגופים בכל מצב, ולכן קוונט שעוזב את A נוחת ב-B בהסתברות $n_B/(n_A + n_B)$, בשיווי משקל כמו בהתחלה. ההחלפה בין הגופים נמשכת.
        misconception: MC-equilibrium-motion-stops
      - text: >-
          הם מדלגים רק מהגוף החם יותר אל הקר יותר, ולכן הרעד הוא הזרימה שמתהפכת בכל פעם ששתי הטמפרטורות חוצות זו את זו.
        feedback: >-
          דילוג יכול ללכת לכל אחד מהכיוונים בכל צעד, לא משנה איזה גוף חם יותר; כשגוף חם יותר, הכיוון שיוצא ממנו רק סביר יותר. שיווי משקל הוא המצב שבו שני הכיוונים סבירים באותה מידה, לא המצב שבו אחד מהם אסור.

  - id: Q-1.1-crossing-rate
    type: numeric
    level: mid
    objectives: [OBJ-1.1-2]
    prompt: >-
      במודל הדילוגים לגוף A יש $200$ מתנדים ולגוף B יש $300$, והם הגיעו לשיווי משקל. באיזה חלק מהצעדים, בממוצע, קוונט עובר מגוף אחד לשני, בכל אחד מהכיוונים?
    answer: 0.48
    unit: ''
    tolerance: 0.02
    correctFeedback: >-
      בשיווי משקל $q_A/Q = n_A/(n_A + n_B) = p = 0.4$. קוונט עובר מ-A ל-B בהסתברות $(q_A/Q)(1 - p) = p(1 - p) = 0.24$ ומ-B ל-A בהסתברות $(1 - p)\,p = 0.24$: שתיהן שוות, ולכן הזרימה נטו אפס, ויחד $2p(1 - p) = 0.48$. נמדד על פני שמונה הרצות של $200\,000$ צעדים: $0.4799 \pm 0.0004$. כמעט מחצית מכל הצעדים מעבירים קוונט מצד לצד, בשיווי משקל, בכל טמפרטורה.
    wrongFeedback: >-
      קוונט עובר מ-A ל-B כשהוא נבחר מתוך A ונוחת ב-B, ובשיווי משקל $q_A/Q = n_A/(n_A + n_B)$. חברו את שני הכיוונים.
    commonWrong:
      - value: 0
        feedback: >-
          אפס היא הזרימה **נטו**. כלל הדילוג עדיין בוחר קוונט ומקום נחיתה בכל צעד, ובכמחצית מהצעדים הקוונט מחליף גוף; בשיווי משקל המעברים בשני הכיוונים מתאזנים.
        misconception: MC-equilibrium-motion-stops
      - value: 0.24
        feedback: >-
          זה כיוון אחד בלבד. הכיוון השני מתרחש באותה תדירות, והשוויון הזה הוא שיווי המשקל.

  - id: Q-1.1-net-flow
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.1-2, OBJ-1.1-1]
    prompt: >-
      במודל הדילוגים לגוף A יש $100$ מתנדים שמחזיקים $300$ קוונטים, ולגוף B יש $600$ מתנדים שמחזיקים $900$ קוונטים. הם מובאים למגע. לאיזה כיוון זורמת האנרגיה, נטו, ומדוע?
    choices:
      - text: >-
          מ-A ל-B. A הוא החם יותר, $3$ קוונטים למתנד לעומת $1.5$, אף שהוא מחזיק שליש מהאנרגיה של B. בכל צעד קוונט עובר מ-A ל-B בהסתברות $(300/1200)(600/700) = 0.214$, ובחזרה בהסתברות $(900/1200)(100/700) = 0.107$.
        correct: true
        feedback: >-
          נכון. אנרגיה זורמת במורד הפרש הטמפרטורות, לא במורד הפרש האנרגיות: כאן $T = q\varepsilon/(nk_B)$ היא אנרגיה ליחידת קיבול חום. הזרימה נטו נפסקת כש-A מחזיק $1200 \times 100/700 = 171$ קוונטים, ושני הגופים ב-$1.71$.
      - text: >-
          מ-B ל-A: ל-B יש פי שלושה אנרגיה, ואנרגיה מתפשטת מהמקום שיש בו יותר ממנה.
        feedback: >-
          אנרגיה אינה זורמת לעבר כמויות שוות; היא זורמת לעבר טמפרטורות שוות. אילו זרמה מ-B עד ששני הגופים היו מחזיקים $600$ קוונטים כל אחד, A היה מסיים ב-$6$ קוונטים למתנד ו-B ב-$1$: פער הטמפרטורות היה גדל, לא נסגר.
      - text: >-
          לאף כיוון, נטו: קוונטים עוברים לשני הכיוונים, ולכן שתי הזרימות מבטלות זו את זו כבר מההתחלה.
        feedback: >-
          הם עוברים לשני הכיוונים, אבל לא בקצבים שווים: $0.214$ לעומת $0.107$ לצעד. הקצבים מתאזנים רק כאשר $q_A/n_A = q_B/n_B$, בטמפרטורות שוות.
      - text: >-
          מ-B ל-A בהתחלה, כי שלושה רבעים מהקוונטים שנבחרים באים מ-B; ואחר כך בחזרה, אחרי ש-A הדביק את B.
        feedback: >-
          שלושה רבעים מהבחירות אכן באים מ-B, אבל רוב הקוונטים האלה נוחתים בחזרה ב-B, שמחזיק $6/7$ מהמתנדים. כששני הגורמים נספרים, המעברים מ-A גוברים כבר מהצעד הראשון, ושום היפוך אינו מגיע: הפער הממוצע שומר על הסימן שלו.

  # ---------------------------------------------------------------- OBJ-1.1-3: טמפרטורת שיווי המשקל
  - id: Q-1.1-teq
    type: numeric
    level: basic
    objectives: [OBJ-1.1-3]
    prompt: >-
      לגוף A קיבול חום של $300\,\text{J/K}$, והוא מתחיל ב-$80\,{}^\circ\text{C}$; לגוף B קיבול חום של $900\,\text{J/K}$, והוא מתחיל ב-$20\,{}^\circ\text{C}$. הזוג מבודד יחד. מצאו את טמפרטורת שיווי המשקל.
    answer: 35
    unit: °C
    tolerance: 0.01
    correctFeedback: >-
      $T_\mathrm{eq} = (300 \times 80 + 900 \times 20)/1200 = 42\,000/1200 = 35\,{}^\circ\text{C}$. קיבול החום של B גדול פי שלושה מזה של A, ולכן הוא זז שליש מהמרחק: A יורד ב-$45\,\text{K}$ ו-B עולה ב-$15\,\text{K}$, והם נפגשים בשלושה רבעים מהדרך מנקודת ההתחלה של A לזו של B.
    wrongFeedback: >-
      שקללו כל טמפרטורת התחלה לפי קיבול החום של הגוף שלה: $T_\mathrm{eq} = (C_AT_{A,0} + C_BT_{B,0})/(C_A + C_B)$.
    commonWrong:
      - value: 50
        feedback: >-
          זה הממוצע הפשוט, שנכון רק לקיבולי חום שווים. קיבול החום של B גדול פי שלושה מזה של A, והוא מושך את הטמפרטורה המשותפת לעבר נקודת ההתחלה שלו.
        misconception: MC-equal-weight-equilibrium
      - value: 65
        feedback: >-
          זה משקלל כל טמפרטורה לפי קיבול החום של הגוף **האחר**. הגוף בעל הקיבול הגדול יותר זז פחות, ולכן התוצאה חייבת להיות קרובה יותר ל-$20\,{}^\circ\text{C}$ של B.

  - id: Q-1.1-weighted
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-3]
    prompt: >-
      שני גופים בעלי קיבולי חום שונים מאוד מובאים למגע ומבודדים יחד עד שהם מגיעים לשיווי משקל. איזו טענה נכונה?
    choices:
      - text: >-
          $T_\mathrm{eq}$ היא הממוצע של שתי טמפרטורות ההתחלה משוקלל לפי קיבולי החום, ולכן היא קרובה יותר לטמפרטורת ההתחלה של הגוף בעל קיבול החום הגדול יותר.
        correct: true
        feedback: >-
          נכון. $T_\mathrm{eq} = (C_AT_{A,0} + C_BT_{B,0})/(C_A + C_B)$. שני שינויי הטמפרטורה נמצאים ביחס הפוך לקיבולים, כמו זרועות של מנוף: הגוף שצריך יותר אנרגיה לכל קלווין זז פחות.
      - text: >-
          $T_\mathrm{eq}$ היא הממוצע הפשוט של שתי טמפרטורות ההתחלה, יהיו קיבולי החום אשר יהיו.
        feedback: >-
          רק כאשר $C_A = C_B$. שימור האנרגיה משקלל כל טמפרטורת התחלה לפי קיבול החום של הגוף שלה; באיור 1.1א גוף גדול פי שלושה זז שליש מהמרחק.
        misconception: MC-equal-weight-equilibrium
      - text: >-
          $T_\mathrm{eq}$ שווה לטמפרטורת ההתחלה של הגוף בעל קיבול החום הגדול יותר.
        feedback: >-
          זה מרחיק לכת מדי. הגוף הגדול יותר מושך את $T_\mathrm{eq}$ לעבר נקודת ההתחלה שלו, וקובע אותה שם רק בגבול של קיבול חום אינסופי, כלומר מאגר.
      - text: >-
          $T_\mathrm{eq}$ תלויה רק בשאלה איזה גוף התחיל חם יותר, לא בקיבולי החום.
        feedback: >-
          השאלה איזה גוף התחיל חם יותר קובעת את כיוון הזרימה. היכן בין שתי טמפרטורות ההתחלה $T_\mathrm{eq}$ נוחתת נקבע על ידי היחס $C_A/C_B$.

  - id: Q-1.1-double-both
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-3, OBJ-1.1-4]
    prompt: >-
      אתם מכפילים את שני קיבולי החום, $C_A$ ו-$C_B$, ומשאירים את שתי טמפרטורות ההתחלה ואת המוליכות התרמית של המגע, $\kappa$, כפי שהיו. מה קורה לטמפרטורת שיווי המשקל ולזמן הרלקסציה?
    choices:
      - text: >-
          $T_\mathrm{eq}$ אינה משתנה ו-$\tau$ מוכפל.
        correct: true
        feedback: >-
          נכון. ב-$T_\mathrm{eq} = (C_AT_{A,0} + C_BT_{B,0})/(C_A + C_B)$ הגורם $2$ מתבטל: רק היחס בין הקיבולים נכנס. ב-$\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$ המונה גדל פי ארבעה והמכנה פי שניים. היעד אותו יעד; המגע צריך להעביר פי שניים אנרגיה.
      - text: >-
          שניהם אינם משתנים: היחס $C_A/C_B$ זהה, ולכן שום דבר אינו משתנה.
        feedback: >-
          היחס הוא כל מה ש-$T_\mathrm{eq}$ תלויה בו, אבל לא כל מה ש-$\tau$ תלוי בו. האנרגיה שצריכה לעבור, $C_AC_B\,\Delta T(0)/(C_A + C_B)$, מוכפלת, והיא עוברת דרך אותו מגע.
      - text: >-
          $T_\mathrm{eq}$ מוכפלת ו-$\tau$ מוכפל.
        feedback: >-
          $T_\mathrm{eq}$ היא ממוצע משוקלל של שתי טמפרטורות ההתחלה, ותמיד נמצאת ביניהן, יהיו המשקלים אשר יהיו. הכפלת שני המשקלים אינה משנה דבר.
      - text: >-
          $T_\mathrm{eq}$ אינה משתנה ו-$\tau$ גדל פי ארבעה.
        feedback: >-
          המונה $C_AC_B$ גדל פי ארבעה, אבל המכנה $C_A + C_B$ גדל פי שניים: $\tau$ מוכפל.

  - id: Q-1.1-calorimetry
    type: numeric
    level: bagrut
    objectives: [OBJ-1.1-3]
    prompt: >-
      כדי למדוד את החום הסגולי של מתכת, מחממים גוש ממנה במסה $0.25\,\text{kg}$ ל-$95.0\,{}^\circ\text{C}$ ומפילים אותו לתוך $0.40\,\text{kg}$ מים ב-$20.0\,{}^\circ\text{C}$ ($c = 4200\,\text{J/(kg K)}$), בכלי מבודד שקיבול החום שלו עצמו זניח. הגוש והמים מתייצבים על $24.0\,{}^\circ\text{C}$. מצאו את החום הסגולי של המתכת.
    answer: 378.6
    unit: J/(kg K)
    tolerance: 0.02
    correctFeedback: >-
      שימור האנרגיה, כשקוראים אותו הפוך: $C_1(T_\mathrm{eq} - 95.0) + C_2(T_\mathrm{eq} - 20.0) = 0$ עם $C_2 = 0.40 \times 4200 = 1680\,\text{J/K}$ נותן $C_1 = 1680 \times 4.0/71.0 = 94.6\,\text{J/K}$, ו-$c = 94.6/0.25 = 379\,\text{J/(kg K)}$, קרוב לחום הסגולי של נחושת. המים זזו $4\,\text{K}$ והגוש $71\,\text{K}$: קיבול החום של הגוש הוא $1/17.75$ מזה של המים. כך מודדים קיבולי חום.
    wrongFeedback: >-
      כתבו את שימור האנרגיה עבור הגוש והמים, $C_1(T_\mathrm{eq} - T_1) + C_2(T_\mathrm{eq} - T_2) = 0$, פתרו אותו עבור קיבול החום של הגוש, וחלקו במסה שלו.
    commonWrong:
      - value: 119280
        feedback: >-
          זה הופך את היחס: $1680 \times 71/4$, חלקי המסה. הגוש זז $71\,\text{K}$ והמים $4\,\text{K}$, ולכן לגוש קיבול החום ה**קטן** יותר.
      - value: 94.6
        feedback: >-
          זה קיבול החום של הגוש, ב-$\text{J/K}$. חלקו במסה שלו כדי לקבל את החום הסגולי.
      - value: 358.4
        feedback: >-
          זה משתמש ב-$95.0 - 20.0 = 75\,\text{K}$ כשינוי של הגוש. הגוש מסיים ב-$24.0\,{}^\circ\text{C}$, לא בטמפרטורת ההתחלה של המים: הוא ירד ב-$71\,\text{K}$.

  # ---------------------------------------------------------------- OBJ-1.1-4: רלקסציה מעריכית, זמן הרלקסציה
  - id: Q-1.1-one-tau
    type: mc
    level: basic
    objectives: [OBJ-1.1-4]
    prompt: >-
      שני גופים במגע מתחילים עם פער טמפרטורות של $100\,\text{K}$. בערך מה גודל הפער אחרי זמן רלקסציה אחד, $\tau$?
    choices:
      - text: >-
          כ-$37\,\text{K}$: קטן פי $e$ מאשר בהתחלה.
        correct: true
        feedback: >-
          נכון. $\Delta T(t) = \Delta T(0)\,e^{-t/\tau}$ ו-$e^{-1} = 0.368$: אחרי $\tau$ אחד הפער הוא $37\%$ ממה שהיה. הגורם הזה הוא ההגדרה של $\tau$.
      - text: >-
          $0\,\text{K}$: זמן רלקסציה אחד הוא הזמן שלוקח להגיע לשיווי משקל.
        feedback: >-
          $\tau$ אחד מקטין את הפער פי $e$, לא לאפס. המעריכית לעולם אינה מגיעה לאפס; אחרי כמה $\tau$ הפער זניח ($5\%$ אחרי שלושה), אבל $\tau$ אינו זמן הגעה.
      - text: >-
          $50\,\text{K}$: זמן רלקסציה אחד מקטין את הפער לחצי.
        feedback: >-
          הקטנה לחצי לוקחת $\tau\ln 2 = 0.69\,\tau$. זמן הרלקסציה מוגדר לפי הגורם $e$, לא לפי חצי.
      - text: >-
          עדיין בערך $100\,\text{K}$: הפער מתחיל לקטון רק אחרי כמה זמני רלקסציה.
        feedback: >-
          הפער קטן מהרגע הראשון, ודווקא אז הכי מהר: קצב השינוי שלו יחסי לפער עצמו.

  - id: Q-1.1-no-overshoot
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-4]
    prompt: >-
      באיור 1.1א גוף A מתחיל ב-$T_A = 4$ וגוף B ב-$T_B = 1$, והם נפגשים ב-$1.75$. מה מתאר את עקומת הממוצע של $T_A$, הממוצע על פני הרצות רבות?
    choices:
      - text: >-
          היא יורדת לעבר $1.75$, לאט יותר ויותר, ולעולם אינה יורדת מתחת לערך הזה.
        correct: true
        feedback: >-
          נכון. הפער דועך כמו $e^{-t/\tau}$ ולעולם אינו מחליף סימן; הממוצע של $T_A$ הוא $1.75 + 2.25\,e^{-t/\tau}$, וזה של $T_B$ הוא $1.75 - 0.75\,e^{-t/\tau}$.
      - text: >-
          היא יורדת מתחת ל-$1.75$, חוזרת אל מעליו, ומתייצבת אחרי כמה תנודות שהולכות וקטנות.
        feedback: >-
          כך מתנהגת מטוטלת, שיש לה תנע שנושא אותה אל מעבר לנקודה הנמוכה ביותר. לזרימת חום אין תנע: קצב השינוי של הפער נקבע על ידי הפער לבדו, ולכן הוא דועך בדיוק כפי שהפער דועך, והפער לעולם אינו מחליף סימן.
        misconception: MC-temperatures-overshoot
      - text: >-
          היא יורדת בקצב קבוע ונעצרת בבת אחת ב-$1.75$.
        feedback: >-
          הקצב יחסי לפער שנותר, ולכן הירידה מאטה ככל שהפער קטן. $T_A$ מתקרבת ל-$1.75$ בלי להגיע אליו לעולם.
      - text: >-
          היא יורדת ל-$2.5$, נקודת האמצע בין שתי טמפרטורות ההתחלה, ונשארת שם.
        feedback: >-
          ל-B פי שלושה מתנדים מאשר ל-A, ולכן פי שלושה קיבול חום: הטמפרטורה המשותפת נמצאת ברבע הדרך מנקודת ההתחלה של B לזו של A, ב-$1.75$.
        misconception: MC-equal-weight-equilibrium

  - id: Q-1.1-half-gap
    type: numeric
    level: mid
    objectives: [OBJ-1.1-4]
    prompt: >-
      שני גופים, עם $C_A = 50\,\text{J/K}$ ו-$C_B = 200\,\text{J/K}$, מחוברים במגע בעל מוליכות תרמית $\kappa = 0.40\,\text{W/K}$. כמה זמן לוקח לפער הטמפרטורות ביניהם לקטון לחצי?
    answer: 69.3
    unit: s
    tolerance: 0.02
    correctFeedback: >-
      $\tau = (50 \times 200)/(0.40 \times 250) = 100\,\text{s}$, והפער קטן לחצי בתוך $\tau\ln 2 = 69.3\,\text{s}$. אותו זמן מקטין אותו לחצי שוב: אחרי $139\,\text{s}$ נותר רבע.
    wrongFeedback: >-
      מצאו את $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$, ואז פתרו $e^{-t/\tau} = 1/2$.
    commonWrong:
      - value: 100
        feedback: >-
          זה $\tau$ עצמו, שאחריו נותרים $37\%$ מהפער, לא חצי. הקטנה לחצי לוקחת $\tau\ln 2$.
      - value: 86.6
        feedback: >-
          זה $(C_A/\kappa)\ln 2$, כאילו B היה מאגר. גם הטמפרטורה של B זזה, לעבר זו של A, ולכן הפער נסגר מהר יותר: ב-$\tau$ נכנס $C_AC_B/(C_A + C_B) = 40\,\text{J/K}$, לא $C_A$.
      - value: 433
        feedback: >-
          זה $\big((C_A + C_B)/\kappa\big)\ln 2$. הקיבולים מצטרפים כ-$C_AC_B/(C_A + C_B)$, שקטן מכל אחד מהם, ולא כסכום שלהם.

  - id: Q-1.1-same-factor
    type: mc
    level: mid
    objectives: [OBJ-1.1-4]
    prompt: >-
      שני גופים במגע מתחילים בהפרש של $40\,\text{K}$; שש דקות אחר כך הפער הוא $10\,\text{K}$. כמה זמן נוסף יעבור עד שיהיה $2.5\,\text{K}$?
    choices:
      - text: >-
          עוד שש דקות: דעיכה מעריכית מקטינה את הפער באותו גורם, כאן $4$, בכל פרק זמן שווה.
        correct: true
        feedback: >-
          נכון. עם $\Delta T(t) = \Delta T(0)\,e^{-t/\tau}$, כל שש דקות מכפילות את הפער ב-$1/4$, ולכן $\tau = 6/\ln 4 = 4.33$ דקות. עוד שש דקות אחרי כן מביאות אותו ל-$0.63\,\text{K}$.
      - text: >-
          דקה וחצי: $30\,\text{K}$ לקחו שש דקות, כלומר $5\,\text{K}$ לדקה, ולכן עוד $7.5\,\text{K}$ לוקחים $1.5$ דקות.
        feedback: >-
