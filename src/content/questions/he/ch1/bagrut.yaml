# שאלות החזרה של מודול 01, מתוך דף הבעיות של ThermoLab (content/en/thermodynamics/01-equilibrium-problems.md, בעיות
# 2–5; בעיות 1 ו-6 עברו לחוברת התרגול). הדוגמאות הפתורות 1, 3 ו-4 של השיעור כבר פותרות את בעיות 2, 3 ו-4 עם המספרים
# של ThermoLab, ולכן כאן נשמרו הנושא והשאלה הפתוחה של כל בעיה, אבל המספרים והתרחיש שונו. מבחן הקרינה בסעיף (ד) של
# בעיה 5 חדש: הוא הופך את הטיעון של הבעיה לבר-בדיקה. כל מספר חושב מחדש בספרייה של ThermoLab (thermolab.equilibrium);
# מספרים מסימולציה הם ממוצעים על פני כמה זרעים. ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו מפרסמת פתרונות
# מלאים ומחוונים. המזהים משותפים עם הקובץ באנגלית.
lang: he
chapter: 1
questions:
  - id: Q-1-bagrut-1
    type: bagrut
    title: >-
      מים בקנקן תה קר
    prompt: >-
      מוזגים $0.25\,\text{kg}$ מים ב-$95\,{}^\circ\text{C}$ (חום סגולי $c = 4200\,\text{J/(kg K)}$) לקנקן תה מקרמיקה בעל קיבול חום $C_B = 400\,\text{J/K}$, שנמצא בטמפרטורת החדר, $18\,{}^\circ\text{C}$. מרגע שהמים בפנים, התייחסו למים ולקנקן כמבודדים יחד, עם קיבולי חום קבועים.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-1.1-3]
        prompt: >-
          מצאו את קיבול החום $C_A$ של המים.
        answer: 1050
        unit: J/K
        tolerance: 0.01
        correctFeedback: >-
          $C_A = mc = 0.25 \times 4200 = 1050\,\text{J/K}$: המים צריכים פי $2.6$ יותר אנרגיה לכל קלווין מאשר הקנקן.
        wrongFeedback: >-
          קיבול החום של מסה $m$ בעלת חום סגולי $c$ הוא $C = mc$, כש-$m$ בקילוגרמים.
        commonWrong:
          - value: 1.05e6
            feedback: >-
              זה מציב את המסה בגרמים. החום הסגולי הוא לקילוגרם: $m = 0.25\,\text{kg}$.
          - value: 4200
            feedback: >-
              זה החום הסגולי, לקילוגרם. הכפילו במסה, $0.25\,\text{kg}$.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-1.1-3]
        prompt: >-
          מצאו את הטמפרטורה המשותפת שהמים והקנקן מגיעים אליה.
        answer: 73.76
        unit: °C
        tolerance: 0.01
        correctFeedback: >-
          $T_\mathrm{eq} = (1050 \times 95 + 400 \times 18)/1450 = 106\,950/1450 = 73.8\,{}^\circ\text{C}$. ממוצע משוקלל של טמפרטורות מותר לחשב בצלזיוס, כי סכום המשקלים הוא אחד וההיסט בין הסקאלות מתבטל.
        wrongFeedback: >-
          שקללו כל טמפרטורת התחלה לפי קיבול החום שלה: $T_\mathrm{eq} = (C_AT_{A,0} + C_BT_{B,0})/(C_A + C_B)$.
        commonWrong:
          - value: 56.5
            feedback: >-
              זה הממוצע הפשוט של $95$ ו-$18$, שנכון רק לקיבולי חום שווים. קיבול החום של המים גדול פי $2.6$ מזה של הקנקן, והם מושכים את התוצאה לעבר נקודת ההתחלה שלהם.
            misconception: MC-equal-weight-equilibrium
          - value: 39.24
            feedback: >-
              זה משקלל כל טמפרטורה לפי קיבול החום של הגוף **האחר**. המים, בעלי הקיבול הגדול יותר, חייבים לזוז פחות, ולכן התוצאה קרובה יותר ל-$95\,{}^\circ\text{C}$.
      - label: ג
        type: mc
        points: 4
        objectives: [OBJ-1.1-3]
        prompt: >-
          המים יורדים ב-$21.2\,\text{K}$ והקנקן עולה ב-$55.8\,\text{K}$. מדוע הקנקן זז יותר?
        choices:
          - text: >-
              אותה אנרגיה, $22.3\,\text{kJ}$, עוזבת את המים ונכנסת לקנקן, והקנקן צריך פחות אנרגיה לכל קלווין. שני השינויים נמצאים ביחס הפוך לקיבולי החום: $55.8/21.2 = 2.625 = 1050/400$.
            correct: true
            feedback: >-
              נכון. $C_A\,|\Delta T_A| = C_B\,|\Delta T_B|$ הוא שימור האנרגיה, והוא כלל המנוף: הצד הכבד יותר, בעל הקיבול הגדול יותר, זז פחות.
          - text: >-
              הקנקן התחיל רחוק יותר מהטמפרטורה הסופית, ולכן היה לו יותר מרחק לעבור.
            feedback: >-
              זה טיעון מעגלי: היכן נוחתת הטמפרטורה הסופית זו בדיוק השאלה. היא נוחתת קרוב יותר לנקודת ההתחלה של המים כי למים קיבול החום הגדול יותר.
          - text: >-
              הגוף הקר יותר זז תמיד יותר, כי חום זורם אליו.
            feedback: >-
              איזה גוף זז יותר נקבע על ידי קיבולי החום, לא על ידי השאלה איזה מהם קר יותר. מזגו מים קרים לקנקן חם עם אותם קיבולים, והמים, בעלי הקיבול הגדול יותר, עדיין יזוזו פחות.
          - text: >-
              חום נכנס לקרמיקה מהר יותר משהוא עוזב מים.
            feedback: >-
              קצבים קובעים באיזו מהירות הזוג מגיע ליעד, לא מהו היעד. הטמפרטורה הסופית, ואיתה השינוי של כל גוף, נובעת משימור האנרגיה לבדו, תהיה המוליכות התרמית של המגע אשר תהיה.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-1.1-3]
        prompt: >-
          המים אמורים להתייצב על $80\,{}^\circ\text{C}$ או יותר. גזרו משימור האנרגיה את הטמפרטורה $T_{B,0}$ שאליה צריך לחמם מראש את הקנקן כדי שהזוג יתייצב על טמפרטורה נבחרת $T^\ast$, כנוסחה ב-$C_A$, $C_B$, $T_{A,0}$ ו-$T^\ast$, וחשבו אותה עבור $T^\ast = 80\,{}^\circ\text{C}$. ציינו מה הגזירה מניחה, ובדקו את הנוסחה שלכם בגבולות.
        solution:
          - kind: law
            text: >-
              המים והקנקן מבודדים יחד ולא נעשית עבודה, ולכן כל ג'אול שהמים מאבדים הקנקן מקבל: $\Delta U_A + \Delta U_B = 0$. עם קיבולי חום קבועים, $\Delta U = C\,\Delta T$ לכל אחד מהם, והזוג אמור לסיים ב-$T^\ast$: $C_A(T^\ast - T_{A,0}) + C_B(T^\ast - T_{B,0}) = 0$.
          - kind: manipulation
            text: >-
              פותרים עבור $T_{B,0}$: $C_B(T_{B,0} - T^\ast) = -C_A(T_{A,0} - T^\ast)$. הקנקן צריך להתחיל מתחת ל-$T^\ast$ במרחק של פי $C_A/C_B$ מהירידה של המים.
          - kind: formula
            text: >-
              $T_{B,0} = T^\ast - \dfrac{C_A}{C_B}\,\big(T_{A,0} - T^\ast\big)$
          - kind: limit
            text: >-
              $T^\ast = T_{A,0}$: $T_{B,0} = T_{A,0}$, הקנקן צריך להיות חם כמו המים, כי המים אינם רשאים לאבד דבר. $C_B \to 0$: $T_{B,0} \to -\infty$, קנקן חסר קיבול חום אינו קולט חום, תהיה הטמפרטורה שלו אשר תהיה. $C_B \to \infty$: $T_{B,0} \to T^\ast$, קנקן עצום מחזיק את המים בטמפרטורה שלו עצמו. $C_A = C_B$: $T_{B,0} = 2T^\ast - T_{A,0}$, מתחת ל-$T^\ast$ באותו מרחק שבו המים מתחילים מעליה.
          - kind: units
            text: >-
              $C_A/C_B$ הוא מספר טהור שמוכפל בהפרש טמפרטורות, ולכן $T_{B,0}$ היא טמפרטורה; אפשר להשתמש בצלזיוס לאורך כל הדרך, כי מופיעים רק הפרשים וממוצע משוקלל שסכום המשקלים בו הוא אחד.
          - kind: substitution
            text: >-
              $T_{B,0} = 80 - (1050/400)(95 - 80) = 80 - 2.625 \times 15 = 80 - 39.4 = 40.6\,{}^\circ\text{C}$. בדיקה: $(1050 \times 95 + 400 \times 40.6)/1450 = 80.0\,{}^\circ\text{C}$.
          - kind: result
            text: >-
              $T_{B,0} = T^\ast - (C_A/C_B)(T_{A,0} - T^\ast) = 40.6\,{}^\circ\text{C}$: די לשטוף את הקנקן במים חמים מהברז, בערך $41\,{}^\circ\text{C}$, בעוד שקנקן קר עולה למים $21\,\text{K}$. הגזירה מניחה קיבולי חום קבועים ושום איבוד חום לחדר בזמן שהזוג מתייצב; קנקן ממשי מאבד חום גם לאוויר, ולכן כדאי לחמם אותו מראש קצת יותר.
        rubric:
          - text: >-
              כתיבת שימור האנרגיה עבור הזוג המבודד, $C_A(T^\ast - T_{A,0}) + C_B(T^\ast - T_{B,0}) = 0$.
            weight: 2
          - text: >-
              פתרון עבור $T_{B,0} = T^\ast - (C_A/C_B)(T_{A,0} - T^\ast)$.
            weight: 2
          - text: >-
              חישוב $40.6\,{}^\circ\text{C}$.
          - text: >-
              ציון ההנחות: קיבולי חום קבועים, אין החלפת חום עם הסביבה.
          - text: >-
              בדיקת גבולות: $T^\ast = T_{A,0}$, $C_B \to 0$ או $C_B \to \infty$, עם המשמעות של כל אחד.
            weight: 2

  - id: Q-1-bagrut-2
    type: bagrut
    title: >-
      שני גופים, מגע אחד
    prompt: >-
      לגוף A קיבול חום $C_A = 90\,\text{J/K}$, והוא מתחיל ב-$70\,{}^\circ\text{C}$; לגוף B קיבול חום $C_B = 180\,\text{J/K}$, והוא מתחיל ב-$10\,{}^\circ\text{C}$. הם נוגעים זה בזה דרך מגע בעל מוליכות תרמית $\kappa = 1.2\,\text{W/K}$, ומלבד זה הם מבודדים. חום עובר ביניהם לפי חוק הקירור של ניוטון, $\dbar Q_A = \kappa\,(T_B - T_A)\,\mathrm{d}t$.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-1.1-4]
        prompt: >-
          מצאו את זמן הרלקסציה $\tau$.
        answer: 50
        unit: s
        tolerance: 0.01
        correctFeedback: >-
          $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big) = (90 \times 180)/(1.2 \times 270) = 16\,200/324 = 50\,\text{s}$.
        wrongFeedback: >-
          $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$, בשניות כשהקיבולים ב-$\text{J/K}$ ו-$\kappa$ ב-$\text{W/K}$.
        commonWrong:
          - value: 75
            feedback: >-
              זה $C_A/\kappa$, זמן הרלקסציה מול מאגר. B אינו מאגר: הטמפרטורה שלו נעה לעבר זו של A, וזה סוגר את הפער מהר יותר.
          - value: 225
            feedback: >-
              זה $(C_A + C_B)/\kappa$. הקיבולים מצטרפים כ-$C_AC_B/(C_A + C_B) = 60\,\text{J/K}$, שקטן מכל אחד מהם.
          - value: 0.02
            feedback: >-
              זה $1/\tau$, הקצב, ב-$\text{s}^{-1}$. זמן הרלקסציה הוא ההופכי שלו.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-1.1-3]
        prompt: >-
          מצאו את הטמפרטורה שבה שני הגופים נפגשים.
        answer: 30
        unit: °C
        tolerance: 0.01
        correctFeedback: >-
          $T_\mathrm{eq} = (90 \times 70 + 180 \times 10)/270 = 8100/270 = 30\,{}^\circ\text{C}$: A יורד ב-$40\,\text{K}$, B עולה ב-$20\,\text{K}$. למוליכות התרמית אין כאן תפקיד: היא קובעת באיזו מהירות, לא היכן.
        wrongFeedback: >-
          שימור האנרגיה: $T_\mathrm{eq} = (C_AT_{A,0} + C_BT_{B,0})/(C_A + C_B)$.
        commonWrong:
          - value: 40
            feedback: >-
              זה הממוצע הפשוט, שנכון רק לקיבולים שווים. ל-B קיבול כפול מזה של A, והוא מושך את התוצאה לעבר נקודת ההתחלה שלו.
            misconception: MC-equal-weight-equilibrium
          - value: 50
            feedback: >-
              זה משקלל כל טמפרטורה לפי הקיבול של הגוף האחר. הגוף הגדול יותר, B, זז פחות.
      - label: ג
        type: numeric
        points: 4
        objectives: [OBJ-1.1-4]
        prompt: >-
          כמה זמן אחרי תחילת המגע הפער יורד ל-$1.0\,\text{K}$?
        answer: 204.7
        unit: s
        tolerance: 0.02
        correctFeedback: >-
          $60\,e^{-t/\tau} = 1.0$ נותן $t = \tau\ln 60 = 50 \times 4.09 = 205\,\text{s}$, בערך ארבעה זמני רלקסציה.
        wrongFeedback: >-
          פתרו את $\Delta T(0)\,e^{-t/\tau} = 1.0\,\text{K}$ עבור $t$, עם $\Delta T(0) = 60\,\text{K}$, בעזרת הלוגריתם הטבעי.
        commonWrong:
          - value: 88.9
            feedback: >-
              זה משתמש ב-$\log_{10} 60$. המעריכית היא $e^{-t/\tau}$, ולכן הלוגריתם הוא הטבעי: $\ln 60 = 4.09$.
          - value: 307
            feedback: >-
              זה $(C_A/\kappa)\ln 60$, כש-B נחשב למאגר. גם B זז, ו-$\tau = 50\,\text{s}$.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-1.1-4, OBJ-1.1-3]
        prompt: >-
          גזרו, ממשוואת הקצב של כל גוף, את החוק $\Delta T(t) = \Delta T(0)\,e^{-t/\tau}$ עבור הפער $\Delta T = T_A - T_B$, ואת הנוסחה של $\tau$. אחר כך מצאו את $T_A(t)$ ואת $T_B(t)$ בנפרד, חשבו אותן ב-$t = \tau$, ומצאו את סך החום שחוצה את המגע בדרך לשיווי משקל. בדקו את התוצאות שלכם בגבולות.
        solution:
          - kind: law
            text: >-
              חוק ניוטון לכל גוף, עם $C\,\mathrm{d}T = \dbar Q$ וללא עבודה: $C_A\,\mathrm{d}T_A/\mathrm{d}t = \kappa(T_B - T_A)$ ו-$C_B\,\mathrm{d}T_B/\mathrm{d}t = \kappa(T_A - T_B)$.
          - kind: manipulation
            text: >-
              מחלקים כל משוואה בקיבול שלה ומחסרים: $\mathrm{d}\,\Delta T/\mathrm{d}t = -\kappa\,(1/C_A + 1/C_B)\,\Delta T = -\Delta T/\tau$, עם $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$, ולכן $\Delta T(t) = \Delta T(0)\,e^{-t/\tau}$. חיבור שתי המשוואות, במקום חיסורן, נותן $\mathrm{d}(C_AT_A + C_BT_B)/\mathrm{d}t = 0$: הממוצע המשוקלל נשאר על $T_\mathrm{eq}$ לאורך כל הדרך.
          - kind: manipulation
            text: >-
              מתוך $C_AT_A + C_BT_B = (C_A + C_B)\,T_\mathrm{eq}$ ו-$T_A - T_B = \Delta T$ פותרים עבור שתי הטמפרטורות. החום שחצה את המגע עד הזמן $t$ הוא $C_A\big(T_{A,0} - T_A(t)\big)$.
          - kind: formula
            text: >-
              $T_A(t) = T_\mathrm{eq} + \dfrac{C_B}{C_A + C_B}\,\Delta T(0)\,e^{-t/\tau} \qquad T_B(t) = T_\mathrm{eq} - \dfrac{C_A}{C_A + C_B}\,\Delta T(0)\,e^{-t/\tau} \qquad Q_\infty = \dfrac{C_AC_B}{C_A + C_B}\,\Delta T(0)$
          - kind: limit
            text: >-
              $C_B \to \infty$: $\tau \to C_A/\kappa$, $T_B$ נשארת על $T_{B,0}$ ו-$T_A$ מתקרבת אליה, גוף מול מאגר, כמו גופה שמתקררת בחדר בחקירה פלילית; $Q_\infty \to C_A\,\Delta T(0)$, כל העודף של A. $\kappa \to \infty$: $\tau \to 0$, שיווי המשקל המיידי שאף מגע ממשי אינו נותן. $t = 0$ מחזיר את טמפרטורות ההתחלה, ו-$t \to \infty$ נותן לשתיהן $T_\mathrm{eq}$.
          - kind: units
            text: >-
              $\tau$: $(\text{J/K})^2/\big((\text{W/K})(\text{J/K})\big) = \text{J/W} = \text{s}$. $Q_\infty$: $(\text{J/K})\cdot\text{K} = \text{J}$.
          - kind: substitution
            text: >-
              $\Delta T(0) = 60\,\text{K}$, $T_\mathrm{eq} = 30\,{}^\circ\text{C}$, $\tau = 50\,\text{s}$. ב-$t = \tau$ הפער הוא $60\,e^{-1} = 22.1\,\text{K}$, ולכן $T_A = 30 + \tfrac23 \times 22.1 = 44.7\,{}^\circ\text{C}$ ו-$T_B = 30 - \tfrac13 \times 22.1 = 22.6\,{}^\circ\text{C}$. $Q_\infty = (90 \times 180/270) \times 60 = 3600\,\text{J}$, ששווה ל-$C_A(70 - 30)$ ול-$C_B(30 - 10)$.
          - kind: result
            text: >-
              $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big) = 50\,\text{s}$; שתי הטמפרטורות מתקרבות ל-$30\,{}^\circ\text{C}$ באופן מעריכי עם אותו $\tau$, A מלמעלה ו-B מלמטה, כש-A זז פי שניים יותר; ב-$t = \tau$ הן ב-$44.7$ וב-$22.6\,{}^\circ\text{C}$; בסך הכול חוצים את המגע $3600\,\text{J}$.
        rubric:
          - text: >-
              כתיבת שתי משוואות הקצב וחיסורן, לקבלת $\mathrm{d}\,\Delta T/\mathrm{d}t = -\Delta T/\tau$ עם $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$.
            weight: 2
          - text: >-
              הראיה ש-$C_AT_A + C_BT_B$ קבוע, ולכן שתי הטמפרטורות מתקרבות ל-$T_\mathrm{eq}$.
          - text: >-
