          - kind: law
            text: >-
              $T_\mathrm{eq}$ נשענת רק על שימור האנרגיה ועל קיבולי חום קבועים: מה שלא יישא את האנרגיה מצד לצד, קוונטים בגדלים שונים, פונונים דרך ממשק או קרינה, הזוג מבודד, ולכן $C_A(T_\mathrm{eq} - T_{A,0}) + C_B(T_\mathrm{eq} - T_{B,0}) = 0$ מתקיים בלי שינוי. המעריכית נשענת על זרימת חום ליניארית בהפרש. כל מנגנון נותן הספק נטו $P(T_A, T_B)$ שמתאפס כאשר $T_A = T_B$ (טמפרטורות שוות, אין זרימה נטו: החוק האפס), ולכן בפיתוח סביב טמפרטורות שוות האיבר הראשון שלו ליניארי, $P \approx \kappa\,(T_A - T_B)$: חוק ניוטון הוא גבול ההפרש הקטן של כל מנגנון, והמנגנון קובע רק את $\kappa$, שהמודל מעולם לא טען לחזות.
          - kind: manipulation
            text: >-
              עבור קרינה, $T_A^4 - T_B^4 = (T_A - T_B)(T_A + T_B)(T_A^2 + T_B^2)$. עם $\bar T = (T_A + T_B)/2$ ו-$\Delta T = T_A - T_B$ מתקבל $T_A + T_B = 2\bar T$ ו-$T_A^2 + T_B^2 = 2\bar T^2 + \Delta T^2/2$, ולכן $P = 4\sigma A\,\bar T^3\,\Delta T\,\big[1 + (\Delta T/2\bar T)^2\big]$. כשהקיבולים שווים, שימור האנרגיה שומר על $\bar T = T_\mathrm{eq}$ בכל רגע.
          - kind: formula
            text: >-
              $\kappa = 4\sigma A\,T_\mathrm{eq}^3 \qquad \tau = \dfrac{C_AC_B}{\kappa\,(C_A + C_B)} \qquad \dfrac{P}{\kappa\,\Delta T} - 1 = \left(\dfrac{\Delta T}{2T_\mathrm{eq}}\right)^2$
          - kind: limit
            text: >-
              $\Delta T/T_\mathrm{eq} \to 0$: התיקון נעלם כמו הריבוע שלו, חוק ניוטון נעשה מדויק, והפער דועך מעריכית עם ה-$\tau$ שלמעלה. בפער גדול הקרינה מעבירה חום מהר יותר מחוק ניוטון, ולכן הדעיכה מתחילה מהר יותר ממעריכית ונעשית מעריכית ככל שהפער קטן. $T_\mathrm{eq} \to 0$: $\kappa \propto T^3 \to 0$ ו-$\tau \to \infty$, הקרינה גוועת בקור. $C_B \to \infty$: $\tau \to C_A/\kappa$, לוח מול מאגר.
          - kind: units
            text: >-
              $\sigma A\,T^3$: $\text{W}\,\text{m}^{-2}\,\text{K}^{-4} \cdot \text{m}^2 \cdot \text{K}^3 = \text{W/K}$, מוליכות תרמית; $\tau$ ב-$\text{J/W} = \text{s}$.
          - kind: substitution
            text: >-
              קיבולים שווים נותנים $T_\mathrm{eq} = 300\,\text{K}$. $\kappa = 4 \times 5.67 \times 10^{-8} \times 0.010 \times 300^3 = 0.0612\,\text{W/K}$, ו-$\tau = (100 \times 100)/(0.0612 \times 200) = 817\,\text{s}$, בערך $14$ דקות. בהתחלה $\Delta T = 20\,\text{K}$: ההספק המדויק הוא $5.67 \times 10^{-10} \times (310^4 - 290^4) = 1.226\,\text{W}$, לעומת $0.0612 \times 20 = 1.225\,\text{W}$ לפי ניוטון, שגיאה של $(20/600)^2 = 0.11\%$. אפילו פער של $200\,\text{K}$ היה נותן רק $11\%$.
          - kind: result
            text: >-
              מנגנון אחר משנה את המוליכות התרמית, לא את שתי התוצאות: הזוג עדיין נפגש ב-$T_\mathrm{eq} = 300\,\text{K}$ המשוקללת לפי הקיבולים, וקרוב לשיווי משקל הפער עדיין דועך כמו $e^{-t/\tau}$, כאן עם $\kappa = 4\sigma A T_\mathrm{eq}^3 = 0.0612\,\text{W/K}$ ו-$\tau = 817\,\text{s}$, כשחוק ניוטון שגוי ב-$0.11\%$ בלבד בהתחלה. מה שהקוונטים השווים של המודל מחמיצים הוא המסלול המיקרוסקופי וסקאלת הזמן, ואת אלה הוא מעולם לא טען לתאר נכון.
        rubric:
          - text: >-
              טיעון ש-$T_\mathrm{eq}$ נובעת משימור האנרגיה ומקיבולי חום קבועים, יהיה המנגנון אשר יהיה.
            weight: 2
          - text: >-
              טיעון שכל זרימה נטו מתאפסת בטמפרטורות שוות, ולכן האיבר הליניארי שלה הוא חוק ניוטון, עם $\kappa$ שתלוי במנגנון.
            weight: 2
          - text: >-
              לינאריזציה של חוק הקרינה ל-$\kappa = 4\sigma A T_\mathrm{eq}^3$, וחישוב $0.0612\,\text{W/K}$ ו-$\tau \approx 817\,\text{s}$.
          - text: >-
              חישוב השגיאה של חוק ניוטון בהתחלה, כ-$0.1\%$.
          - text: >-
              בדיקת גבולות: $\Delta T/T \to 0$, $T \to 0$ או $C_B \to \infty$, עם המשמעות.
            weight: 2
