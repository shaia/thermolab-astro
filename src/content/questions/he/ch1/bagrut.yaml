      - label: ד
        type: open
        points: 13
        objectives: [OBJ-1.1-4]
        prompt: >-
          הראו שזמן המוות נובע מהטמפרטורה בעת המוות, משתי הקריאות, מטמפרטורת המרתף ומהזמן שבין הקריאות, בלי למצוא קודם את $\tau$, וכתבו את הנוסחה. טמפרטורת המרתף ידועה רק בדיוק של $\pm 1\,\text{K}$, והטמפרטורה בעת המוות בדיוק של $\pm 0.5\,\text{K}$: איזו מבין אי-הוודאויות האלה חשובה יותר להערכה? בדקו את הנוסחה שלכם בגבולות, כולל הגבול שבו הקירור בין הקריאות קטן לעומת הפערים.
        solution:
          - kind: law
            text: >-
              כשהמרתף משמש מאגר, הפער $g = T - T_\infty$ דועך כמו $g(t) = g(0)\,e^{-t/\tau}$, ולכן פער $g$ קטן לפער מאוחר יותר $g'$ בתוך זמן $\tau\ln(g/g')$: יחסים שווים לוקחים זמנים שווים.
          - kind: manipulation
            text: >-
              נסמן את הפערים בעת המוות ובשתי הקריאות $g_0$, $g_1$, $g_2$, ואת הזמן בין הקריאות $\Delta t$. הקריאות נותנות $\tau = \Delta t/\ln(g_1/g_2)$, והמוות אירע $t^\ast = \tau\ln(g_0/g_1)$ לפני הקריאה הראשונה. מסלקים את $\tau$.
          - kind: formula
            text: >-
              $t^\ast = \Delta t\,\dfrac{\ln(g_0/g_1)}{\ln(g_1/g_2)} \qquad g_i = T_i - T_\infty$
          - kind: limit
            text: >-
              $g_0 \to g_1$, גופה שנמצאה ברגע המוות: $t^\ast \to 0$. $g_2 \to g_1$, שום קירור לא נראה בין הקריאות: $\tau \to \infty$ ו-$t^\ast \to \infty$, גוף שאינו מתקרר אי אפשר לתארך. כשהשינויים קטנים לעומת הפערים, $\ln(1 + x) \approx x$ נותן $t^\ast \to \Delta t\,(T_0 - T_1)/(T_1 - T_2)$, אקסטרפולציה ליניארית בקצב הנמדד: כאן $2.5\,\text{h}$, ארוך מדי, כי הגוף התקרר מהר יותר לפני הקריאה הראשונה מאשר בין שתי הקריאות.
          - kind: units
            text: >-
              יחס הלוגריתמים הוא מספר טהור, ולכן $t^\ast$ ביחידות של $\Delta t$, שעות; הפערים הם הפרשי טמפרטורות, ולכן אפשר להשתמש בקריאות בצלזיוס.
          - kind: substitution
            text: >-
              $g_0 = 21\,\text{K}$, $g_1 = 16\,\text{K}$, $g_2 = 12\,\text{K}$, $\Delta t = 2\,\text{h}$: $t^\ast = 2 \times \ln(1.3125)/\ln(1.3333) = 2 \times 0.2719/0.2877 = 1.89\,\text{h}$. מרתף ב-$15\,{}^\circ\text{C}$ נותן $1.92\,\text{h}$, ומרתף ב-$17\,{}^\circ\text{C}$ נותן $1.86\,\text{h}$: $\pm 0.03\,\text{h}$. טמפרטורה בעת המוות של $37.5\,{}^\circ\text{C}$ נותנת $2.05\,\text{h}$, ושל $36.5\,{}^\circ\text{C}$ נותנת $1.72\,\text{h}$: $\pm 0.17\,\text{h}$.
          - kind: result
            text: >-
              $t^\ast = \Delta t\,\ln(g_0/g_1)/\ln(g_1/g_2) = 1.89\,\text{h}$ לפני הקריאה הראשונה. הטמפרטורה בעת המוות חשובה בערך פי חמישה יותר מזו של המרתף: שינוי ב-$T_\infty$ מזיז את שלושת הפערים יחד ומתבטל במידה רבה ביחס, בעוד ש-$g_0$ נכנס לבדו. ההנחות של המודל עצמו, $\kappa$ קבוע (לבוש, תנוחה, זרימת אוויר) וגוף אחיד, הן מקורות שגיאה גדולים יותר משתיהן.
        rubric:
          - text: >-
              סילוק $\tau$ והגעה ל-$t^\ast = \Delta t\,\ln(g_0/g_1)/\ln(g_1/g_2)$, כשהפערים נמדדים מטמפרטורת המרתף.
            weight: 2
          - text: >-
              חישוב $1.89\,\text{h}$.
          - text: >-
              חישוב שתי הרגישויות ($\pm 0.03\,\text{h}$ ו-$\pm 0.17\,\text{h}$) והמסקנה שהטמפרטורה בעת המוות חשובה יותר, עם נימוק.
            weight: 2
          - text: >-
              בדיקת גבולות: $g_0 \to g_1$, $g_2 \to g_1$, או גבול האקסטרפולציה הליניארית, עם המשמעות שלו.
            weight: 2

