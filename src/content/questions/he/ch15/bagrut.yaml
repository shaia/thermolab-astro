# שאלות החזרה של מודול 15, מתוך דף הבעיות של ThermoLab (content/he/advanced/15-ising-problems.md, בעיות 1–6).
# בעיות 4 ו-5 היו תרגילי מעבדה; כאן הן נפתרות מנתונים שהשיעור מצטט (מיקומי השיאים של ThermoLab) או מהרצות של
# src/physics/ising.ts (⟨|m|⟩ ו-τ של בעיה 5, השונות של בעיה 4). ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה
# הזו מפרסמת פתרונות מלאים ומחוונים. יחידות מצומצמות: אנרגיות ביחידות של J, טמפרטורה כ-k_BT/J. המזהים משותפים
# עם הקובץ באנגלית.
lang: he
chapter: 15
questions:
  - id: Q-15-bagrut-1
    type: bagrut
    title: >-
      כלל הקבלה הוא בחירה, בגבולות מסוימים
    prompt: >-
      שרשרת מרקוב על הסריג הריבועי ב-$h = 0$ מציעה להפוך ספין אחד, שנבחר באקראי באופן אחיד, ומקבלת את ההצעה בהסתברות $A(\Delta E)$, כאשר $\Delta E$ הוא שינוי האנרגיה בהיפוך. במקומות שבהם נדרשים מספרים, $k_BT = 2J$.
    parts:
      - label: א
        type: mc
        points: 4
        objectives: [OBJ-15.1-2]
        prompt: >-
          אילו ערכים יכול $\Delta E$ לקבל בהיפוך יחיד?
        choices:
          - text: >-
              $-8J$, $-4J$, $0$, $4J$, $8J$
            correct: true
            feedback: >-
              נכון. $\Delta E_i = 2s_iJ\sum_j s_j$, והסכום על ארבעה שכנים של $\pm1$ הוא $-4$, $-2$, $0$, $2$ או $4$. חמישה ערכים, ולכן אפשר לחשב את הסתברויות הקבלה פעם אחת ולשלוף אותן מטבלה.
          - text: >-
              $-4J$, $-2J$, $0$, $2J$, $4J$
            feedback: >-
              זה סכום השכנים כפול $J$. כל קשר שמצבו משתנה עובר מ-$-J$ ל-$+J$ או להפך, שינוי של $2J$, ולכן $\Delta E_i = 2s_iJ\sum_j s_j$.
          - text: >-
              כל כפולה זוגית של $J$ מ-$-8J$ עד $8J$
            feedback: >-
              סכום השכנים של ארבעה ספינים הוא תמיד זוגי, ולכן $\Delta E$ הוא כפולה של $4J$: הערכים $\pm2J$ ו-$\pm6J$ אינם אפשריים.
          - text: >-
              $0$, $4J$, $8J$
            feedback: >-
              היפוך יכול גם להוריד את האנרגיה: היפוך של ספין שחולק על שכניו נותן $\Delta E = -4J$ או $-8J$, ומטרופוליס מקבל היפוכים כאלה בוודאות.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-15.1-2]
        prompt: >-
          באיזו הסתברות מקבל כלל גלאובר, $A = 1/\left(1 + e^{\Delta E/(k_BT)}\right)$, היפוך עם $\Delta E = 4J$?
        answer: 0.119
        unit: ''
        tolerance: 0.02
        correctFeedback: >-
          $1/(1 + e^{2}) = 0.119$, פחות מה-$e^{-2} = 0.135$ של מטרופוליס לאותו היפוך. גלאובר מקבל לעתים רחוקות יותר בכל $\Delta E$, ואפילו היפוך עם $\Delta E = 0$ הוא מקבל רק בחצי מהמקרים.
        wrongFeedback: >-
          המעריך הוא $\Delta E/(k_BT) = 4J/2J = 2$.
        commonWrong:
          - value: 0.135
            feedback: >-
              זו ההסתברות של מטרופוליס, $e^{-2}$. ההסתברות של גלאובר היא $1/(1 + e^{2})$.
          - value: 0.881
            feedback: >-
              זה $1/(1 + e^{-2})$, ההסתברות להיפוך ההפוך, $\Delta E = -4J$.
      - label: ג
        type: mc
        points: 4
        objectives: [OBJ-15.1-2]
        prompt: >-
          סטודנט מציע את $A' = \tfrac12\min\left(1, e^{-\Delta E/(k_BT)}\right)$, "ליתר ביטחון". מה עושה השרשרת?
        choices:
          - text: >-
              היא דוגמת את התפלגות בולצמן ב-$T$, ולשם כך היא צריכה בערך פי שניים יותר סריקות.
            correct: true
            feedback: >-
              נכון. איזון מפורט מגביל רק את היחס $A(\Delta E)/A(-\Delta E)$, והגורם $\tfrac12$ אינו משנה אותו. הקטנה בחצי של כל הסתברות קבלה מקטינה בחצי את הקצב של כל מהלך: היעד אותו יעד, והדרך ארוכה פי שניים.
          - text: >-
              היא דוגמת את התפלגות בולצמן בטמפרטורה $2T$.
            feedback: >-
              שינוי קנה המידה של הטמפרטורה דורש שינוי של המעריך, $e^{-\Delta E/(2k_BT)}$. גורם קבוע לפני הביטוי מצטמצם ביחס.
          - text: >-
              היא שוברת את האיזון המפורט: הסתברות הקבלה כבר אינה שווה לגורם בולצמן.
            feedback: >-
              איזון מפורט מעולם לא דרש שהסתברות הקבלה תהיה שווה לגורם בולצמן, אלא רק שהיחס בין הסתברויות הקבלה קדימה ואחורה יהיה שווה ליחס בין משקלי בולצמן. הגורם $\tfrac12$ מצטמצם מהיחס הזה.
          - text: >-
              היא מתארת מגנט עצל יותר, שהספינים שלו באמת מתהפכים בתדירות נמוכה פי שניים.
            feedback: >-
              השרשרת דוגמת את אותו שיווי משקל כמו מטרופוליס; רק מספר הסריקות משתנה, ושום קבוע לא ממיר סריקות לשניות. הכלל הוא בחירה של אלגוריתם, לא תכונה של החומר.
            misconception: MC-mc-is-real-dynamics
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-15.1-2]
        prompt: >-
          הראו שאיזון מפורט ביחס ל-$p_s \propto e^{-E_s/(k_BT)}$ מתקיים אם ורק אם $A(\Delta E)/A(-\Delta E) = e^{-\Delta E/(k_BT)}$ לכל $\Delta E$, והסבירו מדוע שלב ההצעה אינו מופיע. אמתו שמטרופוליס וגלאובר מקיימים את התנאי, והסבירו מדוע שום כלל אינו יכול להשתמש בקבוע $c > 1$ במקום ה-$\tfrac12$ של הסטודנט. אחר כך הראו, על ידי סכימת האיזון המפורט על פני הקונפיגורציה ההתחלתית, שהתפלגות בולצמן סטציונרית, והסבירו מדוע זה אינו אומר דבר על מספר הסריקות שהשרשרת צריכה. בדקו את שני הכללים בגבולות $T \to \infty$ ו-$T \to 0$.
        solution:
          - kind: law
            text: >-
              איזון מפורט, $p_s\,P(s \to s') = p_{s'}\,P(s' \to s)$, כאשר מהלך מוצע ואחר כך מתקבל: $P(s \to s') = g(s \to s')\,A(s \to s')$, עם $g = 1/N$ להיפוך של אחד מ-$N$ ספינים שנבחר באקראי.
          - kind: manipulation
            text: >-
              ההצעה סימטרית, $g(s \to s') = g(s' \to s)$, ולכן היא מצטמצמת, וכך גם $Z$: $A(s \to s')/A(s' \to s) = p_{s'}/p_s = e^{-\Delta E/(k_BT)}$. שינוי האנרגיה במהלך ההפוך הוא $-\Delta E$, ולכן התנאי הוא $A(\Delta E)/A(-\Delta E) = e^{-\Delta E/(k_BT)}$; ובכיוון ההפוך, אם הוא מתקיים לכל $\Delta E$, הוא מתקיים לכל זוג קונפיגורציות שהיפוך אחד מפריד ביניהן, וזה האיזון המפורט.
          - kind: manipulation
            text: >-
              מטרופוליס, עם $x = \Delta E/(k_BT) > 0$: $A(\Delta E) = e^{-x}$ ו-$A(-\Delta E) = 1$, יחס של $e^{-x}$; עבור $x \le 0$ התפקידים מתחלפים. גלאובר: $\dfrac{1/(1 + e^{x})}{1/(1 + e^{-x})} = \dfrac{1 + e^{-x}}{1 + e^{x}} = e^{-x}$. גורם $c$ לפני הביטוי מצטמצם מהיחס, אבל $c\min(1, e^{-x}) = c$ בכל מהלך שמוריד את האנרגיה, ו-$c > 1$ אינו הסתברות: $c \le 1$ מותר, ו-$c$ קטן יותר רק איטי יותר.
          - kind: manipulation
            text: >-
              סכימת האיזון המפורט על $s$ נותנת $\sum_s p_s P(s \to s') = p_{s'}\sum_s P(s' \to s) = p_{s'}$, כי מ-$s'$ השרשרת חייבת ללכת לאנשהו (כולל להישאר במקום). כלומר צעד אחד מעביר את $p$ לעצמה. זה קובע לאן השרשרת מגיעה, ולא כמה מהר: קצב ההתקרבות נקבע על ידי שאר מטריצת המעבר, שהיא שונה במטרופוליס, בגלאובר וב-$A'$, אף ששלושתם חולקים את אותה $p$ סטציונרית.
          - kind: formula
            text: >-
              $\dfrac{A(\Delta E)}{A(-\Delta E)} = e^{-\Delta E/(k_BT)}, \qquad \sum_s p_s\,P(s \to s') = p_{s'}$
          - kind: limit
            text: >-
              $T \to \infty$: היחס שואף ל-$1$ והתפלגות בולצמן נעשית אחידה; מטרופוליס מקבל כל מהלך ($A \to 1$), גלאובר מחצית מהם ($A \to \tfrac12$), ושניהם הילוכים אקראיים אחידים על פני הקונפיגורציות, כמו שצריך. $T \to 0$: מהלכים שמעלים את האנרגיה לעולם אינם מתקבלים, ומהלכים שמורידים אותה מתקבלים תמיד במטרופוליס וכמעט תמיד בגלאובר, ולכן השרשרת יורדת אל מצב יסוד.
          - kind: units
            text: >-
              $\Delta E$ ו-$k_BT$ שניהם אנרגיות ביחידות של $J$; $A$ וכל היחסים הם מספרים טהורים.
          - kind: substitution
            text: >-
              ב-$k_BT = 2J$: מטרופוליס מקבל $1$, $1$, $1$, $e^{-2} = 0.135$, $e^{-4} = 0.018$ עבור $\Delta E = -8J$, $-4J$, $0$, $4J$, $8J$; גלאובר $0.982$, $0.881$, $0.5$, $0.119$, $0.018$. מטרופוליס מקבל לעתים קרובות יותר, וזה הופך אותו למהיר יותר, לא לנכון יותר.
          - kind: result
            text: >-
              איזון מפורט הוא תנאי היחס $A(\Delta E)/A(-\Delta E) = e^{-\Delta E/(k_BT)}$, כי ההצעה הסימטרית מצטמצמת. מטרופוליס וגלאובר מקיימים אותו; $c > 1$ היה גורם להסתברות לעלות על $1$. סכימת האיזון המפורט מראה שהתפלגות בולצמן סטציונרית, וזה קובע את היעד של השרשרת ואינו אומר דבר על המהירות שלה.
        rubric:
          - text: >-
              הראיה שההצעה הסימטרית (ו-$Z$) מצטמצמת ומשאירה את תנאי היחס, בשני הכיוונים של "אם ורק אם".
            weight: 2
          - text: >-
              אימות התנאי גם למטרופוליס וגם לגלאובר.
          - text: >-
              הסבר ש-$c > 1$ נותן הסתברות קבלה גדולה מ-$1$ במהלכים שמורידים את האנרגיה.
          - text: >-
              גזירת הסטציונריות בסכימה על $s$, וקביעה שהיא קובעת את היעד ולא את המהירות.
            weight: 2
          - text: >-
              בדיקת גבולות: $T \to \infty$ (מטרופוליס $\to 1$, גלאובר $\to \tfrac12$) או $T \to 0$.

  - id: Q-15-bagrut-2
    type: bagrut
    title: >-
      קירות תחום בממד אחד ובשני ממדים
    prompt: >-
      שרשרת פתוחה של $N$ ספינים ב-$h = 0$ מכוונת כולה כלפי מעלה. הכנסת קיר תחום אחד עולה $\Delta E = 2J$ ומרוויחה אנטרופיה $\Delta S \approx k_B\ln N$, ולכן הקיר מוריד את האנרגיה החופשית ברגע ש-$N > e^{2J/(k_BT)}$. האנרגיה המדויקת לספין של השרשרת האינסופית היא $E/(NJ) = -\tanh\left(J/(k_BT)\right)$.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-15.1-3]
        prompt: >-
          חשבו את אורך הסף $N = e^{2J/(k_BT)}$ ב-$k_BT = 0.5\,J$.
        answer: 54.6
        unit: ''
        tolerance: 0.03
        correctFeedback: >-
          $e^{2/0.5} = e^4 = 54.6$: שרשרת ארוכה מכ-$55$ ספינים זולה יותר עם קיר מאשר בלעדיו.
        wrongFeedback: >-
          המעריך הוא $2J/(k_BT) = 2/0.5 = 4$.
        commonWrong:
          - value: 7.39
            feedback: >-
              זה $e^{2}$, כאילו הקיר עולה $J$. שבירת קשר אחד מעבירה אותו מ-$-J$ ל-$+J$: $2J$.
          - value: 77.2
            feedback: >-
              זה הסף לזוג קירות בטבעת, $\sqrt2\,e^{2J/(k_BT)}$. בשרשרת פתוחה מספיק קיר אחד.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-15.1-3]
        prompt: >-
          חשבו את אותו סף ב-$k_BT = 0.2\,J$.
        answer: 2.20e4
        unit: ''
        tolerance: 0.03
        correctFeedback: >-
          $e^{10} = 2.20\cdot10^4$. הקירור מגדיל את הסף מאוד, אבל הוא נשאר סופי: בכל $T > 0$ יש קירות בשרשרת ארוכה מספיק.
        wrongFeedback: >-
          המעריך הוא $2J/(k_BT) = 2/0.2 = 10$.
        commonWrong:
          - value: 148
            feedback: >-
              זה $e^{5}$: המעריך הוא $2J/(k_BT) = 10$, לא $J/(k_BT)$.
      - label: ג
        type: numeric
        points: 4
        objectives: [OBJ-15.1-3]
        prompt: >-
          חלק $n_w$ מהקשרים של השרשרת האינסופית הם קירות, ולכן $E/(NJ) = -(1 - n_w) + n_w = -(1 - 2n_w)$. מצאו את $n_w$ ב-$k_BT = 0.5\,J$.
        answer: 0.0180
        unit: ''
        tolerance: 0.03
        correctFeedback: >-
          $n_w = \left(1 - \tanh 2\right)/2 = (1 - 0.9640)/2 = 0.0180$: קיר כל $1/n_w = 55.6$ קשרים. מכיוון ש-$1 - \tanh x = 2/(1 + e^{2x})$, במדויק $1/n_w = 1 + e^{2J/(k_BT)}$: אורכם של הקטעים המסודרים הוא אורך השרשרת שבו, לפי סעיף א', קיר כבר משתלם.
        wrongFeedback: >-
          פתרו את $-\tanh(J/k_BT) = -(1 - 2n_w)$ עבור $n_w$.
        commonWrong:
          - value: 0.0360
            feedback: >-
              זה $1 - \tanh 2$, פי שניים מ-$n_w$: כל קיר הופך קשר מ-$-J$ ל-$+J$, שינוי של $2J$, ומכאן הגורם $\tfrac12$.
          - value: 0.964
            feedback: >-
              זה $\tanh 2$, מינוס האנרגיה לספין. חלק הקירות הוא מה שחסר לסדר מושלם.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-15.1-3]
        prompt: >-
          עכשיו הסריג הריבועי $L \times L$. תחום של ספינים הפוכים המוקף בקיר סגור של $\ell$ קשרים עולה $2J\ell$, ומספר הקירות הסגורים באורך $\ell$ שעוברים דרך קשר נתון הוא לכל היותר $3^\ell$. הראו שהאנרגיה החופשית של קירות כאלה חיובית לכל $\ell$ כאשר $k_BT < 2J/\ln 3$; חשבו את הטמפרטורה הזו והשוו אותה ל-$T_c$ של אונסאגר. הסבירו מה הטיעון הזה, כטיעון של אנרגיה חופשית, מבסס ומה אינו מבסס לגבי סדר בשני ממדים, ומדוע אי אפשר לחזור עליו בממד אחד. בדקו את התוצאה במקרה גבולי.
        solution:
          - kind: law
            text: >-
              $\Delta F = \Delta E - T\Delta S$. קיר של $\ell$ קשרים שבורים עולה $\Delta E = 2J\ell$; עם $3^\ell$ צורות לכל היותר, האנטרופיה שלו היא לכל היותר $\Delta S = k_B\ln 3^\ell = \ell\,k_B\ln 3$.
          - kind: manipulation
            text: >-
              $\Delta F \ge 2J\ell - k_BT\,\ell\ln 3 = \ell\left(2J - k_BT\ln 3\right)$. האנרגיה והאנטרופיה גדלות שתיהן ביחס ישר ל-$\ell$, ולכן הסימן נקבע על ידי הסוגריים, והוא זהה לקירות בכל אורך: עבור $k_BT < 2J/\ln 3$ אף קיר, ארוך ככל שיהיה, אינו משתלם. בממד אחד הקיר הוא קשר יחיד, יהיה אורך השרשרת אשר יהיה, ולכן האנרגיה שלו קבועה, $2J$, בעוד האנטרופיה שלו, $k_B\ln N$, גדלה עם המערכת: שום טמפרטורה אינה הופכת את $\Delta F$ לחיובי לכל $N$.
          - kind: formula
            text: >-
              $\Delta F \ge \ell\left(2J - k_BT\ln 3\right) > 0 \qquad \left(k_BT < \dfrac{2J}{\ln 3}\right)$
          - kind: limit
            text: >-
              כש-$T \to 0$ הסוגריים שואפים ל-$2J > 0$ והקירות מדוכאים: מצב היסוד המסודר. בממד אחד הסף $e^{2J/(k_BT)}$ של סעיפים א' וב' גדל בלי גבול כש-$T \to 0$, אבל הוא סופי בכל $T > 0$: הסדר שורד רק ב-$T = 0$ בדיוק.
          - kind: units
            text: >-
              $2J/\ln 3$ היא אנרגיה, שמצוטטת ביחידות של $J$ כ-$k_BT$; $\ell$ הוא מספר קשרים.
          - kind: substitution
            text: >-
              $2/\ln 3 = 2/1.099 = 1.82$, ולכן הקירות אינם יכולים לנצח מתחת ל-$k_BT = 1.82\,J$, כ-$20\%$ מתחת ל-$2.269\,J$ של אונסאגר.
          - kind: result
            text: >-
              מתחת ל-$k_BT = 1.82\,J$ כל קיר עולה יותר אנרגיה חופשית ממה שהוא מרוויח, בהתאמה לכך ש-$T_c = 2.269\,J$ של אונסאגר נמצא מעל. החסם סופר קירות בנדיבות ($3^\ell$ סופר מסלולים סגורים ביתר). כהערכה של האנרגיה החופשית זהו טיעון היוריסטי: הוא מראה ששום דבר דומה לאסון החד-ממדי אינו אוסר סדר. כשמנסחים אותו בקפדנות (פיירלס; גריפיתס ודוברושין), אותה ספירה מוכיחה שהסריג מסתדר ב-$T$ נמוכה מספיק; ה-$T_c$ האמיתי גבוה מהחסם. בממד אחד האנרגיה של הקיר אינה גדלה עם המערכת והאנטרופיה שלו כן, ולכן הטיעון נכשל בכל $T > 0$.
        rubric:
          - text: >-
              $\Delta F \ge \ell(2J - k_BT\ln 3)$, עם ההבחנה ששני האיברים גדלים כמו $\ell$.
            weight: 2
          - text: >-
              $k_BT = 2J/\ln 3 = 1.82\,J$, מתחת ל-$2.269\,J$ של אונסאגר.
          - text: >-
              הסבר שחסם האנרגיה החופשית הוא טיעון היוריסטי (אין אסון שאוסר סדר), ושאותה ספירה, כשמנסחים אותה בקפדנות, מוכיחה סדר ב-$T$ נמוכה מספיק.
            weight: 2
          - text: >-
              הסבר מדוע ממד אחד שונה: אנרגיית קיר קבועה, אנטרופיה שגדלה עם $N$.
          - text: >-
              בדיקת גבולות, למשל $T \to 0$.

