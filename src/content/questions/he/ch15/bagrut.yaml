      - label: ג
        type: numeric
        points: 4
        objectives: [OBJ-15.1-4]
        prompt: >-
          מצאו את המגנוט הספונטני המדויק ב-$k_BT = 1.5\,J$, בדיוק של שלוש ספרות אחרי הנקודה העשרונית.
        answer: 0.9865
        unit: ''
        tolerance: 0.002
        correctFeedback: >-
          $\sinh(2/1.5) = 1.765$, $\sinh^{-4} = 0.1030$, ו-$0.8970^{1/8} = 0.9865$. השדה הממוצע נותן כאן $0.990$, גבוה רק ב-$0.3\%$.
        wrongFeedback: >-
          חשבו את $\left[1 - \sinh^{-4}(2J/k_BT)\right]^{1/8}$ עם $2J/(k_BT) = 1.333$.
        commonWrong:
          - value: 0.990
            feedback: >-
              זה הערך של השדה הממוצע, מתוך $m = \tanh(4m/1.5)$. השאלה מבקשת את הערך של אונסאגר ויאנג.
            misconception: MC-mean-field-harmless
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-15.1-4]
        prompt: >-
          גזרו את משוואת השדה הממוצע, הראו שב-$h = 0$ יש לה פתרונות שונים מאפס רק מתחת ל-$k_BT_c^\text{MF} = qJ$, וגזרו את $m_0 \approx \sqrt{3(1 - T/T_c^\text{MF})}$; ציינו את המעריך $\beta$ של השדה הממוצע ואת המעריך המדויק. מעל $T_c^\text{MF}$, פתחו לסדר ראשון ב-$h$ הקטן כדי למצוא את הסוספטיביליות $\chi = \partial m/\partial h$, וציינו את $\gamma$ של השדה הממוצע מול ה-$7/4$ המדויק. ב-$k_BT = 2.0\,J$ השדה הממוצע נותן $m_0 = 0.958$ ואונסאגר ויאנג $0.911$; הסבירו מדוע השדה הממוצע מצליח יותר ב-$1.5\,J$, סעיף ג'. מה השדה הממוצע חוזה לשרשרת, ומה האמת? בדקו את התוצאות במקרים גבוליים.
        solution:
          - kind: law
            text: >-
              ספין בודד בשדה: $\langle s\rangle = \tanh\left(h_\text{eff}/(k_BT)\right)$. ספין $i$ מרגיש $h_\text{eff} = J\sum_{j \in \text{nn}(i)} s_j + h$.
          - kind: manipulation
            text: >-
              השדה הממוצע מחליף כל $s_j$ ב-$\langle s_j\rangle = m$, ומשליך את המתאמים בין ספין $i$ לשכניו: $h_\text{eff} = qJm + h$, והעקביות דורשת $m = \tanh\left((qJm + h)/(k_BT)\right)$. ב-$h = 0$ הפתרון $m = 0$ קיים תמיד; לאגף ימין יש שיפוע $qJ/(k_BT)$ בראשית והוא מגיע לרוויה ב-$\pm1$, ולכן הוא חוצה שוב את הישר $m$ בדיוק כשהשיפוע הזה גדול מ-$1$: $k_BT < qJ$.
          - kind: manipulation
            text: >-
              מתחת ל-$T_c^\text{MF}$, עם $\tanh x \approx x - x^3/3$ ו-$x = mT_c^\text{MF}/T$: $1 = T_c^\text{MF}/T - m^2(T_c^\text{MF}/T)^3/3$, ולכן $m^2 = 3T^2(T_c^\text{MF} - T)/(T_c^\text{MF})^3 \approx 3(1 - T/T_c^\text{MF})$ ליד $T_c^\text{MF}$: $\beta = 1/2$, מול $1/8$ המדויק. מעליו, עבור $h$ קטן, $m \approx (qJm + h)/(k_BT)$, ולכן $m = h/(k_BT - qJ)$ ו-$\chi = 1/\left(k_B(T - T_c^\text{MF})\right)$, חוק קירי–וייס: $\gamma = 1$, מול $7/4$ המדויק.
          - kind: formula
            text: >-
              $m = \tanh\dfrac{qJm + h}{k_BT}, \quad k_BT_c^\text{MF} = qJ, \quad m_0 \approx \sqrt{3\left(1 - \dfrac{T}{T_c^\text{MF}}\right)}, \quad \chi = \dfrac{1}{k_B\left(T - T_c^\text{MF}\right)}$
          - kind: limit
            text: >-
              $T \to 0$: $m = \tanh(\infty) = 1$, מצב היסוד, שהשדה הממוצע נותן במדויק, כי בסריג מיושר לגמרי אין פלוקטואציות, ולכן אין מה להזניח; זו הסיבה שהוא מצליח יותר ב-$1.5\,J$ מאשר ב-$2.0\,J$, וגרוע ביותר ליד $T_c$, שם המתאמים המוזנחים גדולים ביותר. $T \to T_c^\text{MF}$ מלמטה: $m_0 \to 0$ ברציפות. $T \to \infty$: $\chi \to 1/(k_BT)$, חוק קירי של ספינים חופשיים, כשהצימוד נעשה זניח.
          - kind: units
            text: >-
              $qJm/(k_BT)$ הוא מספר טהור; $\chi = \partial m/\partial h$ ביחידות של $1/J$.
          - kind: substitution
            text: >-
              ב-$1.5\,J$: $0.990$ מול $0.987$, גבוה ב-$0.3\%$; ב-$2.0\,J$: $0.958$ מול $0.911$, גבוה ב-$5\%$; ב-$T_c$: $4J$ מול $2.269\,J$, גבוה ב-$76\%$. לשרשרת, $q = 2$ נותן $k_BT_c^\text{MF} = 2J$, בעוד לשרשרת המדויקת אין מעבר בשום $T > 0$.
          - kind: result
            text: >-
              לפי $m = \tanh\left((qJm + h)/(k_BT)\right)$ הסריג מסתדר מתחת ל-$k_BT_c^\text{MF} = qJ$, עם $\beta = 1/2$ ו-$\gamma = 1$; לסריג הריבועי $\beta = 1/8$ ו-$\gamma = 7/4$, וה-$T_c$ של השדה הממוצע גבוה מדי ב-$76\%$. השדה הממוצע טוב במקום שבו הסריג כמעט רווי, רע ליד $T_c$, ולשרשרת הוא חוזה מעבר ב-$2J$ שאינו קיים.
        rubric:
          - text: >-
              גזירת משוואת השדה הממוצע, עם שם הקירוב (השכנים מוחלפים בממוצע שלהם, המתאמים מוזנחים).
            weight: 2
          - text: >-
              $k_BT_c^\text{MF} = qJ$ מתוך השיפוע בראשית.
          - text: >-
              $m_0 \approx \sqrt{3(1 - T/T_c^\text{MF})}$: $\beta = 1/2$ מול $1/8$ המדויק.
          - text: >-
              חוק קירי–וייס $\chi = 1/(k_B(T - T_c^\text{MF}))$: $\gamma = 1$ מול $7/4$.
            weight: 2
          - text: >-
              הסבר מדוע השדה הממוצע טוב יותר ב-$T$ נמוכה, וציון המעבר המדומה שהוא חוזה לשרשרת.
          - text: >-
              בדיקת גבולות: $T \to 0$, $T \to T_c^\text{MF}$ או $T \to \infty$.

  - id: Q-15-bagrut-4
    type: bagrut
    title: >-
      איתור ⁦T_c⁩ משיא הסוספטיביליות
    prompt: >-
      ההרצות של ThermoLab (ארבעה זרעים לכל גודל, אלפי סריקות לכל טמפרטורה) ממקמות את השיא של $\chi' = N\,\text{Var}(|m|)/(k_BT)$ ב-$k_BT = 2.503$, $2.416$, $2.329$ ו-$2.311\,J$ עבור $L = 8$, $16$, $32$ ו-$64$. סקיילינג בגודל סופי מנבא ש-$T_\text{peak}(L) = T_c + a\,L^{-1/\nu}$ ושגובה השיאים גדל כמו $L^{\gamma/\nu}$; לסריג הריבועי $\nu = 1$ ו-$\gamma/\nu = 7/4$.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-15.1-5]
        prompt: >-
          הרצה על סריג $32 \times 32$ ב-$k_BT = 2.33\,J$ נותנת עקבה של $|m|$ עם $\text{Var}(|m|) = 0.045$. מצאו את $\chi'$, ביחידות של $1/J$.
        answer: 19.8
        unit: 1/J
        tolerance: 0.03
        correctFeedback: >-
          $\chi' = 1024 \cdot 0.045/2.33 = 19.8/J$, בראש השיא של $L = 32$.
        wrongFeedback: >-
          בסריג יש $N = L^2$ ספינים, והזהות מחלקת ב-$k_BT$ פעם אחת.
        commonWrong:
          - value: 0.618
            feedback: >-
              השתמשתם ב-$N = 32$, אורך הצלע. בסריג יש $32^2 = 1024$ ספינים.
          - value: 8.49
            feedback: >-
              כאן חילקתם ב-$(k_BT)^2$, כמו בקיבול החום. הסוספטיביליות מחלקת ב-$k_BT$ פעם אחת.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-15.1-5]
        prompt: >-
          בצעו אקסטרפולציה ליניארית ב-$1/L$ דרך השיאים של $L = 32$ ו-$L = 64$ בלבד. מהו $k_BT_c$, ביחידות של $J$?
        answer: 2.293
        unit: J
        tolerance: 0.003
        correctFeedback: >-
          המעבר מ-$1/L = 1/32$ ל-$1/64$ הזיז את השיא כלפי מטה ב-$0.018$; הצעד הנותר, באותו גודל, מ-$1/64$ ל-$0$, מזיז אותו ב-$0.018$ נוספים: $T_c = 2T_{64} - T_{32} = 2.293$. זה $1\%$ מעל $2.269$ של אונסאגר; סעיף ד' שואל מדוע הזוג הזה מצליח פחות מ-$L = 16$ ו-$64$, שנותנים $2.276$.
        wrongFeedback: >-
          לישר שעובר דרך $(1/32,\ 2.329)$ ו-$(1/64,\ 2.311)$ יש שיפוע $a = 1.152$; נקודת החיתוך שלו ב-$1/L = 0$ היא $T_c$.
        commonWrong:
          - value: 2.311
            feedback: >-
              זה השיא של $L = 64$ עצמו, שעדיין נמצא $a/64$ מעל $T_c$.
          - value: 2.305
            feedback: >-
              זו אקסטרפולציה ב-$1/L^2$, שמניחה $\nu = 1/2$. לסריג הריבועי $\nu = 1$: ליניארית ב-$1/L$.
      - label: ג
        type: numeric
        points: 4
        objectives: [OBJ-15.1-5, OBJ-15.1-6]
        prompt: >-
          פי כמה צריך גובה השיא של $\chi'$ לגדול מ-$L = 16$ ל-$L = 64$, אם הגבהים גדלים כמו $L^{7/4}$?
        answer: 11.3
        unit: ''
        tolerance: 0.03
        correctFeedback: >-
          $4^{7/4} = 11.3$. בסריג אינסופי השיא הוא התבדרות; בסריגים סופיים הוא גדל בלי גבול ככל ש-$L$ גדל, אבל הוא סופי בכל $L$.
        wrongFeedback: >-
          היחס הוא $(64/16)^{7/4}$.
        commonWrong:
          - value: 4
            feedback: >-
              זה גידול ביחס ישר ל-$L$. המעריך הוא $\gamma/\nu = 7/4$.
          - value: 16
            feedback: >-
              זה גידול ביחס ישר ל-$N = L^2$. המעריך הוא $7/4$, קצת פחות מ-$2$.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-15.1-5, OBJ-15.1-6]
        prompt: >-
          חבר לכיתה מתאים את מיקומי השיאים כנגד $1/L^2$ במקום כנגד $1/L$ ומקבל $2.304$ עד $2.305\,J/k_B$. הסבירו מה מניח המעריך של ההתאמה ומדוע $1/L$ היא הבחירה הנכונה לסריג הריבועי; מדוע הזוג $L = 32$, $64$ של סעיף ב' הוא מנוף חלש יותר מ-$L = 16$, $64$; אילו מסקנות אינן תלויות במעריך; ומה השיאים יכולים ואינם יכולים לבסס על הסריג האינסופי. בדקו את חוקי הסקיילינג בגבול $L \to \infty$.
        solution:
          - kind: law
            text: >-
              סקיילינג בגודל סופי: בסריג שצלעו $L$ אורך המתאם אינו יכול לעלות על $L$, ולכן השיא מעוגל ומוזז, $T_\text{peak} - T_c \propto L^{-1/\nu}$, והגובה שלו גדל כמו $L^{\gamma/\nu}$.
          - kind: manipulation
            text: >-
              המעריך של ההתאמה הוא $1/\nu$. התאמה כנגד $1/L^2$ מניחה $\nu = 1/2$, הערך של השדה הממוצע; הפתרון של אונסאגר נותן $\nu = 1$ לסריג הריבועי, ומכאן $1/L$. עם המעריך השגוי האקסטרפולציה מסירה מעט מדי מההזזה ונעצרת $0.035$ מעל $T_c$.
          - kind: manipulation
            text: >-
              שתי נקודות ב-$1/L$ נותנות $T_c = 2T_{64} - T_{32}$ מ-$L = 32$, $64$, אבל $T_c = (4T_{64} - T_{16})/3$ מ-$L = 16$, $64$. שגיאה $\delta$ בכל שיא הופכת ל-$\sqrt5\,\delta = 2.2\,\delta$ בנקודת החיתוך הראשונה ול-$\sqrt{17}\,\delta/3 = 1.4\,\delta$ בשנייה: זרוע המנוף הקצרה מגבירה את השגיאות, והנקודה של $L = 64$, שבה ההאטה הקריטית חמורה ביותר ($\tau = 174 \pm 38$ סריקות ב-$T_c$), היא הפחות ודאית מכולן.
          - kind: manipulation
            text: >-
              מה שאינו תלוי במעריך: כל השיאים נמצאים מעל $T_c$ של אונסאגר ונודדים כלפי מטה באופן מונוטוני ככל ש-$L$ גדל, ולכן $T_c < 2.311\,J/k_B$; והשיאים נעשים גבוהים וצרים יותר עם $L$. זה מה שסינגולריות ב-$N \to \infty$ הייתה מייצרת. מה שהשיאים אינם יכולים לעשות הוא להראות את הסינגולריות עצמה: לכל סריג סופי יש אנרגיה חופשית אנליטית ושיא סופי; הסינגולריות היא טענה על הגבול, ומבססת אותה הגזירה של אונסאגר.
          - kind: formula
            text: >-
              $T_c \approx 2T_{64} - T_{32}, \qquad T_c \approx \tfrac13\left(4T_{64} - T_{16}\right)$
          - kind: limit
            text: >-
              כש-$L \to \infty$ ההזזה $a\,L^{-1/\nu} \to 0$, ולכן מיקום השיא שואף ל-$T_c$, והגובה $\propto L^{7/4} \to \infty$: ההתבדרות של $\chi$, שמושגת רק בגבול. ב-$L$ קטן ההזזה גדולה ($0.23$ מעל $T_c$ ב-$L = 8$) והתיקונים לסקיילינג חשובים, ולכן $L = 8$ נשאר מחוץ להתאמה.
          - kind: units
            text: >-
              מיקומי השיאים ו-$T_c$ ביחידות של $J/k_B$; $a$ ביחידות של $J/k_B$ כפול מרווחי סריג; הגבהים ביחידות של $1/J$.
          - kind: substitution
            text: >-
              $1/L$: $2 \cdot 2.311 - 2.329 = 2.293$ ו-$(4 \cdot 2.311 - 2.416)/3 = 2.276$; $1/L^2$: $2.304$ עד $2.305$; אונסאגר $2.269$. עם $\delta = 0.005$ לכל שיא, שתי נקודות החיתוך של $1/L$ נושאות בערך $\pm0.011$ ו-$\pm0.007$: $2.276$ נמצאת בטווח של אי-ודאות אחת מ-$2.269$, ו-$2.293$ במרחק של כשתיים, תוצאה גבולית; נקודות החיתוך של $1/L^2$, במרחק של חמש עד שבע אי-ודאויות, נשללות.
          - kind: result
            text: >-
              המעריך של ההתאמה הוא $1/\nu$, ו-$\nu = 1$ הופך את $1/L$ לבחירה הנכונה; $1/L^2$ מניח את $\nu = 1/2$ של השדה הממוצע ומחטיא את $T_c$ ב-$0.035$. לזוג $32$, $64$ יש זרוע המנוף הקצרה ביותר והנקודה הרועשת ביותר. יהיה המעריך אשר יהיה, השיאים נמצאים מעל $T_c$, נודדים לכיוונו וגדלים עם $L$: מגמה שמתיישבת עם סינגולריות בסביבות $2.27\,J/k_B$, שהסימולציה תומכת בה והפתרון של אונסאגר מבסס אותה.
        rubric:
          - text: >-
              המעריך של ההתאמה הוא $1/\nu$: $1/L$ עבור $\nu = 1$, בעוד $1/L^2$ מניח את $\nu = 1/2$ של השדה הממוצע.
            weight: 2
          - text: >-
              הסבר מדוע $L = 32$, $64$ הוא המנוף החלש יותר (זרוע קצרה, הגברת שגיאות, ה-$\tau$ הגדול ביותר ב-$L = 64$).
            weight: 2
          - text: >-
              ציון מסקנות שאינן תלויות במעריך (שיאים מעל $T_c$, נודדים כלפי מטה, גדלים).
          - text: >-
              קביעה מה השיאים יכולים ואינם יכולים לבסס על הסינגולריות.
            weight: 2
          - text: >-
              בדיקת גבולות: כש-$L \to \infty$ ההזזה נעלמת והגובה מתבדר.

  - id: Q-15-bagrut-5
    type: bagrut
    title: >-
      מדידת מעריך, ומדוע התשובה מוטה
    prompt: >-
      סריג $32 \times 32$ מורץ במטרופוליס ב-$k_BT = 1.8$, $2.0$, $2.2$ ו-$2.25\,J$: בכל טמפרטורה $64$ הרצות בלתי תלויות (בזרעים שונים), כל אחת של $2\cdot10^4$ סריקות אחרי $5000$ סריקות של שלב חימום. הממוצעים על ההרצות הם $\langle|m|\rangle = 0.957$, $0.911$, $0.785$ ו-$0.699$, עם שגיאות תקן מזרע לזרע (סטיית התקן של $64$ הממוצעים של ההרצות, חלקי $\sqrt{64}$) של $0.00002$, $0.00006$, $0.0006$ ו-$0.0011$. הערכים המדויקים של אונסאגר ויאנג הם $0.957$, $0.911$, $0.785$ ו-$0.672$. קחו $k_BT_c = 2.2692\,J$. המעריך האפקטיבי בין שתי טמפרטורות $T_1 < T_2$ הוא $\beta_\text{eff} = \ln(m_2/m_1)/\ln\left((T_c - T_2)/(T_c - T_1)\right)$.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-15.1-6]
        prompt: >-
          מצאו את $\beta_\text{eff}$ משתי הטמפרטורות הרחוקות ביותר מ-$T_c$, $1.8$ ו-$2.0\,J$.
        answer: 0.0887
        unit: ''
        tolerance: 0.05
        correctFeedback: >-
          $\ln(0.911/0.957)/\ln(0.269/0.469) = (-0.0493)/(-0.556) = 0.089$, הרבה מתחת ל-$1/8$ המדויק.
        wrongFeedback: >-
          $T_c - T$ הוא $0.469$ ו-$0.269$; חלקו את הלוגריתם של היחס בין המגנוטים בלוגריתם של היחס בין המרחקים.
        commonWrong:
          - value: 11.3
            feedback: >-
              זה ההופכי: המעריך הוא $\ln(m_2/m_1)$ חלקי ה-$\ln$ של היחס בין המרחקים מ-$T_c$.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-15.1-6]
        prompt: >-
          מצאו את $\beta_\text{eff}$ משני הערכים המסומלצים הקרובים ביותר ל-$T_c$, ב-$2.2$ וב-$2.25\,J$.
        answer: 0.0905
        unit: ''
        tolerance: 0.05
        correctFeedback: >-
          $\ln(0.699/0.785)/\ln(0.0192/0.0692) = (-0.116)/(-1.282) = 0.091$, גם הוא מתחת ל-$1/8$; שגיאות התקן מזרע לזרע נותנות לו אי-ודאות של $\pm0.0014$ בלבד. הערכים המדויקים באותן שתי טמפרטורות נותנים $0.121$.
        wrongFeedback: >-
          $T_c - T$ הוא $0.0692$ ו-$0.0192$; השתמשו בערכים המסומלצים $0.785$ ו-$0.699$.
        commonWrong:
          - value: 0.121
            feedback: >-
              כאן השתמשתם בערך המדויק $0.672$ ב-$2.25\,J$. השאלה מבקשת את מה שהסימולציה נותנת, $0.699$.
      - label: ג
        type: numeric
        points: 4
        objectives: [OBJ-15.1-7]
        prompt: >-
          כל הרצה ב-$2.25\,J$ רושמת $n = 20\,000$ דגימות של $|m|$. בממוצע על $64$ ההרצות, לדגימות של הרצה יש סטיית תקן $\sigma = 0.154$ וזמן מתאם עצמי $\tau = 39$ סריקות (הרצות בודדות נותנות כל ערך בין $22$ ל-$72$). עם הערכים האלה, מהי שגיאת התקן הכנה של ה-$\langle|m|\rangle$ של הרצה אחת?
        answer: 0.0096
        unit: ''
        tolerance: 0.03
        correctFeedback: >-
          $N_\text{eff} = 20\,000/78 = 256$, ולכן $\sigma/\sqrt{N_\text{eff}} = 0.154/16.0 = 0.0096$, ו-$64$ הממוצעים של ההרצות אכן מתפזרים בערך בשיעור הזה (סטיית התקן שלהם היא $0.0087$). ה-$0.154/\sqrt{20\,000} = 0.0011$ הנאיבי קטן מדי פי $\sqrt{78} = 8.8$.
        wrongFeedback: >-
          $N_\text{eff} = n/(2\tau)$, ושגיאת התקן היא $\sigma/\sqrt{N_\text{eff}}$.
        commonWrong:
          - value: 0.00109
            feedback: >-
              זה ה-$\sigma/\sqrt n$ הנאיבי, שמתייחס ל-$20\,000$ דגימות מתואמות כאילו היו בלתי תלויות. ליד $T_c$ הן שוות רק $256$.
            misconception: MC-naive-error-bar
          - value: 0.0068
            feedback: >-
              כאן השתמשתם ב-$N_\text{eff} = n/\tau$; הגורם הוא $2\tau$.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-15.1-6, OBJ-15.1-7]
        prompt: >-
          שני המעריכים האפקטיביים נמוכים מ-$1/8$ המדויק, מסיבות שונות. ציינו את ההטיה ששולטת רחוק מ-$T_c$ ואת זו ששולטת קרוב אליו, והשתמשו בערכים המדויקים כדי להבחין ביניהן. האם העודף של הנקודה ב-$2.25\,J$ מעל $0.672$ המדויק הוא פלוקטואציה סטטיסטית? שפטו אותו בעזרת שגיאת התקן מזרע לזרע, ואחר כך כאילו הייתה בידיכם הרצה אחת בלבד, עם השגיאה הכנה שלה מסעיף (ג), ואמרו באיזה משני השיפוטים לבטוח. מה הייתם משנים כדי למדוד את $\beta$ טוב יותר, ואיך הייתם בודקים את התוצאה? בדקו את הנימוק שלכם במקרים גבוליים.
        solution:
          - kind: law
            text: >-
              $m_0 \propto (T_c - T)^\beta$ מתקיים רק אסימפטוטית, כש-$T \to T_c$, ורק לסריג האינסופי; בסריג שצלעו $L$ אורך המתאם מוגבל ל-$L$, וליד $T_c$ זמן המתאם העצמי, ואיתו השגיאה הכנה של הרצה אחת, גדולים ביותר.
          - kind: manipulation
            text: >-
              רחוק מ-$T_c$ הסימולציה מסכימה עם הערכים המדויקים בכל הספרות שצוטטו, והערכים המדויקים עצמם נותנים אותו $\beta_\text{eff}$ בין $1.8$ ל-$2.0\,J$, $0.088$ כשמחשבים עם יותר ספרות: ההטיה היא בחוק, לא בהרצה. המגנוט מגיע לרוויה ומתקרב ל-$1$ כש-$T$ יורדת, ולכן חוק חזקה טהור עם מקדם קבוע אינו מתאר אותו שם (תיקונים לסקיילינג).
          - kind: manipulation
            text: >-
              קרוב ל-$T_c$ הערכים המדויקים נותנים $0.121$, כמעט $1/8$. הנקודה המסומלצת ב-$2.2\,J$ מסכימה עם $0.785$ המדויק, אבל הנקודה ב-$2.25\,J$ גבוהה מדי ב-$0.699 - 0.672 = 0.027$, כ-$25$ שגיאות תקן מזרע לזרע: לא פלוקטואציה אלא אפקט שיטתי של גודל סופי. כש-$\xi$ מתקרב ל-$L$, הסריג הסופי מסודר יותר מהסריג האינסופי (ה-$|m|$ של סריג סופי לעולם אינו יורד לאפס), וזה משטיח את העקומה ומוריד את $\beta_\text{eff}$ ל-$0.091 \pm 0.0014$.
          - kind: manipulation
            text: >-
              הרצה אחת לא הייתה יכולה להכריע בזה. השגיאה הכנה שלה, מסעיף (ג), היא $0.0096$, שלפיה העודף קטן מ-$3$ שגיאות תקן; והשגיאה הזו נשענת על ההערכה של ההרצה עצמה ל-$\tau$, שהרצות בודדות נותנות לה כל ערך בין $22$ ל-$72$ סריקות, פער של פי $3$ בערך, ולכן פס השגיאה עצמו אינו ודאי עד פי $\sqrt3 = 1.7$ בערך. שגיאת התקן מזרע לזרע אינה דורשת שום הערכה של $\tau$: קוראים אותה מהפיזור של $64$ ממוצעים בלתי תלויים. (שהיא שווה לשגיאה הנאיבית של הרצה אחת, $0.0011$, זה צירוף מקרים: $\sqrt{64} = 8$ קרוב במקרה ל-$\sqrt{2\tau} = 8.8$.)
          - kind: formula
            text: >-
              $\beta_\text{eff} = \dfrac{\ln(m_2/m_1)}{\ln\left[(T_c - T_2)/(T_c - T_1)\right]} \;\xrightarrow[\;L\,\to\,\infty\;]{\;T_1,\,T_2\,\to\,T_c\;}\; \beta$
          - kind: limit
            text: >-
              כש-$T \to T_c$ על העקומה המדויקת, $\beta_\text{eff} \to 1/8$: $0.121$ בין $2.2$ ל-$2.25\,J$, $0.124$ בין $2.25$ ל-$2.26\,J$. כש-$T \to 0$, $m_0 \to 1$ ו-$\beta_\text{eff} \to 0$: עמוק בפאזה המסודרת חוק חזקה ב-$T_c - T$ אינו אומר דבר. כש-$L \to \infty$ העודף של הגודל הסופי נעלם; ב-$L$ קבוע, הוספת הרצות מקטינה את שגיאת התקן מזרע לזרע כמו אחד חלקי השורש של מספרן, אבל משאירה את העודף במקומו, וזה מה שמסמן אותו כשיטתי.
          - kind: units
            text: >-
              $m$ ו-$\beta$ הם מספרים טהורים; $T_c - T$ ביחידות של $J/k_B$, והיחידה מצטמצמת ביחס.
          - kind: substitution
            text: >-
              רחוק: $0.089$ מהערכים שצוטטו, שהם הערכים המדויקים עד שלוש ספרות אחרי הנקודה; עם יותר ספרות שניהם נותנים $0.088$. קרוב: $0.091 \pm 0.0014$ בסימולציה, $0.121$ מדויק. העודף ב-$2.25\,J$: $0.027/0.0011 = 25$ שגיאות תקן מזרע לזרע; אם שופטים מהרצה אחת, $0.027/0.0096 = 2.8$, וגם השגיאה הזו עצמה אינה ודאית עד פי $1.7$ בערך.
          - kind: result
            text: >-
              רחוק מ-$T_c$ חוק החזקה עצמו נכשל (רוויה, תיקונים לסקיילינג); קרוב ל-$T_c$ הסריג הסופי מעוגל, והנקודות שלו הן המתואמות ביותר והפחות ודאיות. העודף ב-$2.25\,J$ שיטתי, ומה שמבסס אותו הוא הפיזור של $64$ הרצות בלתי תלויות: פס השגיאה המתוקן ל-$\tau$ של הרצה אחת לא היה יכול לעשות זאת. כדי למדוד טוב יותר: סריגים גדולים יותר, או כמה גדלים וסקיילינג בגודל סופי, עם הרצות ארוכות יותר ליד $T_c$, כמה זרעים לכל נקודה ופסי שגיאה מתוקנים ל-$\tau$, ובדיקה שהמעריך המותאם שורד החלפה של הזרע ושל חלון ההתאמה.
        rubric:
          - text: >-
              רחוק מ-$T_c$: ההטיה היא בחוק החזקה (רוויה, תיקונים לסקיילינג), כפי שמראים הערכים המדויקים, שנותנים אותו $\beta_\text{eff}$.
            weight: 2
          - text: >-
              קרוב ל-$T_c$: עיגול של גודל סופי מגדיל מדי את $\langle|m|\rangle$ ומשטיח את העקומה.
            weight: 2
          - text: >-
              העודף של $0.027$ הוא כ-$25$ שגיאות תקן מזרע לזרע, ולכן שיטתי; השגיאה הכנה של הרצה אחת ($0.0096$, פחות מ-$3$ שגיאות תקן, כש-$\tau$ אינו ודאי עד פי $3$ בערך) לא הייתה יכולה להכריע.
            weight: 2
          - text: >-
              דרך לשיפור ($L$ גדול יותר, סקיילינג בגודל סופי, הרצות ארוכות יותר ליד $T_c$, כמה זרעים לכל נקודה) ובדיקה בהחלפת זרע.
          - text: >-
              בדיקת גבולות: $T \to T_c$ ($\beta_\text{eff} \to 1/8$), $T \to 0$ או $L \to \infty$.

  - id: Q-15-bagrut-6
    type: bagrut
    title: >-
      הפרמגנט החבוי בתוך מודל איזינג
    prompt: >-
      עם $J = 0$ אנרגיית איזינג היא $E_s = -h\sum_i s_i$. המגנוט המדויק של השרשרת האינסופית הוא $m = \sinh(h/k_BT)/\sqrt{\sinh^2(h/k_BT) + e^{-4J/(k_BT)}}$, וזהות הפלוקטואציה היא $\chi = \partial\langle m\rangle/\partial h = N\,\text{Var}(m)/(k_BT)$.
    parts:
      - label: א
        type: numeric
        points: 4
        objectives: [OBJ-15.1-1]
        prompt: >-
          עם $J = 0$ הספינים בלתי תלויים, וכל אחד מהם הוא הפרמגנט של מודול 12: $\langle m\rangle = \tanh(h/k_BT)$. מצאו את $\langle m\rangle$ עבור $h = 0.5\,k_BT$.
        answer: 0.462
        unit: ''
        tolerance: 0.02
        correctFeedback: >-
          $\tanh 0.5 = 0.462$. נוסחת השרשרת נותנת את אותו ערך ב-$J = 0$: $e^{0} = 1$, ו-$\sinh x/\sqrt{\sinh^2 x + 1} = \sinh x/\cosh x$.
        wrongFeedback: >-
          חשבו את $\tanh(h/k_BT)$ ב-$h/k_BT = 0.5$.
        commonWrong:
          - value: 0.5
            feedback: >-
              זו התגובה הליניארית $h/k_BT$, שתקפה רק עבור $h \ll k_BT$. ב-$h = 0.5\,k_BT$ הרוויה של $\tanh$ כבר ניכרת.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-15.1-3]
        prompt: >-
          לשרשרת עם $J > 0$, מצאו מנוסחת השרשרת את $\chi = \partial m/\partial h$ ב-$h = 0$, וחשבו אותה ב-$k_BT = J$, ביחידות של $1/J$.
        answer: 7.39
        unit: 1/J
        tolerance: 0.03
        correctFeedback: >-
          עבור $h$ קטן, $\sinh(h/k_BT) \approx h/k_BT$ והשורש הוא $e^{-2J/(k_BT)}$, ולכן $m \approx (h/k_BT)\,e^{2J/(k_BT)}$ ו-$\chi = e^{2J/(k_BT)}/(k_BT) = e^2 = 7.39/J$: יותר מפי שבעה מה-$1/J$ של ספינים חופשיים.
        wrongFeedback: >-
          פתחו עבור $h$ קטן: השורש שואף ל-$\sqrt{e^{-4J/(k_BT)}} = e^{-2J/(k_BT)}$.
