      - label: ד
        type: open
        points: 13
        objectives: [OBJ-15.1-5, OBJ-15.1-1]
        prompt: >-
          עבור $J = 0$, חשבו את $\text{Var}(m)$ עבור $N$ ספינים בלתי תלויים ואמתו ישירות את זהות הפלוקטואציה $\chi = N\,\text{Var}(m)/(k_BT)$. אחר כך הסבירו מדוע הזהות עדיין מתקיימת ב-$J > 0$ לכל $N$ סופי, אבל מדוע מתחת ל-$T_c$ המעבדה מפעילה אותה דווקא על $|m|$: מה היה משתבש בהרצה של $10^4$ סריקות ב-$k_BT = 2.0\,J$ על סריג $8 \times 8$, אילו השתמשתם ב-$m$? בדקו את התוצאות במקרים גבוליים.
        solution:
          - kind: law
            text: >-
              לספין בודד בשדה, $\langle s\rangle = \tanh(h/k_BT)$ ו-$s^2 = 1$; לספינים בלתי תלויים השונויות מתחברות, ו-$m = \frac1N\sum_i s_i$.
          - kind: manipulation
            text: >-
              $\text{Var}(s) = \langle s^2\rangle - \langle s\rangle^2 = 1 - \tanh^2(h/k_BT)$, ולכן $\text{Var}(m) = \text{Var}(s)/N$ ו-$N\,\text{Var}(m)/(k_BT) = \left(1 - \tanh^2(h/k_BT)\right)/(k_BT) = \partial\tanh(h/k_BT)/\partial h$: הזהות מתקיימת. לכל $J$ ולכל $N$ סופי, $h$ נכנס למשקל בולצמן כ-$e^{\beta hM}$, ולכן $\langle M\rangle = \partial\ln Z/\partial(\beta h)$ והנגזרת שלו היא $\text{Var}(M)$: הזהות מדויקת בצבר.
          - kind: manipulation
            text: >-
              אבל לצבר ב-$h = 0$ מתחת ל-$T_c$ יש $\langle m\rangle = 0$ ו-$\text{Var}(m) = \langle m^2\rangle \approx m_0^2$, והרצה משחזרת זאת רק אם היא מבקרת בשני הסימנים בהגינות. סריג $8 \times 8$ ב-$2.0\,J$ מתהפך עשרות פעמים ב-$10^5$ סריקות, ולכן רק כמה פעמים ב-$10^4$: הזמן שההרצה מבלה בכל סימן תלוי במזל. הרצה בלי היפוך נותנת רק את הפיזור הקטן סביב סימן אחד; הרצה עם כמה היפוכים נותנת כל דבר עד $m_0^2$. $|m|$ אינו תלוי בסימן, והרצה דוגמת אותו.
          - kind: formula
            text: >-
              $\text{Var}(m) = \dfrac{1 - \tanh^2(h/k_BT)}{N}, \qquad \chi = \dfrac{1 - \tanh^2(h/k_BT)}{k_BT} = \dfrac{\partial}{\partial h}\tanh\dfrac{h}{k_BT}$
          - kind: limit
            text: >-
              $h \to \infty$: $\tanh \to 1$, כל הספינים כלפי מעלה, $\text{Var}(m) \to 0$ ו-$\chi \to 0$: מגנט רווי אינו יכול להגיב. $T \to \infty$ ב-$h = 0$: $\chi = 1/(k_BT) \to 0$, חוק קירי. $J \to 0$ בשרשרת: $\chi = e^{2J/(k_BT)}/(k_BT) \to 1/(k_BT)$, התוצאה של ספינים חופשיים.
          - kind: units
            text: >-
              $\text{Var}(m)$ הוא מספר טהור; $\chi$, שהיא $N\,\text{Var}(m)$ חלקי אנרגיה, ביחידות של $1/J$.
          - kind: substitution
            text: >-
              ב-$2.0\,J$, $m_0 = 0.911$ ו-$m_0^2 = 0.830$: בדגימה הוגנת, $\chi = 64 \cdot 0.830/2.0 = 26.6/J$; הרצה שבה הסריג אינו מתהפך אף פעם נותנת חלק קטן מזה, והתשובה של הרצה מסוימת תלויה במספר ההיפוכים שבמקרה ראתה.
          - kind: result
            text: >-
              לספינים חופשיים $\text{Var}(m) = (1 - \tanh^2(h/k_BT))/N$, ו-$N\,\text{Var}(m)/(k_BT)$ שווה ל-$\partial m/\partial h$. הזהות מדויקת לכל $J$ ו-$N$, אבל מתחת ל-$T_c$ הרצה סופית אינה דוגמת את שני הסימנים בהגינות, ולכן $\text{Var}(m)$ מודד מזל (מקרוב לאפס ועד $26.6/J$ בסריג $8 \times 8$); $\chi' = N\,\text{Var}(|m|)/(k_BT)$ הוא מה שהרצה יכולה לאמוד.
        rubric:
          - text: >-
              $\text{Var}(s) = 1 - \tanh^2(h/k_BT)$ ו-$\text{Var}(m) = \text{Var}(s)/N$.
            weight: 2
          - text: >-
              הראיה ש-$N\,\text{Var}(m)/(k_BT)$ שווה ל-$\partial\tanh(h/k_BT)/\partial h$.
