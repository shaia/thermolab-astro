# מותאמות לסימון ולמספרים של השיעור) והורחבו כך שיכסו את שבע המטרות ואת שבע התפיסות השגויות של
# src/content/misconceptions/15-1.yaml. יחידות מצומצמות: אנרגיות ביחידות של J, טמפרטורה כ-k_BT/J.
# המזהים משותפים עם הבנק באנגלית, שחייב להכיל את אותן שאלות עם אותן תשובות.
lang: he
chapter: 15
questions:
  # ---------------------------------------------------------------- OBJ-15.1-1: אנרגיה, פרמטר סדר, שבירת סימטריה
  - id: Q-15.1-symmetry
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-15.1-1]
    prompt: >-
      אנרגיית איזינג היא $E_s = -J\sum_{\langle ij\rangle} s_is_j - h\sum_i s_i$ עם $J > 0$. ב-$h = 0$, איזו טענה על הסימטריה שלה ועל פרמטר הסדר $m = \frac{1}{N}\sum_i s_i$ נכונה?
    choices:
      - text: >-
          היפוך כל הספינים משאיר את $E_s$ ללא שינוי והופך את הסימן של $m$, ולכן הממוצע הקנוני $\langle m\rangle$ מתאפס ב-$h = 0$ לכל $N$ סופי; מצב מסודר חייב לבחור סימן שהמשוואות אינן מעדיפות.
        correct: true
        feedback: >-
          נכון. כל קשר תלוי רק במכפלה $s_is_j$, ולכן לתאומה ההפוכה של כל קונפיגורציה יש אותו משקל בולצמן ו-$m$ הפוך, והממוצע על הזוג הוא אפס. סדר מופיע רק כשבירת סימטריה ספונטנית: בגבול $N \to \infty$ שדה אינפיניטסימלי, או ההיסטוריה, בוחרים סימן אחד.
      - text: >-
          $J > 0$ מעדיף ספינים שמצביעים כלפי מעלה, ולכן מצב היסוד ב-$h = 0$ הוא כל הספינים כלפי מעלה, עם $m = +1$.
        feedback: >-
          $J > 0$ מעדיף שכנים **שמסכימים**, לאיזה כיוון שיצביעו. למצב שבו כולם מעלה ולמצב שבו כולם מטה יש בדיוק אותה אנרגיה, $-2NJ$ בסריג הריבועי. רק שדה שובר את השוויון, וב-$h = 0$ אין שדה.
      - text: >-
          $m$ מודד את האנרגיה לספין, ולכן הוא אפס בכל פעם ש-$E_s$ הוא אפס.
        feedback: >-
          $m$ סופר ספינים, לא קשרים. ללוח שחמט של ספינים מתחלפים יש $m = 0$ והאנרגיה הגבוהה ביותר האפשרית, $+2NJ$; לסריג שכל ספיניו כלפי מעלה יש $m = 1$ והאנרגיה הנמוכה ביותר. פרמטר הסדר והאנרגיה הם פונקציות שונות של הקונפיגורציה.
      - text: >-
          הסימטריה מתקיימת רק מעל $T_c$; מתחת ל-$T_c$ האנרגיה עצמה מעדיפה סימן אחד.
        feedback: >-
          פונקציית האנרגיה אינה תלויה בטמפרטורה כלל, וסימטריית מעלה–מטה שלה מתקיימת בכל $T$. מה שמשתנה מתחת ל-$T_c$ אינו המשוואות אלא המצב שהמערכת מתייצבת בו.

  - id: Q-15.1-magnetometer
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-1]
    prompt: >-
      סריג איזינג ריבועי גדול, בסימולציה, מקורר בשדה אפס עד הרבה מתחת ל-$T_c$ ומורץ כמה זמן שרוצים. המגנוט לספין שלו נרשם. מה מראה הרישום?
    choices:
      - text: >-
          ערך קרוב ל-$+m_0$ או ל-$-m_0$, אחד מהשניים, שנשמר כל עוד מישהו מסתכל. הממוצע הקנוני הוא אפס, אבל הסריג אינו מבקר בשני הסימנים.
        correct: true
        feedback: >-
          נכון. כדי להתהפך, הסריג חייב לעבור דרך קונפיגורציות שבהן קיר חוצה אותו מקצה לקצה, שהמחיר שלו גדל עם הגודל של הסריג, ולכן הזמן בין היפוכים גדל אקספוננציאלית עם $N$. איור 15.1א מראה זאת: סריג $8 \times 8$ ב-$k_BT = 2.0\,J$ מתהפך עשרות פעמים ב-$10^5$ סריקות, וסריג $32 \times 32$ אף לא פעם אחת.
      - text: >-
          אפס, כי מעלה ומטה סבירים באותה מידה ומתקזזים.
        feedback: >-
          זה הממוצע על הצבר, $\langle m\rangle = 0$, כשקוראים אותו כאילו היה הרישום של הרצה אחת. הממוצע הוא על שני הסימנים; סריג גדול יושב על אחד מהם יותר זמן מכל הרצה, וסריג מאקרוסקופי יותר זמן מגיל היקום. זו שבירת ארגודיות. (פיסת ברזל ממשית נפחית שקוררה בשדה אפס אכן מראה כמעט אפס, אבל מסיבה אחרת: הכוחות הדיפוליים ארוכי הטווח, שהמודל משאיר בחוץ, מחלקים אותה לתחומים שמצביעים לכיוונים שונים.)
        misconception: MC-ensemble-cancellation
      - text: >-
          ערך שנסחף לאט מ-$+m_0$ ל-$-m_0$ ובחזרה בזמן שהסריג מגיע לשיווי משקל.
        feedback: >-
          היפוכים, כשהם קורים בכלל, הם מעברים חדים בין שני הסימנים, כמו שהעקבה של סריג ה-$8 \times 8$ מראה, ולא סחיפה איטית. בסריג גדול הם אינם קורים בשום זמן מעשי.
      - text: >-
          בדיוק $+1$, כי מתחת ל-$T_c$ כל הספינים מתיישרים.
        feedback: >-
          בכל $T > 0$ פלוקטואציות תרמיות משאירות חלק מהספינים הפוכים, ולכן המגנוט הספונטני קטן מ-$1$: ב-$k_BT = 2.0\,J$ בסריג הריבועי הוא $0.911$. ושום דבר לא הופך את $+1$ לסביר יותר מ-$-1$.

  - id: Q-15.1-order-of-limits
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-15.1-1]
    prompt: >-
      המגנוט הספונטני הוא $m_0 = \lim_{h \to 0^+}\lim_{N \to \infty}\langle m\rangle$. סטודנט לוקח את הגבולות בסדר ההפוך: קודם $h \to 0$ ב-$N$ קבוע, ואחר כך $N \to \infty$. מתחת ל-$T_c$, מה הוא מקבל, ומה פירוש התוצאה?
    choices:
      - text: >-
          אפס בכל טמפרטורה: ב-$N$ סופי וב-$h = 0$, $\langle m\rangle = 0$ במדויק מטעמי סימטריה, וגבול של אפסים הוא אפס. הפאזה הממוגנטת מופיעה רק כשהמערכת נעשית אינסופית לפני שמסירים את השדה.
        correct: true
        feedback: >-
          נכון. סדר הגבולות הוא כל התוכן של שבירת הסימטריה. כשלוקחים קודם $N \to \infty$, שדה חלש כרצוננו מספיק כדי להטות את המערכת כולה לכיוון אחד, והמצב שומר על המגנוט שלו כשהשדה מוסר; כשלוקחים קודם $h \to 0$, הסימטריה לעולם אינה נשברת.
      - text: >-
          אפס, וזו התשובה הפיזיקלית: מתחת ל-$T_c$ מעלה ומטה סבירים באותה מידה, ולכן למגנט ממשי בשדה אפס אין מגנוט כולל.
        feedback: >-
          האפס של הסטודנט הוא מתמטיקה נכונה, אבל הוא מתאר את הצבר, לא את המגנט. סריג גדול מתחת ל-$T_c$ מחזיק בסימן אחד יותר זמן מכל ניסוי; סדר הגבולות ב-$m_0$ הוא מה שתופס זאת.
        misconception: MC-ensemble-cancellation
      - text: >-
          שוב $m_0$: הסדר שבו לוקחים שני גבולות אף פעם אינו משנה את התשובה.
        feedback: >-
          לעתים קרובות הוא משנה, וכאן הוא חייב לשנות. ב-$N$ סופי, $\langle m\rangle$ היא פונקציה אי-זוגית חלקה של $h$, ולכן היא עוברת דרך אפס ב-$h = 0$; רק במערכת האינסופית היא קופצת מ-$-m_0$ ל-$+m_0$.
      - text: >-
          $+1$: השדה בחר את מצב המעלה לפני שהוסר, והסריג זוכר.
        feedback: >-
          בסדר של הסטודנט השדה מוסר כשהסריג עדיין סופי, והסריג הסופי, בשיווי משקל, אינו זוכר אותו. וחוץ מזה $m_0 < 1$ בכל $T > 0$.

  - id: Q-15.1-reversals
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-1, OBJ-15.1-6]
    prompt: >-
      באיור 15.1א סריג $8 \times 8$ ב-$k_BT = 2.0\,J$ וב-$h = 0$, שמתחיל כשכל הספינים כלפי מעלה, מתהפך מדי פעם כולו. סריג $32 \times 32$ באותה טמפרטורה לעולם לא מתהפך, כמה שלא תחכו. למה?
    choices:
      - text: >-
          כדי להתהפך, סריג צריך לעבור דרך קונפיגורציות שבהן קירות חוצים אותו מקצה לקצה. המחיר שלהן גדל עם $L$, ולכן זמן ההמתנה בין היפוכים גדל אקספוננציאלית עם הגודל.
        correct: true
        feedback: >-
          נכון. שני הסריגים מסודרים, ובשניהם הממוצע על הצבר של $m$ הוא אפס. ההבדל הוא כמה זמן לוקח לשרשרת לעבור מסימן אחד לשני: עשרות היפוכים ב-$10^5$ סריקות ב-$L = 8$, מעטים אם בכלל ב-$L = 16$ (אף לא אחד ברוב ההרצות, כמה בחלקן), ואף לא אחד ב-$32$.
      - text: >-
          סריג ה-$32 \times 32$ נמצא רחוק יותר מתחת לטמפרטורת המעבר שלו, שגדלה עם הגודל.
        feedback: >-
          אם כבר, ההפך: שיא הסוספטיביליות של הסריג הקטן יושב גבוה יותר ($2.503\,J$ עבור $L = 8$, $2.311\,J$ עבור $L = 64$). ב-$2.0\,J$ שני הסריגים נמצאים הרבה מתחת ל-$T_c$; הגודל משנה כמה זמן לוקח היפוך, לא אם הסריג מסודר.
      - text: >-
          הסריג הגדול הגיע לשיווי משקל, שבו $m$ נשאר קבוע; הקטן עדיין מתרגע.
        feedback: >-
          בשיווי משקל ב-$h = 0$ לשני הסימנים יש משקל שווה, ולכן דווקא ההרצה של הסריג הקטן היא שדוגמת את הצבר. הגדול תקוע בסימן אחד: ההרצה שלו היא זו שאינה מגיעה לשיווי המשקל המלא.
      - text: >-
          המספרים האקראיים של הסריג הגדול פשוט לא הציעו במקרה את ההיפוכים הנכונים.
        feedback: >-
          כל זרע נותן אותה תוצאה, ולכן זה לא מזל. היפוך של הסריג כולו דורש היפוכים מתואמים רבים דרך קונפיגורציות יקרות, וההסתברות שלהם יורדת אקספוננציאלית עם $L$.

  # ---------------------------------------------------------------- OBJ-15.1-2: מטרופוליס מתוך איזון מפורט
  - id: Q-15.1-metropolis-accept
    type: numeric
    level: basic
    objectives: [OBJ-15.1-2]
    prompt: >-
      סימולציית מטרופוליס מציעה היפוך ספין שיעלה את האנרגיה ב-$\Delta E = 4J$, בטמפרטורה $k_BT = 2J$. באיזו הסתברות ההיפוך מתקבל?
    answer: 0.135
    unit: ''
    tolerance: 0.02
    correctFeedback: >-
      $A = \min\left(1, e^{-\Delta E/(k_BT)}\right) = e^{-4J/2J} = e^{-2} = 0.135$. היפוך שהיה מוריד את האנרגיה היה מתקבל בהסתברות $1$.
    wrongFeedback: >-
      השתמשו ב-$A = \min\left(1, e^{-\Delta E/(k_BT)}\right)$ עם $\Delta E/(k_BT) = 4J/2J = 2$.
    commonWrong:
      - value: 0.0183
        feedback: >-
          זה $e^{-4}$: השמטתם את הטמפרטורה. המעריך הוא $\Delta E/(k_BT) = 2$.
      - value: 0.119
        feedback: >-
          זה כלל גלאובר, $1/(1 + e^{2})$. גם הוא מקיים איזון מפורט, אבל השאלה שואלת על מטרופוליס.
      - value: 1
        feedback: >-
          מטרופוליס מקבל בוודאות רק היפוכים שמורידים את האנרגיה, או משאירים אותה ללא שינוי. ההיפוך הזה מעלה אותה.

  - id: Q-15.1-flip-cost
    type: numeric
    level: mid
    objectives: [OBJ-15.1-2]
    prompt: >-
      בסריג הריבועי בשדה $h = 0.5\,J$, לספין כלפי מעלה ($s_i = +1$) יש שלושה שכנים כלפי מעלה ושכן אחד כלפי מטה. מהו שינוי האנרגיה $\Delta E$ בהיפוך שלו, ביחידות של $J$?
    answer: 5
    unit: J
    tolerance: 0.02
    correctFeedback: >-
      $\Delta E_i = 2s_i\left(J\sum_{j} s_j + h\right) = 2\cdot(+1)\cdot(2J + 0.5\,J) = 5J$. ההיפוך שובר שלושה קשרים מסכימים, מתקן קשר חלוק אחד, ומפנה את הספין נגד השדה.
    wrongFeedback: >-
      השתמשו ב-$\Delta E_i = 2s_i\left(J\sum_{j \in \text{nn}(i)} s_j + h\right)$; סכום השכנים הוא $3 - 1 = 2$.
    commonWrong:
      - value: 4
        feedback: >-
          כאן חסר השדה. היפוך של ספין מעלה למטה בשדה שמצביע מעלה עולה עוד $2h = 1J$.
      - value: 2.5
        feedback: >-
          כאן חסר הגורם $2$: כל קשר עובר מ-$-J$ ל-$+J$ (או בחזרה), שינוי של $2J$, לא של $J$.
      - value: 3
        feedback: >-
          הסימן של איבר השדה הפוך. הספין מצביע בכיוון $h$, ולכן היפוך שלו מעלה את האנרגיה ב-$2h$.

  - id: Q-15.1-sweep-time
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-2]
    prompt: >-
      סימולציה מדווחת שסריג $64 \times 64$ שעבר צינון חטוף אל מתחת ל-$T_c$ נזקק לכ-$2000$ סריקות מטרופוליס כדי להסתדר. למה מתאימה סריקה אחת מבחינה פיזיקלית?
    choices:
      - text: >-
          לשום דבר קבוע. סריקה היא ניסיון היפוך אחד לכל ספין, יחידה של חישוב; כלל אחר עם אותה התפלגות סטציונרית, כמו גלאובר, מגיע לאותו שיווי משקל במספר אחר של סריקות.
        correct: true
        feedback: >-
          נכון. איזון מפורט קובע לאן השרשרת הולכת, לא כמה מהר. באיור 15.1א, אחרי $20$ סריקות של אותו צינון חטוף האנרגיה לספין היא $-1.80\,J$ במטרופוליס ו-$-1.68\,J$ בגלאובר; בשיווי משקל השניים מסכימים בתוך פסי השגיאה שלהם.
      - text: >-
          לפיקו-שנייה בערך, הזמן שלוקח לספין ממשי להתהפך: כפלו ב-$2000$ כדי לקבל את זמן הסידור הממשי.
        feedback: >-
          שום קבוע פיזיקלי אינו ממיר סריקות לשניות. הכלל נבחר כדי לדגום את התפלגות בולצמן, וכלל תקף אחר נותן מספר שונה של סריקות לאותה פיזיקה.
        misconception: MC-mc-is-real-dynamics
      - text: >-
          למחזור אחד של תנודות הסריג שנושאות חום אל הספינים.
        feedback: >-
          אין במודל תנודות סריג; האמבט סמוי. שום דבר בשרשרת אינו יודע על פונונים, ולכן אי אפשר לתזמן לפיהם שום דבר בה.
      - text: >-
          לזמן שלוקח לאות לחצות את הסריג במהירות האור.
        feedback: >-
          שום דבר אינו מתפשט במודל. כל היפוך תלוי רק במצב הנוכחי של שכניו, והסדר שבו מבקרים באתרים הוא בחירה חופשית של האלגוריתם.

  - id: Q-15.1-valid-rule
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-15.1-2]
    prompt: >-
      שרשרת מציעה להפוך ספין אחד בכל פעם ומקבלת את ההצעה בהסתברות $A(\Delta E)$. איזו מהשרשראות האלה **אינה** דוגמת את התפלגות בולצמן בטמפרטורה $T$?
    choices:
      - text: >-
          $A = \min\left(1, e^{-\Delta E/(2k_BT)}\right)$.
        correct: true
        feedback: >-
          נכון. היחס שלה הוא $A(\Delta E)/A(-\Delta E) = e^{-\Delta E/(2k_BT)}$, וזה איזון מפורט להתפלגות בולצמן בטמפרטורה $2T$. היא דוגמת, באופן מושלם, את הטמפרטורה הלא נכונה.
      - text: >-
          גלאובר, $A = 1/\left(1 + e^{\Delta E/(k_BT)}\right)$: הוא מתרגע לאט יותר ממטרופוליס אחרי אותו צינון חטוף, ולכן אינו יכול לתאר את אותו שיווי משקל.
        feedback: >-
          איטי יותר אינו שגוי. היחס שלו הוא $e^{-\Delta E/(k_BT)}$, כמו של מטרופוליס, ולכן הוא דוגם את אותו שיווי משקל, רק בעוד סריקות. המהירות של שרשרת אינה אומרת דבר על המהירות של מגנט ממשי, וגם לא על המקום שבו השרשרת מסתיימת.
        misconception: MC-mc-is-real-dynamics
      - text: >-
          $A = \tfrac12\min\left(1, e^{-\Delta E/(k_BT)}\right)$, חצי מהסתברות מטרופוליס.
        feedback: >-
          חיצוי של כל הסתברויות הקבלה משאיר את היחס $A(\Delta E)/A(-\Delta E)$ ללא שינוי, ולכן איזון מפורט עדיין מתקיים. השרשרת דוגמת את ההתפלגות הנכונה וצריכה בערך פי שניים יותר סריקות.
      - text: >-
          מטרופוליס, כשמבקרים באתרים בסדר קבוע (לוח שחמט, או שורה אחרי שורה) ולא באקראי.
        feedback: >-
          כל עדכון של אתר בודד מקיים איזון מפורט, ולכן משאיר את התפלגות בולצמן ללא שינוי; כך גם כל רצף של עדכונים כאלה. סדר הביקורים הוא בחירה חופשית שמשנה את המהירות, לא את היעד.

  # ---------------------------------------------------------------- OBJ-15.1-3: אין מעבר בממד אחד
  - id: Q-15.1-chain-vs-square
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-3]
    prompt: >-
      מדוע לשרשרת איזינג החד-ממדית אין פאזה מסודרת בשום $T > 0$, בעוד הסריג הריבועי מסתדר מתחת ל-$2.269\,J/k_B$?
    choices:
      - text: >-
          בממד אחד קיר עולה אנרגיה קבועה אבל יכול לשבת כמעט בכל מקום, ולכן בשרשרת ארוכה מספיק האנרגיה החופשית שלו נעשית שלילית בכל $T > 0$. בשני ממדים קיר לרוחב הסריג עולה אנרגיה ביחס ישר לאורכו, והיא יכולה לגבור על האנטרופיה שלו ב-$T$ נמוכה.
        correct: true
        feedback: >-
          נכון. בטבעת זוג קירות עולה $4J$ ומרוויח אנטרופיה $k_B\ln(N^2/2)$, שגדלה בלי גבול; בשרשרת פתוחה, $\Delta F = 2J - k_BT\ln N$. בשני ממדים האנרגיה והאנטרופיה של קיר גדלות שתיהן כמו אורכו, והאנרגיה מנצחת מתחת לטמפרטורה מסדר גודל של $J/k_B$.
      - text: >-
          הצימוד $J$ חלש יותר בממד אחד.
        feedback: >-
          $J$ הוא אותה אנרגיית קשר בשני המקרים. ההבדל גאומטרי: בממד אחד קשר שבור אחד מפצל את המערכת לשתיים, ובשני ממדים זה דורש שורה שלמה של קשרים שבורים.
      - text: >-
          השרשרת כן מסתדרת, אבל בטמפרטורה נמוכה מכדי לדמות אותה.
        feedback: >-
          לפתרון המדויק אין מעבר בשום $T > 0$: $E/(NJ) = -\tanh(J/k_BT)$ חלקה עד הטמפרטורות הנמוכות ביותר, ו-$m \to 0$ כש-$h \to 0$ בכל $T > 0$. השדה הממוצע חוזה לשרשרת מעבר ב-$k_BT = 2J$, והחיזוי הזה פשוט שגוי.
        misconception: MC-one-dimension-orders
      - text: >-
          בשרשרת יש פחות ספינים, ולכן הפלוקטואציות שלה גדולות יותר.
        feedback: >-
          בשרשרת יכולים להיות כמה ספינים שרוצים; הטיעון עוסק ב-$N \to \infty$. מה שקובע הוא איך המחיר של שבירת הסדר גדל עם המערכת, לא כמה ספינים יש בה.

  - id: Q-15.1-longer-ring
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-15.1-3]
    prompt: >-
      טבעת של $N$ ספינים ב-$T > 0$ קבועה וב-$h = 0$ מוחלפת בטבעת של $2N$ ספינים. מה קורה למחיר באנרגיה חופשית $\Delta F$ של זוג קירות תחום?
    choices:
      - text: >-
          $\Delta E$ נשאר $4J$, מספר המיקומים גדל מכ-$N^2/2$ לכ-$(2N)^2/2$, ולכן $\Delta F$ יורד ב-$k_BT\ln 4$.
        correct: true
        feedback: >-
          נכון. האנרגיה של הזוג אינה תלויה באורך הטבעת; האנטרופיה שלו כן, וכל הכפלה מורידה את $\Delta F$ באותו $k_BT\ln4$. המשיכו להכפיל ו-$\Delta F$ נעשה שלילי, בכל $T > 0$.
      - text: >-
          הוא מוכפל: בטבעת ארוכה יותר יש פי שניים קשרים שמחזיקים אותה יחד, ולכן קשה יותר להרוס את הסדר שלה.
        feedback: >-
          שני קירות שוברים שני קשרים בכל אורך של הטבעת, ולכן $\Delta E = 4J$ לא זז. מה שגדל עם האורך הוא מספר המקומות שבהם הקירות יכולים לשבת, ולכן בטבעת הארוכה **קל** יותר להרוס את הסדר.
        misconception: MC-one-dimension-orders
      - text: >-
          שום דבר לא משתנה: הקירות עולים $4J$ בכל מקום שבו הם נמצאים.
        feedback: >-
          האנרגיה אכן זהה, אבל האנרגיה החופשית סופרת גם את האנטרופיה, $k_B\ln(N^2/2)$, שגדלה עם $N$.
      - text: >-
          הוא עולה ב-$k_BT\ln4$, כי קירות רחוקים יותר זה מזה עולים יותר אנרגיה.
        feedback: >-
          קיר עולה $2J$ בכל מקום שבו הוא נמצא; שני קירות אינם באינטראקציה זה עם זה. המקום הנוסף נכנס דרך האנטרופיה, עם סימן מינוס.

  - id: Q-15.1-ring-threshold
    type: numeric
    level: mid
    objectives: [OBJ-15.1-3]
    prompt: >-
      טבעת של ספינים מוחזקת ב-$k_BT = 0.5\,J$ וב-$h = 0$. בעזרת $\Delta F \approx 4J - k_BT\ln(N^2/2)$ לזוג קירות תחום, כמה אתרים צריכים להיות בטבעת כדי שהקירות יורידו את האנרגיה החופשית שלה?
    answer: 77.2
    unit: ''
    tolerance: 0.03
    correctFeedback: >-
      $\Delta F < 0$ כאשר $N^2/2 > e^{4J/(k_BT)}$, כלומר $N > \sqrt2\,e^{2J/(k_BT)} = \sqrt2\,e^{4} = 77$. חיצוי הטמפרטורה מ-$J$ (טבעת הדוגמה בשיעור, $10.4$ אתרים) העלה את הסף פי $e^2 = 7.4$, אבל הוא עדיין סופי: טבעת ארוכה יותר אינה מסודרת.
    wrongFeedback: >-
      דרשו ש-$4J = k_BT\ln(N^2/2)$ ופתרו: $N = \sqrt2\,e^{2J/(k_BT)}$.
    commonWrong:
      - value: 54.6
        feedback: >-
          זה $e^{2J/(k_BT)}$, הסף לקיר יחיד בשרשרת פתוחה. בטבעת הקירות באים בזוגות, עם ה-$\sqrt2$ הנוסף שבא מ-$N^2/2$ המיקומים.
      - value: 10.4
        feedback: >-
          זה הסף ב-$k_BT = J$. ב-$0.5\,J$ המעריך $2J/(k_BT)$ הוא $4$, לא $2$.
      - value: 5962
        feedback: >-
          זה $N^2 = 2e^{8}$; הוציאו שורש ריבועי.

  - id: Q-15.1-chain-mean-field
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-15.1-3, OBJ-15.1-4]
    prompt: >-
      השדה הממוצע, עם $q = 2$ שכנים, חוזה ששרשרת איזינג מסתדרת מתחת ל-$k_BT = 2J$. מה אומר הפתרון המדויק של השרשרת?
    choices:
      - text: >-
          אין סדר בשום $T > 0$: המגנוט שואף לאפס כש-$h \to 0$ בכל טמפרטורה חיובית.
        correct: true
        feedback: >-
          נכון. התוצאה של מטריצת ההעברה, $m = \sinh(h/k_BT)/\sqrt{\sinh^2(h/k_BT) + e^{-4J/k_BT}}$, מתאפסת ב-$h = 0$ לכל $T > 0$, כמו שטיעון קירות התחום אומר שחייב לקרות. המעבר של השדה הממוצע כאן אינו סתם לא מדויק; הוא אינו קיים כלל.
      - text: >-
          השרשרת מסתדרת מתחת ל-$2J$, כמו שהשדה הממוצע אומר: עם שני שכנים בלבד לכל ספין יש מעט מתאמים להזניח.
        feedback: >-
          השדה הממוצע גרוע ביותר בממדים נמוכים, לא טוב ביותר. בממד אחד קשר שבור יחיד חותך את השרשרת לשתיים, והאנטרופיה של הבחירה היכן לחתוך מנצחת בכל $T > 0$.
        misconception: MC-one-dimension-orders
      - text: >-
          השרשרת מסתדרת בטמפרטורה נמוכה יותר, ליד $1.13\,J$: השדה הממוצע מעריך ביתר את $T_c$ ב-$76\%$ גם כאן.
        feedback: >-
          ה-$76\%$ הם הטעות של הסריג הריבועי, וחלוקה של $2J$ ב-$1.763$ מניחה שלשרשרת יש $T_c$ בכלל. אין לה: אין טמפרטורה לתקן.
        misconception: MC-one-dimension-orders
      - text: >-
          השרשרת מסתדרת ב-$2.269\,J$, כמו הסריג הריבועי, כי התנהגות קריטית היא אוניברסלית.
        feedback: >-
          אוניברסליות עוסקת במעריכים קריטיים בתוך ממד וסימטריה נתונים, לא בטמפרטורות מעבר, ולשרשרת אין מעבר לחלוק.

  # ---------------------------------------------------------------- OBJ-15.1-4: שדה ממוצע מול אונסאגר
  - id: Q-15.1-mf-overestimate
    type: numeric
    level: basic
    objectives: [OBJ-15.1-4]
    prompt: >-
      השדה הממוצע נותן $k_BT_c = qJ = 4J$ לסריג הריבועי; התוצאה המדויקת של אונסאגר היא $k_BT_c = 2J/\ln\left(1 + \sqrt2\right) = 2.269\,J$. בכמה אחוזים השדה הממוצע מעריך ביתר את $T_c$?
    answer: 76.3
    unit: '%'
    tolerance: 0.03
    correctFeedback: >-
      $(4 - 2.269)/2.269 = 0.763$, הערכת יתר של $76\%$. השדה הממוצע מחליף כל שכן בממוצע שלו, וכך זורק את המתאמים שמכריעים הכול ליד $T_c$.
    wrongFeedback: >-
      השוו את הטעות לערך המדויק: $(T_c^\text{MF} - T_c)/T_c$.
    commonWrong:
      - value: 43.3
        feedback: >-
          כאן חילקתם בערך של השדה הממוצע, $4$. הערכת היתר נמדדת ביחס ל-$T_c$ המדויק, $2.269$.
      - value: 176.3
        feedback: >-
          זה היחס $4/2.269 = 1.763$ כתוב באחוזים. הערכת היתר היא העודף מעל $100\%$.

  - id: Q-15.1-mf-why
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-4]
    prompt: >-
      למה השדה הממוצע ממקם את המעבר של הסריג הריבועי גבוה מדי ב-$76\%$?
    choices:
      - text: >-
          ליד $T_c$ השכנים של ספין מתואמים איתו, ואחד עם השני, למרחקים ארוכים; השדה הממוצע מחליף אותם בממוצע וזורק בדיוק את הפלוקטואציות המתואמות האלה, והן אלה שהורסות את הסדר.
        correct: true
        feedback: >-
          נכון. בלי הפלוקטואציות, שום דבר לא מתנגד לסידור עד $k_BT = 4J$. אותה השמטה גם משבשת את המעריך: $\beta = 1/2$ בשדה הממוצע, מול $1/8$ במדויק.
      - text: >-
          הוא משתמש בצימוד חזק מדי; עם $J$ קטן ב-$43\%$ הוא היה מדויק כמעט לגמרי.
        feedback: >-
          $J$ מכויל מחדש היה יכול להזיז את $T_c$ ותו לא: המעריך עדיין היה $1/2$ במקום $1/8$, והשרשרת עדיין הייתה מקבלת מעבר שאינו קיים. הטעות מבנית, לא עניין של קבוע.
        misconception: MC-mean-field-harmless
      - text: >-
          השדה הממוצע בעצם צודק; הסימולציות ממקמות את $T_c$ נמוך מדי כי הסריגים שלהן סופיים.
        feedback: >-
          השיאים של הסריגים הסופיים יושבים **מעל** $T_c$ ונודדים כלפי מטה אליו ככל ש-$L$ גדל, וה-$2.269\,J$ של אונסאגר מדויק לסריג האינסופי. השדה הממוצע הוא זה שמחטיא.
        misconception: MC-mean-field-harmless
      - text: >-
          התוצאה של אונסאגר תקפה לסריג סופי, והשדה הממוצע לסריג אינסופי.
        feedback: >-
          אונסאגר פתר במדויק את הסריג הריבועי האינסופי. ה-$T_c$ שלו הוא ערך הייחוס שמולו נמדדים גם השדה הממוצע וגם הסימולציות.

  - id: Q-15.1-onsager-m0
    type: numeric
    level: mid
    objectives: [OBJ-15.1-4]
    prompt: >-
      השתמשו בתוצאה של אונסאגר ויאנג, $m_0 = \left[1 - \sinh^{-4}(2J/k_BT)\right]^{1/8}$, כדי למצוא את המגנוט הספונטני המדויק של הסריג הריבועי ב-$k_BT = 2.2\,J$.
    answer: 0.785
    unit: ''
    tolerance: 0.01
    correctFeedback: >-
      $\sinh(2/2.2) = 1.0396$, $\sinh^{-4} = 0.856$, $1 - 0.856 = 0.144$, ו-$0.144^{1/8} = 0.785$. השורש השמיני הוא הסיבה ש-$m_0$ נשאר גדול כל כך קרוב ל-$T_c$ ואז יורד כמעט אנכית. גם סריג $64 \times 64$ נותן $0.785$.
    wrongFeedback: >-
      $2.2\,J$ נמצא מתחת ל-$T_c = 2.269\,J$, ולכן הנוסחה חלה. חשבו את $\sinh(2J/k_BT)$, העלו אותו בחזקת $-4$, החסירו מ-$1$, והוציאו שורש שמיני.
    commonWrong:
      - value: 0.936
        feedback: >-
          זה הערך של השדה הממוצע ב-$2.2\,J$, מ-$m = \tanh(4m/2.2)$. הוא גבוה מדי ב-$19\%$: כל כך קרוב ל-$T_c$, הזנחת המתאמים אינה טעות קטנה.
        misconception: MC-mean-field-harmless
      - value: 0.144
        feedback: >-
          זה $1 - \sinh^{-4}(2J/k_BT)$; המגנוט הוא השורש השמיני שלו.
      - value: 0.379
        feedback: >-
          זה שורש ריבועי. המעריך הוא $1/8$, לא ה-$1/2$ של השדה הממוצע.

  - id: Q-15.1-universality
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-15.1-4]
    prompt: >-
      זורם ואן דר ואלס של מודול 14 נתן עקומת דו-קיום שנסגרת כמו $(1 - T/T_c)^{1/2}$; נקודות קריטיות של נוזל–גז שנמדדו נסגרות עם מעריך $\beta \approx 0.32$. מה ההסבר הטוב ביותר?
    choices:
      - text: >-
          מודל ואן דר ואלס הוא תורת שדה ממוצע, וכל תורת שדה ממוצע של נקודה קריטית רגילה נותנת $1/2$. לזורמים ממשיים יש המעריך של מודל איזינג התלת-ממדי, $0.326$, כי כשהכוחות קצרי טווח את המעריכים קובעים הממד והסימטריה של פרמטר הסדר, לא פרטי הכוחות.
        correct: true
        feedback: >-
          נכון. דרך גז הסריג, זורם **הוא** מודל איזינג: תאים תפוסים וריקים במקום מעלה ומטה, והפוטנציאל הכימי, הנמדד מערכו בדו-קיום, במקום השדה. זו אוניברסליות.
      - text: >-
          השדה הממוצע נותן את המעריך הנכון בעיקרון; ה-$0.32$ נובע מזיהומים ומכבידה בניסויים.
        feedback: >-
          הסריג הריבועי מכריע את זה בלי שום ניסוי: ה-$\beta$ המדויק שלו הוא $1/8$, מול $1/2$ של השדה הממוצע. המעריך של השדה הממוצע שגוי מאותה סיבה שה-$T_c$ שלו שגוי: הוא זורק את המתאמים ששולטים ליד $T_c$.
        misconception: MC-mean-field-harmless
      - text: >-
          זורמים שונים ממגנטים: את המעריך שלהם קובעת המשיכה בין המולקולות, שהשדה הממוצע מטפל בה בגסות רבה מדי.
        feedback: >-
          אוניברסליות היא התצפית שהכוחות אינם משנים: לפחמן דו-חמצני, לקסנון, למים ולתערובות בינאריות, שהכוחות בהם שונים לגמרי, יש לכולם $\beta \approx 0.32$–$0.33$.
      - text: >-
          ליד הנקודה הקריטית זורם מתנהג כאילו היה דו-ממדי, ולכן המעריך שלו נמצא בין ה-$1/8$ של הסריג הריבועי ל-$1/2$ של השדה הממוצע.
        feedback: >-
          זורם נפחי הוא תלת-ממדי, והמעריך שלו הוא מעריך איזינג התלת-ממדי, $0.326$. להימצא בין שני מספרים אינו הסבר.

  # ---------------------------------------------------------------- OBJ-15.1-5: זהויות הפלוקטואציה, איתור T_c
  - id: Q-15.1-chi
    type: numeric
    level: basic
    objectives: [OBJ-15.1-5]
    prompt: >-
      סריג $32 \times 32$ מעל $T_c$, ב-$k_BT = 2.5\,J$, נותן עקבה של המגנוט עם $\text{Var}(m) = 0.060$. בעזרת $\chi = N\,\text{Var}(m)/(k_BT)$, מצאו את הסוספטיביליות לספין, ביחידות של $1/J$.
    answer: 24.6
    unit: 1/J
    tolerance: 0.03
    correctFeedback: >-
      $N = 32^2 = 1024$, ולכן $\chi = 1024 \cdot 0.060/2.5 = 24.6/J$. היא גדולה כי $2.5\,J$ נמצא רק $10\%$ מעל $T_c$, שם הסריג הוא טלאים של כתמים מתואמים גדולים. את התגובה לשדה קוראים מתוך הפלוקטואציות הספונטניות, בלי שדה.
    wrongFeedback: >-
      $N$ הוא מספר הספינים, $L^2$, והזהות מחלקת ב-$k_BT$ פעם אחת.
    commonWrong:
      - value: 0.768
        feedback: >-
          השתמשתם ב-$N = 32$, הצלע. בסריג יש $32^2 = 1024$ ספינים.
      - value: 9.83
        feedback: >-
          כאן חילקתם ב-$(k_BT)^2$, כמו בקיבול החום. הסוספטיביליות מחלקת ב-$k_BT$ פעם אחת.

  - id: Q-15.1-heat-capacity
    type: numeric
    level: mid
    objectives: [OBJ-15.1-5]
    prompt: >-
      סריג $16 \times 16$ ב-$k_BT = 2.3\,J$ נותן עקבה של האנרגיה לספין עם שונות $\text{Var}(e) = 0.031\,J^2$. מצאו את קיבול החום לספין, ביחידות של $k_B$.
    answer: 1.50
    unit: k_B
    tolerance: 0.03
    correctFeedback: >-
      $c/k_B = N\,\text{Var}(e)/(k_BT)^2 = 256 \cdot 0.031/2.3^2 = 1.50$, סמוך לראש השיא של קיבול החום ב-$L = 16$; ב-$k_BT = 2.5\,J$, רחוק יותר מ-$T_c$, הדוגמה בשיעור מוצאת $0.90$ על סריג $32 \times 32$. לא נלקחה אף נגזרת: את התגובה לחימום קוראים מתוך הפלוקטואציות של האנרגיה.
    wrongFeedback: >-
      השתמשו ב-$c = N\,\text{Var}(e)/(k_BT^2)$ עם $N = L^2$; ביחידות מצומצמות, $c/k_B = N\,\text{Var}(e)/(k_BT)^2$.
    commonWrong:
      - value: 3.45
        feedback: >-
          כאן חילקתם ב-$k_BT$ פעם אחת. קיבול החום הוא $\text{Var}(E)/(k_BT^2)$: הטמפרטורה נכנסת בריבוע.
      - value: 0.0938
        feedback: >-
          השתמשתם ב-$N = 16$, הצלע. בסריג יש $16^2 = 256$ ספינים.

  - id: Q-15.1-abs-m
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-5]
    prompt: >-
      איור 15.1ב מפעיל את זהות הפלוקטואציה על $|m|$, $\chi' = N\,\text{Var}(|m|)/(k_BT)$, ולא על $m$. למה, מתחת ל-$T_c$?
    choices:
      - text: >-
          הרצה סופית חוצה בין $+m$ ל-$-m$ רק לעתים רחוקות, ולכן $\text{Var}(m)$ מודד כמה חציות נכנסו במקרה להרצה. ל-$|m|$ לא אכפת באיזה סימן הסריג נמצא, והרצה יכולה לדגום אותו.
        correct: true
        feedback: >-
          נכון. שתי הרצות של אותו סריג, אחת בלי היפוך ואחת עם כמה היפוכים, היו נותנות ערכים שונים לגמרי של $\text{Var}(m)$. $\chi'$ הוא האומד המקובל לסריגים סופיים, והשיא שלו הוא כל מה שהשיעור משתמש בו כדי לאתר את $T_c$.
      - text: >-
          כי $\langle m\rangle = 0$ במדויק מטעמי סימטריה, ולכן $\text{Var}(m)$ מתאפס מתחת ל-$T_c$.
        feedback: >-
          $\langle m\rangle = 0$ הופך את $\text{Var}(m)$ ל-$\langle m^2\rangle$, שקרוב ל-$m_0^2$, לא לאפס, אם שני הסימנים נדגמים בהגינות. הבעיה היא שהרצה אינה דוגמת אותם בהגינות.
      - text: >-
          כי $|m|$ הוא פרמטר הסדר של מודל איזינג ו-$m$ אינו.
        feedback: >-
          $m$ הוא פרמטר הסדר. $|m|$ הוא בחירה של אומד, שנעשתה בגלל מה שהרצה סופית יכולה ואינה יכולה לדגום.
      - text: >-
          כי מגנוטים שליליים אינם פיזיקליים בשדה אפס.
        feedback: >-
          ב-$h = 0$ שני הסימנים שקולים לחלוטין; $m = -0.9$ פיזיקלי בדיוק כמו $m = +0.9$.

  - id: Q-15.1-extrapolate
    type: numeric
    level: bagrut
    objectives: [OBJ-15.1-5, OBJ-15.1-6]
    prompt: >-
      ההרצות של ThermoLab ממקמות את השיא של $\chi'$ ב-$k_BT = 2.416\,J$ עבור $L = 16$ וב-$2.311\,J$ עבור $L = 64$. בהנחה ש-$T_\text{peak}(L) = T_c + a/L$, בצעו אקסטרפולציה ל-$L \to \infty$: מהו $k_BT_c$, ביחידות של $J$?
    answer: 2.276
    unit: J
    tolerance: 0.003
    correctFeedback: >-
      $a = (2.416 - 2.311)/(1/16 - 1/64) = 2.24$, ולכן $T_c = 2.311 - 2.24/64 = 2.276$, בטווח של $0.3\%$ מה-$2.269$ של אונסאגר. אפילו השיא של סריג ה-$64 \times 64$ עדיין נמצא $a/L = 0.035$ מעל $T_c$.
    wrongFeedback: >-
      שתי נקודות קובעות את הישר $T_\text{peak} = T_c + a/L$: מצאו את השיפוע $a$ כנגד $1/L$, ואז את נקודת החיתוך ב-$1/L = 0$.
    commonWrong:
      - value: 2.311
        feedback: >-
          זה השיא של $L = 64$ עצמו. השיא של כל סריג סופי יושב מעל $T_c$; האקסטרפולציה מסירה את ההזזה $a/L$.
      - value: 2.304
        feedback: >-
          זו אקסטרפולציה ב-$1/L^2$. בסריג הריבועי ההזזה הולכת כמו $L^{-1/\nu}$ עם $\nu = 1$: ליניארית ב-$1/L$.

  - id: Q-15.1-what-peaks-show
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-15.1-6, OBJ-15.1-5]
    prompt: >-
      שיא הסוספטיביליות של סריג ריבועי מסומלץ יושב ב-$2.42\,J/k_B$ עבור $L = 16$ וב-$2.31\,J/k_B$ עבור $L = 64$, ונעשה גבוה יותר עם $L$. מה זה מבסס לגבי הסריג האינסופי?
    choices:
      - text: >-
          מגמה שתואמת סינגולריות ליד ה-$2.269\,J/k_B$ של אונסאגר, בתנאי שהיא שורדת החלפת זרע עם פסי שגיאה מתוקנים ל-$\tau$; היא אינה יכולה להוכיח את הסינגולריות, כי בכל סריג סופי כל גודל נצפה הוא פונקציה חלקה של $T$.
        correct: true
        feedback: >-
          נכון. אורך המתאם חסום על ידי $L$, ולכן כל שיא סופי. הסינגולריות היא תכונה של הגבול $N \to \infty$, ומבססים אותה בגזירה, כאן זו של אונסאגר; הסימולציה מספקת ראיות, לפעמים מכריעות. וליד $T_c$ ההאטה הקריטית הופכת את הסריגים הגדולים ביותר לקשים ביותר להבאה לשיווי משקל, כך שהנקודות החשובות ביותר הן הפחות ודאיות.
      - text: >-
          ב-$L = 64$ הסריג גדול מספיק כדי ש-$\chi'$ יהיה למעשה אינסופי בשיא שלו, ולכן המעבר הוא ב-$2.31\,J/k_B$.
        feedback: >-
          סכום של $2^{4096}$ אקספוננטים הוא פונקציה אנליטית: השיא שלו סופי ומעוגל, והוא יושב $0.04\,J/k_B$ מעל $T_c$. לא הגובה ולא המיקום של שיא סופי אחד הם הסינגולריות.
        misconception: MC-simulation-shows-singularity
      - text: >-
          סריג גדול בהרבה, נניח $L = 1024$, היה מראה את ההתבדרות האמיתית ב-$T_c$ ומכריע את השאלה בלי שום תאוריה.
        feedback: >-
          כל $L$ סופי נותן שיא סופי ומעוגל; סריגים גדולים יותר רק מחדדים אותו. כדי להכריע צריך את הגבול, וזו גזירה, לא הרצה.
        misconception: MC-simulation-shows-singularity
      - text: >-
          כלום: בכל סריג סופי הכול אנליטי, ולכן סימולציות אינן אומרות דבר על הסריג האינסופי.
        feedback: >-
          חזק מדי. שיאים שגדלים, מתחדדים ומתכנסים ככל ש-$L$ גדל, בהתאמה לפתרון מדויק כשיש כזה, הם ראיה; הם אינם הוכחה.

  # ---------------------------------------------------------------- OBJ-15.1-6: היסטרזיס, עיגול, האטה
  - id: Q-15.1-tau-peak
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-6]
    prompt: >-
      סימולציית מטרופוליס של סריג $32 \times 32$ מורצת ב-$k_BT = 1.5\,J$, $2.27\,J$ ו-$3.5\,J$. באיזו טמפרטורה לוקח לעקבה של $|m|$ הכי הרבה זמן לאבד את המתאם?
    choices:
      - text: >-
          ב-$2.27\,J$, ליד $T_c$: זמן המתאם העצמי מגיע שם לשיא, וגדל עם $L$.
        correct: true
        feedback: >-
          נכון. ב-$T_c$ הסריג הוא טלאים של תחומים מתואמים בכל גודל עד $L$, וכלל מקומי מסדר מחדש כתם בגודל $\xi$ בזמן שגדל כמו $\xi^z$, $z \approx 2$. ההרצות הארוכות של ThermoLab מודדות בערך סריקה אחת עמוק בכל אחת מהפאזות ו-$42$ סריקות ב-$T_c$ עבור $L = 32$: האטה קריטית.
      - text: >-
          ב-$2.27\,J$ היא מאבדת את המתאם הכי מהר: המערכת נמצאת בין פאזות ואף אחת מהן אינה מעכבת אותה.
        feedback: >-
          להיות בין פאזות פירושו תחומים משני הסימנים בכל קנה מידה, ותחומים מתואמים גדולים הם הדבר האיטי ביותר שעדכון מקומי יכול לשנות. $\tau$ מגיע לשיא ב-$T_c$ וממשיך לגדול עם $L$.
        misconception: MC-critical-fastest-settling
      - text: >-
          ב-$1.5\,J$, כי הטמפרטורה הנמוכה הופכת היפוכים לנדירים.
        feedback: >-
          היפוכים אכן נדירים עמוק בפאזה המסודרת, אבל ל-$|m|$ אין הרבה מה לעשות: הוא יושב ליד $0.99$ עם פלוקטואציות קטנות וכמעט בלתי תלויות, ולכן העקבה שלו מאבדת את המתאם בתוך סריקה או שתיים.
      - text: >-
          ב-$3.5\,J$, כי טמפרטורה גבוהה פירושה פלוקטואציות גדולות.
        feedback: >-
          פלוקטואציות גדולות אינן פלוקטואציות איטיות. הרחק מעל $T_c$ הספינים מתואמים רק על פני אתרים ספורים, וסריקה או שתיים מערבבות אותם.

  - id: Q-15.1-tau-scaling
    type: numeric
    level: mid
    objectives: [OBJ-15.1-6]
    prompt: >-
      ב-$T_c$ זמן המתאם העצמי של $|m|$ הוא $174$ סריקות עבור $L = 64$, והוא גדל כמו $L^z$ עם $z \approx 2$. העריכו אותו עבור $L = 128$, בסריקות.
    answer: 696
    unit: sweeps
    tolerance: 0.05
    correctFeedback: >-
      $174 \cdot 2^2 = 696$, בערך $700$ סריקות. כל אחת מהסריקות האלה גם עולה פי ארבעה, ולכן נקודה מדויקת באותה מידה ב-$T_c$ עולה בסריג הגדול בערך פי $16$ יותר חישוב: הסימולציה איטית ביותר בדיוק במקום שבו הפיזיקה מעניינת ביותר.
    wrongFeedback: >-
      הכפלת $L$ מגדילה את $\tau$ פי $2^z$.
    commonWrong:
      - value: 348
        feedback: >-
          כאן $\tau$ גדל ליניארית עם $L$ ($z = 1$). ה-$3.1$, $10.5$, $42$ ו-$174$ סריקות שנמדדו עבור $L = 8$ עד $64$ גדלים בערך פי ארבעה בכל הכפלה.
      - value: 2784
        feedback: >-
          כאן הכפלתם ב-$16$, כאילו $\tau$ גדל כמו $L^4$. הוא גדל כמו $L^z$ עם $z \approx 2$: פי $4$.

  - id: Q-15.1-loop
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-6]
    prompt: >-
      באיור 15.1ג, ב-$k_BT = 1.5\,J$ על סריג $32 \times 32$, שטח לולאת ההיסטרזיס הוא $1.82$, $1.33$ ו-$1.08$ עבור $5$, $20$ ו-$80$ סריקות לכל צעד של השדה. ב-$3.0\,J$ השטח הוא בערך $0.01$ (בין $0.00$ ל-$0.04$). באיזו מסקנה המדידות האלה תומכות?
    choices:
      - text: >-
          מתחת ל-$T_c$ הסריג נשאר במצב מטא-יציב עד שנוצר תחום הפוך; סריקה איטית יותר של השדה נותנת לגרעון יותר הזדמנויות, ולכן הלולאה מצטרת. בסריג סופי, סריקה איטית מספיק הייתה סוגרת אותה: הלולאה מודדת מטא-יציבות בקנה המידה של זמן ההרצה.
        correct: true
        feedback: >-
          נכון. הלולאה מצטרת ונשארת פתוחה בכל סריקה מעשית. מעל $T_c$ אין מצב מסודר להיתקע בו: העקומה חוזרת על עצמה, והשטח שלה הוא רעש.
      - text: >-
          הלולאה נשארת פתוחה כמה לאט שלא סורקים את השדה, ולכן לסריג ה-$32 \times 32$ יש קפיצה אמיתית ב-$m$ ב-$h = 0$: סימולציה סופית שמראה מעבר מסדר ראשון אמיתי.
        feedback: >-
          פונקציית החלוקה של $1024$ ספינים אנליטית ב-$h$; הרצה ארוכה מספיק כדי לחכות לכל גרעון הייתה משרטטת עקומה חלקה. הקפיצה ב-$h = 0$ שייכת לסריג האינסופי, והלולאה היא ראיה לה, לא הקפיצה עצמה.
        misconception: MC-simulation-shows-singularity
      - text: >-
          השטח מודד כמה מהר מגיבים התחומים של מגנט ממשי: $20$ סריקות לצעד מתאימות לקצב מוגדר של סריקת השדה במעבדה.
        feedback: >-
          סריקה היא יחידה של חישוב; כלל גלאובר היה נותן שטחים אחרים באותו "קצב". המגמה עם מספר הסריקות לצעד משמעותית, ההמרה לשניות לא.
        misconception: MC-mc-is-real-dynamics
      - text: >-
          גם ב-$3.0\,J$ יש לולאה, קטנה מכדי לראות אותה; השטח שלה הוא בערך $0.01$.
        feedback: >-
          שטחים של $0.01$ בערך באים מהרעש של $m$, מול $1.1$ עד $1.8$ מתחת ל-$T_c$. מעל $T_c$ העקומה עוברת דרך הראשית וזהה בשני הכיוונים.

  # ---------------------------------------------------------------- OBJ-15.1-7: פסי שגיאה כנים
  - id: Q-15.1-honest-error
    type: numeric
    level: basic
    objectives: [OBJ-15.1-7]
    prompt: >-
      לעקבה של $n = 20\,000$ דגימות של $|m|$ יש סטיית תקן $\sigma = 0.05$ וזמן מתאם עצמי $\tau = 100$ דגימות. מהי שגיאת התקן של הממוצע שלה?
    answer: 0.005
    unit: ''
    tolerance: 0.03
    correctFeedback: >-
      $N_\text{eff} = n/(2\tau) = 20\,000/200 = 100$, ולכן $\sigma_{\bar x} = 0.05/\sqrt{100} = 0.005$. בעקבה יש מאה דגימות בלתי תלויות, לא עשרים אלף.
    wrongFeedback: >-
      ספרו קודם את הדגימות הבלתי תלויות, $N_\text{eff} = n/(2\tau)$, ואז חלקו את $\sigma$ ב-$\sqrt{N_\text{eff}}$.
    commonWrong:
      - value: 0.000354
        feedback: >-
          זה ה-$\sigma/\sqrt n$ הנאיבי, שמתייחס לכל דגימה כבלתי תלויה. הוא קטן מדי פי $\sqrt{2\tau} = 14$.
        misconception: MC-naive-error-bar
      - value: 0.00354
        feedback: >-
          כאן השתמשתם ב-$N_\text{eff} = n/\tau$. הגורם $2$ ב-$n/(2\tau)$ נמצא שם כי המתאמים פועלים לשני כיווני הזמן.

  - id: Q-15.1-naive-factor
    type: numeric
    level: mid
    objectives: [OBJ-15.1-7]
    prompt: >-
      לעקבה של $10\,000$ דגימות של $|m|$ יש זמן מתאם עצמי $\tau = 25$ דגימות. פי כמה קטנה מדי שגיאת התקן הנאיבית $\sigma/\sqrt n$?
    answer: 7.07
    unit: ''
    tolerance: 0.03
    correctFeedback: >-
      $N_\text{eff} = n/(2\tau) = 10\,000/50 = 200$, ולכן פס השגיאה הכן הוא $\sigma/\sqrt{200}$, והנאיבי קטן מדי פי $\sqrt{10\,000/200} = \sqrt{50} = 7.07$.
    wrongFeedback: >-
      היחס בין שתי השגיאות הוא $\sqrt{n/N_\text{eff}} = \sqrt{2\tau}$.
    commonWrong:
      - value: 1
        feedback: >-
          כאן התייחסתם לדגימות כבלתי תלויות. דגימות מתואמות שקולות למספר קטן יותר של דגימות בלתי תלויות, $N_\text{eff} = n/(2\tau)$, יהיה מספרן אשר יהיה.
        misconception: MC-naive-error-bar
      - value: 5
        feedback: >-
          זה $\sqrt\tau$. השמטתם את הגורם $2$ ב-$N_\text{eff} = n/(2\tau)$.
      - value: 50
        feedback: >-
          זה $2\tau$, היחס בין מספרי הדגימות. שגיאות הולכות כמו השורש: $\sqrt{50}$.

  - id: Q-15.1-seed-check
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-7]
    prompt: >-
      שש-עשרה הרצות בלתי תלויות ב-$k_BT = 2.35\,J$ על סריג $16 \times 16$ מצטטות כל אחת את $\langle|m|\rangle$ עם שני פסי שגיאה: זה המתוקן ל-$\tau$, וה-$\sigma/\sqrt n$ הנאיבי. שש-עשרה הממוצעים מתפזרים בערך כמו שהפסים המתוקנים אומרים, ויותר מפי שניים ממה שהפסים הנאיביים אומרים. מה נובע מזה?
    choices:
      - text: >-
          פס השגיאה המתוקן ל-$\tau$ הוא הכן; הפס הנאיבי טוען לדיוק שאין להרצות.
        correct: true
        feedback: >-
          נכון. החלפת זרע היא המבחן של פס שגיאה: פס כן חוזה כמה רחוק תנחת הרצה בלתי תלויה. מסקנה שמשתנה כשהזרע משתנה מעולם לא הייתה מסקנה.
      - text: >-
          ההרצות חלוקות מעבר לפסי השגיאה הנאיביים שלהן, ולכן חלקן פגומות; השאירו את זו עם השגיאה הנאיבית הקטנה ביותר.
        feedback: >-
          אף אחת מהן אינה פגומה: הן מתפזרות בדיוק כמו שהדגימות המתואמות שלהן מחייבות. הפסים הנאיביים הם מה ששגוי, ובחירת ההרצה עם הפס הקטן ביותר רק מסתירה זאת.
        misconception: MC-naive-error-bar
      - text: >-
          האריכו כל הרצה פי עשרה: אז הפסים הנאיביים יתאימו לפיזור.
        feedback: >-
          גם הפיזור וגם הפס הנאיבי קטנים פי $\sqrt{10}$, והנאיבי נשאר קטן מדי באותו $\sqrt{2\tau}$. הרצות ארוכות יותר אינן מתקנות פס שגיאה שמתעלם ממתאמים.
        misconception: MC-naive-error-bar
      - text: >-
          מחולל המספרים האקראיים פגום: הרצות בלתי תלויות באותה טמפרטורה אמורות להסכים במדויק.
        feedback: >-
          הרצות בלתי תלויות אמורות להיות שונות זו מזו, בערך בגודל פס השגיאה הכן שלהן. הסכמה מדויקת הייתה אומרת שההרצות אינן בלתי תלויות.

  - id: Q-15.1-single-run
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-15.1-7, OBJ-15.1-6]
    prompt: >-
      מהרצה יחידה, סטודנט מוצא את השיא של $\chi'$ עבור $L = 32$ ב-$2.33\,J/k_B$ ועבור $L = 64$ ב-$2.35\,J/k_B$, ומסיק שב-$L$ גדול השיאים נודדים הרחק מ-$T_c$, ולא אליו. ההפרש, $0.02\,J/k_B$, גדול פי כמה וכמה מהשגיאה הנאיבית של כל נקודה. מה התגובה הנכונה?
    choices:
      - text: >-
          הריצו מחדש את שני הגדלים בכמה זרעים, והשוו את ההפרש לפסי שגיאה מתוקנים ל-$\tau$. ליד $T_c$ זמן המתאם העצמי ארוך ביותר, וארוך ביותר עבור $L = 64$, ולכן הנקודות האלה הן הפחות ודאיות; הרצות בארבעה זרעים ממקמות את השיאים ב-$2.329$ וב-$2.311\,J/k_B$.
        correct: true
        feedback: >-
          נכון. ב-$T_c$, $\tau$ הוא בערך $42$ סריקות עבור $L = 32$ ו-$174$ עבור $L = 64$, ולכן הפסים הנאיביים שם קטנים מדי פי $9$ עד $19$. היפוך מגמה שאינו שורד החלפת זרע מעולם לא היה ממצא.
      - text: >-
          קבלו את המסקנה: הפרש של פסי שגיאה נאיביים רבים מובהק סטטיסטית.
        feedback: >-
          הפס הנאיבי $\sigma/\sqrt n$ מתייחס לכל סריקה כבלתי תלויה. ליד $T_c$ סריקות עוקבות מתואמות מאוד, והפס הכן גדול יותר פי $\sqrt{2\tau}$.
        misconception: MC-naive-error-bar
      - text: >-
          קבלו את המסקנה: ליד $T_c$ השרשרת מאבדת את המתאם הכי מהר, ולכן אלה הנקודות האמינות ביותר בהרצה.
        feedback: >-
          ההפך: זמן המתאם העצמי מגיע לשיא ב-$T_c$ וגדל עם $L$. אלה הנקודות הפחות אמינות בהרצה.
        misconception: MC-critical-fastest-settling
      - text: >-
          השליכו את הנקודה של $L = 64$: סריגים גדולים תמיד פחות מדויקים מקטנים.
        feedback: >-
          סריגים גדולים קרובים יותר למערכת האינסופית, והם הכרחיים לאקסטרפולציה. ליד $T_c$ הם קשים יותר, וזה מחייב הרצות ארוכות יותר ופסי שגיאה כנים, לא השלכה שלהם.
