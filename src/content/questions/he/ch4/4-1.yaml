# שאלות הבדיקה של שיעור 4.1. הומרו מ-assessment/quizzes/04-pressure.he.yml של ThermoLab (Q-04-1 … Q-04-6);
# המזהים משותפים עם הבנק באנגלית, שחייב להכיל את אותן שאלות עם אותן תשובות.
lang: he
chapter: 4
questions:
  - id: Q-4.1-motion
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-4.1-1]
    prompt: >-
      גז נמצא בשיווי משקל במיכל אטום, ומד הלחץ שלו יציב לחלוטין. מה עושות המולקולות?
    choices:
      - text: >-
          נעות מהר כתמיד ומתנגשות ללא הרף; רק הממוצעים התייצבו.
        correct: true
        feedback: >-
          נכון. שיווי משקל הוא טענה על ממוצעים מאקרוסקופיים, לא על התנועה המיקרוסקופית. ב-$300\,\text{K}$ מולקולות חנקן נעות בכ-$500\,\text{m/s}$, בין אם המד זז ובין אם לא.
      - text: >-
          הן נעצרו, ולכן הלחץ אינו משתנה עוד.
        feedback: >-
          זה מחייב אנרגיה קינטית אפסית, כלומר אפס מוחלט. וזה גם סותר את עצמו: מולקולות שאינן זזות לא מפעילות לחץ בכלל, ולכן המד היה מראה אפס, לא ערך יציב.
        misconception: MC-equilibrium-motion-stops
      - text: >-
          הן נעות, אבל כבר לא פוגעות בדפנות, ולכן לא מועבר עוד תנע.
        feedback: >-
          ההתנגשויות עם הדפנות הן הלחץ עצמו. הן נמשכות בקצב עצום; מה שיציב הוא הקצב, לא היעדרן.
      - text: >-
          הן מתנודדות במקומן סביב מיקומים קבועים, כמו במוצק.
        feedback: >-
          זה תיאור של מוצק, שהאטומים שלו כבולים לאתרי סריג. בגז המולקולות עפות בחופשיות בין התנגשויות וסורקות את כל המיכל.

  - id: Q-4.1-two-containers
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-4.1-2, OBJ-4.1-3]
    prompt: >-
      מיכל א' מכיל $1$ מול הליום ב-$300\,\text{K}$. מיכל ב' מכיל $2$ מול הליום ב-$300\,\text{K}$, בנפח כפול. איזו טענה נכונה?
    choices:
      - text: >-
          לשניהם אותו לחץ ואותה אנרגיה ממוצעת לאטום; לב' אנרגיה פנימית כפולה.
        correct: true
        feedback: >-
          נכון, וזו ההבחנה שכדאי לשאת הלאה. טמפרטורה מודדת אנרגיה **לחלקיק**, אנרגיה פנימית את **האנרגיה הכוללת**. הכפלה של $N$ ושל $V$ יחד משאירה את $P = Nk_BT/V$ ללא שינוי.
      - text: >-
          לב' לחץ כפול, כי יש בו פי שניים אטומים.
        feedback: >-
          מספר האטומים לבדו לא קובע את הלחץ; הצפיפות קובעת. בב' יש פי שניים אטומים בנפח כפול, ולכן $N/V$, ואיתו $P$, לא משתנים.
        misconception: MC-doubling-doubles-everything
      - text: >-
          לב' טמפרטורה כפולה, כי יש בו אנרגיה פנימית כפולה.
        feedback: >-
          הבלבול הנפוץ ביותר בנושא. הטמפרטורה נקבעת על ידי האנרגיה הממוצעת לחלקיק; אנרגיה כפולה שמפוזרת על פני פי שניים חלקיקים משאירה את הממוצע, ואיתו את הטמפרטורה, במקומו.
        misconception: MC-temperature-total-energy
      - text: >-
          לא' לחץ גבוה יותר, כי האטומים בו צפופים יותר.
        feedback: >-
          הם לא צפופים יותר. לשני המיכלים אותה צפיפות מספרית $N/V$, וזו המשמעות של צפוף כאן.

  - id: Q-4.1-double-mass
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-4.1-2]
    prompt: >-
      אתם מכפילים את המסה של כל חלקיק בעוד הטמפרטורה והצפיפות קבועות. מה קורה ללחץ?
    choices:
      - text: >-
          הוא לא משתנה, כי החלקיקים הכבדים נעים לאט יותר בדיוק במידה שמקזזת את המכה החזקה יותר.
        correct: true
        feedback: >-
          בדיוק. $P = Nm\langle v_x^2\rangle/V$, וחלוקת האנרגיה השווה קובעת $m\langle v_x^2\rangle = k_BT$, ולכן המסה מתבטלת. חלקיקים כבדים פוגעים חזק יותר אבל לעיתים רחוקות יותר, ושני האפקטים מתקזזים בדיוק, לא בקירוב.
      - text: >-
          הוא מוכפל, כי כל התנגשות מעבירה תנע כפול.
        feedback: >-
          כל התנגשות אכן מעבירה יותר תנע, אבל בטמפרטורה קבועה החלקיקים הכבדים איטיים יותר, $\langle v_x^2\rangle = k_BT/m$, ולכן הם מגיעים לדופן לעיתים רחוקות יותר. עברו על $P = Nm\langle v_x^2\rangle/V$ וראו איך $m$ מתבטל.
        misconception: MC-heavier-pushes-harder
      - text: >-
          הוא יורד לחצי, כי החלקיקים הכבדים נעים לאט יותר.
        feedback: >-
          שמרתם את ההאטה וויתרתם על המכה החזקה יותר. שני האפקטים קיימים, והם מתקזזים.
      - text: >-
          הוא לא משתנה, כי הלחץ אף פעם לא תלוי בחומר שממנו עשוי הגז.
        feedback: >-
          המסקנה נכונה, הנימוק לא. רק בגז **אידיאלי** הלחץ אינו תלוי במסה; גזים ממשיים צפופים נבדלים זה מזה כי למולקולות שלהם גדלים ומשיכות שונים.

  - id: Q-4.1-ten-thousand
    type: numeric
    level: mid
    objectives: [OBJ-4.1-4]
    prompt: >-
      גזים של $10\,000$ חלקיקים כל אחד, כמו אלה של איור 4.1ב, מוכנים באותה טמפרטורה. העריכו את הפיזור היחסי של הלחצים הממוצעים בזמן שלהם, $\sigma_P/\langle P\rangle$, כשבר עשרוני.
    answer: 0.01
    unit: ''
    tolerance: 0.05
    correctFeedback: >-
      $\sigma_P/\langle P\rangle = N^{-1/2} = 1/100 = 0.01$, אחוז אחד. שימו לב כמה מהר זה נעשה בלתי מדיד; במול זה כ-$1.3\cdot10^{-12}$.
    wrongFeedback: >-
      הפלוקטואציה היחסית של סכום של $N$ תרומות בלתי תלויות דועכת כמו $N^{-1/2}$.
    commonWrong:
      - value: 0.0001
        feedback: >-
          זה $1/N$. הפיזור המוחלט של הסכום גדל כמו $\sqrt N$ והממוצע כמו $N$, ולכן היחס דועך כמו $1/\sqrt N$, לא כמו $1/N$.
      - value: 100
        feedback: >-
          זה $\sqrt N$, הגידול של הפיזור המוחלט. חלקו בממוצע, שגדל כמו $N$.

  - id: Q-4.1-detect
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-4.1-1, OBJ-4.1-4]
    prompt: >-
      איור 4.1ב מודד עד כמה הלחץ הממוצע בזמן שונה מגז לגז באותה טמפרטורה. איזה שינוי בודד יהפוך את הפיזור הזה לקל ביותר לגילוי?
    choices:
      - text: >-
          מדידה של מדגם קטן מאוד, כך ש-$N$ קטן.
        correct: true
        feedback: >-
          כן. הפיזור היחסי תלוי ב-$N$ וכמעט בשום דבר אחר; לא בטמפרטורה, לא בסוג הגז ולא בלחץ עצמו. $N$ קטן הוא הידית היחידה.
      - text: >-
          העלאת הטמפרטורה, כדי שההתנגשויות יהיו אלימות יותר.
        feedback: >-
          בגז חם יותר ההתנגשויות אכן אלימות יותר, אבל הלחץ הממוצע עולה באותו יחס. הפלוקטואציה ה**יחסית** היא $N^{-1/2}$, בכל טמפרטורה.
        misconception: MC-violence-sets-fluctuation
      - text: >-
          שימוש במולקולות כבדות יותר, כדי שכל פגיעה תהיה גדולה יותר.
        feedback: >-
          כל פגיעה גדולה יותר, אבל הפגיעות באות לעיתים רחוקות יותר. בטמפרטורה קבועה הלחץ אינו תלוי במסה, וגם הפיזור שלו מגז לגז אינו תלוי בה.
        misconception: MC-violence-sets-fluctuation
      - text: >-
          דחיסת הגז, כדי שההתנגשויות יהיו תכופות יותר.
        feedback: >-
          דחיסה מעלה גם את הלחץ הממוצע וגם את הפלוקטואציה המוחלטת, ומשאירה את היחס ביניהם על $N^{-1/2}$.

  - id: Q-4.1-trust
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.1-5]
    prompt: >-
      באיזה מצב המודל הקינטי של השיעור הזה אמין פחות מכול?
    choices:
      - text: >-
          הליום ב-$4\,\text{K}$ ובצפיפות גבוהה, סמוך להתנזלות.
        correct: true
        feedback: >-
          נכון בשני ההיבטים. צפיפות גבוהה הופכת את גודל המולקולות ואת הכוחות ביניהן למשמעותיים, וטמפרטורה נמוכה מכניסה סטטיסטיקה קוונטית; אלה שני אופני הכישלון שבמפרט המודל.
      - text: >-
          חנקן בטמפרטורת החדר ובלחץ אטמוספרי.
        feedback: >-
          זה המגרש הביתי של המודל. המולקולות ממלאות כאלפית מהנפח, והאפקטים הקוונטיים זניחים לחלוטין.
      - text: >-
          ארגון בתא ואקום בצפיפות נמוכה מאוד.
        feedback: >-
          צפיפות נמוכה הופכת את המודל ל**טוב יותר**. זה בדיוק הגבול המדולל, שבו ההנחה שאין אינטראקציות מתארת את הגז היטב.
      - text: >-
          אוויר בחדר גדול מאוד ולא בבקבוק קטן.
        feedback: >-
          גודל המיכל לא משפיע על תקפות המודל; הצפיפות והטמפרטורה כן. אם כבר, $N$ גדול יותר הופך את התיאור המאקרוסקופי לחד יותר.

  - id: Q-4.1-twenty
    type: mc
    level: mid
    qualitative: true
    objectives: [OBJ-4.1-1, OBJ-4.1-4]
    prompt: >-
      באיור 4.1א עם $N = 20$, הלחץ שנמדד בחלונות קצרים יורד לפעמים לאפס. למה?
    choices:
      - text: >-
          במהלך החלון הזה אף חלקיק לא פגע במקרה בדופן.
        correct: true
        feedback: >-
          נכון. לחץ הוא תנע שמועבר לדפנות; חלון בלי אף פגיעה לא מעביר כלום. עם מעט חלקיקים זה קורה הרבה. עם אלפים, כל חלון תופס הרבה פגיעות, והסכום שלהן משתנה מעט.
      - text: >-
          החלקיקים הפסיקו לנוע לרגע.
        feedback: >-
          פגיעות אלסטיות שומרות על האנרגיה הקינטית בדיוק, ולכן החלקיקים אף פעם לא מאטים. הם נעו; הם פשוט לא היו ליד דופן.
        misconception: MC-equilibrium-motion-stops
      - text: >-
          חלק מהאנרגיה אבד בהתנגשויות עם הדפנות.
        feedback: >-
          ההתנגשויות אלסטיות: האנרגיה נשמרת עד דיוק המכונה, והבדיקות של המודל הזה מוודאות זאת.
      - text: >-
          צעד הסימולציה היה ארוך מדי, ולכן הפגיעות לא נרשמו.
        feedback: >-
          ההחזרה מדויקת וכל פגיעה נספרת, יהיה הצעד אשר יהיה. האפסים אמיתיים: כשיש מעט חלקיקים, לפעמים באמת אף אחד מהם לא פוגע בדפנות במשך זמן מה.

  - id: Q-4.1-box-side
    type: numeric
    level: basic
    objectives: [OBJ-4.1-2]
    prompt: >-
      ב-$N$ וב-$T$ קבועים, הצלע של הקופסה הדו-ממדית מוקטנת מ-$1.0\,\mu\text{m}$ ל-$0.70\,\mu\text{m}$. פי כמה משתנה הלחץ?
    answer: 2.04
    unit: ''
    tolerance: 0.03
    correctFeedback: >-
      $PA = Nk_BT$, ולכן $P \propto 1/A = 1/L^2$, ו-$(1.0/0.70)^2 = 2.04$. גם הדרך הקצרה בין הדפנות וגם הדופן הקצרה שעליה דוחפים נספרות.
    wrongFeedback: >-
      הלחץ הולך כמו $1/A$, והשטח של קופסה ריבועית הוא ריבוע הצלע.
    commonWrong:
      - value: 1.43
        feedback: >-
          זה $1/0.70$, גורם אחד של הצלע. החלקיקים חוזרים לעיתים קרובות יותר (גורם אחד) ודוחפים על דופן קצרה יותר (גורם נוסף).
      - value: 0.49
        feedback: >-
          כך השתנה השטח. הלחץ משתנה בכיוון ההפוך: קופסה קטנה יותר, לחץ גבוה יותר.

  - id: Q-4.1-per-particle
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-4.1-3]
    prompt: >-
      שתי קופסאות של הליום באותה טמפרטורה. בקופסה הגדולה יש פי עשרה אטומים מאשר בקטנה. איזה גודל גדול פי עשרה בקופסה הגדולה?
    choices:
      - text: >-
          האנרגיה הפנימית.
        correct: true
        feedback: >-
          כן. האנרגיה הפנימית היא האנרגיה הכוללת, $U = N\langle E\rangle$, ו-$\langle E\rangle$ נקבעת על ידי הטמפרטורה, שזהה. פי עשרה אטומים, פי עשרה אנרגיה.
      - text: >-
          האנרגיה הקינטית הממוצעת לאטום.
        feedback: >-
          זו נקבעת על ידי הטמפרטורה בלבד: $\tfrac32 k_BT$ בשלושה ממדים, זהה בשתי הקופסאות.
      - text: >-
          הטמפרטורה.
        feedback: >-
          הטמפרטורה זהה לפי הנתון. היא מודדת את האנרגיה לחלקיק, לא את האנרגיה הכוללת.
        misconception: MC-temperature-total-energy
      - text: >-
          המהירות הממוצעת של אטום.
        feedback: >-
          המהירויות נובעות מהטמפרטורה ומהמסה, שתיהן זהות, ולכן התפלגויות המהירות זהות.

  - id: Q-4.1-internal-energy
    type: numeric
    level: mid
    objectives: [OBJ-4.1-3]
    prompt: >-
      מצאו את האנרגיה הפנימית של $2.00\,\text{mol}$ הליום, גז אידיאלי חד-אטומי, ב-$300\,\text{K}$. קחו $R = 8.314\,\text{J/(mol·K)}$.
    answer: 7483
    unit: J
    tolerance: 0.02
    correctFeedback: >-
      $U = \tfrac32 nRT = 1.5\cdot2.00\cdot8.314\cdot300 = 7.48\cdot10^3\,\text{J}$: שלושה איברים ריבועיים לאטום, $\tfrac12 k_BT$ כל אחד.
    wrongFeedback: >-
      כל אטום נושא $\tfrac32 k_BT$ (שלושה כיווני תנועה), ויש $nN_A$ אטומים: $U = \tfrac32 nRT$.
    commonWrong:
      - value: 4988
        feedback: >-
          זה $nRT$. לכל אטום שלושה איברים ריבועיים, ולכן הגורם הוא $\tfrac32$.
      - value: 3741
        feedback: >-
          זה מול אחד. במיכל יש שניים.

  - id: Q-4.1-dense
    type: mc
    level: basic
    qualitative: true
    objectives: [OBJ-4.1-5]
    prompt: >-
      למה חוק הגזים האידיאליים נכשל בגז צפוף?
    choices:
      - text: >-
          הנפח העצמי של המולקולות והמשיכה ביניהן מתחילים להיות משמעותיים.
        correct: true
        feedback: >-
          נכון. המודל הניח חלקיקים נקודתיים שאף פעם לא מרגישים זה את זה. בגז צפוף שתי ההנחות נשברות, והחוק צריך תיקונים (מודול 14).
      - text: >-
          התנגשויות בין מולקולות משנות את התנע הכולל שמועבר לדפנות.
        feedback: >-
          התנגשויות בין חלקיקים נקודתיים שומרות תנע ואנרגיה ואינן משנות את הלחץ. הן משנות משהו רק כי למולקולות אמיתיות יש גודל, והגודל הזה, יחד עם המשיכה ביניהן, הוא התשובה שלמעלה.
      - text: >-
          חלוקת האנרגיה השווה מפסיקה להתקיים בצפיפות גבוהה.
        feedback: >-
          חלוקת האנרגיה השווה נכשלת כשאפקטים קוונטיים מקפיאים תנועה, וזה עניין של טמפרטורה נמוכה, לא של צפיפות.
      - text: >-
          לגז צפוף אין טמפרטורה מוגדרת היטב.
        feedback: >-
          לגז צפוף בשיווי משקל יש טמפרטורה מוגדרת היטב. מה שמשתנה הוא משוואת המצב שלו.

  - id: Q-4.1-what-it-shows
    type: mc
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.1-5]
    prompt: >-
      הסימולציה של השיעור אף פעם לא נותנת לשני חלקיקים להתנגש. באיזו טענה היא **לא** יכולה לתמוך?
    choices:
      - text: >-
          שגז ממשי מגיע בעצמו להתפלגות מקסוול-בולצמן.
        correct: true
        feedback: >-
          נכון. בלי התנגשויות בין חלקיקים המהירויות אף פעם לא משתנות מלבד בסימן, ולכן ההתפלגות שנכפתה בהתחלה נשמרת, ולא מושגת. השאלה אם גז מגיע אליה היא טענה נפרדת.
      - text: >-
          שגז עם מהירויות לפי מקסוול-בולצמן מפעיל לחץ $Nk_BT/A$.
        feedback: >-
          בזה הסימולציה כן תומכת: כופים את ההתפלגות, מודדים את המתקפים על הדפנות, והלחץ מתייצב על $Nk_BT/A$.
      - text: >-
          שהלחץ אינו תלוי במסת החלקיקים.
        feedback: >-
          גם בזה היא תומכת, בהינתן חלוקת האנרגיה השווה: הגז מוכן עם האנרגיה $Nk_BT$ בלי קשר למסה, ומסה פי ארבעה נותנת אז אותו לחץ נמדד.
      - text: >-
          שהפלוקטואציה היחסית של הלחץ דועכת כמו $N^{-1/2}$.
        feedback: >-
          גם זה נתמך, עבור גזים שנדגמו בטמפרטורה נתונה; איור 4.1ב מודד בדיוק את זה.
