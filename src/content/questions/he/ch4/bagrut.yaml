# שאלות החזרה של מודול 04, מתוך דף השאלות של ThermoLab (content/he/thermodynamics/04-pressure-problems.md,
# שאלות 2–5). ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו מפרסמת פתרונות מלאים ומחוונים, בהחלטת
# הכותב. המזהים משותפים עם הקובץ באנגלית.
lang: he
chapter: 4
questions:
  - id: Q-4-bagrut-1
    type: bagrut
    title: >-
      ארגון בכלי אטום
    prompt: >-
      כלי קשיח ואטום שנפחו $2.0\,\text{L}$ מכיל $N = 5.0\cdot10^{22}$ אטומי ארגון ב-$300\,\text{K}$. קחו $k_B = 1.381\cdot10^{-23}\,\text{J/K}$ ויחידת מסה אטומית $u = 1.661\cdot10^{-27}\,\text{kg}$.
    parts:
      - label: א
        type: numeric
        points: 5
        objectives: [OBJ-4.1-2]
        prompt: >-
          מצאו את הלחץ בכלי.
        answer: 1.036e5
        unit: Pa
        tolerance: 0.03
        correctFeedback: >-
          $P = Nk_BT/V = 5.0\cdot10^{22}\cdot1.381\cdot10^{-23}\cdot300/2.0\cdot10^{-3} = 1.04\cdot10^5\,\text{Pa}$, כאטמוספרה אחת.
        wrongFeedback: >-
          השתמשו ב-$PV = Nk_BT$ עם הנפח במטרים מעוקבים.
        commonWrong:
          - value: 103.6
            feedback: >-
              השתמשתם בנפח בליטרים כאילו היה במטרים מעוקבים. $2.0\,\text{L} = 2.0\cdot10^{-3}\,\text{m}^3$.
      - label: ב
        type: open
        points: 8
        objectives: [OBJ-4.1-2, OBJ-4.1-3]
        prompt: >-
          מחממים את הגז ל-$600\,\text{K}$. מצאו את הלחץ החדש, את האנרגיה הקינטית הממוצעת החדשה לאטום ואת האנרגיה הפנימית החדשה. איזה מהשלושה הוכפל, ולמה?
        solution:
          - kind: law
            text: >-
              $PV = Nk_BT$; חלוקת האנרגיה השווה לשלושה כיווני תנועה, $\langle E\rangle = \tfrac32 k_BT$; האנרגיה הפנימית היא האנרגיה הכוללת, $U = N\langle E\rangle$.
          - kind: manipulation
            text: >-
              הכלי קשיח ואטום, ולכן $N$ ו-$V$ קבועים, וכל אחד מ-$P$, $\langle E\rangle$ ו-$U$ פרופורציוני ל-$T$. הכפלת $T$ מכפילה את שלושתם.
          - kind: substitution
            text: >-
              $P = 2\cdot1.04\cdot10^5 = 2.07\cdot10^5\,\text{Pa}$; $\langle E\rangle = 1.5\cdot1.381\cdot10^{-23}\cdot600 = 1.24\cdot10^{-20}\,\text{J}$ (קודם $6.21\cdot10^{-21}\,\text{J}$); $U = 5.0\cdot10^{22}\cdot1.24\cdot10^{-20} = 621\,\text{J}$ (קודם $311\,\text{J}$).
          - kind: units
            text: >-
              $\text{J/K}\cdot\text{K} = \text{J}$ לאנרגיות; $\text{J/m}^3 = \text{Pa}$ ללחץ.
          - kind: result
            text: >-
              $P = 2.07\cdot10^5\,\text{Pa}$, $\langle E\rangle = 1.24\cdot10^{-20}\,\text{J}$, $U = 621\,\text{J}$. שלושתם הוכפלו, כי ב-$N$ וב-$V$ קבועים כל אחד מהם פרופורציוני לטמפרטורה.
        rubric:
          - text: >-
              הלחץ מוכפל ל-$2.07\cdot10^5\,\text{Pa}$.
          - text: >-
              $\langle E\rangle = \tfrac32 k_BT = 1.24\cdot10^{-20}\,\text{J}$.
          - text: >-
              $U = N\langle E\rangle = 621\,\text{J}$.
          - text: >-
              הנימוק: ב-$N$ וב-$V$ קבועים, שלושתם פרופורציוניים ל-$T$.
            weight: 2
      - label: ג
        type: mc
        points: 4
        objectives: [OBJ-4.1-2, OBJ-4.1-3]
        prompt: >-
          מחליפים את הארגון באותו מספר אטומי הליום, ב-$600\,\text{K}$, באותו כלי. אילו מהגדלים בסעיף ב' משתנים?
        choices:
          - text: >-
              אף אחד מהם; רק המהירויות של האטומים משתנות.
            correct: true
            feedback: >-
              נכון. $P$, $\langle E\rangle$ ו-$U$ תלויים ב-$N$, ב-$V$ וב-$T$, לא במסה. אטומי ההליום הקלים מהירים יותר, בדיוק במידה הנדרשת.
          - text: >-
              הלחץ יורד, כי אטומי הליום קלים יותר.
            feedback: >-
              אטומים קלים מעבירים פחות תנע בכל פגיעה, אבל הם פוגעים לעיתים קרובות יותר, ושני האפקטים מתקזזים.
            misconception: MC-heavier-pushes-harder
          - text: >-
              האנרגיה הקינטית הממוצעת לאטום יורדת, כי אטומי הליום קלים יותר.
            feedback: >-
              האנרגיה הקינטית הממוצעת לאטום היא $\tfrac32 k_BT$, ונקבעת על ידי הטמפרטורה בלבד.
          - text: >-
              שלושתם יורדים, ביחס המסות.
            feedback: >-
              אף אחד מהשלושה לא תלוי במסה, רק ב-$N$, ב-$V$ וב-$T$.
            misconception: MC-heavier-pushes-harder
      - label: ד
        type: open
        points: 8
        objectives: [OBJ-4.1-2]
        prompt: >-
          מצאו את מהירויות שורש הממוצע הריבועי של אטומי הליום ($4.00\,u$) ושל אטומי ארגון ($39.95\,u$) ב-$600\,\text{K}$, והראו מתוך $P = Nm\langle v_x^2\rangle/V$ ששני הגזים מפעילים אותו לחץ. בדקו את התוצאה במקרה גבולי.
        solution:
          - kind: law
            text: >-
              $P = Nm\langle v_x^2\rangle/V$, וחלוקת האנרגיה השווה, $\tfrac12 m\langle v^2\rangle = \tfrac32 k_BT$, ולכן $v_{\text{rms}} = \sqrt{3k_BT/m}$.
          - kind: manipulation
            text: >-
              $m\langle v_x^2\rangle = k_BT$ בכל מסה, ולכן $P = Nk_BT/V$ זהה לשני הגזים. המהירויות הולכות כמו $m^{-1/2}$: $v_{\text{He}}/v_{\text{Ar}} = \sqrt{m_{\text{Ar}}/m_{\text{He}}}$.
          - kind: substitution
            text: >-
              $v_{\text{He}} = \sqrt{3\cdot1.381\cdot10^{-23}\cdot600/(4.00\cdot1.661\cdot10^{-27})} = 1.93\cdot10^3\,\text{m/s}$, $v_{\text{Ar}} = 612\,\text{m/s}$; היחס $\sqrt{39.95/4.00} = 3.16$.
          - kind: limit
            text: >-
              כש-$m \to \infty$ ב-$T$ קבועה, $v_{\text{rms}} \to 0$ אבל $m\langle v_x^2\rangle$ נשאר $k_BT$: אטומים כבדים לאין סוף שכמעט עומדים במקום מפעילים עדיין את כל הלחץ. כש-$T \to 0$, גם המהירויות וגם הלחץ שואפים לאפס, ושם המודל נכשל בכל מקרה.
          - kind: units
            text: >-
              $\sqrt{\text{J}/\text{kg}} = \sqrt{\text{m}^2/\text{s}^2} = \text{m/s}$.
          - kind: result
            text: >-
              $v_{\text{He}} = 1.93\cdot10^3\,\text{m/s}$, $v_{\text{Ar}} = 612\,\text{m/s}$, יחס של $3.16$; הלחצים שווים, $2.07\cdot10^5\,\text{Pa}$.
        rubric:
          - text: >-
              $v_{\text{rms}} = \sqrt{3k_BT/m}$, ושני הערכים נכונים.
          - text: >-
              הראיה ש-$m\langle v_x^2\rangle = k_BT$ הופך את הלחץ לבלתי תלוי במסה.
            weight: 2
          - text: >-
              בדיקת גבולות, למשל $m \to \infty$ ב-$T$ קבועה.

  - id: Q-4-bagrut-2
    type: bagrut
    title: >-
      פרדוקס המסה
    prompt: >-
      שני מיכלים זהים מכילים אותו מספר חלקיקים באותה טמפרטורה. החלקיקים במיכל ב' כבדים פי ארבעה מאלה שבמיכל א'.
    parts:
      - label: א
        type: mc
        points: 4
        objectives: [OBJ-4.1-2]
        prompt: >-
          מהו היחס בין מהירויות שורש הממוצע הריבועי, $v_B/v_A$?
        choices:
          - text: >-
              $1/2$
            correct: true
            feedback: >-
              נכון. באותה טמפרטורה $m\langle v^2\rangle$ שווה, ולכן $v \propto m^{-1/2}$, ומסה פי ארבעה מחצה את המהירות.
          - text: >-
              $1/4$
            feedback: >-
              כך $m v$ היה שווה. חלוקת האנרגיה השווה קובעת את $m\langle v^2\rangle$, ולכן המהירות הולכת כמו $m^{-1/2}$.
          - text: >-
              $1$
            feedback: >-
              טמפרטורה שווה פירושה אנרגיה קינטית ממוצעת שווה, לא מהירות שווה.
          - text: >-
              $2$
            feedback: >-
              באותה טמפרטורה חלקיקים כבדים איטיים יותר, לא מהירים יותר.
      - label: ב
        type: numeric
        points: 4
        objectives: [OBJ-4.1-2]
        prompt: >-
          פי כמה שונה, בממוצע, התנע שחלקיק מעביר לדופן בפגיעה אחת, בין מיכל ב' למיכל א'?
        answer: 2
        unit: ''
        tolerance: 0.03
        correctFeedback: >-
          פגיעה מעבירה $2m|v_x|$: פי ארבעה מסה בחצי מהמהירות, כלומר פי שניים תנע.
        wrongFeedback: >-
          הכפילו את יחס המסות ביחס המהירויות.
        commonWrong:
          - value: 4
            feedback: >-
              זה רק יחס המסות. החלקיקים הכבדים גם איטיים יותר, פי שניים.
          - value: 1
            feedback: >-
              התנע לפגיעה כן משתנה: קצב הפגיעות הוא שמקזז.
      - label: ג
        type: numeric
        points: 4
        objectives: [OBJ-4.1-2]
        prompt: >-
          פי כמה שונה מספר הפגיעות בשנייה בדופן נתונה, בין מיכל ב' למיכל א'?
        answer: 0.5
        unit: ''
        tolerance: 0.03
        correctFeedback: >-
          חלקיק חוזר לאותה דופן כל $2L_x/|v_x|$, ולכן הקצב הולך כמו המהירות: חצי.
        wrongFeedback: >-
          הזמן בין שתי פגיעות באותה דופן הוא $2L_x/|v_x|$.
        commonWrong:
          - value: 0.25
            feedback: >-
              הקצב הולך כמו המהירות, $m^{-1/2}$, לא כמו $1/m$.
          - value: 2
            feedback: >-
              חלקיקים איטיים חוזרים לעיתים רחוקות יותר, לא קרובות יותר.
      - label: ד
        type: open
        points: 13
        objectives: [OBJ-4.1-2, OBJ-4.1-3]
        prompt: >-
          הראו שהלחצים במיכל א' ובמיכל ב' שווים, וציינו אילו שני אפקטים מתקזזים. אחר כך השוו את המיכלים ב**מהירויות** שוות במקום בטמפרטורה שווה: מהו $P_B/P_A$, ומה זה אומר על הגודל שבאמת קובע את הלחץ? בדקו את התוצאה במקרה גבולי.
        solution:
          - kind: law
            text: >-
              $P = Nm\langle v_x^2\rangle/V$, מהתנע שכל פגיעה מעבירה כפול קצב הפגיעות.
          - kind: manipulation
            text: >-
              בטמפרטורה שווה: כל פגיעה מעבירה פי שניים תנע (ב) ותדירות הפגיעות קטנה פי שניים (ג), ולכן המכפלה, ואיתה $P$, לא משתנה; ובאופן שקול $m\langle v_x^2\rangle = k_BT$ לשניהם. במהירויות שוות: $P \propto m$, ולכן $P_B/P_A = 4$.
          - kind: manipulation
            text: >-
              בשני המקרים $P$ פרופורציוני ל-$m\langle v_x^2\rangle$, האנרגיה הקינטית לחלקיק: בגז חד-אטומי $P = \tfrac23 U/V$. הלחץ פרופורציוני לצפיפות האנרגיה הקינטית, שב-$N/V$ קבוע היא הטמפרטורה.
          - kind: limit
            text: >-
              כשהמסות שוות, שתי ההשוואות נותנות $P_B/P_A = 1$, כמו שצריך. במהירות קבועה, כש-$m \to 0$ התנע לפגיעה נעלם ו-$P \to 0$; בטמפרטורה קבועה זה לא קורה, כי המהירויות גדלות כמו $m^{-1/2}$.
          - kind: units
            text: >-
              $Nm\langle v_x^2\rangle/V$: $\text{kg}\cdot\text{m}^2\text{s}^{-2}/\text{m}^3 = \text{J/m}^3 = \text{Pa}$.
          - kind: result
            text: >-
              בטמפרטורה שווה $P_A = P_B$ (פי שניים תנע לפגיעה, חצי מהפגיעות); במהירות שווה $P_B = 4P_A$. הלחץ פרופורציוני לאנרגיה הקינטית ליחידת נפח, $P = \tfrac23 U/V$.
        rubric:
          - text: >-
              לחצים שווים בטמפרטורה שווה, מתוך $m\langle v_x^2\rangle = k_BT$ או מתוך שני הגורמים של סעיפים ב' וג'.
            weight: 2
          - text: >-
              ציון שני האפקטים: יותר תנע לפגיעה, פחות פגיעות.
          - text: >-
              $P_B/P_A = 4$ במהירויות שוות.
          - text: >-
              מסקנה שהלחץ פרופורציוני לצפיפות האנרגיה הקינטית.
          - text: >-
              בדיקת גבולות, למשל מסות שוות או $m \to 0$ במהירות קבועה.

  - id: Q-4-bagrut-3
    type: bagrut
    title: >-
      יציב — עד כמה?
    prompt: >-
      הפיזור היחסי של הלחץ של מדגם של $N$ מולקולות של גז אידיאלי הוא $\sigma_P/\langle P\rangle \simeq N^{-1/2}$. אוויר בטמפרטורת החדר נמצא ב-$1.013\cdot10^5\,\text{Pa}$ וב-$300\,\text{K}$; קחו $k_B = 1.381\cdot10^{-23}\,\text{J/K}$.
    parts:
      - label: א
        type: numeric
        points: 5
        objectives: [OBJ-4.1-4]
        prompt: >-
          מד לחץ מבחין בשינוי יחסי של חלק אחד מתוך $10^4$. מאיזה מספר מולקולות ומעלה הפיזור של הלחץ של מדגם קטן מכדי שהמד יבחין בו?
        answer: 1.0e8
        unit: ''
        tolerance: 0.05
        correctFeedback: >-
          $N^{-1/2} < 10^{-4}$ נותן $N > 10^8$.
        wrongFeedback: >-
          השוו את $N^{-1/2}$ לרזולוציה ופתרו עבור $N$.
        commonWrong:
          - value: 1.0e4
            feedback: >-
              כך $1/N$ שווה לרזולוציה. הפלוקטואציה היא $1/\sqrt N$, ולכן $N$ הוא הרזולוציה בחזקת $-2$.
      - label: ב
        type: numeric
        points: 5
        objectives: [OBJ-4.1-4]
        prompt: >-
          מיקרומטר מעוקב של אוויר מכיל כ-$2.5\cdot10^7$ מולקולות. העריכו את הפלוקטואציה היחסית של הלחץ שלו.
        answer: 2.0e-4
        unit: ''
        tolerance: 0.05
        correctFeedback: >-
          $1/\sqrt{2.5\cdot10^7} = 2.0\cdot10^{-4}$: שני חלקים מעשרת אלפים, על גבול מה שהמד של סעיף א' יכול לראות.
        wrongFeedback: >-
          חשבו את $N^{-1/2}$.
        commonWrong:
          - value: 4.0e-8
            feedback: >-
              זה $1/N$. הפיזור של סכום של $N$ איברים גדל כמו $\sqrt N$ והממוצע כמו $N$.
      - label: ג
        type: open
        points: 8
        objectives: [OBJ-4.1-1, OBJ-4.1-4]
        prompt: >-
          נגדיר: המדגם הקטן ביותר שבו הלחץ הוא עדיין מושג שימושי הוא זה שהפלוקטואציה שלו מגיעה ל-$1\%$. העריכו את נפחו עבור אוויר החדר, והשוו לחיידק שרוחבו כ-$1\,\mu\text{m}$.
        solution:
          - kind: law
            text: >-
              $\sigma_P/\langle P\rangle = N^{-1/2}$, ו-$V = Nk_BT/P$ לנפח שמכיל $N$ מולקולות.
          - kind: manipulation
            text: >-
              $N = (0.01)^{-2} = 10^4$, אחר כך $V = Nk_BT/P$ וצלע הקובייה $\ell = V^{1/3}$.
          - kind: substitution
            text: >-
              $V = 10^4\cdot1.381\cdot10^{-23}\cdot300/1.013\cdot10^5 = 4.1\cdot10^{-22}\,\text{m}^3$, ולכן $\ell = 74\,\text{nm}$. נפח של חיידק, כ-$10^{-18}\,\text{m}^3$, גדול פי $2.4\cdot10^3$ בערך ומכיל כ-$2.5\cdot10^7$ מולקולות, כמו בסעיף ב': פלוקטואציה של $2\cdot10^{-4}$.
          - kind: units
            text: >-
              $\text{J/K}\cdot\text{K}/\text{Pa} = \text{m}^3$.
          - kind: result
            text: >-
              כ-$4\cdot10^{-22}\,\text{m}^3$, קובייה שצלעה $74\,\text{nm}$, קטנה פי אלפיים בערך מחיידק. בקנה המידה של חיידק לחץ האוויר כבר יציב עד $0.02\%$.
        rubric:
          - text: >-
              $N = 10^4$ מתנאי ה-$1\%$.
          - text: >-
              $V \approx 4\cdot10^{-22}\,\text{m}^3$, קובייה של כ-$74\,\text{nm}$.
          - text: >-
              השוואה סבירה לחיידק (גורם של כ-$10^3$ בנפח).
      - label: ד
        type: open
        points: 7
        objectives: [OBJ-4.1-1, OBJ-4.1-4]
        prompt: >-
          הסבירו למה התשובה לסעיף ג' היא טענה על $N$ ולא על אורך. הדגימו זאת בעזרת ארגון בלחץ של עשר אטמוספרות וב-$300\,\text{K}$, ובדקו את החוק במקרה גבולי.
        solution:
          - kind: law
            text: >-
              הפלוקטואציה תלויה רק ב-$N$; אורך נכנס רק דרך הצפיפות המספרית, $N = nV$.
          - kind: manipulation
            text: >-
              בצפיפות גדולה פי עשרה, אותם $N = 10^4$ נכנסים בעשירית מהנפח, ולכן "המדגם השימושי הקטן ביותר" מתכווץ פי $10^{1/3} = 2.15$ באורך.
          - kind: substitution
            text: >-
              $V = 10^4\cdot1.381\cdot10^{-23}\cdot300/1.013\cdot10^6 = 4.1\cdot10^{-23}\,\text{m}^3$, קובייה שצלעה $34\,\text{nm}$, מול $74\,\text{nm}$ באטמוספרה אחת.
          - kind: limit
            text: >-
              כש-$N \to \infty$ הפלוקטואציה נעלמת: הגבול התרמודינמי, שבו הלחץ הוא תכונה חדה. ב-$N = 1$ היא $100\%$: למולקולה בודדת אין לחץ יציב בכלל.
          - kind: result
            text: >-
              "מאקרוסקופי" פירושו $N$ גדול, לא גודל גדול: ארגון צפוף מגיע ליציבות של $1\%$ בקובייה שצלעה $34\,\text{nm}$ במקום $74\,\text{nm}$.
        rubric:
          - text: >-
              קביעה שרק $N$ נכנס לפלוקטואציה, ואורך רק דרך הצפיפות.
            weight: 2
          - text: >-
              הדוגמה של הארגון, כ-$34\,\text{nm}$.
          - text: >-
              בדיקת גבולות: $N \to \infty$ או $N = 1$.

  - id: Q-4-bagrut-4
    type: bagrut
    title: >-
      איפה המודל נשבר
    prompt: >-
      הגזירה של חוק הגזים האידיאליים הניחה חלקיקים נקודתיים שאף פעם לא מקיימים אינטראקציה. נתבונן בארגון ב-$300\,\text{K}$ וב-$1.013\cdot10^5\,\text{Pa}$; קוטרו של אטום ארגון כ-$0.34\,\text{nm}$. קחו $k_B = 1.381\cdot10^{-23}\,\text{J/K}$, $h = 6.626\cdot10^{-34}\,\text{J·s}$ ומסת אטום ארגון $6.64\cdot10^{-26}\,\text{kg}$.
    parts:
      - label: א
        type: numeric
        points: 6
        objectives: [OBJ-4.1-5]
        prompt: >-
          העריכו את חלק הנפח שהאטומים עצמם תופסים.
        answer: 5.0e-4
        unit: ''
        tolerance: 0.06
        correctFeedback: >-
          $n = P/k_BT = 2.45\cdot10^{25}\,\text{m}^{-3}$ ואטום אחד ממלא $\tfrac{\pi}{6}d^3 = 2.06\cdot10^{-29}\,\text{m}^3$, ולכן החלק הוא $5.0\cdot10^{-4}$: הזנחת גודל האטומים היא קירוב מצוין כאן.
        wrongFeedback: >-
          הכפילו את הצפיפות המספרית $n = P/k_BT$ בנפח של אטום אחד, $\tfrac{\pi}{6}d^3$.
        commonWrong:
          - value: 4.0e-3
            feedback: >-
              כאן הקוטר שימש כרדיוס: נפח כדור שקוטרו $d$ הוא $\tfrac{\pi}{6}d^3$.
      - label: ב
        type: mc
        points: 5
        objectives: [OBJ-4.1-5]
        prompt: >-
          ב-$N$, $V$ ו-$T$ קבועים, האם המשיכה בין האטומים מעלה את הלחץ או מורידה אותו ביחס לערך האידיאלי?
        choices:
          - text: >-
              מורידה: אטום שעומד לפגוע בדופן נמשך לאחור על ידי האטומים שמאחוריו.
            correct: true
            feedback: >-
              נכון. האטומים ליד הדופן נמשכים פנימה על ידי שכניהם, ולכן הם מעבירים פחות תנע: זה האיבר $a$ במשוואת ואן דר ואלס (מודול 14).
          - text: >-
              מעלה: המשיכה מקרבת את האטומים והגז דוחף חזק יותר.
            feedback: >-
              קירוב האטומים זה לזה הוא ההפך מדחיפה על הדופן: המשיכה פועלת נגד התנע שמועבר.
          - text: >-
              לא משפיעה: רק ההתנגשויות בדופן קובעות.
            feedback: >-
              הכוחות בין האטומים משנים את התנע שבו האטומים מגיעים לדופן, ולכן הם משפיעים.
          - text: >-
              מעלה: האטומים מאיצים כשהם מתקרבים זה לזה.
            feedback: >-
              בטמפרטורה נתונה האנרגיה הקינטית הממוצעת קבועה; ליד הדופן, המשיכה השקולה של שאר האטומים פונה פנימה.
      - label: ג
        type: open
        points: 14
        objectives: [OBJ-4.1-5]
        prompt: >-
          שני סטודנטים חלוקים. אחד אומר שחוק הגזים האידיאליים נכשל בטמפרטורה נמוכה כי האטומים נעים לאט מכדי לפגוע בדפנות לעיתים קרובות. השני אומר שהוא נכשל כי המשיכה והסטטיסטיקה הקוונטית נעשות חשובות. הכריעו ביניהם, העריכו כמה רחוק ארגון בטמפרטורת החדר מהתחום הקוונטי, ואמרו מה קורה לתקפות המודל כש-$T \to \infty$ בצפיפות קבועה וכשהצפיפות $\to 0$ ב-$T$ קבועה.
        solution:
          - kind: law
            text: >-
              במודל $P = Nk_BT/V$ נכון בכל מהירות; המודל נכשל כשהנחותיו נכשלות: אין כוחות בין אטומים (משווים את אנרגיית המשיכה ל-$k_BT$), וחלקיקים קלאסיים (משווים את אורך הגל התרמי $\lambda = h/\sqrt{2\pi m k_BT}$ למרחק $n^{-1/3}$).
          - kind: manipulation
            text: >-
              הסטודנט הראשון טועה: אטומים איטיים פוגעים לעיתים רחוקות יותר וחלש יותר, והלחץ יורד ביחס ישר ל-$T$, וזה בדיוק מה שחוק הגזים האידיאליים אומר. השני צודק: ב-$T$ נמוכה המשיכה כבר לא קטנה לעומת $k_BT$, ו-$\lambda$ גדל כמו $T^{-1/2}$ עד שהוא מגיע למרחק.
          - kind: substitution
            text: >-
              $\lambda = 6.626\cdot10^{-34}/\sqrt{2\pi\cdot6.64\cdot10^{-26}\cdot1.381\cdot10^{-23}\cdot300} = 1.6\cdot10^{-11}\,\text{m}$, מול מרחק $n^{-1/3} = 3.4\cdot10^{-9}\,\text{m}$: יחס של $5\cdot10^{-3}$, עמוק בתחום הקלאסי.
          - kind: limit
            text: >-
              $T \to \infty$ בצפיפות קבועה: $k_BT$ גובר על המשיכה ו-$\lambda \to 0$, ולכן שני התיקונים האלה נעלמים; הנפח העצמי של האטומים לא נעלם, כי הוא תלוי רק בצפיפות, ולכן הגז מתקרב לחוק האידיאלי רק אם הוא גם דליל. צפיפות ששואפת לאפס ב-$T$ קבועה: האטומים רחוקים זה מזה יותר ויותר, הגודל והמשיכה שלהם מפסיקים להשפיע והמרחק גובר על $\lambda$; אידיאלי. החוק נכשל לכיוון $T$ נמוכה וצפיפות גבוהה.
          - kind: units
            text: >-
              $\lambda$: $\text{J·s}/\sqrt{\text{kg}\cdot\text{J}} = \text{J·s}/(\text{kg}\cdot\text{m/s}) = \text{m}$.
          - kind: result
            text: >-
              הסטודנט השני צודק. לארגון בטמפרטורת החדר $\lambda/n^{-1/3} \approx 5\cdot10^{-3}$, רחוק מאפקטים קוונטיים; כש-$T \to \infty$ תיקוני המשיכה והקוונטים נעלמים אבל תיקון הגודל נשאר, ולכן חוק הגזים האידיאליים מושג רק כשהצפיפות שואפת לאפס; הוא נכשל לכיוון $T$ נמוכה וצפיפות גבוהה.
        rubric:
          - text: >-
              דחיית הטיעון הראשון: איטיות לבדה לא שוברת את $P = Nk_BT/V$.
            weight: 2
          - text: >-
              ציון המשיכה (מול $k_BT$) וסטטיסטיקה קוונטית ($\lambda$ מול המרחק).
            weight: 2
          - text: >-
              $\lambda \approx 1.6\cdot10^{-11}\,\text{m}$ מול מרחק של כ-$3.4\,\text{nm}$.
          - text: >-
              שני הגבולות: כש-$T \to \infty$ תיקוני המשיכה והקוונטים נעלמים אבל תיקון הגודל נשאר; כשהצפיפות שואפת לאפס כולם נעלמים.
