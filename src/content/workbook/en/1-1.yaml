  - id: W-1.1-c2
    stars: 2
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      Two Einstein solids share $q = 100$ quanta of energy $\varepsilon$: A has $N_A = 150$ oscillators and B has $N_B = 250$. A real Einstein solid's quanta cannot be told apart, so $N$ oscillators hold $q$ quanta in $\Omega(N, q) = \dfrac{(q + N - 1)!}{q!\,(N - 1)!}$ ways. Some values: for $q_A = 9, 10, 11$, $\Omega_A = 1.3\cdot10^{14}$, $2.1\cdot10^{15}$, $3.1\cdot10^{16}$; for the matching $q_B = 91, 90, 89$, $\Omega_B = 2.9\cdot10^{84}$, $7.8\cdot10^{83}$, $2.1\cdot10^{83}$. The entropy is $S = k_B\ln\Omega$, and the temperature is defined by $1/T = \partial S/\partial U$.
      (a) Use the data to calculate the temperatures of both solids when $q_A = 10$, in units of $\varepsilon/k_B$ and in kelvin for $\varepsilon = 0.1\,\text{eV}$. Which is larger, and which way will energy flow?
      (b) Show, with Stirling's approximation, that $k_BT = \varepsilon/\ln(1 + N/q)$. Compare it with (a), and with this lesson's equipartition temperature $q\varepsilon/(Nk_B)$.
      (c) At which $q_A$ are the two temperatures equal? Compare with the most probable division of the energy (a computer finds $q_A = 37$, with probability $0.073$) and with the hop model's balance condition $q_A/N_A = q_B/N_B$.
      (d) The entropic and the equipartition temperatures give the same body different numbers. Explain why they nevertheless sort bodies into the same classes of mutual equilibrium, and what that says about what the zeroth law fixes and what it leaves open.
    answer: >-
      (a) $k_BT_A/\varepsilon = 0.37$ ($426\,\text{K}$), $k_BT_B/\varepsilon = 0.76$ ($878\,\text{K}$); B is hotter, and energy flows from B to A. (b) $0.361$ and $0.752$; the equipartition values, $0.067$ and $0.36$, are $5.5$ and $2.1$ times too low, both solids being far from the classical regime. (c) Between $q_A = 37$ and $38$, at $37.5$ in Stirling's approximation, where the most probable division also lies and where $q_A/N_A = q_B/N_B$. (d) Among Einstein solids with the same $\varepsilon$, both are increasing functions of $q/N$, and equilibrium between two such solids is equal $q/N$: the zeroth law fixes the classes, not the numbers given to them. Across solids of different $\varepsilon$, or a solid and a gas, $q\varepsilon/(Nk_B)$ does not label the classes.
    solution:
      - kind: law
        text: >-
          $1/T = \partial S/\partial U$ with $U = q\varepsilon$, evaluated by a centred difference: when $q_A$ goes from $9$ to $11$, $q_B$ goes from $91$ to $89$. Stirling: $\ln n! \approx n\ln n - n$. Energy flows from the higher temperature to the lower.
      - kind: manipulation
        text: >-
          (a) $\dfrac{1}{k_BT_A} = \dfrac{\ln\Omega_A(11) - \ln\Omega_A(9)}{2\varepsilon}$ and $\dfrac{1}{k_BT_B} = \dfrac{\ln\Omega_B(91) - \ln\Omega_B(89)}{2\varepsilon}$. (b) For large $q$ and $N$, $\ln\Omega \approx (q + N)\ln(q + N) - q\ln q - N\ln N$, so $\partial\ln\Omega/\partial q = \ln(q + N) - \ln q = \ln(1 + N/q)$, and $1/k_BT = \ln(1 + N/q)/\varepsilon$.
      - kind: formula
        text: >-
          $k_BT = \dfrac{\varepsilon}{\ln(1 + N/q)} \qquad T_A = T_B \iff \dfrac{q_A}{N_A} = \dfrac{q_B}{N_B}$
      - kind: reasoning
        text: >-
          (c) By the formula, $T$ depends on $q/N$ alone, so the temperatures match when $q_A/150 = (100 - q_A)/250$, $q_A = 37.5$; the exact counts put the crossing between $37$ ($0.623$ against $0.628$) and $38$ ($0.632$ against $0.623$). The most probable division maximizes $\Omega_A\Omega_B$, that is $S_A + S_B$, where $\partial S_A/\partial U_A = \partial S_B/\partial U_B$: equal temperatures, at $37$ (probability $0.0734$) and $38$ ($0.0730$). The hop model, with its labelled quanta and a different count, balances its flows at the same $q_A/N_A = q_B/N_B$.
      - kind: reasoning
        text: >-
          (d) Two Einstein solids with the same $\varepsilon$ are in equilibrium when $q/N$ is equal, and both $q\varepsilon/(Nk_B)$ and $\varepsilon/\big(k_B\ln(1 + N/q)\big)$ are increasing functions of $q/N$: each gives equal numbers to exactly the bodies that are in equilibrium with one another. That is all the zeroth law asks of a temperature. It defines the classes; which number labels a class is a further choice, an empirical temperature scale. The entropic one is singled out by the second law, as the absolute temperature (module 9); the equipartition label agrees with it only in the classical limit, $k_BT \approx \varepsilon(q/N + \tfrac12)$ for $q \gg N$.
      - kind: limit
        text: >-
          For $q \gg N$, $\ln(1 + N/q) \approx N/q - N^2/(2q^2)$ and $k_BT \approx \varepsilon(q/N + \tfrac12)$: equipartition, up to the zero-point offset. For $q \ll N$, $k_BT \approx \varepsilon/\ln(N/q)$, far above $q\varepsilon/N$: here A has one quantum per $15$ oscillators, deep in the quantum regime that the lesson's model specification lists as a failure mode.
      - kind: units
        text: >-
          $\ln\Omega$ is a pure number, so $\partial S/\partial U$ is $k_B$ per joule, and $k_BT$ comes out in units of $\varepsilon$; $T = (k_BT/\varepsilon)\,\varepsilon/k_B$, with $\varepsilon/k_B = 0.1\,\text{eV}/k_B = 1160\,\text{K}$.
      - kind: substitution
        text: >-
          (a) $\ln(3.1\cdot10^{16}/1.3\cdot10^{14}) = 5.47$, so $k_BT_A/\varepsilon = 2/5.47 = 0.365$; from the exact counts, $0.367$, $426\,\text{K}$. $\ln(2.9\cdot10^{84}/2.1\cdot10^{83}) = 2.63$, $k_BT_B/\varepsilon = 0.762$; exact $0.756$, $878\,\text{K}$. (b) $1/\ln(1 + 150/10) = 1/\ln 16 = 0.361$; $1/\ln(1 + 250/90) = 0.752$. Equipartition: $10/150 = 0.067$ and $90/250 = 0.36$. At $q_A = 37.5$ both solids have $q/N = 0.25$ and $k_BT = \varepsilon/\ln 5 = 0.621\,\varepsilon$, $721\,\text{K}$.
      - kind: result
        text: >-
          (a) $T_A = 0.37\,\varepsilon/k_B = 426\,\text{K}$, $T_B = 0.76\,\varepsilon/k_B = 878\,\text{K}$; energy flows from B to A. (b) $k_BT = \varepsilon/\ln(1 + N/q)$ matches the data; equipartition is several times too low at these energies. (c) The temperatures meet at $q_A \approx 37.5$, the most probable division and the hop model's balance point alike. (d) Every increasing function of $q/N$ labels the same equilibrium classes: the zeroth law guarantees the classes, and the scale is a separate matter.
