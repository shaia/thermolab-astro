# Lesson 0.1 workbook. Problem 02 is ThermoLab's problem 1 (the honest die), problem 08 its problem 6 (the
# computational one); the rest are new, and none repeats ThermoLab's problems 2 to 5, which are review problems.
# The dice numbers in problems 08 and 10 were computed for this workbook with ThermoLab's thermolab.sampling and
# thermolab.validation (64 seeds) and by exact convolution. ThermoLab kept its solutions with the instructor; this
# platform publishes them, by the author's decision. Take k_B = 1.381e-23 J/K, N_A = 6.022e23 /mol, u = 1.661e-27 kg.
lang: en
lesson: '0.1'
practice:
  - id: W-0.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-1]
    prompt: >-
      A fair coin comes up heads on each of its first eight tosses. A friend says: "By the law of large numbers the fraction of heads has to come back to one half, so tails is now more likely than heads."
      (a) What is the probability of tails on the ninth toss?
      (b) After $1000$ further tosses, what do you expect for the excess, the number of heads minus half the number of tosses? What do you expect for the fraction of heads?
      (c) So how does the fraction of heads come back to one half?
    answer: >-
      (a) $1/2$: the coin has no memory. (b) The expected excess stays $+4$, while its random wander over the new tosses is about $\pm16$; the expected fraction is $508/1008 = 0.504$. (c) By dilution, not compensation: the excess of $4$ is never paid back, but divided by the number of tosses it goes to zero, $0.004$ after a thousand tosses and $4\cdot10^{-6}$ after a million.
    solution:
      - kind: reasoning
        text: >-
          The tosses are independent: the probability of tails on any toss is $1/2$, whatever the earlier tosses showed. Nothing in the coin records the eight heads, so nothing can make it owe tails.
      - kind: reasoning
        text: >-
          After eight heads the excess is $8 - 8/2 = +4$. Each further toss adds $+\tfrac12$ (heads) or $-\tfrac12$ (tails) to it, with expectation zero, so the expected excess stays $+4$ forever. Its random wander grows: the number of heads in $n$ tosses has standard deviation $\sqrt{n}/2$, about $16$ for $n = 1000$.
      - kind: reasoning
        text: >-
          The fraction of heads is one half plus the excess divided by $n$. With the excess expected to stay at $4$ while $n$ grows, the expected fraction goes to $\tfrac12$: $0.504$ after $1008$ tosses, $0.500004$ after a million. The typical wander of the fraction, $\tfrac12/\sqrt{n}$, shrinks too.
      - kind: result
        text: >-
          (a) $1/2$. (b) An expected excess of $+4$, and a fraction of about $0.504$. (c) The law of large numbers works by dilution: the early excess is never cancelled, only divided by an ever larger number of tosses.

  - id: W-0.1-02
    level: basic
    objectives: [OBJ-0.1-2]
    prompt: >-
      The honest die.
      (a) From the definitions, compute the mean $\mu_1$ and variance $\sigma_1^2$ of one fair six-sided die. Show the sums; do not quote a closed form.
      (b) A die is loaded so that six comes up with probability $1/3$ and each of the other five faces with probability $2/15$. Compute its mean and variance, and say in one sentence why the variance moved in the direction it did.
      (c) Two fair dice are rolled independently. By enumerating all $36$ equally likely outcomes, compute $\langle X + Y\rangle$ and $\operatorname{Var}(X + Y)$ directly, and check both against the addition rules.
      (d) Now let $Y = X$: the "second die" is the first, read twice. Compute $\operatorname{Var}(X + Y)$ and compare with (c). Which hypothesis of the addition rule has been violated, and by how much does the answer change?
    answer: >-
      (a) $\mu_1 = 7/2$, $\sigma_1^2 = 35/12 = 2.917$. (b) $\mu = 4$, $\sigma^2 = 10/3 = 3.333$: the load moved probability onto six, one of the two faces farthest from the old mean. (c) $\langle X + Y\rangle = 7$, $\operatorname{Var}(X + Y) = 35/6 = 5.833$, as $\mu_1 + \mu_1$ and $\sigma_1^2 + \sigma_1^2$. (d) $35/3 = 11.67$, twice (c): the covariance is no longer zero but $\sigma_1^2$, which adds $2\sigma_1^2 = 5.83$.
    solution:
      - kind: given
        text: >-
          Fair die: $p_k = 1/6$ for $k = 1, \dots, 6$. Loaded die: $p_6 = 1/3$, $p_k = 2/15$ for $k = 1, \dots, 5$, which sum to $10/15 + 1/3 = 1$.
      - kind: law
        text: >-
          $\mu = \sum_k p_kx_k$, $\sigma^2 = \sum_k p_kx_k^2 - \mu^2$. For any two random variables $\langle X + Y\rangle = \langle X\rangle + \langle Y\rangle$ and $\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y) + 2\operatorname{Cov}(X, Y)$.
      - kind: manipulation
        text: >-
          (a) $\mu_1 = (1 + 2 + 3 + 4 + 5 + 6)/6 = 21/6 = 7/2$; $\langle X^2\rangle = (1 + 4 + 9 + 16 + 25 + 36)/6 = 91/6$; $\sigma_1^2 = 91/6 - 49/4 = (182 - 147)/12 = 35/12$.
      - kind: manipulation
        text: >-
          (b) $\mu = \tfrac{2}{15}(1 + 2 + 3 + 4 + 5) + \tfrac13\cdot6 = 2 + 2 = 4$; $\langle X^2\rangle = \tfrac{2}{15}(1 + 4 + 9 + 16 + 25) + \tfrac13\cdot36 = \tfrac{22}{3} + 12 = \tfrac{58}{3}$; $\sigma^2 = \tfrac{58}{3} - 16 = \tfrac{10}{3}$.
      - kind: manipulation
        text: >-
          (c) The sums $2, 3, \dots, 12$ occur in $1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1$ of the $36$ outcomes. Their total is $252$, so $\langle X + Y\rangle = 252/36 = 7$. The total of the squared sums is $4 + 18 + 48 + 100 + 180 + 294 + 320 + 324 + 300 + 242 + 144 = 1974$, so $\langle (X + Y)^2\rangle = 1974/36$ and $\operatorname{Var}(X + Y) = 1974/36 - 49 = 210/36 = 35/6$.
      - kind: manipulation
        text: >-
          (d) $X + Y = 2X$, so $\operatorname{Var}(2X) = 4\sigma_1^2 = 35/3$. In the addition rule, $\operatorname{Cov}(X, X) = \operatorname{Var}(X) = \sigma_1^2$, not zero: the hypothesis of independence (more precisely, of zero covariance) fails.
      - kind: limit
        text: >-
          Load the die completely, so that six always comes up: the mean goes to $6$ and the variance to $0$, as for any quantity that never varies. The partial load of (b) raised the variance because it moved weight from faces 1 to 5 onto 6, an extreme face.
      - kind: units
        text: >-
          Faces are pure numbers; so are every mean and variance here.
      - kind: substitution
        text: >-
          $35/12 = 2.917$, $10/3 = 3.333$, $35/6 = 5.833$, $35/3 = 11.67$.
      - kind: result
        text: >-
          (a) $\mu_1 = 3.5$, $\sigma_1^2 = 2.917$. (b) $\mu = 4$, $\sigma^2 = 3.333$. (c) $7$ and $5.833$, exactly $2\mu_1$ and $2\sigma_1^2$. (d) $11.67$: twice the independent answer, because the covariance term $2\sigma_1^2$ no longer vanishes. Variances add only when the covariance does.

  - id: W-0.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-7]
    prompt: >-
      Give each claim one of the course's seven epistemic labels (definition, empirical law, theorem, model assumption, approximation, numerical observation, open question), and say in a few words why.
      (a) "The standard deviation is the square root of the variance."
      (b) "Over 64 seeds, the fitted exponent of the relative spread of an average of dice was $-0.5007$, scattering by $0.004$ from seed to seed."
      (c) "The molecules of a dilute gas move independently of one another."
      (d) "The variance of a sum of $N$ independent random variables of variance $\sigma^2$ is $N\sigma^2$."
      (e) "Near room temperature, the electrical resistance of a copper wire rises by about $0.4\%$ per kelvin."
      (f) "$e^{-x} \approx 1 - x$ for $|x| \ll 1$."
      (g) "Why the early universe was in a state of such low entropy."
      (h) Which two fields of a model specification tell you where the model's answers will be wrong, and where the model stops describing anything at all?
    answer: >-
      (a) definition; (b) numerical observation; (c) model assumption; (d) theorem; (e) empirical law; (f) approximation; (g) open question. (h) "Ignored" and "Failure modes".
    solution:
      - kind: reasoning
        text: >-
          (a) names a quantity: useful or not, never true or false. (d) follows by algebra from the definition of variance and the vanishing of covariances; nothing measured enters it. (f) is a controlled error: the next term is $x^2/2$, so it is good to $0.5\%$ at $x = 0.1$ and fails for $|x|$ of order one.
      - kind: reasoning
        text: >-
          (b) is what a computation showed, evidence that (d) was implemented correctly but not the reason (d) is true; it carries a seed scatter, as a numerical observation should. (c) is a deliberate simplification: in a dense gas or a liquid it is false, and the model says so. (e) summarizes measurement, could have come out otherwise, and holds only in the range where it was tested.
      - kind: reasoning
        text: >-
          (g) is unsettled; the course marks such places rather than pretending to answer them. (h) The field "Ignored" lists the physics left out, and so where the answers will be wrong; "Failure modes" lists the conditions under which the model stops being a description at all.
      - kind: result
        text: >-
          Definition, numerical observation, model assumption, theorem, empirical law, approximation, open question; and "Ignored" and "Failure modes" are the two fields worth reading first.

  - id: W-0.1-04
    level: basic
    objectives: [OBJ-0.1-4]
    prompt: >-
      A chemistry text says a flask holds $2.0$ litres of nitrogen at $1.5$ atmospheres and $25\,^\circ\text{C}$, and computes with $PV = nRT$.
      (a) Convert to SI ($1\,\text{atm} = 101\,325\,\text{Pa}$), and find the number of molecules $N$ from $PV = Nk_BT$ and the amount $n$ in moles. Check that $R = N_Ak_B$ gives the same $nR = Nk_B$.
      (b) In an isothermal atmosphere the density falls with height as $\exp(-mgh/k_BT)$. Show that the exponent is a pure number, and evaluate the factor for nitrogen ($m = 28.0\,u$) at $h = 1000\,\text{m}$ and $T = 300\,\text{K}$, with $g = 9.81\,\text{m/s}^2$.
      (c) A student writes the factor as $\exp(-mgh/T)$. What is wrong, in one sentence?
    answer: >-
      (a) $P = 1.52\cdot10^5\,\text{Pa}$, $V = 2.0\cdot10^{-3}\,\text{m}^3$, $T = 298.15\,\text{K}$; $N = 7.38\cdot10^{22}$, $n = 0.123\,\text{mol}$; $R = 8.316\,\text{J/(mol K)}$ from these constants. (b) $mgh/k_BT = 0.110$, a factor of $0.896$. (c) $mgh/T$ is in joules per kelvin, not a pure number, so its exponential means nothing; $k_B$ is what converts the temperature to an energy.
    solution:
      - kind: given
        text: >-
          $P = 1.5 \times 101\,325\,\text{Pa}$, $V = 2.0 \times 10^{-3}\,\text{m}^3$, $T = 273.15 + 25 = 298.15\,\text{K}$; $m = 28.0 \times 1.661\cdot10^{-27}\,\text{kg}$.
      - kind: law
        text: >-
          $PV = Nk_BT$ with $N$ a plain count; $n = N/N_A$ and $R = N_Ak_B$. The argument of an exponential must be dimensionless.
      - kind: formula
        text: >-
          $N = \dfrac{PV}{k_BT} \qquad n = \dfrac{N}{N_A} \qquad \dfrac{\rho(h)}{\rho(0)} = \exp\left(-\dfrac{mgh}{k_BT}\right)$
      - kind: units
        text: >-
          $\text{Pa}\cdot\text{m}^3 = \text{J}$, so $PV/(k_BT)$ is $\text{J}/((\text{J/K})\cdot\text{K})$: a pure number, as a count must be. $mgh$ is $\text{kg}\cdot\text{m/s}^2\cdot\text{m} = \text{J}$, and $k_BT$ is in joules: the exponent is dimensionless. $mgh/T$ would be in $\text{J/K}$.
      - kind: substitution
        text: >-
          (a) $P = 1.520\cdot10^5\,\text{Pa}$, $PV = 304.0\,\text{J}$, $k_BT = 4.117\cdot10^{-21}\,\text{J}$, $N = 7.38\cdot10^{22}$, $n = 7.38\cdot10^{22}/6.022\cdot10^{23} = 0.1226\,\text{mol}$. $N_Ak_B = 8.316\,\text{J/(mol K)}$ (the tabulated $8.314$, to the precision of these constants), and $nR = Nk_B = 1.020\,\text{J/K}$. (b) $m = 4.65\cdot10^{-26}\,\text{kg}$, $mgh = 4.56\cdot10^{-22}\,\text{J}$, $k_BT = 4.14\cdot10^{-21}\,\text{J}$; ratio $0.110$, $e^{-0.110} = 0.896$.
      - kind: limit
        text: >-
          At $h = 0$ the factor is $1$; as $T \to \infty$ it goes to $1$ at every height (thermal motion beats gravity), and as $m$ grows it falls faster (heavy molecules stay low). A formula with $mgh/T$ in the exponent would change its value when the temperature is quoted in other units, which no physical prediction may do.
      - kind: result
        text: >-
          (a) $N = 7.4\cdot10^{22}$ molecules, $n = 0.123\,\text{mol}$, and $nR = Nk_B$. (b) The density $1\,\text{km}$ up is $0.896$ of its value at the ground. (c) The exponent must be a pure number; without $k_B$ it carries $\text{J/K}$. This course writes $k_B$ every time.

  - id: W-0.1-05
    level: mid
    objectives: [OBJ-0.1-2, OBJ-0.1-3]
    prompt: >-
      In a magnetic field, each of $N$ independent atomic moments points up, $s = +1$, with probability $p = 0.6$, and down, $s = -1$, otherwise.
      (a) Find the mean and variance of one $s$.
      (b) For $N = 10^4$, find the mean and standard deviation of the total $M = \sum_i s_i$, and of the magnetization per moment $m = M/N$.
      (c) Find the relative spread $\sigma_M/\langle M\rangle$. How many moments would bring it down to $1\%$?
      (d) What happens to the relative spread at $p = \tfrac12$? What then measures how steady $m$ is?
    answer: >-
      (a) $\mu_1 = 2p - 1 = 0.2$, $\sigma_1^2 = 4p(1 - p) = 0.96$. (b) $\langle M\rangle = 2000$, $\sigma_M = 98.0$; $\langle m\rangle = 0.2$, $\sigma_m = 0.0098$. (c) $0.049$; $N = 2.4\cdot10^5$. (d) $\langle M\rangle = 0$, so the ratio is undefined; $\sigma_m = 1/\sqrt N$ still shrinks, and is measured against the natural scale of $m$, which is $1$.
    solution:
      - kind: given
        text: >-
          $s = +1$ with probability $p = 0.6$, $s = -1$ with probability $0.4$; $N = 10^4$; target relative spread $0.01$.
      - kind: law
        text: >-
          $\mu = \sum_k p_kx_k$, $\sigma^2 = \langle s^2\rangle - \mu^2$; for $N$ independent copies, $\langle M\rangle = N\mu_1$ and $\sigma_M = \sigma_1\sqrt N$; dividing by $N$ divides the standard deviation by $N$.
      - kind: manipulation
        text: >-
          $\langle s\rangle = p - (1 - p) = 2p - 1$. Since $s^2 = 1$ always, $\sigma_1^2 = 1 - (2p - 1)^2 = 4p(1 - p)$. Then $\sigma_M/\langle M\rangle = \sigma_1/(\mu_1\sqrt N)$, which equals $\varepsilon$ when $N = (\sigma_1/\mu_1)^2/\varepsilon^2$.
      - kind: formula
        text: >-
          $\dfrac{\sigma_M}{\langle M\rangle} = \dfrac{\sigma_m}{\langle m\rangle} = \dfrac{2\sqrt{p(1 - p)}}{2p - 1}\,N^{-1/2}$
      - kind: limit
        text: >-
          At $p = 1$ every moment is up: $\sigma_1 = 0$, $M = N$ exactly. At $p = \tfrac12$ the mean is zero and the coefficient diverges: a ratio to a zero mean measures nothing. Then $\sigma_m = 1/\sqrt N$ is compared with the range of $m$, from $-1$ to $1$, and it still falls as $N^{-1/2}$.
      - kind: units
        text: >-
          $s$, $M$ and $m$ are pure numbers.
      - kind: substitution
        text: >-
          (a) $0.2$ and $4 \times 0.6 \times 0.4 = 0.96$, $\sigma_1 = 0.980$. (b) $10^4 \times 0.2 = 2000$; $0.980 \times 100 = 98.0$; $0.2$ and $0.0098$. (c) $98.0/2000 = 0.049$; $N = (0.980/0.2)^2/10^{-4} = 24.0 \times 10^4$.
      - kind: result
        text: >-
          (a) $\mu_1 = 0.2$, $\sigma_1^2 = 0.96$. (b) $M = 2000 \pm 98$, $m = 0.200 \pm 0.010$. (c) $4.9\%$; $2.4 \times 10^5$ moments for $1\%$, twenty-four times as many for a spread five times smaller. (d) With zero mean, quote $\sigma_m = N^{-1/2}$ on the scale of $m$ itself.

  - id: W-0.1-06
    level: mid
    objectives: [OBJ-0.1-5, OBJ-0.1-6]
    prompt: >-
      (a) A metal cylinder has radius $r = 5.00\,\text{cm}$ and height $h = 10.0\,\text{cm}$. Write the total differential of $V = \pi r^2h$, and use it to estimate the change in volume when $r$ grows by $1.0\,\text{mm}$ and $h$ shrinks by $2.0\,\text{mm}$. Compare with the exact change.
      (b) Compute $(\partial V/\partial r)_h$, and $(\partial V/\partial r)_k$, where $k = h/r$ is the shape, held fixed. Why do they differ?
      (c) Integrate $\omega = x\,\mathrm{d}y - y\,\mathrm{d}x$ from $(R, 0)$ to $(-R, 0)$ along the upper half of the circle of radius $R$ about the origin, along the lower half, and along the diameter. Then apply the mixed-partials test.
    answer: >-
      (a) $\mathrm{d}V = 2\pi rh\,\mathrm{d}r + \pi r^2\,\mathrm{d}h$, so $\mathrm{d}V/V = 2\,\mathrm{d}r/r + \mathrm{d}h/h = 0.040 - 0.020$: $\mathrm{d}V = 1.57\cdot10^{-5}\,\text{m}^3$ against an exact $1.54\cdot10^{-5}\,\text{m}^3$. (b) $0.0314\,\text{m}^2$ and $0.0471\,\text{m}^2$: holding the shape lets $h$ grow with $r$. (c) $\pi R^2$, $-\pi R^2$ and $0$; $\partial M/\partial y = -1 \ne \partial N/\partial x = +1$, so $\omega$ is not exact.
    solution:
      - kind: given
        text: >-
          $r = 0.0500\,\text{m}$, $h = 0.100\,\text{m}$, $\mathrm{d}r = +1.0\cdot10^{-3}\,\text{m}$, $\mathrm{d}h = -2.0\cdot10^{-3}\,\text{m}$; $\omega$ has $M = -y$, $N = x$.
      - kind: law
        text: >-
          $\mathrm{d}f = (\partial f/\partial x)_y\,\mathrm{d}x + (\partial f/\partial y)_x\,\mathrm{d}y$; a line integral is computed by parametrizing the path and substituting; a form is exact on a region without holes exactly when $\partial M/\partial y = \partial N/\partial x$ there.
      - kind: manipulation
        text: >-
          (b) With $k = h/r$ fixed, $V = \pi kr^3$ and $(\partial V/\partial r)_k = 3\pi kr^2 = 3\pi rh$, against $(\partial V/\partial r)_h = 2\pi rh$. The extra $\pi rh$ is $\pi r^2\,(\partial h/\partial r)_k = \pi r^2k$: at fixed shape the height grows too.
      - kind: manipulation
        text: >-
          (c) On the circle, $x = R\cos t$, $y = R\sin t$, and $x\,\mathrm{d}y - y\,\mathrm{d}x = R^2(\cos^2 t + \sin^2 t)\,\mathrm{d}t = R^2\,\mathrm{d}t$. The upper half runs $t$ from $0$ to $\pi$: $\pi R^2$. The lower half, through $(0, -R)$, runs $t$ from $0$ to $-\pi$: $-\pi R^2$. On the diameter $y = 0$ and $\mathrm{d}y = 0$: zero.
      - kind: formula
        text: >-
          $\dfrac{\mathrm{d}V}{V} = 2\,\dfrac{\mathrm{d}r}{r} + \dfrac{\mathrm{d}h}{h} \qquad \oint (x\,\mathrm{d}y - y\,\mathrm{d}x) = 2A$
      - kind: limit
        text: >-
          As $\mathrm{d}r$ and $\mathrm{d}h$ shrink, the estimate's error, of second order ($\pi h\,\mathrm{d}r^2 + 2\pi r\,\mathrm{d}r\,\mathrm{d}h + \dots$), shrinks faster than the estimate. Out along the upper half and back along the lower, the loop gives $\pi R^2 - (-\pi R^2) = 2\pi R^2$, twice the area enclosed, and it vanishes as $R \to 0$.
      - kind: units
        text: >-
          $\mathrm{d}V$: $\text{m}\cdot\text{m}\cdot\text{m} = \text{m}^3$; $(\partial V/\partial r)$: $\text{m}^2$; $x\,\mathrm{d}y$: an area.
      - kind: substitution
        text: >-
          (a) $V = \pi(0.05)^2(0.1) = 7.854\cdot10^{-4}\,\text{m}^3$; $\mathrm{d}V = 0.020\,V = 1.571\cdot10^{-5}\,\text{m}^3$. Exactly, $\pi(0.051)^2(0.098) - V = 1.539\cdot10^{-5}\,\text{m}^3$: the estimate is $2\%$ high. (b) $2\pi(0.05)(0.1) = 0.0314\,\text{m}^2$; $3\pi(0.05)(0.1) = 0.0471\,\text{m}^2$.
      - kind: result
        text: >-
          (a) $\mathrm{d}V \approx 1.57\cdot10^{-5}\,\text{m}^3$ (a $2.0\%$ rise), exact $1.54\cdot10^{-5}\,\text{m}^3$. (b) $0.0314$ and $0.0471\,\text{m}^2$: "the derivative with respect to $r$" means nothing until you say what is held. (c) Three paths, three answers, $\pi R^2$, $-\pi R^2$ and $0$; the mixed partials differ by $2$ everywhere, so no potential exists, and the test says so before any path is chosen.

  - id: W-0.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-6, OBJ-0.1-7]
    prompt: >-
      Judge each claim, in a sentence or two.
      (a) "Heat is measured in joules, like internal energy, so a hot brick contains a definite amount of heat."
      (b) "A gas is taken around a closed cycle and returns to its initial state. So $\oint \mathrm{d}U = 0$, and the net heat it took in is zero."
      (c) "A gas is compressed, so $\mathrm{d}V < 0$, and the work $W$ in $\mathrm{d}U = \dbar Q + \dbar W$ is negative."
      (d) "A textbook writes $\Delta U = Q - W$ and finds $W = +150\,\text{J}$ for an expansion. In this course's convention the same process has $W = -150\,\text{J}$, and the same $\Delta U$."
      (e) "The mixed partials of $M\,\mathrm{d}x + N\,\mathrm{d}y$ agree at the point $(1, 1)$, so its integral is the same along every path."
      (f) "Writing $\mathrm{d}Q$ instead of $\dbar Q$ is a matter of typography."
    answer: >-
      (a) Wrong: heat is energy in transit, a path function; the brick has an internal energy. (b) Wrong: $\Delta U = 0$ gives $Q = -W$, and around a cycle that encloses an area $W \ne 0$. (c) Wrong: $W = -\int P\,\mathrm{d}V > 0$; energy went in. (d) Right. (e) Wrong: they must agree everywhere on a region without holes. (f) Wrong: $\mathrm{d}Q$ claims a state function $Q$ that does not exist.
    solution:
      - kind: reasoning
        text: >-
          (a) The joule is the unit of energy, whatever form it is in, so a shared unit proves nothing. A state function has a value in each state; heat does not: the same two states can be joined by routes that pass different amounts of heat (the lesson's three quasistatic routes give $2.193$, $2.886$ and $2.5$ in its units). The brick has an internal energy; "heat" names energy crossing its boundary.
      - kind: reasoning
        text: >-
          (b) $\oint\mathrm{d}U = 0$ is right, because $U$ is a state function. The first law then gives $\oint\dbar Q = -\oint\dbar W = \oint P\,\mathrm{d}V$, the area of the cycle on the $P$–$V$ plane, which is not zero for a cycle that encloses one. An engine turns that net heat into net work.
      - kind: reasoning
        text: >-
          (c) The sign follows the energy, not the volume: $\dbar W = -P\,\mathrm{d}V$ and $\mathrm{d}V < 0$ make $\dbar W > 0$. You pushed the piston in and energy entered the gas. (d) In the other convention $W'$ is the work done by the gas, $W' = -W$; $\Delta U = Q - W' = Q + W$ either way, so both describe the same physics.
      - kind: reasoning
        text: >-
          (e) The test is local, and the conclusion needs it on the whole region. $y\,\mathrm{d}x + xy\,\mathrm{d}y$, for example, has $\partial M/\partial y = 1$ and $\partial N/\partial x = y$, equal on the line $y = 1$ only, and it is not exact. (f) The symbol carries a claim: $\mathrm{d}Q$ would be the differential of a function $Q$ of the state, and there is none; $\dbar Q$ says "a small amount of heat along this step".
      - kind: result
        text: >-
          Only (d) is right. Heat and work are path functions, written with $\dbar$; their sum, $\mathrm{d}U$, is exact. Work is counted on the system, positive when energy goes in; and exactness is tested everywhere, not at a point.

  - id: W-0.1-08
    level: bagrut
    objectives: [OBJ-0.1-1, OBJ-0.1-3, OBJ-0.1-7]
    prompt: >-
      Computational. Use the lesson's laboratory notebook, or any language with a seeded random generator.
      (a) For $N \in \{4, 16, 64, 256, 1024\}$, measure the relative spread of the average of $N$ fair dice over $2000$ repetitions (at least $500$). Fit the exponent on log–log axes, and report it. Repeat with several seeds.
      (b) Check the coefficient as well as the exponent: multiply each measured spread by $\sqrt N$ and compare with $\sigma_1/\mu_1$. Why would a test of the exponent alone be weak evidence?
      (c) Design and run the falsifying experiment for the claim "the average settles because later rolls compensate earlier ones": generate $10^5$ runs of $100$ rolls, keep those whose first ten rolls averaged above $4.5$, and measure the mean of the next $90$ rolls in those runs. Report it with an uncertainty, and say what it rules out.
      (d) Repeat (a) with the loaded die of problem 2 (six with probability $1/3$). Which number changed, the exponent or the coefficient, and why does the derivation predict exactly that?
      (e) State one thing your numerical results do not prove.
    answer: >-
      (a) About $-0.501$; over 64 seeds $-0.5007$, scattering by $0.004$ from seed to seed ($0.007$ with $500$ repetitions). (b) $0.488 \pm 0.004$, against $\sigma_1/\mu_1 = 0.488$. (c) About $2.5\%$ of the runs are kept, with an opening average of $4.74$; their next $90$ rolls average $3.500 \pm 0.004$ in one batch ($3.5003 \pm 0.0005$ over 64 batches): no compensation. (d) The exponent stays at $-0.500$; the coefficient falls to $0.456$, the loaded die's $\sigma/\mu = \sqrt{10/3}/4 = 0.4564$. (e) For example: that real dice are independent, or that the law holds; the law is a theorem, the runs are evidence.
    solution:
      - kind: given
        text: >-
          Fair die: $\mu_1 = 7/2$, $\sigma_1^2 = 35/12$. Loaded die: $\mu = 4$, $\sigma^2 = 10/3$. Five values of $N$, $2000$ repetitions each; $10^5$ runs of $100$ rolls for (c).
      - kind: law
        text: >-
          For independent draws, $\sigma_{A_N} = \sigma_1/\sqrt N$, so the relative spread of the average is $(\sigma_1/\mu_1)N^{-1/2}$. The relative uncertainty of a standard deviation estimated from $n$ numbers is about $1/\sqrt{2(n - 1)}$.
      - kind: formula
        text: >-
          $\ln\dfrac{\sigma_{A_N}}{\mu_1} = \ln\dfrac{\sigma_1}{\mu_1} - \tfrac12\ln N$
      - kind: reasoning
        text: >-
          (a, b) The fit measures the slope of that line, the coefficient its height. Many wrong models give a slope near $-\tfrac12$: any sum of independent draws does, whatever their distribution, so a wrong die would pass a slope test, and so would a bug that rescaled every sample, since a rescaling changes neither the slope nor, when the spread is divided by the measured mean, the height. The height pins down $\sigma_1/\mu_1$, which depends on the die; only a comparison of the measured mean with $3.5$ catches the rescaling.
      - kind: substitution
        text: >-
          (a, b) With 64 seeds and $2000$ repetitions: exponent $-0.5007$, seed-to-seed scatter $0.0039$; coefficient $0.4879$, scatter $0.0041$, against $\sqrt{35/12}/3.5 = 0.48795$. Each spread is uncertain by $1/\sqrt{3998} = 1.6\%$, and over the five points the slope by about $0.004$, as observed. (c) The first ten rolls sum to $46$ or more with probability $0.02525$ exactly; measured $0.0252$, opening average $4.742$. The kept runs' next $90$ rolls: $3.5003$, scattering by $0.0038$ between batches, so $3.5003 \pm 0.0005$ over 64. (d) Loaded: exponent $-0.5004 \pm 0.0037$ (scatter), coefficient $0.4557 \pm 0.0034$, against $0.4564$.
      - kind: reasoning
        text: >-
          (c) If later rolls compensated, the rolls after a hot start would average below $3.5$. They average $3.5003 \pm 0.0005$: a deficit as small as $0.002$ is excluded. The dice have no memory; the opening excess is diluted, not repaid. (d) The derivation used only $\mu_1$ and $\sigma_1$ of one die: changing the die changes $\sigma_1/\mu_1$, the height, while $N^{-1/2}$ comes from the variances adding and is the same for every die.
      - kind: limit
        text: >-
          At $N = 1$ the relative spread is the coefficient itself, $0.488$, one die's own scatter. As the number of repetitions grows, the seed-to-seed scatter of the fitted numbers falls as its inverse square root; the exponent and coefficient do not move.
      - kind: units
        text: >-
          Faces, spreads, ratios and the exponent are pure numbers; this is why the relative spread, not the absolute one, is what is compared between dice.
      - kind: result
        text: >-
          (a) $-0.501$, scattering by $0.004$. (b) $0.488$, as predicted; the height is the real test. (c) $3.500 \pm 0.004$ after a hot start: compensation is ruled out. (d) Only the coefficient changes, to $0.456$. (e) The runs check our algebra and code, not our assumptions: a pseudo-random generator is built so that its draws behave as independent, so they cannot show that real dice are independent, and a numerical observation never proves a theorem.

  - id: W-0.1-09
    level: bagrut
    objectives: [OBJ-0.1-5, OBJ-0.1-6, OBJ-0.1-7]
    prompt: >-
      One mole of argon is described by the van der Waals equation and energy,
      $$P = \frac{Nk_BT}{V - Nb} - \frac{aN^2}{V^2} \qquad U = \frac32 Nk_BT - \frac{aN^2}{V}$$
      with $Nk_B = 8.314\,\text{J/K}$, $aN^2 = 0.1355\,\text{Pa m}^6$ and $Nb = 3.20\cdot10^{-5}\,\text{m}^3$.
      (a) Using $\mathrm{d}U = \dbar Q + \dbar W$ with $\dbar W = -P\,\mathrm{d}V$ for a quasistatic change, write $\dbar Q = A\,\mathrm{d}T + B\,\mathrm{d}V$, and show that it is not exact.
      (b) Show that $\dbar Q/T$ is exact, and find the function $S(T, V)$ whose differential it is.
      (c) The gas expands quasistatically at $300\,\text{K}$ from $1.00$ to $2.00$ litres. Find $W$, $\Delta U$ and $Q$, with their signs in this course's convention, and compare with an ideal gas.
      (d) Check the results in the limit $a, b \to 0$.
    answer: >-
      (a) $\dbar Q = \tfrac32 Nk_B\,\mathrm{d}T + \dfrac{Nk_BT}{V - Nb}\,\mathrm{d}V$; $\partial A/\partial V = 0 \ne \partial B/\partial T = Nk_B/(V - Nb)$. (b) $S = \tfrac32 Nk_B\ln T + Nk_B\ln(V - Nb) + C$, with $C$ a constant. (c) $W = -1702\,\text{J}$, $\Delta U = +67.8\,\text{J}$, $Q = +1770\,\text{J}$; an ideal gas has $W = -1729\,\text{J}$, $\Delta U = 0$, $Q = +1729\,\text{J}$. (d) Every result becomes the ideal gas's.
    solution:
      - kind: given
        text: >-
          $Nk_B = 8.314\,\text{J/K}$, $aN^2 = 0.1355\,\text{Pa m}^6$, $Nb = 3.20\cdot10^{-5}\,\text{m}^3$; $T = 300\,\text{K}$, $V_1 = 1.00\cdot10^{-3}\,\text{m}^3$, $V_2 = 2.00\cdot10^{-3}\,\text{m}^3$.
      - kind: law
        text: >-
          $\mathrm{d}U = \dbar Q + \dbar W$, $\dbar W = -P\,\mathrm{d}V$, $W$ the work done on the gas. A form $A\,\mathrm{d}T + B\,\mathrm{d}V$ is exact when $(\partial A/\partial V)_T = (\partial B/\partial T)_V$.
      - kind: manipulation
        text: >-
          (a) $\mathrm{d}U = \tfrac32 Nk_B\,\mathrm{d}T + (aN^2/V^2)\,\mathrm{d}V$, so $\dbar Q = \mathrm{d}U + P\,\mathrm{d}V = \tfrac32 Nk_B\,\mathrm{d}T + \big[aN^2/V^2 + Nk_BT/(V - Nb) - aN^2/V^2\big]\mathrm{d}V$: the attraction terms cancel. $A = \tfrac32 Nk_B$ does not depend on $V$; $B = Nk_BT/(V - Nb)$ depends on $T$.
      - kind: manipulation
        text: >-
          (b) $\dbar Q/T = \tfrac32 Nk_B\,\mathrm{d}T/T + Nk_B\,\mathrm{d}V/(V - Nb)$: now $A/T$ depends only on $T$ and $B/T$ only on $V$, both mixed partials are zero, and integrating each term gives $S$. (c) At fixed $T$: $W = -\int P\,\mathrm{d}V = -Nk_BT\ln\frac{V_2 - Nb}{V_1 - Nb} + aN^2\left(\frac{1}{V_1} - \frac{1}{V_2}\right)$, $\Delta U = aN^2\left(\frac{1}{V_1} - \frac{1}{V_2}\right)$, and $Q = \Delta U - W$.
      - kind: formula
        text: >-
          $Q = Nk_BT\ln\dfrac{V_2 - Nb}{V_1 - Nb} = T\,\Delta S$
      - kind: limit
        text: >-
          (d) With $a = b = 0$: $\dbar Q = \tfrac32 Nk_B\,\mathrm{d}T + (Nk_BT/V)\,\mathrm{d}V$, the lesson's heat form; $S = \tfrac32 Nk_B\ln T + Nk_B\ln V$; and $W = -Nk_BT\ln(V_2/V_1)$, $\Delta U = 0$, $Q = -W$. As $V_1, V_2 \to \infty$ the van der Waals corrections vanish too: a dilute gas is ideal.
      - kind: units
        text: >-
          $aN^2/V^2$: $\text{Pa m}^6/\text{m}^6 = \text{Pa}$, a pressure, as it must be to be subtracted from one; $aN^2/V$: $\text{Pa m}^3 = \text{J}$; $Nb$: $\text{m}^3$, subtracted from a volume. $Nk_BT$ times a logarithm: joules.
      - kind: substitution
        text: >-
          $Nk_BT = 2494.2\,\text{J}$; $\ln(1.968/0.968) = 0.7095$, so $Nk_BT\ln(\dots) = 1769.7\,\text{J}$; $aN^2(1/V_1 - 1/V_2) = 0.1355 \times 500 = 67.75\,\text{J}$. $W = -1769.7 + 67.8 = -1702.0\,\text{J}$; $\Delta U = 67.8\,\text{J}$; $Q = 1769.7\,\text{J}$, $\Delta S = 5.90\,\text{J/K}$. Ideal: $W = -2494.2\ln 2 = -1728.8\,\text{J}$.
      - kind: result
        text: >-
          (a) Not exact: heat is a path function for this gas too. (b) $1/T$ is an integrating factor, and $S = \tfrac32 Nk_B\ln T + Nk_B\ln(V - Nb)$. (c) $W = -1702\,\text{J}$ (the gas does work on its surroundings, so $W < 0$), $\Delta U = +67.8\,\text{J}$ (pulling the attracting molecules apart stores energy), $Q = +1770\,\text{J}$. The gas does $27\,\text{J}$ less work than an ideal gas and takes in $41\,\text{J}$ more heat.

  - id: W-0.1-10
    level: bagrut
    objectives: [OBJ-0.1-1, OBJ-0.1-3]
    prompt: >-
      Chebyshev's inequality says $P(|A_N - \mu_1| \ge \varepsilon) \le \sigma_1^2/(N\varepsilon^2)$ for the average of $N$ independent copies of any quantity with finite variance.
      (a) For the average of $100$ fair dice, bound $P(|A - 3.5| \ge 0.5)$. Compare with the Gaussian estimate $2\,\Phi(-\varepsilon/\sigma_A)$, where $\Phi$ is the standard normal distribution function, and with the exact value $0.0036$, found by convolution: the distribution of the sum of $100$ dice, from $99$ convolutions of the distribution of one die with itself.
      (b) You want a guarantee that the average of $N$ dice lands within $0.1$ of $3.5$ with probability at least $99\%$. How many dice does Chebyshev's inequality demand? How many does the Gaussian estimate suggest? (Exactly, $1936$ dice miss with probability $0.01001$, just over $1\%$; because the sum lives on a lattice, the exact miss probability is not monotone in $N$ near there.)
      (c) Why quote a bound that is so pessimistic? What does each estimate assume?
      (d) What do both say as $N \to \infty$?
    answer: >-
      (a) Bound $0.117$; Gaussian $0.0034$; exact $0.0036$: the bound is $32$ times too large. (b) Chebyshev: $29\,167$ dice; Gaussian: $1936$ dice, which exactly miss $1.0015\%$ of the time, a hair short. (c) Chebyshev needs only a finite variance and holds at every $N$; the Gaussian needs $N$ large enough for the central limit theorem, and is least reliable in the tails. (d) Both go to zero: the weak law of large numbers.
    solution:
      - kind: given
        text: >-
          $\mu_1 = 3.5$, $\sigma_1^2 = 35/12 = 2.917$, $\sigma_1 = 1.708$. (a) $N = 100$, $\varepsilon = 0.5$. (b) $\varepsilon = 0.1$, miss probability $\delta = 0.01$.
      - kind: law
        text: >-
          Chebyshev: $P(|A_N - \mu_1| \ge \varepsilon) \le \sigma_1^2/(N\varepsilon^2)$. The central limit theorem: for large $N$, $A_N$ is close to Gaussian with standard deviation $\sigma_1/\sqrt N$.
      - kind: formula
        text: >-
          $N_{\mathrm{C}} = \dfrac{\sigma_1^2}{\delta\,\varepsilon^2} \qquad N_{\mathrm{G}} = \left(\dfrac{z\,\sigma_1}{\varepsilon}\right)^2,\quad 2\,\Phi(-z) = \delta$
      - kind: substitution
        text: >-
          (a) $2.917/(100 \times 0.25) = 0.117$. $\sigma_A = 0.1708$, $\varepsilon/\sigma_A = 2.93$, $2\,\Phi(-2.93) = 0.0034$. (b) $2.917/(0.01 \times 0.01) = 29\,167$. $z = 2.576$, $(2.576 \times 1.708/0.1)^2 = 1935$, so $1936$ dice. At $N = 29\,167$ the exact miss probability is about $10^{-23}$: the guarantee is met with an enormous margin.
      - kind: reasoning
        text: >-
          (c) Chebyshev uses nothing but the variance, so it must hold for the worst distribution with that variance, and is loose for a well-behaved one. That is its strength: it is a theorem at every $N$, for every distribution with finite variance. The Gaussian estimate is an approximation; here it lands within $7\%$ of the exact tail at $N = 100$, but its accuracy in a tail is not guaranteed, and at $N = 1936$ it is short of the target by a hair ($0.010015$).
      - kind: limit
        text: >-
          (d) At fixed $\varepsilon$, the bound $\sigma_1^2/(N\varepsilon^2)$ falls as $1/N$ and the Gaussian tail faster than any power of $N$; both go to zero. At $N = 1$ the bound for $\varepsilon = 0.5$ is $11.7$, which says nothing, as a probability bound above $1$ must.
      - kind: units
        text: >-
          $\sigma_1^2/(N\varepsilon^2)$ is a ratio of squared face values: a pure number, as a probability is.
      - kind: result
        text: >-
          (a) $0.117 \ge 0.0036$; the Gaussian's $0.0034$ is close. (b) $29\,167$ dice for Chebyshev's guarantee, against $1936$ for the Gaussian estimate. (c) A bound that assumes nothing but a finite variance is pessimistic and certain; an estimate that assumes a shape is sharp and approximate. (d) Both vanish as $N \to \infty$: the average converges to $3.5$ in probability, the weak law of large numbers.
challenge:
  - id: W-0.1-c1
    stars: 1
    objectives: [OBJ-0.1-2, OBJ-0.1-3]
    prompt: >-
      To clear impurities from a nano-wire, a laser beam is swept along it again and again. In one sweep, an impurity stays put with probability $1/3$; otherwise it moves forward along the wire by a distance $x$ with density $(1/a)\,e^{-x/a}$. So one sweep moves it a distance with density
      $$p(x) = \frac13\,\delta(x) + \frac{2}{3a}\,e^{-x/a} \qquad x \ge 0$$
      (a) Find the mean and variance of the distance moved in one sweep.
      (b) Find the mean and standard deviation of the total distance $d$ after $36$ sweeps, and give an approximate density for $d$.
      (c) The exact probability that $d < 12a$ is $0.0072$ (count the sweeps that move, a binomial number, and add their exponential distances). Compare it with your approximation, and explain the difference. What is the probability that the impurity has not moved at all?
      (d) How many sweeps would bring the relative scatter of $d$ down to $5\%$?
    answer: >-
      (a) $\langle x\rangle = \tfrac23 a$, $\langle x^2\rangle = \tfrac43 a^2$, $\operatorname{Var}(x) = \tfrac89 a^2$. (b) $\langle d\rangle = 24a$, $\sigma_d = \sqrt{32}\,a = 5.66a$; $p(d) \approx e^{-(d - 24a)^2/(64a^2)}/\sqrt{64\pi a^2}$. (c) The Gaussian gives $0.017$, $2.3$ times too much: the true density is skewed, cut off at $d = 0$ with a long tail to the right, and the Gaussian is worst in the tails. Not moving at all: $3^{-36} = 6.7\cdot10^{-18}$. (d) $800$ sweeps.
    solution:
      - kind: law
        text: >-
          $\langle f(x)\rangle = \int f(x)\,p(x)\,\mathrm{d}x$, with the delta function contributing $\tfrac13 f(0)$. For $n$ independent sweeps, means and variances add; for large $n$ the central limit theorem makes the sum close to Gaussian.
      - kind: manipulation
        text: >-
          (a) The delta function sits at $x = 0$ and adds nothing to $\langle x\rangle$ or $\langle x^2\rangle$. With $\int_0^\infty x\,e^{-x/a}\,\mathrm{d}x/a = a$ and $\int_0^\infty x^2\,e^{-x/a}\,\mathrm{d}x/a = 2a^2$: $\langle x\rangle = \tfrac23 a$, $\langle x^2\rangle = \tfrac43 a^2$, $\operatorname{Var}(x) = \tfrac43 a^2 - \tfrac49 a^2 = \tfrac89 a^2$. (b) $\langle d\rangle = 36 \cdot \tfrac23 a = 24a$, $\operatorname{Var}(d) = 36 \cdot \tfrac89 a^2 = 32a^2$.
      - kind: formula
        text: >-
          $\dfrac{\sigma_d}{\langle d\rangle} = \dfrac{\sigma_1}{\mu_1}\,n^{-1/2} = \sqrt2\,n^{-1/2} \qquad n = \dfrac{2}{\varepsilon^2}$
      - kind: reasoning
        text: >-
          (c) A Gaussian with mean $24a$ and width $5.66a$ puts probability below $d = 0$, which is impossible, and is symmetric, while $d$ cannot be negative and has an exponential tail to the right. Near the centre it is good, $0.50$ against an exact $0.53$ for $d < 24a$; in the left tail it overestimates by a factor of $2.3$. A sum of $36$ terms is Gaussian in its bulk long before it is Gaussian in its tails.
      - kind: limit
        text: >-
          With $n = 1$ the relative scatter is $\sigma_1/\mu_1 = \sqrt{8/9}/(2/3) = \sqrt2 = 1.41$: one sweep is wildly unpredictable. If the impurity always moved ($\tfrac13 \to 0$), one sweep would be exponential, with $\sigma_1/\mu_1 = 1$; the chance of staying put makes each sweep more erratic.
      - kind: units
        text: >-
          $p(x)$ is a density, in $1/\text{m}$; $\langle x\rangle$ and $\sigma_d$ are in units of $a$; the relative scatter is a pure number.
      - kind: substitution
        text: >-
          (b) $\sqrt{32} = 5.657$. (c) $(12a - 24a)/5.657a = -2.12$, $\Phi(-2.12) = 0.017$; $0.017/0.0072 = 2.3$. $(1/3)^{36} = 6.7\cdot10^{-18}$. (d) $n = 2/0.0025 = 800$.
      - kind: result
        text: >-
          (a) $\tfrac23 a$ and $\tfrac89 a^2$. (b) $d = 24a \pm 5.7a$, approximately Gaussian. (c) The Gaussian estimate of a tail is off by $2.3$, because a sum of $36$ skewed terms is still skewed; staying put for all $36$ sweeps has probability $7\cdot10^{-18}$. (d) $800$ sweeps for $5\%$: the relative scatter falls as $n^{-1/2}$, from $\sqrt2$ for one sweep.
    source:
      name: 'MIT 8.044 Statistical Physics I (OpenCourseWare)'
      year: 2013
      problem: 'Problem Set 3, Problem 1'
      url: 'https://ocw.mit.edu/courses/8-044-statistical-physics-i-spring-2013/e116907e0d1ad4e928e129bea7694a4e_MIT8_044S13_ps3.pdf'
      verified: '2026-11-20'
      adapted: true

  - id: W-0.1-c2
    stars: 2
    objectives: [OBJ-0.1-5, OBJ-0.1-6, OBJ-0.1-7]
    prompt: >-
      Thermal radiation in a cavity has a pressure that depends on the temperature alone, $P = \tfrac13 aT^4$, and an internal energy $U = aVT^4$, with $a = 7.566\cdot10^{-16}\,\text{J m}^{-3}\,\text{K}^{-4}$. The cavity is taken from $(V_1, T_1)$ to $(V_2, T_2)$, with $V_2 = V_1/8$, along two quasistatic paths: path 1 compresses it at $T_1$ to $V_2$ and then heats it at fixed $V_2$ to $T_2$; path 2 follows the curve $VT^3 = V_1T_1^3$.
      (a) Find $T_2$, and the work done on the radiation along each path, symbolically and for $V_1 = 1.00\,\text{L}$, $T_1 = 1000\,\text{K}$.
      (b) Show that $\dbar W = -P\,\mathrm{d}V$ is not exact on the $(V, T)$ plane.
      (c) Find the heat taken in along each path.
      (d) Show that $1/T$ is an integrating factor for $\dbar Q$, find $S(V, T)$, and explain the heat you found along path 2.
    answer: >-
      (a) $T_2 = 2T_1 = 2000\,\text{K}$; $W_1 = \tfrac13 aT_1^4(V_1 - V_2) = 0.221\,\mu\text{J}$, $W_2 = aT_1^4V_1\big[(V_1/V_2)^{1/3} - 1\big] = 0.757\,\mu\text{J}$. (b) $\partial(0)/\partial V = 0$, but $\partial(-\tfrac13 aT^4)/\partial T = -\tfrac43 aT^3$. (c) $\Delta U = 0.757\,\mu\text{J}$ on both; $Q_1 = 0.536\,\mu\text{J}$, $Q_2 = 0$. (d) $\dbar Q/T = \mathrm{d}\big(\tfrac43 aVT^3\big)$; path 2 holds $S$ fixed, so it exchanges no heat: it is an adiabat.
    solution:
      - kind: law
        text: >-
          $\dbar W = -P\,\mathrm{d}V$, the work done on the radiation; $\mathrm{d}U = \dbar Q + \dbar W$. A form $A\,\mathrm{d}V + B\,\mathrm{d}T$ is exact when $\partial A/\partial T = \partial B/\partial V$.
      - kind: manipulation
        text: >-
          (a) On path 2, $T = T_1(V_1/V)^{1/3}$, so $T_2 = T_1 \cdot 8^{1/3} = 2T_1$. Path 1: only the compression does work, at constant $P = \tfrac13 aT_1^4$: $W_1 = -\tfrac13 aT_1^4(V_2 - V_1)$. Path 2: $W_2 = -\int_{V_1}^{V_2}\tfrac13 aT_1^4(V_1/V)^{4/3}\,\mathrm{d}V = aT_1^4V_1^{4/3}\big[V^{-1/3}\big]_{V_1}^{V_2} = aT_1^4V_1\big[(V_1/V_2)^{1/3} - 1\big]$.
      - kind: manipulation
        text: >-
          (b) $\dbar W = -\tfrac13 aT^4\,\mathrm{d}V + 0\,\mathrm{d}T$: the mixed partials are $-\tfrac43 aT^3$ and $0$. (c) $\dbar Q = \mathrm{d}U - \dbar W = 4aVT^3\,\mathrm{d}T + aT^4\,\mathrm{d}V + \tfrac13 aT^4\,\mathrm{d}V = 4aVT^3\,\mathrm{d}T + \tfrac43 aT^4\,\mathrm{d}V$, also inexact ($4aT^3$ against $\tfrac{16}{3}aT^3$). $\Delta U = a(V_2T_2^4 - V_1T_1^4) = aT_1^4V_1(16/8 - 1) = aT_1^4V_1$ on both paths, and $Q = \Delta U - W$.
      - kind: formula
        text: >-
          $\dfrac{\dbar Q}{T} = 4aVT^2\,\mathrm{d}T + \tfrac43 aT^3\,\mathrm{d}V = \mathrm{d}\!\left(\tfrac43 aVT^3\right)$
      - kind: limit
        text: >-
          With $V_2 \to V_1$ every work and heat goes to zero. On path 2, $VT^3$ is constant, so $S = \tfrac43 aVT^3$ is too, and $Q_2 = \int T\,\mathrm{d}S = 0$: all of $\Delta U$ came in as work, $W_2 = \Delta U$, as found. As $T \to 0$, $P$, $U$ and $S$ all vanish: a cold cavity holds no radiation.
      - kind: units
        text: >-
          $aT^4$: $\text{J m}^{-3}\,\text{K}^{-4}\cdot\text{K}^4 = \text{J/m}^3 = \text{Pa}$, a pressure and an energy density at once ($P = u/3$); $aT^4V$: joules; $aVT^3$: $\text{J/K}$, an entropy.
      - kind: substitution
        text: >-
          $aT_1^4 = 7.566\cdot10^{-4}\,\text{J/m}^3$. $W_1 = \tfrac13(7.566\cdot10^{-4})(0.875\cdot10^{-3}) = 2.21\cdot10^{-7}\,\text{J}$. $W_2 = \Delta U = (7.566\cdot10^{-4})(1.00\cdot10^{-3}) = 7.57\cdot10^{-7}\,\text{J}$. Path 1 in two legs: the isothermal compression gives out $Q = -\tfrac43 aT_1^4(V_1 - V_2) = -8.83\cdot10^{-7}\,\text{J}$, the heating at $V_2$ takes in $aV_2(T_2^4 - T_1^4) = 1.42\cdot10^{-6}\,\text{J}$; $Q_1 = 5.36\cdot10^{-7}\,\text{J}$.
      - kind: result
        text: >-
          (a) $T_2 = 2000\,\text{K}$; $W_1 = 0.221\,\mu\text{J}$, $W_2 = 0.757\,\mu\text{J}$: same endpoints, different work. (b) $\dbar W$ is inexact. (c) $Q_1 = 0.536\,\mu\text{J}$, $Q_2 = 0$, with the same $\Delta U = 0.757\,\mu\text{J}$. (d) $1/T$ makes $\dbar Q$ exact, $S = \tfrac43 aVT^3$, and path 2, along which $S$ stays constant, is an adiabat; path 1 takes in more heat and receives less work, and the first law balances both.
    source:
      name: 'MIT 8.044 Statistical Physics I (OpenCourseWare)'
      year: 2013
      problem: 'Problem Set 3, Problem 5'
      url: 'https://ocw.mit.edu/courses/8-044-statistical-physics-i-spring-2013/e116907e0d1ad4e928e129bea7694a4e_MIT8_044S13_ps3.pdf'
      verified: '2026-11-20'
      adapted: true
