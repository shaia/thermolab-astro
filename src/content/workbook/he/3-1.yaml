# חוברת התרגול של שיעור 3.1. שאלה 09 היא שאלה 5 של ThermoLab (כמה פעמים הולך חוזר הביתה), מורחבת מעבר לדוגמה 5
# של השיעור: מספר הביקורים בבית, מדוע הוא מחייב כל הולך לחזור, ההסתברות שעדיין לא חזר, זמן ההמתנה הממוצע האינסופי,
# ובדיקה של התכונה "מתחיל מחדש". שאלות 1 עד 3 של ThermoLab הן דוגמאות 2 עד 4 של השיעור, ושאלות 4, 6, 7 ו-8 שלו הן
# שאלות חזרה; אף אחת מהן אינה חוזרת כאן. ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו מפרסמת אותם, בהחלטת
# הכותב.
# כל מספר חושב מחדש ב-Python של ThermoLab (numpy 2.5, scipy 1.18): סכומים בינומיים מדויקים היכן שהם קיימים, ולשאר
# סימולציות עם זרעים (numpy default_rng, זרעים 0 עד 7 אלא אם צוין אחרת, 64 זרעים היכן שמסקנה נשענת על כך), שמצוטטות
# כממוצע על פני הזרעים ± שגיאת התקן שלו. הצמיגות של המים בשאלה 08, 0.890 mPa s ב-25 °C, היא ערך הייחוס הסטנדרטי;
# ה-D ≈ 4e-10 m^2/s של מולקולת צבען קטנה הוא של השיעור.
# שאלות האתגר: MIT 8.333 (Fall 2013), Problem Set 2, שאלות 5 ו-2, שהורדו ונקראו ב-2026-11-20. סעיף (d) של שאלה 2,
# הקשר בין כוח להתארכות, דורש משקלי בולצמן שהקורס עוד לא פגש, והושמט; התפלגות הזווית שלה הוחלפה בהתפלגות סימטרית
# כללית, ומקרה בולצמן של המקור הוא דוגמה אחת לה.
lang: he
lesson: '3.1'
practice:
  - id: W-3.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-2, OBJ-3.1-6]
    prompt: >-
      כל סדרה סבירה באותה מידה. מטבע הוגן מוטל $10$ פעמים.
      (א) סטודנט אומר שהסדרה עעעעעעעעעע (ע לעץ, פ לפלי) פחות סבירה מהסדרה עפפעפעעפעפ, "כי היא לא נראית אקראית". השוו את ההסתברויות של שתי הסדרות. אחר כך השוו את ההסתברויות של שתי התוצאות "עשר פעמים עץ" ו"חמש פעמים עץ, בסדר כלשהו".
      (ב) תשע ההטלות הראשונות יצאו כולן עץ. מהי ההסתברות לעץ בהטלה העשירית? סטודנט שני אומר שעכשיו הגיע תורו של פלי. ענו מתוך המודל.
      (ג) הולך $\pm 1$ הוגן עושה $100$ צעדים. מה סביר יותר, שיסיים בדיוק ב-$x = 0$ או בדיוק ב-$x = +20$, ופי כמה? האם ההולך מעדיף את הראשית?
      (ד) $x = 0$ הוא המיקום הסופי הסביר ביותר. האם סביר שיסיים שם? השוו את $P(x_{100} = 0)$ עם $P(|x_{100}| \ge 10)$.
    answer: >-
      (א) לכל סדרה הסתברות $2^{-10} = 1/1024$. "עשר פעמים עץ" היא סדרה אחת, $1/1024$; "חמש פעמים עץ" הן $\binom{10}{5} = 252$ סדרות, $0.246$. (ב) $\tfrac12$: ההטלות בלתי תלויות, ולשום תוצאה אין "תור". (ג) $x = 0$, $0.0796$ לעומת $0.0108$, סביר פי $7.34$. לא: לכל אחד מ-$2^{100}$ המסלולים אותה הסתברות, ופי $7.34$ מסלולים מסתיימים ב-$0$. (ד) לא: $P(x_{100} = 0) = 0.080$, ואילו $P(|x_{100}| \ge 10) = 0.368$, גדולה פי ארבעה וחצי.
    solution:
      - kind: law
        text: >-
          הטלות הוגנות ובלתי תלויות: לכל סדרה של $n$ הטלות הסתברות $2^{-n}$, יהיה המראה שלה אשר יהיה. תוצאה שסדרות רבות חולקות סבירה כמספר הסדרות האלה כפול $2^{-n}$; עבור $k$ פעמים עץ המספר הזה הוא $\binom{n}{k}$, ובהילוך $x = 2k - n$.
      - kind: formula
        text: >-
          $P(k) = \dfrac{1}{2^n}\dbinom{n}{k} \qquad \dfrac{P(x_{100} = 0)}{P(x_{100} = 20)} = \dfrac{\binom{100}{50}}{\binom{100}{60}}$
      - kind: reasoning
        text: >-
          (א) עעעעעעעעעע ו-עפפעפעעפעפ הן כל אחת סדרה אחת: $1/1024$ לכל אחת. "להיראות אקראית" היא תכונה של *מחלקה* של סדרות: יש $252$ דרכים לקבל חמש פעמים עץ ודרך אחת לקבל עשר, ולכן סדרה שנבחרה באקראי שייכת כמעט תמיד למחלקה הגדולה. (ב) ההטלה העשירית בלתי תלויה בתשע הראשונות, ולכן ההסתברות לעץ היא $\tfrac12$. תשע הפעמים עץ אינן מתבטלות מאוחר יותר; הן נמהלות בהטלות המאוחרות, וזו הנקודה של השיעור לגבי פיצוי.
      - kind: substitution
        text: >-
          (ג) $x = 0$ דורש $k = 50$, ו-$x = 20$ דורש $k = 60$: $P = \binom{100}{50}/2^{100} = 0.07959$ ו-$\binom{100}{60}/2^{100} = 0.01084$, יחס של $7.34$. (ד) $P(|x_{100}| \ge 10) = P(|k - 50| \ge 5)$, בסכימה מדויקת של הבינומית: $0.3682$.
      - kind: limit
        text: >-
          עבור $n = 1$ שתי התוצאות הן סדרות בודדות, וסבירות באותה מידה; הפער בין האמצע לקצה נפתח רק כש-$n$ גדל, כי $\binom{n}{n/2}$ גדל כמו $2^n\sqrt{2/(\pi n)}$ בעוד הקצה נשאר $1$. והאתר הסביר ביותר מחזיק חלק מסדר $1/\sqrt n$, ששואף לאפס: השיא הוא העמודה הגבוהה ביותר, לא תוצאה סבירה.
      - kind: result
        text: >-
          (א) לשתי הסדרות $1/1024$; חמש פעמים עץ סביר פי $252$ מעשר. (ב) $\tfrac12$. (ג) $x = 0$ סביר פי $7.34$ מ-$x = 20$, כי פי $7.34$ מסלולים, שכולם סבירים באותה מידה, מסתיימים שם; שום הולך אינו מעדיף דבר. (ד) ההסתברות לסיים בבית היא $0.08$, ולסיים במרחק $10$ לפחות ממנו, $0.37$.

  - id: W-3.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-3]
    prompt: >-
      איזו הנחה מופרת? לכל אחד מהגדלים הבאים, אמרו אם משפט הגבול המרכזי חוזה שהוא קרוב לגאוסי. אם לא, אמרו איזו הנחה מופרת (אי-תלות, אותה התפלגות, שונות סופית) או שהגודל אינו סכום כלל, ואמרו מה אפשר לומר על ההתפלגות שלו במקום זאת.
      (א) המסה הכוללת של $400$ תפוחים שנקטפו באקראי מיבול גדול.
      (ב) מספר הפעמים עץ ב-$10\,000$ הטלות של מטבע הוגן.
      (ג) המיקום, אחרי $40$ צעדים, של הולך שהצעד ה-$k$ שלו הוא $\pm 2^{-k}$, כשמטבע הוגן בוחר את הסימן.
      (ד) הממוצע של $1000$ הגרלות בלתי תלויות מהתפלגות קושי.
      (ה) המיקום של ההילוך המתמיד עם $q = 0.9$ אחרי $10^4$ צעדים, מתוקנן ב-$\sqrt n$.
      (ו) הגדולה מבין $1000$ הגרלות בלתי תלויות, שכל אחת מהן אחידה על $[0, 1]$.
      (ז) ההון שלכם אחרי $100$ הימורים בסיכויים שווים, שכל אחד מהם מכפיל אותו ב-$1.5$ או ב-$0.6$.
    answer: >-
      (א) גאוסי. (ב) גאוסי, לפי דה-מואבר-לפלס. (ג) לא גאוסי: לצעדים אין אותה התפלגות, והראשון נושא שלושה רבעים מהשונות; המיקום מתפלג אחיד על $[-1, 1]$. (ד) לא גאוסי: אין שונות סופית; הממוצע של $n$ הגרלות קושי הוא שוב הגרלה מהתפלגות קושי סטנדרטית. (ה) אי-התלות מופרת: גאוסי, אבל רחב פי $\sqrt{19} = 4.4$ ממה ש-$\sqrt n$ מניח. (ו) לא סכום: נערם ממש מתחת ל-$1$, ו-$1 - \max$ מתפלג בקירוב מעריכית עם תוחלת $1/1001$. (ז) מכפלה, לא סכום: הלוגריתם שלה הוא סכום וקרוב לגאוסי, ולכן ההון מתפלג באופן בלתי סימטרי בעליל, עם חציון של $0.005$ מההון ההתחלתי, תוחלת $131.5$, ו-$13.6\%$ מהמהמרים ברווח.
    solution:
      - kind: law
        text: >-
          משפט הגבול המרכזי: סכום של $n$ איברים בלתי תלויים, בעלי אותה התפלגות ובעלי שונות סופית, מתוקנן ב-$n\mu$ וב-$\sigma\sqrt n$, שואף לגאוסית הסטנדרטית. גרסאות חלשות יותר מתירות איברים שאינם זהים, בתנאים (של לינדברג) שבין השאר מונעים מאיבר אחד לשלוט, ומתאמים שדועכים; אלה משפטים אחרים, עם תנאים משלהם.
      - kind: reasoning
        text: >-
          (א) המסות הן הגרלות בלתי תלויות מיבול אחד, בעלות שונות סופית: המשפט חל. (ב) סכום של $10^4$ איברי ברנולי בלתי תלויים: המשפט חל, וכאן הוא דה-מואבר-לפלס. (ג) השונויות של הצעדים הן $4^{-k}$, והסכום שלהן $\tfrac13$; הראשונה לבדה היא $\tfrac14$, שלושה רבעים מהסך, ולכן איבר אחד שולט, יהיה מספר האיברים שאחריו אשר יהיה, ואף גרסה של המשפט אינה חלה. הסימנים הם הספרות הבינאריות של מספר אחיד: $x = \sum_k b_k 2^{-k}$ עם $b_k = \pm 1$ הוא $2U - 1$, כאשר $U$ אחיד על $[0, 1]$. בסימולציה, ל-$2 \times 10^5$ הולכים כאלה יש שונות $0.333$, והם נמצאים במרחק קולמוגורוב $0.002$ מההתפלגות האחידה.
      - kind: reasoning
        text: >-
          (ד) בלתי תלויים ובעלי אותה התפלגות, אבל בלי שונות: הסכום של $n$ הגרלות קושי מתפלג קושי ברוחב גדול פי $n$, ולכן הממוצע רחב בדיוק כמו הגרלה אחת. המיצוע אינו מצר אותו, ובוודאי אינו הופך אותו לגאוסי. (ה) הצעדים זהים, עם $\sigma_1 = 1$, אבל מתואמים; השונות היא $(1 + q)/(1 - q) = 19$ כפול $n$. הצורה עדיין גאוסית, מכוח משפט למתאמים דועכים, אבל כשמתקננים ב-$\sqrt n$ היא נשארת רחבה מדי פי $\sqrt{19}$. (ו) מקסימום אינו סכום. $P(\max \le x) = x^{1000}$, ולכן $1 - \max$ מתפלג בקירוב מעריכית עם תוחלת $1/1001$: התפלגות חד-צדדית ובלתי סימטרית.
      - kind: reasoning
        text: >-
          (ז) $W = \prod_i f_i$ הוא מכפלה, אבל $\ln W = \sum_i \ln f_i$ הוא סכום של $100$ איברים בלתי תלויים, שכל אחד מהם $\ln 1.5 = 0.405$ או $\ln 0.6 = -0.511$: תוחלת $-0.0527$, סטיית תקן $0.458$. לכן $\ln W$ קרוב לגאוסי עם תוחלת $-5.27$ ופיזור $4.58$, ו-$W$ עצמו לוג-נורמלי: חציון $e^{-5.27} = 0.0052$, תוחלת $(\tfrac{1.5 + 0.6}{2})^{100} = 1.05^{100} = 131.5$. כדי להיות ברווח דרושות לפחות $56$ זכיות מתוך $100$; הבינומית נותנת $13.6\%$, וגם $2 \times 10^5$ מהמרים בסימולציה נותנים $13.6\%$.
      - kind: limit
        text: >-
          ב-(ג), תנו לגודלי הצעדים לקטון לאט יותר, למשל כמו $k^{-1/4}$, והשונות מתבדרת בלי שצעד בודד ישלוט: המשפט לאיברים שאינם זהים חל שוב. ב-(ז), כששני הגורמים מתקרבים ל-$1$, $\ln f \approx f - 1$ והמכפלה הופכת, בסדר ראשון, לסכום: ההתפלגות הלוג-נורמלית והגאוסית מתמזגות.
      - kind: result
        text: >-
          גאוסיים: (א), (ב). לא גאוסיים: (ג) איבר אחד שולט (אחיד על $[-1, 1]$); (ד) שונות אינסופית (קושי, בלי היצרות); (ה) אי-התלות מופרת (גאוסי, רחב מדי פי $\sqrt{19}$); (ו) לא סכום (נערם אל $1$); (ז) מכפלה, שהלוגריתם שלה גאוסי.

  - id: W-3.1-03
    level: basic
    objectives: [OBJ-3.1-1]
    prompt: >-
      הילוך בשני ממדים. הולך על סריג ריבועי שמרווחו $1$ עובר בכל פעימה לאחד מארבעת שכניו, לכל אחד בהסתברות $\tfrac14$, באופן בלתי תלוי בכל מה שקדם.
      (א) עבור צעד אחד $(\Delta x, \Delta y)$, מצאו את $\langle \Delta x \rangle$, $\langle \Delta x^2 \rangle$, $\langle \Delta y^2 \rangle$ ו-$\langle \Delta x\,\Delta y \rangle$. האם $\Delta x$ ו-$\Delta y$ בלתי תלויים?
      (ב) הראו ש-$\langle r_t^2 \rangle = t$, כאשר $r_t^2 = x_t^2 + y_t^2$, כך ששורש ממוצע ריבוע המרחק מנקודת המוצא הוא $\sqrt t$. באיזו אי-תלות הגזירה משתמשת, ובאיזו היא אינה צריכה?
      (ג) מהו שורש ממוצע ריבוע המרחק אחרי $10^4$ צעדים? כמה צעדים דרושים כדי שיהיה $1000$? כמה רחוק היה מגיע הולך ב-$10^4$ צעדים אילו מעולם לא פנה?
      (ד) הולך שני צועד באלכסון, $(\pm 1, \pm 1)$, וארבע האפשרויות סבירות באותה מידה. מצאו את שורש ממוצע ריבוע המרחק שלו אחרי $t$ צעדים, ונסחו את החוק לכל צעד בעל תוחלת אפס במונחי האורך שלו.
    answer: >-
      (א) $0$, $\tfrac12$, $\tfrac12$, $0$. לא בלתי תלויים: אם $\Delta x \ne 0$ אז $\Delta y = 0$, ולכן $P(\Delta x = 1, \Delta y = 1) = 0$, ולא $\tfrac1{16}$; הם בלתי מתואמים. (ב) כל קואורדינטה היא הילוך חד-ממדי עם צעדים בלתי תלויים בעלי שונות $\tfrac12$, ולכן $\langle x_t^2 \rangle = \langle y_t^2 \rangle = t/2$. הגזירה משתמשת באי-תלות בין פעימות שונות, לא באי-תלות בין $x$ ל-$y$ בתוך פעימה אחת. (ג) $100$; $10^6$ צעדים; $10^4$, רחוק פי מאה. (ד) $\sqrt{2t}$; באופן כללי $\langle r_t^2 \rangle = t\,\langle \ell^2 \rangle$, ושורש ממוצע ריבוע המרחק הוא $\ell\sqrt t$ לצעדים באורך קבוע $\ell$.
    solution:
      - kind: given
        text: >-
          צעדים $(1, 0)$, $(-1, 0)$, $(0, 1)$, $(0, -1)$, כל אחד בהסתברות $\tfrac14$, בלתי תלויים מפעימה לפעימה; $x_t$ ו-$y_t$ הם הסכומים של ה-$\Delta x$ ושל ה-$\Delta y$.
      - kind: law
        text: >-
          תוחלות מתחברות; שונויות מתחברות לאיברים בלתי תלויים. $r_t^2 = x_t^2 + y_t^2$, ולכן $\langle r_t^2 \rangle$ הוא הסכום של ממוצעי הריבועים של שתי הקואורדינטות, שכל אחת מהן הילוך חד-ממדי.
      - kind: manipulation
        text: >-
          (א) $\Delta x$ הוא $\pm 1$ בהסתברות $\tfrac14$ לכל אחד ו-$0$ בהסתברות $\tfrac12$: $\langle \Delta x \rangle = 0$, $\langle \Delta x^2 \rangle = \tfrac12$; וכך גם $\Delta y$. בכל צעד אחד מהשניים הוא אפס, ולכן תמיד $\Delta x\,\Delta y = 0$ ו-$\langle \Delta x\,\Delta y \rangle = 0$. (ב) ה-$\Delta x$ של פעימות שונות בלתי תלויים, בעלי תוחלת $0$ ושונות $\tfrac12$, ולכן $\langle x_t^2 \rangle = t/2$, וכך גם עבור $y$. בחיבור, $\langle r_t^2 \rangle = t$. שום דבר כאן לא השתמש בהתפלגות המשותפת של $\Delta x$ ו-$\Delta y$ בתוך פעימה, ולכן התלות ביניהם אינה עולה דבר. (ד) להולך האלכסוני $\Delta x$ ו-$\Delta y$ הם $\pm 1$ בלתי תלויים: $\langle x_t^2 \rangle = \langle y_t^2 \rangle = t$ ו-$\langle r_t^2 \rangle = 2t$.
      - kind: formula
        text: >-
          $\langle r_t^2 \rangle = t\,\langle \Delta x^2 + \Delta y^2 \rangle = t\,\langle \ell^2 \rangle \qquad r_\mathrm{rms} = \ell\sqrt t$
      - kind: limit
        text: >-
          $t = 1$: בדיוק $r_1 = 1$, והנוסחה נותנת $1$. בממד אחד, עם צעדי $\pm 1$, היא חוזרת ל-$\sigma_1\sqrt t$ של השיעור. הולך שלעולם אינו פונה עובר $\ell t$; ההילוך עובר $\ell\sqrt t$, חלק $t^{-1/2}$ מזה, כמו בשיעור.
      - kind: units
        text: >-
          המרחקים במרווחי סריג; $\langle r_t^2 \rangle = t\langle \ell^2 \rangle$ הוא אורך בריבוע בשני האגפים, כי $t$ הוא מניין.
      - kind: substitution
        text: >-
          (ג) $\sqrt{10^4} = 100$; $1000^2 = 10^6$ צעדים; הולך שהולך ישר עובר $10^4$. במדידה על פני $64$ זרעים של $4000$ הולכים ב-$t = 1000$: $\langle r_t^2 \rangle/t = 0.998 \pm 0.002$ ו-$\langle x_ty_t \rangle/t = 0.001 \pm 0.001$; ב-$t = 10^4$ שורש ממוצע ריבוע המרחק הוא $99.9 \pm 0.2$ ($8$ זרעים). (ד) $\sqrt{2 \times 10^4} = 141.4$ אחרי $10^4$ צעדים; נמדד $141.7 \pm 0.4$.
      - kind: result
        text: >-
          (א) רכיבים בלתי מתואמים אבל לא בלתי תלויים. (ב) $\langle r_t^2 \rangle = t$, מתוך אי-תלות בין פעימות בלבד. (ג) $100$ אחרי $10^4$ צעדים; $10^6$ צעדים כדי להגיע ל-$1000$; הולך שהולך ישר היה ב-$10^4$. (ד) $\sqrt{2t}$: שורש ממוצע ריבוע המרחק הוא אורך הצעד כפול $\sqrt t$, בכל ממד.

  - id: W-3.1-04
    level: mid
    objectives: [OBJ-3.1-5, OBJ-3.1-4]
    prompt: >-
      סקרים והגורם $1.96$. סקר שואל $N = 1000$ בוחרים שנבחרו באקראי שאלה של כן או לא, ו-$520$ עונים כן. התייחסו לכל תשובה כהגרלה בלתי תלויה, כן בהסתברות $p$, החלק האמיתי באוכלוסייה גדולה.
      (א) קדדו תשובה כ-$1$ עבור כן ו-$0$ עבור לא. מהי סטיית התקן של תשובה בודדת? מהי שגיאת התקן של החלק שהסקר מוצא, $\hat p = k/N$? השתמשו ב-$p \approx 0.52$.
      (ב) עורכי סקרים מצטטים "טעות דגימה ברמת $95\%$". בעזרת קירוב דה-מואבר-לפלס, מצאו את ה-$z$ שעבורו לגאוסית סטנדרטית $P(|Z| \le z) = 0.95$, ואת טעות הדגימה. עבור $p = \tfrac12$ הבינומית המדויקת נותנת $P(|k - 500| \le 31) = 0.954$ ו-$P(|k - 500| \le 30) = 0.946$; האם זה תומך בכך?
      (ג) עיתון כותב: "לסקר של $1000$ יש טעות דגימה של כ-$3\%$, כי $1/\sqrt{1000} \approx 0.032$." המספר נכון בערך. האם הנימוק נכון?
      (ד) הסקר מראה $52\%$ מול $48\%$. האם היתרון מבוסס ברמת $95\%$? (היתרון הוא $2\hat p - 1$.)
      (ה) כמה בוחרים יתנו טעות דגימה של נקודת אחוז אחת? האם משנה אם במדינה יש $9$ מיליון בוחרים או $300$ מיליון?
    answer: >-
      (א) $\sqrt{p(1 - p)} = 0.50$, ששום מספר של בוחרים אינו משנה; שגיאת התקן היא $0.0158$. (ב) $z = 1.96$; טעות הדגימה היא $\pm 0.031$, כלומר מ-$0.489$ עד $0.551$. כן: $31$ בוחרים הם $1.96$ סטיות תקן של $k$, וההסתברות המדויקת להימצא בטווח הזה היא $0.954$. (ג) לא: שגיאת התקן היא $0.016$, מחצית מזה; טעות הדגימה ברמת $95\%$ היא $1.96 \times 0.5/\sqrt N$, ו-$1.96 \times 0.5 \approx 1$ במקרה. ב-$p = 0.1$ טעות הדגימה הייתה $0.019$. (ד) לא: ליתרון, $0.04$, יש שגיאת תקן של $0.032$, והוא $1.27$ שגיאות כאלה, פחות מ-$1.96$. (ה) $9604$ בוחרים; גודל המדינה אינו נכנס לחשבון, כל עוד המדגם הוא חלק קטן ממנה.
    solution:
      - kind: given
        text: >-
          $N = 1000$, $k = 520$, $\hat p = 0.52$. כל תשובה $a_i$ היא $1$ בהסתברות $p$ ו-$0$ אחרת, באופן בלתי תלוי.
      - kind: law
        text: >-
          לתשובה בודדת של $0$ או $1$ יש תוחלת $p$ ושונות $p(1 - p)$ (דוגמה 2). לממוצע של $N$ הגרלות בלתי תלויות שסטיית התקן של כל אחת מהן $\sigma$ יש שגיאת תקן $\sigma/\sqrt N$. לפי דה-מואבר-לפלס, $k$ קרוב לגאוסית בעלת תוחלת $Np$ ושונות $Np(1 - p)$, ולכן $\hat p$ קרוב לגאוסית בעלת תוחלת $p$ וסטיית תקן $\sqrt{p(1 - p)/N}$.
      - kind: formula
        text: >-
          $\sigma_{\hat p} = \sqrt{\dfrac{p(1 - p)}{N}} \qquad \hat p \pm 1.96\,\sigma_{\hat p} \qquad \sigma_{2\hat p - 1} = 2\sigma_{\hat p} \qquad N = \dfrac{1.96^2\,p(1 - p)}{m^2}$
      - kind: substitution
        text: >-
          (א) $\sqrt{0.52 \times 0.48} = 0.4996$; $\sigma_{\hat p} = 0.4996/\sqrt{1000} = 0.0158$. (ב) $\Phi(1.96) - \Phi(-1.96) = 0.950$, ולכן $z = 1.960$ וטעות הדגימה היא $1.96 \times 0.0158 = 0.031$. עבור $p = \tfrac12$, $\sigma_k = \sqrt{250} = 15.8$ ו-$1.96\sigma_k = 31.0$. ב-$8$ הרצות של $20\,000$ סקרים מדומים עם $p = 0.52$, הטווח $\hat p \pm 1.96\sqrt{\hat p(1 - \hat p)/N}$ הכיל את ה-$p$ האמיתי ב-$94.6\% \pm 0.1\%$ מהם, הערך הבינומי המדויק $94.65\%$: מעט פחות מ-$95\%$, כי $k$ שלם. (ד) $\sigma_{2\hat p - 1} = 0.0316$; $0.04/0.0316 = 1.27$. אילו האוכלוסייה הייתה מחולקת שווה בשווה בדיוק, סקר של $1000$ היה מראה $52\%$ או יותר לאחד הצדדים בהסתברות $0.217$ (בינומית מדויקת). (ה) במקרה הגרוע ביותר, $p(1 - p) = \tfrac14$, ועם $m = 0.01$: $N = 3.8416 \times 0.25/10^{-4} = 9604$.
      - kind: reasoning
        text: >-
          (ג) במשפט של העיתון מסתתרים שני גדלים שונים. סטיית התקן של תשובה אחת, $0.50$, מתארת את הבוחרים, ונשארת $0.50$ יהיה מספר הנשאלים אשר יהיה. שגיאת התקן, $0.50/\sqrt{1000} = 0.016$, מתארת את הסקר, ודועכת כמו $N^{-1/2}$. ה-$3\%$ המצוטטים הם טעות הדגימה ברמת $95\%$, $1.96 \times 0.016$, והם קרובים ל-$1/\sqrt{1000}$ רק משום ש-$1.96 \times \sqrt{p(1 - p)} \approx 1$ בקרבת $p = \tfrac12$. (ה) שום דבר ב-$\sqrt{p(1 - p)/N}$ אינו מתייחס לגודל האוכלוסייה: כל תשובה היא הגרלה בהסתברות $p$, בין שהמדינה גדולה ובין שהיא קטנה, כל עוד הוצאת הנשאלים מהאוכלוסייה אינה משנה את $p$ באופן ניכר.
      - kind: limit
        text: >-
          $p \to 0$ או $1$: כולם עונים אותו דבר ושגיאת התקן שואפת לאפס, וכלל האצבע $1/\sqrt N$ מגזים מאוד בטעות הדגימה. $N \to \infty$: טעות הדגימה שואפת לאפס ודועכת כמו $N^{-1/2}$, בעוד הפיזור של תשובה אחת נשאר $\sqrt{p(1 - p)}$. רחוק בזנבות, מעבר לכמה שגיאות תקן, אי אפשר עוד לסמוך על הגאוסית (דוגמה 3), ולכן מצטטים טעויות דגימה ברמת $95\%$ ולא ברמת $99.9999\%$.
      - kind: result
        text: >-
          (א) תשובה אחת מתפזרת ב-$0.50$; החלק שהסקר מוצא, ב-$0.016$. (ב) טעות הדגימה ברמת $95\%$ היא $1.96 \times 0.016 = \pm 3.1$ נקודות. (ג) ה-$3\%$ נכונים; $1/\sqrt{1000}$ אינו הסיבה, רק צירוף מקרים כש-$p$ קרוב ל-$\tfrac12$. (ד) יתרון של $4$ נקודות הוא $1.27$ שגיאות תקן: לא מבוסס. (ה) $9604$ בוחרים עבור $\pm 1$ נקודה, יהיה גודל המדינה אשר יהיה.

  - id: W-3.1-05
    level: mid
    objectives: [OBJ-3.1-1, OBJ-3.1-4]
    prompt: >-
      יתרון הבית. בגלגל רולטה אירופי יש $37$ משבצות, $18$ מהן אדומות. מהמר מניח אסימון אחד על אדום בכל סיבוב: הוא זוכה באסימון בהסתברות $18/37$ ומפסיד אסימון אחרת. הרווח הנקי שלו אחרי $t$ סיבובים הוא הילוך אקראי מוטה.
      (א) מצאו את $\mu_1$ ואת $\sigma_1$.
      (ב) תנו את הרווח הממוצע שלו ואת הפיזור שלו אחרי $t = 100$ ו-$t = 10^4$ סיבובים. מי מהשניים שולט בכל אחד מהם, ואחרי כמה סיבובים הם שווים?
      (ג) העריכו בעזרת הגאוסית את ההסתברות שהוא ברווח, $x_t > 0$, אחרי $t = 100$, $1000$ ו-$10^4$ סיבובים. שימו לב ש-$x_t$ זז בצעדים של $2$, וש-$x_t = 0$ אינו רווח. השוו עם הערכים הבינומיים המדויקים, $0.35535$, $0.18763$ ו-$0.003331$.
      (ד) קזינו מקבל $10^6$ הימורים כאלה בלילה. מהם הרווח הממוצע שלו, הפיזור שלו והפיזור היחסי שלו? כמה סטיות תקן מהממוצע רחוק לילה מפסיד?
    answer: >-
      (א) $\mu_1 = -1/37 = -0.0270$, $\sigma_1 = 0.9996$. (ב) $t = 100$: ממוצע $-2.7$, פיזור $10.0$, המזל שולט. $t = 10^4$: ממוצע $-270$, פיזור $100$, יתרון הבית שולט. הם שווים ב-$t = \sigma_1^2/\mu_1^2 = 1368$ סיבובים. (ג) $0.3555$, $0.1876$, $0.00333$, תואמים את הערכים המדויקים; בלי התיקון, $0.393$ ב-$t = 100$. (ד) $27\,027$ אסימונים, פיזור $1000$, פיזור יחסי $3.7\%$; לילה מפסיד רחוק $27$ סטיות תקן, בהסתברות של כ-$10^{-160}$.
    solution:
      - kind: given
        text: >-
          $p = 18/37$ עבור $s = +1$, $1 - p = 19/37$ עבור $s = -1$; סיבובים בלתי תלויים; $x_t = s_1 + \cdots + s_t$.
      - kind: law
        text: >-
          לצעדים בלתי תלויים, $\langle x_t \rangle = \mu_1 t$ ו-$\sigma_{x_t} = \sigma_1\sqrt t$; מספר הזכיות בינומי, ולפי דה-מואבר-לפלס $x_t$ קרוב לגאוסית בעלת התוחלת והפיזור האלה. ערכיו מרוחקים $2$ זה מזה, ולכן הסתברות מהצורה $P(x_t \ge x_0)$ נקראת מהגאוסית בנקודת האמצע שבין ערכים מותרים.
      - kind: formula
        text: >-
          $\mu_1 = 2p - 1 \qquad \sigma_1^2 = 1 - \mu_1^2 \qquad P(x_t > 0) \approx 1 - \Phi\!\left(\dfrac{1 - \mu_1 t}{\sigma_1\sqrt t}\right) \qquad t_\times = \dfrac{\sigma_1^2}{\mu_1^2}$
      - kind: substitution
        text: >-
          (א) $\mu_1 = 36/37 - 1 = -0.02703$, $\sigma_1^2 = 1 - 1/1369 = 0.99927$, $\sigma_1 = 0.99963$. (ב) $t = 100$: $-2.70$ ו-$10.00$; $t = 10^4$: $-270.3$ ו-$99.96$; $t_\times = 0.99927 \times 1369 = 1368$. (ג) עבור $t$ זוגי, $x_t$ זוגי; ברווח פירושו $x_t \ge 2$, ונקודת האמצע היא $1$. $t = 100$: $z = (1 + 2.703)/9.996 = 0.370$, $P = 0.3555$. $t = 1000$: $z = (1 + 27.03)/31.61 = 0.887$, $P = 0.1876$. $t = 10^4$: $z = (1 + 270.3)/99.96 = 2.714$, $P = 0.00333$. ה-$\Phi(\mu_1\sqrt t/\sigma_1)$ הנאיבי נותן $0.393$ ב-$t = 100$, גבוה בערך במחצית של $P(x_{100} = 0) = 0.077$, מצבי התיקו שהוא סופר כרווח. בסימולציה, $8$ זרעים של $20\,000$ מהמרים נמצאים ברווח אחרי $1000$ סיבובים בשכיחות $0.1870 \pm 0.0009$. (ד) רווח ממוצע $10^6/37 = 27\,027$; פיזור $0.99963 \times 1000 = 999.6$; פיזור יחסי $999.6/27\,027 = 3.7\%$; הפסד דורש סטייה של $27\,027/999.6 = 27.0$ סטיות תקן.
      - kind: reasoning
        text: >-
          (ב) יתרון הבית גדל כמו $t$, המזל כמו $\sqrt t$. בערב של מאה סיבובים התוצאה של המהמר היא בעיקר מזל, ושליש מהמהמרים הולכים הביתה ברווח; לאורך חיים של $10^4$ סיבובים, שלושה מכל אלף. (ד) הקזינו הוא אותו הילוך מהצד השני, עם $t$ גדול מאוד: הפיזור היחסי שלו הוא $(\sigma_1/|\mu_1|)\,t^{-1/2}$, וב-$10^6$ הימורים זה $3.7\%$. ב-$27$ סטיות תקן הבינומית המדויקת נותנת $10^{-160.5}$ והגאוסית $10^{-160.6}$. הגאוסית מחזיקה מעמד אפילו כאן כי הסטייה קטנה ביחס למספר ההימורים: כדי לצאת באפס דרוש שיעור זכיות של $0.500$ במקום $0.486$, הזזה של $0.014$, ואילו $90$ הפעמים עץ ב-$100$ של דוגמה 3 היו הזזה של $0.4$.
      - kind: limit
        text: >-
          גלגל הוגן, $p = \tfrac12$: $\mu_1 = 0$, $t_\times \to \infty$, ו-$P(x_t > 0) = \tfrac12(1 - P(x_t = 0))$ בדיוק, מסימטריה, והוא שואף ל-$\tfrac12$ במשחקים ארוכים. גלגל בלי אדום, $p = 0$: $\sigma_1 = 0$, והמהמר מפסיד אסימון אחד בכל סיבוב בוודאות.
      - kind: result
        text: >-
          (א) $\mu_1 = -0.027$, $\sigma_1 = 0.9996$. (ב) המזל שולט כאשר $t \ll 1368$ סיבובים, ויתרון הבית מעבר לכך. (ג) ברווח בהסתברות $0.36$, $0.19$ ו-$0.003$ אחרי $100$, $1000$ ו-$10^4$ סיבובים, והגאוסית והחישוב המדויק מסכימים בספרות המוצגות. (ד) הרווח של הקזינו, $27\,027 \pm 1000$ אסימונים בלילה, אינו ודאי ב-$3.7\%$, ולילה מפסיד רחוק $27$ סטיות תקן.

  - id: W-3.1-06
    level: mid
    objectives: [OBJ-3.1-2, OBJ-3.1-4]
    prompt: >-
      בינומית בלתי סימטרית. קובייה הוגנת מוטלת $n = 60$ פעמים, ו-$k$ הוא מספר הפעמים שיצא שש.
      (א) הסבירו מדוע $k$ בינומי, ומצאו את התוחלת, את השונות ואת סטיית התקן שלו.
      (ב) חשבו את $P(k = 10)$, $P(k = 5)$ ו-$P(k = 15)$ המדויקים, ואת הקירובים שלהם לפי דה-מואבר-לפלס.
      (ג) הזנבות המדויקים הם $P(k \le 5) = 0.0512$ ו-$P(k \ge 15) = 0.0648$. מה נותנת הגאוסית לכל אחד מהם? לאיזה צד נוטה הבינומית, ומדוע היא חייבת לנטות?
      (ד) עבור $p \ne \tfrac12$ הצידוד של הבינומית (מידת אי-הסימטריה שלה), $\langle (k - np)^3 \rangle/\sigma_k^3$, הוא $(1 - 2p)/\sqrt{np(1 - p)}$. חשבו אותו ב-$n = 60$, $600$ ו-$6000$. היחס המדויק בין הזנב הימני לשמאלי, כל אחד כ-$1.7$ סטיות תקן מהתוחלת, הוא $1.265$, $1.102$ ו-$1.032$. כמה מהר הנטייה דועכת, ומה זה אומר על דה-מואבר-לפלס לקובייה בהשוואה למטבע הוגן?
    answer: >-
      (א) $60$ ניסויים בלתי תלויים, שבכל אחד מהם יוצא שש בהסתברות $\tfrac16$: תוחלת $10$, שונות $8.33$, סטיית תקן $2.89$. (ב) במדויק $0.1370$, $0.0310$, $0.0309$; בגאוסית $0.1382$, $0.0308$, $0.0308$. (ג) $0.0595$ לכל אחד; הזנב הימני כבד ב-$27\%$ מהשמאלי. הבינומית נוטה ימינה: $k$ אינו יכול לרדת מתחת ל-$0$, $3.5$ סטיות תקן מתחת לתוחלת, אבל יכול להגיע ל-$60$, $17$ מעליה. (ד) $0.231$, $0.073$, $0.023$; עודפי היחסים מעל אחד, $0.265$, $0.102$, $0.032$, קטנים בערך פי $\sqrt{10}$ בכל פעם ש-$n$ גדל פי עשרה, כלומר דועכים כמו $n^{-1/2}$. בקובייה השגיאה המובילה של הקירוב היא הנטייה הזו, מסדר $n^{-1/2}$; במטבע הוגן היא אינה קיימת, והשגיאה מסדר $1/n$.
    solution:
      - kind: given
        text: >-
          $n = 60$, $p = \tfrac16$, $q = \tfrac56$; כל הטלה בלתי תלויה.
      - kind: law
        text: >-
          $k$ סופר הצלחות ב-$n$ ניסויים בלתי תלויים בעלי אותה הסתברות $p$: הבינומית, עם $\langle k \rangle = np$ ו-$\operatorname{Var}(k) = npq$. דה-מואבר-לפלס: $P(k) \approx e^{-(k - np)^2/(2npq)}/\sqrt{2\pi npq}$ בקרבת השיא; לזנב, האינטגרל של הגאוסית מחצי השלם.
      - kind: formula
        text: >-
          $P(k) = \dbinom{60}{k}\left(\tfrac16\right)^k\left(\tfrac56\right)^{60 - k} \qquad P(k) \approx \dfrac{1}{\sqrt{2\pi \cdot 8.33}}\,e^{-(k - 10)^2/16.67} \qquad \gamma_1 = \dfrac{1 - 2p}{\sqrt{npq}}$
      - kind: substitution
        text: >-
          (א) $np = 10$, $npq = 50/6 = 8.333$, $\sigma_k = 2.887$. (ב) במדויק: $P(10) = 0.13701$, $P(5) = 0.03102$, $P(15) = 0.03093$. בגאוסית: $1/\sqrt{2\pi \times 8.333} = 0.13820$ בשיא, $+0.9\%$; ב-$k = 5$ וב-$15$, שניהם $0.13820\,e^{-1.5} = 0.03084$, $-0.6\%$ ו-$-0.3\%$. (ג) $P(k \le 5) \approx \Phi(-4.5/2.887) = \Phi(-1.559) = 0.0595$, ואותו דבר עבור $P(k \ge 15)$. (ד) $\gamma_1 = (2/3)/2.887 = 0.231$; ב-$n = 600$, $(2/3)/9.129 = 0.073$; ב-$6000$, $(2/3)/28.87 = 0.023$.
      - kind: reasoning
        text: >-
          (ב) חמישה מהתוחלת לכל צד, ההסתברויות הבודדות כמעט שוות והגאוסית טובה עד כדי אחוז; הנטייה מתגלה רחוק יותר ובסכומים. שניים רחוק יותר, ב-$k = 4$ וב-$16$, הערכים המדויקים הם $0.0139$ ו-$0.0174$, וה-$0.0159$ של הגאוסית גבוה ב-$15\%$ בצד אחד ונמוך ב-$8\%$ בצד השני. (ג) הגאוסית סימטרית סביב $10$ ואינה יכולה להבחין בין שמאל לימין. הבינומית חסומה ב-$0$ משמאל, במרחק $3.5\sigma_k$ בלבד, וב-$60$ מימין, במרחק $17\sigma_k$; כשהתוחלת קבועה ב-$10$, ההסתברות שנדחקת החוצה משמאל חייבת לשבת בזנב ימני ארוך יותר. (ד) העודף של היחס מעל $1$ עוקב אחרי הצידוד וקטן פי $2.6$ ופי $3.2$ בשתי ההגדלות פי עשרה, ומתקרב ל-$\sqrt{10} = 3.16$. הקביעה של השיעור לגבי $p \ne \tfrac12$, שהאיבר מהסדר השלישי בפיתוח שורד והשגיאה היחסית דועכת רק כמו $n^{-1/2}$, היא הצידוד הזה.
      - kind: limit
        text: >-
          $p = \tfrac12$: $\gamma_1 = 0$, הבינומית סימטרית, והשגיאה המובילה של הגאוסית היא מסדר $1/n$. $p \to 0$ ב-$n$ קבוע: $\gamma_1 \to 1/\sqrt{np}$, גדול, והגאוסית נכשלת לגמרי; זה המשטר שבו $np$ נשאר קטן, והמניין מתואר טוב יותר בהתפלגויות אחרות. ב-$p$ קבוע, כאשר $n \to \infty$ מתקיים $\gamma_1 \to 0$, ודה-מואבר-לפלס נעשה מדויק בקרבת השיא.
      - kind: result
        text: >-
          (א) $10 \pm 2.89$ פעמים שש. (ב) $0.1370$, $0.0310$, $0.0309$ במדויק לעומת $0.1382$, $0.0308$, $0.0308$. (ג) הגאוסית נותנת $0.0595$ לשני הזנבות, והערכים המדויקים הם $0.0512$ ו-$0.0648$: המניין נוטה ימינה כי הוא חסום ב-$0$. (ד) צידוד של $0.23$, $0.073$, $0.023$; הנטייה דועכת כמו $n^{-1/2}$, ואילו במטבע הוגן השגיאה המובילה היא מסדר $1/n$.

  - id: W-3.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-3.1-6, OBJ-3.1-5]
    prompt: >-
      טענות על ענן. ענן של $N = 10^4$ הולכים הוגנים של $\pm 1$ רץ עד $t = 1000$. אמרו אם כל טענה נכונה, ותקנו את השגויות במספר.
      (א) "עם $10^6$ הולכים במקום זאת, הענן היה צר יותר."
      (ב) "העמודה בהיסטוגרמה מ-$x = 0$ עד מעט מתחת ל-$10$ מכילה $12.5\%$ מההולכים בכל הרצה, והעמודה מ-$60$ עד מעט מתחת ל-$70$ ברת-שחזור באותה מידה."
      (ג) "הפיזור של הענן, $31.6$, חוזר מהרצה להרצה בשלוש ספרות משמעותיות."
      (ד) "הממוצע של הצבר נשאר באפס כי הולכים שמתרחקים הרבה נמשכים בחזרה."
      (ה) "במקום $10^4$ הולכים, אני יכול לעקוב אחרי הולך אחד במשך $10^7$ צעדים ולשרטט היסטוגרמה של המיקומים שהוא מבקר בהם; זה נותן את אותו פרופיל."
    answer: >-
      (א) שגוי: הפיזור הוא $\sigma_1\sqrt t = 31.6$ לכל $N$; יותר הולכים רק קובעים אותו טוב יותר, עד כדי בערך $1/\sqrt{2N}$: $0.7\%$, ואחר כך $0.07\%$. (ב) נכון בחלקו: העמודה הראשונה מכילה $f = 0.125$ ומתפזרת ב-$0.0033$, $2.7\%$ מערכה; השנייה מכילה $0.0165$ ומתפזרת ב-$0.0013$, $7.7\%$: הזנבות פחות ברי-שחזור. (ג) שגוי: שתי ספרות; $31.6 \pm 0.24$. כדי להוריד את הפיזור הזה ל-$0.05$ דרושים $2 \times 10^5$ הולכים. (ד) שגוי: ההעתק הצפוי הבא של כל הולך הוא אפס בכל מקום שבו הוא נמצא; שום דבר אינו מושך. (ה) שגוי: המיקומים של הולך אחד לאורך זמן אינם הגרלות מההתפלגות ב-$t = 1000$; שמונה הולכים כאלה נתנו היסטוגרמות שמרכזיהן בכל מקום בין $-1100$ ל-$+2100$, ברוחבים מ-$470$ עד $1830$.
    solution:
      - kind: law
        text: >-
          הפרופיל של הענן הוא ההתפלגות של המיקום של הולך אחד בזמן $t$, נדגמת $N$ פעמים באופן בלתי תלוי. הרוחב שלו הוא תכונה של ההתפלגות הזו, $\sigma_1\sqrt t$; עד כמה ענן סופי משחזר אותו זו שאלה של שגיאות תקן. עמודה שמכילה חלק $f$ מההתפלגות היא הממוצע של $N$ הגרלות בלתי תלויות של כן או לא, ולכן היא מתפזרת ב-$\sqrt{f(1 - f)/N}$. סטיית התקן של מדגם של $N$ הגרלות גאוסיות מתפזרת בערך ב-$\sigma/\sqrt{2N}$.
      - kind: reasoning
        text: >-
          (א) הפיזור נקבע לפי הצעד ולפי $t$, לא לפי מספר ההולכים שנספרים. עם $10^4$ הולכים הוא ידוע עד כדי $1/\sqrt{2 \times 10^4} = 0.71\%$; עם $10^6$, עד כדי $0.071\%$. על פני $64$ זרעים של $10^4$ הולכים הפיזור הנמדד היה $31.66$, עם פיזור של $0.76\%$ מזרע לזרע; על פני $8$ זרעים של $10^6$, $31.627$, עם פיזור של $0.08\%$. (ד) המודל אינו מתייחס לראשית בשום מקום: כל צעד אינו תלוי במיקום. הממוצע נשאר באפס כי הוא הממוצע של העתקים שהתוחלת של כל אחד מהם אפס; הולכים ב-$+30$ נשארים ב-$+30$ בממוצע (השיעור מדד זאת).
      - kind: substitution
        text: >-
          (ב) ב-$t = 1000$ ההולכים יושבים על אתרים זוגיים; העמודה הראשונה מכילה את האתרים $0$ עד $8$, והבינומית המדויקת נותנת $f = 0.1246$, עם פיזור $\sqrt{0.1246 \times 0.8754/10^4} = 0.0033$. העמודה מ-$60$ עד $68$ מכילה $f = 0.0165$, עם פיזור $\sqrt{0.0165 \times 0.9835/10^4} = 0.0013$. על פני $16$ זרעים: $0.1250$ עם פיזור $0.0029$, ו-$0.0162$ עם פיזור $0.0012$. (ג) $31.6 \times 0.0071 = 0.22$, נמדד $0.24$. כדי להגיע ל-$0.05$, $N = 1/\big(2 \times (0.05/31.6)^2\big) = 2.0 \times 10^5$.
      - kind: reasoning
        text: >-
          (ה) הצבר ב-$t = 1000$ הוא $10^4$ עותקים בלתי תלויים של משתנה מקרי אחד, $x_{1000}$. המיקומים של הולך אחד ב-$t = 1, 2, \dots, 10^7$ הם משהו אחר: הגרלות בכל הזמנים, מהתפלגויות שממשיכות להתרחב, וכל אחת מתואמת חזק עם קודמתה. הריצו שמונה הולכים במשך $10^7$ צעדים כל אחד: המרכזים של המיקומים שהם מבקרים בהם הם $-1122$, $-221$, $448$, $1147$, $1616$, $1618$, $1667$ ו-$2093$, עם פיזורים מ-$468$ עד $1827$. ההיסטוגרמה הזו אינה ברת-שחזור כלל, כי היא תלויה במקום שבו ההולך האחד הזה נדד במקרה. החלפה של ממוצע על צבר בממוצע על זמן דורשת תהליך סטציונרי בעל זיכרון קצר, וההילוך החופשי אינו אף אחד מהשניים.
      - kind: limit
        text: >-
          $N \to \infty$: ההיסטוגרמה הופכת לבינומית במדויק, בלי שום פיזור, בעוד כל הולך נשאר בלתי צפוי כמו קודם. $N = 1$: ה"היסטוגרמה" היא קוץ אחד, והפיזור שלה חסר משמעות. לעמודות הרחוקות בזנבות, שבהן $f \ll 1$, יש פיזור יחסי $1/\sqrt{fN}$: ככל שהאירוע נדיר יותר, נדרשים יותר הולכים כדי לראות את השכיחות שלו.
      - kind: result
        text: >-
          (א) הרוחב אינו תלוי ב-$N$; אי-הוודאות שלו כן, כמו $N^{-1/2}$. (ב) העמודות המרכזיות ברות-שחזור עד כדי אחוזים בודדים, עמודות הזנב פחות: פיזור יחסי $\sqrt{(1 - f)/(fN)}$. (ג) שתי ספרות ב-$N = 10^4$; שלוש דורשות כ-$2 \times 10^5$ הולכים. (ד) אין כוח מחזיר: הממוצע הוא ממוצע של העתקים בעלי תוחלת אפס. (ה) ההיסטוריה בזמן של הולך חופשי אחד אינה צבר.

  - id: W-3.1-08
    level: bagrut
    objectives: [OBJ-3.1-1, OBJ-3.1-6]
    prompt: >-
      דיו במים. מדלו מולקולת צבען במים עומדים כהילוך אקראי: בכל זמן $\tau$ היא זזה ב-$\pm\ell$ לאורך כל אחד מהצירים $x$, $y$ ו-$z$, כששלושת הסימנים בלתי תלויים, וכל אחד מהם $+$ או $-$ בסיכויים שווים.
      (א) הראו ש-$\langle x^2 \rangle = 2Dt$ עם $D = \ell^2/(2\tau)$, וש-$\langle r^2 \rangle = 6Dt$. $D$ הוא מקדם הדיפוזיה.
      (ב) למולקולת צבען קטנה כמו פלואורסצאין יש $D \approx 4 \times 10^{-10}\,\text{m}^2/\text{s}$ במים בטמפרטורת החדר. כמה זמן לוקח לה להתפזר לאורך ציר אחד עד ששורש ממוצע ריבוע ההעתק הוא $1\,\text{mm}$, $1\,\text{cm}$ ו-$1\,\text{m}$?
      (ג) יחס איינשטיין, בצורה שסטוקס ואיינשטיין נתנו לו עבור כדור ברדיוס $a$ בנוזל שצמיגותו $\eta$, הוא $D = k_BT/(6\pi\eta a)$. עם $\eta = 0.890\,\text{mPa}\,\text{s}$ ו-$T = 298\,\text{K}$, איזה רדיוס נובע מה-$D$ הנמדד? האם הוא סביר למולקולה שמסתה המולרית $332\,\text{g/mol}$?
      (ד) טיפת דיו בכוס מים מתפשטת לעין על פני סנטימטר בתוך דקות. מה אומר על כך (ב)? השוו עם זרם עדין של $1\,\text{mm/s}$.
      (ה) שום דבר אינו דוחף את הצבען מהמקום שבו הוא מרוכז אל המקום שבו אין ממנו. הראו שבכל זאת נוצר שטף נטו: קחו שתי שכבות סמוכות בעובי $\ell$, שמכילות $N_1$ ו-$N_2$ מולקולות ליחידת שטח, וספרו את המולקולות שחוצות את המישור שביניהן בזמן $\tau$ אחד. גזרו את $J = -D\,\mathrm{d}n/\mathrm{d}x$ עבור השטף נטו ליחידת שטח וליחידת זמן, כאשר $n$ היא הצפיפות המספרית.
      (ו) המהירות התרמית של המולקולה לאורך $x$ היא $\sqrt{k_BT/m} = 86\,\text{m/s}$. אילו כל צעד היה מעוף חופשי במהירות הזו, מה היה אורכו של $\ell$? מה זה אומר על מהו "צעד"?
    answer: >-
      (א) כל ציר הוא הילוך $\pm\ell$ בלתי תלוי של $t/\tau$ צעדים: $\langle x^2 \rangle = \ell^2t/\tau = 2Dt$; שלושה צירים נותנים $6Dt$. (ב) $L^2/(2D)$: $1250\,\text{s}$, $21$ דקות; $1.25 \times 10^5\,\text{s}$, יום וחצי; $1.25 \times 10^9\,\text{s}$, $40$ שנה. (ג) $a = 0.61\,\text{nm}$: בערך הגודל של מולקולה במסה כזו. (ד) ההתפשטות בכוס אינה דיפוזיה אלא זרימה: ב-$1\,\text{mm/s}$ סנטימטר נחצה ב-$10\,\text{s}$, לעומת $1.4$ ימים בדיפוזיה. (ה) בזמן $\tau$ מחצית מהמולקולות של כל שכבה חוצות את המישור, ולכן השטף נטו הוא $(N_1 - N_2)/(2\tau) = -(\ell^2/2\tau)\,\mathrm{d}n/\mathrm{d}x$. (ו) $\ell = 2D/v = 9\,\text{pm}$, מאית מגודל המולקולה: הצעדים אינם מעופות; המהירות של המולקולה נשכחת בתוך כ-$5 \times 10^{-14}\,\text{s}$, וההילוך מתאר אותה רק בקני מידה ארוכים מזה.
    solution:
      - kind: given
        text: >-
          צעדים של $\pm\ell$ בכל ציר בכל $\tau$, בלתי תלויים; $D = 4 \times 10^{-10}\,\text{m}^2/\text{s}$; $\eta = 0.890 \times 10^{-3}\,\text{Pa}\,\text{s}$, $T = 298.15\,\text{K}$, $k_BT = 4.116 \times 10^{-21}\,\text{J}$; $m = 0.33231\,\text{kg/mol}/N_A = 5.52 \times 10^{-25}\,\text{kg}$.
      - kind: law
        text: >-
          להילוך אקראי של $n$ צעדים בלתי תלויים בעלי תוחלת אפס ושונות $\sigma_1^2$ יש $\langle x_n^2 \rangle = n\sigma_1^2$. אחרי זמן $t$ מספר הצעדים הוא $t/\tau$. שלושת הצירים הם הילוכים בלתי תלויים, ו-$r^2 = x^2 + y^2 + z^2$.
      - kind: manipulation
        text: >-
          (א) $\sigma_1^2 = \ell^2$ בכל ציר, ולכן $\langle x^2 \rangle = (t/\tau)\ell^2 = 2\,\dfrac{\ell^2}{2\tau}\,t = 2Dt$, ו-$\langle r^2 \rangle = 3 \times 2Dt$. (ה) כל מולקולה בשכבה השמאלית צועדת ימינה בהסתברות $\tfrac12$ וחוצה את המישור; כל מולקולה בשכבה הימנית צועדת שמאלה בהסתברות $\tfrac12$. המספר נטו שחוצה ימינה ליחידת שטח בזמן $\tau$ הוא $\tfrac12(N_1 - N_2)$. עם $N_1 = n(x)\ell$ ו-$N_2 = n(x + \ell)\ell \approx \big(n(x) + \ell\,\mathrm{d}n/\mathrm{d}x\big)\ell$, השטף נטו הוא $J = -\dfrac{\ell^2}{2\tau}\dfrac{\mathrm{d}n}{\mathrm{d}x}$. (ו) למעוף חופשי שמשכו $\tau$ במהירות $v$ יש $\ell = v\tau$; אז $D = \ell^2/(2\tau) = v\ell/2$, ולכן $\ell = 2D/v$.
      - kind: formula
        text: >-
          $\langle x^2 \rangle = 2Dt \qquad D = \dfrac{\ell^2}{2\tau} \qquad t_L = \dfrac{L^2}{2D} \qquad a = \dfrac{k_BT}{6\pi\eta D} \qquad J = -D\,\dfrac{\mathrm{d}n}{\mathrm{d}x}$
      - kind: limit
        text: >-
          ריכוז אחיד: $\mathrm{d}n/\mathrm{d}x = 0$ ו-$J = 0$, אף שכל מולקולה ממשיכה לנוע; מספרים שווים חוצים לכל כיוון. $t_L \propto L^2$: מרחק גדול פי מאה דורש זמן ארוך פי עשרת אלפים, חוק ה-$\sqrt t$ בקריאה הפוכה. ב-(ג), חלקיק גדול יותר או נוזל צמיג יותר מתפזרים לאט יותר, ונוזל חם יותר מהר יותר, כמו $D \propto T/(\eta a)$. וכאשר $\ell$ ו-$\tau$ קטנים יחד ו-$\ell^2/(2\tau)$ קבוע, ההילוך הופך לדיפוזיה הרציפה של מודול 18.
      - kind: units
        text: >-
          $D = \ell^2/\tau$ ב-$\text{m}^2/\text{s}$; $L^2/D$ ב-$\text{s}$. $k_BT/(\eta D)$: $\text{J}/(\text{Pa}\,\text{s} \cdot \text{m}^2/\text{s}) = \text{J}/(\text{N}) = \text{m}$. $J$: $\text{m}^2/\text{s} \times \text{m}^{-3}/\text{m}$, מולקולות למטר רבוע לשנייה.
      - kind: substitution
        text: >-
          (ב) $2D = 8 \times 10^{-10}\,\text{m}^2/\text{s}$: $(10^{-3})^2/(8 \times 10^{-10}) = 1250\,\text{s}$; $(10^{-2})^2/(8 \times 10^{-10}) = 1.25 \times 10^5\,\text{s} = 1.45$ ימים; $1/(8 \times 10^{-10}) = 1.25 \times 10^9\,\text{s} = 39.6$ שנים. (ג) $a = 4.116 \times 10^{-21}/(6\pi \times 0.890 \times 10^{-3} \times 4 \times 10^{-10}) = 6.1 \times 10^{-10}\,\text{m}$. (ד) $10^{-2}/10^{-3} = 10\,\text{s}$; היחס בין שני הזמנים, $vL/(2D) = 1.25 \times 10^4$, אומר שעל פני סנטימטר הזרם הקל ביותר גובר. (ו) $\ell = 8 \times 10^{-10}/86.4 = 9.3 \times 10^{-12}\,\text{m}$.
      - kind: reasoning
        text: >-
          (ג) מולקולה של $332\,\text{g/mol}$ בצפיפות של נוזל, כ-$10^3\,\text{kg/m}^3$, תופסת כ-$5.5 \times 10^{-28}\,\text{m}^3$, כדור ברדיוס $0.5\,\text{nm}$: לרדיוס סטוקס יש הגודל הנכון, וזה כל מה שנוסחה של תווך רציף, כשמחילים אותה על מולקולה אחת, יכולה להבטיח. (ה) השטף בא מספירה, לא מכוח: כל מולקולה עשויה לצעוד שמאלה או ימינה באותה מידה בכל מקום שבו היא נמצאת, ויותר מולקולות בצד אחד פירושן יותר מעברים מהצד הזה. זה הצבר של השיעור בלי כוח מחזיר, נקרא כשטף. (ו) תשעה פיקומטרים הם מאית מהגודל של המולקולה עצמה. ההתנגשויות עם המים מגרילות את המהירות שלה מחדש בתוך $\tau_c = D/v^2 = 5.4 \times 10^{-14}\,\text{s}$, ששווה ל-$m/(6\pi\eta a)$, הזמן שלוקח לחיכוך לעצור אותה. ההילוך עם צעדים $\ell$ ו-$\tau$ הוא תיאור בקני מידה ארוכים בהרבה מזה, שבהם רק $D$ שורד: משפט הגבול המרכזי פועל על ההעתקים הזעירים הרבים שמרכיבים צעד נצפה אחד.
      - kind: result
        text: >-
          (א) $\langle x^2 \rangle = 2Dt$, $\langle r^2 \rangle = 6Dt$, $D = \ell^2/(2\tau)$. (ב) $21$ דקות למילימטר, $1.4$ ימים לסנטימטר, $40$ שנה למטר. (ג) רדיוס סטוקס של $0.61\,\text{nm}$, בגודל מולקולרי. (ד) דיו שמתפשט בתוך דקות נישא בזרמים, שחוצים סנטימטר בשניות. (ה) $J = -D\,\mathrm{d}n/\mathrm{d}x$ מספירת מעברים, בלי כוח. (ו) $\ell = 9\,\text{pm}$: הצעדים הם תיאור בקנה מידה גס, לא מעופות.

  - id: W-3.1-09
    level: bagrut
    objectives: [OBJ-3.1-6, OBJ-3.1-1, OBJ-3.1-2]
    prompt: >-
      שאלה 5 של ThermoLab, מעבר לדוגמה 5: כמה פעמים הולך חוזר הביתה? הולך $\pm 1$ הוגן מתחיל בראשית. יהי $u_t = P(x_t = 0) = \binom{t}{t/2}2^{-t}$ עבור $t$ זוגי; דוגמה 5 מצאה $u_t \approx \sqrt{2/(\pi t)}$.
      (א) המספר הצפוי של ביקורים בבית ב-$T$ הצעדים הראשונים הוא $V(T) = u_2 + u_4 + \cdots + u_T$. הראו ש-$V(T) \approx \sqrt{2T/\pi}$ עבור $T$ גדול, וחשבו אותו ב-$T = 100$ וב-$10^4$. (במדויק, $V(T) = (T + 1)u_T - 1$.)
      (ב) נניח שהולך שעזב את הבית חוזר אליו בהסתברות $R$. הולך שזה עתה חזר הביתה מתחיל מחדש, והצעדים הבאים שלו בלתי תלויים בכל מה שקדם. הראו שאז למספר החזרות יש תוחלת $R/(1 - R)$. מה אומר (א) על $R$?
      (ג) משפט קובע שההסתברות לא לחזור הביתה במהלך $2m$ הצעדים הראשונים היא $u_{2m}$. בדקו זאת על ידי מניית המסלולים עבור $2m = 2$ ו-$2m = 4$. איזה חלק מההולכים עדיין לא חזר הביתה אחרי $1000$ צעדים? ואחרי $10^6$?
      (ד) כל הולך חוזר הביתה, ובכל זאת הזמן הממוצע עד שהוא חוזר אינסופי. הסבירו, בעזרת (ג).
      (ה) בדקו את "מתחיל מחדש". הריצו $2 \times 10^4$ הולכים במשך $1000$ צעדים והשאירו את אלה שעומדים בבית ב-$t = 500$. חזו את הפיזור של ההעתק שלהם $x_{1000} - x_{500}$, ואת החלק מהם שנמצא שוב בבית ב-$t = 502$.
    answer: >-
      (א) $V(T) \approx \tfrac12\int_0^T\sqrt{2/(\pi t)}\,\mathrm{d}t = \sqrt{2T/\pi}$; במדויק $7.04$ ב-$T = 100$ ו-$78.8$ ב-$10^4$, לעומת $7.98$ ו-$79.8$. הוא גדל בלי גבול. (ב) למספר החזרות $J$ יש $P(J = j) = R^j(1 - R)$, עם תוחלת $R/(1 - R)$; היא סופית אלא אם $R = 1$, ולכן $R = 1$: כל הולך חוזר הביתה. (ג) $2$ מתוך $4$ מסלולים ו-$6$ מתוך $16$ אינם חוזרים, $u_2 = \tfrac12$ ו-$u_4 = \tfrac38$. עדיין לא חזרו: $u_{1000} = 0.0252$; $u_{10^6} = 8.0 \times 10^{-4}$. (ד) זמן ההמתנה הממוצע הוא הסכום על פני $t$ של ההסתברות שההולך עדיין לא חזר ב-$t$, שאיבריו דועכים רק כמו $t^{-1/2}$: הוא מתבדר. (ה) $\sqrt{500} = 22.4$, ו-$\tfrac12$; נמדד $22.3 \pm 0.2$ ו-$0.500 \pm 0.006$.
    solution:
      - kind: given
        text: >-
          הילוך $\pm 1$ הוגן מ-$x_0 = 0$; חזרות אפשריות רק ב-$t$ זוגי; $u_t = \binom{t}{t/2}2^{-t} \approx \sqrt{2/(\pi t)}$, עם שגיאה יחסית של כ-$1/(4t)$.
      - kind: law
        text: >-
          המספר הצפוי של ביקורים הוא סכום ההסתברויות להיות בבית בכל זמן, כי מניין הוא סכום של משתנים מציינים ותוחלות מתחברות תמיד. הצעדים במודל בלתי תלויים בעבר, ולכן מכל זמן שבו ההולך עומד בבית העתיד הוא הילוך חדש מהראשית.
      - kind: manipulation
        text: >-
          (א) עם $t = 2j$, $V(T) = \sum_{j=1}^{T/2}\sqrt{1/(\pi j)} \approx \int_0^{T/2}\dfrac{\mathrm{d}j}{\sqrt{\pi j}} = 2\sqrt{\dfrac{T}{2\pi}} = \sqrt{\dfrac{2T}{\pi}}$. (ב) כל חזרה היא התחלה חדשה, ולכן הסיכוי לחזרה נוספת הוא שוב $R$, באופן בלתי תלוי: ההסתברות ל-$j$ חזרות לפחות היא $R^j$, והמספר הממוצע של חזרות הוא $\sum_{j \ge 1}R^j = R/(1 - R)$. התוחלת הזו היא $V(\infty)$, ש-(א) מראה שהוא אינסופי; $R/(1 - R) = \infty$ רק עבור $R = 1$. (ג) $2m = 2$: מתוך $++$, $+-$, $-+$, $--$, רק $++$ ו-$--$ נמנעים מ-$0$ ב-$t = 2$: $\tfrac24$. $2m = 4$: מסלולים שמתחילים ב-$++$ עומדים ב-$2$ ונמנעים מ-$0$ ב-$t = 4$ אלא אם הם ממשיכים ב-$--$, שלושה מתוך ארבעה; וכך גם מ-$--$: $6$ מתוך $16$. (ד) זמן ההמתנה $T_\mathrm{r}$ זוגי, ו-$\langle T_\mathrm{r} \rangle = \sum_{t \ge 0}P(T_\mathrm{r} > t) = 2\sum_{m \ge 0}P(T_\mathrm{r} > 2m) = 2\sum_m u_{2m}$, שמתבדר יחד עם $V$.
      - kind: formula
        text: >-
          $V(T) = \sum_{j=1}^{T/2} u_{2j} \approx \sqrt{\dfrac{2T}{\pi}} \qquad \langle J \rangle = \dfrac{R}{1 - R} \qquad P(T_\mathrm{r} > 2m) = u_{2m} \approx \dfrac{1}{\sqrt{\pi m}}$
      - kind: limit
        text: >-
          $T$ קטן: $V(2) = u_2 = \tfrac12$, ואילו $\sqrt{4/\pi} = 1.13$; האינטגרל מגזים בתרומה של האיברים הראשונים, ו-$V(T)$ נמוך מ-$\sqrt{2T/\pi}$ בכ-$1$ בכל $T$ גדול. בשלושה ממדים ההסתברות להיות בבית דועכת כמו $t^{-3/2}$, סכום הביקורים מתכנס, $R < 1$ (כ-$0.34$, תוצאה של פוליה), והולך עשוי לא לחזור לעולם. השורש בממד אחד הוא בדיוק מה שגורם לסכום להתבדר.
      - kind: substitution
        text: >-
          (א) סכומים מדויקים: $V(100) = 7.04$, $V(10^4) = 78.79$, כל אחד שווה ל-$(T + 1)u_T - 1$; $\sqrt{200/\pi} = 7.98$ ו-$\sqrt{2 \times 10^4/\pi} = 79.79$. ב-$T = 1000$, $V = 24.25$, ו-$8$ זרעים של $2 \times 10^4$ הולכים מנו $24.27 \pm 0.04$ ביקורים לכל הולך. (ג) $u_{1000} = 0.02523$; במדידה, $0.0253 \pm 0.0004$ מההולכים לא חזרו הביתה ($8$ זרעים). $u_{10^6} = 7.98 \times 10^{-4}$. (ה) כ-$710$ הולכים לכל זרע עומדים בבית ב-$t = 500$ ($u_{500} = 0.0357$). $500$ הצעדים הבאים שלהם מתפזרים ב-$22.34 \pm 0.22$, לעומת $\sqrt{500} = 22.36$, ו-$0.500 \pm 0.006$ מהם שוב בבית ב-$t = 502$, לעומת $u_2 = \tfrac12$.
      - kind: reasoning
        text: >-
          להיות בבית בזמן מאוחר נתון זה לא סביר, ולחזור הביתה אי פעם זה ודאי; אלה שאלות שונות, ו-(א) ו-(ב) מקשרים ביניהן. שום דבר אינו מושך את ההולך הביתה: הוא חוזר כי הענן של הילוך חד-ממדי מתרחב כל כך לאט שהראשית לעולם אינה נשארת מאחור, ואילו לזמן שבין חזרות אין תוחלת סופית. (ה) מאשר את הנחת המודל, שלהילוך אין זיכרון של כך שחזר הביתה.
      - kind: result
        text: >-
          (א) $V(T) \approx \sqrt{2T/\pi}$, בלתי חסום: $7.0$ ביקורים עד $T = 100$, $79$ עד $10^4$. (ב) מספר בלתי חסום של ביקורים מחייב $R = 1$. (ג) החלק שעדיין לא חזר אחרי $2m$ צעדים הוא $u_{2m}$: $2.5\%$ אחרי $1000$ צעדים, $0.08\%$ אחרי $10^6$. (ד) $\langle T_\mathrm{r} \rangle = 2\sum_m u_{2m} = \infty$. (ה) הולך שזה עתה חזר הביתה מתנהג כמו הולך חדש: פיזור של $22.4$ ב-$500$ הצעדים הבאים, ושוב בבית ב-$t = 502$ בהסתברות $\tfrac12$.

  - id: W-3.1-10
    level: bagrut
    objectives: [OBJ-3.1-3, OBJ-3.1-4]
    prompt: >-
      צעד בלתי סימטרי, וכמה לאט הנטייה שלו דועכת. צעד הוא $+3$ בהסתברות $\tfrac14$ ו-$-1$ בהסתברות $\tfrac34$.
      (א) מצאו את $\mu_1$, את $\sigma_1^2$, את המומנט המרכזי השלישי $\langle (s - \mu_1)^3 \rangle$ ואת הצידוד $\gamma_1 = \langle (s - \mu_1)^3 \rangle/\sigma_1^3$.
      (ב) הראו שלצעדים בלתי תלויים המומנטים המרכזיים השלישיים מתחברים, כמו השונויות, ומכאן שהצידוד של $S_n = s_1 + \cdots + s_n$ הוא $\gamma_1/\sqrt n$. הגבנוניות העודפת, מדד למשקל הזנבות, דועכת כמו $1/n$; לצעד הזה היא $-\tfrac23$. איזו מהשתיים דועכת לאט יותר?
      (ג) כמה צעדים מורידים את הצידוד אל מתחת ל-$0.1$, ואל מתחת ל-$0.01$?
      (ד) $S_n = 4k - n$, כאשר $k$ הוא המספר הבינומי של צעדי $+3$. עבור $z = S_n/\sqrt{3n}$ הזנבות המדויקים הם: ב-$n = 100$, $P(z \ge 3) = 2.75 \times 10^{-3}$ ו-$P(z \le -3) = 1.03 \times 10^{-3}$; ב-$n = 1000$, $1.42 \times 10^{-3}$ ו-$1.02 \times 10^{-3}$; ב-$n = 10^4$, $1.46 \times 10^{-3}$ ו-$1.32 \times 10^{-3}$. הגאוסית נותנת $1.35 \times 10^{-3}$ לכל אחד. הסבירו איזה זנב כבד, וכמה מהר ההבדל דועך.
      (ה) השיעור מצא שלדה-מואבר-לפלס יש שגיאה יחסית מסדר $1/n$ במטבע הוגן ומסדר $n^{-1/2}$ אחרת. קשרו זאת לשאלה הזו.
    answer: >-
      (א) $\mu_1 = 0$, $\sigma_1^2 = 3$, $\langle s^3 \rangle = 6$, $\gamma_1 = 6/3^{3/2} = 1.155$. (ב) כל איבר מעורב ב-$\langle (\sum s_i)^3 \rangle$ מכיל צעד כלשהו בחזקה ראשונה לבדו, והממוצע שלו אפס, ולכן $\langle S_n^3 \rangle = 6n$ והצידוד הוא $6n/(3n)^{3/2} = \gamma_1/\sqrt n$. הצידוד, שדועך כמו $n^{-1/2}$, דועך לאט יותר מהגבנוניות העודפת, שדועכת כמו $1/n$. (ג) $n \ge 134$ ו-$n \ge 13\,334$. (ד) הזנב הימני, בגלל צעדי ה-$+3$ הנדירים: פי שניים מהגאוסית ב-$n = 100$. אי-הסימטריה $(P_+ - P_-)/(2 \times 1.35 \times 10^{-3})$ היא $0.64$, $0.15$, $0.052$: היא קטנה פי $4.3$ ואחר כך פי $2.9$ בכל הגדלה פי עשרה של $n$, ומתקרבת לפי $\sqrt{10}$, כלומר דועכת כמו $n^{-1/2}$. (ה) לבינומית עם $p \ne \tfrac12$ יש צידוד $(1 - 2p)/\sqrt{np(1 - p)}$, השגיאה המובילה, מסדר $n^{-1/2}$; במטבע ההוגן הוא מתאפס, והשגיאה הראשונה שנותרת היא הגבנוניות, מסדר $1/n$.
    solution:
      - kind: given
        text: >-
          $s = +3$ בהסתברות $\tfrac14$, $s = -1$ בהסתברות $\tfrac34$; צעדים בלתי תלויים.
      - kind: law
        text: >-
          משפט הגבול המרכזי אומר שהסכום המתוקנן שואף לגאוסית; הוא אינו אומר כמה מהר. את הקצב קובעים המומנטים שמעבר לשני: לצעדים בלתי תלויים בעלי תוחלת אפס, המומנט המרכזי השלישי של הסכום הוא סכום המומנטים השלישיים, בדיוק כמו בשונויות, כי הממוצע של איבר שמכיל צעד אחד בחזקה ראשונה לבדו הוא אפס.
      - kind: manipulation
        text: >-
          (א) $\mu_1 = \tfrac34 - \tfrac34 = 0$; $\langle s^2 \rangle = \tfrac94 + \tfrac34 = 3$; $\langle s^3 \rangle = \tfrac{27}4 - \tfrac34 = 6$; $\langle s^4 \rangle = \tfrac{81}4 + \tfrac34 = 21$, ולכן הגבנוניות העודפת היא $(21 - 3 \times 9)/9 = -\tfrac23$. (ב) $\langle S_n^3 \rangle = \sum_{i,j,l}\langle s_is_js_l \rangle$. אם אינדקס אחד שונה משני האחרים, או ששלושתם שונים, הממוצע מתפרק למכפלה ומכיל $\langle s_i \rangle = 0$ בודד. רק $i = j = l$ שורד: $\langle S_n^3 \rangle = n\langle s^3 \rangle$. עם $\sigma_{S_n} = \sigma_1\sqrt n$, הצידוד הוא $n\langle s^3 \rangle/(\sigma_1^3n^{3/2}) = \gamma_1/\sqrt n$.
      - kind: formula
        text: >-
          $\gamma_1 = \dfrac{\langle s^3 \rangle}{\sigma_1^3} = \dfrac{6}{3^{3/2}} = \dfrac{2}{\sqrt 3} \qquad \gamma_1(S_n) = \dfrac{\gamma_1}{\sqrt n} \qquad \gamma_2(S_n) = -\dfrac{2}{3n} \qquad n > \left(\dfrac{\gamma_1}{\epsilon}\right)^2$
      - kind: substitution
        text: >-
          (ג) $(1.1547/0.1)^2 = 133.3$, ולכן $n \ge 134$; $(1.1547/0.01)^2 = 13\,333$, ולכן $n \ge 13\,334$. ב-$n = 100$ הצידוד החזוי הוא $0.1155$; $8$ זרעים של $20\,000$ סכומים בסימולציה נותנים $0.116 \pm 0.009$. (ד) $(2.75 - 1.03)/2.70 = 0.64$; $(1.42 - 1.02)/2.70 = 0.15$; $(1.46 - 1.32)/2.70 = 0.052$. הצידוד ב-$n$ האלה הוא $0.115$, $0.037$, $0.012$: כש-$n$ גדול אי-הסימטריה היא בערך פי $4.4$ מהצידוד, ודועכת יחד איתו.
      - kind: reasoning
        text: >-
          (ד) הסכום נדחף רחוק ימינה רק על ידי עודף של צעדי $+3$, שהם נדירים אבל גדולים; רחוק שמאלה, רק על ידי עודף של צעדי $-1$, שהם נפוצים אבל קטנים, וזה קשה יותר באותו מרחק. הגאוסית, הסימטרית מעצם בנייתה, אינה יכולה לייצג זאת, ולכן הזנב הימני עולה עליה והשמאלי נופל ממנה. ההבדל דועך יחד עם הצידוד, כמו $n^{-1/2}$: ב-$n = 100$ האירוע הנדיר $z \ge 3$ סביר פי שניים ממה שהגאוסית אומרת, וב-$n = 10^4$ הוא עדיין סביר ב-$8\%$ יותר ממה שהיא אומרת. סכום ש"התכנס" במרכזו עדיין יכול לטעות בזנבותיו פי שניים. (ה) כאן $k$ בינומי עם $p = \tfrac14$, והצידוד שלו $(1 - 2p)/\sqrt{np(1 - p)} = 0.5/\sqrt{3n/16} = 1.155/\sqrt n$ הוא בדיוק הצידוד של $S_n = 4k - n$, כי החלפת משתנה ליניארית אינה משנה צידוד. האיבר מהסדר השלישי שדה-מואבר-לפלס משמיט הוא הצידוד הזה; ב-$p = \tfrac12$ הוא אפס.
      - kind: limit
        text: >-
          $n = 1$: הצעד עצמו, שני קוצים ב-$+3$ וב-$-1$, צידוד $1.15$, ואין בו שום דבר גאוסי. לצעד סימטרי ($+1$ ו-$-1$ בסיכויים שווים) יש $\gamma_1 = 0$, והסכומים שלו מתקרבים לגאוסית כמו $1/n$. ככל שהצעד הנדיר גדל ($+a$ בהסתברות $1/(a + 1)$, ו-$-1$ אחרת), $\gamma_1$ גדל כמו $\sqrt a$, ומספר הצעדים הדרוש לצידוד נתון גדל כמו $a$: ככל שהצעד בלתי סימטרי יותר, המשפט מתממש לאט יותר, אבל הוא תמיד מתממש כל עוד השונות סופית.
      - kind: result
        text: >-
          (א) $\mu_1 = 0$, $\sigma_1^2 = 3$, מומנט שלישי $6$, $\gamma_1 = 1.155$. (ב) המומנטים השלישיים מתחברים, ולכן הצידוד של הסכום הוא $\gamma_1/\sqrt n$, ודועך לאט יותר מהגבנוניות העודפת, $-2/(3n)$. (ג) $134$ צעדים עבור $0.1$, $13\,334$ עבור $0.01$. (ד) הזנב הימני כבד; אי-הסימטריה בשלוש סטיות תקן היא $0.64$, $0.15$ ו-$0.052$ ב-$n = 100$, $1000$ ו-$10^4$, ודועכת כמו $n^{-1/2}$. (ה) שגיאת ה-$n^{-1/2}$ של דה-מואבר-לפלס עבור $p \ne \tfrac12$ היא הצידוד של הבינומית; למטבע ההוגן אין צידוד.

challenge:
  - id: W-3.1-c1
    stars: 1
    objectives: [OBJ-3.1-3, OBJ-3.1-1]
    prompt: >-
      ספר השיאים: הילוך שצעדיו אינם זהים. קחו סדרה של הגרלות בלתי תלויות $x_1, x_2, \dots$, כולן מאותה התפלגות רציפה $p(x)$. ההגרלה $x_n$ היא שיא אם היא גדולה מכל ההגרלות שלפניה; יהי $R_n = 1$ אם היא שיא, ו-$0$ אם לא ($R_1 = 1$). מספר השיאים אחרי $N$ הגרלות, $S_N = R_1 + \cdots + R_N$, הוא הילוך שצעדיו $0$ או $1$.
      (א) הראו שתהיה $p(x)$ אשר תהיה, ההסתברות ש-$x_n$ היא שיא היא $P_n = 1/n$.
      (ב) מצאו את המספר הממוצע של שיאים $\langle S_N \rangle$, וכיצד הוא גדל עבור $N \gg 1$. חשבו אותו עבור $N = 1000$ ו-$10^6$. אם מספר המתחרים בענף ספורט מוכפל בכל שנה, כיצד גדל מספר השיאים עם הזמן?
      (ג) הראו ש-$\langle R_nR_m \rangle - \langle R_n \rangle\langle R_m \rangle = 0$ עבור $n \ne m$. (למעשה המשתנים המציינים בלתי תלויים, אף שאין להם אותה התפלגות.)
      (ד) מצאו את השונות ואת הקומולנט השלישי (המומנט המרכזי השלישי) של $S_N$, וחשבו את הצידוד ב-$N = 1000$, $10^6$ ו-$10^9$. משפט הגבול המרכזי של השיעור דורש צעדים בעלי אותה התפלגות; לצעדים כאן אין אותה התפלגות. האם $S_N$ מתקרב לגאוסית, וכמה מהר?
      (ה) ב-$N = 1000$, ההתפלגות המדויקת נותנת $P(S \le 3) = 0.036$ ו-$P(S \ge 12) = 0.056$. השוו עם הגאוסית בעלת אותה תוחלת ואותה שונות, והסבירו את ההבדל.
    answer: >-
      (א) מבין $n$ ההגרלות הראשונות, כל אחת עשויה באותה מידה להיות הגדולה ביותר, ולכן $P_n = 1/n$. (ב) $\langle S_N \rangle = \sum_{n=1}^N 1/n \approx \ln N + 0.577$: $7.49$ ב-$N = 1000$, $14.39$ ב-$10^6$. הכפלת מספר המתחרים בכל שנה מוסיפה $\ln 2 = 0.69$ שיאים צפויים בשנה: גידול ליניארי בזמן. (ג) עבור $n < m$, $P(R_n = R_m = 1) = \tfrac1m \cdot \tfrac1n$. (ד) $\operatorname{Var}(S_N) = \sum(1/n - 1/n^2) \approx \ln N + 0.577 - 1.645$; $\kappa_3 = \sum(1/n - 3/n^2 + 2/n^3)$; צידוד $0.35$, $0.26$, $0.22$. כן, כי השונות גדלה בלי גבול בעוד כל צעד הוא לכל היותר $1$, כך שאף צעד אינו שולט; אבל הצידוד דועך רק כמו $(\ln N)^{-1/2}$. (ה) הגאוסית נותנת $0.050$ ו-$0.048$: להתפלגות האמיתית זנב שמאלי קל וזנב ימני כבד, הצידוד של $0.35$.
    solution:
      - kind: law
        text: >-
          עבור הגרלות בלתי תלויות מהתפלגות רציפה אחת, כל סידור של $n$ ההגרלות הראשונות סביר באותה מידה, תהיה ההתפלגות אשר תהיה. תוחלות מתחברות תמיד; שונויות וקומולנטים שלישיים מתחברים לאיברים בלתי תלויים. משפט גבול מרכזי מתקיים גם לאיברים בלתי תלויים שאין להם אותה התפלגות, בתנאי לינדברג, שבין השאר דורש שאף איבר בודד לא יישא חלק סופי מהשונות של הסכום; איברים חסומים שהשונות הכוללת שלהם מתבדרת מקיימים זאת.
      - kind: manipulation
        text: >-
          (א) מטעמי סימטריה, הגדולה מבין $x_1, \dots, x_n$ היא כל אחת מהן בהסתברות $1/n$, ו-$x_n$ היא שיא בדיוק כשהיא הגדולה ביותר. בהתפלגות רציפה, להגרלות שוות יש הסתברות אפס. (ג) קחו $n < m$. $R_m = 1$ אומר ש-$x_m$ היא הגדולה מבין $m$ הראשונות, בהסתברות $1/m$. בהינתן זאת, $m - 1$ ההגרלות הראשונות עדיין מסודרות ביניהן בסדר אקראי אחיד, ולכן $x_n$ היא הגדולה מבין $n$ הראשונות בהסתברות $1/n$. לכן $\langle R_nR_m \rangle = 1/(nm) = \langle R_n \rangle\langle R_m \rangle$. (ד) למשתנה של $0$ או $1$ בעל תוחלת $p$ יש שונות $p(1 - p)$ ומומנט מרכזי שלישי $p(1 - p)(1 - 2p)$; עם $p = 1/n$ אלה $1/n - 1/n^2$ ו-$1/n - 3/n^2 + 2/n^3$. סוכמים, עם $\sum 1/n^2 \to \pi^2/6 = 1.645$ ו-$\sum 1/n^3 \to 1.202$.
      - kind: formula
        text: >-
          $\langle S_N \rangle = H_N = \sum_{n=1}^N \frac1n \approx \ln N + \gamma \qquad \operatorname{Var}(S_N) \approx \ln N + \gamma - \frac{\pi^2}{6} \qquad \kappa_3 \approx \ln N + \gamma - \frac{\pi^2}{2} + 2\zeta(3) \qquad \frac{\kappa_3}{\operatorname{Var}^{3/2}} \sim \frac{1}{\sqrt{\ln N}}$
      - kind: limit
        text: >-
          $N = 1$: שיא אחד, בלי שום פיזור, ואכן $H_1 = 1$ ו-$\operatorname{Var} = 1 - 1 = 0$. $N = 2$: שיא שני בהסתברות $\tfrac12$, שונות $\tfrac14$, כפי שהנוסחה נותנת. אילו הצעדים היו זהים, עם $p$ קבוע, הצידוד היה דועך כמו $N^{-1/2}$; כאן מספר הצעדים האפקטיבי הוא השונות, $\ln N$, וההתקרבות איטית באופן לוגריתמי: אפילו $10^9$ הגרלות משאירות צידוד של $0.22$.
      - kind: substitution
        text: >-
          (ב) $H_{1000} = 7.4855$, $H_{10^6} = 14.3927$, לעומת $\ln N + \gamma = 7.4850$ ו-$14.3927$. עם $N_0 2^y$ מתחרים אחרי $y$ שנים, $\langle S \rangle \approx \ln N_0 + y\ln 2 + \gamma$. (ד) $N = 1000$: $\operatorname{Var} = 5.842$, $\kappa_3 = 4.958$, צידוד $4.958/5.842^{3/2} = 0.351$. $N = 10^6$: $12.748$, $11.862$, $0.261$. $N = 10^9$: $19.656$, $18.770$, $0.215$. בסימולציה ב-$N = 1000$, $8$ זרעים של $20\,000$ סדרות, מהגרלות אחידות, מעריכיות ומהתפלגות קושי כאחד: $\langle S \rangle = 7.483 \pm 0.007$, $7.486 \pm 0.006$, $7.482 \pm 0.004$; שונות $5.82 \pm 0.02$, $5.84 \pm 0.02$, $5.83 \pm 0.01$; צידוד $0.359 \pm 0.005$, $0.356 \pm 0.005$, $0.361 \pm 0.006$; והשונות המשותפת של $R_{10}$ ו-$R_{50}$ נמצאת בטווח $0.0002$ מאפס בכל אחת מהן. (ה) עם תוחלת $7.485$ וסטיית תקן $2.417$: $\Phi\big((3.5 - 7.485)/2.417\big) = 0.050$ ו-$1 - \Phi\big((11.5 - 7.485)/2.417\big) = 0.048$. הפער הגדול ביותר בין ההתפלגות המצטברת המדויקת לגאוסית הוא $0.024$ עם תיקון חצי השלם, ו-$0.106$ בלעדיו.
      - kind: reasoning
        text: >-
          (ד) הצעדים בלתי תלויים אבל אינם זהים: הצעד ה-$n$ הוא מטבע שיוצא $1$ בהסתברות $1/n$. המשפט של השיעור אינו חל כפי שנוסח, אבל הגרסה לאיברים שאינם זהים חלה, כי כל איבר הוא לכל היותר $1$ בעוד השונות הכוללת גדלה כמו $\ln N$ בלי גבול. המחיר של צעדים שאינם זהים הוא כאן הקצב: השונות, ולא $N$, ממלאת את תפקידו של מספר הצעדים. (ה) הגאוסית שמה יותר מדי הסתברות על מעט שיאים ומעט מדי על הרבה, כפי שצידוד חיובי מחייב: השיאים באים בעיקר מוקדם, ושיאים מאוחרים, אף שהם נדירים, אינם חסומים. שההתפלגות של $S_N$ אינה תלויה כלל ב-$p(x)$, כולל התפלגות קושי, זה סעיף (א): רק הסדר של ההגרלות משנה.
      - kind: result
        text: >-
          (א) $P_n = 1/n$ לכל התפלגות רציפה. (ב) $\langle S_N \rangle \approx \ln N + 0.577$: $7.5$ שיאים ב-$1000$ הגרלות, $14.4$ ב-$10^6$; ענף שמספר מתחריו מוכפל מוסיף $0.69$ שיאים בשנה. (ג) המשתנים המציינים בלתי מתואמים (למעשה בלתי תלויים). (ד) $\operatorname{Var}(S_N) \approx \ln N - 1.07$; צידוד $0.35$, $0.26$, $0.22$ ב-$10^3$, $10^6$, $10^9$: גאוסי בגבול, מכוח המשפט לאיברים בלתי תלויים שאינם זהים, בקצב האיטי $(\ln N)^{-1/2}$. (ה) $0.036$ ו-$0.056$ במדויק לעומת $0.050$ ו-$0.048$: ההתפלגות נוטה ימינה.
    source:
      name: 'MIT 8.333 Statistical Mechanics I: Statistical Mechanics of Particles (OpenCourseWare)'
      year: 2013
      problem: 'Problem Set 2, Problem 5 (The book of records)'
      url: 'https://ocw.mit.edu/courses/8-333-statistical-mechanics-i-statistical-mechanics-of-particles-fall-2013/b22c2236479dd3e2d4b9a05a3420a1fc_MIT8_333F13_pset2.pdf'
      verified: '2026-11-20'
      adapted: true

  - id: W-3.1-c2
    stars: 2
    objectives: [OBJ-3.1-3, OBJ-3.1-1]
    prompt: >-
      שרשרת קשיחה בשני ממדים: ההילוך המתמיד עם זיכרון רציף. פולימר במישור הוא שרשרת של $N$ קשרים $\mathbf t_1, \dots, \mathbf t_N$, שכל אחד מהם וקטור באורך $a$. הזווית $\theta_i$ מ-$\mathbf t_i$ ל-$\mathbf t_{i+1}$ מוגרלת באופן בלתי תלוי לכל $i$ מהתפלגות אחת, סימטרית סביב $\theta = 0$, עם $c = \langle \cos\theta \rangle$. הקשר הראשון מצביע בכיוון אקראי אחיד. (במקור, הזוויות נושאות משקל שנקבע לפי קשיחות הכפיפה של השרשרת ולפי הטמפרטורה שלה; כל משקל כזה נותן $c$ מסוים אחד.) וקטור הקצה-לקצה הוא $\mathbf R = \mathbf t_1 + \cdots + \mathbf t_N$.
      (א) הראו ש-$\langle \mathbf t_m \cdot \mathbf t_n \rangle = a^2c^{|n - m|} = a^2e^{-|n - m|/\xi}$, ומצאו את $\xi$, מספר הקשרים שלאורכם השרשרת זוכרת את הכיוון שלה. אורך ההתמדה הוא $\xi a$.
      (ב) מצאו את $\langle R^2 \rangle$ במדויק, ואת צורתו עבור $N \gg \xi$. השוו עם ההילוך המתמיד של $\pm 1$ מהשיעור. מהם הגבולות $c = 0$, ו-$c \to 1$ ב-$N$ קבוע? עבור שרשרת קשיחה, $\xi \gg 1$, בטאו את התוצאה במונחי אורך ההתמדה ואורך השרשרת $L = Na$.
      (ג) מצאו את צפיפות ההסתברות של $\mathbf R$ עבור $N \gg \xi$, ואמרו איזה משפט מצדיק אותה, בהינתן שהקשרים אינם בלתי תלויים.
      (ד) קחו $\theta$ אחיד על $[-\pi/4, \pi/4]$. מצאו את $c$, את $\xi$ ואת הגורם של השרשרת הארוכה. סימולציה של $8 \times 4000$ שרשראות של $N = 1000$ קשרים נותנת $\langle R^2 \rangle/(Na^2) = 18.83 \pm 0.14$, $\langle \mathbf t_{100} \cdot \mathbf t_{110} \rangle/a^2 = 0.352 \pm 0.003$ ו-$\langle R^4 \rangle/\langle R^2 \rangle^2 = 1.977 \pm 0.010$. השוו כל אחד מהם עם החיזויים שלכם.
    answer: >-
      (א) $\mathbf t_{m+k}$ הוא $\mathbf t_m$ מסובב ב-$\theta_m + \cdots + \theta_{m+k-1}$, ולכן $\langle \mathbf t_m \cdot \mathbf t_{m+k} \rangle = a^2\langle \cos(\theta_m + \cdots) \rangle = a^2c^k$; $\xi = -1/\ln c$. (ב) $\langle R^2 \rangle = a^2\big[N + 2\sum_{k=1}^{N-1}(N - k)c^k\big] = Na^2\frac{1 + c}{1 - c} - 2a^2\frac{c(1 - c^N)}{(1 - c)^2} \to Na^2\frac{1 + c}{1 - c}$, הגורם של השיעור עם $c$ במקום $q$. $c = 0$: $Na^2$; $c \to 1$: $N^2a^2$, מוט. עבור $\xi \gg 1$, $\frac{1 + c}{1 - c} \approx 2\xi$ ו-$\langle R^2 \rangle \approx 2(\xi a)L$. (ג) גאוסית דו-ממדית, $p(\mathbf R) = e^{-R^2/\langle R^2 \rangle}/(\pi\langle R^2 \rangle)$, מכוח משפט גבול מרכזי לאיברים שהמתאמים ביניהם דועכים באופן מעריכי. (ד) $c = 0.9003$, $\xi = 9.52$, גורם $19.06$; במדויק $18.88$ ב-$N = 1000$; $c^{10} = 0.350$; לגאוסית דו-ממדית $\langle R^4 \rangle/\langle R^2 \rangle^2 = 2$. שלושתם מסכימים בתחום השגיאות שלהם, האחרון עד כדי התיקון של $N$ סופי.
    solution:
      - kind: law
        text: >-
          השונות של סכום היא סכום כל השונויות המשותפות, $\langle R^2 \rangle = \sum_{m,n}\langle \mathbf t_m \cdot \mathbf t_n \rangle$, לאיברים בעלי תוחלת אפס. בשני ממדים, סיבוב בזווית $\phi$ משנה את המכפלה הסקלרית עם הווקטור המקורי ל-$a^2\cos\phi$. לזוויות בלתי תלויות, $\langle e^{\mathrm{i}(\theta_1 + \cdots + \theta_k)} \rangle = \langle e^{\mathrm{i}\theta} \rangle^k$, ולהתפלגות סימטרית $\langle e^{\mathrm{i}\theta} \rangle = \langle \cos\theta \rangle = c$, כי $\langle \sin\theta \rangle = 0$.
      - kind: manipulation
        text: >-
          (א) $\langle \mathbf t_m \cdot \mathbf t_{m+k} \rangle = a^2\,\mathrm{Re}\,\langle e^{\mathrm{i}(\theta_m + \cdots + \theta_{m+k-1})} \rangle = a^2c^k$, ו-$c^k = e^{k\ln c} = e^{-k/\xi}$ עם $\xi = -1/\ln c$. לכל קשר תוחלת אפס כי הראשון מצביע בכיוון אקראי. (ב) יש $N - k$ זוגות במרחק $k$, שכל אחד מהם מופיע בסכום פעמיים: $\langle R^2 \rangle = a^2\big[N + 2\sum_{k=1}^{N-1}(N - k)c^k\big]$. עם $\sum_{k \ge 1}c^k = c/(1 - c)$ ו-$\sum_{k \ge 1}kc^k = c/(1 - c)^2$, הסכום נותן את הצורה הסגורה, שהאיבר הראשון שלה גדל כמו $N$ והשני נשאר חסום. עבור $c = 1 - \epsilon$, $\xi = -1/\ln(1 - \epsilon) \approx 1/\epsilon$ ו-$(1 + c)/(1 - c) \approx 2/\epsilon \approx 2\xi$. (ג) לאורך קטע של $\xi$ רבים, השרשרת שוכחת את הכיוון שלה: גושים של קשרים ארוכים בהרבה מ-$\xi$ כמעט בלתי תלויים זה בזה, ו-$\mathbf R$ הוא סכום של גושים רבים כאלה. מטעמי איזוטרופיה ל-$R_x$ ול-$R_y$ שונויות שוות, $\langle R^2 \rangle/2$, ושונות משותפת אפס.
      - kind: formula
        text: >-
          $\langle \mathbf t_m \cdot \mathbf t_n \rangle = a^2c^{|n - m|} \qquad \langle R^2 \rangle = Na^2\,\frac{1 + c}{1 - c} - 2a^2\,\frac{c(1 - c^N)}{(1 - c)^2} \qquad p(\mathbf R) = \frac{1}{\pi\langle R^2 \rangle}\,e^{-R^2/\langle R^2 \rangle}$
      - kind: limit
        text: >-
          $c = 0$, זוויות בלי זיכרון (למשל אחידות על כל המעגל): $\langle R^2 \rangle = Na^2$, ההילוך הבלתי תלוי של שאלה 03. $c \to 1$ ב-$N$ קבוע: כל איבר בסכום הכפול הוא $a^2$, ו-$\langle R^2 \rangle \to N^2a^2$, מוט ישר; הצורה של השרשרת הארוכה מתבדרת במקום זאת, כי היא מניחה $N \gg \xi$, וההנחה הזו אינה מתקיימת. $N = 1$: $\langle R^2 \rangle = a^2$, כפי שהצורה הסגורה נותנת. והגאוסית של (ג) אינה יכולה להיות נכונה עבור $R > Na$, שם הצפיפות האמיתית אפס: היא מתארת את עיקר ההתפלגות של שרשרת ארוכה, לא את המתיחה המלאה שלה.
      - kind: substitution
        text: >-
          (ד) $c = \sin(\pi/4)/(\pi/4) = 0.9003$; $\xi = -1/\ln 0.9003 = 9.52$; $(1 + c)/(1 - c) = 19.06$, לעומת $2\xi = 19.05$. הסכום הסופי המדויק ב-$N = 1000$ נותן $\langle R^2 \rangle/(Na^2) = 18.88$, והסימולציה $18.83 \pm 0.14$. $c^{10} = 0.350$, נמדד $0.352 \pm 0.003$. ל-$\mathbf R$ גאוסי בשני ממדים, $\langle R^4 \rangle = \langle (R_x^2 + R_y^2)^2 \rangle = (3 + 2 + 3)s^4$ עם $s^2 = \langle R^2 \rangle/2$, ולכן היחס הוא $2$; ה-$1.977 \pm 0.010$ הנמדד קרוב, והפער שנותר הוא בגודל $1/N_\mathrm{eff}$ שהילוך בלתי תלוי של $N_\mathrm{eff} = N/19 \approx 53$ צעדים היה מראה.
      - kind: reasoning
        text: >-
          זה ההילוך המתמיד של השיעור עם זיכרון רציף במקום זיכרון דו-ערכי, ואותה הנהלת חשבונות: קשרים בעלי אותה התפלגות ושונות סופית, אבל לא בלתי תלויים. המחיר הוא ברוחב, פי $\sqrt{19}$ מזה של ההילוך הבלתי תלוי, ולא בצורה, כי כשהמתאמים דועכים באופן מעריכי, הסכום על פני אורכי התמדה רבים הוא סכום של חלקים כמעט בלתי תלויים. המקור מטפל בשרשרת בטמפרטורה $T$, עם זוויות שמשוקללות לפי קשיחות הכפיפה שלה; זה משנה רק את $c$, וכל התוצאות כאן נכונות עם ה-$c$ שמתקבל.
      - kind: result
        text: >-
          (א) $\langle \mathbf t_m \cdot \mathbf t_n \rangle = a^2c^{|n - m|}$, זיכרון של $\xi = -1/\ln c$ קשרים. (ב) $\langle R^2 \rangle \to Na^2(1 + c)/(1 - c) \approx 2\xi aL$ לשרשרת קשיחה; $Na^2$ לשרשרת חופשית, $N^2a^2$ למוט. (ג) $\mathbf R$ הוא גאוסי דו-ממדי בעל שונות $\langle R^2 \rangle$, מכוח משפט גבול מרכזי למתאמים דועכים. (ד) $c = 0.900$, $\xi = 9.5$ קשרים, $\langle R^2 \rangle/(Na^2) = 18.9$ ב-$N = 1000$, וכולם מאוששים בסימולציה; המחיר של המתאם הוא ברוחב, לא בצורה.
