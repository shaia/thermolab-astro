# חוברת התרגול של שיעור 15.1. שאלה 10 היא שאלה 6 של ThermoLab (הפרמגנט החבוי בתוך מודל איזינג); שאלה 04
# משתמשת באורך המתאם ממטריצת ההעברה שבחלק המתקדם של ThermoLab; השאר חדשות. מספרי מונטה קרלו בשאלות 05, 07
# ו-09 נמדדו ב-thermolab.ising עבור החוברת הזו (ארבעה או שישה-עשר זרעים, שגיאות מתוקנות ל-tau).
# ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו מפרסמת אותם, בהחלטת הכותב.
# אנרגיות ביחידות של J, טמפרטורה כ-k_BT/J, שדה כ-h/J; קחו k_B = 1.381e-23 J/K.
lang: he
lesson: '15.1'
practice:
  - id: W-15.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-15.1-1, OBJ-15.1-6]
    prompt: >-
      סטודנטית מריצה סריג $64 \times 64$ ב-$k_BT = 1.5\,J$ וב-$h = 0$, מהתחלה אקראית, במשך $10^4$ סריקות אחרי שלב החימום. הממוצע בזמן של $m$ הוא $-0.987$. היא מסיקה שיש בקוד שגיאה: ב-$h = 0$ האנרגיה אינה משתנה כשהופכים כל ספין, ולכן $\langle m\rangle = 0$ בדיוק, בכל טמפרטורה. האם הקוד שגוי? מה ההרצה שלה מודדת, ומה יראה שהקוד נכון?
    answer: >-
      הקוד תקין. $\langle m\rangle = 0$ היא טענה על הצבר; סריג גדול כזה מתחת ל-$T_c$ נשאר בענף אחד יותר זמן מכל הרצה, ולכן הממוצע שלו בזמן הוא $\pm m_0$. בדיקות: $|m| = 0.987$ מתאים ל-$m_0 = 0.9865$ של אונסאגר ויאנג, זרעים אחרים מסתיימים ב-$+0.987$ בערך באותה תדירות כמו ב-$-0.987$, וסריג $8 \times 8$ ב-$k_BT = 2.0\,J$ מתהפך עשרות פעמים ב-$10^5$ סריקות.
    solution:
      - kind: reasoning
        text: >-
          טיעון הסימטריה נכון, והוא עוסק בצבר: לכל קונפיגורציה יש תאומה הפוכה עם אותו משקל בולצמן ו-$m$ הפוך, ולכן הממוצע הקנוני על כולן מתאפס לכל $N$ סופי.
      - kind: reasoning
        text: >-
          הרצה אינה הצבר. כדי להגיע לענף השני הסריג חייב לעבור דרך קונפיגורציות שבהן קיר חוצה אותו, וזה עולה אנרגיה מסדר גודל של $2JL$; זמן ההמתנה גדל אקספוננציאלית עם $L$, וב-$L = 64$, ‏$k_BT = 1.5\,J$ הוא ארוך בהרבה מ-$10^4$ סריקות. ההרצה דוגמת ענף אחד בלבד, והממוצע שלה בזמן הוא המגנוט של הענף הזה: זו שבירת ארגודיות.
      - kind: reasoning
        text: >-
          מה שהופך את ההרצה לאמינה הוא ההתאמה למה שידוע. $|m| = 0.987$ מול $m_0(1.5\,J) = 0.9865$ של אונסאגר ויאנג; סדרה של זרעים מתחלקת בין שני הסימנים; וסריג קטן מספיק כדי להתהפך, $8 \times 8$, אכן מתהפך, והממוצע בזמן של $m$ בסריג הזה נודד לכיוון אפס ככל שההרצה מתארכת.
      - kind: result
        text: >-
          אין שגיאה בקוד. ההרצה מודדת את המגנוט הספונטני של הענף שההיסטוריה בחרה; אפס הוא הממוצע על פני הצבר, ששום מגנט גדול בודד אינו סורק.

  - id: W-15.1-02
    level: basic
    objectives: [OBJ-15.1-2]
    prompt: >-
      סריג ריבועי נמצא בשדה $h = 0.5\,J$ שמכוון כלפי מעלה, ב-$k_BT = 2.0\,J$. ספין $i$ מכוון כלפי מעלה, ושלושה מארבעת השכנים שלו כלפי מעלה.
      (א) מצאו את שינוי האנרגיה בהיפוך שלו ואת הסתברות הקבלה של מטרופוליס.
      (ב) עשו אותו דבר למהלך ההפוך: ספין $i$ כלפי מטה, עם אותם שכנים, מתהפך כלפי מעלה.
      (ג) הראו שהיחס בין שתי הסתברויות הקבלה הוא היחס בין משקלי בולצמן של שתי הקונפיגורציות.
    answer: >-
      (א) $\Delta E = 5J$, ‏$A = e^{-2.5} = 0.082$. (ב) $\Delta E = -5J$, ‏$A = 1$. (ג) $0.082/1 = e^{-5J/(k_BT)} = p_{s'}/p_s$, כפי שאיזון מפורט דורש.
    solution:
      - kind: given
        text: >-
          $s_i = +1$, ‏$\sum_{j} s_j = 3 - 1 = 2$ על ארבעת השכנים, $h = 0.5\,J$, ‏$k_BT = 2.0\,J$.
      - kind: law
        text: >-
          $\Delta E_i = 2s_i\big(J\sum_{j\in\text{nn}(i)} s_j + h\big)$; מטרופוליס, $A = \min(1, e^{-\Delta E/(k_BT)})$.
      - kind: manipulation
        text: >-
          (א) $\Delta E = 2(+1)(2J + 0.5J) = 5J$, ולכן $A = e^{-5J/(k_BT)}$. (ב) המהלך ההפוך מתחיל מ-$s_i = -1$: $\Delta E = 2(-1)(2.5J) = -5J < 0$, ולכן $A = 1$.
      - kind: formula
        text: >-
          $\dfrac{A(s \to s')}{A(s' \to s)} = \dfrac{e^{-5J/(k_BT)}}{1} = e^{-(E_{s'} - E_s)/(k_BT)} = \dfrac{p_{s'}}{p_s}$
      - kind: limit
        text: >-
          ב-$h = 0$ אותו היפוך עולה $4J$ ומתקבל בהסתברות $e^{-2} = 0.135$: השדה הופך היפוך נגדו לנדיר יותר, וההיפוך ההפוך, בכיוון השדה, נשאר ודאי. כש-$T \to \infty$ שתי הסתברויות הקבלה שואפות ל-$1$.
      - kind: units
        text: >-
          $\Delta E$ ו-$k_BT$ שניהם ביחידות של $J$: המעריך הוא מספר טהור.
      - kind: substitution
        text: >-
          $e^{-5/2} = 0.0821$.
      - kind: result
        text: >-
          (א) $5J$, מתקבל ב-$8\%$ מהמקרים. (ב) $-5J$, מתקבל תמיד. (ג) היחס $0.082$ הוא $p_{s'}/p_s$, בלי לחשב את $Z$ אף פעם.

  - id: W-15.1-03
    level: basic
    objectives: [OBJ-15.1-4]
    prompt: >-
      השדה הממוצע חוזה $k_BT_c = qJ$ בכל סריג. טמפרטורות המעבר המדויקות הן $k_BT_c = 1.519\,J$ בסריג חלת הדבש ($q = 3$), ‏$2.269\,J$ בסריג הריבועי ($q = 4$) ו-$3.641\,J$ בסריג המשולש ($q = 6$); בסריג הקובי הפשוט ($q = 6$) סימולציות גדולות נותנות $4.512\,J$.
      (א) פי כמה השדה הממוצע מעריך ביתר את $T_c$ בכל אחד מהם?
      (ב) איזו מגמה אתם רואים, ולמה?
      (ג) מגנט שכבתי מתנהג כמודל איזינג על סריג ריבועי עם $J = 3.0\cdot10^{-21}\,\text{J}$. מצאו את טמפרטורת המעבר שלו בקלווין, ואת זו שהשדה הממוצע נותן.
    answer: >-
      (א) $1.98$, ‏$1.76$, ‏$1.65$ ו-$1.33$. (ב) יותר שכנים, ויותר ממדים, משפרים את השדה הממוצע: השדה שספין מרגיש הוא אז ממוצע על יותר ספינים, והפלוקטואציות שלו משמעותיות פחות. (ג) $493\,\text{K}$; השדה הממוצע נותן $869\,\text{K}$.
    solution:
      - kind: given
        text: >-
          $(q, k_BT_c/J) = (3, 1.519)$, ‏$(4, 2.269)$, ‏$(6, 3.641)$ בשני ממדים, $(6, 4.512)$ בשלושה; $J = 3.0\cdot10^{-21}\,\text{J}$.
      - kind: law
        text: >-
          $k_BT_c^\text{MF} = qJ$, ולכן ההערכה היתרה היא $T_c^\text{MF}/T_c = qJ/(k_BT_c)$.
      - kind: manipulation
        text: >-
          $3/1.519$, ‏$4/2.269$, ‏$6/3.641$, ‏$6/4.512$.
      - kind: reasoning
        text: >-
          השדה הממוצע מחליף את השדה של $q$ השכנים בממוצע שלו. ככל שיש יותר שכנים, הסכום שלהם קרוב יותר לממוצע שלו, ולכן השגיאה קטנה עם $q$. באותו $q = 6$ הסריג הקובי מצליח יותר מהמשולש: בשלושה ממדים יש לסדר יותר מסלולים לעקוף פלוקטואציה, והפלוקטואציות הורסות פחות ממנו.
      - kind: limit
        text: >-
          אילו כל ספין היה באינטראקציה עם כל ספין אחר ($q \to N$, עם $J$ שמוקטן כמו $1/N$), השדה על ספין היה סכום של $N$ איברים בלי שום פלוקטואציה, והשדה הממוצע היה מדויק. בממד אחד, $q = 2$, הוא שגוי לחלוטין: הוא חוזה $2J$ במקום שבו אין מעבר בכלל.
      - kind: units
        text: >-
          $T_c = (k_BT_c/J)\cdot J/k_B$: $\text{J}/(\text{J/K}) = \text{K}$.
      - kind: substitution
        text: >-
          (א) $1.975$, ‏$1.763$, ‏$1.648$, ‏$1.330$. (ג) $2.269\cdot3.0\cdot10^{-21}/1.381\cdot10^{-23} = 493\,\text{K}$; השדה הממוצע, $4\cdot3.0\cdot10^{-21}/1.381\cdot10^{-23} = 869\,\text{K}$.
      - kind: result
        text: >-
          (א) גבוה מדי ב-$98\%$, ‏$76\%$, ‏$65\%$ ו-$33\%$. (ב) השדה הממוצע משתפר עם יותר שכנים ויותר ממדים. (ג) $T_c = 493\,\text{K}$; השדה הממוצע, $869\,\text{K}$.

  - id: W-15.1-04
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-3, OBJ-15.1-6]
    prompt: >-
      סטודנטית מריצה סימולציה של טבעת בת $20$ ספינים ב-$k_BT = 0.2\,J$ וב-$h = 0$, שמתחילה כשכל הספינים כלפי מעלה. ב-$10^5$ סריקות לא מופיע אף קיר תחום אחד, והיא מסיקה ששרשרת קרה מספיק אכן מסתדרת, כמו שהשדה הממוצע אומר שהיא אמורה להסתדר מתחת ל-$2J$. בשרשרת האינסופית מטריצת ההעברה נותנת את המתאם בין ספינים שמרוחקים $r$ אתרים זה מזה: $\langle s_0 s_r\rangle = \tanh^r(J/k_BT) = e^{-r/\xi}$. מה ההרצה שלה מראה, ומה היא אינה מראה? בססו את התשובה בשני מספרים: גודל הטבעת שמעליו זוג קירות מוריד את האנרגיה החופשית, ואורך המתאם $\xi$.
    answer: >-
      היא מראה שטבעת של $20$ אתרים קצרה בהרבה מאורך המתאם בטמפרטורה הזו, ולכן היא נראית מסודרת. היא אינה מראה סדר ארוך-טווח: זוג קירות מוריד את האנרגיה החופשית בכל טבעת ארוכה מ-$\sqrt2\,e^{10} \approx 3\cdot10^4$ אתרים, ו-$\xi \approx 1.1\cdot10^4$ אתרים הוא סופי. שרשרת ארוכה יותר מתפרקת לתחומים; המעבר של השדה הממוצע אינו קיים.
    solution:
      - kind: reasoning
        text: >-
          ב-$20$ אתרים זוג קירות עולה $4J = 20\,k_BT$ ויש לו רק $20\cdot19/2 = 190$ מיקומים, משקל יחסי של $190\,e^{-20} \approx 4\cdot10^{-7}$. הרצה בלי קירות היא בדיוק מה ששיווי משקל חוזה לטבעת הזו; היא אינה אומרת דבר על טבעת ארוכה.
      - kind: law
        text: >-
          $\Delta F \approx 4J - k_BT\ln(N^2/2)$, שלילי עבור $N > \sqrt2\,e^{2J/(k_BT)}$; ו-$\xi = -1/\ln\tanh(J/k_BT)$.
      - kind: limit
        text: >-
          כש-$T \to 0$, ‏$\tanh(J/k_BT) \to 1 - 2e^{-2J/(k_BT)}$, ולכן $\xi \approx \tfrac12 e^{2J/(k_BT)}$: עצום, אבל סופי בכל $T > 0$. רק ב-$T = 0$ השרשרת מסודרת.
      - kind: substitution
        text: >-
          $\sqrt2\,e^{10} = 3.1\cdot10^4$ אתרים; $\tanh 5 = 0.999909$, ‏$\xi = -1/\ln 0.999909 = 1.1\cdot10^4$ אתרים, כפי ש-$\tfrac12 e^{10}$ מעריך.
      - kind: result
        text: >-
          ההרצה מראה סדר לאורך $20$ אתרים, שהם חלק $2\cdot10^{-3}$ מ-$\xi$. בשרשרת ארוכה מכ-$10^4$ אתרים הסדר נעלם ב-$k_BT = 0.2\,J$, וכך גם בכל $T > 0$ אחר בשרשרת ארוכה מספיק: מערכת סופית שקטנה מאורך המתאם שלה אינה יכולה לגלות מה המערכת האינסופית עושה.

  - id: W-15.1-05
    level: mid
    objectives: [OBJ-15.1-5, OBJ-15.1-6]
    prompt: >-
      ארבעה זרעים של סריג $32 \times 32$, ‏$20\,000$ סריקות לכל טמפרטורה, נותנים בממוצע $\chi' = N\,\text{Var}(|m|)/(k_BT)$ של $3.8$, ‏$10.5$, ‏$18.1$, ‏$16.3$ ו-$11.5$ ב-$k_BT = 2.20$, ‏$2.25$, ‏$2.30$, ‏$2.40$ ו-$2.45\,J$.
      (א) ב-$k_BT = 2.35\,J$ לעקבה של $|m|$ יש שונות $0.0469$. מצאו את $\chi'$ שם.
      (ב) אתרו את השיא של $\chi'$ בעזרת פרבולה דרך שלוש הנקודות הגבוהות ביותר.
      (ג) השיא של סריג ה-$16 \times 16$ של השיעור נמצא ב-$2.416\,J$. בהנחה שהשיא זז לפי $T_\text{peak} = T_c + a/L$, העריכו את $T_c$.
      (ד) למה השיא נמצא מעל $T_c$, ולמה הוא סופי?
    answer: >-
      (א) $20.4$. (ב) $k_BT_\text{peak} = 2.343\,J$. (ג) $k_BT_c \approx 2.270\,J$, עם אי-ודאות של כ-$0.02\,J$, מול $2.269\,J$ של אונסאגר. (ד) בסריג סופי הכתמים המתואמים מגיעים לגודל הסריג $L$ במרחק מסדר $1/L$ מ-$T_c$, ו-$\xi$ אינו יכול לגדול יותר: התגובה מפסיקה לגדול שם, והיא סופית; ב-$\chi'$ המקסימום נופל בצד הגבוה.
    solution:
      - kind: given
        text: >-
          $N = 1024$; ‏$\text{Var}(|m|) = 0.0469$ ב-$k_BT = 2.35\,J$; המרווח בין הטמפרטורות $d = 0.05\,J$; ‏$T_\text{peak}(16) = 2.416\,J/k_B$.
      - kind: law
        text: >-
          $\chi' = N\,\text{Var}(|m|)/(k_BT)$. הקודקוד של הפרבולה דרך שלוש נקודות במרווחים שווים, $(T_0 - d, y_-)$, ‏$(T_0, y_0)$, ‏$(T_0 + d, y_+)$, נמצא ב-$T_0 + \tfrac{d}{2}\,\dfrac{y_- - y_+}{y_- - 2y_0 + y_+}$.
      - kind: manipulation
        text: >-
          שני גדלים, שני נעלמים: $T_c + a/16 = T_{16}$ ו-$T_c + a/32 = T_{32}$. בחיסור, $a/32 = T_{16} - T_{32}$.
      - kind: formula
        text: >-
          $T_c = 2T_{32} - T_{16}$
      - kind: limit
        text: >-
          אילו שני הסריגים היו מגיעים לשיא באותה טמפרטורה, הטמפרטורה הזו הייתה $T_c$, ו-$a = 0$. האקסטרפולציה מניחה את הערך המדויק $\nu = 1$; עם מעריך אחר התשובה משתנה, ולכן התוצאה היא הערכה ולא מדידה של $T_c$.
      - kind: units
        text: >-
          $\text{Var}(|m|)$ הוא מספר טהור ו-$k_BT$ ביחידות של $J$, ולכן $\chi'$ ביחידות של $1/J$; כל הטמפרטורות ביחידות של $J/k_B$.
      - kind: substitution
        text: >-
          (א) $1024\cdot0.0469/2.35 = 20.4$. (ב) $y_- = 18.1$, ‏$y_0 = 20.4$, ‏$y_+ = 16.3$: $2.35 + 0.025\cdot1.8/(-6.4) = 2.343$. (ג) $2\cdot2.343 - 2.416 = 2.270$. ברשת טמפרטורות גסה כל כך, מיקום השיא ידוע רק עד כדי $0.01$ בערך; ההרצות הארוכות יותר של השיעור ממקמות את השיא של $L = 32$ ב-$2.329$, וזה היה נותן $2.242$. ההתאמה עד $0.001$ היא בחלקה מזל.
      - kind: reasoning
        text: >-
          (ד) $\xi \propto |T - T_c|^{-1}$ מגיע ל-$L$ במרחק מסדר $1/L$ מ-$T_c$. קרוב יותר מזה הסריג הוא כתם מתואם אחד ואינו יכול להיות מתואם יותר, והגדילה של $\chi'$ נעצרת; ב-$\chi'$ המקסימום נופל בצד הגבוה, בכל גודל באיור 15.1ב. פונקציית החלוקה של $1024$ ספינים היא סכום סופי, אנליטי ב-$T$: כל שיא שהיא מייצרת סופי ומעוגל.
      - kind: result
        text: >-
          (א) $\chi' = 20.4$. (ב) $2.343\,J$. (ג) $T_c \approx 2.27\,J/k_B$, בתוך כ-$0.02$. (ד) הגודל הסופי מעגל את השיא ומזיז אותו כלפי מעלה, כמו $L^{-1}$; השיא מגיע ל-$T_c$ ומתבדר רק כש-$L \to \infty$.

  - id: W-15.1-06
    level: mid
    qualitative: true
    objectives: [OBJ-15.1-6]
    prompt: >-
      איור 15.1ב מראה ארבעה סריגים, מ-$L = 8$ עד $64$. קבעו לגבי כל טענה אם היא נכונה, במשפט או שניים.
      (א) "השיא של $\chi'$ בסריג ה-$64 \times 64$ הוא ההתבדרות של הסוספטיביליות, שנתפסה סוף סוף."
      (ב) "קיבול החום מגיע לשיא ליד $T_c$, ולכן האנרגיה קופצת שם, כמו ברתיחה."
      (ג) "השיאים נודדים אל $2.269\,J$; סריג של $10^6 \times 10^6$ ספינים היה מראה שיא אמיתי, אינסופי."
      (ד) "זמן המתאם העצמי מגיע לשיא ליד $T_c$ כי שם הסריג עובר מהר בין שתי פאזות."
    answer: >-
      כל ארבע הטענות שגויות. (א) השיא סופי, כמו בכל סריג סופי; רק הגדילה שלו עם $L$ מצביעה על התבדרות. (ב) המעבר רציף: האנרגיה רציפה ורק השיפוע שלה, $c$, מגיע לשיא; הקפיצה שייכת לחציית $h = 0$ מתחת ל-$T_c$. (ג) לכל סריג סופי יש $Z$ אנליטי ושיא סופי; הסינגולריות היא טענה על הגבול, שמבוססת בגזירה של אונסאגר. (ד) הוא מגיע לשיא כי כתמים מתואמים בגודל הסריג צריכים סדר גודל של $L^2$ סריקות כדי להתארגן מחדש: השרשרת איטית ביותר ב-$T_c$.
    solution:
      - kind: reasoning
        text: >-
          (א) על $N$ ספינים $Z$ הוא סכום של $2^N$ אקספוננטים, חלק ב-$T$. השיא של $L = 64$ הוא הגבוה מבין ארבעה שיאים סופיים שהגבהים שלהם גדלים כמו $L^{1.76}$; הגדילה הזו, ולא שיא כלשהו לבדו, היא הראיה להתבדרות.
      - kind: reasoning
        text: >-
          (ב) קיבול החום הוא השיפוע של האנרגיה, $c = \partial e/\partial T$. שיא בשיפוע אינו קפיצה באנרגיה: ב-$h = 0$ האנרגיה עוברת דרך $T_c$ ברציפות, בלי חום כמוס. קפיצה אכן מתרחשת, ב-$m$, כש-$h$ חוצה את האפס מתחת ל-$T_c$: זה המעבר מסדר ראשון, הגרסה המגנטית של רתיחה.
      - kind: reasoning
        text: >-
          (ג) סריג גדול יותר נותן שיא גבוה יותר וצר יותר, קרוב יותר ל-$T_c$, ועדיין סופי. סימולציות מבססות את המגמה; את זה שהמגמה מסתיימת בסינגולריות כש-$N \to \infty$ מוכיחים בגזירה.
      - kind: reasoning
        text: >-
          (ד) ליד $T_c$ הסריג הוא טלאים של תחומים מתואמים בכל גודל עד $L$. כלל מקומי מארגן אותם מחדש ספין אחד בכל פעם, וזה לוקח זמן שגדל כמו $\xi^z$, ‏$z \approx 2$; השיעור מודד $\tau$ מ-$3$ סריקות ב-$L = 8$ עד $174$ ב-$L = 64$. שום דבר אינו עובר שם מהר.
      - kind: result
        text: >-
          סריג סופי מראה שיאים סופיים, מעוגלים ונודדים, ושרשרת שמאטה; הסינגולריות, והרציפות של המעבר, הן תכונות של המערכת האינסופית.

  - id: W-15.1-07
    level: mid
    objectives: [OBJ-15.1-7]
    prompt: >-
      סריג $16 \times 16$ ב-$k_BT = 2.35\,J$ רץ $5000$ סריקות אחרי שלב החימום, ורושמים את $|m|$ בכל סריקה. לעקבה יש ממוצע $0.586$, סטיית תקן $0.233$ וזמן מתאם עצמי $\tau = 10.8$ סריקות.
      (א) תנו את שגיאת התקן הנאיבית של הממוצע ואת זו המתוקנת ל-$\tau$.
      (ב) שש-עשרה הרצות בלתי תלויות באותו אורך נותנות ממוצעים שמתפזרים עם סטיית תקן של $0.0125$. איזה פס שגיאה מתאר את הפיזור הזה?
      (ג) כמה סריקות יורידו את השגיאה המתוקנת ל-$0.005$?
    answer: >-
      (א) נאיבית $0.0033$; מתוקנת $0.015$. (ב) המתוקנת: $0.0125$ מול $0.0153$ מסכימים בתוך אי-הוודאות של $18\%$ שיש לפיזור שנאמד משש-עשרה מספרים, בעוד הפס הנאיבי קטן פי ארבעה מהפיזור. (ג) כ-$4.7\cdot10^4$ סריקות.
    solution:
      - kind: given
        text: >-
          $n = 5000$, ‏$\sigma = 0.233$, ‏$\tau = 10.8$; שגיאת יעד $\varepsilon = 0.005$.
      - kind: law
        text: >-
          $N_\text{eff} = n/(2\tau)$; שגיאת התקן $\sigma/\sqrt{N_\text{eff}}$. אי-הוודאות היחסית של סטיית תקן שנאמדה מ-$k$ מספרים היא בערך $1/\sqrt{2(k-1)}$.
      - kind: formula
        text: >-
          $\sigma_{\bar x} = \sigma\sqrt{\dfrac{2\tau}{n}} \qquad n = 2\tau\left(\dfrac{\sigma}{\varepsilon}\right)^2$
      - kind: limit
        text: >-
          לדגימות בלתי תלויות, $\tau = \tfrac12$, שתי הנוסחאות חוזרות לנאיביות. ליד $T_c$ בסריג גדול יותר $\tau$ גדל כמו $L^2$, וכך גם ההרצה הדרושה לאותו פס שגיאה.
      - kind: units
        text: >-
          $\tau$ ו-$n$ שניהם נספרים בסריקות, ולכן $2\tau/n$ הוא מספר טהור; ל-$\sigma$ יש היחידות של $|m|$, כלומר אין לו יחידות.
      - kind: substitution
        text: >-
          (א) נאיבית $0.233/\sqrt{5000} = 0.0033$; ‏$N_\text{eff} = 5000/21.6 = 231$, מתוקנת $0.233/\sqrt{231} = 0.0153$, גדולה פי $\sqrt{21.6} = 4.6$. (ב) $1/\sqrt{30} = 0.18$; ‏$0.0153/0.0125 = 1.22$, בערך אי-ודאות אחת כזו. (ג) $21.6\cdot(0.233/0.005)^2 = 4.7\cdot10^4$.
      - kind: reasoning
        text: >-
          מבחן הזרעים מכריע: הפס המתוקן חוזה את הפיזור של הרצות בלתי תלויות; הנאיבי טוען לדיוק טוב פי ארבעה ממה שההרצות מסכימות ביניהן בפועל.
      - kind: result
        text: >-
          (א) $\langle|m|\rangle = 0.586 \pm 0.015$, לא $\pm 0.003$. (ב) הפס המתוקן ל-$\tau$. (ג) כ-$47\,000$ סריקות: פס שגיאה קטן כמו $n^{-1/2}$, כש-$n$ נספר ביחידות של $2\tau$.

  - id: W-15.1-08
    level: bagrut
    objectives: [OBJ-15.1-4]
    prompt: >-
      (א) פתרו את משוואת השדה הממוצע עבור $h = 0$ ו-$T = 0.9\,T_c^\text{MF}$, והשוו לקירוב $m_0 \approx \sqrt{3(1 - T/T_c^\text{MF})}$.
      (ב) מהנוסחה של אונסאגר ויאנג, מצאו את $m_0$ באותו שבר של טמפרטורת המעבר של הסריג הריבועי עצמו, $T = 0.9\,T_c$.
      (ג) כמה קרוב ל-$T_c$ שלה צריכה כל תורה להיות כדי ש-$m_0$ ירד ל-$0.5$? מה ההשוואה אומרת על המעריך $\beta$?
    answer: >-
      (א) $m_0 = 0.525$; הקירוב נותן $0.548$, גבוה ב-$4\%$. (ב) $m_0 = 0.896$. (ג) שדה ממוצע: $1 - T/T_c = 0.090$. אונסאגר ויאנג: $1 - T/T_c = 7.8\cdot10^{-4}$, קרוב פי יותר ממאה. $\beta$ קטן ($1/8$ מול $1/2$) שומר על $m_0$ גדול עד קרוב מאוד ל-$T_c$, ואז מפיל אותו כמעט אנכית.
    solution:
      - kind: given
        text: >-
          $T/T_c^\text{MF} = 0.9$; ‏$k_BT_c = 2.269\,J$, ולכן $0.9\,T_c$ הוא $k_BT = 2.042\,J$; היעד $m_0 = 0.5$.
      - kind: law
        text: >-
          שדה ממוצע ב-$h = 0$, עם $k_BT_c^\text{MF} = qJ$: $m = \tanh\!\big(m\,T_c^\text{MF}/T\big)$. אונסאגר ויאנג: $m_0 = \left[1 - \sinh^{-4}(2J/k_BT)\right]^{1/8}$.
      - kind: manipulation
        text: >-
          את שתיהן אפשר להפוך ולקבל את הטמפרטורה שבה $m_0$ מקבל ערך נתון. שדה ממוצע: $T_c^\text{MF}/T = \operatorname{artanh}(m)/m$. אונסאגר ויאנג: $\sinh^{-4}(2J/k_BT) = 1 - m^8$.
      - kind: formula
        text: >-
          $\dfrac{T}{T_c^\text{MF}} = \dfrac{m}{\operatorname{artanh} m} \qquad \dfrac{2J}{k_BT} = \operatorname{arsinh}\left[(1 - m^8)^{-1/4}\right]$
      - kind: limit
        text: >-
          כש-$m \to 0$ שתיהן נותנות $T \to T_c$: $m/\operatorname{artanh} m \to 1$, ו-$\operatorname{arsinh} 1 = \ln(1 + \sqrt2)$, ה-$2J/(k_BT_c)$ של אונסאגר. כש-$m \to 1$ שתיהן נותנות $T \to 0$.
      - kind: units
        text: >-
          כל גודל הוא יחס בין טמפרטורות או מספר טהור.
      - kind: substitution
        text: >-
          (א) האיטרציה $m \leftarrow \tanh(m/0.9)$ מתכנסת ל-$0.525$; ‏$\sqrt{0.3} = 0.548$. (ב) $\sinh(2/2.042) = 1.144$, ‏$\sinh^{-4} = 0.585$, ‏$(0.415)^{1/8} = 0.896$. (ג) שדה ממוצע: $0.5/\operatorname{artanh} 0.5 = 0.5/0.549 = 0.910$, ולכן $1 - T/T_c = 0.090$. אונסאגר ויאנג: $(1 - 2^{-8})^{-1/4} = 1.00098$, ‏$\operatorname{arsinh} 1.00098 = 0.88206$, ‏$k_BT = 2.2674\,J$, ו-$1 - 2.2674/2.2692 = 7.8\cdot10^{-4}$.
      - kind: result
        text: >-
          (א) $0.525$ (הפיתוח טוב עד כדי $4\%$ אפילו $10\%$ מתחת ל-$T_c$). (ב) $0.896$. (ג) $9\%$ מתחת ל-$T_c$ בשדה הממוצע, $0.08\%$ בסריג הריבועי. העקומה של אונסאגר נשארת קרוב לערך שלה בטמפרטורות נמוכות עד ממש לפני $T_c$, ואז יורדת כמעט אנכית: זו המשמעות של $\beta = 1/8$, וזו הסיבה שהכתף החלקה של סריג סופי אינה יכולה לשחזר אותה.

  - id: W-15.1-09
    level: bagrut
    objectives: [OBJ-15.1-2]
    prompt: >-
      בטעות, הקוד של סטודנט מקבל היפוך מוצע בהסתברות $\min\left(1, e^{-\Delta E/(2k_BT)}\right)$.
      (א) האם השרשרת מקיימת איזון מפורט ביחס להתפלגות כלשהי? לאיזו?
      (ב) כשהטמפרטורה בקוד מכוונת ל-$k_BT = 1.5\,J$, על סריג $32 \times 32$ ב-$h = 0$, ההרצה נותנת $\langle|m|\rangle = 0.085$ ו-$e = -0.818\,J$. מה היה נותן קוד נכון? מה הסימולציה של הסטודנט דימתה בפועל?
      (ג) ציינו בדיקה שהייתה תופסת את השגיאה לפני כל הרצה שמפיקים ממנה תוצאות. האם בדיקה שסריג קר מגיע למצב היסוד שלו הייתה תופסת אותה?
    answer: >-
      (א) כן: זה כלל מטרופוליס בטמפרטורה $2T$, ולכן הוא דוגם $p_s \propto e^{-E_s/(2k_BT)}$. (ב) קוד נכון: $\langle|m|\rangle = 0.987$ ו-$e = -1.951\,J$ (אונסאגר). ההרצה דגמה $k_BT = 3.0\,J$, מעל $T_c$, שם האנרגיה המדויקת היא $-0.817\,J$. (ג) השוואה לעוגן מדויק, כמו $m_0(1.5\,J) = 0.9865$ של אונסאגר ויאנג, או $E/(NJ) = -\tanh(J/k_BT)$ של השרשרת. בדיקת מצב היסוד לא הייתה תופסת אותה: הכלל עדיין שולח סריג למצב היסוד שלו כש-$T \to 0$.
    solution:
      - kind: given
        text: >-
          $A(s \to s') = \min\left(1, e^{-\Delta E/(2k_BT)}\right)$ עם הצעות סימטריות; הטמפרטורה שנקבעה בקוד, $k_BT = 1.5\,J$.
      - kind: law
        text: >-
          עם הצעות סימטריות, איזון מפורט ביחס ל-$p$ דורש $A(s \to s')/A(s' \to s) = p_{s'}/p_s$ לכל זוג.
      - kind: manipulation
        text: >-
          עבור $\Delta E > 0$ המהלך קדימה מתקבל בהסתברות $e^{-\Delta E/(2k_BT)}$ וההפוך בהסתברות $1$; עבור $\Delta E \le 0$ להפך. בשני המקרים היחס הוא $e^{-\Delta E/(k_B\cdot2T)}$, שהוא $p_{s'}/p_s$ עבור $p_s \propto e^{-E_s/(k_B\cdot2T)}$: התפלגות בולצמן ב-$2T$.
      - kind: limit
        text: >-
          כש-$T \to 0$ גם $2T$ שואף לאפס: השרשרת הפגומה עדיין קופאת למצב יסוד, ולכן בדיקת מצב יסוד עוברת. כש-$T \to \infty$ כל כלל מקבל הכול. השגיאה נראית רק בטמפרטורות ביניים, ושם נמצאת הפיזיקה.
      - kind: units
        text: >-
          $\Delta E/(2k_BT)$ הוא מספר טהור; $e$ ביחידות של $J$ לספין.
      - kind: substitution
        text: >-
          הטמפרטורה האפקטיבית: $k_BT = 2\cdot1.5\,J = 3.0\,J > 2.269\,J$, מצב לא מסודר. האנרגיה המדויקת לספין של אונסאגר היא $-0.817\,J$ ב-$3.0\,J$ ו-$-1.951\,J$ ב-$1.5\,J$, שם $m_0 = 0.9865$. ה-$-0.818\,J$ של ההרצה מתאים לראשונה.
      - kind: reasoning
        text: >-
          בדיקה מול תוצאה מדויקת בטמפרטורת ביניים תופסת את השגיאה מיד: טבלת הקבלה ב-$k_BT_c$ (דוגמה פתורה 1), ה-$m_0$ של אונסאגר ויאנג, או האנרגיה של השרשרת, שהקוד של ThermoLab משחזר בתוך פס השגיאה שלו, $4\cdot10^{-4}$, לפני שמאמינים לתוצאות שלו על הסריג הריבועי.
      - kind: result
        text: >-
          (א) איזון מפורט ב-$2T$. (ב) הרצה נכונה נותנת $\langle|m|\rangle \approx 0.987$, ‏$e \approx -1.951\,J$; בפועל הסטודנט הריץ סימולציה ב-$k_BT = 3.0\,J$. (ג) בדיקה מול עוגנים מדויקים ב-$T$ ביניים; בדיקת מצב יסוד אינה יכולה לגלות כלל שהיחס שלו נכון אבל בטמפרטורה הלא נכונה.

  - id: W-15.1-10
    level: bagrut
    objectives: [OBJ-15.1-1, OBJ-15.1-5]
    prompt: >-
      הפרמגנט החבוי בתוך מודל איזינג.
      (א) קבעו $J = 0$. הראו שפונקציית החלוקה מתפרקת למכפלה של הצורה לספין יחיד ממודול 12, ושמתקיים בדיוק $\langle m\rangle = \tanh(h/k_BT)$.
      (ב) הראו שהמגנוט המדויק של השרשרת, $m = \sinh(h/k_BT)\big/\sqrt{\sinh^2(h/k_BT) + e^{-4J/k_BT}}$, מצטמצם לתוצאה של (א) כש-$J \to 0$, ושעבור $h$ קטן ו-$J > 0$ קבוע הוא נותן $\chi = \partial m/\partial h|_{h=0} = e^{2J/k_BT}/k_BT$. חשבו את $\chi\,k_BT$ ב-$k_BT = J$. למה הצימוד מעניק לשרשרת סוספטיביליות גבוהה יותר משל ספינים חופשיים?
      (ג) עבור $J = 0$, אמתו ישירות את זהות הפלוקטואציה $\chi = N\,\text{Var}(m)/(k_BT)$.
      (ד) סריג $8 \times 8$ ב-$k_BT = 2.0\,J$ וב-$h = 0$, שרץ $10^4$ סריקות, הופך את המגנוט שלו בערך ארבע פעמים. למה המעבדה מחשבת שם את הסוספטיביליות מ-$|m|$ ולא מ-$m$?
    answer: >-
      (א) $Z = [2\cosh(h/k_BT)]^N$, ‏$\langle m\rangle = \tanh(h/k_BT)$. (ב) $\chi\,k_BT = e^2 = 7.4$: שכנים מתואמים מגיבים יחד, בגושים שאורכם כשני אורכי מתאם. (ג) $\text{Var}(m) = [1 - \tanh^2(h/k_BT)]/N$, ולכן $N\,\text{Var}(m)/(k_BT) = \partial\tanh(h/k_BT)/\partial h$. (ד) ב-$\text{Var}(m)$ של הרצה כזו שולטות הקפיצות בין $\pm m_0$: בערך $m_0^2 = 0.83$ אם ההרצה ביקרה בשני הענפים, מה שנותן $64\cdot0.83/2 \approx 27$, או הרבה פחות אם לא היה אף היפוך. הוא מודד כמה היפוכים ההרצה ראתה במקרה, ולא את התגובה.
    solution:
      - kind: given
        text: >-
          $E = -J\sum_{\langle ij\rangle}s_is_j - h\sum_i s_i$; ה-$m(h, T)$ המדויק של השרשרת; $k_BT = J$ ב-(ב); ‏$N = 64$, ‏$m_0(2.0\,J) = 0.911$ ב-(ד).
      - kind: law
        text: >-
          $Z = \sum_s e^{-E_s/(k_BT)}$; ‏$\langle M\rangle = \partial\ln Z/\partial(h/k_BT)$ ו-$\text{Var}(M) = \partial\langle M\rangle/\partial(h/k_BT)$.
      - kind: manipulation
        text: >-
          (א) ב-$J = 0$, ‏$e^{-E_s/(k_BT)} = \prod_i e^{hs_i/(k_BT)}$, והסכום על הקונפיגורציות הוא מכפלה של $N$ סכומים של ספין יחיד: $Z = [2\cosh(h/k_BT)]^N$, ולכן $\langle M\rangle/N = \tanh(h/k_BT)$. (ב) ב-$J = 0$ השורש הוא $\sqrt{\sinh^2 + 1} = \cosh$, ו-$m = \tanh(h/k_BT)$. עבור $h$ קטן ו-$J > 0$, ‏$\sinh(h/k_BT) \approx h/k_BT$, וה-$\sinh^2$ שמתחת לשורש זניח לעומת $e^{-4J/k_BT}$: $m \approx (h/k_BT)\,e^{2J/k_BT}$.
      - kind: manipulation
        text: >-
          (ג) ספינים בלתי תלויים: $\text{Var}(M) = N\,\text{Var}(s) = N(1 - \langle s\rangle^2) = N[1 - \tanh^2(h/k_BT)]$, ולכן $N\,\text{Var}(m)/(k_BT) = [1 - \tanh^2(h/k_BT)]/(k_BT)$, וזה $\partial\tanh(h/k_BT)/\partial h$.
      - kind: formula
        text: >-
          $\chi_\text{chain} = \dfrac{e^{2J/k_BT}}{k_BT} \qquad \chi_\text{free} = \dfrac{1 - \tanh^2(h/k_BT)}{k_BT}$
      - kind: limit
        text: >-
          $J \to 0$ נותן $\chi = 1/k_BT$, חוק קירי לספינים חופשיים. לפי זהות הפלוקטואציה, $\chi\,k_BT = \sum_r\langle s_0s_r\rangle = \sum_r \tanh^{|r|}(J/k_BT) = (1 + \tanh K)/(1 - \tanh K) = e^{2K}$ עם $K = J/k_BT$: אותה תשובה, שנקראת כמספר הספינים שמתואמים עם ספין נתון. כש-$T \to 0$ היא מתבדרת, והשרשרת קריטית רק ב-$T = 0$.
      - kind: units
        text: >-
          $h/k_BT$ הוא מספר טהור ו-$m$ הוא גודל לספין, ולכן $\chi$ ביחידות של $1/J$; ‏$\chi\,k_BT$ הוא מספר טהור.
      - kind: substitution
        text: >-
          (ב) $e^2 = 7.39$, מול $1$ לספינים חופשיים; $\xi = -1/\ln\tanh 1 = 3.7$ אתרים. (ד) $64\cdot0.911^2/2 = 27$.
      - kind: reasoning
        text: >-
          (ד) הזהות מתקיימת עבור $m$ בכל $N$ סופי, אבל רק בהרצה שדוגמת את שני הענפים בהגינות. ב-$10^4$ סריקות סריג $8 \times 8$ חוצה בין הענפים רק קומץ פעמים, ולכן $\text{Var}(m)$ תלוי במספר החציות שההרצה הזו ראתה במקרה. $|m|$ אינו רגיש לענף שבו הסריג נמצא, והשונות שלו מודדת את הפלוקטואציות שהרצה כן דוגמת היטב.
      - kind: result
        text: >-
          (א) $\langle m\rangle = \tanh(h/k_BT)$: הפרמגנט של מודול 12. (ב) $\chi\,k_BT = e^{2J/k_BT} = 7.4$ ב-$k_BT = J$: השכנים מגבירים את התגובה. (ג) הזהות מתקיימת במדויק לספינים חופשיים. (ד) מתחת ל-$T_c$, ה-$\text{Var}(m)$ של הרצה קצרה מודד מזל; $\chi' = N\,\text{Var}(|m|)/(k_BT)$ מודד את הסריג.
challenge:
  - id: W-15.1-c1
    stars: 1
    objectives: [OBJ-15.1-4, OBJ-15.1-3]
    prompt: >-
      ל"ספין" $S$ מסוג ספין 1 יש שלושה ערכים: $S = -1$, ‏$0$ ו-$+1$.
      (א) לספין 1 בודד בשדה יש אנרגיה $E = -hS$. מצאו את $\langle S\rangle$ בטמפרטורה $T$.
      (ב) לשרשרת של ספינים מסוג ספין 1 יש אנרגיה $E = -J\sum_i S_iS_{i+1}$. השתמשו בשדה הממוצע כדי למצוא את הטמפרטורה שמתחתיה השרשרת נעשית ממוגנטת באופן ספונטני. השוו לתוצאת השדה הממוצע לשרשרת של ספינים $\pm1$, ואמרו מה התשובה האמיתית.
      (ג) פתחו ליד $T_c^\text{MF}$ כדי למצוא איך המגנוט מתאפס. איזה מעריך $\beta$ נותן השדה הממוצע לספין 1?
    answer: >-
      (א) $\langle S\rangle = \dfrac{2\sinh(h/k_BT)}{1 + 2\cosh(h/k_BT)}$. (ב) $k_BT_c^\text{MF} = \tfrac23 qJ = \tfrac43 J$, מול $2J$ לספינים $\pm1$; לשרשרת האמיתית אין מעבר בשום $T > 0$. (ג) $m_0 \approx \sqrt{\tfrac83(1 - T/T_c^\text{MF})}$: שוב $\beta = 1/2$.
    solution:
      - kind: law
        text: >-
          ספין בודד: $Z_1 = \sum_S e^{hS/(k_BT)}$ ו-$\langle S\rangle = \partial\ln Z_1/\partial(h/k_BT)$. שדה ממוצע: כל ספין רואה $h_\text{eff} = qJm$, עם $q = 2$ בשרשרת, ועקביות דורשת $m = \langle S\rangle(h_\text{eff})$.
      - kind: manipulation
        text: >-
          (א) עם $x = h/k_BT$: $Z_1 = 1 + 2\cosh x$, ולכן $\langle S\rangle = 2\sinh x/(1 + 2\cosh x) \equiv B(x)$. (ב) $m = B(qJm/k_BT)$. עבור $x$ קטן, $B(x) \approx \tfrac23 x - \tfrac19 x^3$, ולכן $m = 0$ הוא הפתרון היחיד עד שהשיפוע בראשית, $\tfrac23 qJ/k_BT$, עולה על $1$: $k_BT_c^\text{MF} = \tfrac23 qJ$.
      - kind: manipulation
        text: >-
          (ג) עם $a = qJ/k_BT$, הפיתוח נותן $1 = \tfrac23 a - \tfrac19 a^3m^2$, ולכן $m^2 = 9(\tfrac23 a - 1)/a^3 = 9(T_c/T - 1)/a^3$. ליד $T_c$, ‏$a = \tfrac32$ ו-$a^3 = \tfrac{27}{8}$: $m^2 \approx \tfrac83(1 - T/T_c)$.
      - kind: limit
        text: >-
          כש-$x \to \infty$, ‏$B \to 1$: יישור מלא. עבור $x$ קטן, $B \approx \tfrac23 x = \langle S^2\rangle_0\,x$: למצב האפס אין מומנט, ולכן ספין 1 מגיב פחות מספין $\pm1$, שעבורו $\langle s^2\rangle = 1$, וה-$T_c$ של השדה הממוצע יורד באותו גורם, $\tfrac23$. נומרית, המשוואה המלאה ב-$T = 0.975\,T_c$ נותנת $m = 0.256$, מול $0.258$ של הפיתוח.
      - kind: reasoning
        text: >-
          האמת בממד אחד היא זו של השיעור: כל קיר בין תחומים עולה אנרגיה קבועה (קשר מעלה–אפס עולה $J$) ומרוויח אנטרופיה מסדר $k_B\ln N$, ולכן שרשרת ארוכה מספיק אינה מסודרת בשום $T > 0$. באופן שקול, כל האיברים של מטריצת ההעברה $3 \times 3$, ‏$e^{JSS'/k_BT}$, חיוביים, ולכן הערך העצמי הגדול ביותר שלה אינו מנוון והוא אנליטי ב-$T$: אין סינגולריות, אין מעבר.
      - kind: units
        text: >-
          $h/k_BT$ ו-$qJ/k_BT$ הם מספרים טהורים; $T_c$ ביחידות של $J/k_B$.
      - kind: substitution
        text: >-
          שרשרת, $q = 2$: $k_BT_c^\text{MF} = \tfrac43 J = 1.33\,J$, מול $2J$ לספינים $\pm1$. בסריג הריבועי, $q = 4$, השדה הממוצע נותן $\tfrac83 J = 2.67\,J$ לספין 1.
      - kind: result
        text: >-
          (א) $2\sinh x/(1 + 2\cosh x)$. (ב) שדה ממוצע: $\tfrac43 J/k_B$; האמת: אין מעבר בממד אחד. (ג) $m_0 \propto (T_c - T)^{1/2}$: אורך הספין משנה את ה-$T_c$ של השדה הממוצע אבל לא את המעריך שלו, כי כל תורת שדה ממוצע מצטמצמת לאותו פיתוח עד סדר שלישי.
