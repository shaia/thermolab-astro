  - id: W-15.1-c2
    stars: 2
    objectives: [OBJ-15.1-2, OBJ-15.1-7]
    prompt: >-
      לשני ספיני איזינג עם אנרגיה $E = -Js_1s_2$, בטמפרטורה $T$ וב-$h = 0$, יש ארבעה מצבים: $++$, ‏$+-$, ‏$-+$ ו-$--$. בכל צעד מונטה קרלו בוחרים באקראי אחד משני הספינים, מציעים להפוך אותו ומקבלים את ההצעה לפי כלל מטרופוליס. סמנו $K = J/k_BT$.
      (א) כתבו את מטריצת המעבר $P_{ss'}$, בגודל $4 \times 4$, שאיבריה הם ההסתברויות לעבור מ-$s$ ל-$s'$ בצעד אחד, ואמתו שמשקלי בולצמן הם וקטור עצמי שמאלי שלה עם ערך עצמי $1$.
      (ב) הראו ש-$M = s_1 + s_2$, כפונקציה של המצב, הוא וקטור עצמי ימני של $P$ עם ערך עצמי $\lambda = 1 - e^{-2K}$, כך שהמתאם העצמי שלו אחרי $t$ צעדים הוא $\lambda^t$. מצאו את זמן המתאם העצמי האינטגרלי $\tau = \tfrac12 + \sum_{t\ge1}\lambda^t$, בצעדים, ב-$k_BT = J$ וב-$k_BT = 0.5\,J$.
      (ג) עכשיו בכל צעד, בהסתברות $\tfrac12$, מציעים במקום זאת להפוך את שני הספינים בבת אחת. הראו שהתפלגות בולצמן עדיין סטציונרית, ומצאו את הערך העצמי החדש של $M$ ב-$k_BT = J$. מה קורה לדעיכת המתאם העצמי של האנרגיה?
    answer: >-
      (א) $P = \begin{pmatrix} 1 - e^{-2K} & \tfrac12 e^{-2K} & \tfrac12 e^{-2K} & 0 \\ \tfrac12 & 0 & 0 & \tfrac12 \\ \tfrac12 & 0 & 0 & \tfrac12 \\ 0 & \tfrac12 e^{-2K} & \tfrac12 e^{-2K} & 1 - e^{-2K} \end{pmatrix}$, ו-$\pi = (e^K, e^{-K}, e^{-K}, e^K)/Z$ מקיים $\pi P = \pi$. (ב) $\tau = e^{2K} - \tfrac12$: $6.9$ צעדים ב-$k_BT = J$, ‏$54$ ב-$0.5\,J$. (ג) עדיין סטציונרית; הערך העצמי של $M$ נעשה $-\tfrac12 e^{-2K} = -0.068$, ולכן $M$ מאבד מתאם בצעד אחד, בעוד הערך העצמי של האנרגיה עולה מ-$-e^{-2K} = -0.135$ ל-$\tfrac12 - \tfrac12 e^{-2K} = 0.43$: ההיפוך הכפול לעולם אינו משנה את האנרגיה.
    solution:
      - kind: law
        text: >-
          $P(s \to s') = \tfrac12 A(s \to s')$ לכל אחד משני מהלכי ההיפוך הבודד, ו-$P(s \to s) = 1 - \sum_{s' \ne s}P(s \to s')$. סטציונריות: $\sum_s \pi_s P_{ss'} = \pi_{s'}$.
      - kind: manipulation
        text: >-
          (א) מ-$++$ כל היפוך עולה $\Delta E = 2J$ ומתקבל בהסתברות $e^{-2K}$: $P(++ \to +-) = P(++ \to -+) = \tfrac12 e^{-2K}$, ובשאר המקרים המצב נשאר. מ-$+-$ כל היפוך מוריד את האנרגיה ב-$2J$ ומתקבל: ל-$++$ או ל-$--$, כל אחד בהסתברות $\tfrac12$. בדיקת העמודה של $++$: $e^K(1 - e^{-2K}) + e^{-K}\cdot\tfrac12 + e^{-K}\cdot\tfrac12 = e^K$; העמודה של $+-$: $e^K\cdot\tfrac12e^{-2K} + e^K\cdot\tfrac12e^{-2K} = e^{-K}$. השאר נובעות מסימטריה.
      - kind: manipulation
        text: >-
          (ב) $M = (2, 0, 0, -2)$. $(PM)_{++} = 2(1 - e^{-2K})$; ‏$(PM)_{+-} = \tfrac12\cdot2 + \tfrac12\cdot(-2) = 0$; וכן הלאה: $PM = (1 - e^{-2K})M$. ה-$M$ הצפוי אחרי $t$ צעדים הוא $\lambda^tM_0$, ומכיוון ש-$\langle M\rangle = 0$, ‏$\rho(t) = \lambda^t$. מכאן $\tau = \tfrac12 + \lambda/(1 - \lambda) = e^{2K} - \tfrac12$.
      - kind: manipulation
        text: >-
          (ג) ההיפוך הכפול אינו משנה אף קשר, $\Delta E = 0$, והוא מתקבל תמיד; הוא מחליף $++ \leftrightarrow --$ ו-$+- \leftrightarrow -+$, מצבים בעלי משקל שווה, ולכן הוא משאיר את $\pi$ ללא שינוי, וכך גם תערובת של שני מהלכים שכל אחד מהם משאיר את $\pi$ סטציונרית. על $M$ הוא פועל כ-$-1$: $\lambda_M = \tfrac12(1 - e^{-2K}) - \tfrac12 = -\tfrac12 e^{-2K}$. על האנרגיה, שההיפוכים הבודדים לבדם נותנים לה ערך עצמי $-e^{-2K}$, הוא פועל כ-$+1$: $\lambda_E = -\tfrac12 e^{-2K} + \tfrac12$.
      - kind: limit
        text: >-
          כש-$T \to \infty$, ‏$\lambda \to 0$ ו-$\tau \to \tfrac12$: דגימות בלתי תלויות. כש-$T \to 0$, ‏$\tau \approx e^{2J/k_BT}$ גדל בלי גבול: כדי להפוך את $M$ הזוג צריך לטפס קודם למצב שבו שני הספינים מנוגדים. זו הגרסה של שני ספינים לסריג גדול שלעולם אינו מתהפך מתחת ל-$T_c$, וההיפוך הכפול הוא הגרסה של שני ספינים למהלך אשכול, שהופך קבוצה של ספינים מיושרים בבת אחת.
      - kind: units
        text: >-
          $K$ הוא מספר טהור; $\tau$ נספר בצעדים (שני צעדים הם סריקה אחת של הסריג בן שני הספינים).
      - kind: substitution
        text: >-
          $k_BT = J$: $e^{-2} = 0.135$, ‏$\lambda = 0.865$, ‏$\tau = e^2 - 0.5 = 6.9$. $k_BT = 0.5\,J$: $\tau = e^4 - 0.5 = 54$. עם היפוכים כפולים ב-$k_BT = J$: $\lambda_M = -0.068$, ‏$\lambda_E = 0.432$.
      - kind: result
        text: >-
          (א) $\pi P = \pi$: שרשרת מטרופוליס דוגמת את התפלגות בולצמן. (ב) $\tau_M = e^{2J/k_BT} - \tfrac12$, ‏$6.9$ ו-$54$ צעדים. (ג) אותו שיווי משקל, שמגיעים אליו במהירויות שונות עבור גדלים נצפים שונים: הוספת ההיפוך הכפול גורמת ל-$M$ לאבד מתאם מיד, ולאנרגיה לאבד אותו לאט יותר. ההתפלגות הסטציונרית נקבעת על ידי איזון מפורט; המהירות היא תכונה של המהלכים ושל מה שנמדד.
