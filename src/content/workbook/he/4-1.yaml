  - id: W-4.1-c2
    stars: 2
    objectives: [OBJ-4.1-5]
    prompt: >-
      גז חד-אטומי קלאסי שאינו אידיאלי מקיים $P = \dfrac{Nk_BT}{V - bN} - a\dfrac{N^2}{V^2}$, עם $a, b > 0$: $b$ מייצג את הנפח העצמי של האטומים, $a$ את המשיכה ביניהם, שגם נותנת לגז אנרגיה פוטנציאלית $-aN^2/V$. אף אחד מהתיקונים לא משנה את קיבול החום בנפח קבוע. הגז נמצא במיכל מבודד בעל מסה זניחה, ומחיצה כולאת אותו בהתחלה בשליש מהנפח הכולל $V_0$, בטמפרטורה $T_i$. פותחים חור במחיצה והגז מתפשט לכל המיכל.
      (א) איזה גודל תרמודינמי נשמר?
      (ב) מה הטמפרטורה אחרי ששיווי המשקל חוזר?
    answer: >-
      (א) האנרגיה הפנימית: לא זורם חום ולא נעשית עבודה. (ב) $T_f = T_i - \dfrac{4aN}{3k_BV_0}$: הגז מתקרר. גז אידיאלי ($a = 0$) לא היה מתקרר.
    solution:
      - kind: law
        text: >-
          מיכל מבודד, קשיח וחסר מסה: $Q = 0$ ו-$W = 0$, ולכן $U$ נשמרת. $U = \tfrac32 Nk_BT - aN^2/V$: החלק הקינטי, שהתיקונים לא משנים, ועוד האנרגיה הפוטנציאלית של המשיכה.
      - kind: manipulation
        text: >-
          $\tfrac32 Nk_BT_f - \dfrac{aN^2}{V_0} = \tfrac32 Nk_BT_i - \dfrac{aN^2}{V_0/3}$, ולכן $\tfrac32 Nk_B(T_f - T_i) = aN^2\left(\dfrac{1}{V_0} - \dfrac{3}{V_0}\right) = -\dfrac{2aN^2}{V_0}$.
      - kind: limit
        text: >-
          $a \to 0$: $T_f = T_i$, התוצאה המוכרת שגז אידיאלי לא משנה טמפרטורה בהתפשטות חופשית; לאנרגיה שלו אין חלק שתלוי בנפח. הנפח המודר $b$ לא נכנס ל-$U$, ולכן הוא לא משנה את התשובה.
      - kind: units
        text: >-
          $aN^2/V$ היא אנרגיה, ולכן $aN/(k_BV)$ היא טמפרטורה.
      - kind: result
        text: >-
          (א) $U$. (ב) $T_f = T_i - 4aN/(3k_BV_0)$: כשהאטומים מתפזרים נגד המשיכה שלהם, הם ממירים אנרגיה קינטית באנרגיה פוטנציאלית.
