# חוברת התרגול של שיעור 4.1. שאלות 02 ו-04 הן שאלה 1 של ThermoLab, שאלה 09 היא שאלה 6(ג) שלו; השאר חדשות.
# ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו מפרסמת אותם, בהחלטת הכותב.
# קחו k_B = 1.381e-23 J/K, R = 8.314 J/(mol K), N_A = 6.022e23 /mol.
lang: he
lesson: '4.1'
practice:
  - id: W-4.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-4.1-1]
    prompt: >-
      מד לחץ של צמיג מראה ערך יציב לגמרי של $2.2\cdot10^5\,\text{Pa}$. האם מולקולות אוויר פוגעות בקרום של המד בקצב קבוע, אחת אחרי השנייה? מה בדיוק יציב?
    answer: >-
      לא. מולקולות מגיעות ברגעים אקראיים ובתנעים אקראיים. מה שיציב הוא התנע הכולל שמועבר בשנייה, ממוצע על פני מספר עצום של פגיעות.
    solution:
      - kind: reasoning
        text: >-
          כל מולקולה מגיעה כשהמעוף האקראי שלה מביא אותה במקרה אל הקרום, במהירות ובכיוון אקראיים; שום דבר בהגעה בודדת אינו סדיר.
      - kind: reasoning
        text: >-
          המד מגיב לכוח, התנע שמועבר ליחידת זמן. בכל פרק זמן קצר הוא מקבל כל כך הרבה פגיעות שהסכום שלהן משתנה בשבר $N^{-1/2}$ מהממוצע, קטן מכדי שיראו אותו.
      - kind: result
        text: >-
          הפגיעות לא סדירות; קצב העברת התנע שלהן, בממוצע על פני מספר עצום מהן, הוא מה שיציב.

  - id: W-4.1-02
    level: basic
    objectives: [OBJ-4.1-2]
    prompt: >-
      חלקיק במסה $m$ ובמהירות $(v_x, v_y)$ פוגע בדופן קשיחה הניצבת לציר $x$ וניתז באופן אלסטי.
      (א) איזה תנע הוא מעביר לדופן, ולמה $v_y$ לא מופיע?
      (ב) החלקיק נמצא בקופסה שצלעה בכיוון $x$ היא $L_x$. הראו שהכוח הממוצע בזמן שלו על הדופן הזו הוא $mv_x^2/L_x$, ואמרו איפה השתמשתם בהנחה שהוא לא פוגע בשום דבר אחר בדרך.
    answer: >-
      (א) $2m|v_x|$, בניצב לדופן; הדופן לא מפעילה כוח לאורך $y$, ולכן $v_y$ לא משתנה.
      (ב) $F = 2m|v_x|\cdot|v_x|/(2L_x) = mv_x^2/L_x$; זמן ההלוך ושוב $2L_x/|v_x|$ מניח מעוף ישר בלי מכשולים.
    solution:
      - kind: law
        text: >-
          שימור תנע: הדופן מקבלת את שינוי התנע של החלקיק בסימן הפוך. דופן קשיחה וחלקה דוחפת רק לאורך הניצב שלה.
      - kind: manipulation
        text: >-
          $v_x \to -v_x$, ו-$v_y$ לא משתנה: התנע של החלקיק משתנה ב-$-2mv_x\,\hat x$, ולכן הדופן מקבלת $2m|v_x|$ לאורך $x$.
      - kind: manipulation
        text: >-
          בין שתי פגיעות באותה דופן החלקיק חוצה את הקופסה וחוזר, $2L_x$ במהירות $|v_x|$: $\Delta t = 2L_x/|v_x|$. כאן משתמשים במעוף ישר ורציף. הכוח הממוצע הוא $\Delta p/\Delta t = 2m|v_x|\cdot|v_x|/(2L_x) = mv_x^2/L_x$.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m}^2\text{s}^{-2}/\text{m} = \text{N}$.
      - kind: result
        text: >-
          (א) $2m|v_x|$; כוח ניצב לדופן לא נוגע ב-$v_y$. (ב) $mv_x^2/L_x$, בהנחת הלוך ושוב חופשי של $2L_x$.

  - id: W-4.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-4.1-3]
    prompt: >-
      מרוקנים מיכל של ארגון ב-$300\,\text{K}$ וממלאים אותו באותו מספר אטומי הליום, גם הם ב-$300\,\text{K}$. מה מהבאים משתנה: הלחץ, האנרגיה הקינטית הממוצעת לאטום, האנרגיה הפנימית, מהירות שורש הממוצע הריבועי?
    answer: >-
      רק מהירות שורש הממוצע הריבועי, שגדלה פי $\sqrt{39.95/4.00} = 3.16$. שלושת האחרים תלויים רק ב-$N$, ב-$V$ וב-$T$.
    solution:
      - kind: law
        text: >-
          $PV = Nk_BT$, $\langle E\rangle = \tfrac32 k_BT$, $U = N\langle E\rangle$, $v_{\text{rms}} = \sqrt{3k_BT/m}$.
      - kind: reasoning
        text: >-
          $N$, $V$ ו-$T$ לא השתנו, ולכן גם $P$, $\langle E\rangle$ ו-$U$ לא. רק $v_{\text{rms}}$ מכיל את המסה, כ-$m^{-1/2}$.
      - kind: result
        text: >-
          רק המהירות משתנה: אטומי הליום מהירים פי $3.16$.

  - id: W-4.1-04
    level: mid
    objectives: [OBJ-4.1-2]
    prompt: >-
      סטודנט כותב את הכוח של חלקיק אחד על דופן אחת כ-$2m|v_x|\,\nu$, כאשר $\nu$ הוא קצב הפגיעות, לוקח $\nu = |v_x|/L_x$, ומקבל $2mv_x^2/L_x$, פי שניים מהתוצאה של השיעור. מצאו את הטעות.
    answer: >-
      $|v_x|/L_x$ הוא קצב הפגיעות בשתי דפנות $x$ יחד. בדופן אחת החלקיק פוגע פעם בכל הלוך ושוב, $|v_x|/(2L_x)$, וזה נותן $mv_x^2/L_x$.
    solution:
      - kind: reasoning
        text: >-
          חלקיק שחוצה את הקופסה פעם אחת צריך $L_x/|v_x|$ ואז פוגע בדופן, אבל לסירוגין בשמאלית ובימנית.
      - kind: manipulation
        text: >-
          החזרה לאותה דופן דורשת הלוך ושוב, $2L_x/|v_x|$, ולכן הקצב בדופן אחת הוא $|v_x|/(2L_x)$ ו-$F = 2m|v_x|\cdot|v_x|/(2L_x) = mv_x^2/L_x$.
      - kind: limit
        text: >-
          בדיקה: שתי הדפנות יחד מקבלות אז $2mv_x^2/L_x$, וזה המספר של הסטודנט. זה הכוח הכולל על שתי הדפנות, לא הכוח על אחת.
      - kind: result
        text: >-
          הסטודנט ספר את הפגיעות בשתי דפנות $x$; הכוח על דופן אחת הוא $mv_x^2/L_x$.

  - id: W-4.1-05
    level: mid
    objectives: [OBJ-4.1-2, OBJ-4.1-3]
    prompt: >-
      בקבוק של $1.5\,\text{L}$ מכיל $3.0\cdot10^{22}$ מולקולות חנקן ב-$350\,\text{K}$.
      (א) מצאו את הלחץ.
      (ב) מצאו את האנרגיה הקינטית הממוצעת של תנועת ההעתקה למולקולה ואת האנרגיה הקינטית הכוללת של תנועת ההעתקה.
    answer: >-
      (א) $9.67\cdot10^4\,\text{Pa}$. (ב) $7.25\cdot10^{-21}\,\text{J}$ למולקולה, $218\,\text{J}$ בסך הכול.
    solution:
      - kind: law
        text: >-
          $PV = Nk_BT$; חלוקת האנרגיה השווה על שלושת כיווני התנועה, $\langle E_{\text{tr}}\rangle = \tfrac32 k_BT$. (חנקן גם מסתובב; השאלה שואלת רק על תנועת העתקה, ורק בה תלוי הלחץ.)
      - kind: substitution
        text: >-
          $P = 3.0\cdot10^{22}\cdot1.381\cdot10^{-23}\cdot350/1.5\cdot10^{-3} = 9.67\cdot10^4\,\text{Pa}$. $\langle E_{\text{tr}}\rangle = 1.5\cdot1.381\cdot10^{-23}\cdot350 = 7.25\cdot10^{-21}\,\text{J}$, ו-$N\langle E_{\text{tr}}\rangle = 218\,\text{J}$.
      - kind: limit
        text: >-
          הכפלת $N$ באותו בקבוק מכפילה את $P$ ואת האנרגיה הכוללת, ולא נוגעת באנרגיה למולקולה: הגודל לחלקיק נקבע רק על ידי $T$.
      - kind: units
        text: >-
          $\text{J/m}^3 = \text{Pa}$; $\text{J/K}\cdot\text{K} = \text{J}$.
      - kind: result
        text: >-
          (א) $9.67\cdot10^4\,\text{Pa}$; (ב) $7.25\cdot10^{-21}\,\text{J}$ למולקולה, $218\,\text{J}$ בסך הכול.

  - id: W-4.1-06
    level: mid
    objectives: [OBJ-4.1-4]
    prompt: >-
      (א) חיישן ננומטרי דוגם את הלחץ של $10^6$ מולקולות. איזו פלוקטואציה יחסית הוא רואה?
      (ב) כמה מולקולות יורידו את הפלוקטואציה לחלק אחד במיליון?
    answer: >-
      (א) $10^{-3}$, עשירית האחוז. (ב) $10^{12}$.
    solution:
      - kind: law
        text: >-
          $\sigma_P/\langle P\rangle = N^{-1/2}$, ולכן $N = (\sigma_P/\langle P\rangle)^{-2}$.
      - kind: substitution
        text: >-
          (א) $(10^6)^{-1/2} = 10^{-3}$. (ב) $(10^{-6})^{-2} = 10^{12}$.
      - kind: limit
        text: >-
          פלוקטואציה קטנה פי אלף דורשת פי מיליון מולקולות: המחיר התלול הזה הוא החוק $N^{-1/2}$.
      - kind: result
        text: >-
          (א) $10^{-3}$; (ב) $10^{12}$ מולקולות.

  - id: W-4.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.1-1, OBJ-4.1-4]
    prompt: >-
      מכפילים את מספר החלקיקים בקופסה ב-$T$ וב-$V$ קבועים. מה קורה: (א) ללחץ הממוצע; (ב) לגודל המוחלט של הפלוקטואציות שלו; (ג) לגודל היחסי שלהן?
    answer: >-
      (א) מוכפל. (ב) גדל פי $\sqrt2$. (ג) קטן פי $\sqrt2$.
    solution:
      - kind: law
        text: >-
          $\langle P\rangle = Nk_BT/V \propto N$; לסכום של $N$ תרומות בלתי תלויות יש פיזור $\propto \sqrt N$.
      - kind: reasoning
        text: >-
          פי שניים חלקיקים: פי שניים ממוצע, פי $\sqrt2$ פיזור, ולכן היחס קטן פי $\sqrt2$. המד רועש יותר במונחים מוחלטים ויציב יותר במונחים יחסיים.
      - kind: result
        text: >-
          (א) $\times 2$; (ב) $\times\sqrt2$; (ג) $\div\sqrt2$.

  - id: W-4.1-08
    level: bagrut
    objectives: [OBJ-4.1-5]
    prompt: >-
      ב-$300\,\text{K}$ ובאטמוספרה אחת, אטומי ארגון (שקוטרם $0.34\,\text{nm}$) ממלאים כ-$5.0\cdot10^{-4}$ מהנפח. באיזה לחץ, באותה טמפרטורה, הם ימלאו $1\%$ ממנו? האם חוק הגזים האידיאליים עדיין אמין שם?
    answer: >-
      כ-$2.0\cdot10^6\,\text{Pa}$, עשרים אטמוספרות. התיקון של הגודל הוא אז כ-$4\%$, כי הנפח שאטום חוסם בפני אחרים גדול פי ארבעה מנפחו שלו; המשיכה פועלת בכיוון ההפוך והיא גדולה יותר, ועבור ארגון ב-$300\,\text{K}$ שני התיקונים משאירים את הלחץ כ-$1\%$ מתחת לערך האידיאלי. החוק עדיין הערכה ראשונה טובה, אבל כבר לא מדויק עד האחוז.
    solution:
      - kind: law
        text: >-
          החלק התפוס הוא $n\cdot\tfrac{\pi}{6}d^3$ עם $n = P/k_BT$, ולכן ב-$T$ קבועה הוא פרופורציוני ל-$P$.
      - kind: manipulation
        text: >-
          $P_2 = P_1\cdot(0.01/5.0\cdot10^{-4}) = 20\,P_1$.
      - kind: substitution
        text: >-
          $P_2 = 20\cdot1.013\cdot10^5 = 2.0\cdot10^6\,\text{Pa}$.
      - kind: limit
        text: >-
          כש-$P \to 0$ החלק שואף לאפס והגז נעשה אידיאלי; החלק היה מגיע לסדר גודל של אחד רק סמוך לצפיפויות של נוזל, שם המודל נכשל לגמרי.
      - kind: result
        text: >-
          כ-$2.0\cdot10^6\,\text{Pa}$; תיקון גודל של כ-$4\%$ ותיקון משיכה גדול יותר בסימן הפוך, כ-$1\%$ בסך הכול, ולכן חוק הגזים האידיאליים עדיין הערכה סבירה אבל לא מדויקת.

  - id: W-4.1-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.1-4, OBJ-4.1-5]
    prompt: >-
      באיור 4.1ב כל גז נדגם בטמפרטורה $T$, והאנרגיה שלו שונה מעט מדגימה לדגימה. נניח שבמקום זה כל גז היה מקבל בדיוק את האנרגיה $Nk_BT$, באותה קופסה ריבועית. כמה גדול היה הפיזור של הלחצים הממוצעים בזמן שלהם, ואיזו משתי האפשרויות מתארת גז במגע עם סביבה בטמפרטורה $T$?
    answer: >-
      אפס: בקופסה ריבועית הלחץ הממוצע בזמן הוא בדיוק $E/A$, ולכן אנרגיות שוות נותנות לחצים שווים. לגז שמחליף אנרגיה עם סביבה ב-$T$ יש אנרגיה שעוברת פלוקטואציות, וזו האפשרות של איור 4.1ב.
    solution:
      - kind: law
        text: >-
          בקופסה ריבועית הלחץ הממוצע בזמן של מיקרו-מצב הוא $P = \frac{m}{2A}\sum_i (v_{x,i}^2 + v_{y,i}^2) = E/A$.
      - kind: reasoning
        text: >-
          קביעת האנרגיה קובעת את $P$ בדיוק, ולכן הפיזור נעלם. הפיזור $N^{-1/2}$ של איור 4.1ב הוא הפיזור של האנרגיה עצמה, שנדגמת בטמפרטורה $T$.
      - kind: reasoning
        text: >-
          לגז במיכל שמחליף אנרגיה עם סביבתו אין אנרגיה חדה: האנרגיה שלו משתנה. זו אפשרות הדגימה ב-$T$ (הצבר הקנוני, מודול 11).
      - kind: result
        text: >-
          פיזור אפס באנרגיה קבועה; הגז במגע עם סביבה הוא זה שנדגם בטמפרטורה $T$, עם הפיזור $N^{-1/2}$.

  - id: W-4.1-10
    level: bagrut
    objectives: [OBJ-4.1-2, OBJ-4.1-3]
    prompt: >-
      מיכל של $49.8\,\text{L}$ מכיל $1.00\,\text{mol}$ הליום ו-$1.00\,\text{mol}$ ארגון ב-$300\,\text{K}$.
      (א) מצאו את הלחץ הכולל ואת החלק שכל גז תורם.
      (ב) אילו אטומים מעבירים יותר תנע בכל פגיעה, ואילו פוגעים לעיתים קרובות יותר? פי כמה?
    answer: >-
      (א) $1.00\cdot10^5\,\text{Pa}$ בסך הכול, $5.01\cdot10^4\,\text{Pa}$ מכל גז. (ב) אטום ארגון מעביר פי $3.16$ יותר תנע בכל פגיעה; אטומי הליום פוגעים פי $3.16$ לעיתים קרובות יותר.
    solution:
      - kind: law
        text: >-
          חלקיקים בלי אינטראקציה תורמים באופן בלתי תלוי: $P = \sum_j N_jk_BT/V$ (חוק דלטון). לכל פגיעה $2m|v_x|$, עם $|v_x| \propto m^{-1/2}$ ב-$T$ קבועה; קצב הפגיעות $\propto |v_x|$.
      - kind: substitution
        text: >-
          כל גז: $nRT/V = 1.00\cdot8.314\cdot300/4.98\cdot10^{-2} = 5.01\cdot10^4\,\text{Pa}$; יחד $1.00\cdot10^5\,\text{Pa}$. התנע לפגיעה $\propto m\cdot m^{-1/2} = m^{1/2}$, ולכן ארגון חלקי הליום הוא $\sqrt{39.95/4.00} = 3.16$; קצב הפגיעות ביחס ההפוך.
      - kind: limit
        text: >-
          במסות שוות שני הגורמים שווים ל-1. בכל יחס מסות המכפלה שלהם עדיין שווה ל-1, ולכן כמויות שוות ב-$T$ שווה תורמות חלקים שווים.
      - kind: units
        text: >-
          $\text{J}/\text{m}^3 = \text{Pa}$.
      - kind: result
        text: >-
          (א) $1.00\cdot10^5\,\text{Pa}$, חצי מכל גז. (ב) ארגון: פי $3.16$ תנע לפגיעה; הליום: פי $3.16$ פגיעות.
challenge:
  - id: W-4.1-c1
    stars: 1
    objectives: [OBJ-4.1-4]
    prompt: >-
      סנטימטר מעוקב של גז חד-אטומי דליל נמצא ב-$0\,^\circ\text{C}$ ובלחץ אטמוספרי, ובתנאים אלה יש בו $2.69\cdot10^{25}$ אטומים במטר מעוקב (מספר לושמידט). כל רכיב מהירות של אטום הוא גאוסי עם ממוצע אפס ושונות $k_BT/m$, ולכן $\langle v_x^2\rangle = k_BT/m$ ו-$\langle v_x^4\rangle = 3(k_BT/m)^2$.
      (א) עבור האנרגיה הקינטית של אטום בודד, מצאו את היחס בין סטיית התקן לממוצע.
      (ב) מצאו את אותו יחס עבור האנרגיה הקינטית הכוללת של הגז.
    answer: >-
      (א) $\sqrt{2/3} = 0.82$. (ב) $\sqrt{2/(3N)} = 1.6\cdot10^{-10}$, עם $N = 2.69\cdot10^{19}$.
    solution:
      - kind: law
        text: >-
          $E_1 = \tfrac{m}{2}(v_x^2 + v_y^2 + v_z^2)$, סכום של שלושה איברים בלתי תלויים. לאיבר אחד, $\langle \tfrac{m}{2}v_x^2\rangle = \tfrac12 k_BT$ ו-$\operatorname{Var}(\tfrac{m}{2}v_x^2) = \tfrac{m^2}{4}\left(\langle v_x^4\rangle - \langle v_x^2\rangle^2\right) = \tfrac12 (k_BT)^2$.
      - kind: manipulation
        text: >-
          ממוצעים ושונויות של איברים בלתי תלויים מתחברים. אטום אחד: ממוצע $\tfrac32 k_BT$, שונות $\tfrac32 (k_BT)^2$, יחס $\sqrt{3/2}/(3/2) = \sqrt{2/3}$. $N$ אטומים: ממוצע $\tfrac32 Nk_BT$, שונות $\tfrac32 N(k_BT)^2$, יחס $\sqrt{2/(3N)}$.
      - kind: substitution
        text: >-
          $N = 2.69\cdot10^{25}\cdot10^{-6} = 2.69\cdot10^{19}$, ולכן $\sqrt{2/(3\cdot2.69\cdot10^{19})} = 1.57\cdot10^{-10}$.
      - kind: limit
        text: >-
          $N = 1$ מחזיר את סעיף א'; כש-$N \to \infty$ היחס נעלם כמו $N^{-1/2}$, אותו חוק כמו של הלחץ, כי הלחץ הממוצע בזמן של גז הוא האנרגיה הקינטית שלו חלקי הנפח, כפול קבוע.
      - kind: result
        text: >-
          (א) $0.82$: אי-הוודאות באנרגיה של אטום בודד גדולה כמעט כמו האנרגיה עצמה. (ב) $1.6\cdot10^{-10}$: האנרגיה של סנטימטר מעוקב חדה עד עשר ספרות אחרי הנקודה.
