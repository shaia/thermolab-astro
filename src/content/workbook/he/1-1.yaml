# חוברת התרגול של שיעור 1.1. שאלה 01 היא שאלה 1 של ThermoLab (לקרוא את החוק האפס), שאלה 09 היא שאלה 6 שלו
# (החישובית, עם פרמטרים קבועים כך שיש לה תשובה); השאר חדשות, ואף אחת מהן אינה חוזרת על שאלות 2 עד 5 של ThermoLab,
# שהן שאלות החזרה, או על שש הדוגמאות הפתורות של השיעור. מספרי מודל הדילוגים בשאלות 07 ו-09 חושבו עבור החוברת הזו
# ב-thermolab.equilibrium של ThermoLab (מנות של 64 זרעים, 256 עד 384 זרעים בסך הכול) ונבדקו מול הממוצע והשונות
# המדויקים, ששניהם מקיימים נוסחאות נסיגה ליניאריות. ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו מפרסמת
# אותם, בהחלטת הכותב. הטמפרטורות של מודל הדילוגים הן ביחידות של הקוונט, epsilon/k_B, והזמן שלו נספר בצעדים.
lang: he
lesson: '1.1'
practice:
  - id: W-1.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-1]
    prompt: >-
      לקרוא את החוק האפס.
      (א) נסחו במדויק את החוק האפס של התרמודינמיקה.
      (ב) סטודנט טוען: "אם A חם יותר מ-C, ו-B חם יותר מ-C, אז A ו-B חייבים להיות באותה טמפרטורה." הסבירו במדויק מה שגוי בטיעון הזה, והעמידו אותו מול מה שהחוק האפס באמת אומר.
      (ג) הסבירו במשפט אחד מדוע החוק האפס הוא שנותן משמעות לכיול של מדחום יחיד פעם אחת ולאמון בקריאה שלו אחר כך על עצמים רבים ושונים.
      (ד) גוף A נמצא בשיווי משקל תרמי עם C, ו-B חם יותר מ-C. לאיזה כיוון זורם חום כש-A ו-B נוגעים זה בזה? איזה חלק מהתשובה שלכם הוא החוק האפס, ואיזה לא?
    answer: >-
      (א) אם A נמצא בשיווי משקל תרמי עם C ו-B נמצא בשיווי משקל תרמי עם C, אז A ו-B נמצאים בשיווי משקל תרמי זה עם זה. (ב) "חם יותר מ-C" פירושו "אינו בשיווי משקל עם C", ולכן ההנחה של החוק חסרה; שני גופים חמים יותר מ-C יכולים להיות בכל שתי טמפרטורות שמעל זו של C ($80\,{}^\circ\text{C}$ ו-$40\,{}^\circ\text{C}$ לעומת $20\,{}^\circ\text{C}$). החוק הופך את היחס "בשיווי משקל עם" לטרנזיטיבי, ואינו אומר דבר על "חם יותר מ". (ג) כל עצם שמביא את המדחום לאותה קריאה נמצא בשיווי משקל עם כל עצם אחר כזה, ולכן כיול אחד מסמן את כולם. (ד) מ-B ל-A: החוק האפס שם את A במחלקה של C, ולכן $T_A = T_C < T_B$; שחום זורם מהטמפרטורה הגבוהה אל הנמוכה זו עובדת ניסיון נוספת, לא החוק האפס.
    solution:
      - kind: reasoning
        text: >-
          (א) החוק הוא טענה על יחס אחד בין גופים, "נמצא בשיווי משקל תרמי עם": כשמביאים את שני הגופים למגע תרמי, שום דבר מאקרוסקופי באף אחד מהם אינו משתנה. הוא אומר שהיחס טרנזיטיבי: שיווי משקל עם גוף שלישי משותף גורר שיווי משקל זה עם זה. כחוק אמפירי הוא יכול היה להיות שגוי; הניסוי אומר שאינו.
      - kind: reasoning
        text: >-
          (ב) הטיעון יוצא מ"חם יותר מ-C", שהוא השלילה של ההנחה של החוק האפס: A ו-C אינם בשיווי משקל, וגם B ו-C אינם. מכאן לא נובע דבר לגבי A ו-B: כש-C ב-$20\,{}^\circ\text{C}$, A יכול להיות ב-$80\,{}^\circ\text{C}$ ו-B ב-$40\,{}^\circ\text{C}$, וחום יזרום מ-A ל-B. הסטודנט התייחס ל"חם יותר מ-C" כאילו הייתה זו מחלקה כמו "בשיווי משקל עם C". החוק ממיין גופים למחלקות של שיווי משקל הדדי; "חם יותר מ" משווה בין שתי מחלקות שונות, והוא כלל אינו יחס שקילות (שום גוף אינו חם יותר מעצמו).
      - kind: reasoning
        text: >-
          (ג) המדחום הוא הגוף השלישי C. כיול שלו מול גופי ייחוס נותן מספר לכל מחלקה שהוא יכול להגיע איתה לשיווי משקל; החוק האפס מבטיח ששני עצמים שמביאים אותו לאותו מספר שייכים לאותה מחלקה, ולכן נמצאים בשיווי משקל זה עם זה ועם גוף הייחוס שממנו בא המספר, בלי שהופגשו אי פעם.
      - kind: reasoning
        text: >-
          (ד) A נמצא במחלקה של C, ולכן הטמפרטורה שלו היא זו של C, $T_A = T_C$; ו-B חם יותר מ-C, $T_B > T_C$. לכן $T_B > T_A$, וחום זורם מ-B ל-A. הצעד הראשון הוא החוק האפס. השני, שטמפרטורות מסודרות זו ביחס לזו ושחום זורם מהגבוהה אל הנמוכה, הוא עובדת ניסיון נפרדת (התחום של החוק השני, מודול 9): החוק האפס נותן משמעות ל"אותה טמפרטורה", לא ל"חם יותר".
      - kind: result
        text: >-
          (א) שיווי משקל עם גוף שלישי משותף גורר שיווי משקל זה עם זה. (ב) לטיעון אין הנחה שהחוק חל עליה: "חם יותר מ-C" אינו "בשיווי משקל עם C", ושני גופים חמים יותר מ-C אינם חייבים לחלוק דבר. (ג) הטרנזיטיביות מאפשרת לקריאה מכוילת אחת לסמן מחלקה שלמה של גופים. (ד) מ-B ל-A; החוק האפס נותן $T_A = T_C$, וכיוון הזרימה בא ממקום אחר.

  - id: W-1.1-02
    level: basic
    objectives: [OBJ-1.1-3]
    prompt: >-
      כדי למדוד את החום הסגולי של מתכת, מחממים דגימה של $0.100\,\text{kg}$ ל-$100.0\,{}^\circ\text{C}$ במים רותחים ומפילים אותה לתוך $0.250\,\text{kg}$ מים ב-$20.0\,{}^\circ\text{C}$ ($c = 4200\,\text{J/(kg K)}$), שנמצאים בכוס מבודדת בעלת קיבול חום של $50\,\text{J/K}$, גם היא ב-$20.0\,{}^\circ\text{C}$. הטמפרטורה המשותפת מתייצבת על $26.1\,{}^\circ\text{C}$.
      (א) מצאו את החום הסגולי של המתכת. איזו מתכת זו כנראה: אלומיניום ($900\,\text{J/(kg K)}$), ברזל ($450$) או נחושת ($385$)?
      (ב) סטודנטית משמיטה את הכוס מהחישוב. בכמה שגויה התשובה שלה, ולאיזה כיוון?
      (ג) במציאות הכוס מאבדת מעט חום לחדר לפני שהקריאה נלקחת. האם זה הופך את החום הסגולי הנמדד לגבוה מדי או לנמוך מדי?
    answer: >-
      (א) $908\,\text{J/(kg K)}$: אלומיניום. (ב) $867\,\text{J/(kg K)}$, נמוך ב-$4.5\%$. (ג) נמוך מדי: הדליפה מורידה את הקריאה הסופית, ולכן נראה כאילו המים והכוס קיבלו פחות חום, וכאילו הדגימה מסרה אותו על פני ירידת טמפרטורה גדולה יותר.
    solution:
      - kind: given
        text: >-
          דגימה: $m = 0.100\,\text{kg}$, $c_s$ לא ידוע, בטמפרטורת התחלה $T_s = 100.0\,{}^\circ\text{C}$. מים: $C_1 = 0.250 \times 4200 = 1050\,\text{J/K}$; כוס: $C_2 = 50\,\text{J/K}$; שניהם ב-$T_1 = 20.0\,{}^\circ\text{C}$. בסוף $T_f = 26.1\,{}^\circ\text{C}$.
      - kind: law
        text: >-
          שלושת הגופים מבודדים יחד ולא נעשית עבודה ($W = 0$), ולכן סכום החום שהם קולטים הוא אפס, כשכל אחד קולט $Q_i = C_i\,\Delta T_i$ בקיבול חום קבוע: $mc_s(T_f - T_s) + (C_1 + C_2)(T_f - T_1) = 0$.
      - kind: formula
        text: >-
          $c_s = \dfrac{(C_1 + C_2)\,(T_f - T_1)}{m\,(T_s - T_f)}$
      - kind: reasoning
        text: >-
          (ב) השמטת הכוס מחליפה את $C_1 + C_2$ ב-$C_1$, ולכן התשובה קטנה מדי בשבר $C_2/(C_1 + C_2) = 50/1100 = 4.5\%$. (ג) דליפה לחדר לוקחת חום שהמים והכוס היו שומרים אילולא כן, ולכן $T_f$ נקרא נמוך. $T_f$ נמוך יותר מקטין את המונה ומגדיל את המכנה: גם $c_s$ הנמדד יוצא נמוך מדי.
      - kind: limit
        text: >-
          אילו הטמפרטורה הסופית הייתה $T_1$, הדגימה לא הייתה מוסרת חום כלל: $c_s = 0$. כאשר $C_2 \to 0$ הכוס נשמטת, כמו ב-(ב). והנוסחה היא ממוצע משוקלל בסידור מחדש: הצבה של $c_s = 900\,\text{J/(kg K)}$ בחזרה ב-$T_\mathrm{eq} = (mc_sT_s + (C_1 + C_2)T_1)/(mc_s + C_1 + C_2)$ נותנת $26.05\,{}^\circ\text{C}$, הקריאה עד כדי הדיוק שלה.
      - kind: units
        text: >-
          $(\text{J/K})\cdot\text{K}/(\text{kg}\cdot\text{K}) = \text{J/(kg K)}$. הפרשי טמפרטורות זהים בצלזיוס ובקלווין, ולכן אפשר להשתמש בקריאות בצלזיוס ישירות.
      - kind: substitution
        text: >-
          $c_s = 1100 \times 6.1/(0.100 \times 73.9) = 6710/7.39 = 908\,\text{J/(kg K)}$. בלי הכוס, $1050 \times 6.1/7.39 = 867\,\text{J/(kg K)}$.
      - kind: result
        text: >-
          (א) $c_s = 908\,\text{J/(kg K)}$, אלומיניום בגבולות הדיוק של קריאה עד $0.1\,\text{K}$. (ב) $867\,\text{J/(kg K)}$, נמוך ב-$4.5\%$: כל גוף שהטמפרטורה שלו משתנה שייך למאזן. (ג) דליפה מטה את התוצאה כלפי מטה.

  - id: W-1.1-03
    level: basic
    objectives: [OBJ-1.1-3, OBJ-1.1-4]
    prompt: >-
      שני גושי נחושת של $1.00\,\text{kg}$ כל אחד ($c = 385\,\text{J/(kg K)}$), A ב-$80\,{}^\circ\text{C}$ ו-B ב-$20\,{}^\circ\text{C}$, מוצמדים זה לזה דרך מגע בעל מוליכות תרמית $\kappa = 2.0\,\text{W/K}$, ומלבד זה הם מבודדים.
      (א) מצאו את הטמפרטורה המשותפת הסופית ואת זמן הרלקסציה.
      (ב) מצאו את הטמפרטורה של כל גוש $3.0\,\text{min}$ אחרי תחילת המגע.
      (ג) גוש B מוחלף בגוש נחושת של $10.0\,\text{kg}$ ב-$20\,{}^\circ\text{C}$. חזרו על (א) ועל (ב), והשוו את ה-$\tau$ החדש ל-$C_A/\kappa$.
    answer: >-
      (א) $50.0\,{}^\circ\text{C}$; $\tau = 96\,\text{s}$. (ב) הפער הוא $9.2\,\text{K}$: $T_A = 54.6\,{}^\circ\text{C}$, $T_B = 45.4\,{}^\circ\text{C}$. (ג) $25.5\,{}^\circ\text{C}$; $\tau = 175\,\text{s}$, לעומת $C_A/\kappa = 193\,\text{s}$; אחרי $3.0\,\text{min}$ הפער הוא $21.5\,\text{K}$, $T_A = 45.0\,{}^\circ\text{C}$ ו-$T_B = 23.5\,{}^\circ\text{C}$.
    solution:
      - kind: given
        text: >-
          $C_A = 385\,\text{J/K}$; $C_B = 385\,\text{J/K}$, ואחר כך $3850\,\text{J/K}$; $T_{A,0} = 80\,{}^\circ\text{C}$, $T_{B,0} = 20\,{}^\circ\text{C}$, פער התחלתי של $60\,\text{K}$; $\kappa = 2.0\,\text{W/K}$; $t = 180\,\text{s}$.
      - kind: law
        text: >-
          שימור האנרגיה בזוג המבודד, עם קיבולי חום קבועים ו-$W = 0$: $C_A(T_A - T_{A,0}) + C_B(T_B - T_{B,0}) = 0$ בכל רגע. חוק הקירור של ניוטון עבור המגע גורם לפער לדעוך כמו $\Delta T(t) = \Delta T(0)\,e^{-t/\tau}$.
      - kind: manipulation
        text: >-
          בשיווי משקל שני הגושים ב-$T_\mathrm{eq}$; בכל רגע מוקדם יותר, השימור אומר $C_A(T_A - T_\mathrm{eq}) + C_B(T_B - T_\mathrm{eq}) = 0$, ו-$T_A - T_B = \Delta T$. פתרון שתי המשוואות עבור $T_A$ ו-$T_B$ מחלק את הפער בין הגופים ביחס הפוך לקיבולים שלהם.
      - kind: formula
        text: >-
          $T_\mathrm{eq} = \dfrac{C_AT_{A,0} + C_BT_{B,0}}{C_A + C_B} \qquad \tau = \dfrac{C_AC_B}{\kappa\,(C_A + C_B)} \qquad T_A = T_\mathrm{eq} + \dfrac{C_B}{C_A + C_B}\,\Delta T \qquad T_B = T_\mathrm{eq} - \dfrac{C_A}{C_A + C_B}\,\Delta T$
      - kind: limit
        text: >-
          גושים שווים נותנים את נקודת האמצע, $\tau = C/(2\kappa)$, ומחלקים את הפער שווה בשווה. כאשר $C_B \to \infty$, $T_\mathrm{eq} \to T_{B,0}$, B אינו זז, ו-$\tau \to C_A/\kappa$: רק A צריך להשתנות. הגוש הכבד פי עשרה של (ג) כבר קרוב לגבול הזה.
      - kind: units
        text: >-
          $\tau$: $(\text{J/K})^2/\big((\text{W/K})(\text{J/K})\big) = \text{J/W} = \text{s}$; השברים שמכפילים את $\Delta T$ הם מספרים טהורים.
      - kind: substitution
        text: >-
          (א) $T_\mathrm{eq} = 50.0\,{}^\circ\text{C}$; $\tau = 385/(2 \times 2.0) = 96.25\,\text{s}$. (ב) $\Delta T = 60\,e^{-180/96.25} = 60 \times 0.154 = 9.25\,\text{K}$; $T_A = 50 + 4.62 = 54.6\,{}^\circ\text{C}$, $T_B = 50 - 4.62 = 45.4\,{}^\circ\text{C}$. (ג) $T_\mathrm{eq} = (385 \times 80 + 3850 \times 20)/4235 = 107\,800/4235 = 25.45\,{}^\circ\text{C}$; $\tau = 385 \times 3850/(2.0 \times 4235) = 175.0\,\text{s}$; $C_A/\kappa = 192.5\,\text{s}$. $\Delta T = 60\,e^{-180/175} = 21.45\,\text{K}$; $T_A = 25.45 + (10/11)(21.45) = 44.96\,{}^\circ\text{C}$, $T_B = 25.45 - (1/11)(21.45) = 23.50\,{}^\circ\text{C}$.
      - kind: result
        text: >-
          (א) $50.0\,{}^\circ\text{C}$, $\tau = 96\,\text{s}$. (ב) $54.6$ ו-$45.4\,{}^\circ\text{C}$. (ג) $25.5\,{}^\circ\text{C}$, $\tau = 175\,\text{s}$, בטווח של $10\%$ מהערך של מאגר, $193\,\text{s}$; אחרי שלוש דקות A ב-$45.0\,{}^\circ\text{C}$, ו-B עלה רק ל-$23.5\,{}^\circ\text{C}$. הגוש הגדול זז מעט ומביא את הזוג לנקודה קרובה לנקודת ההתחלה שלו עצמו, והוא הופך את ההתקרבות לאיטית יותר, לא למהירה יותר.

  - id: W-1.1-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-2, OBJ-1.1-1]
    prompt: >-
      שפטו כל טענה במשפט או שניים.
      (א) "ברגע ששני גופים במגע מגיעים לאותה טמפרטורה, אנרגיה מפסיקה לעבור ביניהם."
      (ב) "בשיווי משקל, שני גופים במגע מחזיקים אנרגיות שוות."
      (ג) "במודל הדילוגים, הזוג של איור 1.1א ($100$ ו-$300$ מתנדים, $Q = 700$) נמצא בשיווי משקל כשקוונט עשוי לעבור לכיוון אחד באותה הסתברות כמו לכיוון השני, וזה קורה ב-$q_A = q_B = 350$."
      (ד) "שני גופים של $200$ מתנדים כל אחד, שחולקים $Q = 1000$ קוונטים, נמצאים בשיווי משקל, ולכן ברוב הצעדים שום דבר אינו עובר ביניהם, ו-$q_A$ נשאר $500$."
      (ה) "קיר מפריד בין חדר שמחמם שומר על $20\,{}^\circ\text{C}$ לבין החוץ, שנמצא ב-$0\,{}^\circ\text{C}$. הטמפרטורות של הקיר לא השתנו כל היום, ולכן הקיר נמצא בשיווי משקל תרמי."
      (ו) "אם קוונטים ממשיכים לדלג בשיווי משקל, הטמפרטורות ממשיכות להשתנות, ולכן שני גופים לעולם אינם באמת בשיווי משקל."
    answer: >-
      (א) שגוי: הזרימה נטו נפסקת; אנרגיה עוברת בשני הכיוונים בקצבים שווים. (ב) שגוי: טמפרטורות שוות, והאנרגיות ביחס הקיבולים ($175$ ו-$525$ קוונטים בזוג של איור 1.1א). (ג) שגוי: הקצבים מתאזנים ב-$q_A/n_A = q_B/n_B$, $q_A = 175$; ב-$q_A = 350$ המעברים מ-A רבים פי שלושה מהמעברים מ-B. (ד) שגוי: מחצית מכל הצעדים מעבירים קוונט מצד לצד, רבע לכל כיוון, ו-$q_A$ נודד סביב $500$ בשיעור של $\pm16$. (ה) שגוי: זהו מצב עמיד, שבו חום זורם דרך הקיר כל היום; לא שיווי משקל. (ו) שגוי: לטמפרטורות יש פלוקטואציות, בשיעור יחסי של $N^{-1/2}$, כ-$10^{-12}$ בגופים שאפשר להחזיק ביד; שיווי משקל הוא טענה על הגדלים המאקרוסקופיים, והם יציבים.
    solution:
      - kind: reasoning
        text: >-
          (א) שום דבר אינו נכבה בשיווי משקל. אנרגיה ממשיכה לחצות את המגע בשני הכיוונים; מה שנעלם הוא ההפרש בין שתי הזרימות. (ב) שיווי משקל משווה טמפרטורות, לא אנרגיות: כל גוף מחזיק $U = CT$, ולכן הגוף שהקיבול שלו גדול יותר מחזיק יותר. באיור 1.1א הזוג מתייצב ב-$T = 1.75$, עם $175$ קוונטים ב-A ו-$525$ ב-B.
      - kind: reasoning
        text: >-
          (ג) קצבי המעבר הם $P(A \to B) = (q_A/Q)\,n_B/(n_A + n_B)$ ו-$P(B \to A) = (q_B/Q)\,n_A/(n_A + n_B)$, והם שווים כאשר $q_A/n_A = q_B/n_B$: אותו מספר קוונטים למתנד, $q_A = 175$. ב-$q_A = 350$, $T_A = 3.5$ ו-$T_B = 1.17$; אז $P(A \to B) = 0.5 \times 0.75 = 0.375$ לעומת $P(B \to A) = 0.5 \times 0.25 = 0.125$, ו-A עדיין מתקרר. אנרגיה שווה אינה טמפרטורה שווה.
      - kind: reasoning
        text: >-
          (ד) ב-$q_A = 500$, צעד לוקח קוונט מ-A בהסתברות $1/2$ ומניח אותו ב-B בהסתברות $1/2$: $P(A \to B) = 1/4$, ובאותו אופן $P(B \to A) = 1/4$. מחצית מהצעדים מעבירים קוונט מצד לצד. $q_A$ בינומי סביב $500$ עם $\sigma = \sqrt{1000 \times \tfrac12 \times \tfrac12} = 15.8$ קוונטים: הוא לעולם אינו נשאר במקומו. (ה) הטמפרטורות של הקיר יציבות רק משום שהמחמם מחזיר, בכל שנייה, את החום שזורם דרך הקיר החוצה. כבו את המחמם, והטמפרטורות של הקיר מתחילות להשתנות מיד. שיווי משקל פירושו שאין זרימה נטו ושום דבר אינו משתנה בלי עזרה מבחוץ; מצב עמיד עם זרימה קבועה אינו כזה.
      - kind: reasoning
        text: >-
          (ו) שיווי משקל מוגדר באמצעות גדלים מאקרוסקופיים, ובגוף מאקרוסקופי הפלוקטואציה של הטמפרטורה זניחה: הפלוקטואציה היחסית קטנה כמו $N^{-1/2}$, לכ-$10^{-12}$ עבור $10^{23}$ מתנדים. ב-$400$ המתנדים של איור 1.1א היא $6.5\%$, נראית לעין, והטמפרטורה של גוף קטן כל כך היא עצמה מטושטשת מעט; זו מגבלה של גודל המודל, לא של הרעיון.
      - kind: result
        text: >-
          כל שש הטענות שגויות. שיווי משקל הוא איזון בין שתי זרימות פעילות (א, ג, ד), שקובע טמפרטורות שוות, לא אנרגיות שוות (ב); טמפרטורה יציבה שנשמרת בזכות זרימה קבועה היא מצב עמיד, לא שיווי משקל (ה); והתנועה המיקרוסקופית משאירה את הטמפרטורה המאקרוסקופית יציבה עד כדי חלק אחד מ-$10^{12}$ (ו).

  - id: W-1.1-05
    level: mid
    objectives: [OBJ-1.1-3]
    prompt: >-
      שלושה גופים בעלי קיבולי חום קבועים: A, $200\,\text{J/K}$ ב-$80\,{}^\circ\text{C}$; B, $600\,\text{J/K}$ ב-$20\,{}^\circ\text{C}$; C, $200\,\text{J/K}$ ב-$50\,{}^\circ\text{C}$. המגעים אינם עושים עבודה, ושום חום אינו דולף לסביבה.
      (א) A ו-B מובאים למגע ומשאירים אותם להגיע לשיווי משקל; אחר כך מצטרף C. מצאו את טמפרטורת הביניים ואת הטמפרטורה הסופית.
      (ב) הפעם B ו-C ראשונים, ו-A מצטרף אחריהם. מצאו את הטמפרטורות, ואת החום ש-C קולט בכל שלב.
      (ג) שלושתם מובאים למגע בבת אחת. מצאו את הטמפרטורה הסופית, והוכיחו שסדר המגעים לעולם אינו משנה.
      (ד) הוכיחו שהטמפרטורה הסופית נמצאת תמיד בין הנמוכה לגבוהה מבין טמפרטורות ההתחלה.
    answer: >-
      (א) $35.0\,{}^\circ\text{C}$, ואחר כך $38.0\,{}^\circ\text{C}$. (ב) $27.5\,{}^\circ\text{C}$, ואחר כך $38.0\,{}^\circ\text{C}$; C קולט $-4500\,\text{J}$, ואחר כך $+2100\,\text{J}$, $-2400\,\text{J}$ בסך הכול. (ג) $38.0\,{}^\circ\text{C}$: כל שלב משמר את $\sum_i C_iT_i$, ולכן הסוף הוא $\sum_i C_iT_{i,0}/\sum_i C_i$ בכל סדר. (ד) זהו ממוצע עם משקלים חיוביים $C_i/\sum_j C_j$ שסכומם אחד.
    solution:
      - kind: given
        text: >-
          $C_A = 200$, $C_B = 600$, $C_C = 200\,\text{J/K}$; $T_{A,0} = 80$, $T_{B,0} = 20$, $T_{C,0} = 50\,{}^\circ\text{C}$.
      - kind: law
        text: >-
          כש-$W = 0$ ושום דבר אינו דולף, האנרגיה הפנימית של כל גוף משתנה רק בחום שהוא קולט, $\Delta U_i = Q_i = C_i\,\Delta T_i$, וסכום החום שמוחלף בתוך כל קבוצה של גופים במגע הוא אפס.
      - kind: manipulation
        text: >-
          (ג) בשלב שבו חלק מהגופים מגיעים לשיווי משקל, $\sum C_i\,\Delta T_i = 0$ על פני הגופים האלה, והאחרים אינם משתנים: לכן $E = \sum_i C_iT_i$ על פני שלושתם זהה אחרי כל שלב. בסוף כולם חולקים טמפרטורה אחת $T_f$, ו-$E = T_f\sum_i C_i$. (ד) כתבו $T_f = \sum_i w_iT_{i,0}$ עם $w_i = C_i/\sum_j C_j$: כל $w_i > 0$ ו-$\sum_i w_i = 1$, ולכן כש-$T_<$ היא טמפרטורת ההתחלה הנמוכה ביותר, $T_f - T_< = \sum_i w_i(T_{i,0} - T_<) \ge 0$, ובאותו אופן $T_> - T_f \ge 0$ עבור הגבוהה ביותר, $T_>$.
      - kind: formula
        text: >-
          $T_f = \dfrac{\sum_i C_iT_{i,0}}{\sum_i C_i} \qquad Q_i = C_i\,(T_f - T_{i,0})$
      - kind: limit
        text: >-
          אם אחד הקיבולים גדל בלי גבול, הגוף הזה הוא מאגר, ו-$T_f$ שואפת לטמפרטורה שלו. קיבולים שווים נותנים את הממוצע הפשוט. גוף שמתחיל ב-$T_f$ (כמעט כמו C) אינו מחליף חום נטו, אף שב-(ב) הוא קודם מוסר חום ואחר כך לוקח חלק ממנו בחזרה: $Q_i$ תלוי רק בנקודות הקצה, כי האנרגיה של כל גוף תלויה רק בטמפרטורה שלו עצמו.
      - kind: units
        text: >-
          $\sum C_iT_i/\sum C_i$: $(\text{J/K})\,{}^\circ\text{C}/(\text{J/K}) = {}^\circ\text{C}$. סכום המשקלים הוא אחד, ולכן ההיסט בין צלזיוס לקלווין מתבטל, ואפשר להשתמש בצלזיוס לאורך כל הדרך.
      - kind: substitution
        text: >-
          (א) $(200 \times 80 + 600 \times 20)/800 = 28\,000/800 = 35.0\,{}^\circ\text{C}$; עם C, $(800 \times 35 + 200 \times 50)/1000 = 38.0\,{}^\circ\text{C}$. (ב) $(600 \times 20 + 200 \times 50)/800 = 27.5\,{}^\circ\text{C}$, ולכן C קולט $200 \times (27.5 - 50) = -4500\,\text{J}$; אחר כך $(800 \times 27.5 + 200 \times 80)/1000 = 38.0\,{}^\circ\text{C}$, ו-C קולט $200 \times 10.5 = +2100\,\text{J}$. (ג) $38\,000/1000 = 38.0\,{}^\circ\text{C}$. בכל שלושת הסדרים A קולט $-8400\,\text{J}$, B $+10\,800\,\text{J}$ ו-C $-2400\,\text{J}$, וסכומם אפס.
      - kind: result
        text: >-
          (א) $35.0$, ואחר כך $38.0\,{}^\circ\text{C}$. (ב) $27.5$, ואחר כך $38.0\,{}^\circ\text{C}$, כש-C מוסר $4500\,\text{J}$ ולוקח בחזרה $2100\,\text{J}$. (ג) $38.0\,{}^\circ\text{C}$ בכל סדר: שימור האנרגיה קובע את הסוף, והמסלול משנה רק את הדרך שעוברת כל טמפרטורה. (ד) ממוצע במשקלים חיוביים אינו יכול לצאת מתחום הערכים שהוא ממצע.

  - id: W-1.1-06
    level: mid
    objectives: [OBJ-1.1-3, OBJ-1.1-4]
    prompt: >-
      שני גופים, המבודדים יחד, נוגעים זה בזה דרך מגע קבוע. לגוף A יש $C_A = 300\,\text{J/K}$; קיבול החום של B אינו ידוע. הקריאות הן: ב-$t = 0$, $T_A = 70.0\,{}^\circ\text{C}$ ו-$T_B = 10.0\,{}^\circ\text{C}$; ב-$t = 120\,\text{s}$, $52.0$ ו-$16.0\,{}^\circ\text{C}$; ב-$t = 240\,\text{s}$, $41.2$ ו-$19.6\,{}^\circ\text{C}$.
      (א) מתוך שתי הקריאות הראשונות, מצאו את $C_B$ ואת טמפרטורת שיווי המשקל.
      (ב) מצאו את זמן הרלקסציה ואת המוליכות התרמית של המגע.
      (ג) השתמשו בקריאה השלישית כדי לבדוק את שימור האנרגיה ואת החוק המעריכי, כל אחד בנפרד.
      (ד) מתי הפער יורד ל-$1.0\,\text{K}$, ומהי אז הקריאה של A?
    answer: >-
      (א) $C_B = 900\,\text{J/K}$; $T_\mathrm{eq} = 25.0\,{}^\circ\text{C}$. (ב) $\tau = 235\,\text{s}$; $\kappa = 0.958\,\text{W/K}$. (ג) $(300 \times 41.2 + 900 \times 19.6)/1200 = 25.0\,{}^\circ\text{C}$, ללא שינוי; הפער $21.6\,\text{K} = 60 \times 0.6^2\,\text{K}$, אותו גורם בכל $120\,\text{s}$. (ד) $t = \tau\ln 60 = 962\,\text{s}$, כ-$16\,\text{min}$; $T_A = 25.75\,{}^\circ\text{C}$.
    solution:
      - kind: given
        text: >-
          $C_A = 300\,\text{J/K}$. פערים: $60.0$, $36.0$ ו-$21.6\,\text{K}$ ב-$0$, $120$ ו-$240\,\text{s}$. השינויים ב-$120\,\text{s}$ הראשונות: $\Delta T_A = -18.0\,\text{K}$, $\Delta T_B = +6.0\,\text{K}$.
      - kind: law
        text: >-
          שימור האנרגיה בזוג המבודד, $C_A\,\Delta T_A + C_B\,\Delta T_B = 0$; וחוק הקירור של ניוטון, שגורם לפער לקטון באותו גורם בכל פרק זמן באותו אורך, $\Delta T(t) = \Delta T(0)\,e^{-t/\tau}$, עם $\tau = C_AC_B/\big(\kappa(C_A + C_B)\big)$.
      - kind: formula
        text: >-
          $C_B = -C_A\,\dfrac{\Delta T_A}{\Delta T_B} \qquad \tau = \dfrac{t_1}{\ln\big(\Delta T(0)/\Delta T(t_1)\big)} \qquad \kappa = \dfrac{C_AC_B}{\tau\,(C_A + C_B)} \qquad t_\ast = \tau\ln\dfrac{\Delta T(0)}{1\,\text{K}}$
      - kind: limit
        text: >-
          אילו הזוג היה מאבד חום לחדר, $C_AT_A + C_BT_B$ היה יורד בהדרגה, ו-$T_\mathrm{eq}$ המוסק היה יורד מקריאה לקריאה; הקריאה השלישית משאירה אותו ב-$25.0\,{}^\circ\text{C}$, ולכן הנחת הבידוד עומדת במבחן. אילו שני הפערים היו שווים, הלוגריתם היה מתאפס ו-$\tau$ היה אינסופי: אין מגע. כאשר $\kappa \to \infty$, $\tau \to 0$.
      - kind: units
        text: >-
          $C_B$: $(\text{J/K})\cdot\text{K}/\text{K} = \text{J/K}$. $\tau$: שניות חלקי מספר טהור. $\kappa$: $(\text{J/K})^2/\big(\text{s}\cdot\text{J/K}\big) = \text{W/K}$.
      - kind: substitution
        text: >-
          (א) $C_B = 300 \times 18.0/6.0 = 900\,\text{J/K}$; $T_\mathrm{eq} = (300 \times 70 + 900 \times 10)/1200 = 30\,000/1200 = 25.0\,{}^\circ\text{C}$. (ב) $\tau = 120/\ln(60/36) = 120/0.511 = 234.9\,\text{s}$; $\kappa = 270\,000/(234.9 \times 1200) = 0.958\,\text{W/K}$. (ג) $12\,360 + 17\,640 = 30\,000$, ולכן שוב $25.0\,{}^\circ\text{C}$; $36/60 = 0.600$ ו-$21.6/36 = 0.600$. (ד) $234.9 \times \ln 60 = 234.9 \times 4.094 = 962\,\text{s}$; A נמצא אז $C_B/(C_A + C_B) = 3/4$ מהפער מעל $T_\mathrm{eq}$: $25.75\,{}^\circ\text{C}$, ו-B ב-$24.75\,{}^\circ\text{C}$.
      - kind: result
        text: >-
          (א) $C_B = 900\,\text{J/K}$, $T_\mathrm{eq} = 25.0\,{}^\circ\text{C}$. (ב) $\tau = 235\,\text{s}$, $\kappa = 0.96\,\text{W/K}$. (ג) שני החוקים עומדים במבחן: הטמפרטורה המשוקללת נשארת $25.0\,{}^\circ\text{C}$, והפער מוכפל ב-$0.600$ בכל $120\,\text{s}$. (ד) אחרי כ-$16\,\text{min}$, כש-A ב-$25.75\,{}^\circ\text{C}$. היכן הזוג מסיים נבע משימור האנרגיה לבדו; באיזו מהירות, מחוק הקצב.

  - id: W-1.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-5, OBJ-1.1-4]
    prompt: >-
      סטודנט מריץ פעם אחת את מודל הדילוגים של איור 1.1א ($n_A = 100$, $n_B = 300$, $T_A = 4$ ו-$T_B = 1$ ביחידות של $\varepsilon/k_B$, ולכן $Q = 700$ ו-$\tau = 699.5$ צעדים) וטוען שלוש טענות.
      (א) "אחרי $700$ צעדים הפער $T_A - T_B$ שלי הוא $1.27$, לעומת $1.10$ החזוי: החוק המעריכי נכשל במודל הזה."
      (ב) "התאמתי קו ישר ל-$\ln|T_A - T_B|$ על פני כל ההרצה שלי, $4200$ צעדים, והשיפוע שלו נותן $\tau \approx 1200$ צעדים, לא $700$: זמן הרלקסציה של המודל אינו $Q$."
      (ג) "מכיוון שהממוצע על פני הרצות עוקב אחרי $e^{-t/\tau}$ בדיוק, הסימולציה מוכיחה שכוס תה מתקררת לפי חוק ניוטון."
      שפטו כל טענה, ואמרו איזו מדידה תכריע את (א) ואת (ב).
    answer: >-
      (א) אין כאן כישלון: החוק עוסק בממוצע, והרצה בודדת מתפזרת סביבו ב-$0.15$; $1.27$ גבוה ב-$1.1$ סטיות תקן, כפי שקורה בערך להרצה אחת משבע. הממוצע של $64$ הרצות, הידוע עד כדי $\pm0.02$, מכריע. (ב) ההתאמה מוטה בגלל הרצפה: אחרי כשלושה זמני רלקסציה הפער מפסיק לרדת ורועד ברמה של $0.15$, וזה משטיח קו שמותאם לכל ההרצה (התאמות על פני ההרצה כולה נותנות בממוצע כ-$1180$ צעדים). התאמה רק ל-$2\tau$ הראשונים נותנת $703 \pm 7$ על פני $384$ זרעים. (ג) לא: היא מראה שמנגנון אחד מייצר את החוק; אם תה מציית לו, זה עניין לניסוי.
    solution:
      - kind: reasoning
        text: >-
          (א) המשפט שמאחורי הניבוי, $\langle T_A - T_B\rangle_n = (T_A(0) - T_B(0))(1 - 1/Q)^n$, הוא טענה על הממוצע על פני הרצות. הרצה בודדת נושאת את הרעד הבינומי שבשיעור, $0.15$ בזוג הזה (סטיית התקן המדויקת שלו אחרי $700$ צעדים היא $0.152$). לכן $1.27$ נמצא $(1.27 - 1.10)/0.15 = 1.1$ סטיות תקן מעל הממוצע; על פני $384$ זרעים, $15\%$ מההרצות הגיעו ל-$1.27$ או יותר. כדי לבדוק את החוק ממצעים על זרעים רבים: $64$ הרצות נותנות את הממוצע עד כדי $0.15/8 = 0.019$, והממוצעים שלהן יצאו בין $1.093$ ל-$1.150$, לעומת $1.103$.
      - kind: reasoning
        text: >-
          (ב) קו ישר בגרף הלוגריתמי הוא המעריכית רק כל עוד הפער הממוצע גדול מהרעד. הממוצע יורד ל-$0.15$ בערך ב-$t = \tau\ln(3/0.15) = 3\tau$; משם והלאה $|T_A - T_B|$ מרחף סביב $0.15$ ונוגע באפס כ-$70$ פעמים בכל הרצה, נקודות שהלוגריתם אפילו אינו מוגדר בהן. קו שמותאם לכל ההרצה נגרר לשטוח בגלל הרצפה הזו. במדידה בקוד של ThermoLab על פני שש מנות של $64$ זרעים, התאמות על פני ההרצה כולה נותנות בממוצע $1140$ עד $1200$ צעדים, בעוד שהתאמות ל-$2\tau$ הראשונים נותנות בממוצע $703 \pm 7$, מתיישב עם $699.5$; התאמה בודדת כזו מתפזרת בכ-$135$ צעדים. התרופה היא להתאים רק היכן שהאות גדול מהרעש, או להתאים את הפער הממוצע על פני זרעים רבים.
      - kind: reasoning
        text: >-
          (ג) הממוצע המדויק הוא משפט על מודל הדילוגים, שהסימולציה בודקת. הוא מראה שהחלפה אקראית המשוקללת לפי האכלוס מספיקה כדי לייצר את חוק ניוטון, סימן לכך שהחוק אינו תלוי בפרטים המיקרוסקופיים. הוא אינו יכול להראות שתה, שמאבד חום בהולכה, בהסעה, באידוי ובקרינה, מציית לחוק, וגם לא לתת את ה-$\tau$ שלו בשניות: צעד אינו שנייה. זו מדידה של מדחום ושעון.
      - kind: result
        text: >-
          (א) הרצה אחת שנמצאת $1.1$ סטיות תקן מהממוצע אינה ראיה נגד חוק על הממוצע; ממצעים על $64$ זרעים. (ב) ההתאמה לכל ההרצה מודדת את רצפת הרעש לא פחות מאשר את הדעיכה; מתאימים לשני זמני הרלקסציה הראשונים, או לפער הממוצע על פני זרעים, ו-$\tau = Q$ חוזר. (ג) מודל יכול להראות שמנגנון מספיק; רק ניסוי אומר מה גוף ממשי עושה.

  - id: W-1.1-08
    level: bagrut
    objectives: [OBJ-1.1-4, OBJ-1.1-1]
    prompt: >-
      מדחום מחליף חום עם אמבט מים גדול ומעורבב לפי חוק ניוטון, עם זמן רלקסציה $\tau = C/\kappa = 8.0\,\text{s}$ (קיבול החום שלו עצמו חלקי המוליכות התרמית של המגע שלו עם המים). האמבט גדול כל כך שהמדחום אינו משנה את הטמפרטורה שלו. ב-$t = 0$ המדחום והאמבט נמצאים שניהם ב-$T_0 = 20.0\,{}^\circ\text{C}$, ומחמם מתחיל לחמם את האמבט בקצב קבוע של $r = 3.0\,\text{K/min}$.
      (א) כתבו את המשוואה עבור הטמפרטורה של המדחום, $T(t)$, ופתרו אותה.
      (ב) מה מראה המדחום ב-$t = 60\,\text{s}$, ומהי אז הטמפרטורה של האמבט?
      (ג) הראו שאחרי כמה $\tau$ המדחום מראה את הטמפרטורה שהייתה לאמבט זמן $\tau$ קודם לכן. האם הוא מראה אי פעם את הטמפרטורה של האמבט בזמן החימום? האם הוא מראה אי פעם יותר ממנה?
      (ד) ב-$t = 60\,\text{s}$ המחמם נכבה, והאמבט נשאר בטמפרטורה שהגיע אליה. כמה זמן עובר עד שהקריאה נמצאת בטווח של $0.01\,\text{K}$ ממנה?
      (ה) בעזרת החוק האפס, הסבירו מדוע רק על הקריאה הסופית של (ד) אפשר לסמוך כעל הטמפרטורה של האמבט.
    answer: >-
      (א) $\tau\,\mathrm{d}T/\mathrm{d}t = T_\mathrm{b}(t) - T$ עם $T_\mathrm{b} = T_0 + rt$, ולכן $T(t) = T_0 + rt - r\tau\,(1 - e^{-t/\tau})$. (ב) $22.60\,{}^\circ\text{C}$ לעומת $23.00\,{}^\circ\text{C}$. (ג) הפיגור שואף ל-$r\tau = 0.40\,\text{K}$, ולכן $T \to T_0 + r(t - \tau) = T_\mathrm{b}(t - \tau)$; המדחום תמיד מתחת לאמבט כל עוד האמבט מתחמם, ולעולם לא מעליו. (ד) $\tau\ln(0.400/0.01) = 29.5\,\text{s}$. (ה) החוק האפס משווה את הקריאות של גופים בשיווי משקל; בזמן החימום המדחום לעולם אינו בשיווי משקל עם האמבט.
    solution:
      - kind: given
        text: >-
          $\tau = 8.0\,\text{s}$; $T_0 = 20.0\,{}^\circ\text{C}$; $r = 3.0\,\text{K/min} = 0.050\,\text{K/s}$; המחמם נכבה ב-$t_1 = 60\,\text{s}$; סף של $0.01\,\text{K}$.
      - kind: law
        text: >-
          חוק הקירור של ניוטון עבור כדורית המדחום, $\dbar Q = \kappa\,(T_\mathrm{b} - T)\,\mathrm{d}t$, עם $\dbar Q = C\,\mathrm{d}T$, כי לא נעשית עליה עבודה: $\tau\,\mathrm{d}T/\mathrm{d}t = T_\mathrm{b}(t) - T$. האמבט הוא מאגר: הטמפרטורה שלו נקבעת על ידי המחמם, לא על ידי המדחום.
      - kind: manipulation
        text: >-
          נסמן את הפיגור $L = T_\mathrm{b} - T$. אז $\mathrm{d}L/\mathrm{d}t = r - L/\tau$, עם $L(0) = 0$, והפתרון הוא $L = r\tau\,(1 - e^{-t/\tau})$: הפיגור גדל מאפס ל-$r\tau$ במשך כמה $\tau$ ונשאר שם. אז $T = T_\mathrm{b} - L \to T_0 + rt - r\tau = T_\mathrm{b}(t - \tau)$. אחרי $t_1$, $r = 0$ ו-$\mathrm{d}L/\mathrm{d}t = -L/\tau$: הפיגור דועך כמו $L(t_1)\,e^{-(t - t_1)/\tau}$.
      - kind: formula
        text: >-
          $T(t) = T_0 + rt - r\tau\left(1 - e^{-t/\tau}\right) \qquad L(t) = r\tau\left(1 - e^{-t/\tau}\right) \qquad s = \tau\ln\dfrac{L(t_1)}{0.01\,\text{K}}$
      - kind: limit
        text: >-
          כאשר $\tau \to 0$ (מדחום חסר קיבול חום, או מגע מושלם) הפיגור נעלם ו-$T = T_\mathrm{b}$ בכל רגע. כאשר $r \to 0$ גם אין פיגור: האמבט עומד במקום והמדחום משיג אותו. עבור $t \ll \tau$, $L \approx rt$: המדחום עוד לא התחיל לזוז. $L$ חיובי לכל $t > 0$, והוא רק קטן לעבר אפס אחרי שהמחמם נכבה, בלי לשנות סימן לעולם: לחוק מסדר ראשון אין חריגה.
      - kind: units
        text: >-
          $r\tau$: $(\text{K/s})\cdot\text{s} = \text{K}$, הפרש טמפרטורות, כפי שפיגור צריך להיות; $t/\tau$ הוא מספר טהור.
      - kind: substitution
        text: >-
          (ב) $T_\mathrm{b}(60) = 20.0 + 0.050 \times 60 = 23.00\,{}^\circ\text{C}$; $L = 0.40 \times (1 - e^{-7.5}) = 0.3998\,\text{K}$; $T = 22.60\,{}^\circ\text{C}$. (ג) $r\tau = 0.050 \times 8.0 = 0.40\,\text{K}$. (ד) $s = 8.0 \times \ln(0.3998/0.01) = 8.0 \times 3.69 = 29.5\,\text{s}$.
      - kind: reasoning
        text: >-
          (ה) מדחום מדווח על הטמפרטורה של עצמו. החוק האפס מאפשר למספר הזה לייצג גוף אחר רק כשהשניים בשיווי משקל תרמי, ושום דבר אינו משתנה במגע ביניהם. בזמן שהאמבט מתחמם, חום זורם אל הכדורית כל הזמן, והשניים לעולם אינם בשיווי משקל; הקריאה היא של גוף שמפגר ב-$0.40\,\text{K}$. ברגע שהאמבט עומד במקום במשך כמה $\tau$, הזרימה דועכת והקריאה נעשית הטמפרטורה של האמבט.
      - kind: result
        text: >-
          (א) $T(t) = T_0 + rt - r\tau(1 - e^{-t/\tau})$. (ב) $22.60\,{}^\circ\text{C}$, בזמן שהאמבט ב-$23.00\,{}^\circ\text{C}$. (ג) פיגור קבוע של $r\tau = 0.40\,\text{K}$: המדחום מראה את האמבט כפי שהיה $8\,\text{s}$ קודם לכן, תמיד מתחתיו בזמן שהוא מתחמם ולעולם לא מעליו. (ד) $29.5\,\text{s}$, כ-$3.7\tau$. (ה) רק קריאה בשיווי משקל נהנית מהערובה של החוק האפס; קריאה שנלקחת בזמן שינוי היא קריאה של המדחום.

  - id: W-1.1-09
    level: bagrut
    objectives: [OBJ-1.1-3, OBJ-1.1-4, OBJ-1.1-5]
    prompt: >-
      חישובית. השתמשו במחברת המעבדה של השיעור ובמודול thermolab.equilibrium של ThermoLab, או באותו כלל דילוג בכל שפה עם מחולל מספרים אקראיים בעל זרע. קחו $n_A = 50$, $n_B = 150$, $T_A = 6$ ו-$T_B = 2$ ביחידות של $\varepsilon/k_B$ (במחברת, ⁦from_temperatures(50, 150, 6.0, 2.0, K_B)⁩, שהופך את הקוונט ל-$k_B$ כפול קלווין אחד).
      (א) הריצו $64$ סימולציות בלתי תלויות של $10Q$ צעדים כל אחת, ובדקו שהטמפרטורה הסופית הממוצעת של A מתיישבת עם equilibrium_temperature, תוך ציון אי-ודאות להערכה שלכם.
      (ב) בנקודות הביקורת $0.5\tau$, $\tau$, $2\tau$ ו-$4\tau$ (קחו $300$, $600$, $1200$ ו-$2400$ צעדים), מדדו את הפער הממוצע $T_A - T_B$ על פני הזרעים והשוו אותו ל-predicted_relaxation. האם ההתאמה נשמרת בכל נקודת ביקורת, או רק סמוך לשיווי משקל?
      (ג) חזרו על התרגיל בגודל פי עשרה ($n_A = 500$, $n_B = 1500$, אותן טמפרטורות), ומדדו בשני הגדלים את הפיזור היחסי של הפער בין הרצה להרצה, זמן רלקסציה אחד מההתחלה ($t = Q$ צעדים). בדקו שהוא קטן ככל שהמערכת גדלה, ובכמה.
      (ד) ציינו דבר אחד שהתוצאות הנומריות שלכם אינן מוכיחות על מגע תרמי ממשי.
    answer: >-
      (א) $T_\mathrm{eq} = 3.000$; מנה של $64$ זרעים נותנת אותה עד כדי $\pm0.027$ (ארבע מנות: $3.040$, $2.966$, $3.037$, $3.013$), כשהרצות בודדות מתפזרות ב-$0.21$. (ב) החיזוי: $2.425$, $1.470$, $0.540$, $0.073$; כל ממוצע של $64$ זרעים מתיישב איתו בגבולות השגיאה שלו, $0.03$ עד $0.04$, בכל נקודת ביקורת (הממוצעים על $256$ זרעים: $2.413$, $1.458$, $0.549$, $0.076$, כל אחד $\pm0.018$). החוק מדויק עבור הממוצע בכל צעד; מה שנעשה גרוע יותר סמוך לשיווי משקל הוא הדיוק היחסי, $50\%$ ב-$4\tau$. (ג) $0.19$ ב-$N = 200$ ו-$0.060$ ב-$N = 2000$: יחס של $3.2 \approx \sqrt{10}$. (ד) למשל, שכל מגע ממשי מציית לחוק ניוטון, או את הערך של $\kappa$ ממשי; צעד אינו שנייה.
    solution:
      - kind: given
        text: >-
          $q_A = 300$, $q_B = 300$, $Q = 600$; $p = n_A/(n_A + n_B) = 1/4$; $\tau = -1/\ln(1 - 1/600) = 599.5$ צעדים. הזוג הגדול: $Q = 6000$, $\tau = 5999.5$ צעדים.
      - kind: law
        text: >-
          שימור האנרגיה עם $C = nk_B$ נותן את $T_\mathrm{eq}$. השינוי הממוצע של $q_A$ בצעד ליניארי בדיוק ב-$q_A$, ולכן $\langle T_A - T_B\rangle_n = (T_A(0) - T_B(0))(1 - 1/Q)^n$ בדיוק. בשיווי משקל $q_A$ בינומי, $\sigma_{q_A} = \sqrt{Qp(1 - p)}$; אי-הוודאות בממוצע של $M$ הרצות בלתי תלויות היא סטיית התקן שלהן חלקי $\sqrt M$.
      - kind: formula
        text: >-
          $T_\mathrm{eq} = \dfrac{n_AT_A + n_BT_B}{n_A + n_B} \qquad \sigma_{T_A} = \dfrac{\sqrt{Qp(1 - p)}}{n_A} \qquad \dfrac{\sigma_{\Delta T}}{\langle \Delta T \rangle} \propto N^{-1/2}$
      - kind: reasoning
        text: >-
          (ב) ההתאמה בתוחלת מתקיימת בכל צעד, כי החוק לממוצע הוא משפט על המודל הזה. מה שמשתנה הוא כמה טוב $64$ הרצות יכולות להראות זאת: הפיזור של הרצות בודדות גדל מאפס לערך שיווי המשקל, $0.28$, בזמן שהפער הממוצע יורד, ולכן השגיאה היחסית של הממוצע הנמדד גדלה מכ-$1\%$ ב-$0.5\tau$ לכ-$50\%$ ב-$4\tau$. סמוך לשיווי משקל ההשוואה היא החלשה ביותר, לא החזקה ביותר. (ג) גם השונות של $q_A$ מקיימת נוסחת נסיגה ליניארית, שנותנת את הפיזורים היחסיים המדויקים ב-$t = Q$: $0.190$ ו-$0.0600$.
      - kind: limit
        text: >-
          ב-$t = 0$ כל ההרצות מתחילות באותו מצב והפיזור אפס; כאשר $t \to \infty$ הפער הממוצע שואף לאפס והפיזור היחסי מתבדר, בעוד הפיזור המוחלט מתייצב על הערך הבינומי. כאשר $N \to \infty$ בטמפרטורות קבועות, הפיזור היחסי שואף לאפס כמו $N^{-1/2}$, והרצה בודדת נעשית הממוצע.
      - kind: units
        text: >-
          טמפרטורות ופערים ביחידות של $\varepsilon/k_B$; צעדים וקוונטים הם מניינים; פיזורים יחסיים והיחס ביניהם הם מספרים טהורים.
      - kind: substitution
        text: >-
          (א) $T_\mathrm{eq} = (300 + 300)/200 = 3.000$; $\sigma_{T_A} = \sqrt{600 \times 0.1875}/50 = 10.6/50 = 0.212$, ולכן $64$ הרצות נותנות $\pm0.027$; נמדד $3.040$, $2.966$, $3.037$, $3.013$, ו-$3.014 \pm 0.013$ על פני $256$. (ב) $4 \times (1 - 1/600)^n$ עבור $n = 300, 600, 1200, 2400$: $2.425$, $1.470$, $0.540$, $0.073$. הממוצעים על $64$ זרעים נעו בין $2.37$ ל-$2.44$, בין $1.39$ ל-$1.50$, בין $0.525$ ל-$0.574$ ובין $0.063$ ל-$0.095$, כל אחד עם שגיאה של $0.03$ עד $0.04$; ההחטאה הגדולה ביותר, $1.391 \pm 0.040$ ב-$\tau$, היא שתי שגיאות. (ג) הפיזורים היחסיים שנמדדו: $0.18$ עד $0.23$ על פני ארבע מנות ב-$N = 200$, $0.059$ ו-$0.061$ ב-$N = 2000$; המדויקים: $0.190/0.0600 = 3.16$, לעומת $\sqrt{10} = 3.16$.
      - kind: result
        text: >-
          (א) $3.01 \pm 0.03$ למנה של $64$, לעומת $3.000$. (ב) התאמה בגבולות השגיאה בכל ארבע נקודות הביקורת; החוק מתקיים בכל צעד, ודווקא סמוך לשיווי משקל מספר סופי של הרצות מודד אותו בדיוק הנמוך ביותר. (ג) הפיזור היחסי יורד מ-$0.19$ ל-$0.060$, פי $\sqrt{10}$: חוק $N^{-1/2}$. (ד) ההרצות בודקות את המודל ואת הקוד, לא את הטבע: הן אינן אומרות דבר על כך שמגע ממשי מציית לחוק ניוטון, מהו ה-$\kappa$ שלו, או כמה שניות הן צעד.

  - id: W-1.1-10
    level: bagrut
    objectives: [OBJ-1.1-3]
    prompt: >-
      הרבה מתחת ל-$1\,\text{K}$, קיבול החום של מתכת בא בעיקר מאלקטרוני ההולכה שלה, והוא יחסי לטמפרטורה: $C = \gamma nT$, עם $\gamma = 0.695\,\text{mJ mol}^{-1}\,\text{K}^{-2}$ לנחושת, ו-$n$ הכמות במולים. (הסריג מוסיף $4\%$ ב-$0.8\,\text{K}$, ופחות מתחת לזה; התעלמו ממנו.) גוש נחושת A של $1.0\,\text{mol}$ ב-$0.80\,\text{K}$ מובא למגע עם גוש B של $3.0\,\text{mol}$ ב-$0.20\,\text{K}$, והזוג מבודד.
      (א) מצאו את האנרגיה הפנימית של גוש, $U(T)$, עד כדי קבוע, ואת הטמפרטורה המשותפת הסופית.
      (ב) השוו לממוצע המשוקלל $T_\mathrm{eq} = (C_AT_{A,0} + C_BT_{B,0})/(C_A + C_B)$ כשכל קיבול חום מחושב בטמפרטורת ההתחלה של הגוף שלו, ולאותו ממוצע כשהוא משוקלל לפי הכמות בלבד. איזה מהם נכון, ומדוע?
      (ג) כמה חום עובר מ-A ל-B?
      (ד) הראו שהממוצע המשוקלל בכל זאת מדויק, אם קיבול החום של כל גוש מחושב בממוצע של טמפרטורת ההתחלה והטמפרטורה הסופית שלו עצמו, ובדקו זאת מספרית.
      (ה) שני גושים שווים מתחילים ב-$T + \delta$ וב-$T - \delta$. מה גודל השגיאה של הממוצע בקיבולי ההתחלה, בסדר המוביל ב-$\delta$?
    answer: >-
      (א) $U = U_0 + \tfrac12\gamma nT^2$; $T_f = \sqrt{(n_AT_{A,0}^2 + n_BT_{B,0}^2)/(n_A + n_B)} = 0.436\,\text{K}$. (ב) $0.543\,\text{K}$ (גבוה ב-$25\%$) ו-$0.350\,\text{K}$ (נמוך ב-$20\%$); רק (א) נכון, כי הקיבולים משתנים בדרך עד פי $2.2$. (ג) $0.156\,\text{mJ}$. (ד) $\Delta U = C(\bar T)\,\Delta T$ בדיוק, כאשר $\bar T$ הוא הממוצע של טמפרטורות הקצה; הממוצע המשוקלל נותן אז $0.4359\,\text{K}$. (ה) הוא גבוה ב-$\delta^2/(2T)$: מסדר שני בפער.
    solution:
      - kind: given
        text: >-
          $\gamma = 0.695 \times 10^{-3}\,\text{J mol}^{-1}\,\text{K}^{-2}$; $n_A = 1.0\,\text{mol}$, $T_{A,0} = 0.80\,\text{K}$; $n_B = 3.0\,\text{mol}$, $T_{B,0} = 0.20\,\text{K}$; לא נעשית עבודה, אין דליפה.
      - kind: law
        text: >-
          שימור האנרגיה בזוג המבודד, $\Delta U_A + \Delta U_B = 0$, כשכל $U$ נמצא מתוך קיבול החום שלו בנפח קבוע, $\mathrm{d}U = C\,\mathrm{d}T$. נוסחת הממוצע המשוקלל הניחה ש-$C$ קבוע; כאן הוא אינו קבוע.
      - kind: manipulation
        text: >-
          (א) $U(T) = U_0 + \int_0^T \gamma nT'\,\mathrm{d}T' = U_0 + \tfrac12\gamma nT^2$. השימור: $\tfrac12\gamma n_A(T_f^2 - T_{A,0}^2) + \tfrac12\gamma n_B(T_f^2 - T_{B,0}^2) = 0$, ו-$\gamma$ מצטמצם. (ד) לכל גוש, $\tfrac12\gamma n(T_f^2 - T_0^2) = \gamma n\,\tfrac{T_0 + T_f}{2}\,(T_f - T_0) = C(\bar T)\,(T_f - T_0)$ עם $\bar T = (T_0 + T_f)/2$: הצורה של הערך הממוצע מדויקת עבור $C \propto T$, ומשוואת השימור היא אז הממוצע המשוקלל עם המשקלים $C(\bar T)$. (ה) עם $n_A = n_B$: באופן מדויק $T_f = \sqrt{T^2 + \delta^2} = T + \delta^2/(2T) + \dots$; הממוצע בקיבולי ההתחלה הוא $\big((T + \delta)^2 + (T - \delta)^2\big)/(2T) = T + \delta^2/T$.
      - kind: formula
        text: >-
          $T_f = \sqrt{\dfrac{n_AT_{A,0}^2 + n_BT_{B,0}^2}{n_A + n_B}} \qquad Q_{A \to B} = \tfrac12\gamma n_A\big(T_{A,0}^2 - T_f^2\big)$
      - kind: limit
        text: >-
          (ה) כאשר $\delta \to 0$ כל הגרסאות מתלכדות, והממוצע בקיבולי ההתחלה טועה ב-$\delta^2/(2T)$: נוסחת הקיבול הקבוע בטוחה לפערים קטנים, ונכשלת כשהפער נעשה בסדר הגודל של הטמפרטורה עצמה, כמו כאן. אילו $C$ לא היה תלוי ב-$T$, $U$ היה ליניארי ב-$T$, והממוצע המשוקלל היה מדויק בכל פער.
      - kind: units
        text: >-
          $\gamma nT^2$: $\text{J mol}^{-1}\,\text{K}^{-2}\cdot\text{mol}\cdot\text{K}^2 = \text{J}$; מתחת לשורש, $\text{mol}\cdot\text{K}^2/\text{mol}$, ולכן $T_f$ בקלווין.
      - kind: substitution
        text: >-
          (א) $T_f = \sqrt{(0.64 + 3 \times 0.04)/4} = \sqrt{0.19} = 0.4359\,\text{K}$. (ב) קיבולי ההתחלה $\gamma \times 0.80$ ו-$\gamma \times 0.60$: $(0.80 \times 0.80 + 0.60 \times 0.20)/1.40 = 0.5429\,\text{K}$. לפי הכמות: $(0.80 + 3 \times 0.20)/4 = 0.350\,\text{K}$. (ג) $\tfrac12 \times 0.695 \times 10^{-3} \times (0.64 - 0.19) = 1.56 \times 10^{-4}\,\text{J}$, ו-B מקבל $\tfrac12 \times 0.695 \times 10^{-3} \times 3 \times (0.19 - 0.04)$, אותו דבר. (ד) משקלים $1.0 \times 0.618$ ו-$3.0 \times 0.318$: $(0.618 \times 0.80 + 0.954 \times 0.20)/1.572 = 0.4359\,\text{K}$.
      - kind: result
        text: >-
          (א) $U = U_0 + \tfrac12\gamma nT^2$, והגושים נפגשים ב-$0.436\,\text{K}$. (ב) $0.543\,\text{K}$ ו-$0.350\,\text{K}$ שגויים שניהם; החוק הוא שימור האנרגיה עם ה-$U(T)$ האמיתי, והממוצע המשוקלל נובע ממנו רק לקיבולים קבועים. (ג) $0.156\,\text{mJ}$. (ד) קיבולים שנלקחים בטמפרטורה הממוצעת של כל גוש מחזירים את הנוסחה לתוקפה, אבל כדי למצוא אותם צריך קודם את התשובה. (ה) השגיאה מסדר שני, $\delta^2/(2T)$, ולכן נוסחת הקיבול הקבוע משרתת היטב בפערים קטנים.
challenge:
  - id: W-1.1-c1
    stars: 1
    objectives: [OBJ-1.1-3]
    prompt: >-
      כוס מעבדה עם מים נמצאת בהתחלה ב-$30\,{}^\circ\text{C}$. הכוס עשויה $100\,\text{g}$ אלומיניום ($c = 0.900\,\text{J/(g K)}$) ומכילה $180\,\text{g}$ מים ($c = 4.186\,\text{J/(g K)}$). קרח נמס ב-$0\,{}^\circ\text{C}$ וקולט תוך כך $L = 333\,\text{J/g}$; הניחו ששום חום אינו בורח.
      (א) מוסיפים $100\,\text{g}$ קרח ב-$0\,{}^\circ\text{C}$. כשהמערכת מגיעה שוב לשיווי משקל, מהי הטמפרטורה הסופית? אם היא $0\,{}^\circ\text{C}$, כמה קרח נשאר?
      (ב) חזרו על השאלה עם $50\,\text{g}$ קרח.
      (ג) סטודנט מתייחס לקרח כאל גוף נוסף בעל קיבול חום קבוע (קרח: $c = 2.1\,\text{J/(g K)}$) ומשתמש בממוצע המשוקלל עבור (א). מה זה נותן, ומדוע זה נכשל? כמו מה מתנהג מוצק שנמס, ככל ששאר המערכת יכולה להבחין?
      (ד) עבור אילו מסות של קרח מוסף הטמפרטורה הסופית היא בדיוק $0\,{}^\circ\text{C}$?
    answer: >-
      (א) $0\,{}^\circ\text{C}$, ונשארים $24.0\,\text{g}$ קרח ($76.0\,\text{g}$ נמסים). (ב) $8.2\,{}^\circ\text{C}$, והקרח נמס כולו. (ג) $24.0\,{}^\circ\text{C}$, רחוק מאוד מהנכון: התכה קולטת חום בטמפרטורה קבועה, ושום קיבול חום קבוע אינו יכול לתאר זאת. מוצק שנמס הוא מאגר הנעוץ ב-$0\,{}^\circ\text{C}$, כאילו קיבול החום שלו אינסופי. (ד) כל מסה של $76.0\,\text{g}$ או יותר.
    solution:
      - kind: given
        text: >-
          הכוס והמים: $C = 100 \times 0.900 + 180 \times 4.186 = 90.0 + 753.5 = 843.5\,\text{J/K}$, ב-$T_0 = 30\,{}^\circ\text{C}$. קרח: מסה $m$ ב-$0\,{}^\circ\text{C}$; $L = 333\,\text{J/g}$; מי ההתכה: $c_w = 4.186\,\text{J/(g K)}$.
      - kind: law
        text: >-
          שימור האנרגיה במערכת המבודדת, בלי עבודה: החום שהכוס והמים מוסרים שווה לחום שהקרח קולט, כדי להיתך ($mL$ עבור החלק שנמס) ואחר כך כדי לחמם את מי ההתכה שלו.
      - kind: manipulation
        text: >-
          קירור הכוס והמים ל-$0\,{}^\circ\text{C}$ משחרר לכל היותר $CT_0$. אם $mL > CT_0$, החום הזה ממיס רק $m_1 = CT_0/L$ מהקרח, והכול נעצר ב-$0\,{}^\circ\text{C}$. אם $mL < CT_0$, כל הקרח נמס, והשאר מחמם את המערכת כולה: $C(T_0 - T_f) = mL + mc_wT_f$.
      - kind: formula
        text: >-
          $m_1 = \dfrac{CT_0}{L} \qquad T_f = \dfrac{CT_0 - mL}{C + mc_w}$
      - kind: reasoning
        text: >-
          (ג) כשהקרח הוא גוף של $210\,\text{J/K}$ ב-$0\,{}^\circ\text{C}$, $T = 843.5 \times 30/1053.5 = 24.0\,{}^\circ\text{C}$. זה מניח שהאנרגיה של הקרח גדלה ב-$C\,\Delta T$, ומחמיץ את $333\,\text{J/g}$ שהוא קולט ב-$0\,{}^\circ\text{C}$ בלי להתחמם כלל. כל עוד שתי הפאזות נוכחות, התערובת קולטת או משחררת חום בלי שינוי טמפרטורה: קיבול החום האפקטיבי שלה אינסופי, ולכן מבחינת הכוס היא מאגר ב-$0\,{}^\circ\text{C}$, והממוצע המשוקלל, עם משקל אינסופי, נוחת בדיוק שם.
      - kind: limit
        text: >-
          כאשר $m \to 0$, $T_f \to T_0$: אין מה שיקרר את המים. ב-$mL = CT_0$ שני המקרים נפגשים: כל הקרח בדיוק נמס, ו-$T_f = 0$. קרח מעבר לזה אינו יכול להוריד את המערכת מתחת ל-$0\,{}^\circ\text{C}$, כי הוא עצמו ב-$0\,{}^\circ\text{C}$; הוא רק נשאר בלי להימס.
      - kind: units
        text: >-
          $CT_0/L$: $(\text{J/K})\cdot\text{K}/(\text{J/g}) = \text{g}$; $T_f$: $\text{J}/(\text{J/K}) = \text{K}$, כאן טמפרטורה בצלזיוס מעל $0\,{}^\circ\text{C}$.
      - kind: substitution
        text: >-
          $CT_0 = 843.5 \times 30 = 25\,304\,\text{J}$. (א) $100 \times 333 = 33\,300\,\text{J} > 25\,304\,\text{J}$: $25\,304/333 = 76.0\,\text{g}$ נמסים, $24.0\,\text{g}$ נשארים. (ב) $50 \times 333 = 16\,650\,\text{J}$; $T_f = (25\,304 - 16\,650)/(843.5 + 209.3) = 8654/1052.8 = 8.22\,{}^\circ\text{C}$. (ד) $m \ge 76.0\,\text{g}$.
      - kind: result
        text: >-
          (א) $0\,{}^\circ\text{C}$, ונשארים $24.0\,\text{g}$ קרח. (ב) $8.2\,{}^\circ\text{C}$. (ג) הממוצע בקיבולים קבועים נותן $24.0\,{}^\circ\text{C}$, ונכשל כי מעבר פאזה קולט חום בטמפרטורה קבועה; מוצק שנמס פועל כמאגר. (ד) כל מסת קרח של $76.0\,\text{g}$ לפחות נועצת את המצב הסופי ב-$0\,{}^\circ\text{C}$.
    source:
      name: 'Weber State University Physics 3180 Thermal Physics'
      year: 2020
      problem: 'Problem Set 2, Problem 5'
      url: 'https://physics.weber.edu/schroeder/thermal/ps2.pdf'
      verified: '2026-11-20'
      adapted: true

  - id: W-1.1-c2
    stars: 2
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      שני מוצקי איינשטיין חולקים $q = 100$ קוונטים של אנרגיה $\varepsilon$: ל-A יש $N_A = 150$ מתנדים ול-B יש $N_B = 250$. את הקוונטים של מוצק איינשטיין ממשי אי אפשר להבחין זה מזה, ולכן $N$ מתנדים מחזיקים $q$ קוונטים ב-$\Omega(N, q) = \dfrac{(q + N - 1)!}{q!\,(N - 1)!}$ דרכים. כמה ערכים: עבור $q_A = 9, 10, 11$, $\Omega_A = 1.3\cdot10^{14}$, $2.1\cdot10^{15}$, $3.1\cdot10^{16}$; עבור $q_B = 91, 90, 89$ המתאימים, $\Omega_B = 2.9\cdot10^{84}$, $7.8\cdot10^{83}$, $2.1\cdot10^{83}$. האנטרופיה היא $S = k_B\ln\Omega$, והטמפרטורה מוגדרת על ידי $1/T = \partial S/\partial U$.
      (א) השתמשו בנתונים כדי לחשב את הטמפרטורות של שני המוצקים כאשר $q_A = 10$, ביחידות של $\varepsilon/k_B$ ובקלווין עבור $\varepsilon = 0.1\,\text{eV}$. איזו מהן גדולה יותר, ולאיזה כיוון תזרום אנרגיה?
      (ב) הראו, בעזרת קירוב סטירלינג, ש-$k_BT = \varepsilon/\ln(1 + N/q)$. השוו ל-(א), ולטמפרטורת חלוקת האנרגיה השווה של השיעור, $q\varepsilon/(Nk_B)$.
      (ג) באיזה $q_A$ שתי הטמפרטורות שוות? השוו לחלוקת האנרגיה הסבירה ביותר (מחשב מוצא $q_A = 37$, בהסתברות $0.073$) ולתנאי האיזון של מודל הדילוגים, $q_A/N_A = q_B/N_B$.
      (ד) הטמפרטורה האנטרופית והטמפרטורה של חלוקת האנרגיה השווה נותנות לאותו גוף מספרים שונים. הסבירו מדוע הן בכל זאת ממיינות גופים לאותן מחלקות של שיווי משקל הדדי, ומה זה אומר על מה שהחוק האפס קובע ועל מה שהוא משאיר פתוח.
    answer: >-
      (א) $k_BT_A/\varepsilon = 0.37$ ($426\,\text{K}$), $k_BT_B/\varepsilon = 0.76$ ($878\,\text{K}$); B חם יותר, ואנרגיה זורמת מ-B ל-A. (ב) $0.361$ ו-$0.752$; ערכי חלוקת האנרגיה השווה, $0.067$ ו-$0.36$, נמוכים מדי פי $5.5$ ופי $2.1$, כי שני המוצקים רחוקים מהמשטר הקלאסי. (ג) בין $q_A = 37$ ל-$38$, ב-$37.5$ לפי קירוב סטירלינג, שם נמצאת גם החלוקה הסבירה ביותר ושם $q_A/N_A = q_B/N_B$. (ד) שתיהן פונקציות עולות של $q/N$, ושיווי משקל בין שני מוצקים כאלה פירושו $q/N$ שווה: החוק האפס קובע את המחלקות, לא את המספרים שניתנים להן.
    solution:
      - kind: law
        text: >-
          $1/T = \partial S/\partial U$ עם $U = q\varepsilon$, מחושב בהפרש מרכזי: כש-$q_A$ עובר מ-$9$ ל-$11$, $q_B$ עובר מ-$91$ ל-$89$. סטירלינג: $\ln n! \approx n\ln n - n$. אנרגיה זורמת מהטמפרטורה הגבוהה אל הנמוכה.
      - kind: manipulation
        text: >-
          (א) $\dfrac{1}{k_BT_A} = \dfrac{\ln\Omega_A(11) - \ln\Omega_A(9)}{2\varepsilon}$ ו-$\dfrac{1}{k_BT_B} = \dfrac{\ln\Omega_B(91) - \ln\Omega_B(89)}{2\varepsilon}$. (ב) עבור $q$ ו-$N$ גדולים, $\ln\Omega \approx (q + N)\ln(q + N) - q\ln q - N\ln N$, ולכן $\partial\ln\Omega/\partial q = \ln(q + N) - \ln q = \ln(1 + N/q)$, ו-$1/k_BT = \ln(1 + N/q)/\varepsilon$.
      - kind: formula
        text: >-
          $k_BT = \dfrac{\varepsilon}{\ln(1 + N/q)} \qquad T_A = T_B \iff \dfrac{q_A}{N_A} = \dfrac{q_B}{N_B}$
      - kind: reasoning
        text: >-
          (ג) לפי הנוסחה $T$ תלויה ב-$q/N$ בלבד, ולכן הטמפרטורות שוות כאשר $q_A/150 = (100 - q_A)/250$, $q_A = 37.5$; הספירות המדויקות מציבות את נקודת החיתוך בין $37$ ($0.623$ לעומת $0.628$) ל-$38$ ($0.632$ לעומת $0.623$). החלוקה הסבירה ביותר ממקסמת את $\Omega_A\Omega_B$, כלומר את $S_A + S_B$, שם $\partial S_A/\partial U_A = \partial S_B/\partial U_B$: טמפרטורות שוות, ב-$37$ (הסתברות $0.0734$) וב-$38$ ($0.0730$). מודל הדילוגים, עם הקוונטים המסומנים שלו וספירה אחרת, מאזן את הזרימות שלו באותו $q_A/N_A = q_B/N_B$.
      - kind: reasoning
        text: >-
          (ד) שני מוצקי איינשטיין בעלי אותו $\varepsilon$ נמצאים בשיווי משקל כאשר $q/N$ שלהם שווה, וגם $q\varepsilon/(Nk_B)$ וגם $\varepsilon/\big(k_B\ln(1 + N/q)\big)$ הן פונקציות עולות של $q/N$: כל אחת מהן נותנת מספרים שווים בדיוק לגופים שנמצאים בשיווי משקל זה עם זה. זה כל מה שהחוק האפס דורש מטמפרטורה. הוא מגדיר את המחלקות; איזה מספר מסמן מחלקה זו בחירה נוספת, סקאלת טמפרטורה אמפירית. האנטרופית מתייחדת בזכות החוק השני, כטמפרטורה המוחלטת (מודול 9); התווית של חלוקת האנרגיה השווה מתלכדת איתה רק בגבול הקלאסי, $k_BT \approx \varepsilon(q/N + \tfrac12)$ עבור $q \gg N$.
      - kind: limit
        text: >-
          עבור $q \gg N$, $\ln(1 + N/q) \approx N/q - N^2/(2q^2)$ ו-$k_BT \approx \varepsilon(q/N + \tfrac12)$: חלוקת האנרגיה השווה, עד כדי ההיסט של נקודת האפס. עבור $q \ll N$, $k_BT \approx \varepsilon/\ln(N/q)$, הרבה מעל $q\varepsilon/N$: כאן ל-A יש קוונט אחד לכל $15$ מתנדים, עמוק במשטר הקוונטי שמפרט המודל של השיעור מונה כאופן כשל.
      - kind: units
        text: >-
          $\ln\Omega$ הוא מספר טהור, ולכן $\partial S/\partial U$ הוא $k_B$ לג'אול, ו-$k_BT$ יוצא ביחידות של $\varepsilon$; $T = (k_BT/\varepsilon)\,\varepsilon/k_B$, עם $\varepsilon/k_B = 0.1\,\text{eV}/k_B = 1160\,\text{K}$.
      - kind: substitution
        text: >-
          (א) $\ln(3.1\cdot10^{16}/1.3\cdot10^{14}) = 5.47$, ולכן $k_BT_A/\varepsilon = 2/5.47 = 0.365$; מהספירות המדויקות, $0.367$, $426\,\text{K}$. $\ln(2.9\cdot10^{84}/2.1\cdot10^{83}) = 2.63$, $k_BT_B/\varepsilon = 0.762$; מדויק: $0.756$, $878\,\text{K}$. (ב) $1/\ln(1 + 150/10) = 1/\ln 16 = 0.361$; $1/\ln(1 + 250/90) = 0.752$. חלוקת האנרגיה השווה: $10/150 = 0.067$ ו-$90/250 = 0.36$. ב-$q_A = 37.5$ לשני המוצקים $q/N = 0.25$ ו-$k_BT = \varepsilon/\ln 5 = 0.621\,\varepsilon$, $721\,\text{K}$.
      - kind: result
        text: >-
          (א) $T_A = 0.37\,\varepsilon/k_B = 426\,\text{K}$, $T_B = 0.76\,\varepsilon/k_B = 878\,\text{K}$; אנרגיה זורמת מ-B ל-A. (ב) $k_BT = \varepsilon/\ln(1 + N/q)$ מתאים לנתונים; חלוקת האנרגיה השווה נמוכה מדי פי כמה באנרגיות האלה. (ג) הטמפרטורות נפגשות ב-$q_A \approx 37.5$, שהיא גם החלוקה הסבירה ביותר וגם נקודת האיזון של מודל הדילוגים. (ד) כל פונקציה עולה של $q/N$ מסמנת את אותן מחלקות של שיווי משקל: החוק האפס מבטיח את המחלקות, והסקאלה היא עניין נפרד.
