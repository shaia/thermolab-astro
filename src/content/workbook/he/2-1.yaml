# חוברת התרגול של שיעור 2.1. שאלה 07 היא שאלה 5 של ThermoLab (גודלה של מולקולה, וניתוח ממדי), מורחבת מעבר
# לדוגמה 5 של השיעור: גורם החצי נגזר מהצבת המולקולות אחת אחת, ה-b של ארגון מושווה לנוזל שלו, והנקודה הקריטית
# נקבעת עד כדי מספרים טהורים מתוך הממדים בלבד. השאר חדשות, ואף אחת מהן אינה חוזרת על שאלות 1 עד 4 של ThermoLab,
# שהן שאלות החזרה, או על שש הדוגמאות הפתורות של השיעור. ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו
# מפרסמת אותם, בהחלטת הכותב.
# נתוני הגזים הממשיים הם מ-NIST Chemistry WebBook, SRD 69 (Thermophysical Properties of Fluid Systems), שנשלפו
# ב-2026-11-20 מ-https://webbook.nist.gov/cgi/fluid.cgi (Type=IsoTherm לאיזותרמות; Type=SatT לטבלאות הרוויה, שהשורה
# האחרונה שלהן היא הנקודה הקריטית): חנקן ID=C7727379, ארגון C7440371, מתאן C74828, פחמן דו-חמצני C124389, מים
# C7732185. כל מספר חושב מחדש ב-numpy ונבדק מול thermolab.gases של ThermoLab.
# קחו k_B = 1.380649e-23 J/K, N_A = 6.02214076e23 /mol, R = 8.314462618 J/(mol K).
lang: he
lesson: '2.1'
practice:
  - id: W-2.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-2, OBJ-2.1-1]
    prompt: >-
      מבחן ההכפלה, על גדלים פחות מובנים מאליהם. שני בקבוקים זהים של חנקן, באותו מצב שיווי משקל, מחוברים למערכת אחת.
      (א) סווגו כל אחד מהגדלים הבאים כאקסטנסיבי, כאינטנסיבי או כאף אחד מהשניים, ואמרו כיצד הוא משתנה: הצפיפות המספרית $n = N/V$; צפיפות המסה $\rho$; מקדם הדחיסות $Z = PV/(Nk_BT)$; המכפלה $PV$; קיבול החום $C$ וקיבול החום לחלקיק $C/N$; האנרגיה ליחידת נפח $U/V$.
      (ב) אותו דבר עבור שלושה גדלים של מודל ואן דר ואלס: הנפח המודר הכולל $Nb$; מספר זוגות המולקולות, $N(N - 1)/2$; ואנרגיית המשיכה של המודל, $-aN^2/V$.
      (ג) אותו דבר עבור השיפוע של איזותרמה המשורטטת כנגד הנפח הכולל, $(\partial P/\partial V)_{T,N}$, ועבור $-V(\partial P/\partial V)_{T,N}$.
      (ד) סטודנט משרטט את מצבי שיווי המשקל של חנקן כמשטח מעל $(V, T)$ במקום מעל $(v, T)$. הסבירו מדוע כך לא מתקבל משטח אחד לחומר, ומדוע $(v, T)$ כן נותן משטח כזה.
    answer: >-
      (א) $n$, $\rho$, $Z$, $C/N$ ו-$U/V$ אינטנסיביים; $PV$ ו-$C$ מוכפלים, אקסטנסיביים. (ב) $Nb$ מוכפל, אקסטנסיבי; מספר הזוגות גדל כמו $N^2$, בערך פי ארבעה, ואינו אף אחד מהשניים; אנרגיית המשיכה $-a(2N)^2/(2V)$ מוכפלת, אקסטנסיבית. (ג) $(\partial P/\partial V)_{T,N}$ קטן פי שניים, ואינו אף אחד מהשניים; $-V(\partial P/\partial V)_{T,N}$ אינטנסיבי. (ד) ב-$V$ וב-$T$ נתונים הלחץ תלוי ב-$N$, ולכן לכל כמות גז יש משטח משלה מעל $(V, T)$; הלחץ תלוי ב-$V$ וב-$N$ רק דרך $v = V/N$, ולכן כל הדגימות חולקות משטח אחד מעל $(v, T)$.
    solution:
      - kind: law
        text: >-
          חיבור שתי מערכות זהות באותו מצב מכפיל את $N$, $V$ ו-$U$ ומשאיר את $P$ ואת $T$ כשהיו. היחס בין שני משתנים אקסטנסיביים הוא אינטנסיבי; מכפלה של משתנה אקסטנסיבי במשתנה אינטנסיבי היא אקסטנסיבית. ומשוואת המצב נותנת את הלחץ כפונקציה של $v = V/N$ ו-$T$ בלבד, $P = f(v, T)$.
      - kind: reasoning
        text: >-
          (א) $n = N/V$ הופך ל-$2N/2V$: ללא שינוי. $\rho = Nm/V$ באותו אופן. $Z = PV/(Nk_BT) = Pv/(k_BT)$ בנוי מ-$P$, $v$ ו-$T$, שאף אחד מהם אינו משתנה: הוא תכונה של המצב, לא של הדגימה. $PV$ הוא $P$ אינטנסיבי כפול $V$ אקסטנסיבי: הוא מוכפל (הוא שווה ל-$ZNk_BT$). האנרגיה מוכפלת בכל טמפרטורה, ולכן הנגזרת שלה $C$ מוכפלת ו-$C/N$ לא. $U/V$ הוא יחס בין שני משתנים אקסטנסיביים.
      - kind: reasoning
        text: >-
          (ב) $b$ שייך למולקולה, ולכן $Nb$ מוכפל. מספר הזוגות עובר מ-$N(N - 1)/2$ ל-$2N(2N - 1)/2$, בערך פי ארבעה עבור $N$ גדול: אף אחד מהשניים. ובכל זאת אנרגיית המשיכה $-a(2N)^2/(2V) = -2aN^2/V$ מוכפלת. אין כאן סתירה: מולקולה חשה רק את השכנות שבטווח המשיכה שלה, ומספרן נקבע לפי הצפיפות $N/V$, ולכן הזוגות שנחשבים הם $N$ כפול $N/V$, ולא כל $N^2/2$ הזוגות. $N^2/V$ הוא אקסטנסיבי; $N^2$ אינו.
      - kind: reasoning
        text: >-
          (ג) עם $P = f(V/N, T)$, $(\partial P/\partial V)_{T,N} = \frac{1}{N}\,\partial f/\partial v$: אותו $\partial f/\partial v$, מחולק ב-$N$ גדול פי שניים. הוא קטן פי שניים, כלומר משתנה כמו $1/N$, ואינו אף אחד מהשניים. כשמכפילים אותו ב-$-V$ הוא הופך ל-$-v\,\partial f/\partial v$, אינטנסיבי: מודול הנפח, ההופכי של הדחיסות האיזותרמית.
      - kind: reasoning
        text: >-
          (ד) מעל $(V, T)$, לבקבוק עם פי שניים גז יש פי שניים לחץ באותם $V$ ו-$T$: כל כמות גז משרטטת משטח משלה, ולחנקן כחומר אין משטח כלל. מעל $(v, T)$ הכמות נעלמת מהחשבון, כי $P = f(v, T)$: כל הדגימות של חנקן, בכל גודל, נמצאות על משטח אחד. זה המשטח של הנחת המצב, שנקבע על ידי שני משתנים אינטנסיביים.
      - kind: limit
        text: >-
          המבחן מניח שהדפנות ופני השטח אינם משנים דבר, כך שחיבור הבקבוקים משנה רק את הכמות. לבקבוק זה נכון; בטיפה של כמה מאות מולקולות חלק גדול מהן יושב על פני השטח, חיבור שתי טיפות משנה את החלק הזה, וגדלים שאמורים להיות אינטנסיביים זזים. שום דבר שגדל כמו $N^2$ או כמו $1/N$ אינו יכול להופיע לבדו בקשר בין משתנים אינטנסיביים; הוא חייב לבוא עם חזקה מתאימה של $V$.
      - kind: result
        text: >-
          (א) אינטנסיביים: $n$, $\rho$, $Z$, $C/N$, $U/V$; אקסטנסיביים: $PV$, $C$. (ב) $Nb$ ו-$-aN^2/V$ אקסטנסיביים; מספר הזוגות אינו אף אחד מהשניים. (ג) $(\partial P/\partial V)_{T,N}$ אינו אף אחד מהשניים; $-V(\partial P/\partial V)_{T,N}$ אינטנסיבי. (ד) רק מעל $(v, T)$ כל הדגימות של חומר חולקות משטח משוואת מצב אחד.

  - id: W-2.1-02
    level: basic
    objectives: [OBJ-2.1-3, OBJ-2.1-6]
    prompt: >-
      בלון החנקן של פתיחת השיעור. בלון פלדה של $50.0\,\text{L}$ מכיל חנקן ($M = 28.013\,\text{g/mol}$) ב-$20.0\,\text{MPa}$ וב-$293.15\,\text{K}$.
      (א) לפי חוק הגזים האידיאליים, כמה מולקולות, כמה מולים וכמה קילוגרמים של חנקן יש בו?
      (ב) נתוני הייחוס של NIST נותנים לחנקן ב-$20.0\,\text{MPa}$ וב-$293.15\,\text{K}$ צפיפות של $7.8014\,\text{mol/L}$. כמה חנקן יש בבלון באמת, ומהו $Z$? האם החוק האידיאלי העריך ביתר או בחסר, ואיזה משני התיקונים של ואן דר ואלס גובר?
      (ג) באותה טמפרטורה NIST נותן $0.041037\,\text{mol/L}$ ב-$0.100\,\text{MPa}$ ו-$4.09951\,\text{mol/L}$ ב-$10.0\,\text{MPa}$. מצאו את $Z$ בכל אחד מהם. טכנאית מסיקה מהשני שחנקן ב-$10\,\text{MPa}$ הוא גז אידיאלי. האם היא צודקת?
      (ד) נסחו, במשפט אחד שהמספרים האלה תומכים בו, איזה מין חוק הוא $PV = Nk_BT$.
    answer: >-
      (א) $N = 2.471 \times 10^{26}$, $410.3\,\text{mol}$, $11.49\,\text{kg}$. (ב) $390.1\,\text{mol}$, $10.93\,\text{kg}$; $Z = 1.052$. החוק האידיאלי מעריך ביתר ב-$5.2\%$, $0.57\,\text{kg}$; $Z > 1$ פירושו שהנפח המודר גובר על המשיכה. (ג) $Z = 0.99977$ ו-$1.0008$. לא: ב-$10\,\text{MPa}$ שני התיקונים מקזזים זה את זה במקרה; $Z$ ירד ל-$0.994$ ליד $5\,\text{MPa}$, ועכשיו הוא בדרכו למעלה, ל-$1.052$ ב-$20\,\text{MPa}$. (ד) חוק אמפירי של המשטר הדליל: חנקן מציית לו בדיוק של $0.02\%$ בלחץ האטמוספרי, ונכשל בו ב-$5\%$ בבלון.
    solution:
      - kind: given
        text: >-
          $V = 0.0500\,\text{m}^3$, $P = 2.00 \times 10^7\,\text{Pa}$, $T = 293.15\,\text{K}$, $M = 28.013\,\text{g/mol}$. צפיפויות NIST ב-$293.15\,\text{K}$: $7.8014$, $0.041037$ ו-$4.09951\,\text{mol/L}$ ב-$20.0$, $0.100$ ו-$10.0\,\text{MPa}$.
      - kind: law
        text: >-
          חוק הגזים האידיאליים $PV = Nk_BT$, או $PV = nRT$ במולים. בגז ממשי, מקדם הדחיסות $Z = PV/(nRT)$ מודד את הסטייה; כאשר $n = \rho V$ היא הכמות האמיתית, הכמות של החוק האידיאלי, $PV/(RT)$, גדולה ממנה פי $Z$.
      - kind: formula
        text: >-
          $N = \dfrac{PV}{k_BT} \qquad n = \rho V \qquad Z = \dfrac{P}{\rho RT}$
      - kind: limit
        text: >-
          כאשר $P \to 0$ ב-$T$ קבוע, $\rho \to P/(RT)$ ו-$Z \to 1$: החוק האידיאלי הוא הגבול שכל גז מתקרב אליו. $Z > 1$ פירושו שקשה יותר לדחוס את הגז מגז אידיאלי, והנפח המודר שולט; $Z < 1$ פירושו שקל יותר, והמשיכה שולטת.
      - kind: units
        text: >-
          $\text{Pa}\cdot\text{m}^3/(\text{J/K}\cdot\text{K}) = \text{J/J}$, מניין. ב-$Z$, $\text{Pa}/(\text{mol/m}^3 \cdot \text{J/(mol K)} \cdot \text{K}) = \text{Pa}/(\text{J/m}^3)$, מספר טהור; שימו לב ש-$1\,\text{mol/L} = 10^3\,\text{mol/m}^3$.
      - kind: substitution
        text: >-
          (א) $N = 2.00 \times 10^7 \times 0.0500/(1.380649 \times 10^{-23} \times 293.15) = 2.471 \times 10^{26}$; $N/N_A = 410.3\,\text{mol}$; $m = 410.3 \times 28.013\,\text{g} = 11.49\,\text{kg}$. (ב) $n = \rho V = 7801.4 \times 0.0500 = 390.1\,\text{mol}$, $10.93\,\text{kg}$; $Z = 410.3/390.1 = 1.052$. (ג) $Z = 1.00 \times 10^5/(41.037 \times 8.3145 \times 293.15) = 0.99977$; $Z = 1.00 \times 10^7/(4099.51 \times 8.3145 \times 293.15) = 1.0008$.
      - kind: reasoning
        text: >-
          (ג) $Z = 1$ בלחץ אחד אינו הופך גז לאידיאלי; לגז אידיאלי $Z = 1$ בכל לחץ. האיזותרמה של NIST ב-$293.15\,\text{K}$ יורדת ל-$Z = 0.994$ ליד $5\,\text{MPa}$, שם המשיכה גוברת, חוצה את $1$ ליד $9.7\,\text{MPa}$, ומגיעה ל-$1.052$ ב-$20\,\text{MPa}$, שם הנפח המודר גובר. ב-$10\,\text{MPa}$ הטכנאית תפסה אותה ברגע החצייה. החוק האידיאלי נותן שם את הכמות הנכונה, מהסיבה הלא נכונה, והקריאה הבאה לא תהיה בת מזל כל כך. (ד) החוק האידיאלי אינו חוק שכל גז מציית לו; הוא הגבול של המשטר הדליל, וכאן נמדד שהוא מתקיים בדיוק של $2 \times 10^{-4}$ ב-$0.1\,\text{MPa}$ ונכשל ב-$5\%$ ב-$20\,\text{MPa}$.
      - kind: result
        text: >-
          (א) $2.47 \times 10^{26}$ מולקולות, $410\,\text{mol}$, $11.5\,\text{kg}$ לפי החוק האידיאלי. (ב) באמת $390\,\text{mol}$, $10.9\,\text{kg}$; $Z = 1.052$, הערכת יתר של $5.2\%$, כי בצפיפות הזו הנפח המודר שולט. (ג) $Z = 0.99977$ ו-$1.0008$; $Z = 1$ ב-$10\,\text{MPa}$ הוא חצייה, לא אידיאליות. (ד) $PV = Nk_BT$ הוא חוק אמפירי של המשטר הדליל.

  - id: W-2.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-5, OBJ-2.1-1]
    prompt: >-
      אילו גזים אפשר להחזיק בבקבוק כנוזלים? NIST נותן את הטמפרטורות הקריטיות האלה: חנקן $126.19\,\text{K}$, ארגון $150.69\,\text{K}$, מתאן $190.56\,\text{K}$, פחמן דו-חמצני $304.13\,\text{K}$, בוטאן $425.13\,\text{K}$, מים $647.10\,\text{K}$.
      (א) אילו מהם יכולים לעמוד כנוזל מתחת לאדים שלהם עצמם בבקבוק סגור ב-$20\,{}^\circ\text{C}$? את אילו אי אפשר לנזל ב-$20\,{}^\circ\text{C}$ בשום לחץ?
      (ב) מכוניות שנוסעות על גז טבעי, שרובו מתאן, נושאות אותו דחוס לכ-$20\,\text{MPa}$, בעוד מצית מחזיק בוטאן כנוזל בכ-$0.2\,\text{MPa}$. מדוע מכל המתאן צריך לחץ גבוה פי מאה, ועדיין אין בו נוזל?
      (ג) מטף פחמן דו-חמצני, שמולא ב-$0.667\,\text{kg}$ של CO₂ לכל ליטר מנפח הבלון, עומד בחדר ב-$20\,{}^\circ\text{C}$. מד הלחץ שלו מראה $5.73\,\text{MPa}$ כשהוא מלא, ועדיין $5.73\,\text{MPa}$ אחרי שרוב ה-CO₂ רוסס החוצה, כל עוד נשאר בו מעט נוזל. הסבירו. שני מטפים, אחד מלא ואחד כמעט ריק, נמצאים אז באותם $P$ ו-$T$, אבל התכולה שלהם שונה מאוד בצפיפות הממוצעת: האם זה סותר את הנחת המצב?
      (ד) אותו מטף מלא נשאר במכונית ב-$35\,{}^\circ\text{C}$. מה השתנה בתכולה שלו, ובאופן שבו מד הלחץ יורד בזמן השימוש?
    answer: >-
      (א) פחמן דו-חמצני, בוטאן ומים; את החנקן, הארגון והמתאן אי אפשר לנזל ב-$20\,{}^\circ\text{C}$ בשום לחץ. (ב) מתאן ב-$20\,{}^\circ\text{C}$ נמצא ב-$T_r = 1.54$, מעל הטמפרטורה הקריטית שלו: דחיסה רק מעלה את הצפיפות שלו ברציפות, ולכן כדי שהמכל יחזיק ממנו כמות גדולה צריך להעמיד אותו בלחץ גבוה, ושום נוזל אינו נוצר. בוטאן נמצא ב-$T_r = 0.69$, נוזל מתחת לאדים שלו עצמו. (ג) כל עוד נוזל ואדים מתקיימים יחד, הלחץ הוא לחץ הרוויה ב-$20\,{}^\circ\text{C}$, יהיו היחסים ביניהם אשר יהיו. אין סתירה: בדו-קיום $P$ נקבע לפי $T$, ולכן $P$ ו-$T$ אינם שני משתנים בלתי תלויים; $T$ ו-$v$ הממוצע הם שקובעים את התכולה. (ד) ב-$35\,{}^\circ\text{C}$, $T_r = 1.013$: התכולה היא זורם על-קריטי אחד, מד הלחץ מראה כ-$9.1\,\text{MPa}$ כשהמטף מלא, ויורד בהתמדה ככל שה-CO₂ מנוצל, לכ-$7.8\,\text{MPa}$ כשנשארה מחצית.
    solution:
      - kind: law
        text: >-
          מעל הטמפרטורה הקריטית שלו, כל איזותרמה של חומר יורדת בהתמדה עם הנפח: כל לחץ מתקבל בצפיפות אחת, ודחיסה לעולם אינה מפצלת את החומר לנוזל ולאדים. מתחת ל-$T_c$ נוזל והאדים שלו יכולים להתקיים יחד, בלחץ הרוויה היחיד שהטמפרטורה קובעת. הנחת המצב: שני משתנים אינטנסיביים בלתי תלויים קובעים את המצב.
      - kind: reasoning
        text: >-
          (א) ב-$293.15\,\text{K}$: פחמן דו-חמצני ($T_r = 0.964$), בוטאן ($0.690$) ומים ($0.453$) נמצאים מתחת לטמפרטורות הקריטיות שלהם ויכולים להיות נוזלים; חנקן ($T_r = 2.32$), ארגון ($1.95$) ומתאן ($1.54$) נמצאים מעליהן, ושום לחץ אינו מנזל אותם בטמפרטורת החדר. קודם צריך לקרר אותם אל מתחת ל-$T_c$, ולכן חנקן נוזלי וגז טבעי מונזל הם קריוגניים. (ב) מתאן מאוחסן כזורם על-קריטי דחוס, שהצפיפות שלו עולה רק ביחס ישר ללחץ (ופחות מזה, ברגע שהנפח המודר שולט); כדי להחזיק כמות שימושית המכל צריך לחץ גבוה. בוטאן נמצא מתחת לטמפרטורה הקריטית שלו, ולכן לחץ צנוע, לחץ הרוויה שלו עצמו, מחזיק נוזל צפוף במעטפת פלסטיק קלה.
      - kind: reasoning
        text: >-
          (ג) המילוי, $667/44.01 = 15.16\,\text{mol/L}$, נמצא בין האדים הרוויים ($4.41\,\text{mol/L}$) לבין הנוזל הרווי ($17.57\,\text{mol/L}$) של NIST ב-$293.15\,\text{K}$: בבלון יש נוזל ומעליו אדים, בלחץ הרוויה $5.729\,\text{MPa}$. ריסוס מוציא CO₂, מעט נוזל מתאדה וממלא מחדש את חלל האדים, והלחץ נשאר $5.73\,\text{MPa}$ עד שהנוזל נגמר. הבלון המלא והבלון הכמעט ריק הם שניהם תערובות של אותם שני מצבים, נוזל ב-$56.9$ ואדים ב-$226.6\,\text{cm}^3/\text{mol}$, ביחסים שונים. כאן $P = P_\mathrm{sat}(T)$, ולכן $P$ ו-$T$ הם משתנה אחד, לא שניים, ואינם קובעים את הנפח הממוצע; $T$ ו-$v$ הממוצע קובעים אותו. זה הקפל של איור 2.1א: מתחת ל-$T_c$ זוג $(P, T)$ אחד מתקבל ביותר מנפח אחד.
      - kind: reasoning
        text: >-
          (ד) ב-$308.15\,\text{K}$ ה-CO₂ נמצא מעל הטמפרטורה הקריטית שלו: אותם $15.16\,\text{mol/L}$ הם זורם על-קריטי יחיד, ב-$9.07\,\text{MPa}$ לפי האיזותרמה של NIST. אין נוזל שיחזיק את הלחץ, ולכן הקריאה יורדת עם כל גרם שמנוצל, ל-$7.81\,\text{MPa}$ כשמחצית ה-CO₂ אזלה, ומד הלחץ מודד עכשיו כמה נשאר, כפי שהיה עושה בחנקן.
      - kind: limit
        text: >-
          ממש מתחת ל-$T_c$ הצפיפויות של הנוזל הרווי ושל האדים הרוויים מתקרבות זו לזו והקטע השטוח מתקצר; ב-$T_c$ הן נפגשות, ומעליה ההבחנה נעלמת. חומר שנמצא הרבה מעל $T_c$, כמו חנקן בטמפרטורת החדר, מתנהג בלחצים מתונים כמעט כמו הגז האידיאלי, הגבול שבו שום דבר אינו מתעבה.
      - kind: result
        text: >-
          (א) נוזלים ב-$20\,{}^\circ\text{C}$: CO₂, בוטאן, מים; לעולם לא בלחץ בלבד: חנקן, ארגון, מתאן. (ב) מתאן הוא על-קריטי בטמפרטורת החדר, ואפשר רק לדחוס אותו, לא לעבות אותו. (ג) נוזל ואדים בדו-קיום מחזיקים את לחץ הרוויה; בדו-קיום $P$ ו-$T$ אינם בלתי תלויים, ולכן הנחת המצב צריכה את $T$ ואת $v$. (ד) ב-$35\,{}^\circ\text{C}$ ה-CO₂ על-קריטי: $9.07\,\text{MPa}$ כשהמטף מלא, וירידה הדרגתית ככל שהוא מתרוקן.

  - id: W-2.1-04
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-5]
    prompt: >-
      מדוע לאיזותרמה הקריטית יש נקודת פיתול.
      (א) מתחת ל-$T_c$ לכל איזותרמת ואן דר ואלס יש מינימום מקומי ומקסימום מקומי של $P(v)$; ב-$T_r = 0.9$ הם נמצאים ב-$v_r = 0.72$ וב-$1.53$. תארו מה קורה להם כאשר $T$ עולה ל-$T_c$, והסבירו מדוע, בטמפרטורה שבה הם נפגשים, גם $(\partial P/\partial v)_T$ וגם $(\partial^2 P/\partial v^2)_T$ מתאפסות בנקודת המפגש.
      (ב) טיעון שני, מהשיפוע בלבד: מעל $T_c$ השיפוע $(\partial P/\partial v)_T$ שלילי בכל מקום, וב-$T_c$ הוא אינו חיובי בשום מקום ומגיע ל-$0$ בנפח אחד. מדוע הנגזרת השנייה חייבת להתאפס שם? איזה סימן חייב להיות לנגזרת השלישית, ומדוע הנקודה הקריטית אינה יכולה להיות מקסימום פשוט של $P(v)$?
      (ג) פתחו את המשוואה המצומצמת $P_r = 8T_r/(3v_r - 1) - 3/v_r^2$ על האיזותרמה הקריטית סביב $v_r = 1$, עד סדר שלישי, ובדקו את הפיתוח ב-$v_r = 1.1$.
      (ד) הראו שליד $v_r = 1$, השיפוע המתון ביותר של איזותרמה שנמצאת מעט מעל $T_c$, כלומר הערך הקטן ביותר של $-\partial P_r/\partial v_r$ שם, קרוב ל-$6(T_r - 1)$. לכן סריקה שיורדת מטמפרטורות גבוהות ועוצרת באיזותרמה הראשונה שהשיפוע המתון ביותר שלה יורד מתחת לסף $\varepsilon$ עוצרת מעל $T_c$. בכמה? מדוע רשת טמפרטורות צפופה יותר אינה מסלקת את השגיאה, ומה כן מסלק אותה?
    answer: >-
      (א) הם נעים זה לעבר זה ומתמזגים ב-$v_c$; הקטע העולה שביניהם מתכווץ לנקודה. כששני אפסים של $\partial P/\partial v$ מתמזגים לאפס כפול, $\partial P/\partial v$ והנגזרת שלה מתאפסות יחד. (ב) לשיפוע יש ערך מרבי, $0$, ב-$v_c$: מקסימום פנימי של השיפוע, ולכן הנגזרת שלו $\partial^2P/\partial v^2$ מתאפסת ו-$\partial^3P/\partial v^3 < 0$. מקסימום פשוט של $P$ היה מחייב קטע עולה על האיזותרמה הקריטית עצמה. (ג) $P_r \approx 1 - \tfrac32(v_r - 1)^3$; ב-$v_r = 1.1$, $0.99850$ לעומת הערך המדויק $0.99892$. (ד) $-\partial P_r/\partial v_r = 6(T_r - 1)$ ב-$v_r = 1$, והמינימום המקומי שלו הוא $0.058$ ב-$T_r = 1.01$; הסריקה עוצרת ב-$T_r \approx 1 + \varepsilon/6$, גבוה מדי ב-$\varepsilon T_c/6$, תהיה הרשת אשר תהיה. מהדקים את $\varepsilon$ יחד עם הרשת, או ממשיכים את השיפוע המתון ביותר באקסטרפולציה ליניארית עד אפס.
    solution:
      - kind: law
        text: >-
          הנקודה הקריטית מוגדרת על ידי $(\partial P/\partial v)_T = 0$ ו-$(\partial^2P/\partial v^2)_T = 0$ על האיזותרמה הקריטית; מעל $T_c$ כל איזותרמה יורדת בכל מקום, ומתחתיה יש קטע שבו היא עולה. לוח המדידות של איור 2.1ב מדווח על השיפוע המתון ביותר, הערך הקטן ביותר של $-\partial P_r/\partial v_r$.
      - kind: reasoning
        text: >-
          (א) המינימום והמקסימום המקומיים הם שני הנפחים שבהם $\partial P/\partial v = 0$ (ב-$T_r = 0.9$, $v_r = 0.719$ ו-$1.529$; ב-$0.95$, $0.787$ ו-$1.330$; ב-$0.99$, $0.895$ ו-$1.128$). כש-$T$ עולה הם מתקרבים זה לזה, וב-$T_c$ הם נפגשים ב-$v_c$. שני אפסים פשוטים של פונקציה חלקה שמתמזגים הופכים לאפס כפול אחד, ואפס כפול של פונקציה הוא גם אפס של הנגזרת שלה: $\partial P/\partial v = 0$ ו-$\partial^2P/\partial v^2 = 0$ באותה נקודה. צמד התנאים שבהגדרה הוא בדיוק "המינימום והמקסימום התמזגו".
      - kind: reasoning
        text: >-
          (ב) נכתוב $s(v) = (\partial P/\partial v)_T$. מעל $T_c$, $s < 0$ בכל מקום; מתחתיה, $s > 0$ במקום כלשהו. מרציפות, ב-$T_c$ עצמה $s \le 0$ בכל מקום ו-$s = 0$ ב-$v_c$. לכן ל-$s$ יש מקסימום פנימי ב-$v_c$: הנגזרת שלו מתאפסת, $\partial^2P/\partial v^2 = 0$, והנגזרת השנייה שלו שלילית (או אפס), $\partial^3P/\partial v^3 \le 0$, ובגז ואן דר ואלס היא שלילית ממש. אז $P - P_c \approx \tfrac16\,\partial^3P/\partial v^3\,(v - v_c)^3$: האיזותרמה עוברת דרך הנקודה הקריטית בירידה, שטוחה לרגע, נקודת פיתול עם משיק אופקי. מקסימום פשוט של $P$ היה מחייב $s > 0$ ממש לפני $v_c$: קטע עולה על האיזותרמה הקריטית עצמה, שמקומו רק מתחת ל-$T_c$.
      - kind: manipulation
        text: >-
          (ג) ב-$T_r = 1$, עם $f(v) = 8/(3v - 1) - 3/v^2$: $f' = -24/(3v - 1)^2 + 6/v^3$, $f'' = 144/(3v - 1)^3 - 18/v^4$, $f''' = -1296/(3v - 1)^4 + 72/v^5$. ב-$v = 1$: $f = 1$, $f' = -6 + 6 = 0$, $f'' = 18 - 18 = 0$, $f''' = -81 + 72 = -9$. (ד) $-\partial P_r/\partial v_r = 24T_r/(3v_r - 1)^2 - 6/v_r^3$, שב-$v_r = 1$ שווה ל-$6T_r - 6$. ליד $T_c$ המינימום על פני $v_r$ נמצא קרוב ל-$v_r = 1$, ונבדל מהערך הזה רק בסדר גבוה יותר.
      - kind: formula
        text: >-
          $P_r \approx 1 - \tfrac32\,(v_r - 1)^3 \qquad \min\left(-\dfrac{\partial P_r}{\partial v_r}\right) \approx 6\,(T_r - 1) \qquad \Delta T \approx \dfrac{\varepsilon\,T_c}{6}$
      - kind: limit
        text: >-
          כאשר $T_r \to 1$ השיפוע המתון ביותר שואף ל-$0$ באופן ליניארי, ולכן סף $\varepsilon \to 0$ עוצר את הסריקה בדיוק ב-$T_c$. כש-$\varepsilon$ קבוע, עידון הרשת גורם לנקודת העצירה להתכנס, אבל ל-$T_c(1 + \varepsilon/6)$, לא ל-$T_c$; פס השגיאה של חצי צעד רשת קטן אז אל מתחת להטיה, והתוצאה נראית ודאית יותר בזמן שהיא נשארת שגויה. זו המלכודת שהשיעור מתאר בסריקה של ThermoLab עבור CO₂.
      - kind: substitution
        text: >-
          (ג) ב-$v_r = 1.1$: הערך המדויק $8/2.3 - 3/1.21 = 3.47826 - 2.47934 = 0.99892$; הפיתוח מסדר שלישי $1 - 1.5 \times 0.001 = 0.99850$. (ד) נומרית, המינימום המקומי של $-\partial P_r/\partial v_r$ הוא $0.00598$ ב-$T_r = 1.001$ ($v_r = 1.002$), $0.0582$ ב-$1.01$ ($v_r = 1.021$), $0.113$ ב-$1.02$, לעומת $6(T_r - 1) = 0.006$, $0.060$, $0.120$. עבור CO₂ ($T_c = 304.13\,\text{K}$) סף $\varepsilon = 0.01$ עוצר את הסריקה כ-$0.5\,\text{K}$ גבוה מדי.
      - kind: result
        text: >-
          (א) המינימום והמקסימום מתמזגים ב-$v_c$, וזוג אפסים של השיפוע שהתמזגו הוא גם אפס של הנגזרת שלו. (ב) ב-$T_c$ השיפוע לעולם אינו חיובי ונוגע באפס ב-$v_c$, ולכן העקמומיות מתאפסת שם והנגזרת השלישית שלילית: נקודת פיתול בירידה, לעולם לא מקסימום. (ג) $P_r \approx 1 - \tfrac32(v_r - 1)^3$. (ד) סף קבוע מטה את ההערכה כלפי מעלה ב-$\varepsilon T_c/6$; רק הקטנת $\varepsilon$ יחד עם הרשת, או אקסטרפולציה של השיפוע עד אפס, מסלקות את ההטיה.

  - id: W-2.1-05
    level: mid
    objectives: [OBJ-2.1-4, OBJ-2.1-6]
    prompt: >-
      האם ואן דר ואלס תמיד טוב יותר מהחוק האידיאלי? נתוני הייחוס של NIST נותנים לחנקן ב-$300\,\text{K}$ את הנפחים המולריים האלה: $2490.4\,\text{cm}^3/\text{mol}$ ב-$1.00\,\text{MPa}$; $497.18$ ב-$5.00$; $250.74$ ב-$10.0$; $131.81$ ב-$20.0$; $95.03$ ב-$30.0$; $68.04$ ב-$50.0\,\text{MPa}$. הנקודה הקריטית של חנקן היא $T_c = 126.19\,\text{K}$, $P_c = 3.3958\,\text{MPa}$.
      (א) מצאו את קבועי ואן דר ואלס של חנקן, לחלקיק ולמול, מתוך הנקודה הקריטית שלו.
      (ב) לכל נתון חשבו את $Z$, ואחר כך את הלחץ האידיאלי ואת לחץ ואן דר ואלס בנפח שנמדד, ואת השגיאה של כל אחד מהם. באיזה תחום כל מודל נמצא בתוך $1\%$?
      (ג) ב-$10.0\,\text{MPa}$, פרקו את לחץ ואן דר ואלס ללחץ האידיאלי, לעלייה שנובעת מ-$b$ ולירידה שנובעת מ-$a$. הסבירו משני האיברים מדוע ה-$Z$ של המודל יורד תחילה אל מתחת ל-$1$ כשהגז נדחס, ואחר כך עולה מעליו.
      (ד) עד $20\,\text{MPa}$ החוק האידיאלי מנצח כאן את ואן דר ואלס, אף שעבור CO₂ ב-$280\,\text{K}$ היה ההפך. העריכו את מקדם הוויריאל השני $B$ מהנתון ב-$1\,\text{MPa}$, השוו אותו ל-$b - a/(k_BT)$ של המודל, והסבירו מה קובע את האיזון של המודל בין משיכה לגודל.
    answer: >-
      (א) $b = 6.413 \times 10^{-29}\,\text{m}^3$, $a = 3.771 \times 10^{-49}\,\text{Pa}\,\text{m}^6$; למול $38.62\,\text{cm}^3/\text{mol}$ ו-$0.1368\,\text{Pa}\,\text{m}^6/\text{mol}^2$. (ב) $Z = 0.9984$, $0.9966$, $1.0052$, $1.0568$, $1.1430$, $1.3639$; שגיאות החוק האידיאלי $+0.16$, $+0.34$, $-0.52$, $-5.4$, $-12.5$, $-26.7\%$; של ואן דר ואלס $-0.47$, $-2.3$, $-4.2$, $-5.5$, $-3.1$, $+10.5\%$. החוק האידיאלי בתוך $1\%$ עד $10\,\text{MPa}$; ואן דר ואלס רק ב-$1\,\text{MPa}$. (ג) $9.948 + 1.811 - 2.175 = 9.584\,\text{MPa}$; חלקה של המשיכה גדל כמו $1/v^2$, והיא גוברת בצפיפות בינונית, בעוד $v/(v - b)$ מתבדר כאשר $v \to b$ וגובר כשהגז צפוף. (ד) נמדד $B \approx -4\,\text{cm}^3/\text{mol}$; זה של המודל, $38.6 - 54.8 = -16.2\,\text{cm}^3/\text{mol}$, שלילי מדי פי ארבעה. התאמת $a$ ו-$b$ לנקודה הקריטית קובעת $T_B = \tfrac{27}{8}T_c = 426\,\text{K}$, בעוד חנקן ממשי ב-$300\,\text{K}$ כבר קרוב לטמפרטורת בויל שלו.
    solution:
      - kind: given
        text: >-
          $T = 300\,\text{K}$, $k_BT = 4.142 \times 10^{-21}\,\text{J}$; $T_c = 126.19\,\text{K}$, $P_c = 3.3958\,\text{MPa}$; שישה זוגות $(P, V_\mathrm{m})$; $v = V_\mathrm{m}/N_A$.
      - kind: law
        text: >-
          משוואת ואן דר ואלס עם קבועים שנקבעו מהנקודה הקריטית, $b = k_BT_c/(8P_c)$, $a = 27(k_BT_c)^2/(64P_c)$; מקדם הדחיסות $Z = Pv/(k_BT)$; ובסדר ראשון בצפיפות, $Z \approx 1 + B/v$, עם $B = b - a/(k_BT)$ במודל.
      - kind: formula
        text: >-
          $P = \dfrac{k_BT}{v} + \underbrace{\dfrac{k_BT}{v}\,\dfrac{b}{v - b}}_{b} - \underbrace{\dfrac{a}{v^2}}_{a} \qquad Z = \dfrac{v}{v - b} - \dfrac{a}{k_BTv} \qquad B \approx (Z - 1)\,V_\mathrm{m}$
      - kind: limit
        text: >-
          כאשר $v \to \infty$ שני האיברים הנוספים נעלמים ביחס לאיבר האידיאלי, איבר ה-$b$ כמו $b/v$ ואיבר ה-$a$ כמו $a/(k_BTv)$: שניהם מסדר ראשון בצפיפות, וההפרש ביניהם הוא $B/v$. בצפיפות גבוהה יותר איבר ה-$a$ ממשיך לגדול כמו $1/v$ ביחס לאיבר האידיאלי, בעוד $b/(v - b)$ גדל בלי גבול כאשר $v \to b$: הנפח המודר חייב לגבור בסוף.
      - kind: units
        text: >-
          $b$: $\text{J}/\text{Pa} = \text{m}^3$; $a$: $\text{J}^2/\text{Pa} = \text{J}\,\text{m}^3 = \text{Pa}\,\text{m}^6$. למול, מכפילים את $b$ ב-$N_A$ ואת $a$ ב-$N_A^2$. $B$ הוא נפח מולרי, כמו $V_\mathrm{m}$.
      - kind: substitution
        text: >-
          (א) $k_BT_c = 1.7423 \times 10^{-21}\,\text{J}$; $b = 6.413 \times 10^{-29}\,\text{m}^3$ ($38.62\,\text{cm}^3/\text{mol}$), $a = 3.771 \times 10^{-49}\,\text{Pa}\,\text{m}^6$ ($0.1368\,\text{Pa}\,\text{m}^6/\text{mol}^2$). (ב) עם $RT = 2494.3\,\text{J/mol}$, הלחצים האידיאליים $RT/V_\mathrm{m}$: $1.002$, $5.017$, $9.948$, $18.924$, $26.247$, $36.660\,\text{MPa}$; ואן דר ואלס: $0.995$, $4.886$, $9.584$, $18.896$, $29.074$, $55.248\,\text{MPa}$; $Z = PV_\mathrm{m}/(RT)$ כמו בתשובה. (ג) ב-$250.74\,\text{cm}^3/\text{mol}$, $b/v = 0.154$: הנפח המודר מוסיף $9.948 \times 0.154/0.846 = 1.811\,\text{MPa}$; $a/v^2 = 2.175\,\text{MPa}$. (ד) $Z(1\,\text{MPa}) = 0.998405$, $B \approx -0.001595 \times 2490.4 = -3.97\,\text{cm}^3/\text{mol}$; במודל $a_\mathrm{m}/(RT) = 54.8\,\text{cm}^3/\text{mol}$, ולכן $B = -16.2\,\text{cm}^3/\text{mol}$.
      - kind: reasoning
        text: >-
          (ג) לאורך האיזותרמה ה-$Z$ של המודל יורד למינימום של $0.963$ ליד $240\,\text{cm}^3/\text{mol}$ וחוזר ל-$1$ ב-$131\,\text{cm}^3/\text{mol}$, ולכן ב-$20\,\text{MPa}$ ($131.81\,\text{cm}^3/\text{mol}$) לחץ ואן דר ואלס והלחץ האידיאלי כמעט מתלכדים; בצפיפות גבוהה עוד יותר הנפח המודר שולט. חנקן ממשי עושה אותו דבר, אבל אצלו הירידה היא רק ל-$0.996$, ליד $4\,\text{MPa}$, והוא חוזר ל-$1$ כבר ב-$7.9\,\text{MPa}$. (ד) קבועי ואן דר ואלס נבחרו כך שהנקודה הקריטית תהיה במקום הנכון, וזה קובע את $a/b$, ומכאן את טמפרטורת בויל $a/(k_Bb) = \tfrac{27}{8}T_c$, לכל גז ואן דר ואלס. ב-$300\,\text{K}$ גז המודל נמצא הרבה מתחת ל-$426\,\text{K}$ שלו, והמשיכה שלו גוברת על הגודל שלו; חנקן ממשי ב-$300\,\text{K}$ כמעט איזן ביניהם. קרוב ל-$T_c$, שם הותאמו הקבועים, המודל מצליח (CO₂ ב-$T_r = 0.92$); ב-$T_r = 2.4$ הוא מכויל במקום הלא נכון.
      - kind: result
        text: >-
          (א) $a_\mathrm{m} = 0.1368\,\text{Pa}\,\text{m}^6/\text{mol}^2$, $b_\mathrm{m} = 38.62\,\text{cm}^3/\text{mol}$. (ב) החוק האידיאלי בתוך $1\%$ עד $10\,\text{MPa}$; ואן דר ואלס בתוך $1\%$ רק ב-$1\,\text{MPa}$, טוב מהחוק האידיאלי רק מ-$30\,\text{MPa}$, וגבוה ב-$10\%$ ב-$50\,\text{MPa}$. (ג) $9.948 + 1.811 - 2.175 = 9.584\,\text{MPa}$: המשיכה גוברת בצפיפות בינונית, הנפח המודר כשהגז צפוף. (ד) נמדד $B \approx -4\,\text{cm}^3/\text{mol}$, לעומת $-16\,\text{cm}^3/\text{mol}$ במודל: שני קבועים שהותאמו בנקודה הקריטית אינם יכולים לקלוע גם לאיזון הנכון ב-$2.4\,T_c$. טוב יותר ליד $T_c$ אין פירושו טוב יותר בכל מקום.

  - id: W-2.1-06
    level: mid
    objectives: [OBJ-2.1-6, OBJ-2.1-4]
    prompt: >-
      פיתוח הוויריאל של גז ואן דר ואלס, וטמפרטורת בויל שלו. נסמן $x = b/v$ ו-$\tau = a/(bk_BT)$.
      (א) הראו ש-$Z = 1/(1 - x) - \tau x$, ופתחו את $Z$ לטור חזקות ב-$1/v$. מצאו את כל מקדמי הוויריאל.
      (ב) מצאו את טמפרטורת בויל $T_B$, שבה המקדם השני מתאפס, במונחי $a$ ו-$b$ ובמונחי $T_c$, וכתבו את $B/v_c$ כפונקציה של $T_r$.
      (ג) הראו שב-$T_B$, $Z = 1 + x^2/(1 - x)$ בדיוק. מה זה אומר על $Z - 1$ בטמפרטורת בויל, בכל צפיפות?
      (ד) מתחת ל-$T_B$, מצאו את הנפח שבו $Z$ חוזר ל-$1$, ואת המינימום של $Z$ לאורך האיזותרמה, עם הנפח שבו הוא מתקבל.
      (ה) בדקו את (ד) מול איור 2.1ב ב-$T_r = 1.2$, שם $Z$ יורד ל-$0.54$ ליד $v_r = 0.83$. אחר כך מצאו את הטמפרטורה המצומצמת שבה איזותרמת ואן דר ואלס מגיעה לראשונה ללחץ אפס.
    answer: >-
      (א) $Z = 1 + (b - a/k_BT)/v + b^2/v^2 + b^3/v^3 + \cdots$: $B = b - a/(k_BT)$, והמקדם ה-$n$-י הוא $b^{n-1}$ עבור $n \ge 3$. (ב) $k_BT_B = a/b = \tfrac{27}{8}k_BT_c$; $B/v_c = \tfrac13\big(1 - 27/(8T_r)\big)$. (ג) $Z - 1 = x^2/(1 - x) \ge 0$: לעולם לא מתחת ל-$1$, ורק מסדר שני בצפיפות. (ד) $Z = 1$ ב-$v = b/(1 - T/T_B)$; $Z_\mathrm{min} = 1 - (\sqrt\tau - 1)^2$ ב-$v = b/(1 - \tau^{-1/2})$. (ה) $Z_\mathrm{min} = 0.542$ ב-$v_r = 0.826$, כפי שהאיור מראה; לחץ אפס לראשונה ב-$\tau = 4$, $T_r = 27/32 = 0.844$.
    solution:
      - kind: law
        text: >-
          משוואת ואן דר ואלס $P = k_BT/(v - b) - a/v^2$, ופיתוח הוויריאל $Z = 1 + B(T)/v + C(T)/v^2 + \cdots$, המוגדר כטור החזקות של $Z$ בצפיפות.
      - kind: manipulation
        text: >-
          (א) $Z = Pv/(k_BT) = v/(v - b) - a/(k_BTv) = 1/(1 - x) - \tau x$. הטור ההנדסי $1/(1 - x) = 1 + x + x^2 + \cdots$ נותן $Z = 1 + (1 - \tau)x + x^2 + x^3 + \cdots$, ו-$(1 - \tau)x = (b - a/k_BT)/v$. (ג) ב-$\tau = 1$: $1/(1 - x) - x = (1 - x + x^2)/(1 - x) = 1 + x^2/(1 - x)$. (ד) $Z - 1 = x/(1 - x) - \tau x = 0$ ב-$x = 1 - 1/\tau$. $\mathrm{d}Z/\mathrm{d}x = 1/(1 - x)^2 - \tau = 0$ ב-$1 - x = \tau^{-1/2}$, ושם $Z = \sqrt\tau - \tau(1 - \tau^{-1/2}) = 2\sqrt\tau - \tau$.
      - kind: formula
        text: >-
          $B = b - \dfrac{a}{k_BT} \qquad k_BT_B = \dfrac ab = \dfrac{27}{8}\,k_BT_c \qquad v_{Z=1} = \dfrac{b}{1 - T/T_B} \qquad Z_\mathrm{min} = 1 - \left(\sqrt{\dfrac{T_B}{T}} - 1\right)^2$
      - kind: limit
        text: >-
          ב-$T = T_B$ ($\tau = 1$) המינימום עובר ל-$x = 0$, $Z_\mathrm{min} = 1$, ונקודת החצייה של $Z = 1$ עוברת לנפח אינסופי: שוב (ג). כאשר $T \to \infty$ ($\tau \to 0$), $Z = 1/(1 - x)$, כדורים קשיחים בלי משיכה, מעל $1$ בכל מקום. כאשר $v \to b$ ($x \to 1$), $Z \to \infty$ בכל טמפרטורה: הנפח המודר תמיד גובר כשהגז צפוף מספיק.
      - kind: units
        text: >-
          $x = b/v$ הוא יחס בין נפחים, ו-$\tau = a/(bk_BT)$ הוא $(\text{J}\,\text{m}^3)/(\text{m}^3\cdot\text{J})$: שניהם מספרים טהורים, ולכן גם $Z$. ל-$B$ יש היחידות של $b$, נפח.
      - kind: substitution
        text: >-
          (ב) עם $v_c = 3b$ ו-$a/(bk_BT) = \tfrac{27}{8}T_c/T$: $B/v_c = \tfrac13(1 - 27/(8T_r))$, שלילי מתחת ל-$T_r = 3.375$. (ג) ב-$v_r = 5$, $x = 1/15$: $Z = 1 + (1/225)/(14/15) = 1.0048$. (ה) ב-$T_r = 1.2$: $\tau = 27/9.6 = 2.8125$, $\sqrt\tau = 1.6771$; $Z_\mathrm{min} = 1 - 0.6771^2 = 0.542$ ב-$x = 1 - 1/1.6771 = 0.4037$, $v_r = 1/(3x) = 0.826$; $Z = 1$ שוב ב-$x = 0.6444$, $v_r = 0.517$. לחץ אפס: $Z_\mathrm{min} = 0$ כאשר $\sqrt\tau = 2$, $\tau = 4$, $T = T_B/4$, $T_r = 27/32 = 0.844$. בדיקה: $P_r = 0$ היא המשוואה $8T_rv_r^2 - 9v_r + 3 = 0$, שהדיסקרימיננטה שלה $81 - 96T_r$ מתאפסת ב-$T_r = 27/32$.
      - kind: result
        text: >-
          (א) $B = b - a/(k_BT)$, וכל מקדם גבוה יותר הוא חזקה של $b$: המשיכה נכנסת רק בסדר הראשון. (ב) $T_B = a/(k_Bb) = 3.375\,T_c$. (ג) ב-$T_B$, $Z = 1 + x^2/(1 - x)$, לעולם לא מתחת ל-$1$. (ד) מתחת ל-$T_B$, $Z$ חוזר ל-$1$ ב-$v = b/(1 - T/T_B)$, וערכו הנמוך ביותר הוא $1 - (\sqrt{T_B/T} - 1)^2$. (ה) $0.542$ ב-$v_r = 0.826$ עבור $T_r = 1.2$; האיזותרמה הראשונה שנוגעת ב-$P = 0$ היא $T_r = 27/32 = 0.844$, ולכן ב-$T_r = 0.8$ ההתפתלות יורדת אל מתחת לאפס.

  - id: W-2.1-07
    level: bagrut
    objectives: [OBJ-2.1-2, OBJ-2.1-4, OBJ-2.1-6]
    prompt: >-
      שאלת האתגר של ThermoLab: גודלה של מולקולה, וניתוח ממדי, הלאה מדוגמה 5.
      (א) הציבו $N$ כדורים קשיחים בקוטר $d$ בנפח $V$, אחד אחד. בגז דליל, מרכזו של הכדור ה-$k$-י יכול להימצא בכל מקום פרט לתוך $k - 1$ הכדורים ברדיוס $d$ סביב המרכזים שכבר הוצבו, כל אחד מהם בנפח $\Omega = \tfrac43\pi d^3$. הראו שמכפלת הנפחים העומדים לרשות $N$ המרכזים שווה, בסדר ראשון ב-$N\Omega/V$, ל-$(V - Nb)^N$ עם $b = \tfrac23\pi d^3$. מאין בא החצי? מי מבין $b$ ו-$Nb$ אינטנסיבי?
      (ב) עבור CO₂, $d \approx 3.3 \times 10^{-10}\,\text{m}$ נותן $b = 7.5 \times 10^{-29}\,\text{m}^3$, לעומת $7.1 \times 10^{-29}\,\text{m}^3$ מהנקודה הקריטית שלו (דוגמה 5). עכשיו ארגון: מתוך הנקודה הקריטית של NIST, $T_c = 150.687\,\text{K}$ ו-$P_c = 4.8630\,\text{MPa}$, מצאו את $b$ ואת הקוטר שנובע ממנו. NIST נותן לארגון נוזלי בנקודה המשולשת שלו, $83.806\,\text{K}$, צפיפות של $35.4653\,\text{mol/L}$. השוו את $d$ למרווח $(V/N)^{1/3}$ בין האטומים בנוזל הזה, ואת $b$ לנפח לאטום בנוזל. מה אתם מסיקים על קריאת $b$ כגודלה של מולקולה?
      (ג) בחנו את משוואת ואן דר ואלס איבר אחר איבר וודאו ש-$a$ חייב לשאת יחידות של $\text{Pa}\,\text{m}^6$ ו-$b$ יחידות של $\text{m}^3$. הסבירו במשפט אחד מדוע זה קובע את היחידות שלהם בלי לדעת את ערכו של אף אחד מהם.
      (ד) קחו את הטיעון הממדי הלאה. הקבועים היחידים של המשוואה הם $a$ ו-$b$, ו-$T$ נכנסת רק דרך האנרגיה $k_BT$. הראו ש-$v_c$, $k_BT_c$ ו-$P_c$ חייבים להיות $b$, $a/b$ ו-$a/b^2$ כפול מספרים טהורים, ומכאן ש-$Z_c$ זהה לכל גז ואן דר ואלס, עוד לפני כל אלגברה. מה מוסיפה האלגברה של השיעור? הנקודות הקריטיות של NIST נותנות $Z_c = 0.290$ לארגון ו-$0.229$ למים: מה זה אומר על כל משוואת מצב שיש בה רק שני קבועים?
    answer: >-
      (א) $\prod_k (V - k\Omega) \approx V^N e^{-N^2\Omega/(2V)} \approx (V - N\Omega/2)^N$: כל זוג מדיר את $\Omega$ פעם אחת, לא פעמיים, ולכן $b = \Omega/2 = \tfrac23\pi d^3$. $b$ אינטנסיבי, $Nb$ אקסטנסיבי. (ב) $b = 5.348 \times 10^{-29}\,\text{m}^3$ ($32.2\,\text{cm}^3/\text{mol}$), $d = 2.94 \times 10^{-10}\,\text{m}$; המרווח בנוזל הוא $3.60 \times 10^{-10}\,\text{m}$, והנפח לאטום בו $4.68 \times 10^{-29}\,\text{m}^3$, קטן ב-$14\%$ מ-$b$. המודל לא היה יכול להכיל את הנוזל של ארגון עצמו (הוא דורש $v > b$): $b$ קובע את גודלם של אטומים בדיוק של עשרות אחוזים, לא טוב מזה. (ג) $a/v^2$ הוא לחץ ו-$v - b$ הוא נפח. (ד) $v_c = c_1b$, $k_BT_c = c_2a/b$, $P_c = c_3a/b^2$, ולכן $Z_c = c_1c_3/c_2$, אותו מספר לכל גז ואן דר ואלס; האלגברה מספקת $c_1 = 3$, $c_2 = 8/27$, $c_3 = 1/27$, $Z_c = 3/8$. ערכי $Z_c$ ממשיים שונים מגז לגז, ולכן שום משוואה דו-קבועית מהסוג הזה אינה מתאימה לכולם: נדרש מספר שלישי, ייחודי לחומר.
    solution:
      - kind: law
        text: >-
          המרכזים של כדורים קשיחים בקוטר $d$ אינם יכולים להיות קרובים זה לזה יותר מ-$d$. בגז דליל הכדורים המודרים סביב מולקולות שונות כמעט אינם חופפים, ולכן הנפחים שלהם מצטרפים זה לזה. ניתוח ממדי: כל איבר של משוואה נושא אותן יחידות, וגודל שבנוי מהקבועים של מודל יכול להיות רק מספר טהור כפול הצירוף היחיד שלהם שיש לו את היחידות של הגודל.
      - kind: manipulation
        text: >-
          (א) $\ln\prod_{k=0}^{N-1}(V - k\Omega) = \sum_k \ln V + \sum_k \ln(1 - k\Omega/V) \approx N\ln V - \dfrac{\Omega}{V}\sum_k k = N\ln V - \dfrac{\Omega N^2}{2V}$, בסדר ראשון ב-$N\Omega/V$. ו-$N\ln(V - Nb) \approx N\ln V - N^2b/V$. השניים מסכימים כאשר $b = \Omega/2$. הסכום $\sum_k k = N^2/2$ סופר כל זוג פעם אחת: המולקולה המאוחרת בכל זוג משלמת את ההדרה, והמוקדמת לא. כשמחלקים זאת שווה בשווה, יוצא חצי כדור לכל מולקולה. הכפלת המערכת מכפילה את $N$ ואת $V$: $Nb$ מוכפל, $b$ לא. (ד) ב-$P = k_BT/(v - b) - a/v^2$, $[b] = \text{m}^3$ ו-$[a] = \text{J}\,\text{m}^3$. הנפח היחיד שאפשר לבנות מ-$a$ ומ-$b$ הוא $b$ עצמו (ב-$a$ יש ג'אולים); האנרגיה היחידה היא $a/b$; והלחץ היחיד, אנרגיה ליחידת נפח, הוא $a/b^2$.
      - kind: formula
        text: >-
          $b = \tfrac12 \cdot \tfrac43\pi d^3 \qquad d = \left(\dfrac{3b}{2\pi}\right)^{1/3} \qquad v_c = c_1 b,\ \ k_BT_c = c_2\,\dfrac ab,\ \ P_c = c_3\,\dfrac{a}{b^2} \qquad Z_c = \dfrac{P_cv_c}{k_BT_c} = \dfrac{c_1c_3}{c_2}$
      - kind: limit
        text: >-
          כאשר $d \to 0$, $b \to 0$: חלקיקים נקודתיים, הגז האידיאלי. התוצאה מסדר ראשון דורשת $N\Omega/V \ll 1$; כשהגז מתקרב לאריזה צפופה הכדורים המודרים חופפים, הנפח הזמין האמיתי קטן לאט יותר מ-$V - Nb$, והצורה הפשוטה נכשלת, וזו אחת הסיבות שנוזל צפוף מביס את המודל. ב-(ד), כל משוואה עם קבוע ממדי שלישי, למשל אורך שני, הייתה מאפשרת ל-$Z_c$ להיות תלוי ביחס בין שני האורכים ולהשתנות מגז לגז.
      - kind: units
        text: >-
          (ג) $a/v^2$ מופחת מלחץ, ולכן $[a] = \text{Pa}\cdot\text{m}^6$; $b$ מופחת מנפח לחלקיק, ולכן $[b] = \text{m}^3$. היחידות של האיברים נקבעות לפי צורת המשוואה, לא לפי המספרים שבה, ולכן הממדים קודמים לכל מדידה. $d$: $(\text{m}^3)^{1/3} = \text{m}$.
      - kind: substitution
        text: >-
          (ב) ארגון: $b = k_BT_c/(8P_c) = 1.380649 \times 10^{-23} \times 150.687/(8 \times 4.8630 \times 10^6) = 5.348 \times 10^{-29}\,\text{m}^3$, $32.20\,\text{cm}^3/\text{mol}$; $d = (3 \times 5.348 \times 10^{-29}/2\pi)^{1/3} = 2.94 \times 10^{-10}\,\text{m}$. הנוזל: $V_\mathrm{m} = 1/35.4653 = 28.20\,\text{cm}^3/\text{mol}$, $V/N = 4.682 \times 10^{-29}\,\text{m}^3$, מרווח של $3.60 \times 10^{-10}\,\text{m}$; $b/(V/N) = 1.14$. (ד) $Z_c = (1/27)(3)/(8/27) = 3/8$. NIST: ארגון $4.8630\,\text{MPa} \times 74.59\,\text{cm}^3/\text{mol}/(8.3145 \times 150.687\,\text{K}) = 0.290$; מים ($647.10\,\text{K}$, $22.064\,\text{MPa}$, $17.874\,\text{mol/L}$) $0.229$.
      - kind: reasoning
        text: >-
          (ב) שתי ההערכות של גודל אטום הארגון, $2.94$ ו-$3.60 \times 10^{-10}\,\text{m}$, מסכימות בתוך $20\%$, וההערכה של CO₂ בדוגמה 5 הסכימה בתוך $6\%$, אבל ההשוואה של ארגון חושפת את הגבול: ה-$b$ המותאם גדול מהנפח שיש בפועל לכל אטום בנוזל, ולכן ארגון של ואן דר ואלס לעולם לא היה יכול להידחס לצפיפות של הנקודה המשולשת שלו עצמו. $b$ הוא קבוע מותאם, שסופג גם את מה שהמודל מחמיץ (המשיכה בקירוב השדה הממוצע, ההדרה מסדר ראשון), ולא נפח מולקולרי מדוד; הוא נותן את סדר הגודל של מולקולה, באופן איתן, ולא יותר.
      - kind: result
        text: >-
          (א) $b = \tfrac23\pi d^3$: כל זוג מודר נספר פעם אחת; $b$ אינטנסיבי, $Nb$ אקסטנסיבי. (ב) ה-$b = 5.35 \times 10^{-29}\,\text{m}^3$ של ארגון נותן $d = 2.94 \times 10^{-10}\,\text{m}$, לעומת מרווח של $3.60 \times 10^{-10}\,\text{m}$ בנוזל, שהנפח לאטום בו קטן ב-$14\%$ מ-$b$: סדר הגודל הנכון, ולא יותר מזה. (ג) $[a] = \text{Pa}\,\text{m}^6$, $[b] = \text{m}^3$, מצורת המשוואה בלבד. (ד) הממדים לבדם נותנים $v_c \propto b$, $k_BT_c \propto a/b$, $P_c \propto a/b^2$ ו-$Z_c$ אוניברסלי; האלגברה נותנת את המספרים, $3$, $8/27$, $1/27$ ו-$3/8$. ערכי $Z_c$ נמדדים שבין $0.23$ ל-$0.29$ דורשים קבוע שלישי.

  - id: W-2.1-08
    level: bagrut
    objectives: [OBJ-2.1-4, OBJ-2.1-5]
    prompt: >-
      עד כמה דחיס זורם ליד הנקודה הקריטית שלו? הדחיסות האיזותרמית היא $\kappa_T = -\dfrac1v\left(\dfrac{\partial v}{\partial P}\right)_T$.
      (א) הראו ש-$\kappa_T = 1/P$ בגז אידיאלי, וגזרו את $\kappa_T$ בגז ואן דר ואלס.
      (ב) הראו שבנפח הקריטי, $v = v_c$, לגז ואן דר ואלס מעל $T_c$ יש $\kappa_TP_c = 1/\big(6(T_r - 1)\big)$.
      (ג) התייחסו ל-CO₂ כאל גז ואן דר ואלס שהותאם לנקודה הקריטית שלו ($T_c = 304.13\,\text{K}$, $P_c = 7.3773\,\text{MPa}$, נפח קריטי של המודל $128.5\,\text{cm}^3/\text{mol}$). מצאו את $\kappa_T$ ב-$v = v_c$ ב-$320\,\text{K}$ וב-$310\,\text{K}$, והשוו כל אחד לגז אידיאלי באותם $v$ ו-$T$. באיזה חלק מנפחו נדחס זורם המודל ב-$310\,\text{K}$ כשהלחץ עולה ב-$0.01\,\text{MPa}$?
      (ד) לפי השיפוע של האיזותרמות של NIST, ל-CO₂ ממשי בצפיפות הקריטית שלו עצמו ($10.6249\,\text{mol/L}$) יש $\kappa_T = 0.309\,\text{MPa}^{-1}$ ב-$320\,\text{K}$ ו-$0.984\,\text{MPa}^{-1}$ ב-$310\,\text{K}$. עד כמה המודל מצליח? האם $\kappa_T$ הממשי גדל כמו $1/(T - T_c)$?
      (ה) מתחת ל-$T_c$, בקטע האמצעי של לולאת ואן דר ואלס, $\kappa_T < 0$. מה זה היה אומר פיזיקלית, ומדוע שום מצב שם אינו יכול להיות יציב?
    answer: >-
      (א) אידיאלי: $v = k_BT/P$, $\kappa_T = 1/P$. ואן דר ואלס: $\kappa_T = \big[v\big(k_BT/(v - b)^2 - 2a/v^3\big)\big]^{-1}$. (ב) ב-$v = 3b$, $v\,\partial P/\partial v = -\tfrac34k_B(T - T_c)/b$, וזה נותן $\kappa_TP_c = 1/(6(T_r - 1))$. (ג) $0.433\,\text{MPa}^{-1}$ ב-$320\,\text{K}$ ו-$1.17\,\text{MPa}^{-1}$ ב-$310\,\text{K}$, לעומת $0.048$ ו-$0.050\,\text{MPa}^{-1}$ בגז אידיאלי: דחיס פי $9$ ופי $23$; $0.01\,\text{MPa}$ מכווצים אותו ב-$1.2\%$. (ד) המודל גבוה ב-$40\%$ וב-$19\%$, בסדר הגודל הנכון, היכן שהגז האידיאלי טועה פי $6$ ופי $20$. $\kappa_T$ הממשי גדל פי $3.19$ מ-$320$ ל-$310\,\text{K}$, מהר יותר מהגידול פי $2.70$ של $1/(T - T_c)$. (ה) דחיסה של אזור הייתה מורידה את הלחץ שלו, ולכן סביבתו הייתה דוחסת אותו עוד: כל פלוקטואציה קטנה מתגברת בלי מעצור.
    solution:
      - kind: given
        text: >-
          מודל CO₂: $b = k_BT_c/(8P_c)$, $v_c = 3b$, $128.5\,\text{cm}^3/\text{mol}$; $T_r = 320/304.13 = 1.0522$ ו-$310/304.13 = 1.0193$. NIST: $\kappa_T = 0.309$ ו-$0.984\,\text{MPa}^{-1}$ ב-$\rho_c = 10.6249\,\text{mol/L}$.
      - kind: law
        text: >-
          ההגדרה של $\kappa_T$, עם כלל ההופכי $(\partial v/\partial P)_T = 1/(\partial P/\partial v)_T$; משוואת ואן דר ואלס והנקודה הקריטית שלה, $v_c = 3b$, $k_BT_c = 8a/(27b)$, $P_c = a/(27b^2)$.
      - kind: manipulation
        text: >-
          (א) $\kappa_T = -1/\big(v\,(\partial P/\partial v)_T\big)$, ו-$(\partial P/\partial v)_T = -k_BT/(v - b)^2 + 2a/v^3$. אידיאלי ($a = b = 0$): $-v \cdot (-k_BT/v^2) = k_BT/v = P$. (ב) ב-$v = 3b$: $\partial P/\partial v = -k_BT/(4b^2) + 2a/(27b^3)$, ו-$2a/(27b^3) = k_BT_c/(4b^2)$, ולכן $\partial P/\partial v = -k_B(T - T_c)/(4b^2)$ ו-$\kappa_T = 4b/\big(3k_B(T - T_c)\big)$. הכפלה ב-$P_c = a/(27b^2)$ ושימוש ב-$a/b = \tfrac{27}{8}k_BT_c$ נותנים $\kappa_TP_c = 1/\big(6(T_r - 1)\big)$.
      - kind: formula
        text: >-
          $\kappa_T = \dfrac{1}{v\left(\dfrac{k_BT}{(v - b)^2} - \dfrac{2a}{v^3}\right)} \qquad \kappa_T\big|_{v_c} = \dfrac{4b}{3k_B(T - T_c)} = \dfrac{1}{6P_c(T_r - 1)}$
      - kind: limit
        text: >-
          כאשר $a, b \to 0$ הנוסחה מחזירה $1/P$. ב-$v$ גדול איבר ה-$a$ דועך כמו $v^{-3}$ לעומת $v^{-2}$, והגז נעשה אידיאלי. כאשר $T \to T_c^+$ ב-$v_c$, $\kappa_T \to \infty$: על האיזותרמה הקריטית השיפוע ב-$v_c$ הוא אפס, והזורם נכנע בלי גבול לדחיפה הקטנה ביותר. $\kappa_T$ אינטנסיבי, בנוי מ-$v$, $T$, $P$.
      - kind: units
        text: >-
          $\kappa_T$: $1/(\text{m}^3 \cdot \text{J}/\text{m}^6) = \text{m}^3/\text{J} = \text{Pa}^{-1}$; $\kappa_TP_c$ הוא מספר טהור. ב-$4b/(3k_B(T - T_c))$: $\text{m}^3/\text{J} = \text{Pa}^{-1}$.
      - kind: substitution
        text: >-
          (ג) ב-$320\,\text{K}$: $\kappa_TP_c = 1/(6 \times 0.05218) = 3.194$, $\kappa_T = 3.194/7.3773 = 0.433\,\text{MPa}^{-1}$; אידיאלי $P = RT/V_\mathrm{m} = 8.3145 \times 320/128.5 \times 10^{-6} = 20.71\,\text{MPa}$, $\kappa_T = 0.0483\,\text{MPa}^{-1}$, יחס $9.0$. ב-$310\,\text{K}$: $\kappa_TP_c = 8.635$, $\kappa_T = 1.17\,\text{MPa}^{-1}$; אידיאלי $20.06\,\text{MPa}$, $0.0499\,\text{MPa}^{-1}$, יחס $23.5$. עלייה של $0.01\,\text{MPa}$: $\Delta v/v = -1.17 \times 0.01 = -1.2\%$. (ד) $0.433/0.309 = 1.40$; $1.17/0.984 = 1.19$. היחס הממשי $0.984/0.309 = 3.19$; $(320 - 304.13)/(310 - 304.13) = 15.87/5.87 = 2.70$.
      - kind: reasoning
        text: >-
          (ד) המודל תופס את גודל האפקט, שהחוק האידיאלי מחמיץ בסדר גודל. העודף שלו קטן מ-$40\%$ ב-$320\,\text{K}$ ל-$19\%$ ב-$310\,\text{K}$, כי הדחיסות הממשית מטפסת מהר יותר ככל ש-$T_c$ מתקרבת, והמגמה הזו היא ההבדל העמוק יותר. אם $\kappa_T \propto (T - T_c)^{-\gamma}$, שתי הנקודות של NIST נותנות $\gamma = \ln 3.19/\ln 2.70 = 1.17$, לא $1$: CO₂ ממשי נעשה דחיס מהר יותר מכל גז ואן דר ואלס ככל ש-$T_c$ מתקרבת. (ה) $\kappa_T < 0$ פירושו $(\partial P/\partial v)_T > 0$: אזור שנלחץ מעט מאבד לחץ, ולכן הזורם שסביבו, שעכשיו בלחץ גבוה יותר, לוחץ אותו עוד, ואזור שמתפשט צובר לחץ ומתפשט עוד. שום דבר אינו מחזיר את המצב ההתחלתי, ולכן זורם שם אינו יכול להישאר אחיד; הוא נפרד, ולאן הוא מגיע בסוף זו השאלה של מודול 14.
      - kind: result
        text: >-
          (א) $\kappa_T = 1/P$ בגז אידיאלי; $\kappa_T = [v(k_BT/(v - b)^2 - 2a/v^3)]^{-1}$ בגז ואן דר ואלס. (ב) $\kappa_TP_c = 1/(6(T_r - 1))$ ב-$v_c$. (ג) $0.433$ ו-$1.17\,\text{MPa}^{-1}$, פי $9$ ופי $23$ מהערך האידיאלי; $1.2\%$ לכל $0.01\,\text{MPa}$. (ד) המודל בתוך $20$ עד $40\%$ מ-NIST, אבל הדחיסות של CO₂ ממשי גדלה מהר יותר מ-$1/(T - T_c)$. (ה) דחיסות שלילית מגבירה כל פלוקטואציה: אין מצב אחיד יציב.

  - id: W-2.1-09
    level: bagrut
    objectives: [OBJ-2.1-6, OBJ-2.1-3, OBJ-2.1-4]
    prompt: >-
      מקדם הוויריאל השני וטמפרטורת בויל של ארגון, מתוך נתונים. NIST נותן לארגון ב-$1.000\,\text{MPa}$ את הצפיפויות האלה, ב-$\text{mol/L}$: $0.864906$ ב-$150\,\text{K}$; $0.619374$ ב-$200\,\text{K}$; $0.403305$ ב-$300\,\text{K}$; $0.300732$ ב-$400\,\text{K}$; $0.240128$ ב-$500\,\text{K}$; $0.199972$ ב-$600\,\text{K}$. הנקודה הקריטית של ארגון היא $T_c = 150.687\,\text{K}$, $P_c = 4.8630\,\text{MPa}$.
      (א) הראו שבסדר ראשון בצפיפות $B \approx (Z - 1)V_\mathrm{m}$. העריכו את השגיאה שזה גורם, בהינתן שמקדם הוויריאל השלישי של ארגון הוא כ-$2 \times 10^3\,\text{cm}^6/\text{mol}^2$ ב-$150\,\text{K}$, וקטן יותר בטמפרטורות גבוהות יותר.
      (ב) חשבו את $Z$ ואת $B$ בכל טמפרטורה. כמה רחוק ארגון ב-$1\,\text{MPa}$ מאידיאלי, בכל אחת מהן?
      (ג) מצאו את טמפרטורת בויל באינטרפולציה ליניארית, והשוו אותה לניבוי של ואן דר ואלס, $\tfrac{27}{8}T_c$.
      (ד) חשבו את $B(T) = b - a/(k_BT)$ של ואן דר ואלס עם קבועים מהנקודה הקריטית, והשוו ל-(ב) ב-$200$, $300$ ו-$500\,\text{K}$.
      (ה) התאימו את צורת ואן דר ואלס $B = b' - a'/(k_BT)$ ל-$B$ הנמדד ב-$200$ וב-$600\,\text{K}$ בלבד. איזו טמפרטורה קריטית $a'$ ו-$b'$ חוזים? מה זה אומר על טבעם של $a$ ו-$b$?
    answer: >-
      (א) $Z - 1 = B/V_\mathrm{m} + C/V_\mathrm{m}^2 + \cdots$, ולכן $(Z - 1)V_\mathrm{m} = B + C/V_\mathrm{m}$; השגיאה $C\rho$ היא כ-$2\,\text{cm}^3/\text{mol}$ ב-$150\,\text{K}$, ופחות מעל זה. (ב) $Z = 0.9271$, $0.9709$, $0.9941$, $0.9998$, $1.0017$, $1.0024$; $B = -84.3$, $-47.0$, $-14.7$, $-0.6$, $+7.2$, $+12.1\,\text{cm}^3/\text{mol}$. ארגון רחוק מאידיאלי ב-$7.3\%$ ב-$150\,\text{K}$, ב-$0.6\%$ ב-$300\,\text{K}$, ובפחות מ-$0.25\%$ מעל זה. (ג) $T_B \approx 407\,\text{K} = 2.70\,T_c$, לעומת $509\,\text{K} = 3.375\,T_c$ לפי ואן דר ואלס, גבוה ב-$25\%$. (ד) $-49.7$, $-22.4$, $-0.5\,\text{cm}^3/\text{mol}$ לעומת $-47.0$, $-14.7$, $+7.2$. (ה) $a'_\mathrm{m} = 0.147\,\text{Pa}\,\text{m}^6/\text{mol}^2$, $b'_\mathrm{m} = 41.6\,\text{cm}^3/\text{mol}$, שחוזים $T_c = 126\,\text{K}$, נמוך ב-$16\%$: שום זוג קבועים יחיד אינו מתאים גם לנקודה הקריטית וגם ל-$B(T)$.
    solution:
      - kind: given
        text: >-
          $P = 1.000 \times 10^6\,\text{Pa}$; $RT = 8.3145\,T\,\text{J/mol}$; $\rho$ כמו בטבלה, $V_\mathrm{m} = 1/\rho$. קבועי ואן דר ואלס מהנקודה הקריטית: $a_\mathrm{m} = 27R^2T_c^2/(64P_c) = 0.1362\,\text{Pa}\,\text{m}^6/\text{mol}^2$, $b_\mathrm{m} = RT_c/(8P_c) = 32.20\,\text{cm}^3/\text{mol}$.
      - kind: law
        text: >-
          פיתוח הוויריאל $Z = 1 + B/V_\mathrm{m} + C/V_\mathrm{m}^2 + \cdots$, כאשר $Z = PV_\mathrm{m}/(RT)$ נמדד. טמפרטורת בויל היא הטמפרטורה שבה $B$ מחליף סימן. בגז ואן דר ואלס, $B = b - a/(k_BT)$, למול $b_\mathrm{m} - a_\mathrm{m}/(RT)$, עם $T_B = a/(k_Bb) = \tfrac{27}{8}T_c$.
      - kind: formula
        text: >-
          $Z = \dfrac{P}{\rho RT} \qquad B \approx \dfrac{Z - 1}{\rho} \qquad T_B \approx T_1 + (T_2 - T_1)\,\dfrac{-B_1}{B_2 - B_1} \qquad a' = \dfrac{B_2 - B_1}{\frac{1}{RT_1} - \frac{1}{RT_2}},\ \ b' = B_2 + \dfrac{a'}{RT_2}$
      - kind: limit
        text: >-
          כאשר $P \to 0$, $(Z - 1)V_\mathrm{m} \to B$ בדיוק, ולכן משתמשים בלחץ נמוך: ב-$1\,\text{MPa}$ האיבר השלישי הוא לכל היותר אחוזים ספורים מ-$B$. ליד $T_B$, $Z - 1$ זעיר ($-1.7 \times 10^{-4}$ ב-$400\,\text{K}$), והצפיפויות בנות שש הספרות עדיין מבחינות בו. $B$ של ואן דר ואלס עולה לעבר $b$ כאשר $T \to \infty$, ולעולם אינו חוזר ויורד.
      - kind: units
        text: >-
          $Z$: $\text{Pa}/(\text{mol/m}^3 \cdot \text{J/mol}) = \text{Pa}/(\text{J/m}^3)$, מספר טהור; $B = (Z - 1)/\rho$ ב-$\text{m}^3/\text{mol}$; $C\rho$ ב-$(\text{cm}^6/\text{mol}^2)(\text{mol/cm}^3) = \text{cm}^3/\text{mol}$, כמו $B$.
      - kind: substitution
        text: >-
          (א) $C\rho \approx 2 \times 10^3 \times 0.865 \times 10^{-3} = 1.7\,\text{cm}^3/\text{mol}$ ב-$150\,\text{K}$, $2\%$ מ-$B$. (ב) ב-$150\,\text{K}$: $Z = 10^6/(864.906 \times 1247.2) = 0.9271$, $B = -0.0729/864.906\,\text{m}^3/\text{mol} = -84.3\,\text{cm}^3/\text{mol}$; ובאותו אופן $-47.0$, $-14.7$, $-0.57$, $+7.23$, $+12.05\,\text{cm}^3/\text{mol}$. (ג) $T_B = 400 + 100 \times 0.57/(0.57 + 7.23) = 407\,\text{K}$; $407/150.687 = 2.70$; $\tfrac{27}{8} \times 150.687 = 508.6\,\text{K}$. (ד) $b_\mathrm{m} - a_\mathrm{m}/(RT)$: $32.20 - 81.89 = -49.7$ ב-$200\,\text{K}$; $-22.4$ ב-$300\,\text{K}$; $-0.5$ ב-$500\,\text{K}$ (ב-$\text{cm}^3/\text{mol}$). (ה) $1/(RT)$: $6.014 \times 10^{-4}$ ו-$2.005 \times 10^{-4}\,\text{mol/J}$; $a' = (12.05 + 46.95) \times 10^{-6}/(4.009 \times 10^{-4}) = 0.147\,\text{Pa}\,\text{m}^6/\text{mol}^2$; $b' = 41.6\,\text{cm}^3/\text{mol}$; $T_c' = 8a'/(27Rb') = 126\,\text{K}$.
      - kind: reasoning
        text: >-
          (ב) החוק האידיאלי, חוק אמפירי של המשטר הדליל, מתקיים לארגון ב-$10$ אטמוספרות בדיוק של $0.6\%$ בטמפרטורת החדר, ונכשל ב-$7\%$ בטמפרטורה הקריטית: מה שנחשב דליל מספיק תלוי בטמפרטורה, ולא רק בצפיפות. (ד) $B$ של ואן דר ואלס שלילי מדי מ-$200\,\text{K}$ ומעלה, כי האיזון שלו בין משיכה לגודל, $a/b$, ננעץ על ידי הנקודה הקריטית ב-$T_B = 3.375\,T_c$, בעוד אצל ארגון הוא $2.70\,T_c$. (ה) כשמתאימים אותה ל-$B(T)$, אותה נוסחה צריכה $b$ גדול יותר ו-$a$ קטן יותר, ואז היא מציבה את הנקודה הקריטית במרחק $25\,\text{K}$ ממקומה. הקבועים אינם תכונות של האטום; הם פרמטרי התאמה, וערכיהם תלויים בנתונים שמבקשים מהם להתאים להם.
      - kind: result
        text: >-
          (א) $B \approx (Z - 1)V_\mathrm{m}$, בדיוק של כ-$2\,\text{cm}^3/\text{mol}$. (ב) $B$ נע מ-$-84$ עד $+12\,\text{cm}^3/\text{mol}$ בין $150$ ל-$600\,\text{K}$; $Z$ ב-$1\,\text{MPa}$ נמצא בתוך $0.6\%$ מ-$1$ מ-$300\,\text{K}$ ומעלה. (ג) $T_B \approx 407\,\text{K} = 2.70\,T_c$; ואן דר ואלס אומר $509\,\text{K}$. (ד) $B$ של המודל שלילי מדי ב-$3$ עד $8\,\text{cm}^3/\text{mol}$ מעל $200\,\text{K}$. (ה) התאמה ל-$B$ במקום זאת נותנת $T_c = 126\,\text{K}$: שני קבועים אינם יכולים לשאת גם את הנקודה הקריטית וגם את הגז הדליל.

  - id: W-2.1-10
    level: bagrut
    objectives: [OBJ-2.1-6]
    prompt: >-
      מצבים מתאימים, במבחן מול גזים ממשיים. הנקודות הקריטיות של NIST: ארגון $150.687\,\text{K}$, $4.8630\,\text{MPa}$, $74.59\,\text{cm}^3/\text{mol}$; חנקן $126.192\,\text{K}$, $3.3958\,\text{MPa}$, $89.41\,\text{cm}^3/\text{mol}$; מתאן $190.564\,\text{K}$, $4.5992\,\text{MPa}$, $98.63\,\text{cm}^3/\text{mol}$; פחמן דו-חמצני $304.13\,\text{K}$, $7.3773\,\text{MPa}$, $94.12\,\text{cm}^3/\text{mol}$. ב-$T_r = 1.2$, $P_r = 1.0$ NIST נותן צפיפויות של $4.11313$, $3.41017$, $3.07301$ ו-$3.03561\,\text{mol/L}$, בסדר הזה; ב-$T_r = 1.5$, $P_r = 2.0$, $6.23148$, $5.13408$, $4.64666$ ו-$4.50532\,\text{mol/L}$.
      (א) מצאו את הטמפרטורה ואת הלחץ של כל גז בשני המצבים, ואת $Z$ מתוך הנתונים.
      (ב) פתרו את משוואת ואן דר ואלס המצומצמת עבור $v_r$ בכל מצב, ומצאו את ה-$Z$ שלה.
      (ג) עד כמה ארבעת הגזים מסכימים זה עם זה, ועם ואן דר ואלס?
      (ד) חשבו את הנפח המצומצם $v/v_c$ של כל גז עם הנפח הקריטי הנמדד שלו, והשוו ל-$v_r$ של ואן דר ואלס. מדוע הנפחים המצומצמים חלוקים בשליש כאשר $Z$ מסכים בתוך אחוזים ספורים?
      (ה) איזה גז יוצא דופן, ומה צריך חוק המצבים המתאימים כדי לתאר אותו?
    answer: >-
      (א) ב-$T_r = 1.2$, $P_r = 1$: $Z = 0.786$ (ארגון, $180.8\,\text{K}$, $4.863\,\text{MPa}$), $0.791$ (חנקן, $151.4\,\text{K}$, $3.396\,\text{MPa}$), $0.787$ (מתאן, $228.7\,\text{K}$, $4.599\,\text{MPa}$), $0.801$ (CO₂, $365.0\,\text{K}$, $7.377\,\text{MPa}$). ב-$T_r = 1.5$, $P_r = 2$: $0.831$, $0.841$, $0.833$, $0.863$. (ב) $v_r = 2.490$, $Z = 0.778$; $v_r = 1.587$, $Z = 0.793$. (ג) ארגון, חנקן ומתאן בתוך $0.6\%$ ו-$1.2\%$ זה מזה; CO₂ גבוה מארגון ב-$2\%$ וב-$4\%$; ואן דר ואלס נמוך ב-$1\%$ וב-$4.5\%$. (ד) $3.26$, $3.28$, $3.30$, $3.50$ לעומת $2.49$; $2.15$, $2.18$, $2.18$, $2.36$ לעומת $1.59$. מכיוון ש-$v/v_c = (Z/Z_c)(T_r/P_r)$, הנפח המצומצם נושא את $1/Z_c$, ו-$Z_c = 3/8$ של המודל גבוה ב-$30\%$ מהערכים הממשיים. (ה) CO₂, שה-$Z_c$ שלו הוא $0.275$ לעומת $0.286$ עד $0.290$: גזים ממשיים צריכים לפחות עוד פרמטר אחד של החומר.
    solution:
      - kind: given
        text: >-
          הקבועים הקריטיים כמפורט; $Z_c = P_cV_c/(RT_c)$ הממשי: ארגון $0.290$, חנקן $0.289$, מתאן $0.286$, CO₂ $0.275$. $T = T_rT_c$, $P = P_rP_c$.
      - kind: law
        text: >-
          חוק המצבים המתאימים לגזים ממשיים, חוק אמפירי מקורב: באותם $T_r$ ו-$P_r$, לגזים שונים יש בערך אותו $Z$. בגז ואן דר ואלס הוא מדויק: $P_r = 8T_r/(3v_r - 1) - 3/v_r^2$ ו-$Z = 3P_rv_r/(8T_r)$.
      - kind: manipulation
        text: >-
          (ב) הכפלת המשוואה המצומצמת ב-$v_r^2(3v_r - 1)$ נותנת משוואה ממעלה שלישית ב-$v_r$, שנפתרת נומרית; מעל $T_c$ יש לה שורש ממשי אחד מעל $v_r = \tfrac13$. (ד) עם $Z = PV_\mathrm{m}/(RT)$ ו-$Z_c = P_cV_c/(RT_c)$, חלוקה נותנת $V_\mathrm{m}/V_c = (Z/Z_c)(T_r/P_r)$, נכון לכל חומר; בגז ואן דר ואלס, $Z_c = 3/8$.
      - kind: formula
        text: >-
          $3P_rv_r^3 - (P_r + 8T_r)\,v_r^2 + 9v_r - 3 = 0 \qquad Z = \dfrac{P_rP_c}{\rho R\,T_rT_c} \qquad \dfrac{V_\mathrm{m}}{V_c} = \dfrac{Z}{Z_c}\,\dfrac{T_r}{P_r}$
      - kind: limit
        text: >-
          כאשר $P_r \to 0$ בכל $T_r$, כל הגזים וגם המודל נותנים $Z \to 1$: המצבים המתאימים נכונים באופן טריוויאלי בגבול הדליל, והמבחן הוא בצפיפות מצומצמת בינונית. בנקודה הקריטית עצמה, $T_r = P_r = 1$, המודל נותן $Z = 3/8$ והגזים $0.275$ עד $0.290$: שם הגרסה של החוק לגזים ממשיים והמודל נפרדים יותר מבכל מקום אחר.
      - kind: units
        text: >-
          המשתנים המצומצמים, $Z$ ו-$V_\mathrm{m}/V_c$ הם מספרים טהורים; ב-$Z = P/(\rho RT)$ הצפיפות חייבת להיות ב-$\text{mol/m}^3$.
      - kind: substitution
        text: >-
          (א) ארגון ב-$T_r = 1.2$: $T = 180.82\,\text{K}$, $Z = 4.8630 \times 10^6/(4113.13 \times 8.3145 \times 180.82) = 0.786$; האחרים באותו אופן, $0.791$, $0.787$, $0.801$; וב-$T_r = 1.5$, $P_r = 2$, $0.831$, $0.841$, $0.833$, $0.863$. (ב) ב-$T_r = 1.2$, $P_r = 1$: $3v^3 - 10.6v^2 + 9v - 3 = 0$, $v_r = 2.490$, $Z = 3 \times 2.490/9.6 = 0.778$. ב-$T_r = 1.5$, $P_r = 2$: $6v^3 - 14v^2 + 9v - 3 = 0$, $v_r = 1.587$, $Z = 6 \times 1.587/12 = 0.793$. (ד) ארגון: $(0.786/0.290)(1.2) = 3.26$; חנקן $3.28$, מתאן $3.30$, CO₂ $3.50$; ב-$T_r = 1.5$, $P_r = 2$: $2.15$, $2.18$, $2.18$, $2.36$.
      - kind: reasoning
        text: >-
          (ג) המולקולות הפשוטות, הכמעט כדוריות, מסכימות זו עם זו טוב יותר מכפי שכל אחת מהן מסכימה עם המודל: חוק המצבים המתאימים לגזים ממשיים הוא חוק אמפירי טוב, אבל העקומה האוניברסלית שלו אינה זו של ואן דר ואלס. (ד) נפחים מצומצמים משווים את $Z/Z_c$, והנפח הקריטי של המודל, $3b$, גדול בכ-$30\%$ מהנפחים הנמדדים (שיעור 2.1); כשמודדים כל גז ב-$v_c$ שלו עצמו, הנפחים אינם יכולים להתאים לאלה של המודל. $Z$ כפונקציה של $(T_r, P_r)$ עוקף את $v_c$ לגמרי, ולכן זו הצורה שבה בודקים את המצבים המתאימים. (ה) CO₂, מולקולה קווית עם $Z_c$ נמוך יותר, סוטה ב-$2$ עד $4\%$; חוק דו-פרמטרי אינו יכול להבחין בינו לבין ארגון, וחוק המצבים המתאימים צריך לפחות עוד מספר אחד של החומר, כמו $Z_c$ עצמו.
      - kind: result
        text: >-
          (א) $Z = 0.786$, $0.791$, $0.787$, $0.801$ ב-$(1.2, 1)$; $0.831$, $0.841$, $0.833$, $0.863$ ב-$(1.5, 2)$. (ב) ואן דר ואלס: $0.778$ ו-$0.793$. (ג) ארגון, חנקן ומתאן מסכימים בתוך כ-$1\%$, CO₂ גבוה ב-$2$ עד $4\%$, המודל נמוך ב-$1$ עד $4.5\%$. (ד) נפחים מצומצמים של $3.26$ עד $3.50$ לעומת $2.49$, כי הם נושאים את $1/Z_c$. (ה) CO₂ צריך פרמטר שלישי; גזים ממשיים מצייתים למצבים המתאימים בקירוב, והכי טוב כשהמולקולות שלהם דומות.
challenge:
  - id: W-2.1-c1
    stars: 1
    objectives: [OBJ-2.1-4, OBJ-2.1-5]
    prompt: >-
      חלקיקים נקודתיים שמושכים זה את זה. $N$ חלקיקים נקודתיים קלאסיים בנפח $V$ בטמפרטורה $T$ מושכים זה את זה דרך כוח שאינו מפורט, שמוריד את האנרגיה של כל קונפיגורציה ב-$uN^2/(2V)$, עם $u > 0$. המקור גוזר מפונקציית החלוקה את משוואת המצב $P = nk_BT - un^2/2$, עם $n = N/V$; קבלו אותה כנתונה.
      (א) הראו שזו משוואת ואן דר ואלס עם $b = 0$, וזהו את $a$.
      (ב) חשבו את הדחיסות האיזותרמית $\kappa_T(n) = -\dfrac1V\left(\dfrac{\partial V}{\partial P}\right)_{T,N}$.
      (ג) מצאו את הקו במישור $(T, P)$ שעליו $\kappa_T$ מתבדר, ואת הצפיפות ואת $Z$ עליו. מה קורה לגז אם דוחסים אותו מעבר לקו הזה?
      (ד) הראו שלמודל אין נקודה קריטית: באף טמפרטורה אין איזותרמה עם נקודת פיתול בשיפוע אפס. ישבו זאת עם $k_BT_c = 8a/(27b)$, והעמידו זאת מול כדורים קשיחים בלי משיכה, $P = nk_BT/(1 - nb)$.
      (ה) תנו לארגון את ה-$a$ שלו מהנקודה הקריטית, $a_\mathrm{m} = 0.1362\,\text{Pa}\,\text{m}^6/\text{mol}^2$. באיזה לחץ ובאיזה נפח מולרי ארגון של חלקיקים נקודתיים היה נעשה לא יציב ב-$300\,\text{K}$? NIST נותן לארגון ממשי ב-$300\,\text{K}$ וב-$11.4\,\text{MPa}$ מקדם דחיסות של $0.952$. מה עושה $b$ שחסר במודל הזה?
    answer: >-
      (א) $P = k_BT/v - (u/2)/v^2$: ואן דר ואלס עם $b = 0$ ו-$a = u/2$. (ב) $\kappa_T = 1/\big(n(k_BT - un)\big)$. (ג) על $P^* = (k_BT)^2/(2u)$, ב-$n^* = k_BT/u$, שם $Z = 1/2$ בכל טמפרטורה. מעבר לקו $\kappa_T < 0$: הגז אינו יציב, ושום דבר אינו עוצר את קריסתו. (ד) $\partial^2P/\partial n^2 = -u < 0$ בכל מקום, ולכן לכל איזותרמה יש מקסימום, ולעולם לא נקודת פיתול שטוחה; $T_c = 8a/(27k_Bb) \to \infty$ כאשר $b \to 0$, ולכן כל טמפרטורה נמצאת מתחתיה. לכדורים קשיחים $\partial P/\partial n = k_BT/(1 - nb)^2 > 0$ בכל מקום: הם לעולם אינם מאבדים יציבות, ואין להם נקודה קריטית. שני התיקונים נחוצים. (ה) $11.4\,\text{MPa}$ ו-$109\,\text{cm}^3/\text{mol}$; ארגון ממשי שם הוא זורם על-קריטי רגיל. $b$ עוצר את הקריסה: איתו לחץ ואן דר ואלס ב-$109\,\text{cm}^3/\text{mol}$ הוא $21.0\,\text{MPa}$, וב-$T_r = 1.99$ האיזותרמה שלו יורדת בכל מקום.
    solution:
      - kind: law
        text: >-
          משוואת ואן דר ואלס $P = k_BT/(v - b) - a/v^2$ עם $v = 1/n$; הדחיסות האיזותרמית $\kappa_T = 1/\big(n\,(\partial P/\partial n)_T\big)$, מכיוון ש-$V = N/n$ ב-$N$ קבוע; מצב יציב דורש $\kappa_T > 0$; נקודה קריטית דורשת $\partial P/\partial n = \partial^2P/\partial n^2 = 0$ על איזותרמה אחת.
      - kind: manipulation
        text: >-
          (א) $nk_BT = k_BT/v$ ו-$un^2/2 = (u/2)/v^2$. זו תמונת השדה הממוצע של השיעור: האנרגיה $-uN^2/(2V)$ היא $-\tfrac u2 n$ לחלקיק כפול $N$, כשכל חלקיק חש משיכה יחסית לצפיפות שכניו, והנגזרת שלה לפי $V$ מורידה את הלחץ ב-$un^2/2$. (ב) $\partial P/\partial n = k_BT - un$, ו-$\partial V/\partial P = (\partial V/\partial n)(\partial n/\partial P) = -(N/n^2)/(k_BT - un)$. (ג) $\kappa_T \to \infty$ כאשר $k_BT = un^*$; שם $P^* = (k_BT)^2/u - (k_BT)^2/(2u)$ ו-$Z = P^*/(n^*k_BT) = \tfrac12$. (ד) במשתנה $n$, התנאים לנקודה קריטית הם אלה שבמשתנה $v$, מכיוון ש-$\partial n/\partial v = -n^2 \neq 0$; כאן $\partial^2P/\partial n^2 = -u$ לעולם אינו אפס.
      - kind: formula
        text: >-
          $a = \dfrac u2 \qquad \kappa_T = \dfrac{1}{n\,(k_BT - un)} \qquad n^* = \dfrac{k_BT}{u} \qquad P^* = \dfrac{(k_BT)^2}{2u}$
      - kind: limit
        text: >-
          כאשר $u \to 0$, $n^* \to \infty$ ו-$\kappa_T \to 1/(nk_BT) = 1/P$: הגז האידיאלי, שלעולם אינו מאבד יציבות. בצפיפות נמוכה $\kappa_T \approx 1/P$ יהיה $u$ אשר יהיה. כל איזותרמה עולה מ-$0$ למקסימום שלה $P^*$ ב-$n^*$ ואחר כך יורדת, דרך אפס ב-$n = 2k_BT/u$, לעבר לחץ שלילי יותר ויותר: בלי נפח מודר שום דבר אינו מרחיק את החלקיקים זה מזה. הוספת $b$ הופכת את המקסימום ללולאת ואן דר ואלס, שהלחץ שלה עולה שוב בצפיפות גבוהה.
      - kind: units
        text: >-
          ל-$u$ יש יחידות של $\text{J}\,\text{m}^3$, כמו ל-$a$, ולכן $un$ הוא אנרגיה, שאפשר להשוות ל-$k_BT$; $(k_BT)^2/u$ הוא $\text{J}/\text{m}^3 = \text{Pa}$; $\kappa_T$ הוא $\text{m}^3/\text{J} = \text{Pa}^{-1}$.
      - kind: substitution
        text: >-
          (ה) $a = 0.1362/N_A^2 = 3.755 \times 10^{-49}\,\text{Pa}\,\text{m}^6$, $u = 7.510 \times 10^{-49}\,\text{Pa}\,\text{m}^6$; $k_BT = 4.142 \times 10^{-21}\,\text{J}$. $n^* = 5.515 \times 10^{27}\,\text{m}^{-3}$, $V_\mathrm{m} = N_A/n^* = 109.2\,\text{cm}^3/\text{mol}$; $P^* = (4.142 \times 10^{-21})^2/(2 \times 7.510 \times 10^{-49}) = 11.42\,\text{MPa}$. כשמחזירים את $b = 5.348 \times 10^{-29}\,\text{m}^3$, $v = 1.813 \times 10^{-28}\,\text{m}^3$: $P = 4.142 \times 10^{-21}/1.278 \times 10^{-28} - 3.755 \times 10^{-49}/3.287 \times 10^{-56} = 32.40 - 11.42 = 21.0\,\text{MPa}$.
      - kind: reasoning
        text: >-
          (ד) הטמפרטורה הקריטית של ואן דר ואלס, $8a/(27k_Bb)$, היא היחס בין משיכה לגודל. בלי גודל היא אינסופית: גז החלקיקים הנקודתיים נמצא מתחת לטמפרטורה הקריטית שלו בכל טמפרטורה, ולכל איזותרמה שלו יש אי-היציבות שיש לאיזותרמות ואן דר ואלס רק מתחת ל-$T_c$, בלי העלייה בצפיפות גבוהה שהייתה מסיימת אותה. כדורים קשיחים בלי משיכה הם המקרה ההפוך, $T_c = 0$: כל איזותרמה עולה בתלילות ובאופן מונוטוני עם הצפיפות, ולכן הם לעולם אינם מתעבים. נקודה קריטית צריכה את שניהם: משיכה, כדי שהאיזותרמה תשנה כיוון, וגודל, כדי שתחזור לכיוונה. (ה) ארגון ממשי ב-$300\,\text{K}$ ($T_r = 1.99$) וב-$11.4\,\text{MPa}$ הוא זורם על-קריטי עם $Z = 0.952$, רחוק מאוד מהקריסה שהמודל חוזה שם.
      - kind: result
        text: >-
          (א) $a = u/2$, $b = 0$. (ב) $\kappa_T = 1/(n(k_BT - un))$. (ג) אי-יציבות על $P^* = (k_BT)^2/(2u)$ ב-$n^* = k_BT/u$, עם $Z = 1/2$; מעבר לה הגז קורס. (ד) לעולם אין נקודת פיתול, כי $T_c \to \infty$ כאשר $b \to 0$; לכדורים קשיחים לבדם $T_c = 0$. נקודה קריטית צריכה משיכה וגודל יחד. (ה) ארגון של חלקיקים נקודתיים היה קורס ב-$11.4\,\text{MPa}$ וב-$109\,\text{cm}^3/\text{mol}$ בטמפרטורת החדר; הנפח המודר מעלה את הלחץ שם ל-$21.0\,\text{MPa}$ ושומר על האיזותרמה יורדת.
    source:
      name: 'MIT 8.333 Statistical Mechanics I: Statistical Mechanics of Particles (OpenCourseWare)'
      year: 2013
      problem: 'Problem Set 5, Problem 4'
      url: 'https://ocw.mit.edu/courses/8-333-statistical-mechanics-i-statistical-mechanics-of-particles-fall-2013/3a47ef89d0b17a1a47639036ed695746_MIT8_333F13_pset5.pdf'
      verified: '2026-11-20'
      adapted: true

  - id: W-2.1-c2
    stars: 2
    objectives: [OBJ-2.1-5, OBJ-2.1-6]
    prompt: >-
      הנקודה הקריטית של פיתוח ויריאל קטוע. הלחץ של גז קשור לצפיפות שלו $n = N/V$ ולטמפרטורה $T$ על ידי $P = k_BTn - \tfrac u2n^2 + \tfrac w6n^3$, כאשר $u$ ו-$w$ הם קבועים חיוביים שאינם תלויים בטמפרטורה.
      (א) מצאו את הטמפרטורה הקריטית $T_c$ שמתחתיה המשוואה הזו חייבת להיות לא תקפה, ואת הצפיפות הקריטית $n_c$ והלחץ הקריטי $P_c$. מצאו את היחס $k_BT_cn_c/P_c$, והשוו את מקדם הדחיסות הקריטי ל-$3/8$ של ואן דר ואלס ול-$0.290$ של ארגון.
      (ב) חשבו את הדחיסות האיזותרמית $\kappa_T = -\dfrac1V\left(\dfrac{\partial V}{\partial P}\right)_T$, ותארו את התנהגותה כפונקציה של $T$ ב-$n = n_c$. מה קורה מתחת ל-$T_c$?
      (ג) על האיזותרמה הקריטית, כתבו את $P - P_c$ כפונקציה של $n - n_c$.
      (ד) במקום בניית מקסוול של המקור, ששייכת למודול 14: הראו שהתוצאות של (ב) ושל (ג), דחיסות שמתבדרת כמו $1/(T - T_c)$ לאורך $n = n_c$ ואיזותרמה קריטית שהיא מסדר שלישי ב-$n - n_c$, מתקיימות בכל משוואת מצב $P(n, T)$ שיש לה טור טיילור סביב הנקודה הקריטית שלה, כולל ואן דר ואלס. בזורמים ממשיים, לעומת זאת, $|P - P_c| \propto |n - n_c|^{\delta}$ על האיזותרמה הקריטית ו-$\kappa_T \propto (T - T_c)^{-\gamma}$, עם הערכים של מודל איזינג התלת-ממדי, $\delta \approx 4.79$ ו-$\gamma \approx 1.24$ (Pelissetto ו-Vicari, Physics Reports 368, 549 (2002)). מה זה אומר על $P(n, T)$ הממשית בנקודה הקריטית שלה? נתוני NIST של CO₂ בשאלה 8 נתנו יחס של $3.19$ בין $\kappa_T$ ב-$310$ וב-$320\,\text{K}$; לאיזה כיוון הם מצביעים?
    answer: >-
      (א) $n_c = u/w$, $k_BT_c = u^2/(2w)$, $P_c = u^3/(6w^2)$; $k_BT_cn_c/P_c = 3$, ולכן $Z_c = 1/3$, לעומת $3/8$ של ואן דר ואלס ו-$0.290$ של ארגון. (ב) $\kappa_T = 1/\big(n(k_BT - un + wn^2/2)\big)$; ב-$n_c$, $\kappa_T = 1/\big(n_ck_B(T - T_c)\big)$, שמתבדר כאשר $T \to T_c^+$; מתחת ל-$T_c$ הוא שלילי שם, מצב לא יציב. (ג) $P - P_c = \tfrac w6(n - n_c)^3$, בדיוק. (ד) כיוון ש-$\partial P/\partial n = \partial^2P/\partial n^2 = 0$ בנקודה הקריטית, טור טיילור נותן $\partial P/\partial n \approx P_{nT}(T - T_c)$ ב-$n_c$ ו-$P - P_c \approx \tfrac16P_{nnn}(n - n_c)^3$ על האיזותרמה הקריטית, לכל משוואה חלקה. ה-$\delta \ne 3$ וה-$\gamma \ne 1$ של זורמים ממשיים פירושם שלפונקציה $P(n, T)$ שלהם אין טור טיילור בנקודה הקריטית; היחס $3.19$ של CO₂ לעומת $2.70$ מצביע לאותו כיוון, עם $\gamma$ אפקטיבי של $1.17$.
    solution:
      - kind: law
        text: >-
          נקודה קריטית דורשת $\partial P/\partial n = 0$ ו-$\partial^2P/\partial n^2 = 0$ על איזותרמה אחת (שקול לתנאים במשתנה $v$, מכיוון ש-$\partial n/\partial v = -n^2 \neq 0$ והנגזרת הראשונה מתאפסת שם); יציבות דורשת $\partial P/\partial n > 0$; $\kappa_T = 1/\big(n\,(\partial P/\partial n)_T\big)$.
      - kind: manipulation
        text: >-
          (א) $\partial P/\partial n = k_BT - un + \tfrac w2n^2$, $\partial^2P/\partial n^2 = -u + wn$. השנייה מתאפסת ב-$n_c = u/w$; הראשונה נותנת אז $k_BT_c = un_c - \tfrac w2n_c^2 = u^2/(2w)$; ו-$P_c = \tfrac{u^2}{2w}\tfrac uw - \tfrac u2\tfrac{u^2}{w^2} + \tfrac w6\tfrac{u^3}{w^3} = \tfrac{u^3}{6w^2}$. מתחת ל-$T_c$, $\partial P/\partial n$ הוא פרבולה ב-$n$ שהמינימום שלה, $k_B(T - T_c)$ ב-$n_c$, שלילי: רצועה של צפיפויות עם $\kappa_T < 0$, שבה המשוואה אינה יכולה לתאר מצב אחיד. (ג) $P$ הוא פולינום ממעלה שלישית ב-$n$, שעל האיזותרמה הקריטית הנגזרות הראשונה והשנייה שלו מתאפסות ב-$n_c$, והנגזרת השלישית שלו היא $w$. (ד) מפתחים סביב $(n_c, T_c)$: $P = P_c + P_T\,\Delta T + P_{nT}\,\Delta n\,\Delta T + \tfrac16P_{nnn}\,\Delta n^3 + \cdots$, בלי איבר $\Delta n$ או $\Delta n^2$, כי $P_n = P_{nn} = 0$ שם. אז ב-$\Delta n = 0$, $\partial P/\partial n = P_{nT}\,\Delta T + O(\Delta T^2)$, וב-$\Delta T = 0$, $P - P_c = \tfrac16P_{nnn}\,\Delta n^3 + \cdots$.
      - kind: formula
        text: >-
          $n_c = \dfrac uw \qquad k_BT_c = \dfrac{u^2}{2w} \qquad P_c = \dfrac{u^3}{6w^2} \qquad \kappa_T\big|_{n_c} = \dfrac{1}{n_ck_B(T - T_c)} \qquad P - P_c = \dfrac w6\,(n - n_c)^3$
      - kind: limit
        text: >-
          כאשר $w \to 0$ הנקודה הקריטית בורחת לצפיפות ולטמפרטורה אינסופיות: אלה החלקיקים הנקודתיים של אתגר 1, $P = nk_BT - un^2/2$, בלי נקודה קריטית; איבר ה-$n^3$ ממלא את תפקיד הנפח המודר. הרחק מעל $T_c$, $\kappa_T \to 1/(nk_BT) = 1/P$, אידיאלי. במקרה של ואן דר ואלס אותו פיתוח נותן $P_r - 1 \approx -\tfrac32(v_r - 1)^3$ ו-$\kappa_TP_c = 1/(6(T_r - 1))$ (שאלות 4 ו-8): מקדמים שונים, אותן חזקות.
      - kind: units
        text: >-
          $un^2$ ו-$wn^3$ הם לחצים, ולכן $[u] = \text{J}\,\text{m}^3$ ו-$[w] = \text{J}\,\text{m}^6$. $u/w$ הוא $\text{m}^{-3}$, צפיפות; $u^2/w$ הוא $\text{J}$, אנרגיה; $u^3/w^2$ הוא $\text{J}/\text{m}^3$, לחץ. כמו בשאלה 7, הממדים לבדם מחייבים ש-$Z_c$ יהיה מספר טהור, זהה לכל גז שהמשוואה הזו מתארת.
      - kind: substitution
        text: >-
          (א) $k_BT_cn_c/P_c = \dfrac{u^2}{2w}\cdot\dfrac uw\cdot\dfrac{6w^2}{u^3} = 3$, $Z_c = \tfrac13 = 0.333$. (ב) ב-$n_c$: $k_BT - u^2/w + u^2/(2w) = k_BT - u^2/(2w) = k_B(T - T_c)$. (ד) עבור $\kappa_T \propto 1/(T - T_c)$ עם $T_c = 304.13\,\text{K}$, היחס מ-$320$ ל-$310\,\text{K}$ הוא $15.87/5.87 = 2.70$; NIST נותן $3.19$, ערך אפקטיבי $\gamma = \ln 3.19/\ln 2.70 = 1.17$, כבר מעל $1$ במרחק $6$ עד $16\,\text{K}$ מהנקודה הקריטית, ובדרך ל-$1.24$ קרוב יותר אליה.
      - kind: reasoning
        text: >-
          (ד) איזותרמה קריטית מסדר שלישי ו-$\gamma = 1$ אינן תכונות של ואן דר ואלס או של הטור הקטוע הזה דווקא; הן נובעות מחלקות בלבד, ולכן כל משוואת מצב שאפשר לפתח סביב הנקודה הקריטית שלה, יהיה מספר הקבועים שלה אשר יהיה, חולקת אותן. ההתנהגות הקריטית הנמדדת אינה חולקת אותן: $\delta \approx 4.8$ פירושו איזותרמה קריטית שטוחה בהרבה מפולינום מסדר שלישי, ו-$\gamma \approx 1.24$ פירושו דחיסות שגדלה מהר יותר מ-$1/(T - T_c)$. $P(n, T)$ הממשית אינה אנליטית בנקודה הקריטית שלה; הפלוקטואציות שתמונת השדה הממוצע ממצעת ומעלימה שולטות שם. זה הכשל שפירוט המודל בשיעור מונה, ומודול 15 פוגש אותו שוב במגנט.
      - kind: result
        text: >-
          (א) $n_c = u/w$, $k_BT_c = u^2/(2w)$, $P_c = u^3/(6w^2)$, $Z_c = 1/3$: אוניברסלי, כמו $3/8$ של ואן דר ואלס, וכמוהו גדול מדי. (ב) $\kappa_T = 1/(n_ck_B(T - T_c))$ ב-$n_c$, אינסופי ב-$T_c$ ושלילי מתחתיה. (ג) $P - P_c = \tfrac w6(n - n_c)^3$. (ד) כל משוואה שיש לה טור טיילור בנקודה הקריטית שלה נותנת $\delta = 3$ ו-$\gamma = 1$; זורמים ממשיים, עם $\delta \approx 4.8$ ו-$\gamma \approx 1.24$, והדחיסות של CO₂, שעולה פי $3.19$ היכן ש-$1/(T - T_c)$ מתיר פי $2.70$, מראים ששום משוואה כזו אינה נכונה בנקודה הקריטית.
