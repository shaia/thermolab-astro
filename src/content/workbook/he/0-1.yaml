# חוברת התרגול של שיעור 0.1. שאלה 02 היא שאלה 1 של ThermoLab (הקובייה הישרה), שאלה 08 היא שאלה 6 שלו (החישובית);
# השאר חדשות, ואף אחת מהן אינה חוזרת על שאלות 2 עד 5 של ThermoLab, שהן שאלות החזרה של המודול.
# מספרי הקוביות בשאלות 08 ו-10 חושבו עבור החוברת הזו ב-thermolab.sampling וב-thermolab.validation של ThermoLab
# (64 זרעים) ובקונבולוציה מדויקת. ב-ThermoLab הפתרונות נשארו אצל המרצה; הפלטפורמה הזו מפרסמת אותם, בהחלטת הכותב.
# קחו k_B = 1.381e-23 J/K, N_A = 6.022e23 /mol, u = 1.661e-27 kg.
lang: he
lesson: '0.1'
practice:
  - id: W-0.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-1]
    prompt: >-
      מטבע הוגן נופל על עץ בכל אחת משמונה ההטלות הראשונות שלו. חבר אומר: "לפי חוק המספרים הגדולים, שיעור תוצאות העץ חייב לחזור לחצי, ולכן עכשיו פלי סביר יותר מעץ."
      (א) מהי ההסתברות לפלי בהטלה התשיעית?
      (ב) אחרי $1000$ הטלות נוספות, למה אתם מצפים עבור העודף, כלומר מספר תוצאות העץ פחות מחצית מספר ההטלות? ולמה אתם מצפים עבור שיעור תוצאות העץ?
      (ג) אם כן, כיצד שיעור תוצאות העץ חוזר לחצי?
    answer: >-
      (א) $1/2$: למטבע אין זיכרון. (ב) העודף הצפוי נשאר $+4$, ואילו השיטוט האקראי שלו על פני ההטלות החדשות הוא בערך $\pm16$; השיעור הצפוי הוא $508/1008 = 0.504$. (ג) בדילול, לא בפיצוי: העודף של $4$ לעולם אינו מוחזר, אבל כשמחלקים אותו במספר ההטלות הוא שואף לאפס, $0.004$ אחרי אלף הטלות ו-$4\cdot10^{-6}$ אחרי מיליון.
    solution:
      - kind: reasoning
        text: >-
          ההטלות בלתי תלויות: ההסתברות לפלי בכל הטלה היא $1/2$, יהיו ההטלות הקודמות אשר יהיו. שום דבר במטבע אינו רושם את שמונה תוצאות העץ, ולכן שום דבר אינו יכול לגרום לו "לחוב" פלי.
      - kind: reasoning
        text: >-
          אחרי שמונה תוצאות עץ העודף הוא $8 - 8/2 = +4$. כל הטלה נוספת מוסיפה לו $+\tfrac12$ (עץ) או $-\tfrac12$ (פלי), בתוחלת אפס, ולכן העודף הצפוי נשאר $+4$ לעולם. השיטוט האקראי שלו גדל: למספר תוצאות העץ ב-$n$ הטלות יש סטיית תקן $\sqrt{n}/2$, כ-$16$ עבור $n = 1000$.
      - kind: reasoning
        text: >-
          שיעור תוצאות העץ הוא חצי ועוד העודף מחולק ב-$n$. כשהעודף הצפוי נשאר $4$ ו-$n$ גדל, השיעור הצפוי שואף ל-$\tfrac12$: $0.504$ אחרי $1008$ הטלות, $0.500004$ אחרי מיליון. גם השיטוט הטיפוסי של השיעור, $\tfrac12/\sqrt{n}$, מצטמצם.
      - kind: result
        text: >-
          (א) $1/2$. (ב) עודף צפוי של $+4$, ושיעור של כ-$0.504$. (ג) חוק המספרים הגדולים פועל בדילול: העודף המוקדם לעולם אינו מתבטל, הוא רק מחולק במספר הטלות שהולך וגדל.

  - id: W-0.1-02
    level: basic
    objectives: [OBJ-0.1-2]
    prompt: >-
      הקובייה הישרה.
      (א) מתוך ההגדרות, חשבו את התוחלת $\mu_1$ ואת השונות $\sigma_1^2$ של קובייה הוגנת אחת בעלת שישה פנים. הראו את הסכומים; אל תצטטו נוסחה סגורה.
      (ב) קובייה מוטה כך שהשש עולה בהסתברות $1/3$ וכל אחד מחמשת הפנים האחרים בהסתברות $2/15$. חשבו את התוחלת ואת השונות שלה, ואמרו במשפט אחד מדוע השונות זזה לכיוון שאליו זזה.
      (ג) שתי קוביות הוגנות מוטלות באופן בלתי תלוי. על ידי מנייה של כל $36$ התוצאות שוות ההסתברות, חשבו ישירות את $\langle X + Y\rangle$ ואת $\operatorname{Var}(X + Y)$, ובדקו את שניהם מול כללי החיבור.
      (ד) כעת יהי $Y = X$: "הקובייה השנייה" היא הראשונה, הנקראת פעמיים. חשבו את $\operatorname{Var}(X + Y)$ והשוו ל-(ג). איזו הנחה של כלל החיבור הופרה, ובכמה משתנה התשובה?
    answer: >-
      (א) $\mu_1 = 7/2$, $\sigma_1^2 = 35/12 = 2.917$. (ב) $\mu = 4$, $\sigma^2 = 10/3 = 3.333$: ההטיה העבירה הסתברות אל השש, אחד משני הפנים הרחוקים ביותר מהתוחלת הקודמת. (ג) $\langle X + Y\rangle = 7$, $\operatorname{Var}(X + Y) = 35/6 = 5.833$, כמו $\mu_1 + \mu_1$ ו-$\sigma_1^2 + \sigma_1^2$. (ד) $35/3 = 11.67$, פי שניים מ-(ג): השונות המשותפת כבר אינה אפס אלא $\sigma_1^2$, וזה מוסיף $2\sigma_1^2 = 5.83$.
    solution:
      - kind: given
        text: >-
          קובייה הוגנת: $p_k = 1/6$ עבור $k = 1, \dots, 6$. קובייה מוטה: $p_6 = 1/3$, $p_k = 2/15$ עבור $k = 1, \dots, 5$, וסכומן $10/15 + 1/3 = 1$.
      - kind: law
        text: >-
          $\mu = \sum_k p_kx_k$, $\sigma^2 = \sum_k p_kx_k^2 - \mu^2$. לכל שני משתנים מקריים $\langle X + Y\rangle = \langle X\rangle + \langle Y\rangle$ ו-$\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y) + 2\operatorname{Cov}(X, Y)$.
      - kind: manipulation
        text: >-
          (א) $\mu_1 = (1 + 2 + 3 + 4 + 5 + 6)/6 = 21/6 = 7/2$; $\langle X^2\rangle = (1 + 4 + 9 + 16 + 25 + 36)/6 = 91/6$; $\sigma_1^2 = 91/6 - 49/4 = (182 - 147)/12 = 35/12$.
      - kind: manipulation
        text: >-
          (ב) $\mu = \tfrac{2}{15}(1 + 2 + 3 + 4 + 5) + \tfrac13\cdot6 = 2 + 2 = 4$; $\langle X^2\rangle = \tfrac{2}{15}(1 + 4 + 9 + 16 + 25) + \tfrac13\cdot36 = \tfrac{22}{3} + 12 = \tfrac{58}{3}$; $\sigma^2 = \tfrac{58}{3} - 16 = \tfrac{10}{3}$.
      - kind: manipulation
        text: >-
          (ג) הסכומים $2, 3, \dots, 12$ מתקבלים ב-$1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1$ מתוך $36$ התוצאות. סך כל הסכומים הוא $252$, ולכן $\langle X + Y\rangle = 252/36 = 7$. סך ריבועי הסכומים הוא $4 + 18 + 48 + 100 + 180 + 294 + 320 + 324 + 300 + 242 + 144 = 1974$, ולכן $\langle (X + Y)^2\rangle = 1974/36$ ו-$\operatorname{Var}(X + Y) = 1974/36 - 49 = 210/36 = 35/6$.
      - kind: manipulation
        text: >-
          (ד) $X + Y = 2X$, ולכן $\operatorname{Var}(2X) = 4\sigma_1^2 = 35/3$. בכלל החיבור $\operatorname{Cov}(X, X) = \operatorname{Var}(X) = \sigma_1^2$, ולא אפס: הנחת אי-התלות (ליתר דיוק, ההנחה שהשונות המשותפת מתאפסת) אינה מתקיימת.
      - kind: limit
        text: >-
          הטו את הקובייה לגמרי, כך שהשש עולה תמיד: התוחלת שואפת ל-$6$ והשונות ל-$0$, כמו לכל גודל שלעולם אינו משתנה. ההטיה החלקית של (ב) הגדילה את השונות כי היא העבירה משקל מהפנים 1 עד 5 אל הפן 6, פן קיצוני.
      - kind: units
        text: >-
          ערכי הפנים הם מספרים טהורים, וכך גם כל תוחלת ושונות כאן.
      - kind: substitution
        text: >-
          $35/12 = 2.917$, $10/3 = 3.333$, $35/6 = 5.833$, $35/3 = 11.67$.
      - kind: result
        text: >-
          (א) $\mu_1 = 3.5$, $\sigma_1^2 = 2.917$. (ב) $\mu = 4$, $\sigma^2 = 3.333$. (ג) $7$ ו-$5.833$, בדיוק $2\mu_1$ ו-$2\sigma_1^2$. (ד) $11.67$: פי שניים מהתשובה לקוביות בלתי תלויות, כי איבר השונות המשותפת $2\sigma_1^2$ כבר אינו מתאפס. שונויות מתחברות רק כשהשונות המשותפת מתאפסת.

  - id: W-0.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-7]
    prompt: >-
      תנו לכל טענה אחת משבע התוויות האפיסטמיות של הקורס (הגדרה, חוק אמפירי, משפט, הנחת מידול, קירוב, תצפית נומרית, שאלה פתוחה), ואמרו בכמה מילים מדוע.
      (א) "סטיית התקן היא השורש הריבועי של השונות."
      (ב) "על פני 64 זרעים, המעריך המותאם של הפיזור היחסי של ממוצע קוביות היה $-0.5007$, עם פיזור של $0.004$ מזרע לזרע."
      (ג) "המולקולות של גז דליל נעות באופן בלתי תלוי זו בזו."
      (ד) "השונות של סכום של $N$ משתנים מקריים בלתי תלויים, שלכל אחד מהם שונות $\sigma^2$, היא $N\sigma^2$."
      (ה) "סמוך לטמפרטורת החדר, ההתנגדות החשמלית של תיל נחושת עולה בכ-$0.4\%$ לכל קלווין."
      (ו) "$e^{-x} \approx 1 - x$ עבור $|x| \ll 1$."
      (ז) "מדוע היקום המוקדם היה במצב של אנטרופיה נמוכה כל כך."
      (ח) אילו שני שדות של מפרט מודל אומרים לכם היכן התשובות של המודל יהיו שגויות, והיכן המודל מפסיק לתאר דבר כלשהו?
    answer: >-
      (א) הגדרה; (ב) תצפית נומרית; (ג) הנחת מידול; (ד) משפט; (ה) חוק אמפירי; (ו) קירוב; (ז) שאלה פתוחה. (ח) "מוזנח" ו"אופני כשל".
    solution:
      - kind: reasoning
        text: >-
          (א) נותנת שם לגודל: היא שימושית או לא, לעולם לא נכונה או שגויה. (ד) נובעת באלגברה מהגדרת השונות ומהתאפסות השונויות המשותפות; שום מדידה אינה נכנסת אליה. (ו) היא שגיאה מבוקרת: האיבר הבא הוא $x^2/2$, ולכן הקירוב טוב עד כדי $0.5\%$ ב-$x = 0.1$ ונכשל כש-$|x|$ מסדר גודל של אחד.
      - kind: reasoning
        text: >-
          (ב) היא מה שחישוב הראה, ראיה לכך ש-(ד) מומשה נכון, אבל לא הסיבה ש-(ד) נכונה; יש לה פיזור בין זרעים, כפי שצריך להיות לתצפית נומרית. (ג) היא פישוט מכוון: בגז צפוף או בנוזל היא שגויה, והמודל אומר זאת. (ה) מסכמת מדידה, הייתה יכולה לצאת אחרת, ותקפה רק בתחום שבו נבדקה.
      - kind: reasoning
        text: >-
          (ז) אינה מיושבת; הקורס מסמן מקומות כאלה במקום להעמיד פנים שהוא עונה עליהם. (ח) השדה "מוזנח" מונה את הפיזיקה שנשארה בחוץ, ולכן היכן התשובות יהיו שגויות; "אופני כשל" מונה את התנאים שבהם המודל מפסיק להיות תיאור בכלל.
      - kind: result
        text: >-
          הגדרה, תצפית נומרית, הנחת מידול, משפט, חוק אמפירי, קירוב, שאלה פתוחה; ו"מוזנח" ו"אופני כשל" הם שני השדות שכדאי לקרוא ראשונים.

  - id: W-0.1-04
    level: basic
    objectives: [OBJ-0.1-4]
    prompt: >-
      ספר כימיה אומר שבבקבוק יש $2.0$ ליטרים של חנקן ב-$1.5$ אטמוספרות וב-$25\,^\circ\text{C}$, ומחשב עם $PV = nRT$.
      (א) המירו ל-SI ($1\,\text{atm} = 101\,325\,\text{Pa}$), ומצאו את מספר המולקולות $N$ מתוך $PV = Nk_BT$ ואת הכמות $n$ במולים. בדקו ש-$R = N_Ak_B$ נותן את אותו $nR = Nk_B$.
      (ב) באטמוספרה איזותרמית הצפיפות יורדת עם הגובה כמו $\exp(-mgh/k_BT)$. הראו שהמעריך הוא מספר טהור, וחשבו את הגורם עבור חנקן ($m = 28.0\,u$) ב-$h = 1000\,\text{m}$ וב-$T = 300\,\text{K}$, עם $g = 9.81\,\text{m/s}^2$.
      (ג) סטודנט כותב את הגורם כ-$\exp(-mgh/T)$. מה שגוי, במשפט אחד?
    answer: >-
      (א) $P = 1.52\cdot10^5\,\text{Pa}$, $V = 2.0\cdot10^{-3}\,\text{m}^3$, $T = 298.15\,\text{K}$; $N = 7.38\cdot10^{22}$, $n = 0.123\,\text{mol}$; $R = 8.316\,\text{J/(mol K)}$ מהקבועים האלה. (ב) $mgh/k_BT = 0.110$, גורם של $0.896$. (ג) $mgh/T$ הוא ביחידות של ג'אול לקלווין, לא מספר טהור, ולכן ל-$\exp$ שלו אין משמעות; $k_B$ הוא מה שממיר את הטמפרטורה לאנרגיה.
    solution:
      - kind: given
        text: >-
          $P = 1.5 \times 101\,325\,\text{Pa}$, $V = 2.0 \times 10^{-3}\,\text{m}^3$, $T = 273.15 + 25 = 298.15\,\text{K}$; $m = 28.0 \times 1.661\cdot10^{-27}\,\text{kg}$.
      - kind: law
        text: >-
          $PV = Nk_BT$, כאשר $N$ הוא מניין פשוט; $n = N/N_A$ ו-$R = N_Ak_B$. הארגומנט של פונקציה מעריכית חייב להיות חסר ממד.
      - kind: formula
        text: >-
          $N = \dfrac{PV}{k_BT} \qquad n = \dfrac{N}{N_A} \qquad \dfrac{\rho(h)}{\rho(0)} = \exp\left(-\dfrac{mgh}{k_BT}\right)$
      - kind: units
        text: >-
          $\text{Pa}\cdot\text{m}^3 = \text{J}$, ולכן $PV/(k_BT)$ הוא $\text{J}/((\text{J/K})\cdot\text{K})$: מספר טהור, כפי שמניין חייב להיות. $mgh$ הוא $\text{kg}\cdot\text{m/s}^2\cdot\text{m} = \text{J}$, ו-$k_BT$ בג'אולים: המעריך חסר ממד. $mgh/T$ היה ביחידות $\text{J/K}$.
      - kind: substitution
        text: >-
          (א) $P = 1.520\cdot10^5\,\text{Pa}$, $PV = 304.0\,\text{J}$, $k_BT = 4.117\cdot10^{-21}\,\text{J}$, $N = 7.38\cdot10^{22}$, $n = 7.38\cdot10^{22}/6.022\cdot10^{23} = 0.1226\,\text{mol}$. $N_Ak_B = 8.316\,\text{J/(mol K)}$ (כלומר הערך הטבלאי, $8.314$, בגבולות הדיוק של הקבועים האלה), ו-$nR = Nk_B = 1.020\,\text{J/K}$. (ב) $m = 4.65\cdot10^{-26}\,\text{kg}$, $mgh = 4.56\cdot10^{-22}\,\text{J}$, $k_BT = 4.14\cdot10^{-21}\,\text{J}$; היחס $0.110$, $e^{-0.110} = 0.896$.
      - kind: limit
        text: >-
          ב-$h = 0$ הגורם הוא $1$; כש-$T \to \infty$ הוא שואף ל-$1$ בכל גובה (התנועה התרמית גוברת על הכבידה), וככל ש-$m$ גדל הוא יורד מהר יותר (מולקולות כבדות נשארות למטה). נוסחה עם $mgh/T$ במעריך הייתה משנה את ערכה כשמצטטים את הטמפרטורה ביחידות אחרות, ושום ניבוי פיזיקלי אינו רשאי לעשות זאת.
      - kind: result
        text: >-
          (א) $N = 7.4\cdot10^{22}$ מולקולות, $n = 0.123\,\text{mol}$, ו-$nR = Nk_B$. (ב) הצפיפות בגובה $1\,\text{km}$ היא $0.896$ מערכה על פני הקרקע. (ג) המעריך חייב להיות מספר טהור; בלי $k_B$ הוא נושא $\text{J/K}$. הקורס הזה כותב את $k_B$ בכל פעם.

  - id: W-0.1-05
    level: mid
    objectives: [OBJ-0.1-2, OBJ-0.1-3]
    prompt: >-
      בשדה מגנטי, כל אחד מ-$N$ מומנטים אטומיים בלתי תלויים מכוון כלפי מעלה, $s = +1$, בהסתברות $p = 0.6$, ואחרת כלפי מטה, $s = -1$.
      (א) מצאו את התוחלת והשונות של $s$ אחד.
      (ב) עבור $N = 10^4$, מצאו את התוחלת ואת סטיית התקן של הסכום $M = \sum_i s_i$, ושל המגנוט למומנט $m = M/N$.
      (ג) מצאו את הפיזור היחסי $\sigma_M/\langle M\rangle$. כמה מומנטים יורידו אותו ל-$1\%$?
      (ד) מה קורה לפיזור היחסי ב-$p = \tfrac12$? מה מודד אז עד כמה $m$ יציב?
    answer: >-
      (א) $\mu_1 = 2p - 1 = 0.2$, $\sigma_1^2 = 4p(1 - p) = 0.96$. (ב) $\langle M\rangle = 2000$, $\sigma_M = 98.0$; $\langle m\rangle = 0.2$, $\sigma_m = 0.0098$. (ג) $0.049$; $N = 2.4\cdot10^5$. (ד) $\langle M\rangle = 0$, ולכן היחס אינו מוגדר; $\sigma_m = 1/\sqrt N$ עדיין דועך עם $N$, ומודדים אותו ביחס לסקאלה הטבעית של $m$, שהיא $1$.
    solution:
      - kind: given
        text: >-
          $s = +1$ בהסתברות $p = 0.6$, $s = -1$ בהסתברות $0.4$; $N = 10^4$; פיזור יחסי מבוקש $0.01$.
      - kind: law
        text: >-
          $\mu = \sum_k p_kx_k$, $\sigma^2 = \langle s^2\rangle - \mu^2$; עבור $N$ עותקים בלתי תלויים, $\langle M\rangle = N\mu_1$ ו-$\sigma_M = \sigma_1\sqrt N$; חלוקה ב-$N$ מחלקת את סטיית התקן ב-$N$.
      - kind: manipulation
        text: >-
          $\langle s\rangle = p - (1 - p) = 2p - 1$. מכיוון ש-$s^2 = 1$ תמיד, $\sigma_1^2 = 1 - (2p - 1)^2 = 4p(1 - p)$. אז $\sigma_M/\langle M\rangle = \sigma_1/(\mu_1\sqrt N)$, ששווה ל-$\varepsilon$ כאשר $N = (\sigma_1/\mu_1)^2/\varepsilon^2$.
      - kind: formula
        text: >-
          $\dfrac{\sigma_M}{\langle M\rangle} = \dfrac{\sigma_m}{\langle m\rangle} = \dfrac{2\sqrt{p(1 - p)}}{2p - 1}\,N^{-1/2}$
      - kind: limit
        text: >-
          ב-$p = 1$ כל המומנטים מכוונים כלפי מעלה: $\sigma_1 = 0$, ו-$M = N$ בדיוק. ב-$p = \tfrac12$ התוחלת היא אפס והמקדם מתבדר: יחס לתוחלת שהיא אפס אינו מודד דבר. אז משווים את $\sigma_m = 1/\sqrt N$ לטווח של $m$, מ-$-1$ עד $1$, והוא עדיין דועך כמו $N^{-1/2}$.
      - kind: units
        text: >-
          $s$, $M$ ו-$m$ הם מספרים טהורים.
      - kind: substitution
        text: >-
          (א) $0.2$ ו-$4 \times 0.6 \times 0.4 = 0.96$, $\sigma_1 = 0.980$. (ב) $10^4 \times 0.2 = 2000$; $0.980 \times 100 = 98.0$; $0.2$ ו-$0.0098$. (ג) $98.0/2000 = 0.049$; $N = (0.980/0.2)^2/10^{-4} = 24.0 \times 10^4$.
      - kind: result
        text: >-
          (א) $\mu_1 = 0.2$, $\sigma_1^2 = 0.96$. (ב) $M = 2000 \pm 98$, $m = 0.200 \pm 0.010$. (ג) $4.9\%$; $2.4 \times 10^5$ מומנטים עבור $1\%$: פי עשרים וארבעה מומנטים עבור פיזור קטן פי חמישה. (ד) כשהתוחלת היא אפס, מצטטים את $\sigma_m = N^{-1/2}$ ביחס לסקאלה של $m$ עצמו.

  - id: W-0.1-06
    level: mid
    objectives: [OBJ-0.1-5, OBJ-0.1-6]
    prompt: >-
      (א) לגליל מתכת רדיוס $r = 5.00\,\text{cm}$ וגובה $h = 10.0\,\text{cm}$. כתבו את הדיפרנציאל השלם של $V = \pi r^2h$, והשתמשו בו כדי להעריך את השינוי בנפח כש-$r$ גדל ב-$1.0\,\text{mm}$ ו-$h$ קטן ב-$2.0\,\text{mm}$. השוו לשינוי המדויק.
      (ב) חשבו את $(\partial V/\partial r)_h$, ואת $(\partial V/\partial r)_k$, כאשר $k = h/r$ הוא הצורה, המוחזקת קבועה. מדוע הן שונות?
      (ג) חשבו את האינטגרל של $\omega = x\,\mathrm{d}y - y\,\mathrm{d}x$ מ-$(R, 0)$ אל $(-R, 0)$ לאורך החצי העליון של המעגל ברדיוס $R$ סביב הראשית, לאורך החצי התחתון, ולאורך הקוטר. אחר כך הפעילו את מבחן הנגזרות המעורבות.
    answer: >-
      (א) $\mathrm{d}V = 2\pi rh\,\mathrm{d}r + \pi r^2\,\mathrm{d}h$, ולכן $\mathrm{d}V/V = 2\,\mathrm{d}r/r + \mathrm{d}h/h = 0.040 - 0.020$: $\mathrm{d}V = 1.57\cdot10^{-5}\,\text{m}^3$, לעומת $1.54\cdot10^{-5}\,\text{m}^3$ במדויק. (ב) $0.0314\,\text{m}^2$ ו-$0.0471\,\text{m}^2$: החזקת הצורה קבועה מאפשרת ל-$h$ לגדול יחד עם $r$. (ג) $\pi R^2$, $-\pi R^2$ ו-$0$; $\partial M/\partial y = -1 \ne \partial N/\partial x = +1$, ולכן $\omega$ אינה מדויקת.
    solution:
      - kind: given
        text: >-
          $r = 0.0500\,\text{m}$, $h = 0.100\,\text{m}$, $\mathrm{d}r = +1.0\cdot10^{-3}\,\text{m}$, $\mathrm{d}h = -2.0\cdot10^{-3}\,\text{m}$; ל-$\omega$ יש $M = -y$, $N = x$.
      - kind: law
        text: >-
          $\mathrm{d}f = (\partial f/\partial x)_y\,\mathrm{d}x + (\partial f/\partial y)_x\,\mathrm{d}y$; אינטגרל קווי מחשבים על ידי פרמטריזציה של המסלול והצבה; בתחום בלי חורים, תבנית מדויקת אם ורק אם $\partial M/\partial y = \partial N/\partial x$ בכל התחום.
      - kind: manipulation
        text: >-
          (ב) כש-$k = h/r$ קבוע, $V = \pi kr^3$ ו-$(\partial V/\partial r)_k = 3\pi kr^2 = 3\pi rh$, לעומת $(\partial V/\partial r)_h = 2\pi rh$. התוספת $\pi rh$ היא $\pi r^2\,(\partial h/\partial r)_k = \pi r^2k$: כשהצורה קבועה, גם הגובה גדל.
      - kind: manipulation
        text: >-
          (ג) על המעגל $x = R\cos t$, $y = R\sin t$, ו-$x\,\mathrm{d}y - y\,\mathrm{d}x = R^2(\cos^2 t + \sin^2 t)\,\mathrm{d}t = R^2\,\mathrm{d}t$. בחצי העליון $t$ רץ מ-$0$ עד $\pi$: $\pi R^2$. בחצי התחתון, דרך $(0, -R)$, $t$ רץ מ-$0$ עד $-\pi$: $-\pi R^2$. על הקוטר $y = 0$ ו-$\mathrm{d}y = 0$: אפס.
      - kind: formula
        text: >-
          $\dfrac{\mathrm{d}V}{V} = 2\,\dfrac{\mathrm{d}r}{r} + \dfrac{\mathrm{d}h}{h} \qquad \oint (x\,\mathrm{d}y - y\,\mathrm{d}x) = 2A$
      - kind: limit
        text: >-
          כש-$\mathrm{d}r$ ו-$\mathrm{d}h$ קטנים, השגיאה של ההערכה, שהיא מסדר שני ($\pi h\,\mathrm{d}r^2 + 2\pi r\,\mathrm{d}r\,\mathrm{d}h + \dots$), קטנה מהר יותר מההערכה עצמה. הלוך לאורך החצי העליון וחזרה לאורך התחתון, הלולאה נותנת $\pi R^2 - (-\pi R^2) = 2\pi R^2$, פעמיים השטח הכלוא, והיא מתאפסת כש-$R \to 0$.
      - kind: units
        text: >-
          $\mathrm{d}V$: $\text{m}\cdot\text{m}\cdot\text{m} = \text{m}^3$; $(\partial V/\partial r)$: $\text{m}^2$; $x\,\mathrm{d}y$: שטח.
      - kind: substitution
        text: >-
          (א) $V = \pi(0.05)^2(0.1) = 7.854\cdot10^{-4}\,\text{m}^3$; $\mathrm{d}V = 0.020\,V = 1.571\cdot10^{-5}\,\text{m}^3$. במדויק, $\pi(0.051)^2(0.098) - V = 1.539\cdot10^{-5}\,\text{m}^3$: ההערכה גבוהה ב-$2\%$. (ב) $2\pi(0.05)(0.1) = 0.0314\,\text{m}^2$; $3\pi(0.05)(0.1) = 0.0471\,\text{m}^2$.
      - kind: result
        text: >-
          (א) $\mathrm{d}V \approx 1.57\cdot10^{-5}\,\text{m}^3$ (עלייה של $2.0\%$), ובמדויק $1.54\cdot10^{-5}\,\text{m}^3$. (ב) $0.0314$ ו-$0.0471\,\text{m}^2$: ל"נגזרת לפי $r$" אין משמעות עד שאומרים מה מוחזק. (ג) שלושה מסלולים, שלוש תשובות, $\pi R^2$, $-\pi R^2$ ו-$0$; הנגזרות המעורבות נבדלות ב-$2$ בכל מקום, ולכן אין פונקציה פוטנציאלית, והמבחן אומר זאת לפני שבוחרים מסלול כלשהו.

  - id: W-0.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-6, OBJ-0.1-7]
    prompt: >-
      שפטו כל טענה, במשפט או שניים.
      (א) "חום נמדד בג'אולים, כמו אנרגיה פנימית, ולכן לבנה חמה מכילה כמות מוגדרת של חום."
      (ב) "גז עובר מחזור סגור וחוזר למצבו ההתחלתי. לכן $\oint \mathrm{d}U = 0$, והחום נטו שהוא קלט הוא אפס."
      (ג) "גז נדחס, ולכן $\mathrm{d}V < 0$, והעבודה $W$ שב-$\mathrm{d}U = \dbar Q + \dbar W$ שלילית."
      (ד) "ספר לימוד כותב $\Delta U = Q - W$ ומוצא $W = +150\,\text{J}$ בהתפשטות. במוסכמה של הקורס לאותו תהליך $W = -150\,\text{J}$, ואותו $\Delta U$."
      (ה) "הנגזרות המעורבות של $M\,\mathrm{d}x + N\,\mathrm{d}y$ שוות בנקודה $(1, 1)$, ולכן האינטגרל שלה זהה לאורך כל מסלול."
      (ו) "כתיבת $\mathrm{d}Q$ במקום $\dbar Q$ היא עניין של טיפוגרפיה."
    answer: >-
      (א) שגויה: חום הוא אנרגיה במעבר, פונקציית מסלול; ללבנה יש אנרגיה פנימית. (ב) שגויה: $\Delta U = 0$ נותן $Q = -W$, וסביב מחזור שסוגר שטח $W \ne 0$. (ג) שגויה: $W = -\int P\,\mathrm{d}V > 0$; אנרגיה נכנסה. (ד) נכונה. (ה) שגויה: הן צריכות להיות שוות בכל מקום, בתחום בלי חורים. (ו) שגויה: $\mathrm{d}Q$ טוען שקיימת פונקציית מצב $Q$, ואין כזו.
    solution:
      - kind: reasoning
        text: >-
          (א) הג'אול הוא יחידת האנרגיה, בכל צורה שהיא, ולכן יחידה משותפת אינה מוכיחה דבר. לפונקציית מצב יש ערך בכל מצב; לחום אין: את אותם שני מצבים אפשר לחבר בדרכים שמעבירות כמויות חום שונות (שלוש הדרכים הכמו-סטטיות של השיעור נותנות $2.193$, $2.886$ ו-$2.5$ ביחידות שלו). ללבנה יש אנרגיה פנימית; "חום" הוא שם לאנרגיה שחוצה את הגבול שלה.
      - kind: reasoning
        text: >-
          (ב) $\oint\mathrm{d}U = 0$ נכון, כי $U$ היא פונקציית מצב. החוק הראשון נותן אז $\oint\dbar Q = -\oint\dbar W = \oint P\,\mathrm{d}V$, השטח של המחזור במישור $P$–$V$, ששונה מאפס במחזור שסוגר שטח. מנוע הופך את החום נטו הזה לעבודה נטו.
      - kind: reasoning
        text: >-
          (ג) הסימן הולך אחרי האנרגיה, לא אחרי הנפח: $\dbar W = -P\,\mathrm{d}V$ ו-$\mathrm{d}V < 0$ נותנים $\dbar W > 0$. דחפתם את הבוכנה פנימה, ואנרגיה נכנסה אל הגז. (ד) במוסכמה האחרת $W'$ היא העבודה שהגז עושה, $W' = -W$; $\Delta U = Q - W' = Q + W$ בשני המקרים, ולכן שתי המוסכמות מתארות את אותה פיזיקה.
      - kind: reasoning
        text: >-
          (ה) המבחן מקומי, והמסקנה צריכה אותו בכל התחום. ל-$y\,\mathrm{d}x + xy\,\mathrm{d}y$, למשל, $\partial M/\partial y = 1$ ו-$\partial N/\partial x = y$, והן שוות רק על הישר $y = 1$; התבנית אינה מדויקת. (ו) הסמל נושא טענה: $\mathrm{d}Q$ היה הדיפרנציאל של פונקציה $Q$ של המצב, ואין כזו; $\dbar Q$ אומר "כמות קטנה של חום לאורך הצעד הזה".
      - kind: result
        text: >-
          רק (ד) נכונה. חום ועבודה הם פונקציות מסלול, ונכתבים עם $\dbar$; הסכום שלהם, $\mathrm{d}U$, מדויק. עבודה נספרת על המערכת, חיובית כשאנרגיה נכנסת; ומדויקות בודקים בכל מקום, לא בנקודה.

  - id: W-0.1-08
    level: bagrut
    objectives: [OBJ-0.1-1, OBJ-0.1-3, OBJ-0.1-7]
    prompt: >-
      חישובית. השתמשו במחברת המעבדה של השיעור, או בכל שפה שיש בה מחולל אקראי עם זרע.
      (א) עבור $N \in \{4, 16, 64, 256, 1024\}$, מדדו את הפיזור היחסי של הממוצע של $N$ קוביות הוגנות על פני $2000$ חזרות (לפחות $500$). התאימו את המעריך בצירים לוגריתמיים, ודווחו עליו. חזרו על כך עם כמה זרעים.
      (ב) בדקו את המקדם ולא רק את המעריך: הכפילו כל פיזור נמדד ב-$\sqrt N$ והשוו ל-$\sigma_1/\mu_1$. מדוע בדיקה של המעריך לבדו היא ראיה חלשה?
      (ג) תכננו והריצו את הניסוי המפריך לטענה "הממוצע מתייצב מפני שהטלות מאוחרות מפצות על מוקדמות": ייצרו $10^5$ הרצות של $100$ הטלות, השאירו את אלה שממוצע עשר ההטלות הראשונות שלהן גבוה מ-$4.5$, ומדדו את הממוצע של $90$ ההטלות הבאות באותן הרצות. דווחו עליו עם אי-ודאות, ואמרו מה הוא פוסל.
      (ד) חזרו על (א) עם הקובייה המוטה של שאלה 2 (שש בהסתברות $1/3$). איזה מספר השתנה, המעריך או המקדם, ומדוע הגזירה חוזה בדיוק את זה?
      (ה) נסחו דבר אחד שהתוצאות הנומריות שלכם אינן מוכיחות.
    answer: >-
      (א) בערך $-0.501$; על פני 64 זרעים $-0.5007$, עם פיזור של $0.004$ מזרע לזרע ($0.007$ עם $500$ חזרות). (ב) $0.488 \pm 0.004$, לעומת $\sigma_1/\mu_1 = 0.488$. (ג) כ-$2.5\%$ מההרצות נשארות, עם ממוצע פתיחה של $4.74$; הממוצע של $90$ ההטלות הבאות שלהן הוא $3.500 \pm 0.004$ במנה אחת ($3.5003 \pm 0.0005$ על פני 64 מנות): אין פיצוי. (ד) המעריך נשאר $-0.500$; המקדם יורד ל-$0.456$: לקובייה המוטה $\sigma/\mu = \sqrt{10/3}/4 = 0.4564$. (ה) למשל: שקוביות ממשיות בלתי תלויות, או שהחוק נכון; החוק הוא משפט, וההרצות הן ראיה.
    solution:
      - kind: given
        text: >-
          קובייה הוגנת: $\mu_1 = 7/2$, $\sigma_1^2 = 35/12$. קובייה מוטה: $\mu = 4$, $\sigma^2 = 10/3$. חמישה ערכים של $N$, $2000$ חזרות לכל אחד; $10^5$ הרצות של $100$ הטלות עבור (ג).
      - kind: law
        text: >-
          עבור דגימות בלתי תלויות $\sigma_{A_N} = \sigma_1/\sqrt N$, ולכן הפיזור היחסי של הממוצע הוא $(\sigma_1/\mu_1)N^{-1/2}$. אי-הוודאות היחסית של סטיית תקן שמוערכת מתוך $n$ מספרים היא בערך $1/\sqrt{2(n - 1)}$.
      - kind: formula
        text: >-
          $\ln\dfrac{\sigma_{A_N}}{\mu_1} = \ln\dfrac{\sigma_1}{\mu_1} - \tfrac12\ln N$
      - kind: reasoning
        text: >-
          (א, ב) ההתאמה מודדת את השיפוע של הישר הזה, והמקדם את הגובה שלו. מודלים שגויים רבים נותנים שיפוע קרוב ל-$-\tfrac12$: כל סכום של דגימות בלתי תלויות נותן אותו, תהיה ההתפלגות שלהן אשר תהיה, ולכן קובייה שגויה הייתה עוברת בדיקת שיפוע, וכך גם באג שמשנה את קנה המידה של כל דגימה, כי שינוי קנה מידה אינו משנה לא את השיפוע ולא את הגובה כשמחלקים את הפיזור בממוצע הנמדד. הגובה קובע את $\sigma_1/\mu_1$, שתלוי בקובייה; רק השוואה של הממוצע הנמדד ל-$3.5$ תופסת את שינוי קנה המידה.
      - kind: substitution
        text: >-
          (א, ב) עם 64 זרעים ו-$2000$ חזרות: מעריך $-0.5007$, פיזור מזרע לזרע $0.0039$; מקדם $0.4879$, פיזור $0.0041$, לעומת $\sqrt{35/12}/3.5 = 0.48795$. אי-הוודאות של כל פיזור היא $1/\sqrt{3998} = 1.6\%$, ושל השיפוע, על פני חמש הנקודות, כ-$0.004$, כפי שנצפה. (ג) עשר ההטלות הראשונות מסתכמות ב-$46$ או יותר בהסתברות $0.02525$ בדיוק; נמדד $0.0252$, וממוצע פתיחה $4.742$. $90$ ההטלות הבאות של ההרצות שנשארו: $3.5003$, עם פיזור של $0.0038$ בין מנות, ולכן $3.5003 \pm 0.0005$ על פני 64. (ד) מוטה: מעריך $-0.5004 \pm 0.0037$ (פיזור), מקדם $0.4557 \pm 0.0034$, לעומת $0.4564$.
      - kind: reasoning
        text: >-
          (ג) אילו הטלות מאוחרות היו מפצות, ממוצע ההטלות שאחרי פתיחה חמה היה נמוך מ-$3.5$. הממוצע שלהן הוא $3.5003 \pm 0.0005$: גירעון קטן אפילו כמו $0.002$ נפסל. לקוביות אין זיכרון; עודף הפתיחה מדולל, לא מוחזר. (ד) הגזירה השתמשה רק ב-$\mu_1$ וב-$\sigma_1$ של קובייה אחת: החלפת הקובייה משנה את $\sigma_1/\mu_1$, הגובה, ואילו $N^{-1/2}$ בא מכך שהשונויות מתחברות, והוא זהה לכל קובייה.
      - kind: limit
        text: >-
          ב-$N = 1$ הפיזור היחסי הוא המקדם עצמו, $0.488$, הפיזור של קובייה אחת. ככל שמספר החזרות גדל, הפיזור מזרע לזרע של המספרים המותאמים קטן כמו אחד חלקי השורש שלו; המעריך והמקדם אינם זזים.
      - kind: units
        text: >-
          ערכי הפנים, הפיזורים, היחסים והמעריך הם מספרים טהורים; זו הסיבה שבין קוביות משווים את הפיזור היחסי, ולא את המוחלט.
      - kind: result
        text: >-
          (א) $-0.501$, עם פיזור של $0.004$. (ב) $0.488$, כפי שנחזה; הגובה הוא המבחן האמיתי. (ג) $3.500 \pm 0.004$ אחרי פתיחה חמה: פיצוי נפסל. (ד) רק המקדם משתנה, ל-$0.456$. (ה) ההרצות בודקות את האלגברה ואת הקוד שלנו, לא את ההנחות שלנו: מחולל פסאודו-אקראי בנוי כך שהדגימות שלו מתנהגות כבלתי תלויות, ולכן הן אינן יכולות להראות שקוביות ממשיות בלתי תלויות, ותצפית נומרית לעולם אינה מוכיחה משפט.

  - id: W-0.1-09
    level: bagrut
    objectives: [OBJ-0.1-5, OBJ-0.1-6, OBJ-0.1-7]
    prompt: >-
      מול אחד של ארגון מתואר על ידי משוואת המצב והאנרגיה של ואן דר ואלס,
      $$P = \frac{Nk_BT}{V - Nb} - \frac{aN^2}{V^2} \qquad U = \frac32 Nk_BT - \frac{aN^2}{V}$$
      עם $Nk_B = 8.314\,\text{J/K}$, $aN^2 = 0.1355\,\text{Pa m}^6$ ו-$Nb = 3.20\cdot10^{-5}\,\text{m}^3$.
      (א) בעזרת $\mathrm{d}U = \dbar Q + \dbar W$, עם $\dbar W = -P\,\mathrm{d}V$ לשינוי כמו-סטטי, כתבו $\dbar Q = A\,\mathrm{d}T + B\,\mathrm{d}V$, והראו שהתבנית אינה מדויקת.
      (ב) הראו ש-$\dbar Q/T$ מדויקת, ומצאו את הפונקציה $S(T, V)$ שזה הדיפרנציאל שלה.
      (ג) הגז מתפשט באופן כמו-סטטי ב-$300\,\text{K}$ מ-$1.00$ ל-$2.00$ ליטרים. מצאו את $W$, $\Delta U$ ו-$Q$, עם הסימנים שלהם במוסכמה של הקורס, והשוו לגז אידיאלי.
      (ד) בדקו את התוצאות בגבול $a, b \to 0$.
    answer: >-
      (א) $\dbar Q = \tfrac32 Nk_B\,\mathrm{d}T + \dfrac{Nk_BT}{V - Nb}\,\mathrm{d}V$; $\partial A/\partial V = 0 \ne \partial B/\partial T = Nk_B/(V - Nb)$. (ב) $S = \tfrac32 Nk_B\ln T + Nk_B\ln(V - Nb) + C$, כאשר $C$ קבוע. (ג) $W = -1702\,\text{J}$, $\Delta U = +67.8\,\text{J}$, $Q = +1770\,\text{J}$; לגז אידיאלי $W = -1729\,\text{J}$, $\Delta U = 0$, $Q = +1729\,\text{J}$. (ד) כל תוצאה הופכת לזו של הגז האידיאלי.
    solution:
      - kind: given
        text: >-
          $Nk_B = 8.314\,\text{J/K}$, $aN^2 = 0.1355\,\text{Pa m}^6$, $Nb = 3.20\cdot10^{-5}\,\text{m}^3$; $T = 300\,\text{K}$, $V_1 = 1.00\cdot10^{-3}\,\text{m}^3$, $V_2 = 2.00\cdot10^{-3}\,\text{m}^3$.
      - kind: law
        text: >-
          $\mathrm{d}U = \dbar Q + \dbar W$, $\dbar W = -P\,\mathrm{d}V$, כאשר $W$ היא העבודה שנעשית על הגז. תבנית $A\,\mathrm{d}T + B\,\mathrm{d}V$ מדויקת כאשר $(\partial A/\partial V)_T = (\partial B/\partial T)_V$.
      - kind: manipulation
        text: >-
          (א) $\mathrm{d}U = \tfrac32 Nk_B\,\mathrm{d}T + (aN^2/V^2)\,\mathrm{d}V$, ולכן $\dbar Q = \mathrm{d}U + P\,\mathrm{d}V = \tfrac32 Nk_B\,\mathrm{d}T + \big[aN^2/V^2 + Nk_BT/(V - Nb) - aN^2/V^2\big]\mathrm{d}V$: איברי המשיכה מבטלים זה את זה. $A = \tfrac32 Nk_B$ אינו תלוי ב-$V$; $B = Nk_BT/(V - Nb)$ תלוי ב-$T$.
      - kind: manipulation
        text: >-
          (ב) $\dbar Q/T = \tfrac32 Nk_B\,\mathrm{d}T/T + Nk_B\,\mathrm{d}V/(V - Nb)$: עכשיו $A/T$ תלוי רק ב-$T$ ו-$B/T$ רק ב-$V$, שתי הנגזרות המעורבות הן אפס, ואינטגרציה של כל איבר נותנת את $S$. (ג) ב-$T$ קבוע: $W = -\int P\,\mathrm{d}V = -Nk_BT\ln\frac{V_2 - Nb}{V_1 - Nb} + aN^2\left(\frac{1}{V_1} - \frac{1}{V_2}\right)$, $\Delta U = aN^2\left(\frac{1}{V_1} - \frac{1}{V_2}\right)$, ו-$Q = \Delta U - W$.
      - kind: formula
        text: >-
          $Q = Nk_BT\ln\dfrac{V_2 - Nb}{V_1 - Nb} = T\,\Delta S$
      - kind: limit
        text: >-
          (ד) עם $a = b = 0$: $\dbar Q = \tfrac32 Nk_B\,\mathrm{d}T + (Nk_BT/V)\,\mathrm{d}V$, תבנית החום של השיעור; $S = \tfrac32 Nk_B\ln T + Nk_B\ln V$; ו-$W = -Nk_BT\ln(V_2/V_1)$, $\Delta U = 0$, $Q = -W$. כש-$V_1, V_2 \to \infty$ גם תיקוני ואן דר ואלס נעלמים: גז דליל הוא אידיאלי.
      - kind: units
        text: >-
          $aN^2/V^2$: $\text{Pa m}^6/\text{m}^6 = \text{Pa}$, לחץ, כפי שחייב להיות כדי שיהיה אפשר להחסיר אותו מלחץ; $aN^2/V$: $\text{Pa m}^3 = \text{J}$; $Nb$: $\text{m}^3$, מוחסר מנפח. $Nk_BT$ כפול לוגריתם: ג'אולים.
      - kind: substitution
        text: >-
          $Nk_BT = 2494.2\,\text{J}$; $\ln(1.968/0.968) = 0.7095$, ולכן $Nk_BT\ln(\dots) = 1769.7\,\text{J}$; $aN^2(1/V_1 - 1/V_2) = 0.1355 \times 500 = 67.75\,\text{J}$. $W = -1769.7 + 67.8 = -1702.0\,\text{J}$; $\Delta U = 67.8\,\text{J}$; $Q = 1769.7\,\text{J}$, $\Delta S = 5.90\,\text{J/K}$. לגז אידיאלי: $W = -2494.2\ln 2 = -1728.8\,\text{J}$.
      - kind: result
        text: >-
          (א) לא מדויקת: חום הוא פונקציית מסלול גם בגז הזה. (ב) $1/T$ הוא גורם אינטגרציה, ו-$S = \tfrac32 Nk_B\ln T + Nk_B\ln(V - Nb)$. (ג) $W = -1702\,\text{J}$ (הגז עושה עבודה על סביבתו, ולכן $W < 0$), $\Delta U = +67.8\,\text{J}$ (הרחקת המולקולות, שנמשכות זו לזו, אוגרת אנרגיה), $Q = +1770\,\text{J}$. הגז עושה עבודה קטנה ב-$27\,\text{J}$ מזו של גז אידיאלי, וקולט חום רב יותר ב-$41\,\text{J}$.

  - id: W-0.1-10
    level: bagrut
    objectives: [OBJ-0.1-1, OBJ-0.1-3]
    prompt: >-
      אי-שוויון צ'בישב אומר ש-$P(|A_N - \mu_1| \ge \varepsilon) \le \sigma_1^2/(N\varepsilon^2)$ עבור הממוצע של $N$ עותקים בלתי תלויים של כל גודל בעל שונות סופית.
      (א) עבור הממוצע של $100$ קוביות הוגנות, חסמו את $P(|A - 3.5| \ge 0.5)$. השוו להערכה הגאוסית $2\,\Phi(-\varepsilon/\sigma_A)$, כאשר $\Phi$ היא פונקציית ההתפלגות המצטברת של ההתפלגות הנורמלית הסטנדרטית, ולערך המדויק $0.0036$, שנמצא בקונבולוציה: ההתפלגות של סכום $100$ קוביות, מ-$99$ קונבולוציות של ההתפלגות של קובייה אחת עם עצמה.
      (ב) אתם רוצים ערובה שהממוצע של $N$ קוביות ינחת בטווח $0.1$ מ-$3.5$ בהסתברות של $99\%$ לפחות. כמה קוביות דורש אי-שוויון צ'בישב? כמה מציעה ההערכה הגאוסית? (במדויק, $1936$ קוביות מחטיאות בהסתברות $0.01001$, מעט מעל $1\%$; מכיוון שהסכום חי על סריג, הסתברות ההחטאה המדויקת אינה מונוטונית ב-$N$ בסביבה הזו.)
      (ג) מדוע לצטט חסם פסימי כל כך? מה מניחה כל אחת מההערכות?
      (ד) מה אומרות שתיהן כש-$N \to \infty$?
    answer: >-
      (א) חסם $0.117$; גאוסי $0.0034$; מדויק $0.0036$: החסם גדול פי $32$ מדי. (ב) צ'בישב: $29\,167$ קוביות; גאוסי: $1936$ קוביות, שבמדויק מחטיאות ב-$1.0015\%$ מהמקרים, קצת פחות מהערובה. (ג) צ'בישב צריך רק שונות סופית ותקף בכל $N$; הגאוסי צריך $N$ גדול מספיק למשפט הגבול המרכזי, והוא הכי פחות אמין בזנבות. (ד) שתיהן שואפות לאפס: חוק המספרים הגדולים החלש.
    solution:
      - kind: given
        text: >-
          $\mu_1 = 3.5$, $\sigma_1^2 = 35/12 = 2.917$, $\sigma_1 = 1.708$. (א) $N = 100$, $\varepsilon = 0.5$. (ב) $\varepsilon = 0.1$, הסתברות החטאה $\delta = 0.01$.
      - kind: law
        text: >-
          צ'בישב: $P(|A_N - \mu_1| \ge \varepsilon) \le \sigma_1^2/(N\varepsilon^2)$. משפט הגבול המרכזי: עבור $N$ גדול, $A_N$ קרוב לגאוסי עם סטיית תקן $\sigma_1/\sqrt N$.
      - kind: formula
        text: >-
          $N_{\mathrm{C}} = \dfrac{\sigma_1^2}{\delta\,\varepsilon^2} \qquad N_{\mathrm{G}} = \left(\dfrac{z\,\sigma_1}{\varepsilon}\right)^2,\quad 2\,\Phi(-z) = \delta$
      - kind: substitution
        text: >-
          (א) $2.917/(100 \times 0.25) = 0.117$. $\sigma_A = 0.1708$, $\varepsilon/\sigma_A = 2.93$, $2\,\Phi(-2.93) = 0.0034$. (ב) $2.917/(0.01 \times 0.01) = 29\,167$. $z = 2.576$, $(2.576 \times 1.708/0.1)^2 = 1935$, ולכן $1936$ קוביות. ב-$N = 29\,167$ הסתברות ההחטאה המדויקת היא כ-$10^{-23}$: הערובה מתקיימת במרווח עצום.
      - kind: reasoning
        text: >-
          (ג) צ'בישב אינו משתמש בשום דבר מלבד השונות, ולכן הוא חייב להתקיים גם עבור ההתפלגות הגרועה ביותר בעלת אותה שונות, והוא רופף עבור התפלגות שמתנהגת יפה. זה כוחו: הוא משפט בכל $N$, לכל התפלגות בעלת שונות סופית. ההערכה הגאוסית היא קירוב; כאן היא קרובה לזנב המדויק עד כדי $7\%$ ב-$N = 100$, אבל הדיוק שלה בזנב אינו מובטח, וב-$N = 1936$ היא מחטיאה את היעד בכחוט השערה ($0.010015$).
      - kind: limit
        text: >-
          (ד) ב-$\varepsilon$ קבוע, החסם $\sigma_1^2/(N\varepsilon^2)$ יורד כמו $1/N$, והזנב הגאוסי מהר יותר מכל חזקה של $N$; שניהם שואפים לאפס. ב-$N = 1$ החסם עבור $\varepsilon = 0.5$ הוא $11.7$, ואינו אומר דבר, כמו כל חסם על הסתברות שגדול מ-$1$.
      - kind: units
        text: >-
          $\sigma_1^2/(N\varepsilon^2)$ הוא יחס בין ריבועים של ערכי פנים: מספר טהור, כפי שהסתברות היא.
      - kind: result
        text: >-
          (א) $0.117 \ge 0.0036$; ה-$0.0034$ הגאוסי קרוב. (ב) $29\,167$ קוביות לערובה של צ'בישב, לעומת $1936$ להערכה הגאוסית. (ג) חסם שאינו מניח דבר מלבד שונות סופית הוא פסימי וודאי; הערכה שמניחה צורה היא חדה ומקורבת. (ד) שניהם נעלמים כש-$N \to \infty$: הממוצע מתכנס ל-$3.5$ בהסתברות, חוק המספרים הגדולים החלש.
challenge:
  - id: W-0.1-c1
    stars: 1
    objectives: [OBJ-0.1-2, OBJ-0.1-3]
    prompt: >-
      כדי לנקות ננו-חוט מזיהומים, מעבירים לאורכו קרן לייזר שוב ושוב. בכל סריקה, זיהום נשאר במקומו בהסתברות $1/3$; אחרת הוא מתקדם לאורך החוט מרחק $x$ בצפיפות $(1/a)\,e^{-x/a}$. לכן סריקה אחת מזיזה אותו מרחק שהצפיפות שלו היא
      $$p(x) = \frac13\,\delta(x) + \frac{2}{3a}\,e^{-x/a} \qquad x \ge 0$$
      (א) מצאו את התוחלת והשונות של המרחק שהזיהום עובר בסריקה אחת.
      (ב) מצאו את התוחלת ואת סטיית התקן של המרחק הכולל $d$ אחרי $36$ סריקות, ותנו צפיפות מקורבת עבור $d$.
      (ג) ההסתברות המדויקת ש-$d < 12a$ היא $0.0072$ (סופרים את הסריקות שבהן הזיהום זז, מספר בינומי, ומחברים את המרחקים האקספוננציאליים שלהן). השוו אותה לקירוב שלכם, והסבירו את ההבדל. מהי ההסתברות שהזיהום לא זז כלל?
      (ד) כמה סריקות יורידו את הפיזור היחסי של $d$ ל-$5\%$?
    answer: >-
      (א) $\langle x\rangle = \tfrac23 a$, $\langle x^2\rangle = \tfrac43 a^2$, $\operatorname{Var}(x) = \tfrac89 a^2$. (ב) $\langle d\rangle = 24a$, $\sigma_d = \sqrt{32}\,a = 5.66a$; $p(d) \approx e^{-(d - 24a)^2/(64a^2)}/\sqrt{64\pi a^2}$. (ג) הקירוב הגאוסי נותן $0.017$, פי $2.3$ יותר מדי: הצפיפות האמיתית אסימטרית, נחתכת ב-$d = 0$ ויש לה זנב ארוך לכיוון הערכים הגדולים, והגאוסי גרוע ביותר בזנבות. שהזיהום לא זז כלל: $3^{-36} = 6.7\cdot10^{-18}$. (ד) $800$ סריקות.
    solution:
      - kind: law
        text: >-
          $\langle f(x)\rangle = \int f(x)\,p(x)\,\mathrm{d}x$, כשפונקציית הדלתא תורמת $\tfrac13 f(0)$. עבור $n$ סריקות בלתי תלויות, תוחלות ושונויות מתחברות; עבור $n$ גדול, משפט הגבול המרכזי הופך את הסכום לקרוב לגאוסי.
      - kind: manipulation
        text: >-
          (א) פונקציית הדלתא יושבת ב-$x = 0$ ואינה מוסיפה דבר ל-$\langle x\rangle$ או ל-$\langle x^2\rangle$. עם $\int_0^\infty x\,e^{-x/a}\,\mathrm{d}x/a = a$ ו-$\int_0^\infty x^2\,e^{-x/a}\,\mathrm{d}x/a = 2a^2$: $\langle x\rangle = \tfrac23 a$, $\langle x^2\rangle = \tfrac43 a^2$, $\operatorname{Var}(x) = \tfrac43 a^2 - \tfrac49 a^2 = \tfrac89 a^2$. (ב) $\langle d\rangle = 36 \cdot \tfrac23 a = 24a$, $\operatorname{Var}(d) = 36 \cdot \tfrac89 a^2 = 32a^2$.
      - kind: formula
        text: >-
          $\dfrac{\sigma_d}{\langle d\rangle} = \dfrac{\sigma_1}{\mu_1}\,n^{-1/2} = \sqrt2\,n^{-1/2} \qquad n = \dfrac{2}{\varepsilon^2}$
      - kind: reasoning
        text: >-
          (ג) גאוסי עם תוחלת $24a$ ורוחב $5.66a$ שם הסתברות מתחת ל-$d = 0$, וזה בלתי אפשרי, והוא סימטרי, ואילו $d$ אינו יכול להיות שלילי ויש לו זנב אקספוננציאלי לכיוון הערכים הגדולים. קרוב למרכז הוא טוב, $0.50$ לעומת $0.53$ מדויק עבור $d < 24a$; בזנב של הערכים הקטנים הוא נותן הסתברות גדולה פי $2.3$ מדי. סכום של $36$ איברים הוא גאוסי במרכזו הרבה לפני שהוא גאוסי בזנבותיו.
      - kind: limit
        text: >-
          עם $n = 1$ הפיזור היחסי הוא $\sigma_1/\mu_1 = \sqrt{8/9}/(2/3) = \sqrt2 = 1.41$: סריקה אחת בלתי צפויה לגמרי. אילו הזיהום זז תמיד ($\tfrac13 \to 0$), סריקה אחת הייתה אקספוננציאלית, עם $\sigma_1/\mu_1 = 1$; הסיכוי להישאר במקום הופך כל סריקה לבלתי סדירה יותר.
      - kind: units
        text: >-
          $p(x)$ היא צפיפות, ביחידות $1/\text{m}$; $\langle x\rangle$ ו-$\sigma_d$ ביחידות של $a$; הפיזור היחסי הוא מספר טהור.
      - kind: substitution
        text: >-
          (ב) $\sqrt{32} = 5.657$. (ג) $(12a - 24a)/5.657a = -2.12$, $\Phi(-2.12) = 0.017$; $0.017/0.0072 = 2.3$. $(1/3)^{36} = 6.7\cdot10^{-18}$. (ד) $n = 2/0.0025 = 800$.
      - kind: result
        text: >-
          (א) $\tfrac23 a$ ו-$\tfrac89 a^2$. (ב) $d = 24a \pm 5.7a$, גאוסי בקירוב. (ג) ההערכה הגאוסית של זנב טועה פי $2.3$, כי סכום של $36$ איברים אסימטריים עדיין אסימטרי; ההסתברות להישאר במקום בכל $36$ הסריקות היא $7\cdot10^{-18}$. (ד) $800$ סריקות עבור $5\%$: הפיזור היחסי יורד כמו $n^{-1/2}$, מ-$\sqrt2$ בסריקה אחת.
    source:
      name: 'MIT 8.044 Statistical Physics I (OpenCourseWare)'
      year: 2013
      problem: 'Problem Set 3, Problem 1'
      url: 'https://ocw.mit.edu/courses/8-044-statistical-physics-i-spring-2013/e116907e0d1ad4e928e129bea7694a4e_MIT8_044S13_ps3.pdf'
      verified: '2026-11-20'
      adapted: true

  - id: W-0.1-c2
    stars: 2
    objectives: [OBJ-0.1-5, OBJ-0.1-6, OBJ-0.1-7]
    prompt: >-
      לקרינה תרמית בחלל יש לחץ שתלוי בטמפרטורה בלבד, $P = \tfrac13 aT^4$, ואנרגיה פנימית $U = aVT^4$, עם $a = 7.566\cdot10^{-16}\,\text{J m}^{-3}\,\text{K}^{-4}$. מעבירים את החלל מ-$(V_1, T_1)$ אל $(V_2, T_2)$, עם $V_2 = V_1/8$, לאורך שני מסלולים כמו-סטטיים: מסלול 1 דוחס אותו ב-$T_1$ עד $V_2$ ואחר כך מחמם אותו ב-$V_2$ קבוע עד $T_2$; מסלול 2 הולך לאורך העקומה $VT^3 = V_1T_1^3$.
      (א) מצאו את $T_2$, ואת העבודה שנעשית על הקרינה לאורך כל מסלול, סימבולית ועבור $V_1 = 1.00\,\text{L}$, $T_1 = 1000\,\text{K}$.
      (ב) הראו ש-$\dbar W = -P\,\mathrm{d}V$ אינה מדויקת במישור $(V, T)$.
      (ג) מצאו את החום שנקלט לאורך כל מסלול.
      (ד) הראו ש-$1/T$ הוא גורם אינטגרציה של $\dbar Q$, מצאו את $S(V, T)$, והסבירו את החום שמצאתם לאורך מסלול 2.
    answer: >-
      (א) $T_2 = 2T_1 = 2000\,\text{K}$; $W_1 = \tfrac13 aT_1^4(V_1 - V_2) = 0.221\,\mu\text{J}$, $W_2 = aT_1^4V_1\big[(V_1/V_2)^{1/3} - 1\big] = 0.757\,\mu\text{J}$. (ב) $\partial(0)/\partial V = 0$, אבל $\partial(-\tfrac13 aT^4)/\partial T = -\tfrac43 aT^3$. (ג) $\Delta U = 0.757\,\mu\text{J}$ בשני המסלולים; $Q_1 = 0.536\,\mu\text{J}$, $Q_2 = 0$. (ד) $\dbar Q/T = \mathrm{d}\big(\tfrac43 aVT^3\big)$; מסלול 2 שומר על $S$ קבוע, ולכן אינו מחליף חום: הוא אדיאבטה.
    solution:
      - kind: law
        text: >-
          $\dbar W = -P\,\mathrm{d}V$, העבודה שנעשית על הקרינה; $\mathrm{d}U = \dbar Q + \dbar W$. תבנית $A\,\mathrm{d}V + B\,\mathrm{d}T$ מדויקת כאשר $\partial A/\partial T = \partial B/\partial V$.
      - kind: manipulation
        text: >-
          (א) במסלול 2 $T = T_1(V_1/V)^{1/3}$, ולכן $T_2 = T_1 \cdot 8^{1/3} = 2T_1$. מסלול 1: רק הדחיסה עושה עבודה, בלחץ קבוע $P = \tfrac13 aT_1^4$: $W_1 = -\tfrac13 aT_1^4(V_2 - V_1)$. מסלול 2: $W_2 = -\int_{V_1}^{V_2}\tfrac13 aT_1^4(V_1/V)^{4/3}\,\mathrm{d}V = aT_1^4V_1^{4/3}\big[V^{-1/3}\big]_{V_1}^{V_2} = aT_1^4V_1\big[(V_1/V_2)^{1/3} - 1\big]$.
      - kind: manipulation
        text: >-
          (ב) $\dbar W = -\tfrac13 aT^4\,\mathrm{d}V + 0\,\mathrm{d}T$: הנגזרות המעורבות הן $-\tfrac43 aT^3$ ו-$0$. (ג) $\dbar Q = \mathrm{d}U - \dbar W = 4aVT^3\,\mathrm{d}T + aT^4\,\mathrm{d}V + \tfrac13 aT^4\,\mathrm{d}V = 4aVT^3\,\mathrm{d}T + \tfrac43 aT^4\,\mathrm{d}V$, גם היא אינה מדויקת ($4aT^3$ לעומת $\tfrac{16}{3}aT^3$). $\Delta U = a(V_2T_2^4 - V_1T_1^4) = aT_1^4V_1(16/8 - 1) = aT_1^4V_1$ בשני המסלולים, ו-$Q = \Delta U - W$.
      - kind: formula
        text: >-
          $\dfrac{\dbar Q}{T} = 4aVT^2\,\mathrm{d}T + \tfrac43 aT^3\,\mathrm{d}V = \mathrm{d}\!\left(\tfrac43 aVT^3\right)$
      - kind: limit
        text: >-
          כש-$V_2 \to V_1$ כל עבודה וכל חום שואפים לאפס. במסלול 2 $VT^3$ קבוע, ולכן גם $S = \tfrac43 aVT^3$ קבוע, ו-$Q_2 = \int T\,\mathrm{d}S = 0$: כל ה-$\Delta U$ נכנס כעבודה, $W_2 = \Delta U$, כפי שמצאנו. כש-$T \to 0$, $P$, $U$ ו-$S$ כולם נעלמים: חלל קר אינו מכיל קרינה.
      - kind: units
        text: >-
          $aT^4$: $\text{J m}^{-3}\,\text{K}^{-4}\cdot\text{K}^4 = \text{J/m}^3 = \text{Pa}$, לחץ וצפיפות אנרגיה בבת אחת ($P = u/3$); $aT^4V$: ג'אולים; $aVT^3$: $\text{J/K}$, אנטרופיה.
      - kind: substitution
        text: >-
          $aT_1^4 = 7.566\cdot10^{-4}\,\text{J/m}^3$. $W_1 = \tfrac13(7.566\cdot10^{-4})(0.875\cdot10^{-3}) = 2.21\cdot10^{-7}\,\text{J}$. $W_2 = \Delta U = (7.566\cdot10^{-4})(1.00\cdot10^{-3}) = 7.57\cdot10^{-7}\,\text{J}$. מסלול 1 בשני קטעים: הדחיסה האיזותרמית מוסרת $Q = -\tfrac43 aT_1^4(V_1 - V_2) = -8.83\cdot10^{-7}\,\text{J}$, והחימום ב-$V_2$ קולט $aV_2(T_2^4 - T_1^4) = 1.42\cdot10^{-6}\,\text{J}$; $Q_1 = 5.36\cdot10^{-7}\,\text{J}$.
      - kind: result
        text: >-
          (א) $T_2 = 2000\,\text{K}$; $W_1 = 0.221\,\mu\text{J}$, $W_2 = 0.757\,\mu\text{J}$: אותן נקודות קצה, עבודה שונה. (ב) $\dbar W$ אינה מדויקת. (ג) $Q_1 = 0.536\,\mu\text{J}$, $Q_2 = 0$, עם אותו $\Delta U = 0.757\,\mu\text{J}$. (ד) $1/T$ הופך את $\dbar Q$ למדויקת, $S = \tfrac43 aVT^3$, ומסלול 2, שלאורכו $S$ נשאר קבוע, הוא אדיאבטה; מסלול 1 קולט יותר חום ומקבל פחות עבודה, והחוק הראשון מאזן את שניהם.
